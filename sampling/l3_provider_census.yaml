    provider_name: Infura
    surface_type: provider_docs_tos_status
    public_endpoint: https://mainnet.infura.io
    public_replay_possible: requires_api_key
    docs_surface: []
    event_windows:
      tornado-cash-ofac-2022:
        docs_bracketed: false
        git_filter_file: false
        event_specific_artifact: false
        artifact_ref: docs/data-sources.md
        denominator_class: observability_gap
        rate_eligible: false
        denominator_reason: >
          Provider is in the future measurement frame, but v0.1 has no
