analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16.** Historical-baseline
  promotion of the candidate trigger
  candidate_triggers/teraexchange-cftc-bitcoin-swap-2015.yaml. First
  CFTC enforcement action that simultaneously (a) targets a
  CFTC-registered Swap Execution Facility and (b) concerns a
  Bitcoin-referenced derivative product. Establishes the load-bearing
  precedent for SEF Core Principles applying to crypto-asset
  derivative venues at the offramp_cex / regulated-venue compliance
  layer. Origin is human_reviewed because the YAML is authored by the
  maintainer workflow against captured primary sources (CFTC press
  release 7240-15 + the 9-page CFTC Order PDF, both retrieved
  2026-05-16). For a real release this DRYRUN marker would be replaced
  by the production-promotion stamp after an additional independent
  human audit.

  Empirical shape: comparison. One distinct observed_change layer
  (offramp_cex) is recorded, anchored on the regulator-side instrument
  itself. Admission tier is empirical_case (≥1 strong-attribution
  observed_change layer; attribution=direct because the regulator's
  own Order is the action being recorded).

  Brief-vs-source correction: the originating brief stated "TeraExchange
  paid $300K civil penalty." Direct inspection of the 2015-09-24 CFTC
  Order (9 pp., body_hash above) shows **no civil monetary penalty**
  was imposed in this action: the remedy is cease-and-desist plus
  undertakings. The $300K figure appears to conflate this matter with
  a separate 2019 CFTC settlement against the same SEF for trade-data
  reporting violations. The YAML records only what the captured Order
  actually orders.

  Related events: nydfs-bitlicense-2015-06 (structural sibling: same
  2015 calendar window, regulator-imposed compliance regime affecting a
  crypto market venue; BitLicense is broader state-level licensing, the
  TeraExchange Order is narrower per-venue federal-derivative
  enforcement) and cftc-v-ooki-dao-2022 (S3 CFTC enforcement sibling at
  the comparable_main_2017_present end of the spectrum, illustrating
  the seven-year arc from registered-SEF wash-trading to
  DAO-as-legal-person).

scoped_claim: |
  "CFTC In re TeraExchange LLC (Order issued 2015-09-24, Docket 15-33)
  is the first CFTC enforcement action against a CFTC-registered Swap
  Execution Facility offering a Bitcoin-referenced derivative product.
  The captured Order imposed a cease-and-desist plus binding
  undertakings on the SEF; the retained observation anchors only the
  regulator-side regime-change action at the offramp_cex layer. No
  civil monetary penalty was imposed in the 2015-09-24 Order, and no
  L0/L1/L3/L4-frontend/asset-onchain effects are claimed."

