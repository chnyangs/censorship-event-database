  This removes the lower-tier `attested_secondary` caveat and upgrades the
  observation attribution from plausible to direct.

  **ADMITTED 2026-05-31** (genuine review by human:xiangwen reviewing agent: TASK-2 lower-tier. §9-clear, well-documented deliberate restriction admitted at evidence_tier=attested_secondary (codebook §10) — single captured contemporaneous source; verified clean (no fabrication) in bulk adversarial-verify; filterable via evidence_tier.)
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources verified+captured, awaiting human admission)

  Thailand nation-state delisting mandate. IN SCOPE (codebook §9): the Thai SEC
  ordered all SEC-licensed digital-asset exchanges to delist / refuse listing of
  four token categories (meme, fan, NFT, exchange-issued) within 30 days — a
  deliberate delisting restriction on a regulated off-ramp surface. Distinct from
  the existing thailand-sec-binance-bybit-c-and-d-2021 event (which is a
  cease-and-desist against unlicensed exchanges, a different action). Not a dup.

  trigger.type=regulatory_enforcement (per §5.1: non-US national regulator
  administrative action that is not a network/payment-rail block), matching the
  convention of the two existing TH events (TH_SEC, TH_BOT). Attribution=direct
  per §1.5 reasoning (the regulator's own order names the prohibited categories
  and the regulated exchanges). Single observed_change layer (offramp_cex) ⇒
  empirical_shape=comparison, admission_tier=empirical_case.

  Source caveat: the captured evidence is the CoinDesk report (same-week,
  supporting_journalism) plus the official SEC news release captured during the
  2026-06-01 repair pass. The SEC PDF was not separately archived, but the
  replayable official SEC news page is sufficient for the trigger and observed
  exchange-listing restriction.

