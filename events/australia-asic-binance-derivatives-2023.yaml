  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase A.4 non_us_state discovery; lean run): authored by LLM agent without personally verifying Wayback/body_hash; origin=human_reviewed required by validator.

  comparison shape: 1 observed_change layer (offramp_cex load-bearing).
  Sibling event in the 2023 Binance multi-
  jurisdictional regulatory-pressure cascade alongside
  belgium-fsma-binance-cease-2023 (2023-06-23),
  germany-bafin-binance-licence-withdrawal-2023, and the structurally
  earlier 2021 wave (uk-fca-binance-markets-2021,
  netherlands-dnb-binance-warning-2021, malaysia-sc-binance-disable-2021,
  singapore-mas-binance-services-2021).

  Paper-relevant contrast: ASIC's mechanism is distinct from the
  FCA-2021 (warning + payment-rail-cascade), the FSMA-2023 (cease-and-
  repatriate), and the BaFin-2023 (licence-application withdrawal /
  refusal) patterns. ASIC exercises direct licence-cancellation
  authority over an Australian-incorporated AFSL holder (Oztures
  Trading Pty Ltd) following a targeted review that included retail /
  wholesale client classification. The shutdown is therefore directly
  regulator-compelled at the AFSL level, comparable in legal mechanism to
  a BaFin licence refusal but narrower in scope (derivatives only; Binance
  Australia's spot operations under separate digital-currency-exchange registration
  with AUSTRAC were not cancelled by this action).

  Cross-stratum cousin: binance-4framework-2023 (US, S3) — the ASIC
  Australian derivatives action sits in the same 2023 Binance
  regulatory-pressure cohort as the US DOJ/SEC/CFTC/FinCEN settlement,
  illustrating the multi-jurisdictional pile-on phase of Binance's
  regulatory trajectory.

  Remaining caveat: this event does not retain a replayable Binance-owned
  AU-geo frontend notice, so no L4 observed_change is claimed.

scoped_claim: |
  "ASIC media release 23-091MR of 2023-04-06 cancelled the AFSL of
  Oztures Trading Pty Ltd (trading as Binance Australia Derivatives)
  and directly compelled the shutdown of Binance's Australian derivatives
  operations for opening or increasing positions from 2023-04-14
  with transitional close-out through 2023-04-21. Primary
  observational axis is offramp_cex at the Binance-Australia-derivatives
  cohort level. The row does not claim ISP-level connectivity blocking,
  a measured Binance AU-geo frontend banner, on-chain asset freeze, or
  cancellation of Binance Australia's separate spot-exchange AUSTRAC
  registration."

