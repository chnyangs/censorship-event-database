analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase A.4 non_us_state discovery; lean run): authored by LLM agent without personally verifying Wayback/body_hash; origin=human_reviewed required by validator. Real release must replace this DRYRUN marker with a human-verified audit after pinning real archive anchors.

  comparison shape: 2 observed_change layers (offramp_cex load-bearing,
  L4 frontend secondary). Sibling event in the 2023 Binance multi-
  jurisdictional regulatory-pressure cascade alongside
  belgium-fsma-binance-cease-2023 (2023-06-23),
  germany-bafin-binance-licence-withdrawal-2023, and the structurally
  earlier 2021 wave (uk-fca-binance-markets-2021,
  netherlands-dnb-binance-warning-2021, malaysia-sc-binance-disable-2021,
  singapore-mas-binance-services-2021).

  Paper-relevant contrast: ASIC's mechanism is distinct from the
  FCA-2021 (warning + payment-rail-cascade), the FSMA-2023 (cease-and-
  repatriate), and the BaFin-2023 (licence-application withdrawal /
  refusal) patterns. ASIC exercises direct licence-cancellation
  authority over an Australian-incorporated AFSL holder (Oztures
  Trading Pty Ltd) following a targeted review that found regulatory
  classification fraud (~500 retail clients wrongly classified as
  wholesale). The shutdown is therefore directly regulator-compelled at
  the AFSL level, comparable in legal mechanism to a BaFin licence
  refusal but narrower in scope (derivatives only; Binance Australia's
  spot operations under separate digital-currency-exchange registration
  with AUSTRAC were not cancelled by this action).

  Cross-stratum cousin: binance-4framework-2023 (US, S3) — the ASIC
  Australian derivatives action sits in the same 2023 Binance
  regulatory-pressure cohort as the US DOJ/SEC/CFTC/FinCEN settlement,
  illustrating the multi-jurisdictional pile-on phase of Binance's
  regulatory trajectory.

  DRYRUN caveats: trigger primary citation (ASIC media release 23-079MR)
  is asserted with a 2023-calendar-folder Wayback pointer; pinned
  snapshot timestamp and body_hash capture are deferred to the
  human-audit pass. For non-DRYRUN release, capture body_hash +
  body_path for: (1) ASIC media release 23-079MR permalink, (2) the
  ASIC targeted-review report findings (referenced in the media release),
  (3) the binance.com Australia-geo derivatives-shutdown notice /
  regional announcement page if recoverable from Wayback. Marked
  evidence_use=contextual_unarchived on all citations to flag the
  unarchived state per validator policy.

scoped_claim: |
  "ASIC media release 23-079MR of 2023-04-06 cancelled the AFSL of
  Oztures Trading Pty Ltd (trading as Binance Australia Derivatives)
  after a targeted review found ~500 retail clients had been wrongly
  classified as wholesale clients, directly compelling the shutdown of
  Binance's Australian derivatives operations (effective 2023-04-14
  with transitional close-out through 2023-04-21). Primary
  observational axis is offramp_cex at the Binance-Australia-derivatives
  cohort level; secondary L4-frontend response (AU-geo derivatives-
  shutdown banners on binance.com) attached with plausible attribution.
  The row does not claim ISP-level connectivity blocking, on-chain
  asset freeze, or cancellation of Binance Australia's separate spot-
  exchange AUSTRAC registration."

