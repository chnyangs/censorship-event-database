    status: not_applicable
    note: |
      SFC administrative warning + HKPF arrests; not an ISP/DNS-level
      network block. HK does not operate a mainland-style network
      filter against unlicensed crypto frontends.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Administrative enforcement against an unlicensed VATP does not
      map to Ethereum PBS relay filtering or other L1 consensus
      primitives.
  - layer: l3_rpc
    status: not_applicable
    note: |
      L3 RPC layer is not implicated by the SFC JPEX enforcement
      action.
  - layer: l4_frontend
    status: not_measured
    note: |
      JPEX restricted HK user access on its frontend in the days
      following the 2023-09-13 SFC warning (raised withdrawal fees
      to 999 USDT, then suspended HK user withdrawals). Wayback-diff
      evidence of jp-ex.io HK-vantage snapshots bracketing
      2023-09-13 is not yet attached; pending human audit.
  - layer: asset_onchain
    status: not_applicable
    note: |
      No stablecoin admin-method freeze attaches to the SFC JPEX
      action. Asset-onchain layer not implicated.
  - layer: offramp_cex
    status: partially_measured
    scope:
      - jpex
    note: |
      JPEX HK users were unable to withdraw funds following the SFC
      warning; the platform first raised withdrawal fees to 999 USDT
      and then effectively halted HK user withdrawals. SFC public
      statement and contemporaneous journalism corroborate the
      offramp-disruption pattern. HK$1.6B+ in losses reported across
      2,500+ victims in the initial reporting window. Sources
      contextual_unarchived for this draft; human audit will pin
      Wayback snapshots.
