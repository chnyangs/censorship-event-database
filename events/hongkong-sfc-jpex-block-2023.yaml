analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17**

  Non-US national regulator administrative enforcement: HK SFC's
  2023-09-13 public warning statement on JPEX as an unlicensed VATP
  under the new (2023-06-01) VATP licensing regime, followed by HKPF
  "Operation Iron Gate" arrests beginning 2023-09-18. Reported losses
  exceeded HK$1.6 billion across 2,500+ victims; this is the largest
  HK crypto enforcement case in 2023 and is widely credited with
  accelerating SFC enforcement posture under the VATP regime.

  trigger.type=regulatory_enforcement applied per codebook §5.1: HK
  SFC is a non-US national regulator and the 2023-09-13 statement is
  an administrative enforcement act (public warning + AMLO predicate
  + police referral), not a network/payment-rail block. Research
  stratum S4_nation_state per the codebook §5.2 stratum-actor map.

  Empirical shape is `comparison`: one observed_change layer —
  offramp_cex HK user-funds freeze (direct attribution; SFC named
  JPEX). The l4_frontend HK user-access restriction layer is
  recorded as a coverage_gap per codebook §2 (Kazakhstan precedent)
  because no Wayback-pinned HK-vantage snapshot of jp-ex.io has
  been captured for this draft, even though contemporaneous
  journalism describes the withdrawal-halt frontend behaviour.

  All sources in this draft are `contextual_unarchived` per the
  evidence_use convention; status remains `draft` (origin:
  agent_draft) pending human audit and Wayback pinning.

