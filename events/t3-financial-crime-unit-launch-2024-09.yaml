analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission).

  The 2024-09-10 launch of the T3 Financial Crime Unit (T3 FCU) by Tether,
  TRON and TRM Labs — a first-of-its-kind private-sector consortium that
  executes USDT-on-TRON enforcement freezes (via Tether's blacklist admin
  function) at law-enforcement direction. The launch announcement reports
  an initial aggregate of "over USDT 12 million" frozen (blackmail scam,
  investment-fraud scheme, and others).

  Why §9 INCLUDE: T3 FCU is the institutional vehicle through which
  deliberate issuer-side asset freezes are executed — a corporate freeze
  mechanism (codebook §9 INCLUDE: issuer freezes). The launch operationalizes
  a standing private-enforcement freeze capability over USDT.

  Why S5_corporate: a private issuer/blockchain/analytics consortium
  unilaterally standing up a freeze capability is a corporate policy action.

  Why comparison / empirical_case: one strong-attribution (plausible)
  observed_change layer (asset_onchain). Other layers scope-mismatched.

  ANTI-FABRICATION / §1.6: the freeze effect is genuinely on-chain (USDT
  blacklist), but this draft pins NO specific freeze transaction hash and
  claims NO specific frozen addresses — only the issuer-stated aggregate
  ("over USDT 12 million") is recorded. asset_onchain is coded not_measured
  with the primary_onchain tx_hash floor explicitly deferred for the draft;
  no tx_hash is invented. A human audit may attach representative T3/Tether
  blacklist freeze txs before any promotion, or re-route per §1.6.

  Scope note: subsequent T3 aggregate milestones ($100M+, $250M+, $300M+,
  $450M+) are NOT claimed here (their sources were not captured for this
  event); only the launch-day aggregate is recorded.

  Sources verified via WebSearch + captured 2026-05-31 (official Tether.io
  announcement primary_corporate + CoinDesk semi-primary, body_hash-pinned;
  Tether.io grep-confirmed for T3 FCU establishment and the "over USDT 12
  million" launch figure; no fabrication).

