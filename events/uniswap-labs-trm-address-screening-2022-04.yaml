coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The action is application/frontend wallet screening at the Uniswap
      Labs App, not DNS, routing, or ISP-level blocking.
  - layer: l1_consensus
    status: not_applicable
    chain: ethereum
    note: |
      The Uniswap Protocol smart contracts on Ethereum remained reachable;
      Uniswap Labs' own post distinguishes its control over the app from
      the decentralized protocol. No consensus-layer restriction is claimed.
  - layer: l3_rpc
    status: not_applicable
    note: |
      The action is not a JSON-RPC provider block. Later Tornado Cash L3
      reactions are tracked under separate Infura/Alchemy/Cloudflare rows.
  - layer: l4_frontend
    status: measured
    scope:
      - app.uniswap.org
    note: |
      Load-bearing layer. Uniswap Labs' own blog states that wallet
      addresses associated with illicit activity were blocked from
      interacting with the Uniswap Labs App through a TRM Labs screening
      integration. The Block's 2022-04-22 memento corroborates the same
      app-frontend restriction and the frontend/protocol split.
  - layer: asset_onchain
    status: not_applicable
    note: |
      No token issuer freeze or contract-level blacklist is invoked by this
      frontend policy.
  - layer: offramp_cex
    status: not_applicable
    note: |
      Uniswap Labs is a DEX frontend operator; this row does not claim a
      centralized exchange account, custody, withdrawal, or fiat off-ramp
      restriction.

