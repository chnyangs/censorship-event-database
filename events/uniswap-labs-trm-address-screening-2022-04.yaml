analysis_notes: |
  **SCOPE-CORRECTED 2026-06-05** (quality-loop repair; no new human
  admission claim): the legacy row `uniswap-balancer-tornado-frontend-
  block-2022-08` mixed a primary Uniswap Labs April 2022 address-screening
  source with August 2022 Tornado/Balancer cascade reporting. The primary
  Uniswap Labs source supports a narrower event: Uniswap Labs' own
  2022-04-19 TRM address-screening policy for the Uniswap Labs App. It does
  not support a first-party Balancer claim and does not itself establish a
  new 2022-08-12 Tornado-specific Uniswap trigger. This repair therefore
  drops Balancer from the load-bearing observation set, changes the trigger
  date to the source-supported 2022-04-19 Uniswap Labs post, and retains
  the April 2022 The Block memento as contemporaneous corroboration.

  **PROMOTED 2026-05-21** (legacy C-5 audit history retained for provenance):
  the admitted row's Uniswap leg was anchored on the Uniswap Labs blog and
  The Block; the Balancer leg had only semi-primary reporting and is no
  longer load-bearing after this scope correction.

scoped_claim: |
  "Uniswap Labs' 2022-04-19 Address Screening Update documents an
  L4-only corporate-policy change: the Uniswap Labs App blocked wallet
  addresses associated with illicit activity, using TRM Labs screening,
  while the underlying Uniswap Protocol remained reachable through other
  portals or direct contract interaction. The row does not claim a
  2022-08-12 Tornado-specific Uniswap action, a Balancer Labs action,
  network/RPC censorship, consensus-layer effect, asset freeze, or CEX
  off-ramp restriction."

