  - layer: l4_frontend
    status: not_applicable
    note: |
      DAC8 imposes tax due diligence and reporting obligations on RCASPs,
      not frontend domain takedowns. Individual RCASPs may surface
      tax-residency / self-certification prompts in their UI but no
      canonical frontend-level domain effect is implicated by the
      directive itself.
  - layer: asset_onchain
    status: not_applicable
    note: |
      DAC8 does not impose any asset-layer freeze, blacklist, or issuer
      action. The directive is metadata-collection-only at the RCASP
      transaction-reporting level (same posture as the CARF parent);
      the underlying assets and on-chain protocols are not directly
      targeted.
  - layer: offramp_cex
    status: measured
    scope: [eu_rcasp_ecosystem]
    note: |
      Class-level offramp_cex obligation on EU-operating RCASPs takes
      effect 2026-01-01 with first reporting cycle 2027. As of the
      2023-10-17 trigger date and the 2026-05-17 authoring date, no
      RCASP-level behavioral change has materialized: the directive is
      future-effective at the EU level and pending Member-State
      transposition (deadline 2025-12-31). Coded partially_measured —
      anchored by the EUR-Lex primary-legal artifact documenting the
      class-level scope — to support the observed_no_change row;
      revisit when 2027 first-cycle reports surface.
