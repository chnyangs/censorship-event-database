  null_event documenting the EU Council's 2023-10-17 adoption of
  Directive (EU) 2023/2226 — DAC8 — the EU-level transposition of the
  OECD Crypto-Asset Reporting Framework (oecd-carf-2022). DAC8 extends
  the EU's automatic exchange of information (AEOI) regime under
  Directive 2011/16/EU to crypto-asset transactions, imposing
  CARF-aligned due diligence and reporting obligations on
  EU-operating RCASPs. Member-State transposition deadline 2025-12-31;
  application 2026-01-01; first reporting cycle 2027-01-01 to
  2027-09-30 covering 2026 calendar-year transactions.

  Structural contribution to the dataset: DAC8 is the EU-level
  implementation child of CARF (oecd-carf-2022), companion to MiCA
  (eu-mica-2023) and TFR Recast (eu-tfr-recast-2023) in the EU's
  supranational crypto-regulatory triad. Where MiCA establishes
  licensing / capital / custody, TFR Recast layers the zero-threshold
  Travel Rule, DAC8 layers the tax-reporting / AEOI metadata
  obligation. The three EU instruments together transpose three
  distinct supranational parents (CARF, FATF R.15, OECD CRS) onto the
  same EU-27 RCASP / CASP population.

  Empirical_shape = null_event (0 observed_change layers): DAC8 is
  future-effective (2026-01-01 application) and class-level; no
  observed RCASP-level behavior change has materialized as of the
  2026-05-17 authoring date. admission_tier = null_case (0
  strong-attribution observed_change layers); analysis_use =
  comparable_analysis as a denominator control for the supranational
  regulatory-substrate axis. target.enumeration = subset per codebook
  §7 (no class_level value; rationale documented in
  target.enumeration_note). trigger.type = supranational_regulation
  per codebook §5.1 (EU regulation, non-sanctions). Codebook compliance:
  §5.1 trigger.type, §5.2 stratum-actor map (supranational_regulation →
