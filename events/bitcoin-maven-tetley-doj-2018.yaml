analysis_notes: |
  **NEW EVENT AUTHORED -- AGENT_DRAFT 2026-05-31**. Created from the P4
  census-gap queue after official DOJ source identification and Wayback capture.
  The event remains `status=draft` and `origin=agent_draft`; automation must not
  promote it to an admitted paper row without human admission review.

  Inclusion rationale: this is the post-2017 counterpart to the admitted Shrem /
  Faiella and Powell individual/exchange MSB enforcement rows. It is not a fraud
  platform collapse or Ponzi prosecution: the modeled surface is an individual
  bitcoin-for-cash off-ramp service that DOJ says operated without MSB
  registration and AML controls. The row intentionally does not treat
  LocalBitcoins as the censored platform, because the DOJ action targets Tetley's
  individual service.

  Modeling rationale: trigger.type=doj_indictment is the closest existing S3
  enum used by peer historical MSB-enforcement rows, even though the clean public
  anchor is the 2018-07-09 sentencing press release. The observed_change is
  single-layer `offramp_cex` with direct attribution to the sentencing/forfeiture
  endpoint. L0/L1/L3/L4/asset_onchain are not_applicable.

scoped_claim: |
  "On 2018-07-09 DOJ USAO-CDCA announced that Theresa Lynn Tetley, a/k/a
  'Bitcoin Maven,' was sentenced for operating an unlicensed bitcoin-for-cash
  money-transmitting business advertised on LocalBitcoins and for money
  laundering. This draft models only the termination of Tetley's individual
  P2P off-ramp service; it does not claim a LocalBitcoins platform shutdown,
  frontend block, asset freeze, or consensus/RPC effect."

