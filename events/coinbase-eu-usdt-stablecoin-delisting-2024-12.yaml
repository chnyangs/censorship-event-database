analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: MiCA-driven Coinbase
  EU USDT delisting; captured source supports the delisting action; attribution downgraded
  direct->plausible to match evidence floor — semi-primary only, no pinned primary corporate doc;
  passes strict admission validation).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission).

  Coinbase Europe / Coinbase Germany's 2024-12-13 delisting of six
  non-MiCA-compliant stablecoins for EEA retail users — USDT, PAX, PYUSD,
  GUSD, GYEN, and DAI ("restricted from trading and receiving" from Dec.
  13) — under the EU MiCA stablecoin rules (full exchange implementation by
  2024-12-31). USDC and EURC (MiCA-compliant) remained supported. The plan
  was announced 2024-10-04.

  Why §9 INCLUDE: an exchange delisting that denied EEA retail users access
  to these stablecoin markets on Coinbase (codebook §9 INCLUDE: exchange
  delisting / geofence). MiCA-compliance-driven — a regulation-induced
  corporate restriction, but the actor executing the denial is Coinbase
  (S5), distinct from the MiCA framework event itself (eu-mica-2023, S6).

  Why S5_corporate: Coinbase's own delisting/geofence decision is a
  corporate policy action (the regulatory framework is captured separately
  at eu-mica-2023 / mica-l2-esma-eba-rts-2024, listed as related).

  Why comparison / empirical_case: one strong-attribution (direct)
  observed_change layer (offramp_cex). Other five layers scope-mismatched.

  Why attribution=direct: Coinbase's own announced policy with an explicit
  stated MiCA-compliance rationale (unlike a no-reason delisting).

  jurisdiction=EU: the action is EEA-wide (EEA ≈ EU + EFTA states); EU is
  the closest controlled-vocab enum for the MiCA single-market scope.

  asset_onchain routing per §1.6: these stablecoins are independent issuer
  assets Coinbase cannot freeze on-chain; the effect is an EEA-retail
  off-ramp market removal, carried at offramp_cex (cf. binance-busd-wind-
  down-2024). No tx_hash claimed.

  Sources verified via WebSearch + captured 2026-05-31 (Decrypt +
  Cointelegraph, body_hash-pinned; Decrypt grep-confirmed for "Starting
  Dec. 13", the six-asset set, and the MiCA rationale; no fabrication).

