analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN Wave 2.2D 2026-05-17**: authored by
  LLM agent (origin=agent_draft, status=draft) without personally
  verifying Wayback / body_hash anchors for Treasury press release
  JY2757 or the Chainalysis / TRM Labs post-action analyses. The
  five TRON USDT addresses identified by the refresh, per-address
  Tronscan addBlackList tx_hashes, and any per-event Tether
  confirmation statement are deferred to human audit.

  Comparison documenting the December 2024 OFAC SDN refresh of the
  Sa'id al-Jamal IRGC-QF-backed Houthi financial-facilitation
  network. Pairs with the 2023-10 Hamas Buy Cash MSB designation
  (`ofac-hamas-buy-cash-msb-2023-10`), the 2024-01 Hamas / IRGC-QF
  joint virtual-currency procurement designation
  (`ofac-hamas-irgc-virtual-currency-network-2024-01`), and the
  2024-03 Hamas Gaza Now designation
  (`ofac-hamas-gaza-now-2024-03`) as a sibling action in the
  post-Oct 7 Iran-aligned terrorism-financing sanctions arc.

  **Attribution rationale (§1.2)**: condition (A) holds — OFAC
  names specific USDT-on-TRON addresses. Condition (B) — explicit
  Tether public confirmation of a freeze on the named SDN addresses
  within the 24h compliance window — was NOT confirmed in agent
  research. Per codebook §8.4 (default to conservative), the
  asset_onchain row is coded `plausible` and flagged for human
  review; if a Tether press statement is located, elevate to
  `direct`. Trigger-date discrepancy (task brief 2024-12-19 vs.
  Treasury public release 2024-12-19) is also flagged for human
  audit.

  Empirical shape is `comparison`: one observed_change layer
  (asset_onchain, plausible) plus an observed_no_change row at
  offramp_cex.

scoped_claim: |
  "The December 2024 OFAC SDN refresh of the Sa'id al-Jamal
