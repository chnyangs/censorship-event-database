analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources
  verified+captured, awaiting human admission).

  comparison documenting the State Bank of Pakistan's 2018-04-06 BPRD Circular
  No. 03 of 2018 barring all banks, DFIs, microfinance banks and payment-system
  operators from processing or facilitating virtual-currency/ICO-token
  transactions. A nation-state banking-rail prohibition in the same family as
  India RBI 2018 and Nigeria CBN 2021.

  Per codebook §5.1, trigger.type=nation_state_block is the canonical fit: the
  action is a central-bank payment-rail prohibition severing fiat on/off-ramps.
  Per §5.2, research_stratum=S4_nation_state is permitted.

  Per §9 inclusion boundary: this is in scope — a deliberate debanking /
  payment-rail prohibition against the legitimate Pakistani crypto ecosystem,
  not a fraud prosecution or soft advisory. (A separate SBP public consumer
  notice on virtual-currency risks exists but is not the load-bearing
  instrument here; the binding circular is C3 of 2018.)

  Why offramp_cex direct: the circular text itself mandates the banking/payment
  cut-off (§1 direct rule — the named actor's instrument names the regulated
  banking sector as the acted-upon party). Why L0/L1/L3/asset_onchain
  not_applicable: banking-rail action, pre-Merge/pre-Flashbots era, no
  issuer-side on-chain freeze.

  Why temporal_tier=comparable_main_2017_present / analysis_use=
  comparable_analysis: 2018-04-06 sits in the 2017+ comparable corpus.

scoped_claim: |
  "SBP BPRD Circular No. 03 of 2018 (2018-04-06) barred regulated banks, DFIs,
  microfinance banks and payment-system operators in Pakistan from processing or
  facilitating virtual-currency/ICO-token transactions, severing the PKR fiat
  banking/payment rail for the Pakistani crypto ecosystem. The offramp_cex layer
  carries the load-bearing direct-attribution observation at class level."

