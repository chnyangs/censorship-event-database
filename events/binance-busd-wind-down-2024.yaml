analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17** (Phase E follow-on to
  paxos-busd-nydfs-minting-stop-2023): authored by LLM agent without
  personally verifying Wayback / body_hash anchors; real release must
  replace this DRYRUN marker with a human-verified audit after pinning
  real archive anchors and (a) replacing wayback URL stubs with
  verified captures plus body_hash / body_path artifacts for the
  Binance 2024-02-22 wind-down notice and the 2023-08-30 advance
  notice, (b) considering promotion of status=draft → admitted at
  that point.

  comparison — S5 corporate-policy-change event documenting Binance
  Holdings Limited's 2024-02-22 global wind-down of BUSD product
  support: spot-trading-pair removal and auto-conversion of remaining
  user BUSD balances to FDUSD at 1:1. This is the cleanest follow-on
  cascade to the upstream NYDFS-directed Paxos cessation of new BUSD
  minting (2023-02-13; see related_events:
  paxos-busd-nydfs-minting-stop-2023). The cascade arc — NYDFS
  consumer alert + SEC Wells notice (2023-02-13) → Paxos mint
  cessation at the ERC-20 SupplyController layer (asset_onchain) →
  Binance pre-announces wind-down (2023-08-30) → Binance ends BUSD
  product support globally (2024-02-22, offramp_cex) — anchors the
  state-regulator → issuer → dominant-CEX dependency chain in S5,
  distinct from the OFAC-driven address-set freezes of Circle
  (2022-08-08) and Tether (2023-12-09).

  Single observed_change layer (offramp_cex) with attribution=direct
  via the Binance 2024-02-22 customer-support announcement that
  publicly cites the upstream Paxos / NYDFS trigger. asset_onchain
  is `measured` but the load-bearing on-chain observation (mint
  cessation cutoff) is attributed in paxos-busd-nydfs-minting-stop-
  2023 and is not duplicated here; the asset_onchain coverage row
  records the contract continuing to execute redemption-driven
  burns through the Binance wind-down window, contextualizing the
  off-ramp observation rather than independently driving cascade
  count. L0 / L1 / L3 / l4_frontend are all not_applicable on
  substrate-mismatch grounds — this is a CEX corporate-policy
  listing-restriction event, not a protocol or network primitive
  engagement.

  Why empirical_case rather than anchor_case: in this DRYRUN pass
  the load-bearing offramp_cex observation carries direct
  attribution but evidence rests on a single primary-corporate
  notice with provisional wayback anchor (not body-hash-pinned).
  Promotion to anchor_case requires (a) body_hash / body_path
  pinning of the Binance wind-down notice during human audit, and
  (b) an independent semi-primary or supporting tracker source
  confirming the post-2024-02-22 absence of BUSD spot pairs in
  Binance's public ticker listings.

scoped_claim: |
  "Binance Holdings Limited's 2024-02-22 global wind-down of BUSD
  product support on binance.com — spot-trading-pair removal and
  auto-conversion of remaining user BUSD balances to FDUSD at 1:1
  — narrows the centralized-exchange off-ramp surface for BUSD to
  zero on its dominant venue. The offramp_cex layer carries the
  load-bearing direct-attribution observation, with the Binance
  customer-support announcement publicly citing the upstream
  NYDFS-directed Paxos cessation of new BUSD minting (2023-02-13)
  as the proximate cause; the event is the cleanest downstream S5
  corporate follow-on to that upstream trigger in the corpus."

