analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review: TASK-2 lower-tier Pass 2. Rendered+grepped the captured source — core restriction substantiated (5/7-7/7 terms). The wave-1/2 VERIFY-FLAG was an OFAC-template "specific-address" boilerplate that does not apply to a national ban; removed. Admitted at evidence_tier=attested_secondary (§10), single source, filterable.)
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission).

  comparison documenting South Korea's FSC enforcement-decree amendment (Special
  Financial Transactions Information Act / reporting-and-use-of-specified-financial-
  transaction-information regulation) that bars licensed Korean exchanges from
  handling privacy / "dark" coins (Monero, Dash, Zcash), forcing domestic delisting
  and severing the regulated off-ramp for that asset class, effective March 2021
  (act commencement 2021-03-25). §9 scope: a deliberate state-mandated delisting
  restriction of a legitimate asset class on legitimate exchanges — IN scope.

  LAYER ROUTING (codebook §1.6): the candidate lead suggested asset_onchain, but the
  mechanism is an exchange-handling/delisting prohibition (Monero/Dash/Zcash are
  independent L1 chains with no issuer freeze entrypoint — no on-chain tx_hash can
  exist for this action). The effect is therefore carried at offramp_cex (the
  regulated off-ramp / exchange-handling surface) and asset_onchain is set
  not_applicable, exactly per the §1.6 route-to-another-layer rule.

  trigger.type=regulatory_enforcement per codebook §5.1 (KR FSC administrative
  enforcement). Stratum-actor map §5.2 maps regulatory_enforcement → S4_nation_state.
  attribution=plausible per §1.1 (decree targets the exchange/asset class, not
  enumerated operators). empirical_shape=comparison / admission_tier=empirical_case:
  one strong-attribution (plausible) observed_change layer (offramp_cex).

  DRYRUN caveats: the two captured anchors are journalism (Cointelegraph, CPO
  Magazine) — both replayable (body_hash+body_path) — and state the ban took effect
  "March 2021"; the precise 2021-03-25 day is the Special-Act amendment commencement
  date and should be hardened against the FSC enforcement-decree text at human
  audit. This is distinct from korea-fsc-institutional-restriction-2017 (earlier FSC
  action) and from the corporate privacy-coin delistings (binance-privacy-coin-
  delisting-2023, huobi-htx-privacy-coin-delisting-2024), which are issuer/exchange-
  initiated S5 events rather than a state mandate.

scoped_claim: |
  "South Korea's FSC enforcement-decree amendment, effective March 2021 (Special
  Financial Transactions Information Act commencement 2021-03-25), bars licensed
  Korean crypto exchanges from handling privacy / 'dark' coins (Monero, Dash,
  Zcash), forcing domestic delisting of that asset class. Captured at class level
  at the offramp_cex layer; no per-exchange or on-chain enumeration claimed."

