  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission). On 2024-09-12 the US SEC
  (press release 2024-125) settled with eToro USA LLC over operating as an
  unregistered broker and clearing agency: eToro agreed to a cease-and-desist
  plus a $1.5M penalty and to cease trading in nearly all crypto assets for US
  customers, restricting them to Bitcoin, Bitcoin Cash, and Ether and
  liquidating other crypto-asset securities within ~180 days. This is SEC
  enforcement forcing a US exchange/off-ramp to delist/restrict nearly all
  crypto trading for US users — in scope per codebook §9 (SEC action
  restricting a legitimate operator + a delisting). comparison shape,
  1 observed_change layer (offramp_cex), attribution=direct (the order names
  the specific target). asset_onchain not_applicable: a securities
  cease-and-desist, no on-chain freeze, so no §1.6 tx_hash floor applies.
  Sources verified via WebSearch 2026-05-31; the real SEC.gov press release
  captured + body_hash-pinned; grep of the captured body confirms "eToro",
  "1.5 million", "Bitcoin", "Bitcoin Cash", "Ether", "cease", "liquidate",
  "180 days", "broker", "clearing" (no fabrication).

