coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The privacy-policy disclosure addresses application-layer
      logging of incoming RPC requests at the Infura endpoints; it
      does not direct ISP-level domain blocking or DNS / BGP routing
      interference. not_applicable on construct-not-engaged grounds.
  - layer: l1_consensus
    status: not_applicable
    chain: ethereum
    note: |
      Post-Merge Ethereum (Paris 2022-09-15, ~2 months prior), but
      the disclosure concerns RPC-endpoint request logging — it does
      not engage PBS / relay / builder block-production censorship
      primitives at the consensus layer. not_applicable on
      construct-not-engaged grounds.
  - layer: l3_rpc
    status: partially_measured
    chain: ethereum
    provider_scope: public_and_enterprise
    note: |
      The disclosure is at the L3 RPC layer: Infura (ConsenSys-
      operated managed Ethereum RPC service) collects user IP
      addresses and Ethereum wallet addresses on every RPC request
      sent through it. This is a disclosure of pre-existing data-
      collection practice rather than a new behavioral cutover — no
      observable RPC-availability cascade is triggered by the policy
      revision itself. Coverage is partially_measured because the
      privacy-policy text is the canonical primary-corporate source
      pinned at calendar-folder Wayback granularity (pending
      body_hash on human audit), while the locally captured 2022-11-24
      The Block memento provides replayable contemporaneous support
      for the disclosure timing. No behavioral L3 cascade is claimed.
  - layer: l4_frontend
    status: not_applicable
    note: |
      No frontend-UI change is required or documented at the
      MetaMask wallet UI layer in response to the privacy-policy
      disclosure. The wallet UI continued to function unchanged; the
      disclosure is a textual transparency update rather than a UI
      behavior change. not_applicable on construct-not-engaged
      grounds in this null_event scope. (The MetaMask wallet UI is
      the downstream-default surface for Infura RPC requests, so the
      collection scope reaches MetaMask users via the L3 layer; the
      L4 surface itself does not change.)
  - layer: asset_onchain
    status: not_applicable
    note: |
      No issuer-level stablecoin freeze or on-chain asset action is
      invoked by an RPC-endpoint data-collection disclosure.
  - layer: offramp_cex
    status: not_applicable
    note: |
      The disclosure addresses RPC-layer request logging and does not
      engage CEX off-ramps.

