  **EVIDENCE REPAIR 2026-06-01**. The 2022-11-24 The Block Wayback
  memento has a local body_hash/body_path capture and is marked
  replayable for the narrow observed_no_change/null-denominator claim:
  public disclosure timing and no claimed L3 availability cutover. The
  repair does not promote the row to observed_change and does not replace
  the still-needed first-party ConsenSys privacy-policy revision pin.

  **NEW EVENT AUTHORED — DRYRUN 2026-05-17**. Comparable-tier
  contextual case for the 2022-11-23 ConsenSys privacy-policy
  revision that publicly disclosed Infura's collection of MetaMask
  user IP addresses and Ethereum wallet addresses on every RPC
  request when Infura is used as the default RPC provider. Authored
  at status=draft and origin=agent_draft pending human audit of (i)
  the ConsenSys privacy-policy URL reachability and pinned Wayback
  snapshot for the 2022-11-23 revision, (ii) The Block / Decrypt /
  CryptoSlate article permalinks, and (iii) any first-party MetaMask
  help-center revision pinning the opt-out path narrative.

  Codebook rule applied (§5.1): trigger.type=corporate_policy_change.
  The action is a unilateral corporate privacy-policy revision by
  ConsenSys; it is not an OFAC SDN designation, DOJ action, court
  order, or nation-state block. research_stratum=S5_corporate per
  §5.2 stratum-actor map.

  Why null_event / null_case (codebook §3, §4): the privacy-policy
  revision is a disclosure of pre-existing data-collection practice
  rather than a behavioral cutover at the RPC layer. No new
  availability filter, no new address-set screening, no new
  IP-geographic block was introduced — the L3 RPC endpoint behavior
  did not change on 2022-11-23, only the public documentation of
  pre-existing logging was updated. The cascade surface is textual
  / disclosure rather than behavioral. Per codebook §3, 0
  observed_change layers → empirical_shape=null_event; per codebook
  §4, 0 strong-attribution (direct/plausible) observed_change layers
  → admission_tier=null_case. The single recorded observation is an
  observed_no_change row at L3 with attribution=none per codebook
  §1.1.

  Why analysis_use=comparable_analysis: 2022-11-23 is within the
  2017+ comparable-analysis corpus window. Canonical form per
  codebook §6.

  Why jurisdiction=corporate_global: ConsenSys is a US-incorporated
  entity but the privacy-policy disclosure applies globally to all
  MetaMask users using Infura default RPC, not to a US-resident-
  user subset. Sibling Infura/MetaMask events in the corpus
  (infura-alchemy-tornado-rpc-block-2022 at [US, corporate_global];
  infura-metamask-donetsk-luhansk-block-2022-03 at [US,
  corporate_global]) carry US in jurisdiction because they are
  driven by US sanctions triggers. This event is not driven by a
  US sanctions trigger (it is a transparency disclosure of pre-
  existing collection); jurisdiction=[corporate_global] reflects the
  global user-class scope without a sanctions-jurisdiction anchor.

  Comparative value: this event is the privacy / surveillance
  counterpart to the two sibling Infura/MetaMask cascade-shape
  events of 2022:
    - infura-metamask-donetsk-luhansk-block-2022-03 (L3+L4 IP-geo
      region block, S5_corporate, comparison empirical_shape,
      empirical_case admission tier).
    - infura-alchemy-tornado-rpc-block-2022 (L3 address-set
      sanctions screening with L4 downstream cascade, S5_corporate,
      comparison empirical_shape, anchor_case admission tier).
  Both siblings are observable-cascade S5_corporate events at the
  L3 RPC layer driven by US sanctions triggers. This 2022-11
  event is the null/disclosure counterpart at the same operator
  (ConsenSys / Infura / MetaMask) and the same L3 layer, but the
  cascade surface is textual (privacy policy) rather than
  behavioral (RPC reachability or UI rendering). The triad
  illustrates that the same operator's L3 substrate can produce
  three distinct cascade shapes within ~9 months: address-set
  screening (Aug 2022, anchor_case), IP-geo region blocking
  (Mar 2022, empirical_case), and RPC-request metadata logging
  (Nov 2022, null_case). The L3 substrate's surveillance
  surface (this event) is the load-bearing context for the
  paper's discussion of why public-RPC users face a privacy
  asymmetry distinct from the censorship asymmetry surfaced by
  the cascade-shape siblings.

  Remaining release-hardening caveats: the canonical ConsenSys
  privacy-policy URL still carries a 2022-calendar-folder Wayback
  pointer rather than a first-party pinned snapshot/body_hash for
  the exact 2022-11-23 revision. The Block article has been repaired
  with a locally captured 2022-11-24 Wayback memento; Decrypt and
  CryptoSlate remain contextual triangulation only. For strict release,
  capture body_hash+body_path for the ConsenSys privacy-policy revision
  dated 2022-11-23 (compare archive.org snapshots 2022-11-23..2022-11-25
  for the "Infura" / "IP address" / "Ethereum wallet address" language).

scoped_claim: |
  "On 2022-11-23 ConsenSys updated the MetaMask privacy policy to
  publicly disclose that Infura, when used as the MetaMask default
  RPC provider, collects user IP addresses and Ethereum wallet
  addresses on every RPC request. This is a disclosure of pre-
  existing data-collection practice rather than a behavioral
  cutover at the L3 RPC layer; no new availability filter, address-
  set screen, or IP-geographic block is introduced. The single
  recorded observation is an observed_no_change row at L3 with
  attribution=none. The row does not claim any L0/L1/L4/asset/off-
  ramp cascade."

scoped_knowledge: |
  What changed: only the public documentation. The ConsenSys
  privacy policy was revised on 2022-11-23 to disclose that Infura
  collects user IP and Ethereum wallet addresses on every RPC
  request when used as the MetaMask default RPC provider. No
  observable L3 RPC behavior changed on the disclosure date; the
  collection practice was pre-existing.

  What did not change or could not be measured: L0 network is not
  applicable (the disclosure concerns application-layer logging,
  not ISP-level blocking); L1 consensus is not applicable
  (disclosure concerns RPC request logging, not PBS / relay block-
  production); L4 frontend is not applicable (the wallet UI did
  not change behavior); asset_onchain and offramp_cex are not
  applicable. L3 is partially_measured because the canonical
  primary-corporate source (the privacy-policy revision) is
  pinned at calendar-folder Wayback granularity pending human
  audit, and no behavioral cascade is claimed.

  Attribution: the single L3 observation is observed_no_change with
  attribution=none per codebook §1.1. The disclosure is direct
  about the practice but the practice is pre-existing, so there is
  no behavioral change at the L3 layer to attribute.

  Comparative value: pairs with the two sibling Infura/MetaMask
  cascade-shape S5_corporate events of 2022 to illustrate three
  distinct L3-RPC-substrate cascade shapes from the same operator
  within ~9 months: (a) IP-geo region blocking (March 2022,
  comparison / empirical_case, driven by EO 14065); (b) address-set
  sanctions screening (August 2022, comparison / anchor_case,
  driven by the Tornado Cash OFAC SDN designation); and (c)
  privacy/surveillance disclosure of pre-existing metadata
  collection (this event, November 2022, null_event / null_case,
  not driven by any specific US sanctions trigger). The pattern
  surfaces the privacy asymmetry that public-RPC users face
  alongside the censorship asymmetry already documented in the
  cascade-shape siblings; together the three events anchor the
  paper's discussion of corporate-policy governance of the L3
  substrate.

  Residual risk: the canonical ConsenSys privacy-policy revision is
  still not pinned at first-party snapshot/body_hash granularity, while
  the locally captured The Block memento provides only contemporaneous
  support. Before paper release, pin the ConsenSys privacy-policy
  revision dated 2022-11-23 if archive.org coverage is recoverable.
  If the first-party revision proves recoverable only at calendar-
  folder granularity, the disclosure framing should be preserved as-is
  (observed_no_change / attribution=none / null_case) because the row
  does not claim a behavioral censorship cutover.

