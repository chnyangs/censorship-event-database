analysis_notes: |
  **SOURCE/COVERAGE REPAIRED 2026-06-02** (quality-loop scope repair):
  verified the existing OFAC Recent Actions trigger capture by body hash,
  marked the row primary-source verified, and narrowed coverage to the actual
  retained claim. This is an individual/address-set designation with two
  measured surfaces: L1 aggregate relay-share no-change and asset-layer issuer
  freezes. L0, L3, and L4 Tornado Cash surfaces are protocol-level context, not
  Semenov-specific target layers. Off-ramp/CEX remains an explicit unmeasured
  follow-up until a public exchange, compliance, or chain-analytics slice names
  the eight Semenov addresses.

  comparison documenting the 2023-08-23 OFAC individual designation of Roman Semenov
  (Tornado Cash co-founder), co-occurring with the DOJ SDNY indictment of Semenov + Storm. The
  target is an individual (8 ETH wallet addresses) rather than a protocol, so the cross-layer
  shape is expected to differ from the protocol-level 2022 and redesignation 2022 events.

  The one grounded observation is L1 consensus: Wahrstätter's relay-censorship data shows no
  step change at or around 2023-08-23. Pre-event mean 38.45% ± 0.96 vs post-event mean
  39.57% ± 1.27; event-day value 37.03% is within 1.5 sd of pre-event baseline. This is a second
  paper-worthy L1 null result (tornado-cash-ofac-redesignation-2022 carried the first). Together
  they support the argument that post-initial-cascade additions or individual designations do
  not trigger fresh aggregate L1 reactions.

  Follow-up directions (post-admission): (1) complete per-address receipt
  packet for all 8 USDC and USDT freeze transactions rather than only the
  representative tx plus usdtbanlist aggregate; (2) pinned CEX policy or
  chain-analytics artifact naming Semenov specifically; and (3) opening a
  companion DOJ-indictment event (Storm + Semenov, SDNY 2023-08-23) as an S3
  entry — the two events share a day and support multi-agency analysis.

scoped_claim: |
  "Individual OFAC designation of Roman Semenov on
  2023-08-23 did not produce a measurable step change in Ethereum OFAC-compliant relay share
  (37.03% event day; 39.57% ± 1.27 post-event 14d; 38.45% ± 0.96 pre-event 14d)." Other layers
  remain scoped for follow-up.

