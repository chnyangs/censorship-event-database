          or withdrawal traceable to a designee must be frozen/rejected.
          attribution=direct because the operator-state change at the
          offramp_cex layer (sanctioned-person ramp blocking) is the
          legally-compelled consequence of SDN listing, not a downstream
          cascade. Observation records the legal-instrument trigger and
          the resulting blocking-obligation surface; per-exchange
          enforcement disclosures (Binance/Kraken/Coinbase/Bybit) in the
          14-day window are not separately surveyed here.
