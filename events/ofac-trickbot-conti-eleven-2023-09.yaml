      note: |
        DOJ Office of Public Affairs 2023-09-07 press release on unsealed
        indictments against 9 individuals connected to Trickbot malware and
        Conti ransomware (7 overlap with that day's OFAC SDN package).
        Companion criminal-enforcement leg of the tripartite action.
    - type: supporting_journalism
