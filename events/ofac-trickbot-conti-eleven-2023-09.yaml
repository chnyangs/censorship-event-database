    - type: primary_legal
      url: https://home.treasury.gov/news/press-releases/jy1714
      wayback: https://web.archive.org/web/2023/https://home.treasury.gov/news/press-releases/jy1714
      evidence_use: contextual_unarchived
      note: |
        Treasury press release jy1714 (2023-09-07): "United States and United
        Kingdom Sanction Additional Members of the Russia-Based Trickbot
        Cybercrime Gang." Tripartite US-UK joint action designating 11
        Russian nationals materially assisting the Trickbot group
        (administrators, managers, developers, coders) with downstream
        operational ties to the Conti ransomware variant. Concurrent DOJ
        unsealing of indictments against 9 individuals (7 overlapping with
        the OFAC SDN designations). First major US-UK joint cyber-financial
        sanctions package following the February 2023 inaugural joint
        Trickbot designation (which was the first action under the UK's
        new cyber-sanctions authority). DRYRUN: anchor is a press-release
        URL with a year-folder Wayback pointer; pinned snapshot timestamp
        and body_hash capture for the specific 2023-09-07 jy1714 permalink
        deferred to human audit. Marked evidence_use=contextual_unarchived
        per validator policy.
