analysis_notes: |
  **DRYRUN PREAMBLE — Phase F 2026-05-16**: authored by LLM agent
  (origin=agent_draft, status=draft) without personally verifying Wayback/
  body_hash anchors. Real release must pin per-permalink snapshots and a
  human adversarial audit pass before promotion to status=admitted /
  origin=human_reviewed.

  Comparison documenting the 2023-09-07 tripartite US-UK joint action:
  Treasury OFAC press release jy1714 designating 11 Russian nationals
  materially assisting the Trickbot cybercrime group (with Conti
  ransomware operational ties), the parallel UK NCA designation under
  the UK's new cyber-sanctions authority, and the concurrent DOJ
  unsealing of indictments against 9 individuals (7 overlapping with
  the OFAC SDN designations). First major US-UK joint cyber-financial
  sanctions package following the February 2023 inaugural joint
  Trickbot designation. UK NCA/FBI assessed cumulative ransomware
  extortion at USD 180M+ worldwide (£27M+ from 149 UK victims).

  Paper-relevant contrast vs sibling events:
  - matveev-ofac-2023 (2023-05-16): solo US OFAC designation of a single
    ransomware-affiliate individual (WAZAWAKA), null_event shape.
  - lockbit-leader-ofac-2024 (2024-05-07): solo US OFAC designation of the
    LockBit leader with 1 attached BTC address, null_event shape.
  - suex-ofac-2021 (2021-09-21): OFAC's first ransomware-nexus exchange
    designation (institutional target rather than individuals).
  This event sits between solo-individual designations (matveev,
  lockbit-leader) and institutional-target designations (suex): it is an
  11-individual joint US-UK package with concurrent DOJ criminal-side
  unsealing — the first such tripartite cyber-sanctions configuration —
  producing a measurable offramp_cex (sanctioned-person ramp blocking)
  observed_change and an asset_onchain (per-individual SDN XML wallet
  attachments) observed_change. empirical_shape=comparison (2 layers).

  DRYRUN caveats: trigger primary citations (Treasury jy1714, UK NCA,
  DOJ) are asserted with year-folder Wayback pointers; pinned snapshot
  timestamps and body_hash captures for the specific 2023-09-07
  release permalinks are deferred to the human-audit pass. For
  non-DRYRUN release, capture body_hash + body_path for: (1) Treasury
  press release jy1714 at home.treasury.gov/news/press-releases/jy1714,
  (2) the UK NCA release at nationalcrimeagency.gov.uk, (3) the DOJ
  OPA release at justice.gov, (4) the OFAC SDN XML entries for each
  of the 11 designees to enumerate any attached digital-currency
  addresses for the asset_onchain observation. All citations carry
  evidence_use=contextual_unarchived to flag the unarchived state per
  validator policy.

