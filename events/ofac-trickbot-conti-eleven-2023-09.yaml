      evidence_use: contextual_unarchived
      note: |
        UK National Crime Agency (NCA) 2023-09-07 press release announcing
        the parallel UK sanctions designation, with NCA/FBI assessment that
        the Trickbot/Conti group was responsible for at least USD 180M+ in
        cumulative worldwide ransomware extortion, including at least £27M
        from 149 UK victims. Identifies the 11 designees as developers,
        administrators handling ransom-fund flows, and recruiters from
        cyber-crime forums.
