  null_event documenting Japan's 2023-06-01 effective date for the
  revised Act on Prevention of Transfer of Criminal Proceeds (APTCP /
  犯罪収益移転防止法) implementation of the FATF Travel Rule for
  FSA-registered Crypto-Asset Exchange Service Providers (CAESPs).
  Cleanest implementation gate for the global Travel Rule cascade
  because it is the first major Asia-Pacific advanced-economy
  implementation that drops the transitional de-minimis threshold to
  zero (i.e. all CAESP-to-CAESP crypto-asset transfers carry the
  metadata obligation regardless of amount).

  Sits as a child of fatf-r15-vasp-travel-rule-2019 (supranational
  parent) and as an Asia-jurisdiction sibling of korea-travel-rule-2022
  (KRW 1M threshold) and as an out-of-bloc sibling of eu-tfr-recast-2023
  (zero-threshold EU CASP regime). Structural contribution: a
  metadata-layer null_event in the Travel Rule cascade — the empirical
  shape is null because the corpus has no replayable on-chain or
  measurement-platform signal of downstream off-ramp behavior change;
  the regulator-decreed information-collection requirement is itself
  the substantive trigger.

  Threshold framing: the original drafting brief referenced ≥¥30,000
  (~$200). That figure corresponds to a separate cash-equivalent /
  general AML reporting trigger under the broader Japanese AML/CFT
  framework, not the post-2023-06-01 CAESP Travel Rule itself, which
  applies without a de-minimis threshold per public reporting
  (Sygna / Notabene / Shyft Network / CoinDesk). Human auditor must
  reconcile this framing against the FSA / JAFIC primary-legal text
  before promotion to admitted.

  research_stratum=S6_supranational chosen over S3 because the
  substantive triggering event is the national-level implementation of
  FATF Recommendation 15 (a supranational standard), matching the
  dataset convention used for eu-tfr-recast-2023 and consistent with
  the fatf-r15-vasp-travel-rule-2019 parent. The actor is the FSA but
  the trigger.type=supranational_regulation reflects the FATF lineage.

scoped_claim: |
  "Japan's 2023-06-01 effective date for the revised Act on Prevention
  of Transfer of Criminal Proceeds (APTCP) operationalized the FATF
  Travel Rule for FSA-registered Crypto-Asset Exchange Service
  Providers (CAESPs), requiring originator + beneficiary metadata for
  CAESP-to-CAESP crypto-asset transfers without a de-minimis threshold.
  Anchored as a metadata-layer null_event in the global Travel Rule
  cascade (parent: FATF R.15 2019; siblings: KR FSC 2022, EU TFR 2023)."

