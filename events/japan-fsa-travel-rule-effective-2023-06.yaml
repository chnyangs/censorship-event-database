        Japan FSA Travel Rule implementation effective 2023-06-01. The
        revised Act on Prevention of Transfer of Criminal Proceeds (APTCP /
        犯罪収益移転防止法) entered into force on this date, requiring
        Crypto-Asset Exchange Service Providers (CAESPs / 暗号資産交換業者)
        registered with the FSA in Japan to collect and transmit
        originator + beneficiary information for crypto-asset transfers
        between VASPs (the FATF Travel Rule). The Foreign Exchange and
        Foreign Trade Act and the International Terrorist Asset-Freezing
        Act were updated in tandem. Implements FATF Recommendation 15
        (2019 INR) at the national level in Japan. After 2023-06-01 the
        APTCP regime applies without the transitional JPY 100,000
        threshold (i.e. all CAESP-to-CAESP crypto-asset transfers carry
        the originator/beneficiary metadata obligation regardless of
        amount). Originally drafted brief referenced a ≥¥30,000 (~$200)
        threshold; that figure corresponds to a separate cash-equivalent
        reporting trigger under the broader AML/CFT framework, not the
        post-2023-06-01 CAESP Travel Rule itself, which is unconditional.
        Human auditor must pin a verified FSA / JAFIC primary-legal URL
        and reconcile the threshold framing before promotion.
    - type: primary_legal
      url: https://www.fsa.go.jp/en/news/2023/index.html
      wayback: https://web.archive.org/web/20260516000000/https://www.fsa.go.jp/en/news/2023/index.html
      note: |
        Second pointer to the FSA English news index 2023 as a placeholder
        primary-legal anchor for the APTCP amendment package effective
        2023-06-01. Human auditor should replace with the specific FSA
        press release / cabinet order URL (and the JAFIC notice on
        Travel Rule operationalization), plus the JVCEA self-regulatory
        rule update that operationalized the obligation at the
        exchange-association level.
  timestamp_sources:
    - type: primary_legal
      note: |
        Effective date 2023-06-01 per FSA / APTCP revision implementation
