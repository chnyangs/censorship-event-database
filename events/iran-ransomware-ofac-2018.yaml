  **LAST_HUMAN_AUDIT STAMP — DRYRUN 2026-05-15**: stamped by automated pipeline-demo per `analysis/null_audits/AGGREGATE.md`. Both LLM cross-audit agents (A,B) converged on `pass` or `pass_with_concerns`; this stamp records that the case has been pre-screened by 2 LLM agents and would be a human-audit candidate for the next iteration. The corpus-wide `offramp_cex.measured` convention concern is unresolved (see AGGREGATE.md P2). For a real release, replace this DRYRUN marker with a human-verified audit.
  
    null_event documenting the historical anchor of the entire dataset: the
  2018-11-28 Iran ransomware facilitators designation, when OFAC first attached digital-
  currency addresses to an SDN entry. Individual-level targeting (not protocol / service),
  Bitcoin-only, no asset-layer freeze primitive, pre-Merge by 3.8 years.

  The one observable is L4: the Iranian-operated enexchanger.com redirect shell persisted
  through the event with no evidence of takedown. This is consistent with later foreign-
  operator persistence cases (SUEX 2021, Sinbad 2023).

  Admitting as null_event because the L1/L3/asset layers are all structurally
  not_applicable and only a passive L4 null is available; the event is effectively a pure
  legal designation with no cross-layer cascade measurable.

scoped_claim: |
  "OFAC first on-chain sanction (2018-11-28 Iran ransomware facilitators) produced no
  observable cross-layer cascade. The targeted individuals' associated website (enexchanger.com)
  persisted unchanged through a 20-day window bracketing the designation. Direct asset-layer
  reactions are structurally impossible (Bitcoin native chain, no issuer freeze) and L1 / L3
  Ethereum layers did not yet have OFAC-relevant infrastructure."

