analysis_notes: |
  **REJECTED 2026-05-20** (c) Batch C-2 audit event 13/22 by
  human:xiangwen. Retraction rationale: this event is a cluster-
  level reframing of the BitLicense exit cascade already fully
  documented by parent event nydfs-bitlicense-2015-06, which
  carries replayable body_hash captures for the Kraken
  ("farewell-new-york") and Bitfinex frontend exit anchors and
  enumerates the cluster within its own coverage. The trigger
  here (2015-08-10 grace-period expiration) falls inside the
  parent's existing time_window 2015-06-25..2015-08-15, and the
  6 added platforms (BitFlyer USA / OkCoin / GoCoin beyond the
  parent's enumeration) do not constitute a distinct enforcement
  action — they share the same trigger (NYDFS 23 NYCRR Part 200,
  effective 2015-08-08, 45-day grace period ending 2015-08-10).
  Admitting both would double-count the BitLicense cascade in
  coverage statistics. Retracted to null_event/null_case to keep
  the parent event as the canonical anchor.

  All citations in this YAML are retained for cross-reference;
  evidence_use=contextual_unarchived throughout. See parent
  event nydfs-bitlicense-2015-06 for the canonical L4/offramp_cex
  cascade record.

scoped_claim: |
  "The 2015-08-10 BitLicense grace-period expiration triggered a
  cluster of crypto exchange exits from the New York market:
  Bitfinex, Kraken, ShapeShift, Poloniex, BitFlyer USA, OkCoin, and
  GoCoin all withdrew from serving NY-resident users via L4-frontend
  NY-state geofencing and offramp_cex account closures. Observational
  axes at l4_frontend and offramp_cex. Historical-baseline tier; not
  used in main statistical denominators."

