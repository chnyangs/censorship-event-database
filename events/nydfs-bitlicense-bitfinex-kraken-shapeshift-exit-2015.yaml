last_verified: 2026-05-16
related_events:
  - nydfs-bitlicense-2015-06             # parent rulemaking event already in corpus

trigger:
  type: court_civil_order
  actor: US_NYDFS
  timestamp: 2015-08-10T00:00:00Z
  timestamp_precision: day
  citation:
    - type: primary_legal
      url: https://www.dfs.ny.gov/virtual_currency_businesses
      wayback: https://web.archive.org/web/2015*/https://www.dfs.ny.gov/legal/regulations/adoptions/dfsp200t.pdf
      evidence_use: contextual_unarchived
      note: |
        NYDFS 23 NYCRR Part 200 (BitLicense) became fully effective on
        2015-08-08; the 45-day application grace period set 2015-08-10
        as the de-facto cutoff for platforms to either apply or exit
        the NY market. Multiple platforms publicly announced NY market
        exit on or around this date. evidence_use=contextual_unarchived;
        body_hash not captured this session. The parent rulemaking event
        nydfs-bitlicense-2015-06 carries the archived rule-text capture.

target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    Cluster of crypto exchanges and money-service businesses that
    declined to apply for the BitLicense and withdrew from serving
    NY-resident users on or around 2015-08-10. Documented exits
    include: Bitfinex, Kraken, ShapeShift, Poloniex, BitFlyer USA,
    OkCoin, GoCoin, Bitstamp (declined). Coinbase and Circle did
    apply and received licenses later (2017+).
  actor_type: exchange
  actor_name: "BitLicense-non-compliant crypto exchanges (cluster)"
  chains: [bitcoin, ethereum]
  canonical_domains:
    - bitfinex.com
    - kraken.com
    - shapeshift.io
    - poloniex.com
    - gocoin.com

jurisdiction: [US]

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      State-licensing regime; no ISP-level reachability change.
  - layer: l1_consensus
    status: not_applicable
    note: |
      2015 predates post-Merge / post-PBS L1 filtering surface. Out of scope.
  - layer: l3_rpc
    status: not_applicable
    note: |
      Hosted-RPC providers did not operate at meaningful scale in 2015.
  - layer: l4_frontend
    status: partially_measured
    scope:
      - bitfinex.com
      - kraken.com
      - shapeshift.io
      - poloniex.com
      - gocoin.com
    note: |
      Platform-by-platform NY-state geofencing at the L4 frontend
      layer. Several platforms displayed "not available to NY
      residents" notices to NY-IP visitors. Wayback snapshots of
      2015-08-10..2015-08-25 frontend pages document the geofence
      rollout but are not captured into sources/http_captures/
      this session. Distinct from the parent rulemaking event
      (nydfs-bitlicense-2015-06), which already captures the
      ShapeShift / Kraken / Bitfinex / Poloniex L4 exit anchors;
      this event captures the broader cluster (adding BitFlyer USA,
      OkCoin, GoCoin) and codes the cluster as a single observation.
  - layer: asset_onchain
    status: not_applicable
    note: |
      No issuer-level token freeze or admin-method invocation.
  - layer: offramp_cex
    status: partially_measured
    scope:
      - bitfinex_ny
      - kraken_ny
      - shapeshift_ny
      - poloniex_ny
    note: |
      NY-resident user account closures across the cluster. Email
      notifications to existing NY users instructed wind-down of
      open balances (e.g. Bitfinex's 2015-08-15 4:00pm EDT withdrawal
      deadline for NY residents). partially_measured because the
      per-platform closure dates are individually documented in
      contemporaneous press but a unified replayable artifact has
      not been pinned this session.

observations:
  - layer: l4_frontend
    actor: cluster:bitlicense_non_compliant_exchanges
    event: ny_state_geofencing_enabled_at_frontend
    observation_kind: observed_change
    attribution: direct
    timestamp: 2015-08-10T00:00:00Z
    precision: day
    delta_hours: 0
    sources:
      - type: primary_legal
        url: https://www.dfs.ny.gov/virtual_currency_businesses
        wayback: https://web.archive.org/web/2015*/https://www.dfs.ny.gov/legal/regulations/adoptions/dfsp200t.pdf
        evidence_use: contextual_unarchived
        scope_descriptor:
          providers: [bitfinex, kraken, shapeshift, poloniex, gocoin]
          countries: [US]
          time_window:
            - 2015-08-10T00:00:00Z
            - 2015-08-31T23:59:59Z
        note: |
          Direct attribution: each cluster-member exit announcement
          explicitly cited the NYDFS BitLicense regulation as the
          cause. Cluster-level observation; per-platform exit-page
          captures live (partially) in the parent event
          nydfs-bitlicense-2015-06.
      - type: supporting_journalism
        url: https://www.coindesk.com/markets/2015/08/09/bitcoin-exchanges-kraken-and-bitfinex-cut-services-in-new-york
        wayback: https://web.archive.org/web/2015*/https://www.coindesk.com/markets/2015/08/09/bitcoin-exchanges-kraken-and-bitfinex-cut-services-in-new-york
        evidence_use: contextual_unarchived
        scope_descriptor:
          providers: [bitfinex, kraken]
          countries: [US]
          time_window:
            - 2015-08-09T00:00:00Z
            - 2015-08-15T23:59:59Z
        note: |
          CoinDesk 2015-08-09 report documenting Kraken and Bitfinex
          NY-service termination on the eve of the 2015-08-10 grace-
          period expiration. contextual_unarchived this session.

  - layer: offramp_cex
    actor: cluster:bitlicense_non_compliant_exchanges
    event: ny_resident_account_closures
    observation_kind: observed_change
    attribution: direct
    timestamp: 2015-08-10T00:00:00Z
    precision: day
    delta_hours: 0
    sources:
      - type: supporting_journalism
        url: https://fortune.com/2015/08/14/bitcoin-startups-leave-new-york-bitlicense/
        wayback: https://web.archive.org/web/2015*/https://fortune.com/2015/08/14/bitcoin-startups-leave-new-york-bitlicense/
        evidence_use: contextual_unarchived
        scope_descriptor:
          providers: [bitfinex_ny, kraken_ny, shapeshift_ny, poloniex_ny]
          countries: [US]
          time_window:
            - 2015-08-10T00:00:00Z
            - 2015-09-15T23:59:59Z
        note: |
          Fortune 2015-08-14 "Behind the exodus of bitcoin startups
          from New York" — cluster-level coverage of NY-resident
          account-closure notices issued by Bitfinex, Kraken,
          ShapeShift, Poloniex, and others. Direct attribution
          because each platform's closure notice references
          BitLicense. contextual_unarchived this session.

analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase B of 2026-05-16
  staged-release plan, historical_baseline_2013_2016 tier fill):
  authored end-to-end by LLM agent. This event documents the
  post-BitLicense exit cascade — a cluster of platforms (Bitfinex,
  Kraken, ShapeShift, Poloniex, BitFlyer USA, OkCoin, GoCoin)
  withdrew from serving NY-resident users on/around 2015-08-10
  rather than apply for the BitLicense. Distinct from the parent
  BitLicense rulemaking event nydfs-bitlicense-2015-06 (already in
  corpus, which captures the ShapeShift/Kraken/Bitfinex/Poloniex L4
  exit anchors with real Wayback captures); this event captures the
  downstream cluster-level L4-frontend + offramp_cex cascade and
  adds BitFlyer USA / OkCoin / GoCoin to the enumeration.
  evidence_use=contextual_unarchived throughout. Status remains
  draft pending real-archive capture of platform exit announcements
  and human review.

  Trigger-type choice follows the parent event: NYDFS is a US
  sub-national (state) financial regulator and the BitLicense is an
  administrative rule-making, not a criminal or civil enforcement
  action. The schema 0.2.0 trigger.type vocabulary does not include
  a state_regulator_action enum value; the least-bad existing enum
  is court_civil_order (which maps to S3_doj_sec_cftc_fiod in the
  validator's trigger-type-to-stratum map). trigger.actor=US_NYDFS
  does not match any actor-coherence pattern, so no conflict.

  Empirical shape: comparison. Two distinct observed_change layers
  (l4_frontend cluster geofencing + offramp_cex NY-resident account
  closures), so empirical_shape=comparison. admission_tier=
  empirical_case (≥1 strong-attribution observed_change layer; both
  observations carry attribution=direct via cluster announcements).

scoped_claim: |
  "The 2015-08-10 BitLicense grace-period expiration triggered a
  cluster of crypto exchange exits from the New York market:
  Bitfinex, Kraken, ShapeShift, Poloniex, BitFlyer USA, OkCoin, and
  GoCoin all withdrew from serving NY-resident users via L4-frontend
  NY-state geofencing and offramp_cex account closures. Observational
  axes at l4_frontend and offramp_cex. Historical-baseline tier; not
  used in main statistical denominators."

