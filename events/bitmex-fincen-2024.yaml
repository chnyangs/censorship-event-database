analysis_notes: |
  **NEW EVENT AUTHORED -- DRYRUN 2026-05-17**: 2024-07-10 corporate guilty
  plea by HDR Global Trading Limited (BitMEX) to a Bank Secrecy Act offense
  (willful failure to maintain an adequate AML program 2015-2020), with
  sentencing 2025-01-15 imposing an additional $100M criminal fine plus
  two years' corporate probation.

  TRIGGER FRAMING NOTE: Per author instruction, trigger.type=fincen_action
  and actor=US_FINCEN are coded. The 2024-07-10 plea is technically a
  DOJ SDNY criminal disposition; it is the corporate-defendant tail of
  the same enforcement chain that began with the 2020-10-01 CFTC + DOJ
  filings and the 2021-08-10 FinCEN consent assessment (the FinCEN civil
  money penalty was issued in 2021, not 2024). Both DOJ and FinCEN
  enforcement land in stratum S3_doj_sec_cftc_fiod. Human reviewer should
  consider recoding trigger.type=doj_indictment (or doj_seizure_order
  equivalent for plea-disposition) if the FinCEN framing is judged
  inaccurate; the stratum mapping is unaffected either way.

  null_event RATIONALE: Distinct from the 2020 cascade (bitmex-cftc-doj-2020,
  which captured L4 + offramp_cex direct observed_change rows), the 2024
  corporate plea is a downstream monetary / probationary resolution with
  no new cascade surface. US-vantage retail BitMEX access was already
  severed in 2020 and global KYC was already enforced. No incremental
  L4 frontend notice or offramp_cex rail change was observed in connection
  with the 2024 plea or 2025-01-15 sentencing. Recorded as observed_no_change
  at offramp_cex (the layer where one would most plausibly expect a
  reaction) with attribution=none, yielding empirical_shape=null_event
  and admission_tier=null_case -- a denominator control row for the
  2024-vintage enforcement-driven offramp_cex stratum, paired with the
  2020 anchor via related_events. For a real release, replace wayback URL
  stubs with verified captures + body_hash / body_path artifacts via
  scripts/capture_http_artifact.py, and confirm via Wayback that no
  blog.bitmex.com or other operator-side L4 announcement was issued in
  the 2024-07 to 2025-01 window (a confirmatory absence is what supports
  the observed_no_change claim).

