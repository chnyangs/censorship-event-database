target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    Target is the Cloudflare Ethereum Gateway product (cloudflare-eth.com)
    as the entity whose corporate-policy change narrowed gateway access
    to the OFAC Tornado Cash SDN address set (per tornado-cash-ofac-2022
    target.addresses). Subset because the corporate disclosure does not
    enumerate the 99 blocked items verbatim and the operational block
    was implemented against the OFAC SDN list as a moving reference;
    the Tornado Cash address universe is the documented enforcement
    perimeter.
  entity: Cloudflare Ethereum Gateway (cloudflare-eth.com)
  actor_type: cdn_gateway_operator
  actor_name: Cloudflare, Inc.
  chains: [ethereum]
  canonical_domains:
    - cloudflare-eth.com
    - cloudflare.com
    - blog.cloudflare.com

jurisdiction: [US, corporate_global]

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The Cloudflare Ethereum Gateway block is a JSON-RPC response /
      Cloudflare-Workers application-layer policy on the cloudflare-eth.com
      gateway, not an ISP-level DNS or routing block. The cloudflare-eth.com
      domain remained globally reachable; the block is in the gateway
      response logic.
  - layer: l1_consensus
    status: not_applicable
    chain: ethereum
    note: |
      Pre-Merge Ethereum (Paris was 2022-09-15, 34 days after this event);
      PBS relay-censorship infrastructure did not exist yet. The
      consensus-layer effect of the 2022-08-08 OFAC trigger is captured
      in the related event tornado-cash-ofac-2022 observations[l1] for
      the post-Merge window.
  - layer: l3_rpc
    status: measured
    chain: ethereum
    provider_scope: public_only
    note: |
      Load-bearing layer for this event. The Cloudflare Ethereum Gateway
      (cloudflare-eth.com) is a public Cloudflare-fronted JSON-RPC
      gateway — a distinct subtype from the managed-RPC providers
      captured under infura-alchemy-tornado-rpc-block-2022 (Infura,
      Alchemy). Cloudflare disclosed in its H2 2022 Transparency
      Report and the linked blog/policy material that access through
      the cloudflare-eth.com gateway was disabled to the OFAC-listed
      Tornado Cash addresses. provider_scope=public_only reflects
      that the cloudflare-eth.com gateway is a public CDN-fronted
      endpoint without an enterprise managed-RPC tier in the sense
      Infura/Alchemy mean it. Coverage status is measured because the
      Cloudflare disclosure is direct operator attestation; perimeter
      is bounded to the Cloudflare Ethereum Gateway only via the
      scope_descriptor on the L3 observation.
  - layer: l4_frontend
    status: not_measured
    note: |
      Cloudflare-fronted UIs that proxy JSON-RPC through the
      cloudflare-eth.com gateway (or which use Cloudflare as their CDN
      and route Tornado-related Ethereum reads via the Cloudflare
      gateway) plausibly surfaced broken Tornado interactions in the
      same window, but the L4 effect is a downstream consequence of
      the gateway block, not an independent frontend-operator policy
      decision, and no specific Cloudflare-fronted consumer UI is
      named in the public corporate disclosure. Status set to
      not_measured rather than partially_measured to avoid claiming
      a denominator we cannot anchor; the named-frontend cascade is
      captured in sibling events aave-tornado-frontend-block-2022-08
      and uniswap-balancer-tornado-frontend-block-2022-08.
  - layer: asset_onchain
    status: not_applicable
    note: |
      No issuer-level stablecoin freeze primitive is invoked by the
      Cloudflare Ethereum Gateway policy; the Circle USDC freeze is
      the sibling asset-layer action (circle-usdc-tornado-2022).
  - layer: offramp_cex
    status: not_applicable
    note: |
      Cloudflare CDN/gateway block is upstream of CEX off-ramps; the
      off-ramp reaction is captured under the OFAC trigger event
      tornado-cash-ofac-2022 observations[offramp_cex].

