analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-5 audit (S5 corporate, Tornado/RPC)
  by human:xiangwen. Anchored on Cloudflare official Ethereum-Gateway blog
  (primary_corporate, Wayback 20221108223358, body_hash 76ab7b02...).
  l3_rpc observed_change/direct. comparison/empirical_case preserved.

  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (S5 corporate_policy
  discovery, CDN-gateway subtype): authored by LLM agent without
  personally verifying Wayback/body_hash; origin=agent_draft and
  status=draft per validator policy. Real release must replace this
  DRYRUN marker with a human-verified audit pass that pins the
  Cloudflare H2 2022 Transparency Report PDF body_hash + body_path
  and the Cloudflare blog snapshot, then re-anchors evidence_use to
  admission_anchor where applicable.

  This event isolates the **CDN gateway subtype** of L3 censorship
  for the 2022-08-08 OFAC Tornado Cash trigger family. The
  Cloudflare Ethereum Gateway (cloudflare-eth.com) is structurally
  distinct from the managed-RPC providers (Infura, Alchemy) captured
  in infura-alchemy-tornado-rpc-block-2022: Cloudflare is a CDN +
  Cloudflare-Workers-fronted public JSON-RPC gateway, not a
  developer-facing enterprise RPC service. Separating the two events
  preserves the paper's L3 column granularity (managed-RPC subtype
  vs. CDN-gateway subtype) and avoids collapsing two different
  operator-policy mechanisms into a single row.

  Stratum coding: S5_corporate. OFAC SDN is the upstream trigger
  (tornado-cash-ofac-2022) but Cloudflare's policy decision is a
  corporate compliance action against its own public gateway product,
  not an OFAC-compelled action against Cloudflare itself; the
  cloudflare-eth.com gateway is not a regulated activity under the
  Treasury secondary-sanctions authority.

  Empirical shape: comparison (1 observed_change layer at L3 RPC
  with attribution=direct; L4 frontend left not_measured to avoid
  double-counting with sibling frontend events).

  Admission tier: empirical_case (1 strong-attribution
  observed_change layer at L3; not anchor_case because the only
  observed_change layer is L3 — L4 cascade is left not_measured
  without a separate observation row, because the Cloudflare-
  fronted-UI cascade is upstream-shared with the named-frontend
  events aave-tornado-frontend-block-2022-08 and
  uniswap-balancer-tornado-frontend-block-2022-08 and should not
  be double-counted here).

  DRYRUN caveats: all four citations carry calendar-folder Wayback
  pointers; before paper-release the human-audit pass must pin: (1)
  the Cloudflare H2 2022 Transparency Report PDF (cf-assets URL)
  body_hash + body_path; (2) the Cloudflare blog post snapshot at
  the August 2022 revision (compare archive.org snapshots
  2022-08-09..2022-08-15 for the policy-revision banner / footer
  language); (3) CoinDesk 2022-08-17 article permalink; (4)
  TorrentFreak 2023-11-21 article permalink. Marked
  evidence_use=contextual_unarchived per validator policy for
  unarchived sources.

scoped_claim: |
  "The August 2022 Cloudflare Ethereum Gateway (cloudflare-eth.com)
  access restriction against the 2022-08-08 OFAC Tornado Cash SDN
  address set constitutes the CDN-gateway subtype of L3 censorship
  in the corpus — structurally distinct from the managed-RPC
  subtype (Infura, Alchemy, sibling event
  infura-alchemy-tornado-rpc-block-2022). The row does not claim
  ISP-level connectivity blocking, consensus-layer (PBS) effect,
  on-chain asset freeze, or off-ramp severance — those are sibling
  rows under tornado-cash-ofac-2022 / circle-usdc-tornado-2022."

scoped_knowledge: |
  What changed: L3 RPC (Cloudflare Ethereum Gateway, direct) — the
  cloudflare-eth.com gateway disabled access to OFAC-listed Tornado
  Cash addresses in August 2022, per Cloudflare's own H2 2022
  Transparency Report.

  What did not change or could not be measured: L0 network is not
  applicable (the block is in JSON-RPC response logic at the gateway,
  not DNS or routing); L1 consensus is not applicable (pre-Merge by
  34 days, PBS did not exist); L4 frontend is not_measured here
  (downstream cascade tracked under sibling named-frontend events
  to avoid double-counting); asset_onchain and offramp_cex are not
  applicable here (captured in sibling Circle/OFAC composite
  events).

  Attribution: L3 row is direct because the primary_corporate source
  is Cloudflare's own Transparency Report disclosure naming the
  Tornado Cash sanctions as the reason for the gateway access
  restriction.

  Comparative value: this is the CDN-gateway subtype companion to
  the managed-RPC anchor infura-alchemy-tornado-rpc-block-2022
  within the S5_corporate stratum. Together with
  aave-tornado-frontend-block-2022-08,
  uniswap-balancer-tornado-frontend-block-2022-08, and
  circle-usdc-tornado-2022, the row populates the paper's
  "corporate-cascade" portrait downstream of the 2022-08-08 OFAC
  trigger across distinct L3/L4/asset substrates.

  DRYRUN risk: the four citations are unarchived; before paper
  release the human-audit pass must pin the Cloudflare H2 2022
  Transparency Report PDF body_hash, blog snapshot, and the two
  journalism triangulation links. If archive.org coverage of the
  August 2022 Cloudflare blog policy revision proves recoverable
  only at calendar-folder granularity (rather than at the
  exact-revision snapshot level), the L3 observation should be
  downgraded from direct to plausible.

