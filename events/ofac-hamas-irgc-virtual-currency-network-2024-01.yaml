  Comparison documenting the 2024-01-22 OFAC SDN designation of a joint
  Hamas / IRGC-QF virtual-currency procurement sub-network. This is the
  second major post-Oct 7 sanctions package targeting Hamas financial
  infrastructure (paired with the 2023-10 Hamas Buy Cash MSB
  designation, recorded in `ofac-hamas-buy-cash-msb-2023-10`, and
  contrasted against the 2022-09-14 IRGC ransomware designation
  recorded in `irgc-ransomware-ofac-2022`). Empirical shape is
  `comparison` because the cascade carries one observed_change layer
  (asset_onchain, Tether USDT-TRC20 freezes referenced by the press
  release itself) plus an observed_no_change row at offramp_cex.

scoped_claim: |
  "The 2024-01-22 OFAC SDN designation of the joint Hamas / IRGC-QF
  virtual-currency procurement sub-network attached specific wallet
  designations with concurrent Tether USDT-TRC20 issuer freezes on the
  designated addresses (asset-layer cascade), with no public CEX
  policy-statement cascade documented in the 14-day post-designation
  window."

