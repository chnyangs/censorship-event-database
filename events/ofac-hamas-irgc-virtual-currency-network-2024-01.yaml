analysis_notes: |
  **STATUS: REJECTED 2026-05-20 (c) Batch C-1 event 4/8**.

  v0.3 audit rejection rationale: original Wave-2 LLM-authored draft
  was factually MISFRAMED. Direct inspection of OFAC RA 2024-01-22
  Wayback capture (web/20240122162236, 101610 bytes) confirms ZERO
  `Digital Currency Address` entries on the SDN listing for this
  action. The 2024-01-22 OFAC Counter Terrorism Designations package
  targets:
    - Cash-MSB entities: AL-MARKAZIYA, HERZALLAH EXCHANGE AND GENERAL
      TRADING COMPANY, SAMIR HERZALLAH AND BROTHERS FOR MONEY EXCHANGE
    - Hamas-affiliated individuals: 4 Shamlakh siblings (Zuhair, Ahmed,
      Alaa, Imad) + 5 Hirzallah/Herzallah family members
    - Iraq Kata'ib Hizballah members: al-Hamidawi, al-Ibudi,
      al-Shabbani, al-Azzawi
    - Fly Baghdad Airlines (IRGC-QF logistics) + 2 aircraft (YI-BAF,
      YI-BAN)
  None of these have crypto wallet designations. The Treasury jy2036
  press release narrative mentions "virtual currency transfers" in the
  context of Iran-Hamas funding mechanisms generally (74xHamas / 6x
  Virtual Currency grep matches), but the SDN-listing PAYLOAD itself
  enumerates no crypto addresses.

  **Source of error**: the original draft author conflated this
  2024-01-22 action with the 2023-12-13 OFAC action against Said
  al-Jamal (IRGC-connected Houthi financier), which DID enumerate
  hundreds of millions of dollars in cryptocurrency. Evidence of
  conflation: the original draft cited a Chainalysis blog
  ("ofac-highlights-hundreds-of-millions-of-dollars-in-cryptocurrency-
  transactions-related-to-irgc-connected-houthi-financier-said-al-
  jamal") whose title explicitly names Said al-Jamal — that blog
  belongs to the sibling event `ofac-houthi-al-jamal-crypto-refresh-
  2024-12` (Batch C-1 event 5/8), not to this event.

  **Retention rationale**: event retained as REJECTED REFERENCE
  (similar to sec-v-uniswap-wells-notice-2024 Option-A pattern). The
  2024-01-22 OFAC action is a legitimate S1 SDN designation, but
  belongs in a non-crypto-relevant corpus (cash-financial-network
  sanctions, aviation/logistics sanctions) outside this database's
  S1_OFAC_SDN crypto-relevant scope. Captures retained on disk as
  documented evidence that the rejection is grounded in primary-source
  inspection, not assumption. Future curation may either delete this
  event_id entirely (clean removal) or re-author with corrected scope.

scoped_claim: |
  REJECTED 2026-05-20: original draft framed this as an
  S1 OFAC virtual-currency-network designation cascade with Tether
  USDT-TRC20 freezes. Direct OFAC RA inspection shows zero
  Digital Currency Address entries on the 2024-01-22 SDN listing;
  draft was conflated with the 2023-12-13 Said al-Jamal action.
  The 2024-01-22 action targets cash-MSB + aviation + individual
  Hamas/IRGC-QF facilitators with no crypto-chain involvement at
  the SDN-listing payload level.

