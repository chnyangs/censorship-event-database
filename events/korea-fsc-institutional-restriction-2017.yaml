      wayback: https://web.archive.org/web/20210627154808/https://www.fsc.go.kr/eng/pr010101/22173
      body_hash: sha256:f4e8ebd1f268d3ca53fe8f17ebf9b937a5500385969a340e6340610f003f6138
      body_path: sources/http_captures/korea-fsc-institutional-restriction-2017/primary/web.archive.org__web-20210627154808-https-www.fsc.go.kr-eng-pr010101-22173__76c46bcbb5.html
      evidence_use: replayable
      note: |
        South Korea Financial Services Commission (FSC) press release index
        (English site). Joint government emergency measure announced
        2017-12-13 by the Office for Government Policy Coordination with
        the FSC named as the financial-sector regulator. The 2017-12-13
        package introduced two load-bearing rules for the Korean crypto
        rail: (1) real-name verified bank accounts mandatory for crypto
        exchange deposits/withdrawals (anonymous virtual accounts at
        Korean exchanges to be phased out), (2) prohibition on minors and
        foreign nationals opening Korean crypto exchange accounts, and
        (3) regulated financial institutions prohibited from buying,
        holding, or investing in crypto-assets. The follow-on FSC
        announcement 2018-01-23 set the 2018-01-30 effective date for the
        real-name banking mandate. The fsc.go.kr URL path drifts; the
        provisional Wayback anchor uses year-prefix lookup and requires
        re-pinning during human audit before this citation may serve as
        an admission anchor in its own right. Marked
        evidence_use=contextual_unarchived pending that re-pin.
    - type: semi_primary_wayback
      url: https://www.welivesecurity.com/2018/01/23/south-korea-moves-ban-anonymous-cryptocurrency-trading/
      wayback: https://web.archive.org/web/20180123164626/https://www.welivesecurity.com/2018/01/23/south-korea-moves-ban-anonymous-cryptocurrency-trading/
      body_hash: sha256:02320b41a323d7ba4ff520f8c3ee976855f986de08077ad01ae31b0d588c8e63
      body_path: sources/http_captures/korea-fsc-institutional-restriction-2017/primary/web.archive.org__web-20180123164626-https-www.welivesecurity.com-2018-01-23-south-korea-moves-ban-anonymous-cryptocurrency-trading__c3f8e2a8ef.html
      evidence_use: replayable
      note: |
        Secondary reporting of the FSC 2018-01-23 confirmation that the
        real-name mandate would take effect 2018-01-30. Used as a
        contextual anchor for the date sequence (2017-12-13 emergency
        package → 2018-01-23 FSC confirmation → 2018-01-30 effective
        date). Wayback timestamp requires re-pinning during human audit.
  timestamp_sources:
    - type: primary_legal
      note: |
        Day-level precision is appropriate: the joint government emergency
        measure was issued 2017-12-13 as a same-day policy announcement.
        Intra-day publication timing is not carried in the public English
        site press index.

target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    Canonical target is the KR FSC + Office for Government Policy
    Coordination joint directive, addressed to (a) Korean crypto
    exchanges operating fiat on/off-ramps (real-name verified account
    mandate, anonymous virtual account ban, minor/foreign-national
    account ban), and (b) Korean regulated financial institutions
    (prohibition on buying, holding, or investing in crypto-assets).
    Affected named exchanges in the 2017-12 / 2018-01 window include
    Upbit, Bithumb, Coinone, and Korbit; these are recorded as implicit
    second-order targets in observation scope rather than enumerated in
    canonical_domains, matching the sibling korea-fsc-ico-ban-2017 and
    china-pboc-crypto-ban-2021 convention.
  actor_type: korean_crypto_ecosystem
  actor_name: KR regulated VASP + financial-institution sector (class)
  chains: []
  canonical_domains: []

jurisdiction:
  - KR

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The 2017-12-13 emergency measure does not direct ISP-level domain
      blocking or DNS interference. Korean network-layer treatment of
      crypto-exchange domains is not part of this trigger. L0
      not_applicable consistent with sibling banking-and-exchange-rail
      nation-state events (korea-fsc-ico-ban-2017, China 2013, China 2021,
      India 2018, Turkey 2021).
  - layer: l1_consensus
    status: not_applicable
    note: |
      The Ethereum Merge (2022-09-15) is ~5 years downstream of the
      2017-12-13 trigger; the post-Merge PBS relay-filter primitive that
      the L1 layer measures did not exist. not_applicable on
      construct-did-not-exist grounds, consistent with sibling pre-Merge
      nation-state events.
  - layer: l3_rpc
    status: not_applicable
    note: |
      Flashbots Protect launched 2022-11 and MEV-Blocker launched
      2023-03-27. The public-RPC compliance substrate that the L3 layer
      measures did not exist in 2017. not_applicable on
      construct-did-not-exist grounds.
  - layer: l4_frontend
    status: not_measured
    scope:
      - upbit.com
      - bithumb.com
      - coinone.co.kr
      - korbit.co.kr
    note: |
      Korean crypto exchange frontends (Upbit, Bithumb, Coinone, Korbit)
      added real-name-account onboarding flows and anonymous-account
      deprecation notices on their homepages and account-onboarding
      pages across 2017-12 / 2018-01 in compliance with the FSC mandate.
      Wayback bracketing of those snapshots is plausibly feasible but
      specific snapshot URLs have not been pinned in this authoring
      pass. L4 remains not_measured pending the Wayback-capture pass.
  - layer: asset_onchain
    status: not_applicable
    note: |
      The FSC directive does not engage an issuer-side blacklist or
      freeze admin method on any chain. The 2017 trigger predates the
      stablecoin-issuer admin-freeze regime that the asset_onchain layer
      measures. not_applicable on construct-did-not-exist grounds.
  - layer: offramp_cex
    status: measured
    scope:
      - upbit
      - bithumb
      - coinone
      - korbit
    note: |
      The 2017-12-13 emergency measure is by construction a regulated-
      VASP and regulated-financial-institution event: it mandates
      real-name verified bank accounts for crypto exchange deposits/
      withdrawals, bans anonymous virtual accounts, prohibits minors
      and foreign nationals from opening Korean exchange accounts, and
      prohibits regulated financial institutions from buying, holding,
      or investing in crypto-assets. The four dominant Korean crypto
      exchanges (Upbit, Bithumb, Coinone, Korbit) complied across
      Q4-2017 / Q1-2018; the operational effective date for the
      real-name banking mandate was 2018-01-30 per the FSC 2018-01-23
      confirmation. The FSC directive itself names the regulatory
      mandate, giving direct attribution at this layer. Marked
      measured; load-bearing observation attached below as
      observation_kind=observed_change with attribution=direct.

