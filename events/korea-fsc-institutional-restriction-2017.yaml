analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-4 audit (S4 comparison) by
  human:xiangwen as empirical_case. FSC press release Wayback 20210627154808
  (primary_legal) + WeLiveSecurity Wayback 20180123164626 (semi_primary_wayback)
  replayable body_hash. offramp_cex observed_change/direct retained (FSC primary
  pinned). Korea FSC 2017-12-28 / 2018-01 real-name-account + institutional
  restriction (no anonymous virtual-accounts; banks blocked from crypto-exchange
  virtual accounts). comparison/empirical_case preserved.

  **NEW EVENT AUTHORED — DRYRUN 2026-05-17** (Phase A.4 non_us_state
  discovery; lean run): authored by LLM agent without personally
  verifying Wayback/body_hash anchors; status=draft, origin=agent_draft.
  Real release requires human-verified audit pass to replace the DRYRUN
  marker after pinning real archive anchors.

  Foundational Asia regulator action. South Korea's FSC 2017-12-13
  emergency measure is the immediate downstream sibling to the
  korea-fsc-ico-ban-2017 (2017-09-29) trigger: where the September order
  closed token-issuance fundraising and crypto-margin products at
  regulated financial institutions, the December order closed the fiat
  banking-rail loophole by mandating real-name verified bank accounts
  for Korean crypto exchange deposits/withdrawals and prohibiting
  institutional crypto holdings. The 2018-01-30 effective date is
  operational follow-through. This event and korea-fsc-ico-ban-2017
  together form the canonical Korean 2017 regulator stack;
  korea-travel-rule-2022 traces the longitudinal extension to the
  metadata-layer KYC regime.

  Per codebook §5.1, trigger.type=regulatory_enforcement is the canonical
  fit: the actor is a non-US national regulator (KR FSC) and the action
  is administrative (real-name account mandate, institutional crypto
  prohibition), not a network/payment-rail block. Per §5.2,
  research_stratum=S4_nation_state is permitted with
  trigger.type=regulatory_enforcement.

  Substantive findings:
  - First major nation-state KYC-mandated crypto regime: real-name
    verified bank accounts required for Korean crypto exchange
    deposits/withdrawals.
  - Anonymous virtual accounts at Korean exchanges banned.
  - Minors and foreign nationals barred from opening Korean crypto
    exchange accounts.
  - Regulated financial institutions prohibited from buying, holding,
    or investing in crypto-assets.
  - Effective date for the banking-rail real-name mandate: 2018-01-30
    (per FSC 2018-01-23 confirmation).
  - Observed cascade: Upbit / Bithumb / Coinone / Korbit complied
    across Q4-2017 and Q1-2018.

  Why temporal_tier=comparable_main_2017_present and
  analysis_use=comparable_analysis: 2017-12-13 sits in the 2017+
  comparable corpus; matches sibling korea-fsc-ico-ban-2017 and
  korea-travel-rule-2022 treatment for cross-jurisdiction analysis.

  Why empirical_case rather than anchor_case: the LLM authoring
  constraint in this pass is that Wayback captures for the L4 frontend
  reactions at Upbit / Bithumb / Coinone / Korbit homepages have not
  been personally re-verified, and the FSC press-release English-site
  index has drifted URL path format since 2017 (year-prefix Wayback
  lookup only). Per project convention, anchor_case promotion requires
  the actual Wayback-capture pass on L4 frontend evidence; until that
  lands, the event admits at empirical_case on the strength of the
  direct-attribution offramp_cex observation. Conservative-default
  rule (§8.4) applied.

  Why L0/L1/L3/asset_onchain are not_applicable: the FSC directive is
  a banking-and-exchange-rail action, not a network-layer block; the
  Ethereum PBS-era L1/L3 measurement primitives do not exist in 2017;
  the stablecoin-issuer admin-freeze regime that the asset_onchain
  layer measures predates this trigger. Consistent with sibling
  korea-fsc-ico-ban-2017.

scoped_claim: |
  The KR FSC 2017-12-13 joint government emergency measure mandated
  real-name verified bank accounts at Korean crypto exchanges, banned
  anonymous virtual accounts, barred minors and foreign nationals from
  opening Korean exchange accounts, and prohibited regulated financial
  institutions from buying, holding, or investing in crypto-assets,
  with the banking-rail real-name mandate effective 2018-01-30 and the
  regulated Korean crypto-exchange sector (Upbit, Bithumb, Coinone,
  Korbit) complying across Q4-2017 / Q1-2018. The offramp_cex layer
  carries the load-bearing direct-attribution observation; L4 frontend
  reactions are consistent with the cascade but require a Wayback-
  capture pass before they may anchor a separate observed_change row.

scoped_knowledge: |
  Foundational Asia regulator action and the first major nation-state
  KYC-mandated crypto regime. Together with korea-fsc-ico-ban-2017
  (2017-09-29), the 2017-12-13 emergency measure forms the canonical
  Korean 2017 regulator stack: September closed token-issuance
  fundraising and institutional crypto-margin products, December closed
  the fiat banking-rail loophole via real-name account mandate and
  institutional crypto prohibition. The 2018-01-30 operational
  effective date is a coda of the same regulatory action.
  korea-travel-rule-2022 traces the longitudinal extension to
  metadata-layer KYC. The cascade shape is comparison-not-cascade
  because construct-did-not-exist layers (L1, L3, asset_onchain) and
  the policy scope (regulated-VASP and regulated-FI rail only, not
  network layer) limited the observable cross-layer surface.

