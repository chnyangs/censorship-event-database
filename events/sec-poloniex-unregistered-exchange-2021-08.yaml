analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: read the event +
  the captured SEC primary source confirming the unregistered-exchange/offering charge and the
  platform-restriction effect; §9 enforcement-censorship; clean per wave-2 verify; validate.py [OK]).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission). S3 SEC securities-
  enforcement event, comparable_main tier. The 2021-08-09 settled SEC
  order found Poloniex LLC operated an unregistered national securities
  exchange (July 2017 - November 2019, when the platform was sold), with
  ~$10.4M in disgorgement + prejudgment interest + civil penalty and a
  cease-and-desist. comparison shape: 1 observed_change layer
  (offramp_cex), attribution=direct — Poloniex is itself a centralized
  off-ramp and the order names the operator and directly restricts the
  unregistered-exchange operation. asset_onchain not_applicable per §1.6
  (settled monetary order / cease-and-desist, not an on-chain action —
  no primary_onchain tx_hash exists or can exist). L0/L1/L3/L4
  not_applicable (no network reachability, consensus, RPC, or frontend-
  takedown remedy; the order did not shut poloniex.com). §9 in scope: a
  state enforcement action restricting a legitimate operating exchange
  (registration-failure charge, not a fraud/scam prosecution). NOTE for
  human audit: the candidate one_line asserted the action "contributed to
  the platform's exit from the US market and delisting of tokens deemed
  securities" — the captured SEC press release does NOT state a US-market
  exit or specific token delistings as a consequence of this order (it
  notes Poloniex had already sold its platform in Nov 2019); those
  downstream claims are therefore NOT carried in this row to avoid
  fabrication. The row asserts only what the order states: the
  unregistered-exchange finding + monetary remedy + cease-and-desist.
  Sources verified via WebSearch 2026-05-31; SEC press release 2021-147
  captured (same-day Wayback) + body_hash-pinned and grep-confirmed (no
  fabrication). Awaiting human audit before promotion from draft.

scoped_claim: |
  "The 2021-08-09 settled SEC order against Poloniex LLC (unregistered
  digital asset securities exchange, July 2017 - November 2019; ~$10.4M
  disgorgement + interest + penalty + cease-and-desist) is recorded as a
  single-layer offramp_cex named-operator restriction, attribution=
  direct. The row does not claim ISP-level blocking, a frontend takedown,
  an on-chain freeze, a US-market exit, or specific token delistings
  (none of which are stated in the captured SEC order)."

