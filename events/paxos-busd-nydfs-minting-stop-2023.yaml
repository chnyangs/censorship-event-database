            - 2023-03-13T23:59:59Z
        note: |
          Paxos newsroom post: customer-facing announcement that the firm
          will end the BUSD relationship with Binance and halt minting of
          new BUSD tokens at the NYDFS's direction. attribution=plausible
          because the announcement page itself is the change at the
          frontend surface; the load-bearing cascade observation is the
