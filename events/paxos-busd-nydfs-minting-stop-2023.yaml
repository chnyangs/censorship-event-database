  comparison — S5 corporate-policy-change event documenting a regulator-
  directed issuer mint cessation at the ERC-20 supply-controller layer.
  Pairs with circle-usdc-tornado-2022 and tether-retroactive-sweep-2023
  in the stablecoin-issuer-action thread: where Circle (2022-08-08) and
  Tether (2023-12-09) executed address-level blacklist actions in
  response to OFAC SDN designations, the Paxos BUSD case is a different
  shape — the issuer ceases the entire mint function rather than
  blacklisting specific addresses, and the trigger is a state-regulator
  (NYDFS) directive rather than a federal sanctions action. The pair
  anchors the cross-issuer comparison axis: address-set freeze (Circle,
  Tether) vs. supply-function shutdown (Paxos), and OFAC-driven (Circle,
  Tether) vs. NYDFS-driven (Paxos). The asset_onchain layer is the
  load-bearing surface in all three; frontend / off-ramp observations
  are secondary surfaces.

scoped_claim: |
  "The 2023-02-13 NYDFS-directed Paxos cessation of BUSD minting realizes
  as an on-chain ERC-20 SupplyController shutdown on the BUSD contract
  (0x4Fabb145d64652a948d72533023f6E7A623C7C53): the `increaseSupply`
  mint function ceases to be invoked after the 2023-02-21 cutoff, and
  total BUSD supply decreases monotonically thereafter via redemption-
  driven `decreaseSupply` burns. Coded as an S5 stablecoin-issuer
  supply-function shutdown with NYDFS as the proximate regulator,
  distinct from the OFAC-driven address-set freezes of Circle USDC
  (2022-08-08) and Tether USDT (2023-12-09)."

