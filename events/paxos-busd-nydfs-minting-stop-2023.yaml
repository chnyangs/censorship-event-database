trigger:
  type: corporate_policy_change
  actor: paxos_trust
  timestamp: 2023-02-13T00:00:00Z
  timestamp_precision: day
  citation:
    - type: primary_corporate
      url: https://paxos.com/2023/02/13/paxos-will-halt-minting-new-busd-tokens/
      wayback: https://web.archive.org/web/20260516000000/https://paxos.com/2023/02/13/paxos-will-halt-minting-new-busd-tokens/
      note: |
        Paxos newsroom announcement (2023-02-13): "Paxos Will Halt Minting
        New BUSD Tokens." Paxos explicitly states that it will end its
        relationship with Binance for the branded BUSD stablecoin and
        cease the issuance of new BUSD tokens, citing instructions from
        the New York State Department of Financial Services (NYDFS). The
        statement also references the concurrent SEC Wells notice
        regarding BUSD. Paxos commits to continued 1:1 redemption support
        for existing BUSD holders.
    - type: primary_legal
      url: https://www.dfs.ny.gov/consumers/alerts/Paxos_and_Binance
      wayback: https://web.archive.org/web/20260516000000/https://www.dfs.ny.gov/consumers/alerts/Paxos_and_Binance
      note: |
        NYDFS Consumer Alert: "Paxos and Binance." NYDFS confirms that it
        ordered Paxos Trust Company to cease issuance of BUSD as a result
        of unresolved issues related to Paxos's oversight of its
        relationship with Binance regarding the branded BUSD stablecoin.
        Primary legal anchor for the corporate-policy trigger; the alert
        also addresses redemption and consumer-protection assurances for
        existing BUSD holders.
  timestamp_sources:
    - type: primary_corporate
      note: Day-level timing per Paxos newsroom announcement (2023-02-13) and concurrent NYDFS consumer alert.

target:
  kind: asset
  asset: paxos_issued_busd
  actor_type: stablecoin_issuer_action
  actor_name: Paxos Trust Company (BUSD issuer)
  chains: [ethereum]
  canonical_domains:
    - paxos.com
    - binance.com

jurisdiction: [US, corporate_global]

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      No network-layer blocking observed; the cascade surface is
      issuer-level mint cessation on Ethereum mainnet, not ISP / DNS
      filtering of paxos.com or binance.com.
  - layer: l1_consensus
    status: not_applicable
    chain: ethereum
    note: |
      Post-Merge, but the action is an issuer-level policy change at the
      ERC-20 supply-controller layer, not a PBS / validator-level
      censorship signal.
  - layer: l3_rpc
    status: not_applicable
    note: |
      Public RPC providers' filter lists are not implicated by an issuer
      mint cessation. No BUSD-specific RPC rejection or docs/status-page
      change is pinned.
  - layer: l4_frontend
    status: measured
    scope: [paxos.com, binance.com]
    note: |
      Paxos.com newsroom hosted the 2023-02-13 announcement of the BUSD
      mint-cessation policy; Binance.com USD-product surfaces subsequently
      updated to reflect that no new BUSD would be issued. Frontend
      observability is the announcement surface, not the load-bearing
      cascade layer.
  - layer: asset_onchain
    status: measured
    chain: ethereum
    scope: [busd_erc20_contract]
    note: |
      Load-bearing layer. BUSD ERC-20 contract
      0x4Fabb145d64652a948d72533023f6E7A623C7C53 on Ethereum mainnet:
      the SupplyController-bound `increaseSupply` mint function ceased
      to be invoked after the 2023-02-21 cutoff. The cessation is
      replayable from public Etherscan history of internal supply-
      controller calls; no further mint events follow. Total supply
      monotonically decreases thereafter via redemption-driven
      `decreaseSupply` burns.
  - layer: offramp_cex
    status: not_applicable
    note: |
      Centralized-exchange listings of BUSD persisted beyond 2023-02-13;
      the cascade surface is the issuer's on-chain mint cessation, not
      a CEX delisting action. Downstream CEX BUSD-pair removals (e.g.,
      Binance's own 2023-09 BUSD-support sunset) are tracked separately
      as distinct events.

