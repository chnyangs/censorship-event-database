  - layer: asset_onchain
    actor: paxos_busd_supply_controller
    event: busd_increasesupply_mint_cessation_after_2023_02_21
    observation_kind: observed_change
    attribution: direct
    timestamp: 2023-02-21T00:00:00Z
    precision: day
    sources:
      - type: primary_corporate
        url: https://etherscan.io/address/0x4Fabb145d64652a948d72533023f6E7A623C7C53
        wayback: https://web.archive.org/web/20260516000000/https://etherscan.io/address/0x4Fabb145d64652a948d72533023f6E7A623C7C53
        scope_descriptor:
          providers: [ethereum_mainnet_etherscan]
          time_window:
            - 2023-02-13T00:00:00Z
            - 2024-02-13T23:59:59Z
        note: |
          Etherscan contract page for the BUSD ERC-20 token
          (0x4Fabb145d64652a948d72533023f6E7A623C7C53). The contract
          exposes a SupplyController-bound `increaseSupply(uint256)` mint
          function that, prior to 2023-02-21, was called periodically by
          the Paxos supply controller to mint new BUSD against off-chain
          USD reserves. After the 2023-02-21 cutoff, no further
          `increaseSupply` calls are observed in the contract's event
          history; total supply monotonically declines thereafter via
          redemption-driven `decreaseSupply` burns. attribution=direct
          because Paxos's 2023-02-13 NYDFS-directed announcement
          explicitly commits to ending new BUSD issuance, and the
          on-chain mint-event absence is the literal execution of that
          commitment.
      - type: primary_corporate
        url: https://paxos.com/2023/02/13/paxos-will-halt-minting-new-busd-tokens/
        wayback: https://web.archive.org/web/20260516000000/https://paxos.com/2023/02/13/paxos-will-halt-minting-new-busd-tokens/
        note: |
          Paxos newsroom announcement is the corporate-policy anchor that
          the on-chain `increaseSupply` cessation realizes. The
          announcement explicitly cites NYDFS instructions and commits to
          ceasing new BUSD issuance while preserving 1:1 redemption for
          existing holders — directly consistent with the observed
          post-2023-02-21 supply-only-decreases pattern.

analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase 4 of 2026-05-16
  staged-release plan, promoted from
  candidate_triggers/paxos-busd-nydfs-minting-stop-2023.yaml per Agent C
