  cessation of BUSD minting. Paxos's newsroom announcement explicitly
  cites NYDFS instructions and the concurrent SEC Wells notice on BUSD;
  the issuer-side action realizes as observable on-chain mint cessation
  on the BUSD ERC-20 contract
  0x4Fabb145d64652a948d72533023f6E7A623C7C53. The SupplyController-
  bound `increaseSupply` function is unused after 2023-02-21, with
  total supply monotonically decreasing thereafter via redemption-driven
  `decreaseSupply` burns. For a real release, replace this DRYRUN marker
  after human audit and (a) flip origin to `human_reviewed`, (b) replace
  wayback URL stubs with verified captures plus body_hash / body_path
  artifacts for the Paxos newsroom post, NYDFS consumer alert, and
  Etherscan contract page, (c) pin a primary_onchain source with the
