    status: not_applicable
    note: |
      Self-discipline initiative is an industry-platform-level
      restriction on secondary trading UIs and primary-sale RMB
      denomination; it does not map to ISP-level L0 reachability of
      external domains. (Parent PBOC virtual-currency event covers the
      L0 axis for offshore crypto exchanges in CN.)
  - layer: l1_consensus
    status: not_applicable
    note: |
      PRC digital-collectibles platforms operate on permissioned
      consortium chains (e.g., Ant Chain, Tencent's Zhixin Chain), not
      Ethereum PBS-era public consensus. L1 consensus filtering as
      defined for the comparable corpus does not apply.
  - layer: l3_rpc
    status: not_applicable
    note: |
      Permissioned-chain primitive; the public Ethereum RPC substrate
      (Flashbots Protect, MEV-Blocker) does not apply.
  - layer: l4_frontend
    status: partially_measured
    scope:
      - tencent_huanhe
      - alibaba_phoenix
    note: |
      Permissioned-platform frontends (Tencent Huanhe, Alibaba/Ant
      Group Phoenix) removed or restricted secondary-trading UI
      elements following the 2022-06-30 self-discipline initiative,
      keeping only primary-sale flows with RMB-denominated payment and
      real-name authentication. Replayable Wayback diffs of the
      affected platform UIs are deferred; contextual_unarchived
      sourcing via press coverage in this draft.
  - layer: asset_onchain
    status: partially_measured
    scope:
      - permissioned_consortium_chains
    note: |
      Mapped from the original "asset_issuance" axis: token issuance on
      PRC digital-collectibles permissioned consortium chains was
      restricted to primary-sale flows (no secondary transfer) under
      the self-discipline initiative. Scope narrowed to the
      primary/secondary distinction rather than blanket issuance
      cessation; the platforms continued to mint primary collectibles
      after 2022-06-30. Replayable on-chain artifacts for the
      consortium chains are not yet pinned in this session.
  - layer: offramp_cex
    status: not_applicable
    note: |
      PRC digital-collectibles platforms are not CEX off-ramps in the
      sense of the comparable corpus (no RMB-to-crypto fiat off-ramp).
      Off-ramp severance for offshore crypto exchanges is recorded
      under the parent china-pboc-crypto-ban-2021 event.

