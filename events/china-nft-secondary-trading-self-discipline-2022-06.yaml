analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (agent_draft per user
  instruction; status=draft because no body_hash+body_path archive
  anchors have been pinned in this session). Authored by LLM agent
  without personally verifying Wayback/body_hash; human review
  required to elevate to admitted status.

  Industry self-regulatory event recorded under research_stratum
  S4_nation_state and trigger.type nation_state_block because the
  closest enum match captures the state-directed character of the
  PRC industry-association joint initiative, even though the
  instrument is a self-discipline pact rather than a formal state
  order. Three industry self-regulatory bodies (China Banking
  Association, Internet Society of China, Securities Association of
  China) issued the 2022-06-30 "Digital Collectible Industry
  Self-Discipline Development Initiative" with approximately 30
  platform signatories including Tencent, Ant Group, JD.com, and
  Baidu. The 14-article pact (i) bans secondary trading of NFTs
  ("digital collectibles"), (ii) restricts denomination/settlement to
  RMB legal tender on primary sales, (iii) requires real-name
  authentication for issuers, sellers, and buyers, and (iv) mandates
  "secure and controllable" blockchain implementations
  (i.e., permissioned consortium chains).

  Two comparison observations are recorded:
  (1) l4_frontend — secondary-trading UI removal on permissioned
  platform frontends (Tencent Huanhe, Alibaba Phoenix);
  (2) asset_onchain — token issuance restricted to primary-sale
  flows on permissioned consortium chains, mapping the original
  "asset_issuance" axis to the schema's asset_onchain layer with
  scope narrowed to the primary/secondary distinction rather than
  blanket issuance cessation. Both observations carry
  attribution=plausible because the instrument is industry
  self-regulation under state direction rather than a binding state
  order, and per-platform UI / consortium-chain transfer-disable
  artifacts have not been pinned to body_hash+body_path anchors in
  this session.

  Cross-event anchor to china-pboc-crypto-ban-2021: the PBOC
  2021-09-24 joint notice declared offshore crypto-related business
  activities illegal in the PRC; this 2022-06-30 NFT initiative
  extends the cordoning of crypto-asset commerce in CN to the
  domestic permissioned-NFT segment by foreclosing secondary
  trading and pegging primary sales to RMB legal tender.

scoped_claim: |
  On 2022-06-30, three PRC industry self-regulatory bodies (China
  Banking Association, Internet Society of China, Securities
  Association of China) issued a 14-article self-discipline
  initiative co-signed by approximately 30 platform signatories
  (including Tencent Huanhe and Alibaba/Ant Group Phoenix) that
  banned secondary trading of NFTs ("digital collectibles") and
  restricted primary sales to RMB-denominated, real-name-authenticated
  flows on permissioned consortium chains. Observational axes at
  l4_frontend (secondary-trading UI removal) and asset_onchain
  (issuance restricted to primary-only). Admission-anchor-grade
  promotion pending pinned platform / consortium-chain artifacts.

