recovery:
  - layer: offramp_cex
    resolved: true
    resolved_timestamp: 2023-02-21T03:00:00Z
    citation:
      - type: supporting_journalism
        url: https://www.coindesk.com/policy/2023/02/20/ftx-japan-customers-can-begin-withdrawing-fiat-crypto-on-feb-21
        wayback: https://web.archive.org/web/2023/https://www.coindesk.com/policy/2023/02/20/ftx-japan-customers-can-begin-withdrawing-fiat-crypto-on-feb-21
        evidence_use: contextual_unarchived
        note: |
          CoinDesk (2023-02-20): "FTX Japan Customers Can Begin
          Withdrawing Fiat, Crypto on Feb. 21." Withdrawals resumed at
          12:00 JST on 2023-02-21 (~03:00 UTC) via the Liquid Japan
          web platform; FTX Japan customers were required to transfer
          balances to a Liquid Japan account before withdrawal. The
          refund channel was authorised under the FIEA domestic-
          asset-retention regime and operated independent of the US
          Chapter 11 estate distribution process, fulfilling the
          structural counterfactual that distinguishes this row from
          the US FTX collapse.
    note: |
      Recovery is partial in the corporate-continuity sense (FTX Japan
      was sold by the US estate in 2023 and wound down) but complete in
      the customer-asset-rail sense: Japanese customers received their
      JPY and crypto balances back in full via the Liquid Japan
      platform starting 2023-02-21, in contrast to the US FTX.com /
      FTX.US customers who remained in Chapter 11 distribution
      proceedings for years.

analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-4 audit (S4 comparison/Japan FSA cluster)
  by human:xiangwen as empirical_case. FSA Kanto-LFB administrative-action
  pages captured: JP Wayback 20221110133726 + EN Wayback 20221111104403
  (both primary_legal, contemporaneous, replayable body_hash). offramp_cex
  observed_change/direct retained (FSA primary sources pinned). FSA 2022-11-10
  業務停止命令 + 業務改善命令 + 資産国内保有命令 to FTX Japan post-FTX
  collapse; withdrawal-rail freeze + JP-domestic asset retention (cleanest
  cross-border parent-cascade case). comparison/empirical_case preserved.

  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase F new-event draft;
  cross-border parent-cascade discovery): authored by LLM agent without
  personally verifying Wayback/body_hash; origin=agent_draft + status=draft
  per validator constraints. Real release must promote to
  origin=human_reviewed after pinning real archive anchors during human
  audit.

  Comparison documenting Japan's 2022-11-10 Kanto Local Finance Bureau
  business-suspension order, business-improvement order, and order to
  retain assets domestically against FTX Japan KK, issued one day before
  the US parent's 2022-11-11 Chapter 11 filing. The cleanest cross-border
  parent-cascade case in the corpus: Japanese customer-asset-segregation
  rules under the Payment Services Act (分別管理 trust-based separation)
  combined with the FIEA-mandated domestic-asset-retention order forced
  FTX Japan to refund Japanese customers via the Liquid Japan platform
  starting 2023-02-21, ahead of and independent of the US Chapter 11
  estate distribution. The structural counterfactual is what makes this
  row analytically load-bearing: the same parent corporate collapse
  produced (in the US) a years-long Chapter 11 customer-asset freeze and
  (in Japan) a ~3.5-month regulator-supervised refund cycle.

  Paper-relevant contrast vs FTX Bankman-Fried DOJ
  (ftx-bankman-fried-doj-2022): same parent collapse, opposite jurisdiction
  outcome. US row: offramp_cex freeze with attribution=plausible to the
  2022-12-13 federal trigger because the Chapter 11 instrument did the
  proximate freezing; recovery is bankruptcy-estate distribution years
  later. JP row: offramp_cex freeze with attribution=direct to the
  2022-11-10 Kanto LFB orders because the Japanese regulator overrode
  the parent-company policy via supervisory directive; recovery is the
  2023-02-21 Liquid Japan refund channel ~3.5 months after the trigger.
  Demonstrates that the same parent-collapse shock can produce sharply
  different customer-outcome cascades when jurisdictional asset-
  segregation regimes diverge.

  Paper-relevant contrast vs Japan FSA Coincheck Orders
  (japan-fsa-coincheck-orders-2018): both are Kanto LFB / FSA supervisory
  cascades targeting registered Japanese VASPs with combined business-
  suspension + business-improvement orders. Coincheck case (2018):
  trigger was a domestic security failure (NEM hack), ~5-month
  withdrawal freeze, single-entity supervision under PSA only. FTX
  Japan case (2022): trigger was a cross-border parent-company failure
  (US FTX collapse), ~3.5-month freeze, dual-statute (PSA + FIEA)
  supervision plus the asset-domestic-retention order that has no
  parallel in the Coincheck cascade. Together the two events
  demonstrate that the Japan FSA supervisory cascade is reusable across
  both endogenous (Coincheck-style) and exogenous (FTX Japan-style)
  shocks, with the FIEA domestic-retention add-on as the
  cross-border-specific instrument.

  DRYRUN caveats: trigger primary citation (FSA 2022-11-10 release) and
  recovery citation (CoinDesk 2023-02-20) are asserted with wildcard
  Wayback pointers; pinned snapshot timestamps + body_hash captures for
  each specific permalink are deferred to the human-audit pass. For
  non-DRYRUN release, capture body_hash + body_path for: (1) the FSA's
  2022-11-10 Japanese-language release at fsa.go.jp/news/r4/sonota/
  20221110/20221110.html, (2) the FSA's English-language version at
  fsa.go.jp/en/news/2022/20221111/20221110.html, (3) FTX Japan's
  2022-11-09 withdrawal-halt customer notice, (4) the 2023-02-20
  Liquid Japan refund-channel announcement, and (5) the Kanto LFB
  page at lfb.mof.go.jp/kantou/. Marked evidence_use=
  contextual_unarchived on all citations to flag the unarchived state
  per validator policy.

scoped_claim: |
  "Japan's 2022-11-10 Kanto Local Finance Bureau business-suspension
  order, business-improvement order, and order to retain assets
  domestically against FTX Japan KK (issued one day before the US
  parent's 2022-11-11 Chapter 11 filing) directly compelled the
  FTX Japan operator-state change of customer-withdrawal-rail freeze
  (both crypto-asset and JPY fiat withdrawals) and Japan-domestic
  retention of customer-segregated assets across the 2022-11-09 to
  2023-02-20 window, with recovery via the 2023-02-21 customer-asset
  refund channel through the Liquid Japan web platform. The row does
  not claim frontend-disable, ISP/DNS-level connectivity blocking,
  on-chain asset-layer freeze, or class-wide Japanese VASP-cohort
  suspension — only the single-entity FTX-Japan-cohort offramp_cex
  load-bearing axis under the Payment Services Act and Financial
  Instruments and Exchange Act supervisory regime."

