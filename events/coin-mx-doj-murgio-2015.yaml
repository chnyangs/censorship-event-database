analysis_notes: |
  **NEW EVENT AUTHORED - DRYRUN 2026-05-16** (Phase B authoring): new
  historical-baseline event for the 2015-07-21 DOJ SDNY indictment
  of Anthony Murgio and Yuri Lebedev for operating Coin.mx as an
  unlicensed bitcoin exchange. Authored by LLM agent without
  personally verifying Wayback/body_hash; origin=agent_draft and
  status=draft per validator constraint (agent_draft incompatible
  with admitted). Real release must replace this DRYRUN marker
  with a human-verified audit after pinning real archive anchors
  (the wayback URLs here are 2015/2017 wildcard pointers, not
  pinned snapshot timestamps).

  comparison shape: 1 observed_change layer (offramp_cex, Coin.mx
  shutdown + HOPE FCU USD rails severance). The 2015-07-21 SDNY
  indictment charged Murgio and Lebedev with operating Coin.mx in
  violation of 18 U.S.C. Sec. 1960 (unlicensed money transmitting
  business), and additionally charged Murgio with bank fraud and
  obstruction of a financial institution examination tied to his
  2014 capture of HOPE Federal Credit Union as a banking conduit
  for Coin.mx USD flows. Between October 2013 and January 2015,
  Coin.mx exchanged at least $1.8M for Bitcoins on behalf of tens
  of thousands of customers. Murgio pleaded guilty in January 2017
  and was sentenced to 66 months. attribution=direct because the
  indictment named Coin.mx by name and the USD-rails severance
  through HOPE FCU was a direct enforcement consequence of the
  unsealing. Admission tier empirical_case (1 strong-attribution
  observed_change layer).

  Historical-baseline anchor for the DOJ exchange/MSB enforcement
  family in the 2013-2016 era, structurally complementary to the
  2014-01-27 shrem-faiella-bitcoin-exchange-2014 indictment of
  BitInstant CEO Charlie Shrem and the 2015-05-05
  ripple-fincen-xrp-2015 FinCEN/DOJ NPA against Ripple Labs.
  Distinguishing feature: Coin.mx is the first 2013-2016
  historical-baseline DOJ case in which the unlicensed-MSB
  enforcement was paired with capture of a regulated banking
  institution (HOPE FCU) as the USD-rails conduit; the bribery
  and bank-fraud counts substantially raise the criminal-exposure
  profile relative to the Shrem case.

scoped_claim: |
  The 2015-07-21 DOJ SDNY indictment of Anthony R. Murgio and
  Yuri Lebedev for operating Coin.mx as an unlicensed bitcoin
  exchange (with HOPE Federal Credit Union captured as a banking
  conduit and a phony "Collectors Club" front company) produced
  an offramp_cex cascade: Coin.mx shut down post-arrest and the
  USD-rails conduit through HOPE FCU was severed. The row claims
  only this single-layer offramp shutdown observation with
  attribution=direct; no L0/L1/L3/L4/asset-onchain effects are
  coded.

