  anchor is the trustwallet.com Tornado Cash explainer blog post,
  which acknowledges the OFAC designation as background context
  but does NOT describe a sanctioned-token UI warning feature.

  WebSearch 2026-05-17 (queries: "Trust Wallet sanctioned token
  warning UI 2022 OFAC Tornado Cash" and "Trust Wallet UI update
  warning OFAC sanctioned tokens 2022 blacklist") confirmed only
  that (a) industry compliance discussion in 2022-08 distinguished
  custodial-wallet OFAC obligations from non-custodial-wallet
  obligations (Trust Wallet sits in the latter class), and (b)
  Trust Wallet's Terms of Service require users not to be on the
  OFAC SDN list, which is a contractual-policy posture rather
  than a UI-feature behaviour. No specific 2022 UI-update
  announcement was surfaced.

