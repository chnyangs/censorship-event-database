  null_event — S5 corporate-governance counterfactual-contingency row
  documenting the MakerDAO governance community's public 2022-08-18
  debate over Emergency Shutdown contingency planning in response to
  the 2022-08-08 OFAC Tornado Cash SDN designation and Circle's
  parallel USDC freeze of Tornado Cash addresses. The debate canvassed
  three discretionary protocol-level censorship-response postures:
  (1) executing the Maker Protocol Emergency Shutdown Module to wind
  down DAI if core PSM contracts were OFAC-sanctioned; (2) migrating
  ~33% of DAI collateral from USDC/USDP toward ETH; (3) abandoning the
  DAI USD peg entirely (Christensen's de-pegging proposal). None of
  the three discretionary responses was enacted in the 2022-08 window:
  Emergency Shutdown was not triggered, USDC-PSM collateral composition
  remained materially unchanged, and the DAI USD peg was preserved.

  Why null_event / null_case: this is a governance-debate /
  counterfactual-contingency action, not a censorship cascade.
  MakerDAO did NOT execute Emergency Shutdown, did NOT divest USDC
  collateral, did NOT depeg DAI from USD, and did NOT impose any
  discretionary holder restriction or address-level freeze during
  the August 2022 debate window. The debate itself is the artifact;
  the counterfactual contingency framing is the analytical interest.
  Codebook §3: 0 observed_change layers → empirical_shape=null_event;
  codebook §4: 0 strong-attribution observed_change layers →
  admission_tier=null_case.

  observed_no_change construction: attribution=none per codebook §1.1
  (`none` is reserved for observed_no_change and coverage_gap rows).
  Coverage at asset_onchain is partially_measured because the Maker
  Protocol DAI / MKR / PSM-USDC-A / PSM-USDP-A / Emergency Shutdown
  Module contracts are the asset surface the debate speaks to and
  their observable on-chain state is **unchanged** during the
  2022-08-08 to 2022-08-31 scoped window — but no comprehensive
  replayable on-chain audit slice (e.g., a Dune query hash for
  PSM-USDC-A debt-ceiling history or an ESM-trigger transaction
  absence proof) has been pinned in this DRYRUN session. Per
  Kazakhstan-precedent honesty rules, partially_measured is the
  conservative coverage code given the unpinned audit slice.

  Why this row exists despite carrying no observed_change: it
  documents a **foundational DAO-governance-response-to-sanctions
  case** — the first publicly debated discretionary protocol-level
  censorship-response posture by a major DeFi protocol in the wake
  of the OFAC Tornado Cash SDN designation. The row scopes the
  denominator for "S5 DAO-governance counterfactual responses to
  upstream OFAC triggers" so that the numerator enacted-response
  rows in S5 (e.g., the parallel Aave Tornado frontend block
  2022-08, the dYdX Tornado account block 2022-08, the Circle USDC
  Tornado freeze 2022-08) can be compared against a "debated but
  not enacted" baseline in which a major DeFi governance community
  weighed Emergency Shutdown and de-pegging but ultimately
  preserved protocol parameters. Sibling-event linkage to
  tornado-cash-ofac-2022 (the upstream trigger), circle-usdc-
  tornado-2022 (the parallel S5 enacted freeze that motivated the
  contingency debate), and aave-arc-fireblocks-whitelist-2022-01
  (the earlier S5 protocol-architecture permissioning case that
  contrasts with MakerDAO's "preserve-the-protocol" posture).

  L0 / L1 / L3 / l4_frontend / offramp_cex are not_applicable on
  substrate-mismatch grounds — a DAO governance contingency debate
  engages no network / consensus / RPC / frontend / CEX off-ramp
  surface. asset_onchain is partially_measured rather than
  not_applicable because the Maker Protocol contracts ARE the
  asset surface the debate speaks to, but no row-local on-chain
  change is captured: the protocol continues operating with the
  same USDC-PSM collateral composition, the same DAI USD peg, and
  the Emergency Shutdown Module in standby.

  Promotion path: this row stays at admission_tier=null_case /
  empirical_shape=null_event by design — it is a governance-debate
  counterfactual-contingency denominator-control row. Human audit
  should focus on pinning body_hash captures of The Defiant /
