analysis_notes: |
  **SOURCE REPAIR 2026-06-02** Pinned a replayable Wayback capture of MAS's
  official 2022-11-21 statement addressing Binance/FTX. The statement confirms
  that Binance was placed on the Investor Alert List because it solicited
  Singapore users without a licence, that MAS referred Binance for possible PS
  Act contravention, and that MAS required Binance to stop soliciting Singapore
  users. It also confirms Binance's responsive measures: Singapore IP
  geo-blocking and Singapore app-store removal to demonstrate cessation of
  solicitation/provision of services. Removed `evidence_tier=attested_secondary`,
  upgraded `primary_source_verified=true`, and upgraded the two observation
  attributions to direct while keeping the 2021-09-02 trigger timestamp anchored
  to the contemporaneous CNA report.

  **QUALITY-LOOP REPAIR 2026-06-01** (automated source repair; no new
  human-audit stamp). This row previously relied on generic MAS news-index
  citations and made an unpinned slow-cascade claim about Binance Asia
  Services / binance.sg licence withdrawal and a 2022-02 operational exit.
  The repair pins replayable Wayback captures for the contemporaneous CNA
  trigger report and two first-party Binance support announcements, then
  narrows the admitted empirical content to those captured bodies.

  Comparison documenting the 2021-09-02 Monetary Authority of Singapore
  (MAS) Investor Alert List placement / Payment Services Act order against
  Binance.com and Binance.com's subsequent Singapore-user service
  restrictions. Sibling case to the 2021 global Binance regulator wave: UK
  FCA 2021-06-26, Malaysia SC 2021-07-30, and Netherlands DNB 2021-08-18.

  MAS's official 2022 statement is retrospective rather than contemporaneous,
  so the row keeps the CNA report as the timestamp anchor for the 2021-09-02
  Investor Alert List / stop-solicitation order. The response side is now
  directly attributed: Binance's 2021-09-05 announcement supports the SGD
  pairs/payment-options and app-store removal claim, Binance's 2021-09-27
  announcement supports the later restriction of Singapore-user access to
  regulated payment services on Binance.com, and MAS confirms the causality and
  high-level response measures. The row makes no retained claim about
  independent binance.sg shutdown timing or local-entity licence withdrawal.

scoped_claim: |
  "MAS's 2021-09-02 Binance.com Investor Alert List / Payment Services Act
  stop-solicitation action is confirmed by MAS's official 2022 statement and
  timestamped by the contemporaneous CNA report. Binance.com then announced
  Singapore-user restrictions in two replayably captured first-party notices:
  on 2021-09-05 it announced cessation of SGD trading pairs, SGD payment
  options, and Singapore app-store availability effective 2021-09-10; on
  2021-09-27 it announced that Singapore users would lose access to fiat
  deposits, spot trading, fiat-channel crypto purchases, and liquid swap
  effective 2021-10-26. The row does not claim L0 blocking, L1 consensus
  impact, L3 RPC filtering, asset-onchain action, or an independently pinned
  2022 binance.sg shutdown observation."

