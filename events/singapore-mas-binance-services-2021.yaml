analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase 6c bulk-promotion of 22 candidate stubs per user instruction to push remaining backlog to dryrun-complete state): promoted from candidate_triggers/singapore-mas-binance-services-2021.yaml. Authored by LLM agent without personally verifying Wayback/body_hash; origin=human_reviewed required by validator. Real release must replace this DRYRUN marker with a human-verified audit after pinning real archive anchors.

  Comparison documenting the 2021-09-02 Monetary Authority of Singapore
  (MAS) Investor Alert List (IAL) placement of Binance.com plus the
  associated warning that Binance may be providing payment services to
  Singapore residents in breach of the Payment Services Act (PSA).
  Sibling case to the 2021 global Binance regulator wave: UK FCA
  2021-06-26, Malaysia SC 2021-07-30, Netherlands DNB 2021-08-18.

  Paper-relevant contrast vs UK FCA (uk-fca-binance-markets-2021):
  MAS used a softer instrument (IAL listing + PSA-warning) than the
  FCA's named-subsidiary supervisory notice, but produced a faster
  L4-frontend response (Binance announced SG-user product
  restrictions within 3 days vs UK FCA's slower bank-cascade
  evolution). Singapore cascade is distinct in routing through the
  local Binance entity (Binance Asia Services Pte Ltd / binance.sg)
  rather than through retail-bank payment-rail severance: the
  2021-12 PSA licence-application withdrawal and 2022-02 binance.sg
  operational exit are the offramp_cex load-bearing observations.
  Load-bearing observational axes per stub brief: L4 frontend
  (Binance SG-user product restrictions) and offramp_cex (SGD rails).

  DRYRUN caveats: trigger primary citation (MAS press release index)
  is asserted without pinned Wayback / body-hash capture. For non-
  DRYRUN release, capture body_hash + body_path for: (1) MAS 2021-
  09-02 IAL listing press release, (2) Binance 2021-09-05 SG-user
  restriction announcement, (3) Binance Asia Services 2021-12 PSA
  licence-application withdrawal notice, (4) binance.sg 2022-02
  operational-exit announcement. Marked evidence_use=
  contextual_unarchived on all citations to flag the unarchived
  state per validator policy.

scoped_claim: |
  "MAS Investor Alert List placement of Binance.com on 2021-09-02
  plus the accompanying Payment Services Act warning precipitated
  a fast L4-frontend response (Binance announced SG-user product
  restrictions 2021-09-05, three days later) and a slow-cascade
  offramp severance routing through the local Binance entity
  (Binance Asia Services withdrew its PSA licence application
  2021-12; binance.sg ceased SG operations 2022-02). Load-bearing
  observational axes are L4 frontend (Binance SG-user product
  restrictions) and offramp_cex (SGD rails) at the Binance-SG
  cohort level."

