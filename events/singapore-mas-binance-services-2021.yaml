coverage:
  - layer: l0_network
    status: not_applicable
    note: MAS IAL listing is a regulatory / investor-alert notice, not a DNS / connectivity action.
  - layer: l1_consensus
    status: not_applicable
  - layer: l3_rpc
    status: not_applicable
  - layer: l4_frontend
    status: measured
    scope: [binance.com]
    note: |
      Binance's 2021-09-05 support announcement states that, effective
      2021-09-10 04:00 UTC, Binance would cease SGD trading pairs, SGD
      payment options, and remove the app from Singapore iOS and Google
      Play stores. MAS's later official statement confirms that Binance put
      in place measures including geo-blocking Singapore IP addresses and
      removing its mobile application from Singapore app stores to assure MAS
      it had ceased soliciting and providing services to Singapore users. The
      retained claim is limited to those Binance.com Singapore-user
      frontend/app surfaces; no broader L0 network block is claimed.
  - layer: asset_onchain
    status: not_applicable
    note: No SDN listing; no stablecoin-issuer freeze primitive applicable.
  - layer: offramp_cex
    status: measured
    scope:
      - binance_com_sg_regulated_payment_services
    note: |
      Binance's 2021-09-27 support announcement states that Singapore
      users would lose access to Binance.com functions including fiat
      deposit services, spot trading, fiat-channel cryptocurrency purchases,
      and liquid swap from 2021-10-26. This repaired row does not retain the
      earlier unpinned claim about Binance Asia Services / binance.sg
      licence withdrawal or the 2022-02 local-platform operational exit. MAS's
      official 2022 statement confirms the causal regulatory mechanism:
      Binance had to stop soliciting Singapore users and the measures were
      intended to demonstrate that it had ceased soliciting and providing
      services to Singapore users.

