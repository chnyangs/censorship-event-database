      No domain seizure or frontend takedown; mtgox.com continued to
      serve a status page during the suspension window.
  - layer: asset_onchain
    status: not_applicable
    chain: bitcoin
    note: |
      Bitcoin native asset has no issuer-side blacklist / freeze admin
