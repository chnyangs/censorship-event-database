  **NEW EVENT AUTHORED - DRYRUN Wave 2.2D 2026-05-17**: authored
  end-to-end by LLM agent for the discovery_only_2007_2012 tier.
  Mt. Gox's 2011-06-19 hack and the 2011-06-20 to 2011-06-26 operator-
  initiated trading suspension is the first major exchange trading
  suspension under operator policy in the Bitcoin offramp record.

  Coding rationale:
  - research_stratum=S5_corporate, trigger.type=corporate_policy_change:
    the proximate trigger is Mt. Gox's own decision to halt trading and
    roll back fraudulent trades, not an external regulator action.
  - attribution=plausible (per §1 codebook): the operator does cite
    the hack as the cause, but the "trigger" is an internal security
    incident rather than a sanction, indictment, or court order. The
    suspension is an operator-policy choice in response to a hack,
    not externally compelled censorship. Conservative coding per §8.4.
  - empirical_shape=comparison: 1 observed_change layer (offramp_cex);
    L0/L1/L3/L4/asset_onchain all not_applicable on construct-did-not-
    exist / out-of-scope grounds.
  - admission_tier=empirical_case: 1 strong-attribution (plausible)
    observed_change layer.
  - temporal_tier=discovery_only_2007_2012, analysis_use=
    discovery_ledger_only: pre-2013 row; not used in main statistical
    denominators.
  - v0.3 source repair pinned the Mt. Gox 2011-06-30 official press
    release via timestamped Wayback body_hash/body_path. The row
    remains draft because human review still needs to confirm the
    precise suspension start and the exact transition from halted
    trading to relaunch on 2011-06-26.

  This row is part of the Mt. Gox cross-event chain: it precedes
  mtgox-coinlab-civil-2013 (civil dispute), mtgox-dhs-dwolla-wells-
  fargo-seizure-2013 (federal seizure trigger), and mtgox-usd-
  withdrawal-suspension-2013-06 (downstream operator action). Status
  remains draft pending real-archive capture and human review.

