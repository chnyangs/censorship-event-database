analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17** (Wave 2.2D; agent_draft per
  user instruction; status=draft because no body_hash+body_path archive
  anchors have been pinned in this session). Authored by LLM agent
  without personally verifying Wayback/body_hash snapshots; human
  review required to elevate to admitted status.

  Structural framing: this is an operator-led shutdown of a
  pioneering leveraged-bitcoin trading platform following two
  successive 2012 intrusions (2012-03 Linode hot-wallet breach
  ~43,000 BTC / ~$220,000, then 2012-05-11 second intrusion
  ~18,547 BTC / ~$87,000-$92,500 plus a parallel Mt. Gox-account
  compromise of $200,000+ affecting Bitcoinica's exchange-held
  balances). The trigger.type=corporate_policy_change captures the
  operator's elective closure decision rather than the upstream
  security incidents themselves. The operator transition (Zhou Tong
  founded Bitcoinica 2011-09; Intersango/Tihan Seale acquired
  operational control early 2012) means the final shutdown decision
  was executed under the Intersango operator umbrella, with formal
  liquidation announced 2012-08-02.

  Attribution coding (§1 codebook): observed_change at offramp_cex
  is attribution=plausible per user instruction. The operator
  publicly cites the hack as proximate cause of the closure, but
  the trigger here is an attacker-driven security event rather
  than a regulator-named target — the operator-shutdown action is
  causally consistent with the hack but is not a regulator-attributed
  compliance action. Conservative coding per §8.4 defaults to the
  more conservative `plausible` over `direct`.

  Stratum coding: trigger.type=corporate_policy_change forces
  research_stratum=S5_corporate per §5.2 validator-enforced
  stratum-actor map. jurisdiction=[corporate_global] because the
  shutdown is jurisdictionally global (no national regulator named)
  and operates on the Bitcoinica corporate-entity surface.

  Layer coverage: l0_network, l1_consensus, l3_rpc, l4_frontend,
  and asset_onchain all not_applicable. l3_rpc on
  construct-did-not-exist grounds (MEV-Boost / Flashbots Protect
  compliance substrates did not exist in 2012). l1/asset_onchain on
  construct-not-in-scope grounds (no Bitcoin L1 consensus action;
  no issuer-asset freeze — the hot-wallet outflows were
  attacker-directed, not operator-directed compliance action).
  l4_frontend not_applicable to avoid double-counting the
  bitcoinica.com trading-UI takedown as a separately measured
  action; it is downstream UI consequent on the operator's
  offramp_cex closure decision. l0_network not_applicable because
  no nation-state ISP/DNS block.

  empirical_shape=comparison: 1 observed_change layer (offramp_cex).
  admission_tier=empirical_case: ≥1 strong-attribution (plausible)
  observed_change layer, but only one load-bearing axis so does not
  reach anchor_case threshold (which requires ≥2 strong-attribution
  observed_change layers).

  temporal_tier=discovery_only_2008_2012 + analysis_use=
