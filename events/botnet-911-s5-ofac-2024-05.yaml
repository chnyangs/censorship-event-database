analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: refined the wave-1
  VERIFY-FLAG. Captured Treasury press release jy2375 substantiates the designation + crypto nexus
  (rendered+grepped: virtual currency + address present). Specific identifiers not in the press release (literal
  address / exact coin / count) were re-attributed to the SDN-list entry rather than asserted as
  captured facts. primary_legal source -> meets admission floor; null_case coding unchanged.).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources
  verified+captured, awaiting human admission). On 2024-05-28 OFAC designated
  the 911 S5 residential-proxy botnet network (Yunhe Wang, Jingping Liu, Yanni
  Zheng + three Thai entities; Treasury jy2375), attaching 49 cryptocurrency
  addresses to Yunhe Wang's SDN entry, alongside the DOJ takedown of the
  botnet (~19M compromised IPs). In scope under codebook §9 (OFAC SDN
  designation). Coded null_event/null_case per the S1 convention (cf. bitriver-
  russia-mining-ofac-2022-04): the designation is the trigger, but no public
  CEX cascade was documented in the 14-day window, no OONI/Censored Planet L0
  replay slice was captured, and no primary_onchain freeze tx was captured for
  the attached addresses, so the measurable cross-layer surface is limited
  (offramp_cex observed_no_change/none). The candidate lead tagged this
  l0_network for the proxy infrastructure, but the censorship action coded here
  is the SDN designation, not a network-layer block; L0 is not_applicable
  absent a replayable measurement. Source verified + captured 2026-05-31
  (Treasury jy2375, body_hash-pinned; no fabrication).

