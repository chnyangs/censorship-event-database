coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The FinCEN/DOJ action is a BSA registration-and-AML enforcement at
      the entity level. It does not direct ISP-level domain blocking or
      DNS interference against ripple.com or any XRP-related host.
      not_applicable on construct-out-of-scope grounds.
  - layer: l1_consensus
    status: not_applicable
    note: |
      XRP Ledger consensus (XRP LCP, federated Byzantine agreement via
      UNLs) in 2015 has no protocol-level relay-filter primitive
      analogous to the post-Merge Ethereum PBS relay surface that the
      L1 layer was constructed to measure. Additionally the Ethereum
      PBS measurement substrate itself is ~7 years downstream
      (2022-09-15 Merge). not_applicable on construct-did-not-exist
      grounds, matching the L1 treatment of other 2013-2016
      historical-baseline events.
  - layer: l3_rpc
    status: not_applicable
    note: |
      The MEV-Boost / Flashbots Protect / MEV-Blocker public-RPC
      compliance substrate that the L3 layer measures did not exist in
      2015 (Flashbots Protect launched 2022-11; MEV-Blocker launched
      2023-03-27). XRP Ledger does not have an analogous public-RPC
      compliance surface. not_applicable on construct-did-not-exist
      grounds.
  - layer: l4_frontend
    status: not_applicable
    note: |
      The FinCEN settlement and DOJ NPA do not require, name, or
      contemplate ripple.com or any XRP-related frontend takedown or
      geo-blocking; the obligations attach to XRP II as a registered
      MSB at the AML-program and SAR-retroactive-review level rather
      than at the public-facing web surface. not_applicable on
      construct-out-of-scope grounds.
  - layer: asset_onchain
    status: not_applicable
    note: |
      XRP native asset has no FinCEN-mandated issuer-side blacklist or
      freeze admin path in this action; the settlement does not direct
      Ripple Labs to freeze or invalidate any specific XRP holdings or
      addresses. The XRP Ledger ecosystem has issuer-managed freeze
      primitives for issued (non-native) tokens via the lsfGlobalFreeze
      and trust-line freeze flags, but the 2015-05-05 FinCEN action
      does not engage that path. not_applicable on construct-out-of-
      scope grounds.
  - layer: offramp_cex
    status: measured
    scope:
      - xrp_ii_llc
    note: |
      Load-bearing layer for this event. The FinCEN settlement is by
      construction an exchanger-compliance action: XRP II, LLC is
      recognized as a FinCEN-registered MSB conducting virtual-
      currency exchange, and the settlement directly mandates a
      structural overhaul of XRP II's AML program (registration,
      SAR-retroactive-review, transaction monitoring, independent
      reviewer, customer-identification program). The FinCEN press
      release names the regulatory mandate explicitly; the post-
      settlement XRP II compliance program change is direct-attribution.
      Marked measured; load-bearing observation attached below as
      observation_kind=observed_change with attribution=direct.

