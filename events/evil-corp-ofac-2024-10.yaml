  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources
  verified+captured, awaiting human admission). On 2024-10-01 OFAC designated
  seven individuals and two entities tied to the Russia-based Evil Corp
  cybercrime syndicate (Dridex / BitPaymer) in a tri-lateral US/UK/AU action
  (Treasury jy2623), including state-nexus enabler Eduard Benderskiy. In scope
  under codebook §9 (OFAC SDN designation). Coded null_event/null_case per the
  S1 convention (cf. bitriver-russia-mining-ofac-2022-04): the designation is
  the trigger, but no public CEX cascade was documented in the 14-day window
  and the SDN entry names individuals/entities with no enumerated on-chain
  addresses, so the measurable cross-layer surface is limited (offramp_cex
  observed_no_change/none; asset_onchain not_applicable). Source verified +
  captured 2026-05-31 (Treasury jy2623, body_hash-pinned; no fabrication).

