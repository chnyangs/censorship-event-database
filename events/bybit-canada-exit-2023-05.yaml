analysis_notes: |
  **SOURCE-STRENGTHENED 2026-06-01** (quality-loop primary-trigger repair):
  pinned Bybit's official 2023-05-30 "Notice on Exit from Canadian Market"
  announcement as a local `body_hash` / `body_path` replay artifact. The row no
  longer uses `evidence_tier=attested_secondary`: the Bybit-authored notice is
  the claim-usable trigger and observed-change anchor. attribution is upgraded
  from plausible to direct for the corporate exit itself; the regulatory
  rationale remains deliberately scoped as generic regulatory-development
  context because the notice does not enumerate a named Bybit-specific CSA
  order.

  **ADMITTED 2026-05-31** (genuine review by human:xiangwen reviewing agent: TASK-2 lower-tier. §9-clear, well-documented deliberate restriction admitted at evidence_tier=attested_secondary (codebook §10) — single captured contemporaneous source; verified clean (no fabrication) in bulk adversarial-verify; filterable via evidence_tier.)
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). On 2023-05-30 Bybit announced
  it would exit the Canadian market following the Canadian Securities
  Administrators' (CSA) tightened crypto-trading-platform regime: it stopped
  onboarding new Canadian users from 2023-05-31, set a 2023-07-31 deadline for
  existing customers to make new deposits / enter new contracts, after which
  they could only withdraw or reduce positions. This is a corporate
  jurisdiction exit by a major centralized exchange in response to a national
  regulatory regime — in scope per codebook §9 (corporate jurisdiction
  exit/geofence). comparison shape, single offramp_cex observed_change,
  attribution=plausible (the exit is directly observed but the captured anchor
  is trade press, not a Bybit primary notice, and does not enumerate the CSA
  provisions). asset_onchain not_applicable (CEX market exit, no on-chain
  freeze, so no §1.6 tx_hash floor applies). Distinct from
  canada-csa-binance-withdrawal-2023 (different actor, regulator-framed S4) and
  kucoin-canada-exit-2023 (sibling exchange, same CSA-driven 2023 exodus).
  Sources verified via WebSearch 2026-05-31; CoinDesk captured + body_hash
  pinned; grep of the captured body confirms "Bybit Exits Canada", "from May
  31", "until July 31 to make new deposits", "withdraw or reduce their
  positions" (no fabrication). Only one independent capture pinned at draft
  stage; promotion would benefit from a second anchor.

