  Comparison-shape S5 corporate-policy-change event sibling to
  tornado-cash-github-takedown-2022-08 (source-code distribution
  sub-layer of L4), aave-tornado-frontend-block-2022-08,
  dydx-tornado-account-block-2022-08,
  cloudflare-ethereum-gateway-tornado-block-2022-08, and
  infura-alchemy-tornado-rpc-block-2022. This row documents the
  canonical-web-domain (DNS / web entrypoint) vertex of the
  2022-08-08 Tornado Cash cascade — operator-initiated cessation of
  tornadocash.org and app.tornadocash.org under OFAC pressure.
  Distinct from the GitHub takedown (third-party platform-policy
  removal of source-code repositories) in that this row is the
  operator-initiated cessation of the project's own canonical
  web-entrypoint asset, not a third-party-imposed platform action.

  Actor coding: TORNADO_CASH_TEAM (operator-initiated cessation),
  not a government seizure (no DOJ seizure warrant against the
  domain registrar — distinct from silk-road domain seizure pattern
  where DOJ obtained court-ordered seizure of the registrar record).
  The action is operator self-cessation under the compliance shadow
  of the 2022-08-08 OFAC SDN designation; the trigger.type stays
  corporate_policy_change because the named actor (the Tornado Cash
  operator collective) unilaterally decided to render the canonical
  domain unreachable rather than being legally compelled by court
  order to surrender registrar control. Stratum S5_corporate per
  §5.2 stratum-actor map (corporate_policy_change → S5_corporate).

  Attribution coding: direct per §1.4 (operator's reported rationale
  in retrospective coverage cites the OFAC trigger and the cessation
  lands within the ≤ 7-day compliance window — same-day, 0h lag).

  Empirical shape: comparison (1 observed_change layer — L4 frontend
  load-bearing at the canonical-web-domain sub-layer). Admission
  tier: empirical_case (≥1 observed_change layer with direct
  attribution).

  v0.3 source repair adds a body_hash/body_path Wayback after-state
  capture for tornadocash.org showing the canonical domain parked for
  sale in 2023-01. That is a physical post-trigger state anchor, not a
  standalone same-day transition proof. For
  non-DRYRUN release, capture body_hash + body_path for: (1) the
  CoinDesk 2022-08-08 article; (2) the EFF Deeplinks 2023-04
  retrospective; (3) the Federal Lawyer timeline; (4) the Medium
  retrospective. Optionally, capture archive snapshots of the
  tornadocash.org and app.tornadocash.org canonical-domain entrypoints
  in their post-trigger unreachable state (DNS NXDOMAIN / HTTP failure)
  as physical artefact; Wayback's own coverage of tornadocash.org
  before/after 2022-08-08 is the best available pinned anchor.
  Reliance on contemporaneous journalism is structural (the Tornado
  Cash operator collective did not publish a standalone
  domain-shutdown announcement), not a DRYRUN artefact. Marked
  evidence_use=contextual_unarchived on all citations to flag the
  unarchived state per validator policy.

scoped_claim: |
  "The operator-initiated cessation of the canonical tornadocash.org
  web-domain entrypoint on 2022-08-08 — the same day as the OFAC
  SDN designation of Tornado Cash (related event
  tornado-cash-ofac-2022) — documents the canonical-web-domain
  sub-layer of the L4 frontend vertex in the S5_corporate cascade.
  Distinct from the third-party GitHub source-code-host takedown
  (tornado-cash-github-takedown-2022-08), this row captures the
  project's own DNS / web-entrypoint cessation as an
  operator-self-imposed compliance reaction. Paper-relevant as the
  canonical-domain analogue to the source-code-platform and
  application-UI L4 rows in the 2022-08-08 cascade."

