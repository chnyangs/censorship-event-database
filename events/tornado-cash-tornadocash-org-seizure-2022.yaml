coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      No nation-state ISP / DNS network-layer block invoked. Domain
      cessation is operator-initiated at the registrar / DNS-record
      level following OFAC pressure, not an L0 nation-state block.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Domain-layer cessation does not act on consensus-layer
      validator / relay behaviour. Consensus-layer effects of the
      upstream OFAC trigger are captured under tornado-cash-ofac-2022
      observations[l1].
  - layer: l3_rpc
    status: not_applicable
    note: |
      Distinct from the L3 RPC-provider blocks under
      infura-alchemy-tornado-rpc-block-2022. The tornadocash.org
      cessation is a web-frontend / DNS-layer artefact, not a
      JSON-RPC endpoint block.
  - layer: l4_frontend
    status: measured
    scope:
      - tornadocash.org
      - app.tornadocash.org
    provider_scope: unknown
    note: |
      Load-bearing layer for this event. The L4 frontend layer here
      is the canonical web-domain entrypoint at tornadocash.org —
      the user-facing UI and project portal through which the
      Tornado Cash mixer was accessed. Contemporaneous reporting
      (CoinDesk, Federal Lawyer, EFF, Medium retrospective) names the
      operator-initiated cessation of the tornadocash.org domain on
      2022-08-08 as the action and the 2022-08-08 OFAC SDN
      designation as the trigger. Attached below as observed_change
      at attribution=direct per §1.4 (operator's reported rationale
      cites the upstream OFAC trigger and the cessation lands within
      the ≤ 7-day compliance window — same-day, 0h lag).
  - layer: asset_onchain
    status: not_applicable
    note: |
      No issuer-level asset freeze invoked by domain cessation.
      Asset-layer reactions to the same upstream OFAC trigger are
      captured under circle-usdc-tornado-2022.
  - layer: offramp_cex
    status: not_applicable
    note: |
      CEX off-ramp reactions to the same upstream OFAC trigger are
      captured under tornado-cash-ofac-2022 observations[offramp_cex].

