  Sibling-event structure (the WikiLeaks 2010-12 corporate-financial
  blockade cluster): this event is the only Swiss-state-postal-banking
  leg of the blockade. Sibling enumeration (per triage manifest
  sources/pre_bitcoin_baseline_2008_2012/triage_manifest.md):

  1. **wikileaks-paypal-freeze-2010-12** (2010-12-04, P0,
     PAYPAL_OPERATOR) — payment-processor leg; State-Department-cited
     rationale (per PayPal VP Osama Bedier, LeWeb 2010-12-08).
  2. **wikileaks-mastercard-suspension-2010-12** (2010-12-06, P0,
     MASTERCARD_OPERATOR) — card-network leg; same-day as the present
     PostFinance event.
  3. **wikileaks-visa-europe-suspension-2010-12** (2010-12-07, P0,
     VISA_EUROPE_OPERATOR) — Visa Europe / DataCell-Valitor leg.

  Paper-relevant axis: PostFinance is the only European-state-postal-
  banking leg of the WikiLeaks blockade. It is structurally distinct
  from the US-card-network legs (MasterCard, Visa Europe) and the
  US-payment-processor leg (PayPal) because (a) the rationale cited
  was not a State-Department referral or sanctions/AML hook but a
  customer-residency-verification failure, and (b) PostFinance is a
  Swiss-state-owned retail-banking entity, putting the closure
  squarely within Swiss-jurisdiction corporate-policy authority rather
  than US-jurisdiction processor authority. Useful pre-Bitcoin
  baseline precedent for later European-jurisdiction bank-account
  closures of crypto-adjacent customers under "due diligence" framings.

