analysis_notes: |
  **SOURCE-REPAIRED 2026-06-01**: promoted-from-candidate history retained,
  but the load-bearing CFTC press-release and administrative-order citations
  now have local body_hash/body_path replay anchors. The earlier wording that
  described a required transition to a specific actual-delivery model within
  28 days has been narrowed: the order supports the statutory actual-delivery
  violation finding, cease-and-desist, penalty, and Bitfinex's represented
  business-practice changes in response to the investigation. This source-
  repair note is not a last_human_audit claim.

  comparison shape: 1 observed_change layer (offramp_cex). L0/L1/L3/L4/
  asset_onchain are all not_applicable because the CFTC order did not
  alter ISP-level reachability of bitfinex.com, the Bitcoin protocol
  layers tracked by this dataset did not exist in their measured forms
  in 2016, the order did not require frontend takedown or geofencing,
  and Bitcoin native asset has no issuer-side freeze primitive. The
  single load-bearing observation is the regulator-compelled cease-and-
  desist / compliance-posture change at Bitfinex's financed-margin product
  line, attribution=direct via the CFTC press release and Docket No. 16-19
  order.

  Historical-baseline placement: this is the first CFTC administrative
  enforcement action against a centralized cryptocurrency exchange in
  the dataset, following the 2015-09-17 Coinflip/Derivabit order
  (coinflip-cftc-derivabit-2015) which established Bitcoin as a
  "commodity" under the CEA but targeted a derivatives-style platform
  rather than a spot/margin exchange. The 2016-06-02 Bitfinex order
  extends CFTC reach to the spot-exchange margin product surface and
  is a structural sibling of the later 2020-10-01 BitMEX CFTC/DOJ
  enforcement (bitmex-cftc-doj-2020) at much larger scale. Also
  related to the 2015-06-24 NYDFS BitLicense cascade
  (nydfs-bitlicense-2015-06) as a contemporaneous U.S.-regulatory
  pressure point on Bitfinex's U.S.-user product surface, and to
  cftc-v-ooki-dao-2022 as the modern endpoint of CFTC retail-commodity
  reach against crypto trading venues.

scoped_claim: |
  "The 2016-06-02 CFTC order In re BFXNA Inc. d/b/a Bitfinex
  (Docket No. 16-19) found that Bitfinex's financed retail bitcoin
  transactions did not result in actual delivery within the statutory
  28-day window, ordered a $75,000 civil penalty and cease-and-desist,
  and recorded Bitfinex's represented business-practice changes in
  response to the investigation. The row is registered as a single-layer
  offramp_cex operator-state-change observation; it does not assert
  frontend takedown, ISP-level network blocking, or on-chain asset
  effects."

