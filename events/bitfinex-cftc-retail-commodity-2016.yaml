coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The CFTC order is a U.S. federal administrative enforcement
      action, not a network-level block of bitfinex.com. ISP
      reachability of U.S. or non-U.S. users to bitfinex.com was not
      altered by the 2016-06-02 order; the operator-state change is
      at the financed-margin product level, not the L0 reachability
      layer.
  - layer: l1_consensus
    status: not_applicable
    chain: bitcoin
    note: |
      Bitcoin proof-of-work consensus in 2016 has no protocol-level
      relay-filter primitive analogous to the post-Merge Ethereum PBS
      relay surface; the Ethereum Merge itself is ~6 years downstream.
      not_applicable on construct-did-not-exist grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      The MEV-Boost / Flashbots Protect / MEV-Blocker public-RPC
      compliance substrate that the L3 layer measures did not exist in
      2016; Flashbots Protect launched 2022-11. not_applicable on
      construct-did-not-exist grounds.
  - layer: l4_frontend
    status: not_applicable
    note: |
      The CFTC order did not require shutdown of the bitfinex.com
      frontend or geofencing of U.S. visitors at the public-web layer;
      the required remedial action was confined to the operator's
      financed-margin product (recoded under offramp_cex). No
      independent L4 frontend diff is reconstructed for this event.
  - layer: asset_onchain
    status: not_applicable
    chain: bitcoin
    note: |
      Bitcoin native asset has no issuer-side blacklist / freeze admin
      method. The CFTC order does not engage a stablecoin-issuer admin
      path. not_applicable on construct-did-not-exist grounds.
  - layer: offramp_cex
    status: measured
    scope:
      - bitfinex_margin_trading_product
    note: |
      Load-bearing layer for this event: an operator-state change at
      the Bitfinex centralized exchange's financed-margin product line.
      The 2016-06-02 CFTC order required Bitfinex to discontinue its
      operating margin-trading pool (omnibus collateral pool) model
      and to transition to an actual-delivery margin model within
      28 days, satisfying the CEA Section 2(c)(2)(D) actual-delivery
      exception for retail commodity transactions. This is a
      regulator-compelled product/operator-state change at an
      offramp_cex venue, attached below as
      observation_kind=observed_change with attribution=direct.

