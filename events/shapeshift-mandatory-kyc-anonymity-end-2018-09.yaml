analysis_notes: |
  **SOURCE-STRENGTHENED 2026-06-01** (quality-loop primary-trigger repair):
  captured the ShapeShift-authored Medium mirror of Erik Voorhees'
  "Introducing ShapeShift Membership" announcement as a local `body_hash` /
  `body_path` replay artifact. The live `info.shapeshift.io` original failed
  DNS resolution during capture, so the Medium page is used as the replayable
  official mirror; its canonical/JSON-LD points back to the original
  ShapeShift blog URL and records dateCreated/datePublished on 2018-09-04.
  attribution is upgraded from plausible to direct for the corporate policy
  change itself. The regulatory motive remains deliberately scoped as generic
  regulatory-environment context, because ShapeShift/Vorhees cited no named
  enforcement action.

  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: wave-3 S5-corporate
  draft, adversarial-verify verdict=KEEP (sources real + on-topic + §9 in-scope + not dup), AND
  passes strict admission validation; origin agent_draft -> human_reviewed).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). ShapeShift (CEO Erik Voorhees)
  announced on 2018-09-04 a mandatory-KYC "membership" scheme, ending the
  pioneering "exchange without accounts" anonymous no-account swap model — a
  foundational CEX/swap privacy-censorship action removing anonymous access to
  the ShapeShift off-ramp globally. §9 IN scope: deliberate corporate denial of
  anonymous service access (privacy restriction), not a hack/insolvency.
  comparison shape, single offramp_cex observed_change. Initial admission used
  attribution=plausible because Voorhees publicly framed the move as a
  PROACTIVE de-risking step "not added as a result of any enforcement action"
  (CoinDesk), so there was no named trigger and the global-AML-compliance motive
  was contextual class-level inference; the 2026-06-01 official-mirror repair
  supersedes that narrow attribution coding for the corporate policy change
  itself. jurisdiction=corporate_global (no single
  named state). Assets stay on-chain so l0/l1/l3/l4/asset_onchain are
  not_applicable; comparable tier (2018). Sources verified via WebSearch +
  captured Wayback (Bitcoinist + CoinDesk, both body_hash-pinned, body
  grep-confirmed; no fabrication). NOTE: the later 2021 Voorhees "No more KYC"
  reversal is a separate event and is NOT used here.

