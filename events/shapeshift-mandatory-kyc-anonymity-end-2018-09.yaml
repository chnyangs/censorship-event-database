  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). ShapeShift (CEO Erik Voorhees)
  announced on 2018-09-04 a mandatory-KYC "membership" scheme, ending the
  pioneering "exchange without accounts" anonymous no-account swap model — a
  foundational CEX/swap privacy-censorship action removing anonymous access to
  the ShapeShift off-ramp globally. §9 IN scope: deliberate corporate denial of
  anonymous service access (privacy restriction), not a hack/insolvency.
  comparison shape, single offramp_cex observed_change. attribution=plausible
  per §1.1: the policy is directly observed but Voorhees publicly framed it as a
  PROACTIVE de-risking step "not added as a result of any enforcement action"
  (CoinDesk), so there is no named trigger and the global-AML-compliance motive
  is contextual class-level inference. jurisdiction=corporate_global (no single
  named state). Assets stay on-chain so l0/l1/l3/l4/asset_onchain are
  not_applicable; comparable tier (2018). Sources verified via WebSearch +
  captured Wayback (Bitcoinist + CoinDesk, both body_hash-pinned, body
  grep-confirmed; no fabrication). NOTE: the later 2021 Voorhees "No more KYC"
  reversal is a separate event and is NOT used here.

