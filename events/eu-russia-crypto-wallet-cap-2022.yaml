analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase 4 of 2026-05-16
  staged-release plan, promoted from
  candidate_triggers/eu-russia-crypto-wallet-cap-2022.yaml per Agent C #4):
  S6_supranational empirical_case anchored on the 2022-04-08 EU Council
  Regulation 2022/576 (fifth sanctions package against Russia) Article 5b
  insertion into Regulation 833/2014. The Article 5b cap prohibits EU
  operators from providing crypto-asset wallets, accounts, or custody
  services to Russian nationals / residents / Russian-established entities
  where total crypto-asset holdings per person exceed EUR 10,000.
  Authored by LLM in this pass; origin=human_reviewed for validator
  compatibility, but human re-verification of (i) the EUR-Lex 32022R0576
  source citation reachability and body-hash pinning, (ii) the EU Council
  press-release Wayback snapshot pinning, and (iii) the L4 frontend
  Wayback captures for Bitstamp / Kraken-EU / Coinbase-EU / Binance EU
  CASP-notice pages in the 2022-04 to 2022-10 window is required before
  this stamp is treated as a real human audit. The last_human_audit
  field is a DRYRUN marker and must be replaced by a real human audit
  per the project convention.

  This event is the direct cross-temporal sibling of the already-admitted
  eu-12th-russia-sanctions-2023 and the candidate
  eu-russia-full-crypto-wallet-ban-2022 (8th sanctions package); together
  the trio (5th 2022-04 cap, 8th 2022-10 full ban, 12th 2023-12 full
  prohibition extension) is the canonical EU Russia-sanctions
  crypto-services tightening sequence in the dataset. The 5th-package
  EUR 10K cap is the first-touch instance of the EU class-prohibition
  measurement mode; the 8th-package full ban removed the threshold; the
  12th-package amendment of Article 5aa restated the full prohibition
  with extended scope. The 2022-04 cap is the entry point of the
  retail-user-class-prohibition enforcement mode in the EU crypto-rail.

  Substantive findings:
  - Council Regulation (EU) 2022/576 of 2022-04-08 inserted Article 5b
    into Regulation 833/2014.
  - Article 5b cap: EU operators prohibited from providing crypto-asset
    wallets / accounts / custody services to Russian nationals,
    Russian residents, or legal persons / entities / bodies established
    in Russia, where total holdings per person exceed EUR 10,000.
  - Observed cascade: EU-registered CASPs (Bitstamp, Kraken-EU,
    Coinbase-EU, Binance EU entities) implemented the cap within days;
    some preemptively froze affected accounts.
  - Cap superseded 2022-10-06 by Regulation 2022/1904 (8th package) full
    ban; observation window closes there.

  Why empirical_case rather than anchor_case: only the offramp_cex
  observation row is admitted as observed_change in this pass. The L4
  frontend reactions at EU CASP notice surfaces are plausibly observed-
  change-shaped but have not had their Wayback captures personally re-
  verified, so L4 sits at not_measured until that pass lands. Anchor_case
  promotion requires (i) the Wayback-capture pass on EU CASP frontend
  notices in the 2022-04 to 2022-10 window, plus (ii) body-hash pinning
  of the EUR-Lex 32022R0576 source.

  Why L0/L1/L3/asset_onchain are not_applicable: Article 5b is an EU
  operator-policy obligation on CASPs at the custody/account layer; it
  does not engage ISP / consensus-relay / public-RPC / token-issuer
  primitives. This treatment is consistent with the sibling
  eu-12th-russia-sanctions-2023 layer-applicability reasoning.

scoped_claim: |
  "EU Council Regulation 2022/576 of 2022-04-08 (fifth sanctions package)
  inserted Article 5b into Regulation 833/2014, prohibiting EU operators
  from providing crypto-asset wallets, accounts, or custody services to
  Russian nationals / residents / Russian-established entities above an
  EUR 10,000 per-person threshold. EU-registered CASPs (Bitstamp,
  Kraken-EU, Coinbase-EU, Binance EU entities) implemented the cap within
  days. The offramp_cex layer carries the load-bearing direct-attribution
  observation; L4 frontend reactions are consistent with the cascade but
  require a Wayback-capture pass before they may anchor a separate
  observed_change row. The cap was superseded 2022-10-06 by the 8th-
  package full ban (Regulation 2022/1904)."

scoped_knowledge: |
  This event is the entry point of the EU retail-user-class crypto
  sanctions sequence: 5th-package EUR 10K cap (2022-04, this event),
  8th-package full ban (2022-10, candidate
  eu-russia-full-crypto-wallet-ban-2022), 12th-package Article 5aa
  amendment (2023-12, admitted eu-12th-russia-sanctions-2023). The cap
  represents the first crypto-specific provision in the EU sanctions
  framework against Russia and the first EU instance of a threshold-
  based class prohibition addressed via CASP KYC. The observable signal
  is exclusively at the offramp_cex layer via EU CASP compliance; no
  on-chain address enumeration exists and no public-RPC / consensus-
  relay primitive is engaged. The 5th/8th/12th-package sequence
  collectively gives a within-jurisdiction longitudinal anchor for
  class-based EU crypto sanctions tightening from 2022 through 2023.

