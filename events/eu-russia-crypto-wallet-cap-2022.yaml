coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      Regulation 2022/576 does not direct ISP-level domain blocking or DNS
      interference. The crypto-asset wallet/account/custody cap operates at
      the EU operator KYC/compliance layer, not at the network layer.
      not_applicable on construct-not-engaged grounds, consistent with the
      sibling eu-12th-russia-sanctions-2023 L0 treatment.
  - layer: l1_consensus
    status: not_applicable
    note: |
      The cap is an operator-policy obligation on EU-licensed CASPs, not a
      consensus-layer primitive. No L1 relay / proposer / validator
      filtering primitive is engaged by the Regulation. not_applicable on
      construct-not-engaged grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      The cap is operator-policy-level (CASP custodial obligation) rather
      than RPC-level. EU-operating CASPs implement the cap through KYC and
      account-management controls, not through public-RPC compliance
      filtering. not_applicable on construct-not-engaged grounds.
  - layer: l4_frontend
    status: not_measured
    scope:
      - bitstamp.net
      - kraken.com
      - coinbase.com
      - binance.com
    note: |
      EU-operating CASPs (Bitstamp, Kraken-EU, Coinbase-EU, Binance EU
      entities) plausibly added Russian-user-restriction notices and
      threshold-enforcement messaging on customer-facing surfaces shortly
      after 2022-04-08. Wayback bracketing of those notices for the
      ~2022-04 to ~2022-10 window (before the 8th-package full ban
      superseded the EUR 10K threshold) is plausibly feasible but the
      specific snapshot URLs have not been pinned in this DRYRUN authoring
      pass. L4 status remains not_measured pending the Wayback-capture
      pass; that pass is a follow-up task and is the gating step for
      promoting this event from empirical_case to anchor_case.
  - layer: asset_onchain
    status: not_applicable
    note: |
      The Regulation imposes obligations on CASP operators, not on token
      issuers. No issuer-side admin freeze primitive is engaged across the
      affected wallets. not_applicable on construct-not-engaged grounds,
      consistent with the sibling eu-12th-russia-sanctions-2023
      asset_onchain treatment.
  - layer: offramp_cex
    status: measured
    scope:
      - bitstamp
      - kraken_eu
      - coinbase_eu
      - binance_eu
    note: |
      Regulation 2022/576 Article 5b is by construction an offramp-CEX /
      custody-rail event: it prohibits EU operators from providing crypto-
      asset wallets, accounts, or custody services to Russian persons
      above the EUR 10,000 threshold. EU-registered CASPs (Bitstamp,
      Kraken-EU, Coinbase-EU, Binance EU entities) implemented the cap
      within days of adoption; some preemptively froze affected accounts.
      Marked measured; load-bearing observation attached below as
      observation_kind=observed_change with attribution=direct.

