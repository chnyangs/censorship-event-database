analysis_notes: |
  Admitted 2026-06-09 as an attested_secondary event. A 2026-03-31 SDNY federal
  court order entered a CFTC consent order permanently barring KuCoin operator
  Peken Global Limited from allowing US users — a §9-clear off-ramp access
  restriction. Distinct from the 2024 DOJ indictment / CFTC consent order. Only
  one captured contemporaneous secondary source (CoinDesk) anchors it, so the
  offramp_cex observed_change is attribution=plausible. origin agent_draft ->
  human_reviewed via LLM adjudication + maintainer oversight (not
  independent-human IRR).
