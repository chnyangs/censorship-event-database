  null_event documenting FATF's 2021-10-28 publication of the
  "Updated Guidance for a Risk-Based Approach to Virtual Assets and
  Virtual Asset Service Providers". This is a class-level coverage
  extension to the 2019 R.15 INR (fatf-r15-vasp-travel-rule-2019),
  covering six focus areas: (1) VA/VASP definition clarifications,
  (2) stablecoin arrangements under FATF Standards, (3) P2P-transfer
  risk tools, (4) VASP licensing/registration, (5) Travel Rule
  implementation including the "sunrise problem", and (6) supervisor
  information-sharing.

  Per §6 codebook the temporal_tier is comparable_main_2017_present
  and the canonical analysis_use is comparable_analysis. Per §7
  codebook the enumeration is `subset` with the class-level
  rationale documented in target.enumeration_note (FATF Standards
  operate at the international-standards layer; binding force is via
  member-state implementation). Per §3 codebook the empirical_shape
  is null_event: 0 observed_change layers directly attributable to
  the 2021-10-28 publication date; downstream cascades (EU TFR 2023,
  OECD CARF 2022, national VASP rule updates) are tracked as
  separate child events. Per §4 codebook admission_tier=null_case
  (0 strong-attribution observed_change layers).

  Per §1.1 codebook, the single off-ramp row uses
  attribution=`none` because observation_kind=`coverage_gap` (no
  direct per-event observed_change at the corpus's resolution).
  This event functions as a parent / standards-layer anchor for the
  downstream member-state Travel Rule and stablecoin/DeFi rule
  cascades and as a temporal landmark for the 2022-2024 wave of
  national VASP regulation. Archival anchors pinned 2026-05-21 (live
  fatf-gafi.org PDF; no Wayback memento available for this URL).

