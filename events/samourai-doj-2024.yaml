analysis_notes: |
  comparison documenting the joint US (SDNY) + international (Europol, Portugal,
  Iceland) takedown of Samourai Wallet on 2024-04-24. Unlike OFAC-SDN events, this trigger
  is a DOJ criminal indictment + SDNY seizure warrant — a different legal instrument. The
  same-day domain seizure places this in the direct-law-enforcement class with Cryptex
  2024-09-26, but with an even cleaner international coordination footprint (4 countries,
  not 3).

  Event_class: comparison (admitted once at least 2 more layer
  observations attach — e.g., exchange tagging reactions). At this draft stage only L4 is
  grounded.

  Target: marked enumeration=subset because Samourai addresses are not enumerable in the
  OFAC SDN-list sense (CoinJoin wallet + ≥$2B fee-receiving infrastructure); only canonical
  domain is the stable identifier.

scoped_claim: |
  "DOJ SDNY indictment + domain seizure of Samourai Wallet on 2024-04-24 produced a direct
  L4 observed_change within ~19h of indictment unsealing (canonical samouraiwallet.com
  substituted with an SDNY seizure banner). Joint-action footprint: US + Europol + Portugal +
  Iceland. Other layers pending empirical query."

