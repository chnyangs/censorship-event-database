analysis_notes: |
  **NEW EVENT AUTHORED -- DRYRUN 2026-05-16** (agent_draft). Pending
  human audit and (a) Wayback-replayable captures with body_hash /
  body_path artifacts via scripts/capture_http_artifact.py for the
  cftc.gov press release 8478-22, the polymarket.com US-geofence
  notice page, and the DOJ SDNY 2026-04 indictment press release;
  (b) lift evidence_use from contextual_unarchived once artifacts are
  pinned.

  comparison -- Polymarket is the FIRST CFTC enforcement in the dataset
  against a prediction-market frontend operator (binary-options /
  event-markets theory) that produced an operator-implemented US-vantage
  geofence rather than full market exit. Structurally adjacent to:
  (1) `cftc-v-ooki-dao-2022` (CFTC vs. DEX-DAO, frontend geo-blocking
  via default judgment) -- both retain the on-chain protocol while
  blocking the US-resident frontend; (2) `bitfinex-tether-cftc-2021`
  (CFTC vs. crypto-finance operator with monetary penalty + US-rails
  restriction). Distinguishing features: (i) the cascade surface is
  ONLY the L4 frontend -- no asset-onchain or off-ramp CEX involvement;
  (ii) ~4-year longitudinal validation via the 2026-04 DOJ indictment
  of Master Sergeant Van Dyke, which confirms US-resident access remains
  banned and that VPN circumvention is operationally well-documented;
  (iii) the on-chain Polygon contracts remained functional throughout.
  One observed_change layer (L4 frontend) with direct attribution ->
  empirical_case admission tier; empirical_shape = comparison.

scoped_claim: |
  The 2022-01-03 CFTC settlement against Blockratize Inc. d/b/a
  Polymarket ($1.4M penalty + cease-and-desist) produced a single-layer
  L4 cascade -- a US-vantage geofence at polymarket.com -- with the
  on-chain Polygon protocol contracts remaining functional. Longitudinal
  validation via the 2026-04 DOJ SDNY indictment of Master Sergeant
  Gannon Ken Van Dyke (for using classified Maduro-operation intel to
  win ~$409K on Polymarket) confirms the US-vantage geofence remained
  in place through 2026 and that VPN-bypass is well-documented.

