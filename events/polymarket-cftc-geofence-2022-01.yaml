coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      No network-layer (DNS / ISP) blocking observed. The cascade surface
      is operator-side geofencing at the application layer, not
      substrate-level filtering of polymarket.com.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Polymarket runs on Polygon PoS; the CFTC settlement does not
      implicate validator-level block-construction or consensus
      censorship.
  - layer: l3_rpc
    status: not_applicable
    note: |
      Public Polygon RPC filter-lists are not implicated by the CFTC
      settlement; the enforcement targets the frontend operator, not
      RPC providers.
  - layer: l4_frontend
    status: measured
    scope: [polymarket.com]
    note: |
      Polymarket.com implemented a US-vantage geofence on the frontend
      following the 2022-01-03 CFTC settlement, blocking US-resident
      access to the event-market interface. The 2026-04 DOJ indictment
      of Master Sergeant Gannon Ken Van Dyke (charged with using
      classified information to profit on Polymarket Maduro-raid
      markets) confirms in court filings that "Americans are banned from
      using Polymarket" and that VPN-based circumvention is operationally
      possible — load-bearing for the L4 measured-frontend cascade row.
  - layer: asset_onchain
    status: not_applicable
    note: |
      No issuer-level asset freeze implicated by the CFTC settlement.
      Polymarket's USDC and on-chain position tokens were not frozen.
  - layer: offramp_cex
    status: not_applicable
    note: |
      No CEX off-ramp restriction is asserted by the CFTC order. The
      cascade surface is the frontend geofence, not a fiat off-ramp
      change.

