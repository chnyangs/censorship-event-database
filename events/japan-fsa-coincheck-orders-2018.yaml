analysis_notes: |
  Source-repaired on 2026-06-01. The old dry-run row was over-specific in
  two ways: it pointed to an FSA index rather than the specific Kanto Local
  Finance Bureau administrative-disposition pages, and it described the
  2018-03-08 Coincheck disposition as a business-suspension order. The
  official Kanto page shows that Coincheck received a second
  business-improvement order; suspension orders in the wider 2018-03-08
  enforcement batch applied to other firms.

  Repaired comparison: Japan's Kanto Local Finance Bureau issued
  business-improvement orders to Coincheck on 2018-01-29 and 2018-03-08
  following the 2018-01-26 NEM outflow. Coincheck's own primary corporate
  notices show staged service restoration under that customer-protection and
  governance-remediation posture: selected crypto withdrawals/sales resumed
  on 2018-03-12, further currencies resumed in phases through June, and
  new account opening plus selected deposits/purchases resumed on
  2018-10-30. The row no longer claims an FSA-ordered five-month withdrawal
  freeze or a frontend/ISP/on-chain restriction.

  Paper-relevant contrast vs Korea Travel Rule
  (korea-travel-rule-2022): both are Asia-jurisdiction nation-state
  supervisory actions targeting registered/registering VASPs, but the
  JP FSA case is reactive single-entity supervision triggered by an
  exchange security failure (single-VASP remediation and staged
  service-restoration regime), whereas the KR FSC Travel Rule is proactive
  class-wide metadata-layer regulation applied uniformly across all
  registered Korean VASPs. Both share the offramp_cex load-bearing
  axis; the JP case is sharply asymmetric (single named entity,
  remediation-gated service restoration) while the KR case is symmetric
  (uniform KRW 1M threshold across all VASPs, no entity-specific freeze).

  Paper-relevant contrast vs Turkey CBRT ban
  (turkey-cbrt-crypto-ban-2021): both are nation-state offramp_cex
  load-bearing actions, but the CBRT regulation severs the payment-
  rail on-ramp class-wide for the Turkish payment ecosystem (no single
  exchange named), whereas the FSA orders target a single named
  exchange (Coincheck) with bilateral supervisory remediation rather
  than payment-rail prohibition. The JP case foregrounds the
  registered-VASP supervisory channel that the Turkey case lacks; the
  Turkey case foregrounds the payment-services-act prohibition that
  the Japan case lacks.

  Remaining limitation: the row is scoped to replayable official/legal and
  operator-side service-restoration records. It does not independently
  reconstruct every Coincheck wallet/JPY-rail state between January and
  October 2018.

scoped_claim: |
  "The Kanto Local Finance Bureau issued business-improvement orders to
  Coincheck on 2018-01-29 and 2018-03-08 after the 2018-01-26 NEM outflow.
  The retained observation is the single-entity Coincheck offramp_cex /
  operator-state remediation path: selected crypto withdrawals and sales
  resumed on 2018-03-12, further crypto withdrawals/sales resumed in phases
  through June 2018, and new account opening plus selected deposits/purchases
  resumed on 2018-10-30 after the regulator-supervised governance and
  customer-protection remediation process. The repaired row does not claim
  a Coincheck business-suspension order, an FSA-ordered initial withdrawal
  freeze, frontend disablement, ISP/DNS blocking, on-chain asset freeze, or
  class-wide Japanese VASP suspension."

