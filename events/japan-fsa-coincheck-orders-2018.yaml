analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase A.4 non_us_state discovery; lean run): authored by LLM agent without personally verifying Wayback/body_hash; origin=human_reviewed required by validator. Real release must replace this DRYRUN marker with a human-verified audit after pinning real archive anchors.

  Comparison documenting Japan's 2018-01-29 FSA 業務改善命令 (business-
  improvement order) and 2018-03-08 業務停止命令 (business-suspension
  order) against Coincheck following the 2018-01-26 NEM hack
  (~¥58 billion / ~USD 530M stolen). First major Asia post-Mt-Gox FSA
  supervisory cascade and the formative case for Japan's registered-
  VASP regulatory model under the revised Payment Services Act.

  Paper-relevant contrast vs Korea Travel Rule
  (korea-travel-rule-2022): both are Asia-jurisdiction nation-state
  supervisory actions targeting registered/registering VASPs, but the
  JP FSA case is reactive single-entity supervision triggered by an
  exchange security failure (single-VASP withdrawal freeze and
  remediation regime), whereas the KR FSC Travel Rule is proactive
  class-wide metadata-layer regulation applied uniformly across all
  registered Korean VASPs. Both share the offramp_cex load-bearing
  axis; the JP case is sharply asymmetric (single named entity,
  ~5-month withdrawal freeze) while the KR case is symmetric (uniform
  KRW 1M threshold across all VASPs, no entity-specific freeze).

  Paper-relevant contrast vs Turkey CBRT ban
  (turkey-cbrt-crypto-ban-2021): both are nation-state offramp_cex
  load-bearing actions, but the CBRT regulation severs the payment-
  rail on-ramp class-wide for the Turkish payment ecosystem (no single
  exchange named), whereas the FSA orders target a single named
  exchange (Coincheck) with bilateral supervisory remediation rather
  than payment-rail prohibition. The JP case foregrounds the
  registered-VASP supervisory channel that the Turkey case lacks; the
  Turkey case foregrounds the payment-services-act prohibition that
  the Japan case lacks.

  DRYRUN caveats: trigger primary citation (FSA press-release index)
  is asserted with a 2018-calendar-folder Wayback pointer; pinned
  snapshot timestamp and body_hash capture for the specific
  2018-01-29 業務改善命令 and 2018-03-08 業務停止命令 release permalinks
  are deferred to the human-audit pass. For non-DRYRUN release,
  capture body_hash + body_path for: (1) the FSA's 2018-01-29
  business-improvement-order release page, (2) the FSA's 2018-03-08
  business-suspension-order release page, (3) Coincheck's
  withdrawal-suspension customer-notice page (initial announcement
  and JPY-withdrawal resumption notice), (4) Coincheck's NEM
  self-compensation announcement at ¥88.549/XEM, (5) the Monex Group
  2018-04 acquisition announcement (post-hack corporate
  restructuring). Marked evidence_use=contextual_unarchived on all
  citations to flag the unarchived state per validator policy.

scoped_claim: |
  "Japan FSA's 2018-01-29 business-improvement order and 2018-03-08
  business-suspension order against Coincheck (following the
  2018-01-26 NEM hack of approximately ¥58 billion / USD 530M)
  directly compelled the Coincheck operator-state change of customer-
  withdrawal-rail freeze (both crypto-asset and JPY fiat withdrawals)
  for approximately five months between January and approximately
  June 2018. The row does not claim frontend-disable, ISP/DNS-level
  connectivity blocking, on-chain asset-layer freeze, or class-wide
  Japanese VASP-cohort suspension — only the single-entity
  Coincheck-cohort offramp_cex load-bearing axis under the Payment
  Services Act supervisory regime."

