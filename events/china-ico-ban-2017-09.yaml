analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-4 audit (S4 comparison/China cluster)
  by human:xiangwen as empirical_case. PBOC 7-Ministry ICO ban notice
  Wayback 20170904083557 (primary_legal, contemporaneous) + CNBC Wayback
  20170904084200 (semi_primary_wayback) replayable body_hash. asset_onchain
