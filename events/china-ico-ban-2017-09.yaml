coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The 7-Ministry Notice does not direct ISP-level domain blocking
      or DNS interference. PRC network-layer treatment of crypto-exchange
      domains is a downstream phenomenon (later 2017 phased ISP action
      against domestic exchanges; broader 2021 enforcement) that is not
      part of this 2017-09-04 trigger. L0 not_applicable consistent with
      sibling banking-and-exchange-rail nation-state events
      (China 2013, China 2021, Korea 2017, India 2018, Turkey 2021).
  - layer: l1_consensus
    status: not_applicable
    note: |
      The Ethereum Merge (2022-09-15) is ~5 years downstream of the
      2017-09-04 trigger; the post-Merge PBS relay-filter primitive
      that the L1 layer measures did not exist. not_applicable on
      construct-did-not-exist grounds, consistent with sibling pre-Merge
      nation-state events.
  - layer: l3_rpc
    status: not_applicable
    note: |
      Flashbots Protect launched 2022-11 and MEV-Blocker launched
      2023-03-27. The public-RPC compliance substrate that the L3 layer
      measures did not exist in 2017. not_applicable on
      construct-did-not-exist grounds.
  - layer: l4_frontend
    status: not_measured
    scope:
      - okcoin.cn
      - huobi.com
      - btcchina.com
    note: |
      PRC domestic crypto exchange frontends (OKCoin, Huobi, BTCC) and
      domestic ICO-platform frontends added ICO-suspension and
      token-delisting notices on their homepages in the weeks following
      the 2017-09-04 notice. Wayback bracketing of those homepage
      snapshots is plausibly feasible but the specific snapshot URLs
      have not been pinned in this authoring pass. L4 remains
      not_measured pending the Wayback-capture pass that an admission
      anchor at this layer would require.
  - layer: asset_onchain
    status: not_applicable
    note: |
      The 7-Ministry Notice prohibits token-issuance fundraising
      ("代币发行融资") as unauthorized public financing and mandates ICO
      refunds, but it does not engage an on-chain issuer-admin
      freeze/blacklist primitive and no enumerated on-chain transaction
      is pinned. The token-issuance prohibition is recorded at the
      offramp_cex / fundraising layer rather than asset_onchain (the
      validator reserves asset_onchain observed_change for
      primary_onchain-anchored events). not_applicable on
      construct-not-engaged grounds here.
  - layer: offramp_cex
    status: measured
    scope:
      - okcoin
      - huobi
      - btcc
    note: |
      The 7-Ministry Notice is by construction an issuer-rail and
      regulated-financial-institution event: it declares ICOs illegal
      and prohibits PRC financial institutions and non-bank payment
      agencies from token/virtual-currency-related services. CNY-pair
      offerings for ICO tokens at PRC domestic exchanges (OKCoin,
      Huobi, BTCC) ceased compliance-immediately following the notice;
      the downstream china-pboc-exchange-shutdown-2017-09 sibling event
      records the broader BTC/ETH CNY-pair shutdown that followed
      within ~2 weeks. The notice text itself names the regulatory
      mandate, giving direct attribution at this layer. Marked
      measured; load-bearing observation attached below as
      observation_kind=observed_change with attribution=direct.

