  offramp_cex. offramp_cex observed_change/direct - PBOC 2017-09-04 7-Ministry
  Notice banned ICO fundraising + CNY-pair ICO-token delisting sector-wide.
  comparison/empirical_case preserved.

  NEW EVENT AUTHORED — DRYRUN 2026-05-16. Phase C of the 2026-05-16
  staged-release plan: agent-drafted comparable_main_2017_present
  anchor for the 2017-09-04 PBOC 7-Ministry Notice
  (关于防范代币发行融资风险的公告 / "9.4 Notice"). Authored by LLM in this
  pass; origin=agent_draft and status=draft per validator constraints
  for unreviewed agent output. Human re-verification of (i) the
  bilingual PBOC source citation reachability and pbc.gov.cn
  snapshot pinning, (ii) the L4 frontend Wayback captures for OKCoin /
  Huobi / BTCC homepages, and (iii) the secondary English anchors
  (CNBC, Reuters, SCMP, CoinDesk, Bloomberg) Wayback pinning is
  required before this stamp may be treated as a real human audit. The
  last_human_audit field is a DRYRUN marker and must be replaced by a
  real human audit per the project convention.

  This event is the immediate sibling to china-pboc-crypto-ban-2013-12
  (first PBOC central-bank action establishing the regulatory frame),
  china-pboc-crypto-ban-2021 (nine-ministry full ban escalation), and
  china-pboc-exchange-shutdown-2017-09 (the BTC/ETH CNY-pair shutdown
  that followed within ~2 weeks of the ICO ban). The 7-Ministry Notice
  closed the issuer-rail (ICO token issuance) while the exchange-shutdown
  sibling closed the secondary-market CNY-pair rail; the two together
  comprise the canonical 2017-Q3 PRC crypto-rail-severance moment.

  Substantive findings:
  - Seven-ministry joint notice: PBOC (lead) + CAC + MIIT + SAIC + CBRC
    + CSRC + CIRC. Confirmed by LoC Global Legal Monitor 2017-10-19
    English summary.
  - ICO token-issuance fundraising classified as unauthorized public
    financing and declared illegal.
  - All ICO financing activities halted from 2017-09-04.
  - Completed-ICO refund mandate.
  - PRC financial institutions and non-bank payment agencies prohibited
    from token-related account opening, registration, trading,
    liquidation, settlement, or insurance services.
  - Observed cascade: jurisdiction-wide ICO prohibition at
    asset_onchain layer (issuer-rail closure) plus CNY-pair delisting
    at offramp_cex layer (regulated-FI-rail closure).

  Why temporal_tier=comparable_main_2017_present and
  analysis_use=comparable_analysis: 2017-09-04 sits in the 2017+
  comparable corpus, alongside sibling korea-fsc-ico-ban-2017
  (2017-09-29) which is the immediate Asia regulator counterpart.
  China-2017 / Korea-2017 is the canonical cross-jurisdiction Asian
  regulator pair for the dataset.

  Why empirical_case rather than anchor_case: the LLM authoring
  constraint in this pass is that Wayback captures for primary PBOC
  source (Chinese-language) and the L4 frontend reactions at OKCoin /
  Huobi / BTCC homepages have not been personally re-verified, and
  the pbc.gov.cn URL path format has drifted since 2017 (year-prefix
  Wayback lookup only). Per project convention, anchor_case promotion
  requires the actual Wayback-capture pass; that pass is a follow-up
  turn. Until it lands, the event admits at empirical_case on the
  strength of the direct-attribution asset_onchain and offramp_cex
  observations.

  Why asset_onchain is measured rather than not_applicable: the
  7-Ministry Notice explicitly prohibits token issuance, which the
  project convention (lesson 11: non-schema "asset_issuance" hint
  maps to asset_onchain) records at the asset_onchain layer.
  Unlike the 2013 PBOC notice (which only addressed Bitcoin as
  "virtual commodity" without an issuer-side prohibition) and unlike
  the 2021 PBOC notice (which addressed virtual-currency-business
  activity broadly without an issuer-specific prohibition), the
  2017-09-04 7-Ministry Notice is the canonical jurisdiction-wide
  issuer-rail prohibition in the PRC crypto-regulation arc and earns
  asset_onchain=measured on that basis.

  Why L0/L1/L3 are not_applicable: the 7-Ministry Notice is an
  issuer-rail-and-FI-rail directive, not a network-layer block; the
  Ethereum PBS-era L1/L3 measurement primitives do not exist in 2017.
  This treatment is consistent with the sibling 2013 / 2021 PBOC
  events and with the broader Korea 2017 / India 2018 / Nigeria 2021
  / Turkey 2021 banking-rail-severance pattern.

  Note on Chinese-language primary sources: per project convention
  (lesson 10), English secondary anchors (LoC Global Legal Monitor,
  CNBC) are attached alongside the Chinese-language PBOC primary
  source to provide the working translation context for cross-language
  human audit and to ensure the citation chain is reachable to
  English-language reviewers. Reuters, SCMP, CoinDesk, and Bloomberg
  also published same-day 2017-09-04 English coverage and are
  available as additional anchors during human-audit re-pinning.

scoped_claim: |
  The PBOC 7-Ministry Notice of 2017-09-04 (公告 [2017]) declared ICO
  token-issuance fundraising illegal as unauthorized public financing,
  halted all ICO financing activities from date of issuance, mandated
  refund arrangements for completed ICOs, and prohibited PRC financial
  institutions and non-bank payment agencies from token-related
  services. The asset_onchain layer carries the jurisdiction-wide
  issuer-rail prohibition observation; the offramp_cex layer carries
  the sector-wide CNY-pair delisting observation. Both rest on
  direct attribution from the notice text.

scoped_knowledge: |
  Canonical 2017-Q3 PRC crypto-rail-severance moment, paired with the
  downstream china-pboc-exchange-shutdown-2017-09 (~2 weeks later)
  which closed the secondary-market BTC/ETH CNY-pair rail. The
  three-event PRC PBOC longitudinal stack (2013-12 first-touch banking
  exclusion → 2017-09 ICO ban + exchange shutdown → 2021-09
  nine-ministry full ban) traces the escalation of PRC crypto-regulation:
  2013 declared Bitcoin a "virtual commodity" with banks-may-not-service
  posture; 2017 closed the issuer-rail (ICO ban) and secondary-market
  CNY-pair rail (exchange shutdown); 2021 extended to a comprehensive
  ban on all virtual-currency business activity. The cross-jurisdiction
  Asian regulator pair is China-2017 (9-4) / Korea-2017 (9-29), with
  both jurisdictions banning token-issuance fundraising within ~25
  days. The cascade shape in 2017 China is comparison-not-cascade
  because construct-did-not-exist layers (L1, L3) and the policy
  scope (issuer-rail + regulated-FI-rail only, not network layer)
  limited the observable cross-layer surface to two layers.

