analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17**. Historical-baseline
  contextual case for the 2014-09-15 Bangladesh Bank (BB) warning
  that bitcoin transactions could constitute unauthorised acts
  under the Foreign Exchange Regulation Act 1947 and the AML/CFT
  statutes (Money Laundering Prevention Act 2012, Anti-Terrorism
  Act 2009), carrying up to 12 years' imprisonment. Authored at
  status=draft / origin=agent_draft pending human audit of (i)
  the CoinDesk and Daily Star URL reachability and Wayback
  snapshot pinning, (ii) any direct BB press-release primary
  source that may exist in Bangladeshi-language press but was not
  located in this authoring pass, and (iii) any exchange-side
  evidence of Bangladesh-resident cutoff in contemporaneous
  press coverage.

  Significance: this is a foundational 2014-era nation-state
  warning treating bitcoin transactions as prohibited under
  existing FX-control and AML/CFT law rather than under a
  freshly issued crypto-specific directive. It is the direct
  cross-jurisdiction sibling of iceland-cbi-foreign-exchange-
  bitcoin-2014 (CBI 2014-03-19 statement) and bolivia-bcb-
  crypto-prohibition-2014 (BCB 2014-05 prohibition), and
  follows china-pboc-crypto-ban-2013-12 and thailand-bot-
  bitcoin-prohibition-2013 as the earliest cluster of nation-
  state-level bitcoin-restriction events in the dataset.

  Why trigger.type=regulatory_enforcement (not nation_state_block):
  per codebook §5.1, regulatory_enforcement is the canonical
  trigger.type for non-US national regulator administrative
  enforcement actions that are NOT network-layer or payment-rail
  blocks. The BB warning does not direct ISP-level blocking or
  payment-system severance; it states a legal-interpretation
  position under existing FX-control and AML/CFT law. This
  matches the codebook §5.1 carve-out distinguishing
  regulatory_enforcement from nation_state_block.

  Why temporal_tier=historical_baseline_2013_2016 +
  analysis_use=historical_baseline: 2014 belongs to the pre-2017
  historical-baseline tier per sampling/frame.yaml.
  analysis_use=historical_baseline excludes this row from the
  2017+ comparable-analysis denominator. The event is retained
  as contextual case-study material rather than as a denominator
  row because (a) it predates the comparable corpus and (b) the
  cascade surface is class-level rather than exchange-specific.

  Why null_event / null_case: the offramp_cex observation is
  observation_kind=observed_no_change with attribution=none,
  not an observed_change row. The BB warning carries
  direct-attribution force on Bangladeshi-resident bitcoin
  transacting behaviour as a class, but the cascade surface in
  the available public record is not exchange-specific. Without
  a documented exchange-side cutoff or a measured Bangladesh-
  resident on-chain volume shift, the event admits only at
  null_case strength and empirical_shape=null_event.

  Why L0/L1/L3/L4/asset_onchain are not_applicable: the BB
  warning is a legal-interpretation notice under existing
  FX-control and AML/CFT law; it does not direct network-layer
  blocking, L4 frontend changes, or engage any 2014-nonexistent
  L1/L3 PBS measurement primitive or any asset-issuer admin
  path. The L0/L1/L3/asset_onchain not_applicable treatment
  matches the sibling Iceland 2014 / China 2013-12 / India 2018
  / Nigeria 2021 / Turkey 2021 banking-and-FX-rail pattern.

  Codebook compliance: per §6 the canonical analysis_use is
  `historical_baseline` (not the alias `contextual_baseline`);
  per §7 target.enumeration=subset is used with class-level
  rationale documented in enumeration_note (not the unsupported
  `class_level` enum value); per §1.5 no L0 observation is
  admitted because no replayable OONI / Censored Planet /
  Cloudflare Radar measurement was captured.

scoped_claim: |
  Bangladesh Bank's 2014-09-15 warning stated that bitcoin
  transactions could constitute unauthorised acts under the
  Foreign Exchange Regulation Act 1947 and the AML/CFT statutes
  (Money Laundering Prevention Act 2012, Anti-Terrorism Act
  2009), carrying up to 12 years' imprisonment. The cascade
  surface is class-level on Bangladeshi residents; no exchange-
  side Bangladesh-resident cutoff is documented in this authoring
  pass, so offramp_cex carries an observation_kind=observed_no_change
  row with attribution=none.

scoped_knowledge: |
  This event is part of the earliest cluster of nation-state
  actions treating bitcoin under existing FX-control and AML/CFT
  law rather than via freshly issued crypto-specific directives.
  Together with iceland-cbi-foreign-exchange-bitcoin-2014 (CBI
  FX-Act reinterpretation) and bolivia-bcb-crypto-prohibition-2014
  (BCB unilateral prohibition), it forms the 2014 contextual
  triad of pre-existing-law reinterpretation events, sitting
  downstream of china-pboc-crypto-ban-2013-12 (PBOC five-ministry
  crypto-specific notice) and thailand-bot-bitcoin-prohibition-
  2013 (BoT advisory). The Bangladesh 2014 warning is distinctive
  in its explicit invocation of a 12-year prison exposure under
  the AML/CFT statutes — the most severe announced penalty in
  the 2013-2014 cluster — but the cascade surface remains
  class-level because no specific exchange is named and no
  exchange-side Bangladesh-resident cutoff is documented in the
  public record. The event is the canonical historical-baseline
  comparison row for cross-jurisdiction analysis of pre-Bitcoin-
  ETF-era nation-state bitcoin warnings.

