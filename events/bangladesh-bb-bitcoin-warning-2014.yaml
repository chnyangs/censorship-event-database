trigger:
  type: regulatory_enforcement
  actor: BD_BB
  timestamp: 2014-09-15T00:00:00Z
  timestamp_precision: day
  citation:
    - type: supporting_journalism
      url: https://www.coindesk.com/markets/2014/09/16/bangladesh-central-bank-cryptocurrency-use-is-a-punishable-offense
      wayback: https://web.archive.org/web/2014/https://www.coindesk.com/markets/2014/09/16/bangladesh-central-bank-cryptocurrency-use-is-a-punishable-offense
      evidence_use: contextual_unarchived
      note: |
        CoinDesk report dated 2014-09-16 ("Bangladesh Central Bank:
        Cryptocurrency Use is a 'Punishable Offense'") summarising the
        Bangladesh Bank (BB) warning issued on or around 2014-09-15.
        Core content: BB stated that transactions involving bitcoin
        and other virtual currencies could constitute unauthorised
        acts under the Foreign Exchange Regulation Act, 1947 and the
        Money Laundering Prevention Act, 2012 and the Anti-Terrorism
        Act, 2009, and that such activity could be punishable by up
        to 12 years' imprisonment. The CoinDesk article is the most
        widely cited English-language anchor for the 2014 BB warning;
        the original BB press release was not widely reproduced in
        the local Bangladeshi press in 2014. evidence_use=
        contextual_unarchived; specific Wayback snapshot timestamp
        requires re-pinning during human audit before this citation
        may serve as an admission anchor.
    - type: supporting_tracker
      url: https://www.thedailystar.net/law-our-rights/law-analysis/bitcoin-legality-in-bangladesh-bank-1602583
      wayback: https://web.archive.org/web/2020/https://www.thedailystar.net/law-our-rights/law-analysis/bitcoin-legality-in-bangladesh-bank-1602583
      evidence_use: contextual_unarchived
      note: |
        The Daily Star (Bangladesh) law-analysis column "Bitcoin
        legality in Bangladesh Bank", providing a retrospective
        Bangladeshi-press summary of the 2014 BB warning and the
        legal-interpretation theory underpinning it. Confirms that
        BB framed bitcoin transactions as potentially violating the
        Foreign Exchange Regulation Act 1947 and the AML/CFT statutes
        (Money Laundering Prevention Act 2012, Anti-Terrorism Act
        2009) with up-to-12-year prison exposure, but stopped short
        of declaring bitcoin per se criminal. evidence_use=
        contextual_unarchived; specific Wayback snapshot timestamp
        requires re-pinning during human audit.
    - type: supporting_journalism
      url: https://futrlaw.org/bangladesh-bank-issues-cautionary-notice-bitcoin/
      wayback: https://web.archive.org/web/2022/https://futrlaw.org/bangladesh-bank-issues-cautionary-notice-bitcoin/
      evidence_use: contextual_unarchived
      note: |
        FutureLaw retrospective summary "Bangladesh Bank issues
        cautionary notice against Bitcoin", corroborating the BB
        2014 warning content (Foreign Exchange Regulation Act 1947
        + AML/CFT prison exposure framing). Used as a corroborating
        secondary tracker source. evidence_use=contextual_unarchived;
        specific Wayback snapshot timestamp requires re-pinning
        during human audit.
  timestamp_sources:
    - type: supporting_journalism
      note: |
        CoinDesk's 2014-09-16 report dates the BB warning to "this
        week"; contemporaneous English-language secondary coverage
        consistently anchors the warning to on or around 2014-09-15.
        Day-level precision is appropriate because the BB press
        release does not carry intra-day publication timing in the
        public record available to this authoring pass.

target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    Target is the class of Bangladeshi residents and entities
    contemplating bitcoin transactions, and by extension the
    off-ramp / centralized-exchange surface that would serve
    Bangladeshi-resident bitcoin purchases. The BB warning does
    not enumerate specific exchanges or specific resident
    counterparties; it states a legal-interpretation that applies
    to the entire class of Bangladeshi-resident bitcoin
    transacting parties under the Foreign Exchange Regulation
    Act 1947 and the AML/CFT statutes. No specific exchange is
    named as a target, so canonical_domains is empty. This
    class-level subset framing matches the sibling iceland-cbi-
    foreign-exchange-bitcoin-2014 treatment.
  protocol: null
  actor_type: regulated_resident_class
  actor_name: Bangladesh-resident bitcoin transacting parties
  chains:
    - bitcoin
  canonical_domains: []

jurisdiction:
  - BD

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The 2014-09-15 BB warning does not direct ISP-level domain
      blocking or DNS interference; it is a legal-interpretation
      notice under the existing Foreign Exchange Regulation Act
      1947 and AML/CFT statutes. not_applicable consistent with
      iceland-cbi-foreign-exchange-bitcoin-2014 and china-pboc-
      crypto-ban-2013-12 sibling treatment.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Bitcoin proof-of-work consensus in 2014-09 has no protocol-
      level relay-filter primitive analogous to the post-Merge
      Ethereum PBS relay surface. The Ethereum Merge itself is
      ~8 years downstream (2022-09-15). not_applicable on
      construct-did-not-exist grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      The MEV-Boost / Flashbots Protect / MEV-Blocker public-RPC
      compliance substrate that the L3 layer measures did not
      exist in 2014; Flashbots Protect launched 2022-11 and
      MEV-Blocker launched 2023-03-27. not_applicable on
      construct-did-not-exist grounds.
  - layer: l4_frontend
    status: not_applicable
    note: |
      The BB warning is a legal-interpretation notice addressed
      to Bangladeshi residents; it does not require frontend
      changes at any specific exchange or service. No L4 frontend
      surface within Bangladesh is in scope.
  - layer: asset_onchain
    status: not_applicable
    note: |
      Bitcoin native asset has no issuer-side blacklist / freeze
      admin method. The 2014 BB warning does not engage a
      stablecoin-issuer admin path (USDT first issued ~2014-10;
      chainwide admin freezes arose later). not_applicable on
      construct-did-not-exist grounds.
  - layer: offramp_cex
    status: partially_measured
    note: |
      The BB warning is by construction an off-ramp-layer signal:
      it tells Bangladeshi residents that bitcoin transactions
      could violate the Foreign Exchange Regulation Act 1947 and
      the AML/CFT statutes and carry up to 12 years' prison
      exposure. The coverage scope for the observed_no_change row
      below is the public record (English crypto-press, The Daily
      Star, FutureLaw retrospective) for the 90 days following the
      2014-09-15 warning: no specific exchange is documented as
      having cut off Bangladeshi-resident accounts in that window,
      and the dominant 2014 bitcoin exchanges (Bitstamp, Bitfinex,
      LocalBitcoins) did not maintain Bangladesh-specific
      compliance flags in the public record. Class-level
      Bangladeshi-resident exposure to FX / AML law is real but
      not exchange-side observable in this authoring pass.
      partially_measured because the public-record search is
      bounded but not exhaustive.
    denominator_artifact:
      type: scope_descriptor
      scope_descriptor:
        countries:
          - BD
        time_window:
          - 2014-09-15T00:00:00Z
          - 2014-12-14T00:00:00Z
      note: |
        Coverage scope: Bangladesh-resident off-ramp cutoffs
        documented in the public record during the 90-day window
        following the BB 2014-09-15 warning. No exchange-side
        Bangladesh-specific cutoff was located in this authoring
        pass; a human-audit pass on contemporaneous Bangladeshi
        press (Prothom Alo, The Daily Star, The Financial Express)
        and English crypto-press (CoinDesk, Bitcoin Magazine) is
        the gating step for a stronger denominator anchor.

