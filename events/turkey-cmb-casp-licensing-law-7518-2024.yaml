analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17** (Phase F follow-on to
  turkey-cbrt-crypto-ban-2021; lean run): authored by LLM agent
  without personally verifying Wayback / body_hash. status=draft and
  origin=agent_draft pending human review.

  null_event documenting Turkey's 2024-07-02 enactment of Law No.
  7518 amending the Capital Markets Law (CMK / Law 6362) to
  establish a comprehensive CASP licensing regime under the Capital
  Markets Board (CMB / Sermaye Piyasası Kurulu / SPK). The law
  grants the CMB authority to license, supervise, and sanction
  Crypto Asset Service Providers operating in Turkey, introduces a
  customer-asset segregation obligation, and sets a transition
  window for incumbent operators (BtcTurk, Paribu, ICRYPEX,
  Bitexen, Binance TR, etc.) to file license applications.
  Secondary regulations (Communiqués III-35/B.1 platform services
  and III-35/B.2 custody-only) published 2025-03-13 specify TRY
  100M minimum charter capital for platforms and TRY 50M for
  custody-only entities.

  Follow-on to turkey-cbrt-crypto-ban-2021: the 2021 CBRT
  regulation severed the payment-rail on-ramp (banning crypto in
  payments) but left exchanges formally operational; Law 7518
  three years later constructs the affirmative licensing regime
  the 2021 regulation had implicitly assumed but never specified.
  Together they form a two-step Turkish nation-state regulatory
  arc: payment-rail block (2021) → CASP licensing regime (2024).

  trigger.type=regulatory_enforcement (per codebook §5.1 row for
  "Non-US national regulator administrative enforcement"). The
  CMB is a non-US national regulator and Law 7518 grants
  administrative licensing/supervisory authority — distinct from
  a network/payment-rail block (which would be
  nation_state_block, as used for the 2021 CBRT parent).
  research_stratum=S4_nation_state per codebook §5.2 mapping.

  empirical_shape=null_event because the corpus has no replayable
  on-chain or measurement-platform signal of downstream CASP
  behavior change at authoring time; the regulator-decreed
  licensing requirement is itself the substantive trigger. Human
  auditor may upgrade to comparison if a Turkish CASP exit /
  withdrawal-policy diff is later pinned.

scoped_claim: |
  "Turkey's Law No. 7518 of 2024-07-02 amended the Capital Markets
