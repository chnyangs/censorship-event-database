recovery:
  - layer: offramp_cex
    resolved: true
    resolved_timestamp: 2014-02-15T00:00:00Z
    citation:
      - type: supporting_journalism
        url: https://www.coindesk.com/markets/2014/02/17/thai-bitcoin-exchange-reopens-but-legal-standing-still-unclear/
        wayback: https://web.archive.org/web/2014/https://www.coindesk.com/markets/2014/02/17/thai-bitcoin-exchange-reopens-but-legal-standing-still-unclear/
        evidence_use: contextual_unarchived
        note: |
          CoinDesk 2014-02-17 reporting that Bitcoin Co. Ltd received a
          BOT clarification letter dated 2014-01-31 stating that
          bitcoin trading fell outside the BOT's regulatory scope, and
          resumed exchange services on 2014-02-15. The reversal was
          framed by the BOT not as a regulatory change but as a
          clarification that bitcoin was never within its statutory
          scope under the Exchange Control Act B.E. 2485 (1942). The
          BOT released follow-up statements within days suggesting the
          operator had "interpreted the letter to serve its own
          interests"; legal ambiguity persisted through 2014.
    note: |
      Partial reversal: Bitcoin Co. Ltd resumed services 2014-02-15
      after the BOT clarification letter (dated 2014-01-31). The BOT
      framed the action as a scope-clarification rather than a
      regulatory change; subsequent 2014-02 / 2014-03 BOT statements
      reintroduced ambiguity about whether exchanges were "still
      illegal," and the broader Thai regulatory frame for crypto did
      not stabilize until subsequent SEC-Thailand and BOT actions in
      the 2017-2018 window. Recovery is recorded for the offramp_cex
      operator state only; the underlying legal ambiguity is documented
      in analysis_notes.

analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-4 audit (S4 comparison/Thailand cluster)
  by human:xiangwen as empirical_case. Bitcoin Co. Ltd suspension notice
  (primary_corporate, pre-pinned v0_3_repair body_hash) evidence_use upgraded
  ->replayable; CoinDesk Wayback 20211020132827 reclassified semi_primary_wayback.
  offramp_cex observed_change/direct retained (exchange suspension notice
  citing BOT advisement is primary_corporate). BOT 2013-07-29 verbal advisement
  -> Bitcoin Co. Ltd suspended exchange services (resumed 2014-02-15 after BOT
  out-of-scope clarification). comparison/empirical_case preserved.

  **NEW EVENT AUTHORED — DRYRUN 2026-05-17**. Phase E pre-Bitcoin-baseline
  follow-on / Phase B historical-baseline 2013-2016 admit-pass: foundational
  pre-2017 non-US central-bank action against Bitcoin. Authored by LLM agent
  in this pass at origin=agent_draft and status=draft per the task brief;
  human review required to (i) re-pin Wayback snapshots for the CoinDesk and
  Bangkok Post anchors, (ii) verify the corporate-source Bitcoin Co. Ltd
  suspension-notice text against the v0.3 Wayback body_hash/body_path
  primary_corporate anchor, and (iii) decide whether to upgrade to
  origin=human_reviewed.

  Substantive findings:
  - 2013-07-29 Bank of Thailand (BOT) Foreign Exchange Administration and
    Policy Department held a meeting with Bitcoin Co. Ltd (a Thailand-
    incorporated bitcoin exchange that had voluntarily approached the BOT
    seeking clearance to operate).
  - BOT verbally advised that, due to (a) lack of existing applicable
    Thai laws covering bitcoin, (b) capital controls under the Exchange
    Control Act B.E. 2485 (1942) which gives the BOT competent-officer
    authority over foreign-exchange transactions, and (c) the multi-facet
    nature of bitcoin straddling currency, commodity, and payment
    functions, the following bitcoin activities were illegal in
    Thailand: purchase or sale of bitcoins; purchase or sale of goods or
    services for bitcoins; sending or receiving bitcoins across the
    Thai border.
  - BOT did not publish a written regulation; the advisement was
    verbal. Bitcoin Co. Ltd posted a public statement on its website
    the same day announcing suspension of operations.
  - The suspension lasted approximately 6.5 months until 2014-02-15,
    when Bitcoin Co. Ltd resumed services following a BOT clarification
    letter (dated 2014-01-31) stating that bitcoin trading fell outside
    the BOT's regulatory scope. BOT subsequently introduced ambiguity
    by suggesting the operator had over-interpreted the clarification.

  Why trigger.type=regulatory_enforcement: per codebook §5.1, the BOT
  advisement is a non-US national-regulator administrative action
  (specifically an informal verbal directive under the Exchange Control
  Act framework), not a network-layer or ISP-level block. This matches
  the 2026-05-17 codebook addition formalizing regulatory_enforcement
  as the canonical trigger type for non-US national-regulator
  administrative enforcement actions distinct from nation_state_block
  (which is reserved for ISP/DNS/payment-rail blocks).

  Why temporal_tier=historical_baseline_2013_2016 and
  analysis_use=historical_baseline: per codebook §6 and the project's
  2008+ tiered frame, events in the 2013-2016 window belong to the
  historical-baseline tier and excluded from the 2017+ comparable-
  analysis denominator. Canonical form per §6 — alias
  "contextual_baseline" is NOT accepted by the validator.

  Why empirical_shape=comparison: per codebook §3, only the offramp_cex
  layer carries an observed_change row in this event (one
  observed_change → comparison, not cascade). L0/L1/L3/asset_onchain
  are not_applicable on construct-did-not-exist or scope-mismatch
  grounds; L4 frontend is not_measured pending Wayback capture of the
  Bitcoin Co. Ltd 2013-07 suspension-notice page.

  Why admission_tier=empirical_case: per codebook §4, exactly one
  strong-attribution (direct) observed_change row exists at
  offramp_cex; this admits the event at empirical_case, below the
  ≥ 2 strong-attribution rows that would be required for anchor_case.

  Why attribution=direct on the offramp_cex observation: under
  codebook §1.2-§1.5 logic adapted to a non-US regulatory enforcement
  trigger: (i) the BOT advisement directly named Bitcoin Co. Ltd's
  proposed bitcoin-exchange business as the subject of the meeting
  and the addressee of the verbal advisement, and (ii) the operator's
  public same-day suspension statement explicitly cites the BOT
  advisement as the cause. Both prongs of the direct-attribution test
  hold; the only conservatism the LLM applied is to keep the event at
  empirical_case rather than anchor_case given the single observation
  row.

  Why related_events=[china-pboc-crypto-ban-2013-12]: the Thailand
  BOT 2013-07-29 advisement and the China PBOC 2013-12-05 Notice
  2013/289 form the two foundational pre-2017 non-US central-bank
  actions against Bitcoin in the dataset. Both are Asia-jurisdiction
  central-bank administrative actions establishing the early-2010s
  banking-rail-severance pattern that the comparable-analysis corpus
  (2017+) inherits.

  Cross-event contrast: PBOC 2013-12-05 is a published joint five-
  ministry notice and is coded as trigger.type=nation_state_block
  given the breadth of its directive to PRC financial institutions
  and payment service providers (banking-rail prohibition at class
  level); the Thailand BOT 2013-07-29 advisement is a verbal single-
  entity directive and is coded as trigger.type=regulatory_enforcement
  under the codebook §5.1 distinction between class-wide payment-rail
  blocks and administrative non-US-regulator actions. The pair is the
  canonical 2013 Asia-jurisdiction central-bank-vs-bitcoin comparison
  in the historical-baseline tier.

scoped_claim: |
  On 2013-07-29 the Bank of Thailand Foreign Exchange Administration and
  Policy Department issued a verbal administrative advisement to Bitcoin
  Co. Ltd that bitcoin trading was illegal under Thai law given the
  Exchange Control Act B.E. 2485 framework; Bitcoin Co. Ltd suspended
  operations the same day and resumed approximately 6.5 months later
  (2014-02-15) following a BOT clarification letter. The offramp_cex
  layer carries the single direct-attribution observed_change row;
  L0/L1/L3/asset_onchain are not_applicable on construct or scope
  grounds and L4 frontend is not_measured pending Wayback capture.

scoped_knowledge: |
  This event is one of the two foundational pre-2017 non-US central-bank
  actions against Bitcoin in the dataset (paired with PBOC 2013-12-05
  five-ministry Notice 2013/289). It is also the earliest dataset event
  to use the trigger.type=regulatory_enforcement codebook category
  (formalized 2026-05-17): the BOT advisement is administrative and
  verbal rather than a published regulation or a network-layer block,
  and Thailand lacked at the time a statutory crypto-asset framework
  the BOT could enforce directly. The 6.5-month suspension and partial
  recovery in 2014-02 illustrate the early-2010s pattern of
  jurisdiction-specific regulatory ambiguity rather than durable
  prohibition. The empirical-shape=comparison classification reflects
  the construct-did-not-exist limits on cross-layer measurability in
  2013 (Bitcoin-only chain surface, no asset-issuer admin layer, no
  L1/L3 relay layer) and the policy scope itself (single-entity verbal
  advisement, not a network or payment-rail block). Within the
  historical-baseline tier the event is best understood as a
  comparison-pair member with PBOC 2013-12-05: same calendar year,
  same Asia-region central-bank actor type, opposite instrument
  shapes (verbal single-entity advisement vs published class-wide
  joint ministry notice).

