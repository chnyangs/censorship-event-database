  - layer: l3_rpc
    status: not_applicable
    note: |
      MEV-Boost / Flashbots Protect / MEV-Blocker public-RPC compliance
      substrate did not exist in 2013. not_applicable on
      construct-did-not-exist grounds.
  - layer: l4_frontend
    status: not_measured
    scope:
      - bitcoin.co.th
    note: |
      Bitcoin Co. Ltd's customer-facing site (bitcoin.co.th) posted the
      2013-07-29 suspension statement on its frontend, but a Wayback
      snapshot pinning the specific suspension-notice page has not been
      captured in this authoring pass. The frontend remained reachable
      (the notice was served by the operator itself, not a takedown);
      no operator-frontend-disable observation is coded. Status remains
      not_measured pending a follow-on Wayback-capture pass.
  - layer: asset_onchain
    status: not_applicable
    note: |
      Bitcoin native asset has no issuer-side blacklist / freeze admin
      method. The BOT advisement does not engage a stablecoin-issuer
      admin path (USDT first issued ~2014-10). not_applicable on
      construct-did-not-exist grounds.
  - layer: offramp_cex
    status: measured
    scope:
      - bitcoin_co_ltd_thailand
    note: |
      Load-bearing observation. Bitcoin Co. Ltd suspended its bitcoin-
      exchange services on 2013-07-29 in direct compliance with the
      BOT Foreign Exchange Administration and Policy Department's
      verbal advisement that bitcoin trading was illegal under Thai
      law. The suspension lasted from 2013-07-29 through 2014-02-15
      (~6.5 months), at which point the BOT issued a clarification
      letter (dated 2014-01-31, acted on 2014-02-15) that bitcoin
      trading was outside its regulatory scope, and Bitcoin Co. Ltd
      resumed operations. partially_measured because the corporate
      suspension notice is the load-bearing operator-side anchor but
      the underlying BOT verbal advisement was not published as a
      primary legal instrument; the Wayback snapshot for the Bitcoin
      Co. Ltd suspension page has not been pinned in this pass.

