    status: not_applicable
    note: |
      Federal Law No. 221-FZ does not direct ISP-level domain blocking
      or DNS interference. The law operates at the federal statutory
      / registration / electricity-consumption layer, not the network
      layer. not_applicable on construct-not-engaged grounds,
      consistent with the sibling russia-dfa-law-2020 L0 treatment.
  - layer: l1_consensus
    status: not_measured
    chain: bitcoin
    note: |
      Federal Law No. 221-FZ is the permissive framework law that
      legalizes industrial-scale Bitcoin mining in Russia under a
      Federal Tax Service registration regime, with most provisions
      effective ten days after publication and the special-registry
      provisions effective 2024-11-01. The l1_consensus layer is the
      semantically relevant layer (mining_hashpower maps to
      l1_consensus per the authoring brief), but the law itself
      neither shuts down nor compels any specific hashpower change:
      it formalizes the prior gray-market mining activity into a
      regulated registered class. No observed_change is recorded at
      this layer in this authoring pass; the post-effective-date
      hashrate redistribution attributable specifically to the
      legalization (versus concurrent regulatory moves, electricity
      pricing changes, and the 2024-12-23 regional ban that
      counter-balanced the federal legalization) has not been
      quantitatively measured here. not_measured pending replayable
      hashrate-share evidence; a coverage_gap observation row is
      recorded below to signal the null_event posture.
  - layer: l3_rpc
    status: not_applicable
    note: |
      The law is a Bitcoin-mining federal framework statute; it does
      not engage the MEV-Boost / Flashbots Protect / MEV-Blocker
      public-Ethereum RPC compliance substrate. not_applicable on
      construct-not-engaged / scope-mismatch grounds.
  - layer: l4_frontend
    status: not_applicable
    note: |
      The law targets mining activity at the federal registration /
      electricity-consumption layer, not crypto-exchange or
      crypto-application frontends. No L4 frontend takedown is
      directed or implied. not_applicable on construct-not-engaged
      grounds.
  - layer: asset_onchain
    status: not_applicable
    note: |
      The law is a mining-activity framework statute; it does not
      engage stablecoin-issuer admin-freeze primitives or any other
      on-chain issuer-side mechanism. not_applicable on
      construct-not-engaged grounds.
  - layer: offramp_cex
    status: not_applicable
    note: |
      The law targets mining at the federal registration /
      electricity-consumption layer. It does not direct Russian or
      foreign-licensed exchanges to retire Russian-user accounts or
      to suspend service. The separate Russian crypto-payments /
      circulation regime is the subject of the sibling
      russia-cbr-crypto-payment-ban-2022 and russia-dfa-law-2020;
      this 2024-08-08 federal mining-legalization statute does not
      engage the offramp_cex layer. not_applicable on
      construct-not-engaged grounds.

