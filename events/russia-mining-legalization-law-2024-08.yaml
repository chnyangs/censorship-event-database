  S4_nation_state null_case anchored on the 2024-08-08 Russian
  Federation Federal Law No. 221-FZ "On Amendments to Certain
  Legislative Acts of the Russian Federation," signed by President
  Vladimir Putin, legalizing cryptocurrency mining in Russia. Most
  provisions take effect ten days after publication; the
  special-registry provisions (Federal Tax Service registry of
  industrial-scale miners and mining-infrastructure operators) take
  effect 2024-11-01. Dual character: the law is permissive at the
  federal level (it legalizes industrial mining and formalizes prior
  gray-market activity under a registration regime), and is
  counter-balanced by the subsequent 2024-12-23 Council of Ministers
  regional ban (sibling event russia-mining-regional-ban-2024-12)
  which carved out ten regions where mining is prohibited from
  2025-01-01 through 2031-03-15.

  Why trigger.type=regulatory_enforcement: per codebook §5.1, the
  trigger.type=regulatory_enforcement enum value covers non-US
  national-regulator administrative actions; for a Russian federal
  framework statute issued by RU_FEDERAL_LAW (the Federal Assembly
  acting through presidential signature) regulating the
  mining-activity class, regulatory_enforcement is the closest
  available enum value. The same trigger.type / actor pairing is used
  by the sibling russia-dfa-law-2020 for the 2020-07-31 Federal Law
  No. 259-FZ (DFA law), maintaining cross-event consistency for
  Russian federal framework statutes that regulate the crypto
  perimeter without engaging the network or payment-rail layer.

  Why empirical_shape=null_event / admission_tier=null_case: the law
  is a permissive framework statute that legalizes (does not
  prohibit) industrial-scale mining. No observed_change is recorded
  at any layer; the single observation row at l1_consensus is
  observed_no_change with attribution=none. Per codebook §3,
  null_event requires 0 observed_change layers with admission-grade
  observed_no_change support; admission_tier=null_case follows from
  0 strong-attribution observed_change layers (codebook §4). This is
  a denominator-control row for the Russia federal mining-regulatory
  arc rather than a paper-anchor cascade row.

  Why target.kind=entity / enumeration=subset: the schema
  target_kinds enum does not include "mining_activity_class" or
  "regulated_industry_class"; entity is the closest enum for a
  statutory class target, matching the convention used by sibling
  russia-dfa-law-2020 (entity / subset for the Russian crypto-user
  population class) and russia-mining-regional-ban-2024-12 (entity /
  subset for the regional-mining-activity class). enumeration=subset
  because the law addresses a statutory class (all in-Russia mining)
  rather than an enumerated roster of named operators.

  Why jurisdiction=[RU]: single-jurisdiction federal statute. The
  Federal Tax Service registry is a domestic Russian instrument
  without cross-border target enumeration.

  Why all other layers are not_applicable / l1 is not_measured: the
  law does not direct L0 ISP / DNS blocking, L3 RPC compliance,
  L4 frontend takedowns, asset_onchain admin freezes, or
  offramp_cex restrictions. The semantically relevant l1_consensus
  layer is coded not_measured rather than not_applicable because
  mining is the law's subject matter, but the law is permissive
  rather than restrictive at the consensus / hashpower substrate;
  no replayable hashpower-share artifact is pinned in this authoring
  pass to support a measured / partially_measured coverage claim
  (codebook §2 Kazakhstan precedent).

  Dual-character cross-event framing: this 2024-08-08 federal
  legalization and the 2024-12-23 regional ban (sibling
  russia-mining-regional-ban-2024-12) together form a within-year
  permissive-then-counterbalanced regulatory pair: the federal
  legalization opens the registration regime, and the Council of
  Ministers regional decision (acting on authority delegated by the
  221-FZ framework) carves out ten regions of permanent prohibition
  plus seasonal Siberian restrictions. Within-jurisdiction
  longitudinal context: russia-cbr-bitcoin-information-letter-2014
  (CBR advisory) → russia-dfa-law-2020 (Federal Law 259-FZ defining
  digital currency and prohibiting payment use) →
  russia-cbr-crypto-payment-ban-2022 (CBR payment-rail prohibition)
  → russia-mining-legalization-law-2024-08 (this event) →
  russia-mining-regional-ban-2024-12 (regional counter-balance).

