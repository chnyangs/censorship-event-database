analysis_notes: |
  **NEW EVENT AUTHORED -- AGENT_DRAFT 2026-05-31**. Created from the P4
  census-gap queue after official NYDFS source capture. The event remains
  `status=draft` and `origin=agent_draft`; automation must not promote it to an
  admitted paper row without human admission review.

  Inclusion rationale: this is distinct from the 2015 BitLicense parent event
  and from SEC v. Bittrex 2023. The 2015 row models the original BitLicense
  regime and early exit cascade; this row models a later, entity-specific NYDFS
  denial of Bittrex's license applications that immediately required New York
  cessation and a 60-day wind-down. The 2023 SEC row models the separate
  Bittrex US shutdown / Chapter 11 episode.

  Modeling rationale: US state/subnational administrative regulator actions
  are coded trigger.type=regulatory_enforcement and research_stratum=
  S4_nation_state per the 2026-05-31 scope decision. The access effect is at
  the exchange/off-ramp layer for New York residents, with direct attribution
  to the NYDFS order.

scoped_claim: |
  "On 2019-04-10 NYDFS denied Bittrex, Inc.'s New York virtual-currency and
  money-transmission license applications and required Bittrex, effective
  2019-04-11, to cease operating in New York and wind down its New York
  business within 60 days. The event is modeled only as a state-regulator
  exchange/off-ramp restriction for New York residents; no L0/L1/L3/L4 or
  asset-onchain effect is claimed."

