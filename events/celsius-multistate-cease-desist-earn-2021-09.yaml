analysis_notes: |
  **ADMITTED 2026-06-09**. Sources: two captured primary_legal anchors
  (NJ Bureau of Securities cease-and-desist PDF, body_hash-pinned, pdfinfo-
  confirmed as "Celsius Cease and Desist 9.17.21.pdf" dated 2021-09-17; TX
  State Securities Board Notice of Hearing, text-extractable, confirms
  Celsius Earn product and 2021-09-17 wave). Attribution is direct at
  offramp_cex: the NJ order names Celsius and the product, corroborated by
  independent TX primary_legal artifact. NJ PDF is image/scanned locally
  but official provenance is established by domain (nj.gov/oag), pdfinfo
  metadata, and TX corroboration.

  Inclusion rationale: this is the Celsius analog to the admitted BlockFi
  New Jersey BIA row. It concerns a state securities regulator restriction on a
  legitimate centralized crypto lending/yield product, not a generic investor
  warning or post-collapse fraud prosecution. The separate admitted
  `celsius-bankruptcy-mashinsky-doj-2023` row models the later 2022-2023
  platform collapse / DOJ-SEC-CFTC-FTC legal-disposition arc; this event is
  not a duplicate.

  Modeling rationale: US state/subnational administrative regulator actions
  are coded trigger.type=regulatory_enforcement and research_stratum=
  S4_nation_state per the BlockFi/NYDFS precedents. The access effect is
  modeled at the centralized lending/off-ramp product layer. The broader
  multi-state wording (NJ/TX/AL/KY) is intentionally narrowed to the two
  replayable NJ/TX official anchors captured in this pass.

scoped_claim: |
  "On 2021-09-17 New Jersey's official Celsius cease-and-desist PDF and Texas's
  same-day official notice/hearing PDF anchored a state-regulator wave against
  Celsius's Earn Rewards / Earn Interest-Bearing Account product. The event
  models a single-layer S4 state-regulator lending/off-ramp restriction, with
  New Jersey as the load-bearing official order artifact (body_hash-pinned,
  pdfinfo-confirmed) and Texas as independent corroborating primary_legal
  context. No L0/L1/L3/L4 or asset-onchain effects are claimed."

