analysis_notes: |
  **SOURCE-REPAIRED 2026-06-01**: promoted-from-candidate history retained,
  but the load-bearing CFTC press release plus the two CFTC administrative
  orders now have local body_hash/body_path replay anchors. The prior wording
  that described a CFTC-mandated two-year quarterly reserve-composition regime
  has been narrowed: that reporting obligation belongs to the NYAG predecessor
  settlement, while this CFTC row supports the federal reserve-misrepresentation
  order, civil penalty, cease-and-desist, and recorded Tether remediation
  posture. The legacy Tether corporate-response URL was not retained as a claim
  anchor because the current live capture resolves to a generic Tether homepage.
  This source-repair note is not a last_human_audit claim.

  comparison shape: 2 observed_change rows on a single distinct layer
  (offramp_cex), keyed by two different operator actors — the Bitfinex
  exchange operator entities (iFinex / BFXNA / BFXWW) and the Tether
  USDT issuer entities (Tether Holdings / Tether Limited / Tether
  Operations / Tether International). L0 / L1 / L3 / L4 / asset_onchain
  are all not_applicable because the 2021-10-15 CFTC orders did not
  alter ISP-level reachability, did not engage Ethereum PBS relays
  (which did not yet exist), did not implicate the L3 RPC compliance
  substrate (also did not yet exist), did not require frontend
  takedown or new geofencing, and did not compel a USDT addBlackList()
  on-chain action. The Tether order is a reserve-misrepresentation /
  off-chain disclosure-remediation action and is recorded at offramp_cex
  on the Tether issuer actor instead of at asset_onchain.

  **Two-target consolidated CFTC action**: this is a paper-worthy
  precedent of a single CFTC press release packaging two distinct
  but linked enforcement axes (off-exchange retail-commodity
  enforcement against Bitfinex + stablecoin-issuer disclosure
  enforcement against Tether) arising from a single multi-year
  investigation. Both target groups are members of the same iFinex
  corporate cluster, but the two CFTC orders address structurally
  different regulatory axes: the Bitfinex order extends the 2016
  CEA Section 4(a) / 4d retail-commodity enforcement (see
  bitfinex-cftc-retail-commodity-2016), while the Tether order
  imposes a stablecoin-issuer reserve-misrepresentation penalty and
  cease-and-desist that is the federal commodities-law counterpart of
  the 2021-02-23 NYAG settlement, without re-coding the NYAG quarterly
  reporting obligation as a CFTC-created duty.

  **Relationship to prior and successor events in the corpus**:
  - bitfinex-cftc-retail-commodity-2016 (2016-06-02): predecessor
    CFTC retail-commodity action against BFXNA Inc., $75K penalty;
    this 2021-10-15 order is the second CFTC enforcement against
    the same Bitfinex operator entities and extends the review
    period to 2016-03-01 through 2018-12-31 (covering activity that
    postdated the 2016 order). Recidivism precedent paper-worthy.
  - tether-retroactive-sweep-2023 (2023-12-09): later corporate-
    policy event on the Tether USDT issuer actor, registered at
    asset_onchain on the USDT addBlackList() primitive against
    historical OFAC-SDN ETH addresses. The 2021-10-15 CFTC reserve-
    misrepresentation settlement predates this on-chain compliance
    pattern by ~2 years, but this row does not claim that the CFTC
    settlement caused the later blacklist policy.
  - tether-doj-pig-butchering-freeze-2023 (2023-11-20): related
    Tether issuer action recording USDT addBlackList() against
    pig-butchering scam addresses in coordination with US DOJ;
    illustrates a later and distinct Tether-issuer compliance-tooling
    pattern; this row does not infer causation from the 2021-10-15
    CFTC settlement to that later on-chain action.
  - circle-usdc-tornado-2022 (2022-08-08): the comparator
    stablecoin issuer event on USDC; pairing 2021-10-15 against
    2022-08-08 documents the asymmetric stablecoin-issuer
    compliance posture (Circle: same-day OFAC compliance; Tether:
    reserve-misrepresentation settlement on an off-chain disclosure
    axis). Useful for paper claims about stablecoin-issuer
    compliance-clock asymmetry.
  - binance-cftc-2023 (2023-03-27): later CFTC civil complaint
    against a different (larger) crypto exchange operator;
    structural sibling on the offramp_cex CFTC enforcement axis.

  **Empirical_shape = comparison** (1 distinct observed_change
  layer = offramp_cex); admission_tier = empirical_case (2 direct-
  attribution observed_change rows on offramp_cex, each with
  replayable primary_legal CFTC press-release and order anchors.

scoped_claim: |
  "The 2021-10-15 CFTC press release 8450-21 packages two simultaneous
  CFTC settlements ($1.5M against iFinex / BFXNA / BFXWW for illegal
  off-exchange financed retail commodity transactions in digital
  assets, and $41M against Tether Holdings / Limited / Operations /
  International for false or misleading statements regarding USDT
  reserve backing during 2016-06 through 2019-02), each registered
  as a single direct-attribution observed_change row at the
  offramp_cex layer. The Bitfinex order also required systems and
  procedures by 2021-12-31 to prevent covered U.S. persons from
  engaging in leveraged, margined, or financed retail commodity
  transactions on the platform. The CFTC settlement is a federal
  commodities-law reserve-misrepresentation counterpart to the
  2021-02-23 NYAG settlement, but this row does not claim the CFTC
  order created the NYAG quarterly-reporting duty. The row asserts
  neither network-layer reachability change nor any USDT
  addBlackList() on-chain action; the Tether reserve-remediation
  posture is recorded at offramp_cex (Tether-as-issuer fiat-rails
  interface), not at asset_onchain."

