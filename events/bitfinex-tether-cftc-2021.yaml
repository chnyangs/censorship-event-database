trigger:
  type: cftc_action
  actor: US_CFTC
  timestamp: 2021-10-15T00:00:00Z
  timestamp_precision: day
  citation:
    - type: primary_legal
      url: https://www.cftc.gov/PressRoom/PressReleases/8450-21
      wayback: https://web.archive.org/web/20260516000000/https://www.cftc.gov/PressRoom/PressReleases/8450-21
      evidence_use: contextual_unarchived
      note: |
        CFTC press release 8450-21 (2021-10-15): "CFTC Orders Tether and
        Bitfinex to Pay Fines Totaling $42.5 Million." Announces two
        simultaneous CFTC administrative settlements arising from a single
        investigation of iFinex Inc., BFXNA Inc., and BFXWW Inc. (operators
        of the Bitfinex cryptocurrency exchange) and of Tether Holdings
        Limited, Tether Limited, Tether Operations Limited, and Tether
        International Limited (collectively the USDT issuer group):
        (a) $1.5M civil monetary penalty against the Bitfinex entities for
        offering illegal off-exchange financed retail commodity transactions
        in digital assets to US persons, in violation of CEA Section 4(a),
        plus operating as an unregistered Futures Commission Merchant in
        violation of CEA Section 4d; and (b) $41M civil monetary penalty
        against the Tether entities for making untrue or misleading
        statements and omissions of material fact in connection with the
        US-dollar tether (USDT) stablecoin, specifically: USDT was
        marketed as "100% backed" by USD reserves but for substantial
        portions of the 2016-01 through 2018-02 review period the Tether
        entities held insufficient fiat reserves to back USDT 1:1 and
        commingled reserve assets with operational funds, including
        through transfers to and from Bitfinex. The 2021-10-15 CFTC
        action follows the 2021-02-23 NYAG settlement (NY OAG In the
        Matter of iFinex Inc. et al.) which already imposed a $18.5M
        penalty and a prohibition on serving New York residents plus a
        quarterly USDT reserve-composition reporting obligation. The
        CFTC settlement extends the disclosure-regime change to a
        federal-level commodities-law axis. Marked
        evidence_use=contextual_unarchived because the authoring LLM
        agent did not personally pin a Wayback snapshot timestamp or
        compute a body_hash for the press release; the CFTC press-release
        URL format is stable and routinely captured by Wayback, but the
        specific snapshot timestamp is to be re-pinned during human
        audit before this citation may serve as an admission anchor in
        its own right. Provisional Wayback anchor uses Wayback Machine
        2026-05-16 timestamp prefix.
    - type: primary_corporate
      url: https://tether.to/en/tether-and-bitfinex-reach-settlement-with-cftc/
      wayback: https://web.archive.org/web/20260516000000/https://tether.to/en/tether-and-bitfinex-reach-settlement-with-cftc/
      evidence_use: contextual_unarchived
      note: |
        Tether corporate response statement "Tether and Bitfinex Reach
        Settlement with the CFTC" (2021-10-15) confirming the $41M
        Tether + $1.5M Bitfinex settlement without admission of
        wrongdoing, and announcing prospective compliance with the
        CFTC-imposed disclosure regime including continued quarterly
        attestation reports on USDT reserve composition. Marked
        evidence_use=contextual_unarchived pending Wayback re-pin and
        body_hash capture during human audit. Provisional Wayback anchor
        uses Wayback Machine 2026-05-16 timestamp prefix.
  timestamp_sources:
    - type: primary_legal
      note: |
        Day-level timing per CFTC press release 8450-21 (2021-10-15) and
        the matching CFTC orders In the Matter of Tether Holdings Limited
        et al. and In the Matter of BFXNA Inc., BFXWW Inc., and iFinex
        Inc.

target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    Two enforcement-target groups consolidated into a single CFTC press
    release / dual-order action: (a) the Bitfinex operator entities
    iFinex Inc., BFXNA Inc., and BFXWW Inc., named in the $1.5M
    off-exchange retail commodity transaction order; and (b) the Tether
    issuer entities Tether Holdings Limited, Tether Limited, Tether
    Operations Limited, and Tether International Limited, named in the
    $41M USDT reserve-disclosure order. The row enumerates only the
    corporate-entity targets named in the two CFTC orders; it does not
    enumerate individual Bitfinex customer accounts, individual USDT
    holders, or specific on-chain USDT contract addresses. Canonical
    operator-controlled frontends are bitfinex.com (exchange) and
    tether.to (issuer transparency page).
  protocol: null
  actor_type: exchange_and_stablecoin_issuer_enforcement
  actor_name: iFinex / BFXNA / BFXWW (Bitfinex) + Tether Holdings / Tether Limited / Tether Operations / Tether International (USDT issuer)
  chains: [ethereum, tron, bitcoin]
  canonical_domains:
    - bitfinex.com
    - tether.to

jurisdiction: [US]

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The CFTC order is a US federal administrative enforcement action,
      not a network-level block of bitfinex.com or tether.to. ISP
      reachability of US or non-US users to either canonical domain was
      not altered by the 2021-10-15 orders; the operator-state change
      is at the financed-margin retail commodity product (Bitfinex) and
      issuer-disclosure regime (Tether), not the L0 reachability layer.
  - layer: l1_consensus
    status: not_applicable
    note: |
      A commodities-law civil enforcement action against an exchange
      operator and a stablecoin issuer. No validator-level or block-
      construction surface is implicated; the Ethereum Merge (and the
      MEV-Boost PBS relay-filter surface that L1 measures in this
      dataset) is still ~12 months downstream. not_applicable on
      construct-did-not-yet-exist grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      The MEV-Boost / Flashbots Protect / MEV-Blocker public-RPC
      compliance substrate that L3 measures did not exist in 2021-10;
      Flashbots Protect launched 2022-11. not_applicable on construct-
      did-not-yet-exist grounds.
  - layer: l4_frontend
    status: not_applicable
    note: |
      The CFTC orders did not require shutdown of the bitfinex.com or
      tether.to public frontends and did not require US-resident
      geofencing at the public-web layer. Bitfinex had already
      implemented US-resident exit / geoblock at the frontend level
      following the 2016-06-02 CFTC order (bitfinex-cftc-retail-
      commodity-2016) and the 2018 Bitfinex Withdrawal Notice; no
      additional L4 frontend diff is attributable to this 2021-10-15
      action.
  - layer: asset_onchain
    status: not_applicable
    chain: ethereum
    note: |
      The 2021-10-15 CFTC order against the Tether issuer entities
      targets the USDT reserve-attestation / disclosure regime — a
      corporate-disclosure axis — and does NOT compel a USDT blacklist
      or addBlackList() on-chain action against any specific
      address-set. The Tether USDT freeze primitive exists in 2021
      (and is used in other events such as tether-retroactive-sweep-
      2023 and tether-doj-pig-butchering-freeze-2023) but is not
      engaged by this CFTC settlement. Marked not_applicable rather
      than not_measured because the regulator-compelled change is
      definitionally off-chain (quarterly reserve-composition
      reports), not an on-chain admin action. The reserve-disclosure
      regime change is registered as an offramp_cex observation on
      the Tether issuer actor below.
  - layer: offramp_cex
    status: measured
    scope:
      - bitfinex_us_retail_financed_commodity_product
      - tether_usdt_reserve_attestation_regime
    note: |
      Load-bearing layer for this event with two distinct
      operator-state changes registered as observed_change rows:
      (1) iFinex / BFXNA / BFXWW operator-level remediation of the
      Bitfinex US-retail financed-commodity product line per the
      $1.5M order (CEA Section 4(a) / 4d violations — illegal
      off-exchange retail commodity transactions and operation as an
      unregistered Futures Commission Merchant); and (2) Tether
      issuer-level adoption of the CFTC-mandated USDT reserve-
      disclosure regime per the $41M order (mandatory quarterly
      reserve-composition reports for two years following the
      settlement, covering the prior 2016-01 through 2018-02
      misrepresentation period). Both are regulator-compelled
      operator-state changes at offramp_cex venues (Bitfinex spot/
      margin exchange and Tether issuer fiat-rails interface),
      attached below as two observation_kind=observed_change rows
      with attribution=direct.

