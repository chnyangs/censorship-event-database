analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission). On 2018-09-11 the US SEC
  (press release 2018-185) settled cease-and-desist charges against TokenLot
  LLC, a self-described "ICO Superstore" secondary-token trading platform, and
  owners Lenny Kugel and Eli L. Lewitt, for acting as unregistered
  broker-dealers (Section 15(a) Exchange Act) and unregistered securities
  offerings (Section 5 Securities Act). The order forced the platform to wind
  down and ordered destruction of its remaining digital-asset inventory —
  i.e. a state-mandated shutdown of a legitimate (registration-deficient)
  crypto-token trading service. In scope under §9 (enforcement that restricts/
  shuts a legitimate platform; sibling to the EtherDelta DEX charge). Single
  observed_change layer (offramp_cex token-trading surface) -> empirical_shape
  comparison, admission_tier empirical_case. attribution=direct: the SEC order
  is the operative instrument and names the targets. L0/L1/L3/l4_frontend/
  asset_onchain not_applicable: this is a securities-law platform shutdown, not
  a network/DNS block or an on-chain freeze. Sources verified via WebSearch
  2026-05-31; real SEC press-release page captured + body_hash-pinned (claims
  "TokenLot", "ICO Superstore", "broker-dealer", "winding down" grep-confirmed
  in the captured body; no fabrication).

scoped_claim: |
  "The 2018-09-11 SEC settled order against TokenLot LLC (the 'ICO Superstore')
  and its owners for unregistered broker-dealer activity forced the secondary-
  token trading platform to wind down and ordered destruction of its remaining
  digital-asset inventory. Effect carried at offramp_cex (token-trading surface
  shutdown), attribution=direct. Comparable-main tier."

