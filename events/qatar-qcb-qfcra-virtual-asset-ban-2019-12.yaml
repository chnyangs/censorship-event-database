analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: read the event +
  the captured national-regulator primary source confirming the ban/prohibition; §9 hard-ban
  censorship; clean per wave verify; validate.py [OK]).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission).

  comparison documenting the Qatar Financial Centre Regulatory Authority (QFCRA)
  ALERT prohibiting all Virtual Asset Services in or from the Qatar Financial Centre
  (QFC). The QFCRA ALERT PDF is dated "26 December 2019". §9 scope: a deliberate
  regulator prohibition (ban) of a legitimate virtual-asset-service class — IN
  scope.

  DATE CORRECTION: the candidate lead gave 2020-12-26, but the primary QFCRA ALERT
  PDF is dated 26 December 2019, and the Library of Congress GCC survey independently
  confirms "in December of 2019, the QFCRA issued an alert prohibiting the conduct
  of virtual asset services within or from the QFC." The event id and trigger date
  are corrected to 2019-12-26. The candidate also referenced QCB Circular No. 6 of
  2018 (barring Qatari banks from crypto dealing) — that is a separate, earlier
  Qatar Central Bank instrument and is NOT authored here (no primary source captured
  for it in this pass); this event scopes only the QFCRA QFC prohibition.

  trigger.type=regulatory_enforcement per codebook §5.1 (non-US national/sub-state
  financial-centre regulator administrative prohibition; the QFCRA regulates the QFC
  free-zone, structurally analogous to the UAE SCA / VARA framework rows). Stratum-
  actor map §5.2 maps regulatory_enforcement → S4_nation_state. attribution=plausible
  per §1.1 (alert targets the Authorised-Firm/VASP class, not enumerated operators).
  empirical_shape=comparison / admission_tier=empirical_case: one strong-attribution
  (plausible) observed_change layer (offramp_cex).

  Note: Qatar later (September 2024) introduced a Digital Assets Framework treating
  cryptocurrencies as "Excluded Tokens"; that is a separate downstream development
  outside this event's window.

scoped_claim: |
  "The QFC Regulatory Authority issued an ALERT dated 26 December 2019 affirming
  that Virtual Asset Services may not be conducted in or from the Qatar Financial
  Centre, barring all Authorised Firms from providing or facilitating VASP services
  (fiat-crypto exchange, custody, transfer) under QFC Law No. 7 of 2005, with a
  carve-out for regulated digital securities. Captured at class level at the
  offramp_cex layer; no specific operator enumeration claimed."

