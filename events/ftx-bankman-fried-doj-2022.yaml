analysis_notes: |
  Repair 2026-06-01: the previous row overclaimed a positive
  `global_withdraw_pause_and_chapter_11_customer_asset_freeze` observation
  at the 2022-12-13 DOJ trigger even though the off-ramp freeze and Chapter
  11 estate were already in place after the 2022-11-11 bankruptcy filing.
  This created a stale-denominator risk and made the DOJ parent row
  inconsistent with the SEC and CFTC sibling rows, which already model the
  same multi-agency date as null-control siblings.

  The repaired row preserves the 2022-12-13 DOJ criminal trigger and the
  target unit, but recodes the empirical shape to `null_event` /
  `null_case`: no new L0, L1, L3, L4, asset_onchain, or offramp_cex
  observed_change is attributed to the DOJ indictment itself. The measured
  off-ramp evidence is now an observed_no_change row anchored by the
  official DOJ indictment PDF, SEC/CFTC same-day releases, and an
  FTX-sourced PRNewswire release showing that Chapter 11 petitions had
  already been filed on 2022-11-11.

  The live DOJ HTML press-release URL drifted behind an Akamai interstitial
  during automated capture and is not retained as load-bearing evidence.
  The official DOJ-hosted indictment PDF remains replayable locally. This
  follows the corpus live-URL-drift rule: local body_hash/body_path anchors
  and narrowed claims carry the row, not current live HTML availability.

scoped_claim: |
  "The 2022-12-13 DOJ SDNY criminal indictment of Samuel Bankman-Fried is
  coded as a null-control federal-enforcement row: the FTX.com / FTX.US /
  Alameda off-ramp surface was already under the FTX Chapter 11 estate from
  the 2022-11-11 bankruptcy filing, and the DOJ trigger produced no new
  measured exchange/off-ramp, frontend, network, RPC, consensus, or
  issuer-freeze access change. The row is a denominator-control sibling to
  the same-day SEC and CFTC FTX rows."

