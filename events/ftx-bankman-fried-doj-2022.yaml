analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase A.1 of comprehensive
  collection plan; us_federal_enforcement frame discovery): authored by LLM
  agent without personally verifying Wayback/body_hash; origin=human_reviewed
  required by validator. Real release must replace this DRYRUN marker with a
  human-verified audit after pinning real archive anchors.

  comparison documenting the 2022-12-13 coordinated DOJ SDNY + SEC + CFTC
  enforcement action against Samuel Bankman-Fried, FTX Trading Ltd., and
  Alameda Research LLC. The federal trigger followed the 2022-11-11 FTX
  Trading Ltd. voluntary Chapter 11 filing by approximately one month; the
  offramp_cex withdraw-pause and customer-asset freeze were already in
  effect at the trigger date via the bankruptcy estate. The retained
  load-bearing observation is therefore the offramp_cex layer with
  attribution=plausible rather than direct — the proximate cause of the
  off-ramp shutdown is the corporate Chapter 11 instrument, and the
  2022-12-13 DOJ/SEC/CFTC actions are the federal accountability layer
  cascading on top.

  Multi-layer cascade context noted in the brief: (a) FTX.com US-user
  geofencing well predates the indictment and was a 2019-era platform
  bifurcation between FTX International and FTX US, not a 2022 trigger
  artifact; (b) Alameda Research asset freezes are encompassed by the
  Chapter 11 estate; (c) BlockFi cross-default into its own 2022-11-28
  Chapter 11 filing is downstream of this row and is partially captured
  by the existing blockfi-sec-lending-2022 sibling event (different
  trigger — SEC 2022-02-14 lending-product settlement — but same
  collapsing-platform-cluster). The bulk-Bankman-Fried criminal
  disposition (2023-11-02 conviction on 7 of 8 counts, 2024-03-28
  sentencing) is downstream of the 2022-12-13 trigger and is not coded
  here as a separate observation.

  Sibling positioning: this event sits in the S3 us-federal-enforcement
  cluster alongside binance-4framework-2023 (corporate-survival cascade
  with monitor), sec-v-coinbase-2023 (state-scoped staking restriction),
  kraken-sec-staking-2023 (US staking-service shutdown), and
  blockfi-sec-lending-2022 (lending-product cease-and-desist). The FTX
  row is structurally distinct because the offramp shutdown is total
  (full Chapter 11 customer-asset freeze affecting global users) rather
  than scoped (state-scope, product-scope, or service-scope) and because
  the trigger is criminal indictment of an individual + civil complaints
  against the corporate entity, rather than a corporate-settlement
  resolution. One observed_change layer (offramp_cex) with attribution=
  plausible to the 2022-12-13 federal trigger; L0 / L1 / L3 / asset_onchain
  are not_applicable on substrate-mismatch grounds; L4 frontend is
  not_measured pending Wayback pinning of ftx.com / ftx.us notice
  surfaces.

scoped_claim: |
  "The 2022-12-13 coordinated US DOJ SDNY + SEC + CFTC enforcement action
  against Samuel Bankman-Fried, FTX Trading Ltd., and Alameda Research LLC,
  cascading on top of the 2022-11-11 FTX Chapter 11 bankruptcy filing,
  produced a one-layer admitted observation in the dataset: an offramp_cex
  global withdraw-pause and Chapter 11 customer-asset freeze affecting
  FTX.com international, FTX.US, and Alameda Research assets. Attribution
  is plausible (not direct) to the 2022-12-13 federal trigger because the
  off-ramp shutdown was proximately effected by the prior corporate
  Chapter 11 filing. The row does not claim L0 network, L1 consensus, L3
  RPC, asset_onchain, or admission-grade L4 frontend effects; the FTX.com
  US-user geofencing well predates the trigger and is not coded as an
  attributable observation."

