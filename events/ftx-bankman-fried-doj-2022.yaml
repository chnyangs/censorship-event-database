coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      No network-layer (L0) reachability blocking is implicated by the FTX
      DOJ/SEC/CFTC actions. ftx.com remained DNS-resolvable and TCP-reachable
      from global vantage points through the bankruptcy and post-indictment
      window; the cascade is a corporate-bankruptcy + federal-enforcement
      event executed at the application / off-ramp layer, not an ISP-level
      DNS / TCP block. not_applicable on substrate-mismatch grounds.
  - layer: l1_consensus
    status: not_applicable
    chain: ethereum
    note: |
      The FTX collapse and 2022-12-13 DOJ/SEC/CFTC trigger engage no
      protocol-layer (L1) validator-set or PBS-relay primitive. Customer
      tokens custodied by FTX were administratively frozen at the platform
      level, not via L1 consensus rules. not_applicable on substrate-mismatch
      grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      No public-RPC provider filter-list change attaches to the FTX
      enforcement cascade. The L3 substrate (MEV-Boost / Flashbots Protect /
      MEV-Blocker / Infura) is orthogonal to a CEX bankruptcy and
      individual-defendant criminal indictment. not_applicable on
      substrate-mismatch grounds.
  - layer: l4_frontend
    status: not_measured
    scope:
      - ftx.com
      - ftx.us
    note: |
      No admission-grade historical frontend diff for ftx.com / ftx.us is
      retained in this DRYRUN file. A retained L4 observation would require
      a pinned Wayback snapshot of the ftx.com Chapter 11 notice surface or
      ftx.us withdraw-pause banner across the 2022-11-08 (withdraw pause) to
      2022-12-13 (indictment unseal) window. Until those snapshots are pinned
      and body_hashed, the L4 surface remains unmeasured; the admission-grade
      load-bearing observation is the offramp_cex global withdraw-pause and
      Chapter 11 customer-asset freeze.
  - layer: asset_onchain
    status: not_applicable
    note: |
      No stablecoin-issuer freeze or OFAC SDN-list address designation
      primitive was engaged at the 2022-12-13 trigger. Customer USDC / USDT
      balances inside FTX hot wallets were subject to administrative
      bankruptcy-process recovery via the Chapter 11 estate, not via
      issuer-level blacklist publications targeting specific addresses.
      not_applicable on substrate-mismatch grounds.
  - layer: offramp_cex
    status: measured
    scope:
      - ftx_com_global_withdrawals
      - ftx_us_customer_withdrawals
      - alameda_research_assets
    note: |
      Load-bearing observation layer. FTX.com implemented a global
      withdraw-pause on or about 2022-11-08, followed by the FTX Trading Ltd.
      voluntary Chapter 11 filing on 2022-11-11 which administratively froze
      all customer-asset withdrawals across the FTX International and FTX US
      platforms. The same Chapter 11 estate proceedings encompassed Alameda
      Research asset freezes. The 2022-12-13 DOJ/SEC/CFTC enforcement
      actions did not themselves trigger the offramp shutdown (which had
      already occurred at bankruptcy ~1 month earlier) but are the federal
      accountability layer on top of that pre-existing freeze. Attribution
      for the offramp_cex observation is therefore plausible (not direct) to
      the 2022-12-13 trigger; the proximate cause of the off-ramp shutdown
      is the corporate Chapter 11 instrument itself. The independent
      US-user geofencing on FTX.com well predates this trigger (the
      international platform had restricted US-resident access since the
      2019 launch of FTX.US as a separate US-licensed affiliate) and is
      noted here only for completeness — it is not coded as an observation
      attributable to the 2022-12-13 trigger.

