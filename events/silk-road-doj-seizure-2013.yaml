        note: |
          Wayback snapshot of silkroadmarket.org dated 2013-10-18 (~16 days
          after the takedown). The marketplace surface is gone; the domain
          serves a generic landing/parking page instead of the Apache+PHP
          marketplace shown in earlier mementos. Corroborates the L4 seizure
          observation. The contemporaneous FBI "This Hidden Site Has Been
          Seized" banner that briefly replaced the page is documented in the
          DOJ primary source above; this snapshot is the closest replayable
          post-takedown state on the public web for the clearnet domain.

analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase 2 of 2026-05-16
  staged-release plan, promoted from
  candidate_triggers/silk-road-doj-seizure-2013.yaml per Agent B P0):
  historical-baseline anchor for the 2013-10-02 DOJ/FBI Silk Road takedown.
  Admission tier set to empirical_case (not anchor_case) because the
  authoring agent cannot personally Wayback-verify the FBI seizure-banner
  page beyond the captured 2013-10-18 silkroadmarket.org snapshot, which
  shows the marketplace is gone but no longer carries the original FBI
  banner text. The primary-legal SDNY Wayback memento (2014-01-23) is the
  load-bearing admission anchor; the canonical justice.gov URL returned an
  Akamai bot-block stub on live fetch and is retained as
  contextual_unarchived. For a real release, replace this DRYRUN marker
  after a human auditor confirms (a) a closer 2013-10-02..04 banner snapshot
  on Wayback if one exists, and (b) the canonical SDNY URL can be re-archived
  with the full press-release body.

  comparison shape: 1 observed_change layer (L4 frontend). L0/L1/L3/asset/
  offramp are all not_applicable because the target is a Tor-hosted darknet
  marketplace with a Bitcoin-only chain footprint and no CEX surface. This
  matches the structural pattern of alphabay-hansa-doj-2017 (Tor + L4 only)
  and hydra-doj-2022 (Tor + L4 only). The Silk Road event is the earliest
  DOJ marketplace seizure in the dataset (~3.75 years before AlphaBay,
  ~3.8 years before BTC-e, ~8.5 years before Hydra, ~9.3 years before
  Bitzlato) and is retained as the historical-baseline anchor for the
  DOJ-marketplace-seizure family.

scoped_claim: |
  "The 2013-10-02 DOJ/FBI Silk Road takedown produced an immediate L4
  frontend seizure of the clearnet domain silkroadmarket.org and the
  silkroad6ownowfk.onion hidden service; the row claims only this single-
  layer marketplace-domain-seizure observation and not transaction-level
  on-chain forfeiture coding."

