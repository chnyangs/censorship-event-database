target:
  kind: domain
  enumeration: subset
  enumeration_note: |
    Silk Road marketplace as a Tor hidden service plus its clearnet domain.
    canonical_domains lists silkroadmarket.org (clearnet) and the v2
    silkroad6ownowfk.onion address as the public surface that was replaced by
    the FBI "This Hidden Site Has Been Seized" banner. No on-chain BTC
    addresses are enumerated at this event level; ~26,000 BTC from the site
    plus ~144,000 BTC from Ross Ulbricht's wallet were seized in parallel
    civil/criminal forfeiture actions documented under SDNY case 13 MAG 2328.
  actor_type: darknet_marketplace
  actor_name: Silk Road
  chains: [bitcoin]
  canonical_domains:
    - silkroadmarket.org
    - silkroad6ownowfk.onion

jurisdiction:
  - US

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      Silk Road operated as a Tor hidden service; the 2013-10-02 takedown was
      a domain/server seizure rather than an ISP-level reachability block.
      Standard public-web L0 instruments (Censored Planet, OONI) do not
      apply.
  - layer: l1_consensus
    status: not_applicable
    chain: bitcoin
    note: |
      Bitcoin, pre-Merge by ~9 years; consensus-layer filtering surfaces
      tracked by this dataset (PBS relays, mev-watch / censorship.pics) did
      not exist in 2013.
  - layer: l3_rpc
    status: not_applicable
    chain: bitcoin
    note: |
      No Bitcoin RPC-provider rejection surface is implicated by the Silk
      Road takedown. Tor-hosted marketplace + parallel BTC forfeiture, not an
      RPC-mediated transaction-rejection event.
  - layer: l4_frontend
    status: measured
    scope:
      - silkroadmarket.org
      - silkroad6ownowfk.onion
    note: |
      The FBI took control of silkroadmarket.org and the Silk Road v2 .onion
      address on 2013-10-02, replacing the marketplace with the "This Hidden
      Site Has Been Seized" banner. Wayback retains a 2013-10-18 snapshot of
      silkroadmarket.org showing the marketplace surface is gone (Apache+PHP
      origin replaced by a domain-parking landing page); the underlying
      seizure is also described directly in the SDNY press release captured
      via Wayback (above). attribution=direct under §5 because the seizure
      operation is named by the primary-legal DOJ source.
  - layer: asset_onchain
    status: not_applicable
    chain: bitcoin
    note: |
      Bitcoin is unfreezable at the protocol layer (no issuer blacklist
      method); the seized ~26k+~144k BTC were captured by transferring funds
      from wallet keys recovered during the operation, which is a custody
      transfer rather than an asset-layer freeze in this dataset's sense.
      Tx-level seizure receipts are not retained at this event level.
  - layer: offramp_cex
    status: not_applicable
    note: |
      The target is the marketplace itself, not a centralized exchange. No
      CEX delisting or withdrawal freeze is implicated by the 2013-10-02
      takedown.

