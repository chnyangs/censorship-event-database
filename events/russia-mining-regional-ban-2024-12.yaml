analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase C
  comparable_main_2017_present authoring pass for the Russia 2024
  regional mining ban): authored by LLM agent without personally
  verifying Wayback / body_hash anchors; origin=agent_draft and
  status=draft per the validator's agent-draft pathway. Real release
  must replace this DRYRUN marker with a human-verified audit after
  pinning real archive anchors and re-verifying the
  Russian-language government.ru press release.

  S4_nation_state empirical_case anchored on the 2024-12-23 Russian
  Federation Council of Ministers decision approving the list of
  regions and territories where cryptocurrency mining is prohibited
  from 2025-01-01 through 2031-03-15 (approximately six years). The
  permanently banned ten-region set comprises six North Caucasus
  federal subjects of the Russian Federation (Dagestan, Ingushetia,
  Kabardino-Balkaria, Karachay-Cherkessia, North Ossetia – Alania,
  Chechnya) and four Russian-administered occupied Ukrainian
  territories (the Donetsk People's Republic, the Lugansk People's
  Republic, the Zaporizhzhia oblast, and the Kherson oblast). The
  decision additionally imposes peak-season prohibitions in parts of
  the Irkutsk oblast, the Republic of Buryatia, and the Zabaykalsky
  Krai during winter peak-load windows; those three Siberian regions
  are not part of the canonical ten-region target enumeration because
  their restrictions are seasonal rather than year-round.

  Why trigger.type=nation_state_block: the schema trigger_types enum
  does not include a distinct "regulatory_decree" or "regional_activity_ban"
  type. nation_state_block is the closest enum for a single-country
  central-government regional-activity prohibition with a fixed
  multi-year effective window. trigger.actor=RU_COUNCIL_OF_MINISTERS
  identifies the Russian Federation Government (Pravitelstvo
  Rossiyskoy Federatsii) as the issuing body; this is distinct from
  RU_CBR (the Central Bank of Russia), which is the actor for the
  sibling russia-cbr-bitcoin-information-letter-2014 and the
  russia-cbr-crypto-payment-ban-2022 events.

  Why jurisdiction=[RU] but target enumerates ten regions including
  four occupied Ukrainian territories: jurisdiction is coded by the
  issuing authority's jurisdictional namespace (Russia, per
  RU_COUNCIL_OF_MINISTERS as the issuing body and per Russia's
  exercise of administrative control over the four Ukrainian
  territories at the time of the decision). The schema jurisdiction
  enum does not include UA at present, and recording UA jurisdiction
  for a decision issued by the Russian Federation Government would
  misrepresent the issuing authority. The fact that four of the ten
  regions are occupied Ukrainian territories under Russian
  administrative control is recorded in the target enumeration_note,
  in the observation scope_descriptor.providers list, and in the
  Meduza English-language source note. This is the same convention
  used by other Russia-administered events that touch occupied
  Ukrainian territories.

  Why target.kind=entity / enumeration=subset: the schema
  target_kinds enum does not include "regional_activity" or
  "mining_operator_class"; entity is the closest enum for a
  regionally scoped activity-class target, matching the
  population-class convention used by the sibling
  russia-cbr-bitcoin-information-letter-2014 (entity / subset for
  the Russia-resident bitcoin-user class). enumeration=subset
  rather than complete because (i) the decision addresses a
  population class (all mining within the ten regions) rather than
  an enumerated roster of named mining operators, and (ii) the
  decision contemplates further additions to the restricted-region
  list.

  Why empirical_shape=comparison / admission_tier=empirical_case:
  one observed_change layer (l1_consensus) with attribution=plausible
  is recorded. The l1_consensus observation maps the user-supplied
  "mining_hashpower" semantics to the l1_consensus layer enum per
  the authoring brief; the decision's policy lever directly engages
  the consensus-layer mining substrate (Bitcoin hashpower regional
  shutdown) in expectation. attribution=plausible (not direct)
  because the load-bearing causal chain "policy → regional hashpower
  shutdown → global Bitcoin hashrate redistribution" requires
  quantitative mining-share evidence (e.g. Cambridge Bitcoin
  Electricity Consumption Index country-share / pool-mapping
  re-verification) that has not been re-verified in this authoring
  pass; the decree text itself establishes the policy lever but
  does not by itself enumerate the post-ban hashrate transition.
  empirical_shape=comparison (1-2 observed_change layers);
  admission_tier=empirical_case (≥1 strong-attribution observed_change
  layer).

  Why all other layers are not_applicable: L0 (not_applicable) —
  no ISP / DNS directive in the decision; Russian network-layer
  crypto blocking is a separate Roskomnadzor phenomenon. L3
  (not_applicable) — the decision is a Bitcoin-mining regional
  prohibition, not an Ethereum PBS / public-RPC directive.
  L4 (not_applicable) — scope mismatch: the decision does not direct
  frontend takedowns. asset_onchain (not_applicable) — no
  issuer-side admin-freeze primitive is engaged. offramp_cex
  (not_applicable) — the decision targets mining at the
  electricity-supply / permitting layer and does not direct Russian
  or foreign-licensed exchanges to retire Russian-user accounts;
  the separate Russian crypto-payments / circulation regime is the
  subject of the sibling russia-cbr-crypto-payment-ban-2022.

  Cross-temporal context: the sibling Russian central-bank events
  russia-cbr-bitcoin-information-letter-2014 (2014-01-27 advisory)
  and russia-cbr-crypto-payment-ban-2022 (2022 CBR full
  crypto-payments ban) trace the within-jurisdiction longitudinal
  trajectory of Russian central-bank crypto-disposition;
  this 2024-12-23 regional mining ban is a separate
  electricity-supply-rationale lever issued by the Council of
  Ministers (not by the CBR) and addresses the production
  (mining) side rather than the use / payments side of the
  Russian crypto regulatory perimeter. The 2024-12-23 ban also
  follows Russia's 2024 Federal Law on Mining (signed 2024-08-08)
  which legalized industrial-scale mining at the federal level
  while delegating regional restriction authority to the Council
  of Ministers; this regional decision is the first exercise of
  that delegated authority.

