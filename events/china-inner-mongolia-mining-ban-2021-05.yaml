analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (agent_draft per user
  instruction; status=draft because no body_hash+body_path archive
  anchors have been pinned in this session). Authored by LLM agent
  without personally verifying Wayback/body_hash; human review required
  to elevate to admitted status.

  Sub-national (province-level) nation-state-block trigger.
  Jurisdiction=[CN] is retained per validator schema (province-level
  CN actors map to CN jurisdiction), but the actor is the Inner
  Mongolia Autonomous Region Development and Reform Commission, not
  the central PRC government. This positions the event as a
  **province-level enforcement anchor** within the broader 2021 CN
  mining-ban cascade and is structurally distinct from sibling
  events:

  1. **vs. china-pboc-crypto-ban-2021** — the 2021-09-24 PBOC joint
     notice is a *central-government* directive targeting
     virtual-currency *trading and business activities* (offramp_cex
     surface). The present event is a *provincial* directive
     targeting *mining hashpower* (l1_consensus surface), issued
     ~4 months earlier in the cascade timeline.

  2. **vs. china-state-council-mining-crackdown-2021-05** — the
     2021-05-21 State Council Financial Stability Committee statement
     is the central-government counterpart that triggered the
     province-level enforcement wave; the present 2021-05-25 Inner
     Mongolia notice is the *first concrete provincial enforcement
     framework* operationalizing the State Council directive,
     including the public reporting hotline.

  3. **vs. china-sichuan-mining-ban-2021-06** — Sichuan's 2021-06-18
     mining shutdown is a sibling provincial enforcement notice
     issued by Sichuan's NDRC ~3 weeks after Inner Mongolia's,
     targeting the hydropower-fueled mining cluster in Sichuan
     (~10-20% of global hashrate). The two provincial events together
     define the bulk of the 2021 CN-side hashrate migration.

  comparison shape: 1 observed_change layer (l1_consensus
  load-bearing, attribution=direct on the policy-instrument anchor).
  L0/L3/L4/asset_onchain/offramp_cex are not_applicable by
  construction of a province-level mining-infrastructure ban.

  DRYRUN caveats: primary citation (Inner Mongolia NDRC origin URL)
  and supporting-journalism citations (CoinDesk, SCMP, CNBC) are
