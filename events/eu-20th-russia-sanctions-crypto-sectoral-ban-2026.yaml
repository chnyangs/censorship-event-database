analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission). The EU 20th sanctions
  package (adopted 2026-04-23) introduces a total sectoral (class-wide) ban
  on providers and platforms established in Russia that allow the transfer
  and exchange of crypto assets - the most crypto-specific EU enforcement to
  date, targeting an entire category of evasion infrastructure rather than
  individually listed entities - plus a transaction ban on the RUBx
  stablecoin and a cut of all EU support for the digital-rouble CBDC. This
  is a §9-IN-SCOPE censorship action (a deliberate sectoral debanking/denial
  of a legitimate-on-its-face crypto provider/platform class), the apex of
  the EU Russia-sanctions crypto track (8th -> 18th -> 19th -> 20th).
  comparison shape, single offramp_cex observed_change/direct. asset_onchain
  not_applicable: the captured EU + CoinDesk sources name RUBx and the
  digital rouble but enumerate NO specific on-chain address or issuer-freeze
  tx hash, so per codebook §1.6 the effect is carried at the
  offramp_cex/transaction layer (no fabricated tx_hash). attribution=direct:
  the EU instrument itself imposes the sectoral ban. Sources verified via
  WebSearch + capture 2026-05-31; verbatim "total sectoral ban on providers
  and platforms established in Russia" language grep-confirmed in both the
  captured Consilium body and the CoinDesk corroboration. NOTE for human
  audit: secondary legal-analysis sources report the transaction bans apply
  from 2026-05-24 (one-month wind-down) and extend to Belarus and to
  "decentralized" platforms; those effective-date / Belarus / decentralized
  specifics are NOT in the captured Consilium press release (which says
  "platforms established in Russia"), so they are NOT asserted here - only
  the press-release-attested Russia-established-provider sectoral ban + RUBx
  ban + digital-rouble support cut are claimed.

scoped_claim: |
  "The EU's 20th sanctions package (2026-04-23) imposed a total sectoral ban
  on crypto-asset providers and platforms established in Russia that allow
  the transfer and exchange of crypto assets, plus a transaction ban on the
  RUBx stablecoin and a cut of EU support for the digital rouble - the EU's
  first class-wide sectoral crypto provider ban; single-layer offramp_cex
  observed_change with attribution=direct."

