analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission).

  OKX's 2024-03-21 cessation of its centralized-exchange (CeFi) services
  for Indian users — no new positions; close out margin/perpetuals/futures/
  options and withdraw all funds by 2024-04-30 — citing "local
  regulations," following FIU-IND (Financial Intelligence Unit, India)
  illegal-operation notices (December 2023, nine offshore exchanges) and
  Apple/Google removing the OKX app from India app stores.

  Why §9 INCLUDE: a deliberate corporate jurisdiction exit / geofence that
  denied Indian users access to OKX's CeFi off-ramp (codebook §9 INCLUDE:
  corporate jurisdiction exit / geofence). Part of the 2024 offshore-
  exchange withdrawal wave from India under PMLA/FIU-IND pressure.

  Why S5_corporate: an exchange's unilateral decision to exit a market is a
  corporate policy action.

  Why comparison / empirical_case: one strong-attribution observed_change
  layer (offramp_cex). Other five layers scope-mismatched.

  Why attribution=plausible: the exit is directly observed, but OKX cited
  "local regulations" generically (no named mandate compelling OKX
  specifically; the FIU-IND public notice named Binance/Kraken/Huobi/
  Gate.io but not OKX), so the precise regulatory driver is contextual.

  Sources verified via WebSearch + captured 2026-05-31 (TechCrunch +
  CoinDesk, body_hash-pinned; both grep-confirmed for "withdraw by April
  30" and FIU-IND/app-removal context; no fabrication).

scoped_claim: |
  "OKX's 2024-03-21 cessation of CeFi services for Indian users (close
