analysis_notes: |
  **AUTHORED 2026-05-31** (census, by human:xiangwen). The e-Gold 2007-04-27
  federal indictment — the #1 "since 2007" anchor and the SEMINAL pre-Bitcoin
  digital-currency enforcement action. A four-count grand-jury indictment
  charged e-Gold Ltd., Gold & Silver Reserve Inc., and principals (Douglas
  Jackson, Reid Jackson, Barry Downey) with money laundering (18 USC
  s 1956(h)) + operating an unlicensed money transmitting business (18 USC
  s 1960). This is the TRIGGER stage; the 2008-07-21 guilty plea
  (egold-doj-guilty-plea-2008-07, in corpus) is the resolution. comparison
  shape, single offramp_cex observed_change/plausible (the indictment placed
  e-Gold's MSB operations under enforcement restriction; cessation resolved
  at the 2008 plea). Enabled by the temporal_tier rename to
  discovery_only_2007_2012 (2026-05-31). In scope per codebook §9 +
  corpus precedent (the e-Gold 2008 plea is already an admitted S3 event):
  e-Gold was a real digital-currency MSB shut by US enforcement — the
  foundational template for the FinCEN-2013 -> Liberty-Reserve-2013 ->
  BTC-e-2017 enforcement lineage. Sources verified + captured 2026-05-31
  (DOJ #07-301 + CCIPS copy, both body_hash-pinned; no fabrication).

scoped_claim: |
  "The 2007-04-27 DOJ indictment of e-Gold Ltd., Gold & Silver Reserve Inc.,
  and principals (18 USC s 1960 + s 1956(h)) placed the pre-Bitcoin
  digital-currency MSB under federal enforcement (offramp_cex
  observed_change, attribution plausible); the seminal since-2007 anchor,
  resolved at the 2008 guilty plea. Discovery-tier only."

