analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase 6c bulk-promotion of 22 candidate stubs per user instruction to push remaining backlog to dryrun-complete state): promoted from candidate_triggers/canada-csa-binance-withdrawal-2023.yaml. Authored by LLM agent without personally verifying Wayback/body_hash; origin=human_reviewed required by validator. Real release must replace this DRYRUN marker with a human-verified audit after pinning real archive anchors.

  comparison shape: 2 observed_change layers (l4_frontend, offramp_cex), both
  with direct attribution. Structurally a sibling of uk-fca-binance-markets-2021
  and the 2021-Binance regulator wave (Netherlands DNB, Malaysia SC, Singapore
  MAS), but with two distinguishing features. First, the CSA action is a
  securities-registration / pre-registration-undertaking framework rather than
  an FCA-style consumer warning; it operates by changing the conditions under
  which a crypto-trading platform may serve Canadian retail clients, not by
  declaring a single named entity unauthorised. Second, Binance's response was
  a self-initiated full-market withdrawal (2023-05-12) rather than a banking-
  rail-mediated cascade — the cascade leg here is an operator-state change
  (Binance Canada exit) rather than a class-wide bank-payment-rail severance.

  Cross-stratum cousin: binance-4framework-2023 (US, S3) — coincides temporally
  with the broader 2023 Binance regulatory exposure that culminated in the
  November 2023 multi-framework US settlement. The CSA-driven Canada exit is
  part of the global posture realignment that the 4-framework row captures
  from the US side.

scoped_claim: |
  "The 2023-02-22 CSA Staff Notice 21-332 enhanced pre-registration-undertaking
  framework — restricting Canadian crypto-trading-platform stablecoin offerings
  and investor-position limits — produced a 2-layer cascade for the Binance
  Canada cohort: a customer-facing market-exit announcement on binance.com
  (2023-05-12) and a corresponding offramp_cex shutdown of CAD rails and
  Canadian-resident accounts. Structurally an entity-self-withdrawal response
  to a class-wide securities-registration framework rather than a banking-rail
  cascade."

