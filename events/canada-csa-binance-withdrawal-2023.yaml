  - layer: offramp_cex
    status: measured
    scope:
      - binance_canada_users
      - cad_payment_rails_to_binance
    note: |
      Binance-Canada is the focal off-ramp under CSA-driven restriction.
      Following the 2023-05-12 withdrawal announcement, Canadian-resident
      Binance accounts transitioned to withdraw-only mode and CAD on/off-
      ramp access to Binance was wound down on Binance's stated timeline.
      Load-bearing observation attached below as observed_change with
      direct attribution to the CSA Staff Notice 21-332 cited in the
      Binance blog post.

