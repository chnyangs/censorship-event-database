coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      Helix was a Tor-hosted darknet service; no public canonical-domain
      reachability measurement applies. OONI probe coverage of .onion
      services is not maintained.
  - layer: l1_consensus
    status: not_applicable
    chain: bitcoin
  - layer: l3_rpc
    status: not_applicable
    chain: bitcoin
  - layer: l4_frontend
    status: measured
    scope: [helix_tor_service]
    note: |
      Helix's frontend (the Tor-hosted mixer UI under grams7enufi7jmdl.onion)
      had already been shut down by the operator in late 2017. The 2020-02-11
      DDC indictment of Harmon forecloses any operator-led restoration: the
      mixer-frontend's terminal state is now juridically anchored by the
      criminal indictment of the only person with operator keys. The
      observation is therefore an indictment-anchored finality on a
      previously-self-shuttered frontend, not a same-day seizure-banner
      substitution (cf. ChipMixer 2023, Samourai 2024). attribution=direct
      because the DOJ release explicitly names Harmon as the sole operator
      and the mixer as the indicted business.
  - layer: asset_onchain
    status: not_applicable
    chain: bitcoin
    note: |
      Bitcoin native; no issuer-level freeze primitive. The indictment traces
      individual BTC flows but does not assert an address-set freeze.
  - layer: offramp_cex
    status: measured
    scope: [helix_mixer_operator_state]
    note: |
      The load-bearing layer for this row: the indictment converts Helix's
      operator from "in operation / dormant" to "criminally indicted and
      arrested" — a mixer-operator-state transition. Helix is the offramp /
      laundering venue under enforcement; the operator's arrest plus the
      parallel FinCEN $60M civil money penalty (2020-10-19) anchor the
      state change. attribution=direct via the DOJ + FinCEN primary-legal
      sources.

