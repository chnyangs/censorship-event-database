  DRYRUN marker after human audit and (a) replace the wayback URL stub on
  the DOJ press release with a verified capture + body_hash / body_path
  artifact, (b) attach a captured FinCEN $60M CMP page once located in
  Wayback, (c) consider adding the 2021-08-18 federal conspiracy guilty
  plea and 2025-03 sentencing as related follow-on observations once
  artifacts are pinned.

  comparison — Helix is the structural pre-quel to chipmixer-doj-2023 and
  samourai-doj-2024: a Bitcoin-mixer operator indicted by DOJ, but with
  the unusual feature that the mixer infrastructure had already been
  voluntarily wound down by the operator in 2017, three years before the
  criminal indictment. The l4_frontend observation is therefore an
  indictment-anchored finality on an already-dark service rather than a
  same-day seizure banner; the load-bearing offramp_cex observation is the
  mixer-operator-state transition (operator indicted + arrested + parallel
  FinCEN $60M CMP). Two observed_change layers with direct attribution →
  empirical_case admission tier with comparison shape.

  Distinguishing structural feature vs. chipmixer-doj-2023 (joint US +
  4 European + Europol same-day takedown) and samourai-doj-2024 (joint US +
  Europol + Portugal + Iceland same-day takedown): Helix is a single-
  jurisdiction (US-only, DDC) operator-state indictment without
  international coordination, because the mixer infrastructure was already
  dark before the indictment and there was no live foreign-hosted
  infrastructure to seize. This makes Helix the cleanest "operator-state
  only" reference point in the mixer-indictment comparison set.

scoped_claim: |
  "The 2020-02-11 DOJ DDC indictment of Larry Dean Harmon for operating the
  Helix Bitcoin mixer (2014-2017, $300M+ laundered) produced a 2-layer
  comparison-shape cascade in the dataset: an l4_frontend finality on the
  already-self-shuttered helix .onion service and an offramp_cex mixer-
  operator-state transition anchored by the indictment + parallel 2020-10-19
  FinCEN $60M civil money penalty. Distinct from chipmixer-doj-2023 and
  samourai-doj-2024 in that the mixer was already dark at indictment time
  and the enforcement was single-jurisdiction (US-only)."

