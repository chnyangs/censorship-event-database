analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-4 audit (S4 comparison, others
  9/11) by human:xiangwen as empirical_case. RE-DATED 2023-07-25 ->
  2023-04-21 after human audit: the agent draft conflated two distinct
  enforcement waves (detik d-6685046 = 2023-04 wave; kumparan = 2024-07
  Instagram-account block) under a non-existent 2023-07-25 date. Re-scoped
  to the verifiable April 2023 BAPPEBTI-Kominfo block of hundreds of
  unlicensed exchangers (incl. Binance). Anchored: bappebti.go.id
  (primary_legal, Wayback 20230128094038, body_hash e01b8550...) + detik
  d-6685046 (semi_primary_wayback, published 2023-04-21, Wayback
  20230425201141, body_hash d74c0ed2...). DROPPED kumparan (2024-07-18,
  wrong wave). l4_frontend observed_change/direct + offramp_cex
  observed_change/plausible. comparison/empirical_case preserved.

  **NEW EVENT AUTHORED — DRYRUN 2026-05-17**: agent-drafted candidate
  documenting BAPPEBTI's 2023 enforcement wave (in coordination with
  Kominfo) blocking unlicensed offshore cryptocurrency exchanges
  (Binance, Bybit, OKX, KuCoin, MEXC, et al.) for Indonesian users, on
  the basis of BAPPEBTI Regulation No. 8/2021 (Article 5, as amended by
  No. 13/2022) requiring CPFAK licensing for physical crypto asset
  trading in Indonesia. Routing is via Kominfo's ISP-level domain-block
  apparatus; substantive effect is L4 frontend unreachability with
  cascading IDR on/off-ramp severance, channeling Indonesian users to
  BAPPEBTI-licensed local exchanges (Tokocrypto, Indodax).

  Codebook compliance: trigger.type = nation_state_block per §5.1 because
  the action is a network/payment-rail block (Kominfo ISP-level domain
  blocking) rather than pure administrative enforcement —
  regulatory_enforcement would only fit if the action were purely
  administrative (e.g., a JP FSA business-improvement order). research_
  stratum = S4_nation_state per §5.2. target.kind=entity,
  target.enumeration=subset per §7 (named exemplars from class of
  hundreds). analysis_use=comparable_analysis, empirical_shape=comparison
  (1 strong-attribution observed_change layer + 1 plausible-attribution
  observed_change layer = 2 distinct observed_change layers per §3).
  admission_tier=empirical_case per §4 (≥1 strong-attribution
  observed_change). L0 honesty rule (Kazakhstan precedent, §1.5):
  l0_network coded `not_measured` because no OONI / Censored Planet
  measurement slice was captured this session for the named domains in
  Indonesian ASNs; no L0 observation row admitted.

  Comparable siblings: malaysia-sc-binance-disable-2021 (SC frontend
  disable order) and india-rbi-crypto-ban-2018 (banking-rail severance).
  Indonesia case foregrounds the BAPPEBTI-Kominfo coordinated route
  (commodity-futures regulator + telecom-ministry ISP block) rather than
  the SC's direct-operator-compliance route (Malaysia) or RBI's banking-
  channel route (India). All three are S4 nation-state empirical_case
  comparison events.

  DRYRUN caveats: trigger primary citation is a BAPPEBTI homepage
  pointer; the specific BAPPEBTI press release / Kominfo enforcement
  ordinance enumerating the blocked domains is asserted but not yet
  pinned with body_hash/Wayback. For non-DRYRUN release, capture
  body_hash + body_path for: (1) the BAPPEBTI press release naming
  Binance/Bybit/OKX/KuCoin/MEXC as blocked-because-unlicensed, (2) the
  Kominfo TRUST+ Positif page or domain-block enumeration showing the
  named domains, (3) BAPPEBTI Regulation No. 8/2021 Article 5 text, and
  (4) OONI web-connectivity measurement IDs across major Indonesian
  ASNs for the named domains spanning a pre/post 2023-04-21 window —
  the OONI slice is the precondition for elevating l0_network from
  `not_measured` to `partially_measured` per the Kazakhstan honesty
  rule. Marked evidence_use=contextual_unarchived on all citations to
  flag the unarchived state per validator policy.

scoped_claim: |
  "BAPPEBTI's 2023-04-21 enforcement wave, routed via Kominfo ISP-level
  domain blocking, directly compelled Indonesian-geo unreachability of
  unlicensed offshore crypto-exchange frontends (binance.com, bybit.com,
  okx.com, kucoin.com, mexc.com) under BAPPEBTI Regulation No. 8/2021
  Article 5 (CPFAK licensing requirement), producing an L4 frontend
  observed_change (attribution=direct) with cascading IDR on/off-ramp
  severance at the named offshore-CEX cohort (offramp_cex
  attribution=plausible because the rail severance is downstream of the
  frontend block rather than a direct banking-prohibition directive).
  The row does not claim L0 network-level connectivity measurement (no
  OONI / Censored Planet slice captured this session; per Kazakhstan
  honesty rule l0_network is `not_measured`), nor on-chain asset freeze,
  nor banking-rail prohibition on Indonesian banks."

