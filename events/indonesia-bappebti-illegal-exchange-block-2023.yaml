        the human-audit pass.

target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    Class of foreign (offshore) cryptocurrency exchanges operating without
    BAPPEBTI CPFAK licensing in Indonesia. Named exemplars per BAPPEBTI/
    Kominfo press cycle and follow-on enforcement: Binance (binance.com),
    Bybit (bybit.com), OKX (okx.com), KuCoin (kucoin.com), MEXC (mexc.com).
    Subset enumeration: BAPPEBTI's enforcement targets the unlicensed-
    foreign-exchange class as a whole (hundreds of entities per detik.com
    reporting); the named exemplars are the largest by Indonesian user
    base. Indonesian users channeled to BAPPEBTI-licensed domestic
    exchanges (Tokocrypto, Indodax).
  protocol: null
  actor_type: regulated_crypto_service_providers
  actor_name: Foreign unlicensed crypto exchanges (ID cohort)
  chains: []
  canonical_domains:
    - binance.com
    - bybit.com
    - okx.com
    - kucoin.com
    - mexc.com

jurisdiction: [ID]

coverage:
  - layer: l0_network
    status: not_measured
    note: |
      BAPPEBTI-Kominfo block is routed via Kominfo ISP-level domain
      blocking (the Indonesian internet-censorship apparatus), which is
      in principle measurable at L0 (OONI / Censored Planet Indonesian
      ISP probes against binance.com, bybit.com, okx.com, kucoin.com,
      mexc.com). No replayable OONI / Censored Planet measurement slice
      captured for this event in this authoring session, so per the
      Kazakhstan honesty rule (codebook §1.5 / §2) the layer is coded
      `not_measured` rather than `partially_measured`. No L0 observation
      row is admitted. For non-DRYRUN release: capture OONI web-
      connectivity measurement IDs for the named domains across major
      Indonesian ASNs (Telkomsel, Indosat, XL Axiata, Telkom Indonesia)
      spanning a pre/post window around 2023-04-21.
  - layer: l1_consensus
    status: not_applicable
  - layer: l3_rpc
    status: not_applicable
  - layer: l4_frontend
    status: partially_measured
    scope:
      - binance.com
      - bybit.com
      - okx.com
      - kucoin.com
      - mexc.com
    note: |
      Kominfo TRUST+ Positif / domain-block routing severs Indonesian
      retail access to the listed offshore-CEX frontends. Cascade
      observation attached below at attribution=direct (BAPPEBTI
      enforcement order explicitly names the unlicensed-foreign-exchange
      class). partially_measured pending pinned Wayback bracket of (1)
      BAPPEBTI/Kominfo press releases enumerating the blocked domains
      and (2) ID-geo restriction banners on the named domains.
  - layer: asset_onchain
    status: not_applicable
    note: No SDN listing; no stablecoin-issuer freeze primitive applicable.
  - layer: offramp_cex
    status: partially_measured
    scope:
      - binance_id_idr_rail
      - bybit_id_idr_rail
      - okx_id_idr_rail
      - kucoin_id_idr_rail
      - mexc_id_idr_rail
    note: |
      The Kominfo-routed frontend block cascades into IDR on/off-ramp
      severance at the named offshore-CEX cohort: Indonesian users lose
      access to the foreign CEXs' IDR P2P rails and card/bank deposit
      channels, and are channeled to BAPPEBTI-licensed CPFAK local
      exchanges (Tokocrypto, Indodax) for any compliant fiat on/off-ramp.
      Cascade observation attached below; partially_measured pending
      pinned anchors for IDR-rail severance flow and offshore-CEX ID-geo
      withdrawal flows.

