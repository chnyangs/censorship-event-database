analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17** (Phase E S5
  corporate-frontend discovery): authored by LLM agent without
  personally verifying Wayback/body_hash; origin=agent_draft and
  status=draft pending human review.

  comparison — S5 corporate-policy frontend geofence by the
  Pump.fun operators against UK-vantage users of the pump.fun
  memecoin launchpad frontend, effective 2024-12-06, three
  calendar days after the UK FCA's 2024-12-03 unauthorised-firm
  warning naming Pump.fun. This is the first major memecoin-
  launchpad regulatory-compliance frontend geofence in the
  corpus; it sits alongside 1inch-us-geofence-2021-09 (DEX
  aggregator, voluntary, US-vantage) and opensea-iran-cuba-
  sanctions-block-2022 (NFT marketplace, OFAC-driven, sanctioned-
  jurisdiction vantage) as comparable S5 L4-only frontend-operator
  compliance actions. The Pump.fun case differs from 1inch in
  that there *is* a named regulator action (FCA warning) the
  operator cites publicly, putting attribution at `direct` under
  §1.4 (both conditions satisfied: provider publicly cites the
  trigger via press statements, block implemented in ≤7-day
  compliance window).

  Per §1.4 frontend-block attribution: (i) Pump.fun operators
  publicly cited the FCA warning as the trigger via
  contemporaneous press statements (CryptoSlate, Crypto Times,
  Bitcoin Times all date 2024-12-06 reporting the operator
  framing); (ii) block implemented 2024-12-06, 3 days post-FCA
  warning of 2024-12-03, well inside the §1.4 ≤7-day window. Both
  conditions hold → attribution=direct.

  empirical_shape=comparison (1 observed_change layer: l4_frontend
  with attribution=direct); admission_tier=empirical_case (≥1
  strong-attribution observed_change layer). coverage at
  L0/L1/L3/asset_onchain/offramp_cex is not_applicable on
  construct-not-engaged grounds because the geofence is purely a
  Pump.fun-operated frontend application-layer gate; the
  underlying Solana program contracts are unaffected and the
  pump.fun domain remains globally reachable.

  Paper salience: first major memecoin-launchpad frontend
  geofence triggered by a non-US national regulator's
  administrative warning (FCA unauthorised-firm warning is not a
  ban / network-block — it is administrative). Comparable to but
  distinct from the §5 `regulatory_enforcement` family because the
  *operator* (not the regulator) is the entity coding the layer
  action; trigger.type=corporate_policy_change is correct per §5.1
  ("Corporate unilateral policy"). Reported UK-vantage volume
  context (~$3B cumulative volume from UK-IP users prior to the
  block) is contextual only — not load-bearing for any admission
  claim because that figure is third-party analytics commentary,
  not a replayable measurement artifact.

scoped_claim: |
  "On 2024-12-06 the Pump.fun frontend operators added a UK-
  vantage IP-detection geofence pop-up and a UK exclusion clause
  in the site terms of service, three calendar days after the UK
  FCA's 2024-12-03 unauthorised-firm warning naming Pump.fun;
  the underlying Pump.fun bonding-curve / memecoin launch
  program on Solana remained unaffected. Load-bearing axis is
  l4_frontend on a UK-vantage subset; attribution=direct under
  §1.4 (operator publicly cited FCA warning; block within ≤7-day
  compliance window)."

