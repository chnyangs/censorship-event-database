    note: |
      Load-bearing layer (1 of 2). Contemporaneous chain-analytics
      reporting (TRM Labs, Elliptic) and Tether's own October 2023
      announcement document USDT issuer-level freezes on wallet
      clusters tagged to the Buy Cash / Hamas roster following the
      2023-10-18 OFAC designation. Tether's 2023-10-16 announcement of
