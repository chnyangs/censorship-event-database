analysis_notes: |
  **SOURCE/COVERAGE REPAIR 2026-06-02**: verified the pinned Treasury jy1816
  and OFAC Recent Actions 20231018 Wayback captures against their recorded
  SHA-256 hashes and re-grepped the local bodies for Buy Cash, virtual
  currency, and the single XBT address. Coverage was narrowed to the
  source-backed off-ramp/MSB severance claim: no L0 or frontend claim is
  retained without a confirmed Buy Cash DNS/UI endpoint, and the Bitcoin
  asset layer remains structurally not_applicable because no issuer-freeze
  primitive exists.

  **v0.3 audit 2026-05-20 (c) Batch C-1 promoted draft→admitted with
  FACTUAL CORRECTION**: original Wave-2 draft incorrectly framed this
  event as 2-layer cascade (offramp_cex direct + asset_onchain plausible
  with Tether USDT freezes). Direct inspection of the OFAC RA Wayback
  capture (web/20231018160335) shows Buy Cash MSB carries EXACTLY ONE
  digital-currency address — Bitcoin XBT `19D1iGzDr7FyAdiy3ZZdxMd6ttHj1kj6WW`,
  not any Ethereum/USDT address. Bitcoin has no issuer-level freeze
  primitive. The Tether 32/41-wallet freeze sweeps documented in
  contemporary chain-analytics reporting (CoinDesk, TRM Labs) target
  OTHER Hamas-affiliated EVM addresses from the same RA's individual
  designations or independent cluster analysis — NOT Buy Cash's XBT
  address. Repair: asset_onchain layer changed to not_applicable
  (Bitcoin-native, no freeze primitive); chains downgraded
  [bitcoin, ethereum] → [bitcoin]; asset_onchain observation row
  REMOVED. Event remains comparison/empirical_case at 1-layer
  (offramp_cex direct via SDN US-property block) rather than 2-layer.
  audit_log iteration: audit_id 307 recorded initial YES based on
  draft's 2-layer claim; this analysis_notes update captures the
  factual-correction amendment performed during YAML patching.

  Comparison-shape S1 ofac_sdn_designation event sibling to
  suex-ofac-2021 (first exchange-level SDN), chatex-ofac-2021, and
  tornado-cash-ofac-2022 (the canonical mixed-cascade anchor).
  Paper-relevant because this is the cleanest geopolitical-trigger
  sanctions cascade since Tornado Cash 2022-08: a single
  press-release-level action (jy1816) targets a virtual-currency MSB
  (Buy Cash, Khan Yunis) and triggers US-ramp severance at the
  offramp_cex layer by construction (SDN + 50% rule + secondary
  sanctions). Single observed_change layer at attribution direct →
  empirical_case admission tier.

  Distinguishing features vs. siblings: (a) trigger is a
  geopolitical-emergency post-attack designation (vs. ransomware
  trigger for SUEX 2021-09 / Chatex 2021-11 and protocol-level
  privacy-mixer trigger for Tornado 2022-08); (b) target is a
  foreign-operated virtual-currency MSB with no US-hosted
  infrastructure dependency — direct US ramp closure is the action itself,
  and no network/frontend claim is retained without a confirmed Buy Cash
  DNS/UI endpoint; (c) target is Bitcoin-only (single XBT address), which
  structurally rules out issuer-level asset_onchain freeze cascades
  available to EVM-targeting siblings (cryptex-ofac-2024,
  tornado-cash-ofac-2022).

  Contextual background (NOT load-bearing for this event's
  asset_onchain layer): Tether's 2023-10-16 32-wallet announcement
  (~$900k USDT) and subsequent 2023-12-09 41-wallet precautionary
  sweep targeted Hamas-affiliated EVM addresses from the same RA's
  broader designations. These sweeps illustrate post-Oct-7 issuer
  compliance posture but cannot be cited as asset_onchain evidence
  for Buy Cash specifically (no per-address mapping to the XBT
  address). CoinDesk + TRM Labs captures remain in
  sources/http_captures/ofac-hamas-buy-cash-msb-2023-10/primary/ as
  contextual artifacts but are no longer cited as load-bearing
  evidence in this YAML.

  Follow-up directions (post-admission): optional enrichment is limited to
  per-CEX KYT / deposit-cluster evidence for the single XBT address, or a
  replayable Buy Cash DNS/UI endpoint if one is independently identified.
  L1/L3 Ethereum filter-list enrichment is not applicable to this
  Bitcoin-only event.

scoped_claim: |
  "The 2023-10-18 OFAC designation of Buy Cash Money and Money Transfer
  Company (Khan Yunis, Gaza) is coded as a direct off-ramp / virtual-
  currency-MSB severance event: the SDN action itself closes the US-
  property / US-person transaction surface and exposes counterparties to
  sanctions risk. Buy Cash's only OFAC-named crypto address is a single
  Bitcoin XBT address, so no issuer-level asset freeze is applicable; no
  L0/L4 frontend claim is retained without a confirmed DNS/UI endpoint."

