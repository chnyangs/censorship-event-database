    plus the Gaza-based virtual-currency MSB "Buy Cash Money and Money
    Transfer Company" (Khan Yunis), with at least one attached digital-
    currency address. This event scopes the target to the Buy Cash MSB
    entity (the virtual-currency / off-ramp node of the action) because
    that is the load-bearing actor for the offramp_cex and asset_onchain
