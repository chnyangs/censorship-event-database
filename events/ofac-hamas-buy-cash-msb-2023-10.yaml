      partially_measured rather than measured because per-address
      Etherscan freeze-tx anchors and a full usdtbanlist.com per-address
      sweep against the Buy Cash roster are deferred to the human-audit
      pass. DRYRUN.
  - layer: offramp_cex
    status: partially_measured
    scope:
      - buy_cash_money_and_money_transfer_company
    provider_scope: unknown
    note: |
      Load-bearing layer (2 of 2). The SDN designation of Buy Cash
      itself is the off-ramp / virtual-currency-MSB severance — a US-
      property block plus secondary-sanctions exposure for any
      counterparty CEX or correspondent that continues to service the
      designated MSB. Treated as observed_change at attribution=direct
