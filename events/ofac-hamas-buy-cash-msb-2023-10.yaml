analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase F S1_ofac_sdn
  discovery; lean run): authored by LLM agent without personally
  verifying Wayback / body_hash anchors; origin=agent_draft per
  validator policy. Real release must replace this DRYRUN marker with
  a human-verified audit after pinning real archive anchors and
  promote origin to human_reviewed.

  Comparison-shape S1 ofac_sdn_designation event sibling to
  suex-ofac-2021 (first exchange-level SDN), chatex-ofac-2021, and
  tornado-cash-ofac-2022 (the canonical mixed-cascade anchor).
  Paper-relevant because this is the cleanest geopolitical-trigger
  sanctions cascade since Tornado Cash 2022-08: a single
  press-release-level action (jy1816) targets a virtual-currency MSB
  (Buy Cash, Khan Yunis) and triggers (a) US-ramp severance at the
  offramp_cex layer by construction (SDN + 50% rule + secondary
  sanctions) and (b) asset_onchain issuer compliance freezes (Tether
  2023-10-16 32-wallet sweep covering ~$900k USDT in
  Hamas/Ukraine-linked clusters; subsequent 2023-12-09 41-wallet
  precautionary sweep). Two observed_change layers at attribution
  direct + plausible -> empirical_case admission tier.

  Distinguishing features vs. siblings: (a) trigger is a
  geopolitical-emergency post-attack designation (vs. ransomware
  trigger for SUEX 2021-09 / Chatex 2021-11 and protocol-level
  privacy-mixer trigger for Tornado 2022-08); (b) target is a
  foreign-operated virtual-currency MSB with no US-hosted
  infrastructure dependency — direct US ramp closure is the action
  itself, but no canonical Buy Cash frontend has been pinned for the
  L0/L4 layers; (c) Tether's October 2023 freeze actions were
  contemporaneous with the OFAC designation rather than the delayed
  responses observed in suex-ofac-2021 (Tether retroactively swept
  the SUEX ETH addresses 27 months later on 2023-12-09).

  Follow-up directions (post-admission): (1) human-audit Wayback +
  body_hash pin of jy1816 and the OFAC Recent Actions 2023-10-18
  page; (2) full enumeration of Buy Cash digital-currency addresses
  from the SDN entry, with per-address usdtbanlist.com sweep against
  Tether and USDC issuers; (3) per-CEX KYT-flagging anchors
  (Chainalysis Reactor, TRM, Elliptic per-event report slices); (4)
  L1 consensus-layer (post-Merge) PBS / MEV-Boost relay-filter
  bracketing snapshots around 2023-10-18; (5) L3 RPC-provider
  (MEV-Blocker, Flashbots Protect) filter-list bracketing snapshots
  around 2023-10-18.

