      itself the ramp-severance event (analogous to suex-ofac-2021 and
      chatex-ofac-2021). partially_measured rather than measured because
      per-CEX KYT / deposit-cluster-flagging slices (Chainalysis Reactor,
      TRM, Elliptic per-event report screenshots) are not pinned at
      draft time. DRYRUN.

