target:
  kind: entity
  enumeration: complete
  enumeration_note: |
    The 2023-10-18 SDN action enumerates ten Hamas-affiliated individuals
    plus the Gaza-based virtual-currency MSB "Buy Cash Money and Money
    Transfer Company" (Khan Yunis). v0.3 audit 2026-05-20 (c) Batch C-1
    factual correction: full enumeration confirmed from OFAC RA HTML —
    Buy Cash MSB carries EXACTLY ONE digital-currency address, a Bitcoin
    XBT address `19D1iGzDr7FyAdiy3ZZdxMd6ttHj1kj6WW`. The original draft
    incorrectly inferred Ethereum/USDT chain involvement from contemporary
    Tether freeze sweeps (those sweeps target OTHER Hamas-affiliated
    addresses across the broader RA, NOT Buy Cash's single XBT address).
    enumeration=complete (was subset) now reflects the correct 1-address
    scope. This event scopes the target to the Buy Cash MSB entity (the
    virtual-currency / off-ramp node of the action) because that is the
    load-bearing actor for the offramp_cex severance layer. The ten
    individual operatives are listed in the same press release but are
    not the focal target here.
  entity: buy_cash_money_and_money_transfer_company
  actor_type: virtual_currency_msb
  actor_name: Buy Cash Money and Money Transfer Company (Khan Yunis, Gaza)
  chains:
    - bitcoin
  canonical_domains: []
  addresses:
    - "19D1iGzDr7FyAdiy3ZZdxMd6ttHj1kj6WW"

jurisdiction:
  - US

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      No network-layer censorship claim is retained for this row. The
      source-backed target is the Gaza-based Buy Cash virtual-currency MSB
      and its single XBT address; no confirmed DNS endpoint is part of the
      scoped claim, so an L0 OONI/Censored Planet probe is outside scope.
  - layer: l1_consensus
    status: not_applicable
    chain: bitcoin
    note: |
      Buy Cash MSB target is Bitcoin-only (single XBT address per OFAC RA);
      Bitcoin has no PBS/MEV-Boost-equivalent L1 consensus filtering layer
      to bracket. v0.3 audit 2026-05-20 factual correction: status changed
      from not_measured (Ethereum-framed) to not_applicable (Bitcoin-native).
  - layer: l3_rpc
    status: not_applicable
    chain: bitcoin
    note: |
      Buy Cash MSB target is Bitcoin-only; MEV-Blocker / Flashbots Protect
      are Ethereum-side RPC compliance substrates not applicable to a
      Bitcoin-only target. v0.3 audit 2026-05-20 factual correction:
      status changed from not_measured to not_applicable (Bitcoin-native).
  - layer: l4_frontend
    status: not_applicable
    note: |
      No frontend claim is retained for this row. The retained observation
      is the legal/off-ramp severance of a designated virtual-currency MSB;
      no operator-controlled UI surface is identified or measured here.
  - layer: asset_onchain
    status: not_applicable
    chain: bitcoin
    note: |
      v0.3 audit 2026-05-20 (c) Batch C-1 FACTUAL CORRECTION: status
      changed from partially_measured (Ethereum-framed) to not_applicable
      (Bitcoin-native). Buy Cash MSB's only OFAC-named address is the
      Bitcoin XBT `19D1iGzDr7FyAdiy3ZZdxMd6ttHj1kj6WW`. Bitcoin has no
      issuer-level freeze primitive (no UTXO clawback / blacklist method),
      so asset_onchain layer is structurally not_applicable for this
      target. The original draft incorrectly attributed Tether 32/41-wallet
      freeze sweeps to Buy Cash; those sweeps target OTHER Hamas-affiliated
      EVM addresses (from the same RA's individual designations or
      independent chain-analytics clusters), NOT Buy Cash's XBT address.
      The Tether sweeps remain notable contextual background for the
      post-Oct-7 enforcement window (see analysis_notes) but are NOT
      load-bearing evidence for this event's asset_onchain layer.
  - layer: offramp_cex
    status: partially_measured
    scope:
      - buy_cash_money_and_money_transfer_company
    provider_scope: unknown
    note: |
      Load-bearing layer (2 of 2). The SDN designation of Buy Cash
      itself is the off-ramp / virtual-currency-MSB severance — a US-
      property block plus secondary-sanctions exposure for any
      counterparty CEX or correspondent that continues to service the
      designated MSB. Treated as observed_change at attribution=direct
      under the offramp_cex layer because the SDN action's mechanism is
      itself the ramp-severance event (analogous to suex-ofac-2021 and
      chatex-ofac-2021). partially_measured rather than measured because
      per-CEX KYT / deposit-cluster-flagging slices (Chainalysis Reactor,
      TRM, Elliptic per-event report screenshots) are not pinned at
      draft time. DRYRUN.

