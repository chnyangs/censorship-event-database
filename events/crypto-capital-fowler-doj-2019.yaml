analysis_notes: |
  Admitted 2026-06-09. Created from the P4 census-gap queue with replayable
  Wayback captures of two primary_legal DOJ sources. origin agent_draft ->
  human_reviewed via LLM adjudication + maintainer oversight (not
  independent-human IRR).

  Inclusion rationale: this is not coded as a fraud/Ponzi investment case. The
  load-bearing public-source fact is that Fowler/GTS/Crypto Capital provided
  fiat-currency banking and payment-processing services to cryptocurrency
  exchanges while unlicensed, and DOJ directly targeted that off-ramp service.
  This makes it a post-2017 S3 counterpart to Coin.mx / Eric Powers style
  unlicensed-MSB cases, with a narrower target than any exchange customer.

  Modeling limits: the draft does not claim Bitfinex, Binance, or any exchange
  frontend was shut down. It also does not code `asset_onchain`, because the
  mechanism is off-chain bank/payment processing and no public chain-level
  freeze/seizure transaction is relied on.

scoped_claim: |
  "On 2019-04-30 DOJ USAO-SDNY announced Reginald Fowler's arrest for bank
  fraud and unlicensed money transmission tied to Crypto Capital / Global
  Trading Solutions shadow-banking services for cryptocurrency exchanges.
  This draft models only the enforcement termination of that fiat-rail service
  at `offramp_cex`; it does not claim an exchange shutdown, frontend seizure,
  or on-chain asset freeze."

