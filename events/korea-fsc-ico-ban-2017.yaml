coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The FSC 2017-09-29 statement does not direct ISP-level domain
      blocking or DNS interference. Korean network-layer treatment of
      crypto-exchange domains is not part of this trigger. L0
      not_applicable consistent with sibling banking-and-exchange-rail
      nation-state events (China 2013, China 2021, India 2018,
      Turkey 2021).
  - layer: l1_consensus
    status: not_applicable
    note: |
      The Ethereum Merge (2022-09-15) is ~5 years downstream of the
      2017-09-29 trigger; the post-Merge PBS relay-filter primitive that
      the L1 layer measures did not exist. not_applicable on
      construct-did-not-exist grounds, consistent with sibling pre-Merge
      nation-state events.
  - layer: l3_rpc
    status: not_applicable
    note: |
      Flashbots Protect launched 2022-11 and MEV-Blocker launched
      2023-03-27. The public-RPC compliance substrate that the L3 layer
      measures did not exist in 2017. not_applicable on
      construct-did-not-exist grounds.
  - layer: l4_frontend
    status: not_measured
    scope:
      - upbit.com
      - bithumb.com
      - coinone.co.kr
      - korbit.co.kr
    note: |
      Korean crypto exchange frontends (Upbit, Bithumb, Coinone, Korbit)
      added ICO-related disclosures and margin-trading-suspension notices
      on their homepages in the weeks following the 2017-09-29 FSC
      statement. Wayback bracketing of those homepage snapshots is
      plausibly feasible but the specific snapshot URLs have not been
      pinned in this authoring pass. L4 remains not_measured pending the
      Wayback-capture pass that an admission anchor at this layer would
      require.
  - layer: asset_onchain
    status: not_applicable
    note: |
      The FSC directive does not engage an issuer-side blacklist or freeze
      admin method on any chain. The 2017 trigger predates the
      stablecoin-issuer admin-freeze regime that the asset_onchain layer
      measures. not_applicable on construct-did-not-exist grounds.
  - layer: offramp_cex
    status: measured
    scope:
      - upbit
      - bithumb
      - coinone
      - korbit
    note: |
      The FSC 2017-09-29 statement is by construction an issuer-rail and
      regulated-financial-institution event: it bans ICO token-issuance
      fundraising and prohibits margin/lending crypto products at
      regulated financial institutions. The four dominant Korean
      crypto exchanges of the period (Upbit, Bithumb, Coinone, Korbit)
      complied across Q4-2017 / Q1-2018 with the directive and the
      follow-on 2018-01-30 real-name banking mandate (KFIU 2018). The
      FSC statement itself names the regulatory mandate, giving direct
      attribution at this layer. Marked measured; load-bearing
      observation attached below as observation_kind=observed_change
      with attribution=direct.

