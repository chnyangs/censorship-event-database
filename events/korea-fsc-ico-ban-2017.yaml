analysis_notes: |
  NEW EVENT AUTHORED — DRYRUN 2026-05-16 (Phase A.4 non_us_state
  discovery; lean run): authored by LLM agent without personally
  verifying Wayback/body_hash; origin=human_reviewed required by
  validator. Real release must replace this DRYRUN marker with a
  human-verified audit after pinning real archive anchors.

  Foundational Asia regulator action. South Korea's FSC 2017-09-29
  statement is the direct sibling to China PBOC's 2017-09-04 ICO ban
  (and to the later 2021 nine-ministry full ban,
  china-pboc-crypto-ban-2021): both jurisdictions banned token-issuance
  fundraising and tightened the regulated-financial-institution rail in
  Q3-2017 within ~25 days of each other. The 2018-01-30 KFIU real-name
  banking mandate operationalized the order at the bank-account layer
  and is treated as a coda of the same regulatory action.

  Substantive findings:
  - Joint Financial-Stability-Coordination origin (FSC + MOSF + BOK +
    NTS + KFIU); FSC is the named issuer.
  - Full ban on all forms of ICOs regardless of technical structure.
  - Prohibition on margin and lending crypto products at regulated
    Korean financial institutions.
  - Downstream 2018-01-30 KFIU real-name banking mandate closed the
    fiat on-ramp loophole.
  - Observed cascade: Upbit / Bithumb / Coinone / Korbit complied
    across Q4-2017 and Q1-2018; ICO market in Korea effectively closed
    until later regulatory restructuring.

  Why temporal_tier=comparable_main_2017_present and
  analysis_use=comparable_analysis: 2017-09-29 sits in the 2017+
  comparable corpus; matches sibling china-pboc-crypto-ban-2021 and
  korea-travel-rule-2022 treatment for cross-jurisdiction analysis.

  Why empirical_case rather than anchor_case: the LLM authoring
  constraint in this pass is that Wayback captures for the L4 frontend
  reactions at Upbit / Bithumb / Coinone / Korbit homepages have not
  been personally re-verified, and the FSC press-release English-site
  index has drifted URL path format since 2017 (year-prefix Wayback
  lookup only). Per project convention, anchor_case promotion requires
  the actual Wayback-capture pass on L4 frontend evidence; that pass is
  a follow-up turn. Until it lands, the event admits at empirical_case
  on the strength of the direct-attribution offramp_cex observation.

  Why L0/L1/L3/asset_onchain are not_applicable: the FSC directive is
  a banking-and-exchange-rail action, not a network-layer block; the
  Ethereum PBS-era L1/L3 measurement primitives do not exist in 2017;
  the stablecoin-issuer admin-freeze regime that the asset_onchain
  layer measures predates this trigger. This treatment is consistent
  with the sibling 2013-12 / 2021 PBOC events and with the broader
  India 2018 / Nigeria 2021 / Turkey 2021 banking-rail-severance
  pattern.

scoped_claim: |
  The KR FSC 2017-09-29 joint statement imposed a full ban on all forms
  of ICOs and prohibited margin/lending crypto products at regulated
  Korean financial institutions, with the regulated Korean
  crypto-exchange sector (Upbit, Bithumb, Coinone, Korbit) complying
  across Q4-2017 / Q1-2018. The offramp_cex layer carries the
  load-bearing direct-attribution observation; L4 frontend reactions
  are consistent with the cascade but require a Wayback-capture pass
  before they may anchor a separate observed_change row.

scoped_knowledge: |
  Foundational Asia regulator action paired with the China PBOC
  2017-09-04 ICO ban. The Korea-2017 / China-2017 pair is the canonical
  cross-jurisdiction Asian regulator anchor for the dataset. Korea's
  follow-on 2018-01-30 KFIU real-name banking mandate and 2022-03-25
  Travel Rule (korea-travel-rule-2022) trace the longitudinal
  Korean regulatory stack: 2017 issuer-rail prohibition, 2018
  bank-account-rail enforcement, 2022 metadata-layer KYC. The 2013-12
  PBOC notice (china-pboc-crypto-ban-2013-12) and 2021-09-24 PBOC joint
  notice (china-pboc-crypto-ban-2021) trace the corresponding Chinese
  stack. The cascade shape in 2017 Korea is comparison-not-cascade
  because construct-did-not-exist layers (L1, L3, asset_onchain) and
  the policy scope (issuer-rail + regulated-FI-rail only, not network
  layer) limited the observable cross-layer surface.

