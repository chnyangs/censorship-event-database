  comparison — S5 corporate-policy card-network suspension by
  Visa Europe (with downstream Teller A/S compliance terminating
  the DataCell ehf merchant agreement carried via Korta in
  Iceland), effective 2010-12-07. The Visa Europe statement is
  the card-network sibling of the same-week PayPal account
  freeze (related: wikileaks-paypal-freeze-2010-12) and the
  MasterCard Europe suspension (related:
  wikileaks-mastercard-suspension-2010-12), all converging in
  the 2010-12 WikiLeaks financial blockade following the
  Cablegate publication of 2010-11-28. The DataCell-Teller
  termination on 2010-12-07 is the direct upstream trigger of
  the 2012 Reykjavík District Court case E-561/2012 (related:
  datacell-v-valitor-iceland-district-court-2012-07), although
  the named defendant in that case is Valitor hf (which signed
  a fresh acquirer agreement with DataCell in June 2011, briefly
  reopened the gateway, then terminated again — that 2011
  termination is the specific act litigated in 2012).

  empirical_shape=comparison (1 observed_change layer:
  offramp_cex with attribution=direct via the Visa Europe
  corporate statement and Reuters/BBC/Guardian contemporaneous
  journalism); admission_tier=empirical_case (1 strong-attrib
  observed_change layer satisfies the ≥1 requirement). The
  card-network rail is treated as the offramp_cex analogue for
  the 2010 fiat-payments cascade.

  Why discovery_only_2008_2012 / discovery_ledger_only:
  2010-12 belongs to the pre-2013 discovery-only tier per
  sampling/frame.yaml. analysis_use=discovery_ledger_only
  excludes this row from both the historical-baseline and the
  2017+ comparable-analysis denominators. The event is retained
  as a discovery-ledger case-study anchor for the dataset's
  origins of corporate-actor financial-infrastructure censorship.

  Why L0/L1/L3/L4/asset_onchain are not_applicable:
  the action is a card-network acquirer-rail suspension; it
  does not engage ISP-level blocking, any L1 consensus or L3
  RPC primitive (Ethereum mainnet launched 2015-07-30, MEV-Boost
  launched 2022-09-15), any L4 frontend operator overlay (the
  DataCell donation page itself remained reachable; the failure
  was downstream at card authorization), or any asset-issuer
  admin path (no stablecoin/token freeze surface engaged in
  2010-12). The L0/L1/L3/L4/asset_onchain not_applicable
  treatment matches the sibling 2010-12 PayPal account-freeze
  event's expected coverage shape.

