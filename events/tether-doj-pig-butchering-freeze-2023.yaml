analysis_notes: |
  **SOURCE REPAIR 2026-05-31 (automation, user-delegated; no human audit
  status changed):** added the later D.D.C. verified complaint and seven
  primary_onchain USDT AddedBlackList receipts for the Token Group A-G
  subset. The original admission status/origin is preserved. The repair
  upgrades asset_onchain from not_measured to partially_measured because
  seven concrete addresses are now pinned, while the full wallet cohort
  from the 2023 Tether blog remains broader than those seven addresses.

  comparison — first **DOJ-request-driven (non-OFAC) Tether freeze**
  in the dataset. Paper-relevant S5 datapoint completing the Tether issuer-
  compliance profile:
    - OFAC-driven (Tornado 2022 cluster, via tether-retroactive-sweep-2023)
    - Pre-OFAC forward-looking (DPRK USDT pre-commit 2025, via
      tether-dprk-precommit-freeze-2025)
    - **DOJ-request-driven, non-OFAC (this event)**
  Together these three Tether events span the spectrum of issuer-compliance
  trigger modes. Paper claim: stablecoin issuer compliance is NOT a pure
  function of OFAC SDN listings; it also responds to (a) DOJ direct
  requests without corresponding SDN and (b) issuer-internal intelligence
  ahead of OFAC timelines.

scoped_claim: |
  "Tether's 2023-11-20 freeze of $225M USDT linked to a Southeast Asia
  pig-butchering syndicate — executed at DOJ/USSS request without any
  corresponding OFAC SDN listing — documents the DOJ-request-driven mode of
  stablecoin-issuer freeze action. A later D.D.C. complaint enumerates seven
  USDT Token Group addresses in this path, and the seven corresponding
  Tether AddedBlackList transactions are pinned as primary_onchain
  evidence. Completes the 3-mode Tether compliance spectrum
  (OFAC-reactive / OFAC-preemptive / DOJ-request-only) at S5."

