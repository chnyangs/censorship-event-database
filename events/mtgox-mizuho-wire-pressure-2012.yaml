  **NEW EVENT AUTHORED - DRYRUN 2026-05-17 (Wave 2.3 P2)**:
  authored end-to-end by LLM agent under the discovery-tier
  banking-correspondent-severance hypothesis. The authoring
  brief posited a 2012-12 Mizuho Bank action against Mt. Gox's
  USD wire rails as a pre-2013 antecedent of the 2013-05 DHS
  Dwolla seizure and the 2013-06 Mt. Gox USD withdrawal
  suspension. Consulted sources (Mt. Gox Wikipedia, Bilzin
  Sumberg jurisdictional retrospective on Greene v. Mizuho)
  locate the substantive Mizuho-Mt.Gox correspondent-banking
  severance in mid-2013 (post-2013-06-20), not in December
  2012. No discrete 2012-12 Mizuho action is documented in
  the consulted secondary sources.

  Per the authoring brief: "If no specific 2012-12 Mizuho
  event found: code null_event." Accordingly, this row is
  coded null_event / null_case with observation_kind=
  observed_no_change + attribution=none at offramp_cex, and
  all other layers not_applicable on construct/scope grounds.
  The trigger.timestamp 2012-12-01 is an approximate anchor
  for the null-event window; it does not assert that any
  Mizuho action occurred on that date.

  temporal_tier=discovery_only_2007_2012 (2012 calendar year
