analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-5 audit: human-reviewed
  promotion of this S5 corporate null from draft to admitted. The
  verified-YES decision reclassifies the single observation from the
  asset_onchain layer to the offramp_cex (issuer-direct redemption)
  layer and promotes it as a genuine observed_no_change null:
  during the March 2023 SVB crisis Circle stated its reserves were
  safe and resumed Circle-direct USDC redemption with no holder
  freeze and no peg abandonment. The real circle.com press-room
  statement (body_hash sha256:4739b0…, captured under
  sources/http_captures/circle-usdc-svb-policy-statement-2023/) is
  the replayable null anchor and satisfies admission for this
  non-asset_onchain layer. asset_onchain is recorded not_applicable
  because no Circle on-chain freeze / blacklist / supply-control
  action occurred, so no asset_onchain surface was engaged and no
  observation remains on that layer.

  null_event — S5 corporate-policy-clarification row documenting
  Circle's 2023-03-11 (formal press-room statement, with initial
  Twitter / blog disclosures evening 2023-03-10) public disclosure
  that ~$3.3B (~8%) of USDC's cash reserves remained at Silicon
  Valley Bank at the time of the FDIC receivership (2023-03-10),
  paired with Circle's commitment to full 1:1 USDC backing using
  corporate funds and pre-announcement of redemption / minting
  resumption Monday 2023-03-13 once banking channels reopened. The
  Federal Reserve / Treasury / FDIC joint backstop announcement
  (Sunday 2023-03-12) effectively removed the reserve-shortfall
  risk, and USDC's secondary-market price recovered toward $1.00 by
  Monday's redemption resumption.

  Why null_event / null_case: this is a corporate **transparency /
  policy-clarification** action, not a censorship cascade.
  Circle did NOT freeze any addresses, did NOT restrict any class of
  holders, did NOT delist or geofence any product surface, and did
  NOT impose any discretionary compliance gate; instead, Circle
  voluntarily disclosed reserve-bank exposure and reaffirmed its
  redemption commitment under banking-rail stress. The weekend
  redemption pause (2023-03-11 / 2023-03-12) is the operational
  consequence of US banking-system closure over the SVB-failure
  weekend rather than a discretionary issuer policy action, and is
  not coded as an observed_change here. Codebook §3: 0
  observed_change layers → empirical_shape=null_event; codebook §4:
  0 strong-attribution observed_change layers → admission_tier=
  null_case.

  Why this row exists despite carrying no observed_change: it
  documents an **issuer transparency-action denominator-control**
  data point for the S5 corporate-policy-change stratum — a high-
  salience moment where the dominant US-licensed stablecoin issuer
  faced acute banking-rail stress (the second-largest US bank
  failure in history at the time) yet responded with disclosure and
  peg-defense commitment rather than any form of holder restriction
  or address-level freeze. The row scopes the denominator for "S5
  corporate actions during banking-rail stress" so that the
  numerator OFAC-cascade / discretionary-freeze rows in S5 (e.g.,
  the 2022-08 Circle Tornado Cash freeze, the 2023-08-23 Semenov
  designation, the 2023-12 Tether retroactive sweep) can be
  compared against a banking-rail-stress baseline in which the
  same issuer class chose transparency over restriction.

  L0 / L1 / L3 / l4_frontend are not_applicable on substrate-
  mismatch grounds — a corporate transparency statement about
  reserve-bank exposure engages no network / consensus / RPC /
  frontend surface. asset_onchain is not_applicable because no
  Circle on-chain freeze / blacklist / supply-control action
  occurred: USDC continued operating normally, no discretionary
  issuer cascade fired, and no observation remains on that layer.
  offramp_cex is partially_measured: the issuer-direct redemption
  surface is captured (Circle resumed redemption with no holder
  restriction or freeze) while broader third-party CEX off-ramp
  behaviour is not independently measured.

  This row stays at admission_tier=null_case / empirical_shape=
  null_event by design — it is a transparency-action denominator-
  control row anchored on a genuine observed_no_change at the
  issuer-direct off-ramp surface.

