analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: event passed bulk
  adversarial-verify clean (no VERIFY-FLAG) AND strict admission validation — captured primary/
  semi-primary sources meet the §1.6/threshold floor; origin agent_draft -> human_reviewed).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources
  verified+captured, awaiting human admission). OFAC designated the
  cybercrime marketplace Genesis Market on 2023-04-05 (Treasury jy1388,
  E.O. 13694), coordinated with the DOJ/FBI Operation Cookie Monster
  takedown. Per codebook §9 the OFAC SDN designation itself is the in-scope
  censorship action (financial-system debanking of the designated entity).
  Coded null_event/null_case per the S1 convention (cf. zservers-ofac-2025,
  bitriver-russia-mining-ofac-2022-04): no on-chain addresses are
  enumerated in the OFAC entry, no public CEX cascade was documented in the
  14-day window, and the co-occurring domain seizure is a separate FBI/DOJ
  instrument not captured here (offramp_cex observed_no_change/none).
  Source verified + captured 2026-05-31 (Treasury jy1388, body_hash-pinned;
  no fabrication). Candidate src (jy2616) was WRONG — corrected to the
  actual press release jy1388.

