  Temporal tier: discovery_only_2008_2012 (analysis_use=
  discovery_ledger_only — the controlled-vocab spelling of the
  user-instruction's "discovery_only" shorthand per codebook §6). The
  event predates the 2017+ comparable-analysis tier and the 2013+
  historical-baseline tier; it is admitted to the discovery ledger
  only, not to the comparable-denominator corpus.

  Timestamp caveat (key dryrun risk for this row): the user-supplied
  trigger_date≈2010-12-15 reflects the *opening* of the Finanzamt
  Kassel review during December 2010. The *formal revocation letter*
  was issued in January 2011, and a later Hamburg Tax Office
  retroactive revocation followed on 2012-10-25. The 2010-12-15
  timestamp pins the cascade-relevant moment (the regulatory pressure
  arrives during the same week as the PayPal / PostFinance /
  MasterCard / Visa-Europe / Bank-of-America cascade), but week-level
  precision is required because no publicly archived day-precision
  source for the December review opening has been located in this
  drafting session. Human reviewer should consider (a) splitting this
  into a 2010-12 "review opened" event and a 2011-01 "revocation
  issued" event if a primary-legal Kassel-letter pin emerges, and
  (b) re-checking the 2010-12-15 anchor against any contemporaneous
  Wau Holland Stiftung transparency-report dating of the review's
  opening.

  Attribution: plausible (not direct) per codebook §1. The actor
  (Finanzamt Kassel) is identifiable and the effect (disruption of
  the German-jurisdiction tax-deductible WikiLeaks donation rail) is
  causally consistent with the trigger, but: (a) the Kassel review
  letter is not publicly archived as a primary-legal pin, and (b) the
  link from review-opening (December 2010) to actual donation-channel
  disruption is one-step inferential rather than directly attested in
  a single primary document. Conservative coding per codebook §8.4.

  Stratum + trigger.type: S4_nation_state with trigger.type=
  regulatory_enforcement per codebook §5.1 (non-US national-regulator
  administrative enforcement — the Finanzamt Kassel is a German
  Land-level tax authority issuing an administrative gemeinnuetzig-
  status determination, not a network/payment-rail block).

  comparison shape: exactly 1 observed_change layer at offramp_cex
  (attribution=plausible, source-anchored on the Wau Holland project-04
  page plus tertiary/journalism consolidation of the Kassel review
  timeline). All other layers (l0_network, l1_consensus, l3_rpc,
  l4_frontend, asset_onchain) are not_applicable.

  Sibling-event structure (the WikiLeaks 2010-12 financial-isolation
  cascade): this is the German-Land-tax-authority leg, structurally
  distinct from the US-payment-processor legs (PayPal, Bank of
  America) and the Swiss-state-postal-banking leg (PostFinance). It
  is the only S4_nation_state regulatory leg of the 2010 WikiLeaks
  blockade and the only leg targeting the *charitable-pass-through*
  rather than direct-account rail. related_events anchors:
  wikileaks-paypal-freeze-2010-12, wikileaks-postfinance-account-
  closure-2010-12, wikileaks-bank-of-america-block-2010-12.

  DRYRUN caveats: all citations carry wayback wildcard pointers and
  evidence_use=contextual_unarchived because no body_hash+body_path
