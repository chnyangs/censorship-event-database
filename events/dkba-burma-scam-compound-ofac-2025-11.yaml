  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1;
  sources verified+captured, awaiting human admission). OFAC SDN
  designation 2025-11-12 (Treasury sb0312) of the Democratic Karen
  Benevolent Army (DKBA) + four leaders, Trans Asia, Troth Star, and
  Chamu Sawang, for developing / hosting Chinese-OC pig-butchering
  crypto-fraud scam compounds (incl. Tai Chang near Myawaddy) that
  target Americans; part of the Scam Center Strike Force. In-scope per
  §9 INCLUDE (OFAC SDN designation) — the censorship action is the SDN
  asset-blocking designation, distinct from the §9 EXCLUDE for
  prosecuting a scam-as-platform. Coded null_event / null_case per the
  S1 convention (cf. bitriver-russia-mining-ofac-2022-04): the
  designation names an armed group / companies with no enumerated
  on-chain addresses on the captured page and no per-event CEX cascade
  was pinned in the 14-day window, so the measurable cross-layer surface
  is limited (offramp_cex observed_no_change / none; asset_onchain
  not_applicable). Primary source verified + captured 2026-05-31
  (Treasury sb0312, body_hash-pinned; no fabrication). Conservative
  coding per codebook §8.4 pending human review.

