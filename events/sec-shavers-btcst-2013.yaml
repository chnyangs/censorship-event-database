trigger:
  type: sec_action
  actor: US_SEC
  timestamp: 2013-07-23T00:00:00Z
  timestamp_precision: day
  citation:
    - type: primary_legal
      url: https://www.sec.gov/litigation/complaints/2013/comp-pr2013-132.pdf
      wayback: https://web.archive.org/web/2013/https://www.sec.gov/litigation/complaints/2013/comp-pr2013-132.pdf
      evidence_use: contextual_unarchived
      note: |
        SEC civil complaint filed 2013-07-23 in the U.S. District Court for the
        Eastern District of Texas, Sherman Division, against Trendon T. Shavers
        and Bitcoin Savings and Trust (BTCST). The complaint alleges Shavers
        operated a Bitcoin-denominated Ponzi scheme from approximately 2011
        through 2012, soliciting investors via the Bitcoin Forum under the alias
        "pirateat40" and promising up to 7% weekly interest on Bitcoin deposits.
        BTCST raised approximately 700,000 BTC in investor funds before
        collapsing in August 2012. Marked evidence_use=contextual_unarchived
        because the authoring LLM agent did not personally pin a Wayback snapshot
        timestamp or compute a body_hash for the PDF; the SEC litigation-PDF URL
        format is stable and routinely captured by Wayback, but the specific
        snapshot timestamp is to be re-pinned during human audit before this
        citation may serve as an admission anchor in its own right. Provisional
        Wayback anchor uses Wayback Machine year-prefix lookup.
    - type: primary_legal
      url: https://www.sec.gov/news/press-release/2013-132
      wayback: https://web.archive.org/web/2013/https://www.sec.gov/news/press-release/2013-132
      evidence_use: contextual_unarchived
      note: |
        SEC press release 2013-132 ("SEC Charges Texas Man With Running
        Bitcoin-Denominated Ponzi Scheme") announcing the civil complaint
        against Trendon T. Shavers and Bitcoin Savings and Trust. Names the
        E.D. Tex. venue, the 7%/week promised return structure, and the
        approximately 700,000 BTC raised. First major SEC enforcement action
        against a Bitcoin-denominated investment scheme. Marked
        evidence_use=contextual_unarchived pending a human-audit Wayback re-pin
        and body_hash capture. Provisional Wayback anchor uses Wayback Machine
        year-prefix lookup.
  timestamp_sources:
    - type: primary_legal
      note: |
        Day-level timing per the 2013-07-23 SEC press release and the
        contemporaneous filing date stamped on the E.D. Tex. civil complaint.

target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    Bitcoin Savings and Trust (BTCST) entity plus Trendon T. Shavers
    individual (alias "pirateat40"). No on-chain BTC addresses are
    enumerated at this event level; the ~700,000 BTC raised across the
    2011-2012 scheme period is referenced in the complaint but specific
    deposit/withdrawal cluster addresses are not pinned here. BTCST was
    operated as an unregistered investment scheme advertised on the
    Bitcoin Forum (bitcointalk.org); it had no public canonical exchange
    domain in the conventional sense, so canonical_domains is empty.
  actor_type: bitcoin_denominated_investment_scheme
  actor_name: Bitcoin Savings and Trust (BTCST) / Trendon T. Shavers
  chains: [bitcoin]
  canonical_domains: []

jurisdiction: [US]

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      BTCST was promoted through forum posts on the Bitcoin Forum
      (bitcointalk.org) rather than via a canonical operator-controlled
      website. No ISP-level reachability question attaches to the
      2013-07-23 SEC civil filing; standard public-web L0 instruments
      (Censored Planet, OONI) do not apply.
  - layer: l1_consensus
    status: not_applicable
    chain: bitcoin
    note: |
      Bitcoin proof-of-work consensus in 2013 has no protocol-level
      relay-filter primitive analogous to the post-Merge Ethereum PBS
      relay surface. The Ethereum Merge itself is ~9 years downstream
      (2022-09-15). not_applicable on construct-did-not-exist grounds.
  - layer: l3_rpc
    status: not_applicable
    chain: bitcoin
    note: |
      The MEV-Boost / Flashbots Protect / MEV-Blocker public-RPC compliance
      substrate that the L3 layer measures did not exist in 2013;
      Flashbots Protect launched 2022-11. not_applicable on
      construct-did-not-exist grounds.
  - layer: l4_frontend
    status: not_applicable
    note: |
      BTCST had no operator-controlled canonical frontend domain to seize
      or take down; the scheme operated through bitcointalk.org forum
      posts under the "pirateat40" alias and direct BTC deposits. No L4
      surface attaches to the 2013-07-23 SEC civil filing.
  - layer: asset_onchain
    status: not_applicable
    chain: bitcoin
    note: |
      Bitcoin native asset has no issuer-side blacklist / freeze admin
      method. The SEC civil complaint does not engage a stablecoin-issuer
      admin path. not_applicable on construct-did-not-exist grounds.
  - layer: offramp_cex
    status: measured
    scope:
      - bitcoin_savings_and_trust
    note: |
      BTCST is the load-bearing layer for this event: an operator-state
      change at a Bitcoin-denominated investment scheme treated by this
      dataset as an offramp-class entity (centralized custodian of
      depositor BTC offering nominal yield, structurally analogous to
      crypto-lending platforms tracked elsewhere in the offramp_cex
      column). The 2013-07-23 SEC civil filing alleging Ponzi operation,
      coupled with the subsequent court-ordered asset freeze and
      receivership, ended BTCST as an operating entity. Marked measured;
      load-bearing observation attached below as
      observation_kind=observed_change with attribution=direct.

