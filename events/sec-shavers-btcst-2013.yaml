analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase 6c bulk-promotion of 22 candidate stubs per user instruction to push remaining backlog to dryrun-complete state): promoted from candidate_triggers/sec-shavers-btcst-2013.yaml. Authored by LLM agent without personally verifying Wayback/body_hash; origin=human_reviewed required by validator. Real release must replace this DRYRUN marker with a human-verified audit after pinning real archive anchors.

  comparison shape: 1 observed_change layer (offramp_cex). L0/L1/L3/L4/asset_onchain
  are all not_applicable because BTCST had no operator-controlled frontend or
  ISP-level reachability surface, the Bitcoin protocol layers tracked by this
  dataset did not exist in their measured forms in 2013, and Bitcoin native
  asset has no issuer-side freeze primitive. The single load-bearing
  observation is the operator-state change at the BTCST scheme triggered by
  the 2013-07-23 SEC civil filing, attribution=direct via the primary-legal
  SEC complaint and press release.

  Historical-baseline placement: this is the earliest SEC enforcement action
  against a Bitcoin-denominated investment scheme in the dataset, predating
  the 2017-07-26 BTC-e DOJ indictment (the first crypto-exchange enforcement
  event in the comparable corpus) by ~4 years. Establishes the pre-OFAC,
  pre-comparable-corpus baseline for SEC-rooted offramp-class enforcement.
  Cross-temporal sibling of the 2022-02-14 BlockFi SEC lending-product
  settlement (blockfi-sec-lending-2022): both events code an offramp_cex
  operator/product restriction triggered by an SEC action, separated by
  ~8.5 years and bracketing the SEC's escalating posture toward
  centralized crypto-yield products.

scoped_claim: |
  "The 2013-07-23 SEC civil complaint against Trendon T. Shavers and Bitcoin
  Savings and Trust ended BTCST as an operating Bitcoin-denominated investment
  scheme via subsequent court-ordered asset freeze and receivership; the row
  claims only this single-layer offramp_cex operator-state-change observation
  and does not assert frontend, network, RPC, or on-chain asset effects."

