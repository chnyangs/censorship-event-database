analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17**

  Null-event recording the MiCA Level-2 Regulatory Technical Standards
  (RTS) finalized through 2024 by ESMA and EBA. Canonical L2 milestone
  trigger fixed at 2024-03-25 — ESMA's third (final) Consultation Paper
  (CP3), which closed the major draft RTS proposals on crypto-asset
  market abuse (Art. 92 STOR), suitability for portfolio management, and
  crypto-asset transfer services. EBA companion RTS packages on
  stablecoin issuer reserve composition (≥30% deposits for ART/EMT;
  ≥60% for significant tokens; weekly liquidity; overcollateralization
  with 5-year daily look-back) were finalized in parallel across 2024.
  Downstream milestones: 2024-12-17 ESMA STOR Final Report (Commission
  Delegated Regulation); 2024-12-30 MiCA CASP authorization regime
  applies; 2024-10 Commission rejection-and-amendment cycle for several
  RTS (documented for cross-referencing).

  Codebook compliance:
  - trigger.type=supranational_regulation per §5.1 (EU regulation,
    non-sanctions; MiCA L2 RTS). Stratum S6_supranational per §5.2.
  - target.enumeration=subset per §7 (class-level CASP + ART/EMT issuer
    cohort; not exhaustively enumerable at trigger date).
  - analysis_use=comparable_analysis (canonical form, not
    `comparative_analysis`) per §6.
  - empirical_shape=null_event per §3 (0 observed_change layers; the L2
    RTS shape forward-looking authorization and reserve management
    obligations, not retroactive per-address or per-CASP behavioral
    events at trigger date).
  - admission_tier=null_case per §4 (0 strong-attribution observed_change
    layers).
  - Observation rows use attribution=`none` because observation_kind is
    `observed_no_change` (§1.1).

  Evidence is contextual_unarchived (per ingestion request); no
  admission-anchor capture in this draft. Sibling supranational events:
  eu-mica-2023 (Level-1 framework), eu-amla-anti-money-laundering-
  authority-regulation-2024 (AML/CFT supervisor), eu-tfr-recast-2023
  (Travel Rule), kraken-monero-eu-delisting-2024 (an adjacent CASP-level
  follow-on event already in dataset). Revisit when post-2024-12-30
  CASP authorization decisions or RTS-driven stablecoin issuer behavior
  surfaces as observable cross-layer events.

