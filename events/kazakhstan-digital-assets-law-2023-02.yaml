  comparison — S4 nation-state regulatory event. President Tokayev
  signed Republic of Kazakhstan Law No. 193-VII "On Digital Assets in
  the Republic of Kazakhstan" on 2023-02-06; in-force 2023-04-01. The
  statute introduces (i) a mandatory state cryptomining-licence and
  pool-accreditation regime (l1_consensus-layer effect on Kazakh
  mining substrate, which was briefly the #2 global Bitcoin
  jurisdiction in 2021-Q3 after the PRC mining ban) and (ii) an
  AIFC-confined commercial-exchange registration regime
  (offramp_cex-layer effect: off-AIFC commercial exchange activity
  for Kazakh-vantage users becomes unlicensed). Two observed_change
  layers attached, both attribution=direct on the legal-text basis;
  empirical_shape=comparison (1-2 distinct observed_change layers);
  admission_tier=empirical_case (>=1 strong-attribution
  observed_change layer).

  Distinct from but related to kazakhstan-internet-shutdown-mining-
  2022-01 (the January 2022 national emergency-communications cutoff,
  which operated at L0 network / L1 consensus through a temporary
  outage rather than through a permanent licensing regime). The 2023
  Digital Assets Law is the durable legal-framework follow-on to the
  2022 episode and is the policy instrument that re-channels Kazakh
  mining activity through a licensed perimeter.

  L0 / L3 / asset_onchain are not_applicable on construct-not-engaged
  grounds (regulatory licensing regime does not engage ISP-level
  domain blocking, Ethereum public-RPC filtering, or
  stablecoin-issuer admin-method freezes). L4 frontend remains
  not_measured pending per-event Wayback bracketing.

scoped_claim: |
  "On 2023-02-06 the President of the Republic of Kazakhstan signed
  Law No. 193-VII On Digital Assets, in force 2023-04-01, which
  introduced (i) a mandatory state cryptomining-licence and
  pool-accreditation regime and (ii) an AIFC-confined commercial
  digital-asset exchange registration regime. Both effects are
  attribution=direct from the legal text: unlicensed cryptomining on
  Kazakh territory and off-AIFC commercial exchange activity for
  Kazakh-vantage users become unlicensed from the in-force date.
  Load-bearing axes are l1_consensus (Kazakh mining substrate) and
  offramp_cex (Kazakh-vantage commercial exchange perimeter)."

