  comparison — historical-baseline anchor for the **first SEC settlement
  directly tied to a Bitcoin-denominated securities offering** (2014-06-03,
  SEC v. Voorhees; SatoshiDICE S.DICE shares + FeedZeBirds shares). Two
  observed_change layers (offramp_cex direct; l4_frontend plausible) with
  the SEC primary-legal sources as the load-bearing record. L0/L1/L3/
  asset_onchain coded not_applicable: 2014 pre-dates measurable consensus-
  or RPC-layer filtering for Bitcoin, and the offering instruments were
  off-chain Bitcoin-denominated equities rather than admin-freezable
  tokens.

  Related events:
  - nydfs-bitlicense-2015-06 (next-year US sub-national crypto-regulatory
    cascade involving Voorhees's later venture ShapeShift),
  - silk-road-doj-seizure-2013 (historical-baseline anchor for the
    contemporaneous pre-OFAC-era US federal crypto enforcement family).

scoped_claim: |
  "The 2014-06-03 SEC settlement with Erik Voorhees (SatoshiDICE +
  FeedZeBirds unregistered Bitcoin-denominated securities offerings) is
  the earliest SEC enforcement in the dataset directly tied to a
  Bitcoin-denominated equity offering. The row claims only the
  operator-level offering shutdown (offramp_cex, direct) and the
  pre-codified US-user frontend geofence / Voorhees operator divestment
  (l4_frontend, plausible); no L0/L1/L3/asset-onchain effects are
  claimed."

