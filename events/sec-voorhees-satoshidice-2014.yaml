coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The 2014 SEC settlement is an enforcement action against the issuer,
      not an ISP-level reachability block. Standard public-web L0
      instruments (Censored Planet, OONI) do not apply.
  - layer: l1_consensus
    status: not_applicable
    chain: bitcoin
    note: |
      Bitcoin, pre-Merge; consensus-layer filtering surfaces tracked by
      this dataset (PBS relays, mev-watch / censorship.pics) did not exist
      in 2014.
  - layer: l3_rpc
    status: not_applicable
    chain: bitcoin
    note: |
      Hosted-RPC providers did not operate at meaningful scale in 2014;
      no L3 substrate to measure for Bitcoin in this era.
  - layer: l4_frontend
    status: measured
    scope: [satoshidice.com]
    note: |
      SatoshiDICE's clearnet domain satoshidice.com is the load-bearing
      L4 surface for the SEC action's real-world effect. SatoshiDICE
      blocked US IPs in mid-2013 (months before the formal settlement) and
      Voorhees divested operator interest in July 2013; the site continued
      operating as a non-US-facing dice game thereafter. The 2014-06-03
      SEC settlement formally codified the previously-effected US-user
      withdrawal at the issuer level rather than triggering a fresh
      frontend takedown. Observation below attaches the operator
      divestment/US-block as the observed L4-side surface change.
  - layer: asset_onchain
    status: not_applicable
    chain: bitcoin
    note: |
      Bitcoin is unfreezable at the protocol layer (no issuer blacklist
      method); the SatoshiDICE / FeedZeBirds share instruments were
      off-chain Bitcoin-denominated equities, not on-chain tokens with
      admin-method freeze surfaces.
  - layer: offramp_cex
    status: measured
    scope: [satoshidice_operator]
    note: |
      SatoshiDICE the operator (as issuer of the S.DICE Bitcoin-denominated
      equity shares) is the off-ramp/service surface for this row. The
      SEC settlement required Voorhees to disgorge unregistered-offering
      proceeds and barred him from further unregistered securities
      issuance for two years, which is the load-bearing service-state
      change at the operator/off-ramp layer. Coded as measured to
      preserve the operator-level shutdown of US-investor share
      offerings as the empirical observation.

