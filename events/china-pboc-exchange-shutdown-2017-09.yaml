  timestamp_sources:
    - type: supporting_journalism
      note: |
        The PBOC-led instruction to cease domestic CNY-paired crypto
        trading was issued in stages across mid-September 2017, with
        BTCC announcing closure by 2017-09-30 and Huobi / OKCoin
        committing to cease yuan-paired trading by end of October.
        The 2017-09-29 trigger timestamp anchors on the final
        BTCC-tier exchange shutdown deadline (BTCC ceased all trading
        on 2017-09-30 PRC time, equivalent to 2017-09-29 UTC).
        Day-level precision is appropriate; the underlying PBOC
        administrative communication does not carry intra-day
