coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The 2017-09 PBOC-led exchange-shutdown instruction is a
      banking-rail and licensing-rail directive, not an ISP-level
      domain block. Domestic exchanges were ordered to cease
      CNY-paired trading and wind down operations via administrative
      instruction, not via DNS or IP-level interference. PRC L0-layer
      blocking of crypto-exchange domains is a later, separate
      enforcement phenomenon. not_applicable, consistent with the
      sibling china-pboc-crypto-ban-2013-12 and india-rbi-crypto-ban-2018
      banking-and-exchange-rail nation-state treatment.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Pre-Merge event (Ethereum Merge 2022-09-15). Bitcoin proof-of-work
      consensus in 2017-09 has no protocol-level relay-filter primitive
      analogous to the post-Merge Ethereum PBS relay surface.
      not_applicable on construct-did-not-exist grounds, consistent
      with the sibling 2013 and 2021 PBOC events.
  - layer: l3_rpc
    status: not_applicable
    note: |
      The MEV-Boost / Flashbots Protect / MEV-Blocker public-RPC
      compliance substrate that the L3 layer measures did not exist in
      2017; Flashbots Protect launched 2022-11 and MEV-Blocker launched
      2023-03-27. not_applicable on construct-did-not-exist grounds.
  - layer: l4_frontend
    status: not_measured
    scope:
      - btcc.com
      - btcchina.com
      - okcoin.cn
      - huobi.com
    note: |
      The three named domestic exchanges (BTCC, OKCoin, Huobi)
      published shutdown announcements on their homepages and via
      exchange-bulletin pages between mid-September and end-of-October
      2017. Wayback CDX coverage of these domains in 2017-09 / 2017-10
      is non-trivial but the specific snapshot URLs and body_hash
      anchors have not been pinned in this authoring pass. L4 status
      remains not_measured pending the Wayback-capture pass that an
      admission anchor at this layer would require.
  - layer: asset_onchain
    status: not_applicable
    note: |
      Bitcoin native asset has no issuer-side blacklist / freeze admin
      method. The 2017-09 directive does not engage a stablecoin-issuer
      admin path. not_applicable on construct-did-not-exist grounds.
  - layer: offramp_cex
    status: measured
    scope:
      - btcc
      - okcoin
      - huobi
    note: |
      The 2017-09 PBOC-led instruction is by construction an off-ramp
      / CNY-rail closure event: it directed the three dominant PRC
      domestic exchanges (BTCC, OKCoin, Huobi) to cease all CNY-paired
      crypto trading and wind down domestic operations. BTCC announced
      cessation of all trading by 2017-09-30; Huobi and OKCoin committed
      to ceasing yuan-paired trading by end of October 2017. The
      offramp_cex layer carries the load-bearing direct-attribution
      observation. Marked measured.

