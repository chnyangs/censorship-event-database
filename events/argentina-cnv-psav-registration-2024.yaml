analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17**. Comparable-tier
  contextual case for Resolución General CNV N° 994/2024, issued
  by Argentina's Comisión Nacional de Valores (CNV / National
  Securities Commission) and published in the Boletín Oficial on
  2024-03-25. The resolution establishes the Registro de
  Proveedores de Servicios de Activos Virtuales (PSAV / VASP
  Registry), implementing Ley 27.739 — the AML modernisation law
  that amended Ley 25.246 and introduced the PSAV figure into
  Argentine financial-supervision law. PSAVs (exchanges,
  custodians, transfer providers, virtual-asset-related financial-
  service providers) must register before commencing operations;
  failure to register triggers a ban on operating in Argentina.
  The registry is closed to applicants resident, domiciled, or
  incorporated in FATF non-cooperative / high-risk jurisdictions
  or non-cooperative tax-transparency jurisdictions. Authored at
  status=draft pending human audit of (i) Boletín Oficial URL
  reachability and Wayback snapshot pinning, (ii) the Digital
  Policy Alert and Marval contextual anchors, and (iii) any
  exchange-side evidence of Argentina-resident cutoff that may
  exist in contemporaneous press coverage but was not located in
  this authoring pass.

  Codebook rule applied (§5.1): trigger.type=regulatory_enforcement
  per the 2026-05-17 codebook entry for "Non-US national regulator
  administrative enforcement". The CNV is a non-US national
  regulator (not a payment-rail blocker, not a court) and RG
  994/2024 is an administrative resolution under Ley 27.739, so
  regulatory_enforcement is the canonical fit.
  research_stratum=S4_nation_state per §5.2 stratum-actor map.

  Why comparable_main_2017_present tier: 2024-03-25 is in the
  2017+ comparable-analysis corpus window per sampling/frame.yaml.
  analysis_use=comparable_analysis (canonical form per codebook
  §6).

  Why null_case / null_event: the offramp_cex observation is
  observation_kind=observed_no_change with attribution=none. No
  observed_change layer carries strong attribution (direct or
  plausible). Per codebook §3, 0 observed_change layers →
  empirical_shape=null_event; per codebook §4, 0 strong-
  attribution observed_change layers → admission_tier=null_case.
  The resolution clearly carries direct-attribution force on the
  PSAV class as a registration prerequisite, but the cascade
  surface in the available public record is class-level: the
  dominant Argentine-market actors (Binance, Bitso, Lemon, Ripio,
  Belo, Buenbit) entered the PSAV registration pipeline rather
  than exiting Argentina, and no exchange-side Argentina-resident
  cutoff is documented in the 90-day window following the
  2024-03-25 publication date.

  Why L0/L1/L3/L4/asset_onchain are not_applicable: the CNV
  resolution is a class-level registration prerequisite under Ley
  27.739; it does not direct network-layer blocking, L4 frontend
  changes, or engage any L1/L3 PBS measurement primitive or any
  asset-issuer admin path. not_applicable treatment matches the
  sibling Argentina UIF 300/2014 and FATF R15 2019 patterns.

  Lineage: this event is the comparable-tier successor to
  argentina-uif-resolution-300-2014 (the historical-baseline
  Article-20 obliged-entity reporting regime) and the Argentine
  national-competent-authority implementation of the FATF R15
  2019 VASP travel-rule extension (fatf-r15-vasp-travel-rule-2019).
  A subsequent CNV resolution (RG 1058/2025, published 2025-03-14)
  introduced updated PSAV requirements taking effect 2025-12-31
  and is a candidate sibling event for future authoring.

scoped_claim: |
  Resolución General CNV N° 994/2024, published 2024-03-25,
  established the Argentine PSAV (Proveedor de Servicios de
  Activos Virtuales) registration regime under Ley 27.739. The
  cascade surface is class-level on PSAVs operating in or into
  Argentina; no exchange-side Argentina-resident cutoff is
  documented in this authoring pass, so offramp_cex carries an
  observation_kind=observed_no_change row with attribution=none.

scoped_knowledge: |
  This event is the Argentine national-competent-authority
  implementation of the FATF R15 2019 VASP travel-rule extension,
  arriving ~5 years after FATF R15 and ~10 years after the
  earliest Argentine AML-pipeline capture of virtual-currency
  operations (Resolución UIF 300/2014). The mechanism is class-
  level registration prerequisite rather than prohibition or
  banking-rail severance: PSAVs must register with the CNV before
  operating, with failure to register triggering an operating
  ban, and the registry is closed to applicants from FATF non-
  cooperative jurisdictions. This is the FATF-aligned dominant
  global pattern of post-2019 VASP regulation. The cascade surface
  in the 90-day post-publication window is class-level on PSAVs
  rather than exchange-specific: the dominant Argentine-market
  actors entered the registration pipeline rather than exiting,
  consistent with a registry-style compliance instrument rather
  than a prohibition. The 2025 supersession by RG 1058/2025
  (effective 2025-12-31) is a candidate sibling event for future
  authoring.

