analysis_notes: |
  **REJECTED 2026-05-21** (c) Batch C-2 audit event 19/22 by
  human:xiangwen. Retraction rationale: SEC Wells notice is a
  pre-enforcement signal (preliminary determination to recommend
  enforcement), not an enforcement event itself. Same Option A
  pattern as sec-v-uniswap-wells (Block D) and
  fbi-bitcoin-intelligence-assessment-2012-04 (C-2 event 7):
  pre-enforcement signals / leaked intel documents are not coded as
  standalone corpus events.

  The substantive SEC enforcement against Coinbase lives in the
  sibling event sec-v-coinbase-2023 (full civil suit filed
  2023-06-06). This Wells-notice precursor is retracted to avoid
  double-counting the same enforcement arc. The comparator value
  framed in the original draft (denominator control vs. Kraken
  same-day shutdown) can be inferred from sec-v-coinbase-2023 +
  kraken-sec-staking-2023 directly without a separate Wells-notice
  row.

  Coinbase Form 8-K Wayback memento 20230322224201 captured
  2026-05-21 with replayable body_hash and retained on the
  rejection-anchor observation for cross-reference.

  Original draft analysis follows for reference:

  **NEW EVENT AUTHORED — DRYRUN 2026-05-17**

  Precursor row to sec-v-coinbase-2023 (full SEC civil suit filed 2023-06-06)
  and comparator to kraken-sec-staking-2023 (SEC staking settlement
  2023-02-09 with same-day U.S. staking shutdown). This file captures the
  intermediate SEC Wells notice issued to Coinbase on 2023-03-22 that
  specifically named the Coinbase Earn staking service among the targeted
  product lines.

  Empirical shape per codebook §3: zero `observed_change` layers → null_event.
  Admission tier per §4: zero strong-attribution `observed_change` layers →
  null_case. The one retained observation is `observed_no_change` with
  attribution=`none` (codebook §1.1 — `none` is reserved for
  `observed_no_change` and `coverage_gap` rows). The user-facing framing of
  "staking-product threat with plausible attribution" describes the
  threat-exposure relationship (the Wells notice names Coinbase + staking
  explicitly, and Coinbase publicly cites the Wells notice in its response);
  the observation-row attribution must remain `none` because the row records
  the absence of a service change, not a service change.

  offramp_cex coverage is `partially_measured` rather than `measured`: the
  Coinbase Form 8-K anchors platform-side intent + service continuation at
  filing-time, and the sibling sec-v-coinbase-2023 file confirms Coinbase
  Earn was still operative at the June 2023 SEC complaint date, but the
  file does not pin a per-day product-page diff across the full
  2023-03-22 → 2023-06-06 window.

  Comparator value: alongside kraken-sec-staking-2023 (direct same-day U.S.
  staking shutdown after SEC settlement) and sec-v-coinbase-2023
  (state-scoped staking restriction in CA/NJ/SC/WI after the June 2023
  filing), this Wells-notice row supplies a null-case denominator data
  point for SEC staking enforcement against a U.S. exchange that did NOT
  result in a same-day service-level reaction. The contrast between
  Kraken (settled, shut down) and Coinbase (litigated, kept staking) is
  the empirical content this row preserves for cross-event comparison.

  For a real release, replace the Wayback URL stubs with verified captures
  + body_hash / body_path artifacts via scripts/capture_http_artifact.py,
  and flip origin to `human_reviewed` after human audit.

scoped_claim: |
  "The 2023-03-22 SEC Wells notice to Coinbase explicitly named the staking
  service (Coinbase Earn), but Coinbase did not discontinue staking in
  response; the dataset records this as a null SEC-staking-enforcement
  comparator to Kraken 2023-02-09 (shutdown) and as a precursor to the
  June 2023 Coinbase suit."

