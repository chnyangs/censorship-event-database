      evidence_use: contextual_unarchived
      note: |
        CoinDesk (2023-03-22) reports the Wells notice was issued the prior day
        and corroborates that Coinbase Earn (staking) is among the named
        products. Coinbase Chief Legal Officer Paul Grewal publicly responded
        that Coinbase's services "are fundamentally different and are not
        securities."
    - type: supporting_journalism
      url: https://decrypt.co/124262/sec-wells-notice-coinbase-enforcement-over-staking-products
