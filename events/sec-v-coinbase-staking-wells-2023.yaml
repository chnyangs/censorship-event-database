      note: |
        Coinbase Form 8-K filed 2023-03-22 disclosing receipt of a Wells notice
        from SEC Enforcement staff. The notice provides a preliminary
        determination to recommend an enforcement action alleging violations of
        federal securities laws relating to "aspects of the Company's exchange,
        its staking service Coinbase Earn, Coinbase Prime and Coinbase Wallet."
        Coinbase explicitly named staking among the targeted product lines.
        Wayback URL is a DRYRUN stub for the 2026-05-17 authoring date; human
        reviewer must re-capture before promotion.
    - type: supporting_journalism
      url: https://www.coindesk.com/policy/2023/03/22/sec-warns-coinbase-its-pursuing-enforcement-action-over-securities-violations
