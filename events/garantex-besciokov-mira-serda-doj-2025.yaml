analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: event passed bulk
  adversarial-verify clean (no VERIFY-FLAG) AND strict admission validation — captured primary/
  semi-primary sources meet the §1.6/threshold floor; origin agent_draft -> human_reviewed).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission). On 2025-03-07 the DOJ (E.D. Va.)
  unsealed a three-count indictment charging Garantex administrators Aleksej
  Besciokov (money laundering conspiracy + IEEPA + unlicensed money transmitting)
  and Aleksandr Mira Serda (money laundering conspiracy); concurrently the U.S.
  Secret Service seized Garantex's online infrastructure incl. three domains
  (Garantex.org, Garantex.io, Garantex.academy) and froze >$26M. Garantex is a
  legitimate-form centralized exchange (processed ~$96B since 2019), so the
  takedown of its operational infrastructure is IN scope under §9 (federal
  enforcement that seizes/shuts a legitimate operating platform; sibling to
  Bitzlato 2023 and Liberty Reserve 2013) — NOT a §9-excluded scam prosecution.
  Two observed_change layers: l4_frontend (domain seizure, attribution=direct,
  the Secret Service seized the named domains) and offramp_cex (operational
  disruption, attribution=direct, the named coordinated state action) ->
  empirical_shape comparison, admission_tier anchor_case (§4: 2 direct
  observed_change layers). asset_onchain set not_applicable per codebook §1.6:
  the release describes a >$26M freeze but lists NO on-chain addresses or
  tx_hashes (grep-confirmed absent), so the on-chain evidence floor is
  structurally unmet from this source — the freeze effect is not asserted as a
  distinct asset_onchain row, and no wallet address is fabricated. Corpus
  already holds garantex-ofac-2022 (S1 OFAC SDN) and grinex-garantex-successor-
  ofac-2025 (S1, the successor); this is the distinct 2025-03 DOJ/Secret Service
  criminal indictment + domain-seizure action, not a dup of either OFAC event.
  Sources verified via WebSearch 2026-05-31; real DOJ OPA page captured +
  body_hash-pinned (Besciokov / Mira Serda / three domains / $26M / Secret
  Service / EDVA / IEEPA / $96B grep-confirmed; no fabrication).

scoped_claim: |
  "The 2025-03-07 coordinated U.S. takedown of Garantex (DOJ E.D. Va.
  indictment of administrators Besciokov and Mira Serda for money laundering
  conspiracy / IEEPA / unlicensed money transmitting + U.S. Secret Service
  seizure of three domains Garantex.org/.io/.academy + >$26M fund freeze)
  produced a 2-layer cascade: l4_frontend (domain seizure) and offramp_cex
  (exchange operational disruption), both attribution=direct. No asset_onchain
  row is asserted (release lists no on-chain addresses/tx_hashes; §1.6 floor
  unmet). Comparable-main tier."

scoped_knowledge: |
  What changed: this row records the 2025-03-07 DOJ / Secret Service
  disruption of Garantex as a two-layer anchor case. Retained changed layers
  are L4 frontend (three Garantex domains seized) and offramp_cex (the named
  centralized exchange operation disrupted by indictment, infrastructure
  seizure, and frozen funds), both sourced to the DOJ OPA release.

  What did not change or could not be measured: L0 network, L1 consensus, and
  L3 RPC are not applicable to the centralized exchange takedown. No
  asset_onchain row is asserted because the captured DOJ release reports a
  funds freeze but does not list on-chain addresses or transaction hashes; per
  codebook §1.6, no on-chain freeze is coded without a real primary_onchain
  tx_hash.

  Attribution: L4 and offramp_cex are direct because the primary legal source
  names the state actors, the target exchange, the three seized domains, the
  indictment, and the operational disruption mechanism.

  Comparative value: this is the S3 federal-enforcement anchor that links the
  Garantex lineage to earlier Bitzlato / Liberty Reserve style exchange
  takedowns and to the later Garantex-successor rows. It is distinct from
  garantex-ofac-2022 and grinex-garantex-successor-ofac-2025, which are
  separate OFAC / successor-designation events.

