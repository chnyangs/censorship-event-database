  comparison shape: 1 observed_change layer (offramp_cex). L0/L1/L3/L4/
  asset_onchain are all not_applicable because the SDNY preliminary
  injunction did not alter ISP-level reachability of telegram.org or
  ton.org, the TON mainnet never publicly launched (so the L1/L3 and
  asset_onchain primitives this dataset measures had no live surface
  on TON during the injunction window), and the order did not require
  frontend takedown. The single load-bearing observation is the
  issuer-compelled cancellation of the Gram distribution and the TON
  mainnet launch, attribution=direct via the 2020-03-24 SDNY
  injunction and the 2020-05-12 Telegram termination post.

  Structural significance: SEC v. Telegram Group Inc. (No. 19-cv-9439,
  SDNY, Judge P. Kevin Castel) is the landmark SAFT-framework
  decision in U.S. crypto-securities enforcement. Telegram argued the
  Simple Agreement for Future Tokens sale to accredited investors and
  the later token delivery were legally distinct transactions — the
  SAFT-being-a-security-but-the-token-not architecture promoted by
  practitioners following the 2017 ICO wave. Judge Castel rejected
  that severance under a Gary Plastic resale-analysis reading of
  Howey: the initial purchasers were treated as statutory underwriters
  whose contemplated resales into a public market collapsed the
  primary and secondary transactions into a single unregistered
  public offering of securities. This precedent reshaped the SAFT
  fundraising template and is regularly cited in subsequent SEC
  unregistered-token cases (and forms part of the legal background
  for related-event rows including sec-v-coinbase-2023 and
  blockfi-sec-lending-2022).

  The measurable observation is intentionally narrow: an issuer-level
  cancellation of a planned token distribution + the foreclosed
  public-CEX listing cascade. Gram never launched on public CEXs,
  not because exchanges delisted it, but because the issuer-side
  distribution itself was injunction-triggered cancelled. This is
  why offramp_cex is the load-bearing layer rather than a stub L4
  takedown or a token-delisting claim. The dataset does not assert
  ISP-level blocking of telegram.org / ton.org, a frontend takedown,
  on-chain admin-method engagement (Gram had no live such primitive),
  or specific secondary-market delisting actions by named CEXs (none
  occurred because there was no token to list).

  Pairs with cftc-v-ooki-dao-2022 (legal-personhood / DAO-as-target
  enforcement at the modern endpoint of U.S. crypto-civil-action
  reach) and sec-v-coinbase-2023 (entity-level unregistered-
  securities theory against an operating exchange). All three are
  S3 securities/derivatives civil actions where the load-bearing
  observation is an operator-state or issuer-state change rather
  than a chain-level filter.

scoped_claim: |
  "The 2020-03-24 SDNY preliminary injunction in SEC v. Telegram
  Group Inc. (No. 19-cv-9439, Judge Castel) is admitted as a single-
  layer offramp_cex issuer-cancellation row: Telegram's 2020-05-12
  termination of the TON project and the foreclosed Gram public-CEX
  listing cascade. The row does not claim ISP-level blocking of
  telegram.org / ton.org, a frontend takedown, on-chain admin-method
  engagement, or specific named-CEX delisting actions, because the
  Gram token never reached public distribution."

scoped_knowledge: |
  What changed: Telegram terminated the TON project on 2020-05-12
  citing the SDNY preliminary injunction as the operative reason; the
  planned Gram distribution to 175 initial purchasers and the
  contemplated public-CEX listing cascade were foreclosed at the
  issuer level. The observable cascade is an issuer-state-change
  event rather than a downstream exchange-listing change, because
  the listing layer never came into being.

  What did not change or could not be measured: telegram.org and
  ton.org remained reachable at the ISP layer; the SEC action did not
  engage a frontend-takedown remedy; no live TON L1 consensus or
  public RPC surface existed to measure during the injunction window;
  Gram had no live issuer-side blacklist / freeze admin primitive on
  a public chain because the token never launched. The dataset
  therefore declines to retain L0/L1/L3/L4/asset_onchain observations
  for this event.

  Attribution: direct to the SDNY preliminary injunction and the
  Telegram founder's 2020-05-12 termination post, which cites the
  injunction as the operative reason for cancellation. This is one
  of the strongest direct-attribution links available in the S3
  securities-enforcement corpus because the issuer's own public
  statement names the federal-court order as the cancellation
  driver.

