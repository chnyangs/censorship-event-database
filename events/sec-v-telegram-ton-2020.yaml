  - layer: asset_onchain
    status: not_applicable
    note: |
      Gram had no issuer-side blacklist / freeze admin method that
      ever became operational on a public chain — the token never
      launched. The dataset's asset_onchain primitive measures live
      issuer-controlled admin actions (e.g. Circle USDC blacklist
      additions); there is no analogous Gram primitive to retain.
