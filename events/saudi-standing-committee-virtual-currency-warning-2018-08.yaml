analysis_notes: |
  **NEW EVENT AUTHORED -- AGENT_DRAFT 2026-05-31**. Created from the P4
  census-gap queue after official-source verification. The event remains
  `status=draft` and `origin=agent_draft`; automation must not promote it to an
  admitted paper row without human admission review.

  Inclusion rationale: the candidate pool framed this as a Saudi "illegal
  crypto" event. The official SAMA-hosted Arabic notice supports a narrower
  claim: the inter-agency Standing Committee warned against dealing or investing
  in virtual currencies, stated that virtual currencies are not approved in the
  Kingdom, rejected claims that promoters were Saudi-licensed, stated that
  virtual currencies are not traded through licensed persons in Saudi Arabia,
  and described committee coordination to reduce unauthorized forex and
  virtual-currency marketing/trading.

  Conservative modeling: this is not coded as a hard nation-state block. This
  pass did not find a replayable official order or platform artifact showing a
  specific exchange shutdown, bank-rail cutoff, frontend geofence, app removal,
  or on-chain action. The row is therefore a comparable-period S4 null_case: it
  preserves the official warning / no-licensed-persons denominator while
  avoiding overclaiming a downstream censorship action.

  Source note: the SAMA English path indexed by secondary reports now returns a
  site not-found page, while the Arabic SAMA page remains live. The Python
  capture script timed out against SAMA, so the Arabic HTML body was captured
  manually with curl using HTTP/1.1 and TLS 1.2, then hashed locally. The Arab
  News AMP page was captured with the repo capture script using a browser user
  agent after the default agent received HTTP 403.

scoped_claim: |
  On 2018-08-12, Saudi Arabia's inter-agency Standing Committee for Awareness
  and Warning against Unauthorized Securities Activities in the Foreign Exchange
  Market issued a SAMA-hosted warning that virtual currencies including Bitcoin
  were not approved in the Kingdom, that promotional claims of Saudi licensing
  were incorrect, and that virtual currencies were not traded through licensed
  persons in Saudi Arabia. This draft models the item as a class-level S4
  null_case denominator at the off-ramp / regulated-financial-activity surface;
  no specific exchange shutdown, bank cutoff, frontend block, network block, or
  on-chain asset action is claimed.

