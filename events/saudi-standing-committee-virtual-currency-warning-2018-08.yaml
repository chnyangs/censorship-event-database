  citation:
    - type: primary_government
      url: https://www.sama.gov.sa/ar-sa/MediaCenter/News/Pages/news12082018.aspx
      body_hash: sha256:6b399338705800fb0e9e6df4a5ad617b446b13cb200c43a6381379aba3ecb549
      body_path: sources/http_captures/saudi-standing-committee-virtual-currency-warning-2018-08/primary/www.sama.gov.sa__ar-sa-MediaCenter-News-Pages-news12082018.aspx__manual.html
      evidence_use: replayable
      note: |
        Official SAMA-hosted Arabic notice dated 2018-08-12 from the Standing
        Committee for Awareness and Warning against Unauthorized Securities
        Activities in the Foreign Exchange Market. The captured page title and
        body state that virtual digital currencies are not approved inside the
        Kingdom and that dealing in them is risky. The body warns citizens and
        residents against dealing or investing in virtual currencies, including
        Bitcoin as an example; says such activity is outside the Saudi
        regulatory umbrella; says promotional claims of Saudi official licensing
        are incorrect; says virtual currencies are not traded through licensed
        persons in the Kingdom; and says the committee coordinates with relevant
        government bodies to reduce marketing/trading in unauthorized forex
        activity and virtual currencies.
    - type: supporting_journalism
      url: https://www.arabnews.com/node/1355246/amp
      body_hash: sha256:a6b93e20bcbbf585342b403295dc752282974fa6fa251196bdd272cdf11f6f3f
      body_path: sources/http_captures/saudi-standing-committee-virtual-currency-warning-2018-08/supporting/www.arabnews.com__node-1355246-amp__4d758fa528.html
      evidence_use: replayable
      note: |
        Arab News English contemporaneous report, "Virtual currencies not
        approved in Saudi Arabia, government committee warns." The captured AMP
        page corroborates the committee composition and summarizes the warning
        that transactions and investments using virtual currencies are outside
        the Saudi monitoring umbrella and that Bitcoin-like virtual currencies
        are not approved in the Kingdom. Used for English-language
        corroboration, not as the load-bearing primary anchor.
  timestamp_sources:
    - type: primary_government
      note: |
