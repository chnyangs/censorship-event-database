scoped_knowledge: |
  What changed: the MetaMask Extension stable channel (v11.0)
  shipped a Snaps directory gated by a corporate-policy allowlist
  (npm package name + version + content checksum). Installation of
  third-party Snaps on the stable channel is restricted to the
  allowlist; per-Snap regional restrictions (where a Snap's own
  developer or the MetaMask audit gate declines availability in
  certain jurisdictions) surface through the same L4 directory
  filter. Snap-internal RPC endpoints (especially the non-EVM-chain
  Snaps that bundle their own chain RPC clients) inherit the L4
  allowlist gating at L3 indirectly.

  What did not change or could not be measured: L0 network is not
  applicable (the launch is a wallet-extension software-layer event,
  not ISP-level blocking); L1 consensus is not applicable (the Snaps
  platform does not engage PBS / relay / builder block-production
  censorship); asset_onchain and offramp_cex are not applicable.
  L3 is partially_measured (the L4-to-L3 propagation is inferential
  via the curation model documented in the primary-corporate blog
  posts rather than per-Snap RPC-cutover announcements); L4 is
  partially_measured (the primary-corporate blog posts pin the
  curation mechanism at calendar-folder Wayback granularity and the
  per-Snap regional restriction enumeration at directory launch is
  not exhaustively captured by replayable artifact).

  Attribution: L4 observation is observed_change with attribution=
  direct per codebook §1.4 — ConsenSys / MetaMask publicly cite the
  trigger (the corporate decision to launch behind an allowlist) in
  the launch blog post and the filter is implemented at launch
  (compliance window = 0 days). L3 observation is observed_change
  with attribution=plausible — the propagation from L4 directory
  gate to L3 Snap-internal RPC endpoint availability is inferential
  rather than the subject of a per-Snap public RPC-blocking
  announcement.

  Comparative value: extends the ConsenSys / MetaMask / Infura
  L3-L4 corporate-policy cascade-shape series into the wallet-
  extension substrate. The 2022 sibling triad anchors three L3 RPC
  cascade shapes from the same operator within ~9 months (IP-geo
  region block, address-set screening, privacy disclosure); this
  2023-09 event anchors the L4 wallet-extension substrate's
  curation-gate cascade. Together the four events illustrate the
  composability of the L3-L4 corporate-policy choke points in a
  single operator stack.

  DRYRUN risk: the five citations are unarchived at pinned-snapshot
  granularity. Before paper release the human-audit pass must pin
  Wayback snapshots and body_hashes for both MetaMask blog posts,
  the GitHub Discussion #1411, and the The Crypto Times / Bitcoinist
  permalinks. The per-Snap regional restriction enumeration at
  directory launch should be reconstructed from the MetaMask Snaps
  directory's 2023-09 wayback captures during the human-audit pass.

