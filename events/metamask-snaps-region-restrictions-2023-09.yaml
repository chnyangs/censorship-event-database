analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-5 audit (S5 corporate, misc) by
  human:xiangwen. Both obs (l4_frontend + l3_rpc) anchored on MetaMask Snaps
  official news post (primary_corporate, Wayback 20250320210842, a42fb7b1...)
  + The Crypto Times (semi_primary_wayback, 7cdf704a...). observed_change.
  comparison/empirical_case preserved.

  **NEW EVENT AUTHORED — DRYRUN WAVE 2.3 P2 2026-05-17**. Comparable-
  tier empirical case for the 2023-09-12 MetaMask Snaps open-beta
  launch in the MetaMask Extension stable channel (v11.0). The launch
  ships the Snaps platform behind an allowlist (npm package name +
  version + content checksum) curated through the MetaMask Snaps
  directory; per-Snap regional restrictions (some Snaps unavailable
  in certain jurisdictions per their own developer's geofencing or
  per the MetaMask audit gate) propagate to the wallet user through
  the same L4 directory filter. Authored at status=draft and
  origin=agent_draft pending human audit of pinned Wayback snapshots
  and body_hashes for the two MetaMask blog posts, the GitHub
  Discussion #1411 developer guide, and the contemporaneous The Crypto
  Times / Bitcoinist coverage.

  Codebook rule applied (§5.1): trigger.type=corporate_policy_change.
  The Snaps launch and its allowlist gating are unilateral corporate
  policy decisions by ConsenSys / MetaMask; not an OFAC SDN
  designation, DOJ action, court order, or nation-state block.
  research_stratum=S5_corporate per §5.2 stratum-actor map.

  Why empirical_case / comparison (codebook §3, §4): two
  observed_change layers — L4 frontend (the directory allowlist
  itself, attribution=direct) and L3 RPC (Snap-internal RPC endpoint
  gating propagated through the L4 allowlist, attribution=plausible).
  Per codebook §3, 2 observed_change layers → empirical_shape=
  comparison; per codebook §4, ≥ 1 strong-attribution observed_change
  layer → admission_tier=empirical_case. L4 attribution=direct
  applied per codebook §1.4: the blocking provider (ConsenSys /
  MetaMask) publicly cites the trigger (the corporate decision to
  launch Snaps behind an allowlist) in the launch blog post and the
  filter is implemented at launch (compliance window = 0 days, well
  within the ≤ 7-day publicly-knowable window). L3 attribution=
  plausible because the propagation from L4 directory gate to L3
  Snap-internal-RPC-endpoint availability is inferential — no per-
  Snap public RPC-blocking announcement by ConsenSys / MetaMask
  documents the L3 cutover directly.

  Why analysis_use=comparable_analysis: 2023-09-12 is within the
  2017+ comparable-analysis corpus window. Canonical form per
  codebook §6.

  Why target.kind=entity / enumeration=subset (codebook §7): the
  filter addresses the class of MetaMask wallet end-users on the
  stable channel attempting to install third-party Snaps from the
  MetaMask Snaps directory; the directory at launch enumerated 30+
  audited Snaps rather than the complete future Snap population, and
  per-Snap regional restrictions are surfaced per-Snap rather than
  as a single enumerable wallet-user cohort. enumeration=subset with
  class-level rationale in enumeration_note per codebook §7.

  Why jurisdiction=corporate_global: ConsenSys is a US-incorporated
  entity but the Snaps directory and its allowlist apply globally to
  all MetaMask Extension stable-channel users; per-Snap regional
  restrictions are decided per-Snap (some by Snap developers, some
  by MetaMask audit gate) rather than by a single sanctions-
  jurisdiction trigger. jurisdiction=[corporate_global] reflects the
  global user-class scope without a sanctions-jurisdiction anchor.
  Sibling events with US-sanctions triggers (infura-metamask-
  donetsk-luhansk-block-2022-03; infura-alchemy-tornado-rpc-block-
  2022) carry US in jurisdiction because they are driven by US
  sanctions triggers; this event is not.

  Comparative value: this event extends the ConsenSys / MetaMask /
  Infura L3-L4 corporate-policy cascade-shape series into the
  wallet-extension-platform substrate. The 2022 sibling triad
  (infura-metamask-donetsk-luhansk-block-2022-03, infura-alchemy-
  tornado-rpc-block-2022, consensys-metamask-infura-rpc-data-
  collection-2022-11) anchors the L3 RPC substrate's three cascade
  shapes (IP-geo region block, address-set screening, privacy
  disclosure). This 2023-09 event anchors the L4 wallet-extension
  substrate's curation-gate cascade: a corporate-policy allowlist
  at the wallet-frontend layer becomes the surface through which
  per-Snap regional / jurisdictional restrictions reach the wallet
  user. The pattern surfaces the wallet-extension layer as a
  governance choke point distinct from (but composed with) the L3
  RPC substrate already documented in the 2022 siblings.

  DRYRUN caveats: the five citations all carry 2023-calendar-folder
  Wayback pointers rather than pinned snapshots; pinned snapshot
  timestamps and body_hash captures are deferred to the human-audit
  pass. For non-DRYRUN release, capture body_hash + body_path for:
  (1) the MetaMask "Snaps in MetaMask Stable" blog post (2023-09-12);
  (2) the MetaMask "Our first step on the road to becoming fully
  permissionless" blog post; (3) the MetaMask/snaps GitHub
  Discussion #1411; (4) the The Crypto Times and Bitcoinist
  permalinks. Marked evidence_use=contextual_unarchived on all
  citations to flag the unarchived state per validator policy.

