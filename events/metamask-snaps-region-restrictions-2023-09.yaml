      not_applicable on construct-not-engaged grounds.
  - layer: l3_rpc
    status: partially_measured
    chain: ethereum
    provider_scope: public_and_enterprise
    note: |
      Snaps frequently bundle their own RPC endpoints (e.g., a
      non-EVM-chain Snap will ship its own chain RPC client). The
      MetaMask allowlist is the corporate gate through which those
      Snap-internal RPC integrations reach the wallet user; per-Snap
      regional availability filters propagate to the L3 substrate
      indirectly via the L4 directory gate. Coverage is
      partially_measured because the primary-corporate blog posts and
      developer documentation enumerate the curation model at
      calendar-folder Wayback granularity (pending body_hash on human
      audit); no behavioral L3 cascade is independently measured.
  - layer: l4_frontend
    status: partially_measured
    note: |
      L4 is the load-bearing layer for this event. The MetaMask
      wallet extension UI (v11.0+) ships the Snaps directory with an
      allowlist filter: a Snap that is not on the npm-package +
      version + checksum allowlist cannot be installed from the
      stable channel. Per-Snap regional restrictions (where a Snap's
      own developer or the MetaMask audit gate declines availability
      in specific jurisdictions) are surfaced through the same L4
      directory gate. Coverage is partially_measured because the
      primary-corporate blog posts and the Snaps Discussion #1411
      developer guide pin the curation mechanism at calendar-folder
      Wayback granularity; the per-Snap regional restriction
      enumeration at directory launch is not exhaustively captured
      by replayable artifact.
  - layer: asset_onchain
    status: not_applicable
    note: |
      No issuer-level stablecoin freeze or on-chain asset action is
      invoked by a wallet-extension extension-platform launch.
  - layer: offramp_cex
    status: not_applicable
    note: |
      The Snaps platform launch addresses wallet-extension feature
      curation and does not engage CEX off-ramps.

