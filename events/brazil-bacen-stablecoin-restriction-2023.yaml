analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-4 audit (S4 null_event group) by
  human:xiangwen as null_case. Planalto Decreto 11.563/2023 Wayback
  20230614113250 + Lei 14.478/2022 Wayback 20221222113356 captured
  2026-05-21 with replayable body_hash. asset_onchain observation
  dropped (validator requires primary_onchain) + coverage set
  not_applicable; null_case bookkeeping observation now solely at
  offramp_cex (coverage_gap->observed_no_change). coverage[offramp_cex]
  not_measured->measured. null_event/null_case preserved.

  **NEW EVENT AUTHORED — DRYRUN 2026-05-17**. Comparable-main
  authoring pass for the 2023-06-13 Brazilian federal Decreto
  11.563, the operational follow-on to Lei 14.478/2022 (Brazilian
  Virtual Assets Law) that designates BACEN as the competent
  regulator for VASPs and supplies the legal authority for BACEN's
  subsequent BRL-pegged stablecoin issuance and offshore stablecoin
  trading restrictions. origin=agent_draft and status=draft; human
  re-verification of (i) the Planalto URLs reachability and Wayback
  snapshot pinning, (ii) the BCB normativos register snapshots for
  the implementing resolutions, and (iii) any contemporaneous
  enumerated BRL-stablecoin-issuer or Brazilian-VASP roster
  transition pinned to the 2023-06 trigger window is required
  before this event may be promoted to human_reviewed and admitted.

  Why comparable_main_2017_present tier: 2023-06-13 falls within
  the 2017+ comparable-analysis temporal frame per sampling/frame.
  analysis_use=comparable_analysis is the canonical pairing per
  codebook §6.

  Why empirical_shape=null_event / admission_tier=null_case: this
  event has zero observed_change observations. The decree is a
  framework-level VASP-supervisory perimeter, not an enumerated-
  target enforcement action. Both observation rows are
  observation_kind=coverage_gap with attribution=unknown, which
  does not contribute toward empirical_shape or admission_tier
  (codebook §3, §4). Treated as comparable-tier null-case denominator
  context rather than admission-grade cascade evidence.

  Why trigger.type=regulatory_enforcement: per codebook §5.1
  (2026-05-17 entry), the canonical trigger.type for non-US
  national-regulator administrative actions (excluding ISP/DNS
  network blocks and payment-rail severance directives) is
  regulatory_enforcement. BACEN is a non-US national regulator and
  Decreto 11.563/2023 is an administrative VASP-supervisory
  framework; this is the canonical fit. Per codebook §5.2 the
  permitted research_stratum is S4_nation_state.

  Why target.kind=entity / enumeration=subset: schema target.kind
  enum does not include "regulatory_class"; entity is the closest
  enum for a population-class target. enumeration=subset rather
  than complete because the framework addresses a BACEN-supervised
  VASP class without a fixed roster (codebook §7: class-level
  rationale documented in enumeration_note).

  Why asset_onchain and offramp_cex are not_measured (others not_
  applicable): L0/L1/L3/L4 are scope-mismatch not_applicable (the
  decree is not a network/relay/RPC/frontend directive). The two
  layers the framework plausibly conditions are issuer-side admin
  behavior (asset_onchain, for BRL-pegged stablecoin issuance) and
  off-ramp perimeter (offramp_cex, for offshore stablecoin trading
  accessible from Brazil); both are coded not_measured with a
  coverage_gap observation row because no enumerated counterfactual
  has been pinned at the 2023-06 trigger anchor.

  Cross-temporal context: this 2023-06-13 event is the comparable-
  tier follow-on to the 2014-02-19 BCB Comunicado n° 25.306 (event
  brazil-bcb-comunicado-25306-2014), forming a within-jurisdiction
  longitudinal anchor for the Brazilian central-bank crypto-
  disposition trajectory (2014 risk advisory → 2022 framework
  statute → 2023 BACEN regulatory authority → 2025+ implementing
  resolutions). Subsequent BCB resolutions (e.g., Resolução 520/2025
  and the 2026-02 cross-border eFX restrictions) operate under the
  authority this 2023-06-13 decree grants and may be authored as
  separate downstream events.

