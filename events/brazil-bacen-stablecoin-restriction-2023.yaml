coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      Decreto 11.563/2023 does not direct ISP-level domain blocking
      or DNS interference. The framework grants BACEN administrative
      regulatory authority over VASPs; it is not a network-layer
      block. L0 marked not_applicable consistent with the sibling
      2014 BCB Comunicado treatment.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Decreto 11.563/2023 does not direct PBS-relay or block-builder
      compliance behavior; it is an administrative supervisory
      framework. not_applicable on scope-mismatch grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      Decreto 11.563/2023 does not condition public-RPC operator
      behavior in or accessible from Brazil. not_applicable on
      scope-mismatch grounds.
  - layer: l4_frontend
    status: not_applicable
    note: |
      The 2023-06-13 decree is a VASP-supervisory framework, not a
      directive to take down specific dApp frontends. No Brazilian
      frontends were enumerated targets. not_applicable on scope-
      mismatch grounds.
  - layer: asset_onchain
    status: not_applicable
    note: |
      The BVAL/Decreto 11.563 framework conditions BRL-pegged
      stablecoin issuance on BACEN registration and supervision but
      does not itself engage an on-chain issuer-admin freeze/blacklist
      primitive at the 2023-06-13 trigger; no enumerated issuer admin
      transition exists. not_applicable on construct-not-engaged
      grounds (the null_case bookkeeping observation lives at the
      offramp_cex layer).
  - layer: offramp_cex
    status: measured
    note: |
      The BVAL/Decreto 11.563 framework conditions VASP operation
      (including offshore stablecoin trading accessible from Brazil)
      on BACEN registration and supervision. Plausible off-ramp
      perimeter effects on Brazilian-resident access to offshore
      stablecoin venues, but no enumerated Brazilian-VASP roster
      transition or counterfactual measurement has been pinned at
      the 2023-06-13 trigger anchor. Marked not_measured with a
      coverage_gap observation row below.

