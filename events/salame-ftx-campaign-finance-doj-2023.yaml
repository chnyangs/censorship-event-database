  null_event documenting the 2023-09-07 DOJ SDNY guilty plea by Ryan
  Salame (former co-CEO, FTX Digital Markets) to conspiracy to make
  unlawful political contributions and defraud the FEC, and conspiracy
  to operate an unlicensed money transmitting business. Salame
  admitted using Alameda Research funds (i.e. FTX customer funds
  diverted through Alameda) to make tens of millions of dollars in
  political contributions in his own name from fall 2021 through
  November 2022. Plea agreement included approximately $1.5B
  forfeiture and >$5.5M restitution to FTX debtors. Sentenced
  2024-05-28 to 90 months (7.5 years) imprisonment.

  Coded as empirical_shape=null_event / admission_tier=null_case
  because zero observed_change layers attach to this trigger date in
  the dataset's cross-layer cascade frame. The FTX-collapse cross-layer
  offramp shutdown is load-bearing on the parent
  ftx-bankman-fried-doj-2022 row at the 2022-11-11 Chapter 11 +
  2022-12-13 federal-enforcement trigger; Salame's 2023-09-07 plea is
  a downstream individual-accountability action ~9 months later on an
  already-frozen offramp and produces no new attributable layer-change
  observation. Retained in the corpus as a null_case denominator
  control in the S3 us-federal-enforcement cluster, exposing the
  pattern that individual-defendant pleas downstream of a collapsed
  platform do not themselves engage censorship-substrate primitives.

  Sibling positioning: the load-bearing parent is
  ftx-bankman-fried-doj-2022 (DOJ criminal indictment of
  Bankman-Fried, 2022-12-13, coded with offramp_cex
  observed_change/plausible). Companion same-day civil pillars are
  sec-v-ftx-2022 and cftc-v-ftx-2022. This Salame row joins the
  downstream FTX-individual-plea cluster (the broader cluster also
  includes Ellison, Wang, Singh pleas on separate dates not yet
  authored as standalone rows). All four related_events sit in the
  S3_doj_sec_cftc_fiod stratum.

  Per codebook §3, null_event requires 0 observed_change layers with
  admission-grade attribution; per codebook §4, null_case requires 0
  strong-attribution observed_change layers. Both conditions hold:
  observations list is empty; offramp_cex layer is not_measured with
  no observation row. L0 / L1 / L3 / L4 / asset_onchain are
  not_applicable on substrate-mismatch grounds. The row functions as
  a denominator control demonstrating that downstream-enforcement
  pleas in the FTX cascade do not themselves trigger new
  censorship-layer activity beyond what the parent bankruptcy + federal
  trigger already produced.

