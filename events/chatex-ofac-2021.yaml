analysis_notes: |
  comparison documenting the second OFAC exchange designation. Unlike SUEX
  (2021-09-21) where suex.io remained fully operational post-designation, Chatex's operators
  immediately complied with the OFAC action: they posted a public notice naming the legal
  authority (EO 13694), cancelled an ongoing token sale, and self-imposed a customer-funds
  freeze. This contrast inside the same 2-month window (SUEX vs Chatex) suggests operator
  compliance posture is driven by factors other than the OFAC action itself — possibly the
  presence of EU-resident operators (Chatex: Estonia / Latvia) vs Russia-only (SUEX), or
  differing legal-counsel advice.

  The Chatex L4 change is the cleanest "operator-compliance" mechanism in the dataset: not a
  US-compliance-driven takedown (Tornado), not a law-enforcement seizure (Cryptex), not an
  operator-abandonment (Blender), not a foreign persistence (Sinbad / SUEX). This is a fifth
  distinct L4 mechanism.

  Pre-Merge by 311 days — L1 layer not_applicable. Asset-onchain queries needed for
  promotion.

scoped_claim: |
  "OFAC designation of Chatex on 2021-11-08 produced a direct L4 frontend change within
  9 days in the form of an operator-posted compliance notice freezing customer withdrawals,
  mechanistically distinct from the same-quarter SUEX case (no frontend reaction) despite
  both being foreign exchange entities sanctioned under the same policy push."

