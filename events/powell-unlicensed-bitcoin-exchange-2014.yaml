analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (historical-baseline DOJ MSB
  enforcement row, S3 stratum). Promoted from
  candidate_triggers/powell-unlicensed-bitcoin-exchange-2014.yaml by LLM
  agent following review of the primary DOJ artifact. origin=human_reviewed
  required by validator for status=admitted. Real release must replace this
  DRYRUN marker with an independent human adversarial audit pinning archive
  anchors and confirming the absence of a corporate vehicle / domain /
  customer-list footprint.

  Which Powell: this is **John D. Powell** of Normal, Illinois (McLean
  County) — an individual unlicensed-MSB cash-for-bitcoin operator, NOT
  Kraken's Jesse Powell and NOT the BitFunder operator (who was Jon
  Montroll, prosecuted SDNY 2018). Powell, 55, was charged in USDC CDIL,
  pleaded guilty on 2014-07-31 to two counts of 18 U.S.C. § 1960 (operating
  an unlicensed money service business), and was sentenced 2014-12-04 by
  Chief Judge James E. Shadid to 48 months in federal prison + 3 years
  supervised release. Investigators (IRS-CI + USPIS) found >$3M handled
  over ~18 months ending February 2014. Per the DOJ release, this was the
  first such case prosecuted in the Central District of Illinois.

  comparison shape: 1 observed_change layer (offramp_cex,
  individual-operator termination at sentencing-remand). Structurally
  weaker than peer shrem-faiella-bitcoin-exchange-2014: Shrem had a
  named corporate vehicle (BitInstant) and an identified canonical
  domain (bitinstant.com); Powell operated as an individual without a
  named exchange platform, customer-list footprint, or clearnet surface
  identifiable from the trigger artifact. Attribution is nonetheless
  coded as `direct` on the offramp_cex layer because the DOJ press
  release explicitly names the sentencing-remand to U.S. Marshals
  custody as the operational-termination act, removing any inference
  step between the trigger and the layer change. No L0/L1/L3/L4/
  asset-onchain artifacts attach — the operation had no measurable
  network / consensus / RPC / frontend / on-chain-asset substrate
  beyond the individual operator's MSB activity.

  Historical-baseline anchor for the DOJ MSB-enforcement family in the
  2013–2016 era, structurally complementary to shrem-faiella-bitcoin-
  exchange-2014 (named corporate exchange + individual Silk Road
  vendor co-defendant, SDNY) and silk-road-doj-seizure-2013 (darknet
  marketplace seizure). With nydfs-bitlicense-2015-06 and the later
  btc-e-doj-2017 indictment + domain seizure, these rows establish
  the pre-OFAC-crypto-SDN baseline for individual/corporate MSB
  enforcement cascades. Powell's row is the cleanest individual-
  operator case in the historical-baseline corpus.

scoped_claim: |
  "The 2014-12-04 USDC CDIL sentencing of John D. Powell (48 months for
  two counts of 18 U.S.C. § 1960 operating an unlicensed money service
  business) terminated Powell's individual cash-for-bitcoin MSB off-ramp
  activity, recorded here as a single observed_change at offramp_cex
  with attribution=direct. The row claims only this single-layer
  individual-operator shutdown observation; no L0/L1/L3/L4/asset-onchain
  effects are coded because Powell operated without a named corporate
  vehicle, clearnet domain, or platform footprint identifiable from the
  DOJ trigger artifact."

