analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). Binance blocked Palestinian
  user accounts from transacting pursuant to a November 2023 letter from
  Israel's National Bureau for Counter Terror Financing (NBCTF, signed by
  Paul Landes) that rejected Palestinian users' appeals to restore blocked
  funds, invoking Israeli anti-terrorism law's "temporary seizure of
  property of a declared terrorist organization." Single offramp_cex
  observed_change (state-order account freeze at the exchange);
  comparison shape. attribution=plausible per §1: the blocking action is
  directly reported and Binance confirms blocking accounts, but the order's
  target scope/count is CONTESTED — Binance states only "a small number of
  user accounts, linked to illicit funds" were blocked while Palestinian
  advocates allege a broader sweep — and the captured coverage does not
  reproduce the primary seizure order or an enumerated account list, so a
  conservative attribution and enumeration=subset are retained.
  Jurisdiction coded IL (the ordering authority — Israel's NBCTF); the
  target users are Palestinian but the controlled vocab has no PS code,
  so PS was dropped from the jurisdiction list and the Palestinian-user
  target is documented in target.enumeration_note (NOTE for human
  reviewer: consider adding a PS jurisdiction code to controlled_vocab if
  Palestinian-target cases recur).
  ANTI-FABRICATION NOTE for human reviewer: the candidate lead asserted
  "~220 accounts," but that figure is NOT present in the captured
  cointelegraph page (the only numbers on the page are CSS/menu IDs and a
  "708 total views" counter) — the count is therefore NOT claimed here.
  asset_onchain is not_applicable: no verified primary_onchain freeze
  tx_hash exists, and the action is a Binance-internal custody block, so
  the effect is carried at offramp_cex (codebook §1.6). l0/l1/l3/l4
  not_applicable. Distinct from israel-nbctf-hamas-crypto-addresses-2021
  (the 2021 NBCTF on-chain address seizure) — this 2023 row is the
  Binance exchange-custody account block. Sources verified via WebSearch +
  captured 2026-05-31 (Cointelegraph primary + Skyline advocacy
  corroboration, body_hash-pinned; no fabrication).

scoped_claim: |
  "Binance blocked a contested set of Palestinian user accounts from
  transacting under a November 2023 Israeli NBCTF (Paul Landes) seizure
  order invoking anti-terrorism law; single-layer offramp_cex
