analysis_notes: |
  comparison — earliest crypto-exchange enforcement event in the dataset
  (16 months before the 2018-11-28 Iran-ransomware first OFAC crypto SDN).
  BTC-e indictment + domain seizure under DOJ NDCA + Greek authorities (Vinnik
  arrested in Greece day-of). Pre-PBS, pre-Tether-freeze, pre-OFAC-crypto-SDN
  era; the only cross-layer signal is L4 domain seizure.

scoped_claim: |
  "DOJ NDCA indictment of BTC-e / Alexander Vinnik on 2017-07-26 was accompanied
  by a same-day seizure of the canonical btc-e.com domain, documenting the
  earliest L4 frontend seizure in the dataset and establishing the pre-OFAC
  baseline for crypto-exchange enforcement cross-layer cascade shape."

