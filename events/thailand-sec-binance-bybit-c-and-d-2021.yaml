  Comparison documenting the 2021-07-02 Thailand SEC criminal complaint
  filed against Binance with the Economic Crime Suppression Division
  (ECD) of the Royal Thai Police for operating a digital-asset-
  exchange business in Thailand without a licence in violation of the
  Emergency Decree on Digital Asset Businesses Act B.E. 2561 (2018).
  Bybit is included in the target enumeration under the same TH SEC
  unlicensed-operator enforcement posture for the user-anchored event
  scope; the analogous formal TH SEC criminal complaint against Bybit
  Fintech Limited (operative window 2022-01-25) is recorded as a
  cross-target subset rather than a separate trigger row. Sibling
  cases in the 2021 multi-jurisdictional Binance regulator wave:
  Malaysia SC 2021-07-30 (frontend disable order), Singapore MAS
  2021-09-02 (IAL listing + PSA warning), UK FCA 2021-06-26.

  Codebook rule applied (§5.1): trigger.type=regulatory_enforcement
  per the 2026-05-17 codebook addition for "Non-US national regulator
  administrative enforcement" because the action is a national-
  regulator criminal-complaint enforcement under TH domestic statute
  (Emergency Decree on Digital Asset Businesses Act B.E. 2561) rather
  than a network/payment-rail block. §5.2 stratum-actor map: TH SEC →
  S4_nation_state. §1 attribution: load-bearing observation coded
  plausible (not direct) because the TH SEC criminal complaint does
  not itself mandate a Thai-banking-rail severance; the THB-rail
  constraint cascades through unlicensed-status disclosure and
  operator-side compliance posture rather than a direct banking-
  prohibition directive. §3 empirical_shape=comparison (1
  observed_change layer: offramp_cex). §4 admission_tier=
  empirical_case (≥1 strong-attribution observed_change layer).

  Paper-relevant contrast vs Malaysia SC 2021-07-30 (malaysia-sc-
  binance-disable-2021): Malaysia SC used a harder-edged instrument
  (frontend disable order with a 14-business-day compliance window
  for binance.com + Binance iOS/Android apps for MY users), while TH
  SEC used a criminal-process instrument (complaint filed with the
  Royal Thai Police ECD) without an accompanying frontend-disable
  directive. The MY action has L4-frontend as load-bearing; the TH
  action has offramp_cex as load-bearing (no L4-disable artifact in
  scope here).

  Paper-relevant contrast vs Singapore MAS 2021-09-02 (singapore-mas-
  binance-services-2021): MAS used an IAL listing + PSA warning that
  produced a fast L4-frontend response from Binance (SG-user product
  restrictions within 3 days) and a slow-cascade SGD-rail severance
  through the local Binance entity (binance.sg). TH SEC's criminal
  complaint produced no analogous fast L4-frontend response from
  Binance for Thai users in the 2021-07 window; the offramp_cex
  constraint is the load-bearing axis.

  Paper-relevant contrast vs Thailand BOT 2013 (thailand-bot-bitcoin-
  prohibition-2013): the 2013 BOT instrument was a central-bank
  advisory framing bitcoin as not-a-legal-currency under existing
  FX/payments law (a pre-statute discovery-tier artifact); the 2021
  TH SEC instrument operates under the 2018 Emergency Decree on
  Digital Asset Businesses Act, a statutory licensing regime not
  available in 2013. Cross-period anchor showing the TH regulator
  posture's statutory consolidation between 2013 and 2021.

  Evidence repair 2026-06-01: TH SEC News_Detail SECID=9017
  (Wayback memento 20210702090802) and Coindesk 2021-07-02
  reporting (Wayback memento 20210916230514) are locally captured
  with body_hash/body_path and marked evidence_use=replayable.
  Remaining open evidence debts are narrower: TH SEC 2021-04-05
  warning-letter text, any Binance / Bybit contemporaneous corporate
  THB-rail notices, Bangkok Post 2142503, and TH SEC News_Detail
  SECID=10613 for the later Bybit-specific criminal complaint if the
  cross-target subset is preserved.

