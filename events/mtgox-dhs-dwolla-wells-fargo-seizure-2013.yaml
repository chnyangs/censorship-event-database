analysis_notes: |
  **REPAIRED 2026-06-01** (quality-loop low-observation pass): added a
  replayable scanned primary legal copy of the 2013-05-14 seizure warrant
  from DocumentCloud / IDG News Service. The justice.gov USAO-MD page remains
  contextual only; the warrant PDF is now the claim-usable direct-attribution
  anchor for the Mt. Gox / Mutum Sigillum / Dwolla USD-rail seizure.

  **NEW EVENT AUTHORED - DRYRUN 2026-05-16** (Phase B of 2026-05-16 staged-
  release plan, historical_baseline_2013_2016 tier fill): authored end-to-end
  by LLM agent from sources/historical_baseline_2013_2016/triage_manifest.json.
  The DHS/HSI seizure of the Mutum Sigillum / Wells Fargo / Dwolla account
  (Case 1:13-mc-01162-WMN, D. Md.) was the first major US federal enforcement
  against a bitcoin exchange and the operational predicate for the Mt. Gox
  USD-withdrawal cascade that culminated in the February 2014 Mt. Gox
  bankruptcy. evidence_use=contextual_unarchived across all citations because
  primary-legal body_hash has not been captured into sources/http_captures/ in
  this session; the original 2013 warrant PDF is not exposed via a stable
  justice.gov URL. This caveat is superseded for claim use by the 2026-06-01
  DocumentCloud/S3 warrant capture above.

  comparison shape: 1 observed_change layer (offramp_cex). L0/L1/L3/L4/
  asset_onchain are all not_applicable because mtgox.com remained reachable
  and serving frontend pages, the Bitcoin protocol layers tracked by this
  dataset did not exist in their measured forms in 2013, and the action
  operated on USD held in US bank/payment-processor accounts rather than on
  on-chain BTC. The single load-bearing observation is the USD-on-ramp
  closure at Mt. Gox's US-vantage Dwolla/Wells Fargo rail, attribution=direct
  via the named seizure warrant.

  Historical-baseline placement: this event is the earliest US federal
  fiat-rail enforcement action against a bitcoin exchange in the dataset,
  predating the 2014-01-26 Shrem/Faiella arrests (shrem-faiella-bitcoin-
  exchange-2014), the 2014 Kraken/Powell unlicensed-exchange action, and the
  2017-07-26 BTC-e DOJ indictment by ~4 years. Establishes the pre-OFAC,
  pre-comparable-corpus baseline for fiat-payment-rail-mediated offramp_cex
  enforcement.

scoped_claim: |
  "The 2013-05-14 DHS/HSI seizure of Mt. Gox subsidiary Mutum Sigillum's
  Dwolla account at Veridian Credit Union (paired with the 2013-05-09
  Wells Fargo seizure) closed Mt. Gox's primary USD on-ramp to US customers;
  the row claims only this single-layer offramp_cex fiat-rail closure
  observation and does not assert frontend, network, RPC, or on-chain BTC
  effects. Historical-baseline tier; not used in main statistical
  denominators."

