target:
  kind: entity
  entity: mutum_sigillum_mtgox_dhs_dwolla_seizure_target_2013
  enumeration: subset
  enumeration_note: |
    Mt. Gox US subsidiary Mutum Sigillum LLC, plus its Dwolla account (held in
    custody at Veridian Credit Union) and the predicate Wells Fargo Bank
    account opened 2011-05-20 by Mt. Gox CEO Mark Karpeles. Together these
    constituted Mt. Gox's primary USD on-ramp/off-ramp infrastructure for US
    customers in 2013. No on-chain BTC addresses are enumerated at this event
    level; the action is a fiat-rail account seizure, not a crypto-asset
    freeze.
  actor_type: exchange_subsidiary
  actor_name: Mutum Sigillum LLC (Mt. Gox US subsidiary)
  chains: [bitcoin]
  canonical_domains:
    - mtgox.com

jurisdiction: [US]

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      mtgox.com remained reachable as a website; the 2013-05-14 action was a
      fiat-rail account seizure rather than an ISP-level reachability block.
      Standard public-web L0 instruments (Censored Planet, OONI) do not apply.
  - layer: l1_consensus
    status: not_applicable
    chain: bitcoin
    note: |
      Bitcoin proof-of-work consensus in 2013 has no protocol-level relay-
      filter primitive analogous to the post-Merge Ethereum PBS relay surface.
      not_applicable on construct-did-not-exist grounds.
  - layer: l3_rpc
    status: not_applicable
    chain: bitcoin
    note: |
      The MEV-Boost / Flashbots Protect / MEV-Blocker public-RPC compliance
      substrate that the L3 layer measures did not exist in 2013;
      Flashbots Protect launched 2022-11. not_applicable on
      construct-did-not-exist grounds.
  - layer: l4_frontend
    status: not_applicable
    note: |
      mtgox.com continued to serve trading-platform pages through May 2013;
      no frontend takedown or domain seizure was associated with the
      2013-05-14 fiat-rail action. Frontend-enforcement layer not implicated.
  - layer: asset_onchain
    status: not_applicable
    chain: bitcoin
    note: |
      Bitcoin native asset has no issuer-side blacklist / freeze admin
      method. The seizure operated on USD held in US bank/payment-processor
      accounts, not on-chain BTC. not_applicable on construct-did-not-exist
      grounds.
  - layer: offramp_cex
    status: partially_measured
    scope:
      - mtgox_dwolla_usd_rail
      - mtgox_wells_fargo_usd_rail
    note: |
      USD on-ramp closure via Dwolla account seizure (2013-05-14) and Wells
      Fargo account seizure (2013-05-09 / follow-on 2013-06). Mt. Gox's
      primary US-customer USD-to-BTC pathway was severed by the seizure of
      ~$5M from the named US accounts. partially_measured: contemporaneous
      journalism (TechCrunch + Genesis Block) captured into
      sources/http_captures/mtgox-dhs-dwolla-wells-fargo-seizure-2013/primary/
      with replayable body_hash 2026-05-20; the original 2013 warrant PDF
