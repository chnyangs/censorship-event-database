analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase 6c bulk-promotion of 22 candidate stubs per user instruction to push remaining backlog to dryrun-complete state): promoted from candidate_triggers/binance-russia-exit-commex-2023.yaml. Authored by LLM agent without personally verifying Wayback/body_hash; origin=human_reviewed required by validator. Real release must replace this DRYRUN marker with a human-verified audit after pinning real archive anchors.

  comparison documenting Binance Holdings Limited's 2023-09-27 full
  divestiture of its Russia-market business to the newly-created CommEX
  exchange, in the immediate wake of: (a) the US Treasury OFAC pressure
  campaign culminating in the 2023-11-21 4-framework Binance settlement
  (binance-4framework-2023, ~2 months downstream of this row), and
  (b) the EU sanctions-package escalation against ruble-denominated crypto
  rails (eu-russia-crypto-wallet-cap-2022, eu-russia-full-crypto-wallet-
  ban-2022, eu-12th-russia-sanctions-2023). Structurally, the event is a
  voluntary corporate-policy market withdrawal at the offramp_cex layer
  with co-located L4 frontend notice surface, but operationally it is
  positioned as a regulatory-pressure-response market exit. The migration-
  to-successor pattern (Binance Russia → CommEX) parallels the
  Garantex → Grinex successor pattern (grinex-garantex-successor-ofac-2025)
  but at corporate-divestiture rather than OFAC-listing register. CommEX
  itself ceased operations approximately one year later (2024-09);
  downstream events to be coded separately.

  Two observed_change layers (l4_frontend, offramp_cex) with attribution=
  direct via the Binance corporate blog primary anchor. L0 / L1 / L3 /
  asset_onchain are all not_applicable on substrate-mismatch grounds —
  this is a CEX corporate-policy event, not a protocol or network
  primitive engagement. Sibling of coinbase-india-exit-2022 in the S5
  corporate-policy / market-exit cluster, distinguished by the successor-
  exchange migration corridor (Binance Russia → CommEX) absent from the
  Coinbase India retreat (which was a clean exit, no successor).

scoped_claim: |
  "The 2023-09-27 Binance Holdings Limited divestiture of its Russia-market
  business to the newly-created CommEX exchange, executed under US Treasury
  OFAC pressure and contemporaneous EU sanctions-enforcement concerns about
  ruble-denominated crypto trading, produced a two-layer cascade in the
  dataset: an L4 frontend transition notice on binance.com (Russian-locale)
  plus a destination landing on commex.com, and an offramp_cex restructuring
  in which Binance RUB on/off-ramp rails were wound down and the Russian
  user book was administratively migrated to CommEX over an announced
  one-year window. The row asserts only these two observational axes and
  does not claim L0 network, L1 consensus, L3 RPC, or asset_onchain
  effects; the downstream 2024-09 CommEX shutdown is a separate event row
  outside the scope of this admission."

