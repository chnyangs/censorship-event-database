analysis_notes: |
  **QUALITY-LOOP REPAIR 2026-06-01** (automated source repair; no new
  human-audit stamp). The prior row made a broader two-layer claim using
  Binance live-blog, CommEX landing-page, and PRNewswire wildcard Wayback
  anchors. During repair, the Binance live URL returned a CloudFront/WAF
  challenge with an empty body and the CommEX URL did not resolve locally.
  Those sources are therefore not retained as load-bearing evidence.

  This version narrows the admitted empirical content to the replayable
  Binance-issued PRNewswire release: Binance sold the entirety of its
  Russia business to CommEX, began Russian-user off-boarding and
  redirection, and announced that all exchange services and business lines
  in Russia would be sunset over the following months. The row keeps
  CommEX as the named counterparty and migration destination, but it does
  not claim an independently measured CommEX frontend landing page or
  RUB-specific P2P rail wind-down.

  The broader OFAC/EU sanctions environment remains contextual through
  related_events, but the retained direct-attribution observation is the
  Binance corporate market-exit decision itself, not a claim that OFAC or
  EU sanctions directly ordered this specific sale.

scoped_claim: |
  "The 2023-09-27 Binance Holdings Limited Russia-market divestiture to
  CommEX is retained as a narrowed CEX/off-ramp market-exit observation:
  Binance's own PRNewswire release announced the sale of the entirety of
  its Russia business, up-to-one-year off-boarding for existing Russian
  users, redirection of some Russian KYC'd new-user registration to CommEX,
  and sunset of all Binance exchange services and business lines in Russia
  over the following months. The row does not claim a replayably measured
  Binance/CommEX L4 frontend change, RUB-specific rail shutdown, L0
  network blocking, L1 consensus impact, L3 RPC filtering, or asset-onchain
  freeze."

