      substrate-mismatch grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      No public-RPC provider filter-list change attaches to the corporate
      sale of Binance's Russia business. The L3 substrate (MEV-Boost /
      Flashbots Protect / MEV-Blocker / Infura) is orthogonal to a CEX-level
      market-exit decision. not_applicable on substrate-mismatch grounds.
  - layer: l4_frontend
    status: measured
    scope:
      - binance.com
      - commex.com
    note: |
      Load-bearing layer 1 of 2. Binance Russian-locale frontend surfaces
      (binance.com Russian-language pages, in-account notifications shown to
      Russian-resident users) directly hosted the 2023-09-27 transition
      announcement and the subsequent migration timeline notices through
      the up-to-one-year off-boarding window. CommEX corporate frontend
      (commex.com) served as the migration-destination landing page. This
      is an exchange-driven frontend-layer corporate-policy change rather
      than a state-mandated takedown; attached below as observed_change
      with attribution=direct via the Binance corporate blog post.
  - layer: asset_onchain
    status: not_applicable
    note: |
      The Russia market exit does not engage a stablecoin-issuer freeze or
      OFAC SDN-list address designation primitive. User BUSD / USDT / USDC
      balances migrated administratively to CommEX accounts; no
      issuer-level address blacklist was published. not_applicable on
      substrate-mismatch grounds.
  - layer: offramp_cex
    status: measured
    scope:
      - binance_rub_rails
      - commex_rub_rails
    note: |
      Load-bearing layer 2 of 2. Binance's Russian-ruble (RUB) P2P merchant
      rails and Russian-user fiat on/off-ramps were the operational core of
      the divested business. Post-2023-09-27, Russian users were directed
      to migrate to CommEX-operated rails; Binance's own RUB-denominated
      P2P book was wound down over the announced one-year transition
      window. Attached below as observed_change with attribution=direct.
      The 2024-09 subsequent shutdown of CommEX itself is downstream of
      this event row and is not coded here.

