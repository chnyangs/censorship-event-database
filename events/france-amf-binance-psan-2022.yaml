analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-4 audit (S4 null_event group) by
  human:xiangwen as null_case. AMF white-list entry captured live as
  primary_government (sha256:7151127edae4...; no Wayback memento for AMF
  page). Siecle Digital Wayback 20220505091331 reclassified
  semi_primary_wayback. Permissive regulatory recognition (Binance France
  SAS PSAN registration E2022-037, eff 2022-05-04) - affirmatively
  authorizes, no rail severance. observed_no_change/null_case preserved.

  **NEW EVENT AUTHORED -- DRYRUN 2026-05-17**: 2022-05-04 France AMF
  registration of Binance France SAS as a PSAN (Prestataire de Services
  sur Actifs Numériques) / Digital Asset Service Provider under
  registration number E2022-037. First major Western jurisdiction to
  formally register a Binance entity.

  PERMISSIVE EVENT FRAMING: This row is the CLEANEST counter-example in
  the 2021-2023 Binance EU/UK regulator wave. Where UK-FCA-2021
  (uk-fca-binance-markets-2021) produced a class-wide GBP payment-rail
  severance via FCA consumer warning, and DE-BaFin-2023
  (germany-bafin-binance-licence-withdrawal-2023) produced a regulated-
  market-access withdrawal, the French AMF granted affirmative PSAN
  registration to a Binance entity. The operative direction at
  offramp_cex is permissive (rails opened, not severed).

  null_event RATIONALE per codebook §3: 0 observed_change layers. The
  only observation row is observed_no_change at offramp_cex with
  attribution=none, anchored on the AMF white-list entry as denominator
  artifact. This yields empirical_shape=null_event and admission_tier=
  null_case -- a denominator control / counter-example row for the
  2022-vintage Western-regulator Binance stratum.

  TRIGGER-TYPE CODING per codebook §5.1: trigger.type=regulatory_enforcement
  (non-US national regulator administrative action; AMF is the French
  national-competent-authority for PSAN/DASP under the 2019 Pacte law,
  not a network/payment-rail block). Stratum S4_nation_state per §5.2
  mapping. Note: §5.1 examples emphasize enforcement (orders / restrictions);
  this row uses regulatory_enforcement to capture the permissive companion
  modality (affirmative registration / whitelist admission). Human
  reviewer should confirm this read of §5.1 -- alternative reads might
  warrant a future trigger-type expansion (e.g. regulatory_authorization)
  but the closest current enum value is regulatory_enforcement.

  RELATED EVENTS: uk-fca-binance-markets-2021 (enforcement cascade,
  GBP rail severance), germany-bafin-binance-licence-withdrawal-2023
  (regulated-market-access withdrawal), eu-mica-2023 (supranational
  PSAN/DASP successor framework). Together these four events bracket
  the 2021-2023 European Binance regulator trajectory: FR permissive
  (2022) -> DE restrictive (2023) -> EU harmonization (2023+ MiCA).

  DRYRUN caveats: AMF white-list URL and Siècle Digital press URL are
  asserted with Wayback patterns; body-hash captures deferred. For
  non-DRYRUN release, capture body_hash + body_path for: (1) AMF
  white-list entry for Binance France SAS, (2) Siècle Digital 2022-05-05
  article. Marked evidence_use=contextual_unarchived per validator policy.

scoped_claim: |
  "France AMF granted Binance France SAS a PSAN (Digital Asset Service
  Provider) registration (E2022-037) effective 2022-05-04, authorizing
  four regulated services (custody, fiat purchase/sale, crypto-crypto
  exchange, trading-platform operation). This was the first major
  Western jurisdiction to formally register a Binance entity and serves
  as the permissive counter-example to the UK-FCA-2021 GBP-rail severance
  and DE-BaFin-2023 licence withdrawal in the 2021-2023 Binance EU/UK
  regulator wave. Recorded as a null_event denominator-control row at
  offramp_cex with attribution=none."

