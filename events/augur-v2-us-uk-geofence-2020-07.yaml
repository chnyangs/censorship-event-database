  comparison — S5 voluntary corporate-policy frontend geofence by
  the Forecast Foundation / canonical Augur v2 UI operators
  against US-vantage and UK-vantage users of the canonical
  official UIs (augur.net and predictions.global) at the
  2020-07-28 v2 launch. The Augur v2 on-chain protocol on Ethereum
  remained permissionless. This is the *earliest* large-scale
  DeFi prediction-market frontend-vs-protocol split in the corpus
  and pre-dates Polymarket's January-2022 CFTC-settlement-driven
  US geofence (polymarket-cftc-geofence-2022-01) by ~18 months
  and the 1inch Foundation US-IP frontend geofence of 2021-09-29
  (1inch-us-geofence-2021-09) by ~14 months.

  empirical_shape=comparison (l4_frontend observed_change on
  US-vantage and UK-vantage axes with attribution=plausible;
  other layers not_applicable on construct-not-engaged grounds).
  admission_tier=empirical_case (≥1 strong-attribution
  observed_change layer — plausible counts per codebook §4).

  Codebook decisions applied:
  - §1.4 frontend-block attribution: attribution=plausible because
    the canonical UI operator's public framing of the geofence as
    a CFTC + UK FCA compliance step was not pinnable by the LLM
    agent at authoring time — only the 2018 CFTC binary-options
    posture and the secondary-source claim of US+UK exclusion at
    v2 launch are evidence-grade. Conservative attribution
    default per codebook §8.4.
  - §3 empirical_shape: comparison (2 observed_change layers ≤ 2,
    distinct only on country-vantage axis; same layer).
  - §4 admission_tier: empirical_case.
  - §5 trigger.type: corporate_policy_change (S5_corporate
    research_stratum per §5.2 stratum-actor map).
  - §6 analysis_use: comparable_analysis (canonical form, not
    the rejected alias "comparative_analysis").
  - §7 target.enumeration: subset with enumeration_note
    documenting class-level rationale (no canonical Forecast
    Foundation enumeration of exact domain + exact country set
    pinned).

scoped_claim: |
  "At the 2020-07-28 Augur v2 launch the Forecast Foundation /
  canonical Augur v2 UI operators shipped US-vantage and
  UK-vantage geofences on the canonical official frontends
  (augur.net and predictions.global) — plausibly in response to
  the US CFTC's 2018 binary-options jurisdictional posture on
  Augur contracts and the UK FCA's posture on retail prediction
  markets — while the Augur v2 on-chain protocol on Ethereum
  remained permissionlessly accessible via alternative
  frontends, self-hosted mirrors, and direct contract calls.
  This is the earliest large-scale DeFi prediction-market
  frontend-vs-protocol split in the corpus. attribution=plausible
  because no primary Forecast Foundation document pinning the
  CFTC/FCA concern as the trigger was retrievable at authoring
  time; load-bearing axis is l4_frontend on US-vantage and
  UK-vantage subsets."

