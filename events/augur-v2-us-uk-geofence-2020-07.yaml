analysis_notes: |
  Repair pass 2 recodes this row from a positive empirical_case to a
  draft null_case / coverage_gap. The prior draft asserted that Augur
  v2 shipped US-vantage and UK-vantage canonical-frontend geofences at
  launch. Targeted source discovery located primary Augur artifacts
  from the launch window, including the official client disclaimer and
  Augur UI source-code disclaimer text. Those primary artifacts contain
  generic jurisdictional-compliance warnings but do not enumerate a
  US/UK geofence or provide a vantage-specific access-denial artifact.

  Coding decision: no observed_change remains. The row stays in the
  corpus as a draft source-discovery placeholder so future primary
  evidence can either repair the US/UK geofence claim or retire the row.
  It must not be used as the "earliest DeFi frontend-vs-protocol split"
  claim unless a primary Augur notice, reproducible UI measurement, or
  other admission-grade source is located.

scoped_claim: |
  As of this repair pass, primary Augur launch-window artifacts confirm
  generic jurisdictional-compliance disclaimer language but do not
  confirm the previously drafted US/UK Augur v2 frontend geofence; the
  candidate remains a draft coverage_gap pending primary evidence.

