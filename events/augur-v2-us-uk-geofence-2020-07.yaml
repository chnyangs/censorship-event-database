target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    Class-level target: US-vantage and UK-vantage users of the
    canonical Augur v2 official UIs (augur.net and predictions.global)
    operated by or canonically associated with the Forecast
    Foundation. The Augur v2 smart-contract layer on Ethereum is
    permissionless and remains reachable to US/UK-vantage users via
    self-hosted UI mirrors, alternative third-party frontends, and
    direct contract calls — the restriction is exclusively at the
    canonical-frontend application layer. Enumeration is subset
    because the LLM agent could not pin a primary Forecast
    Foundation document explicitly enumerating the exact frontend
    domains and the exact US+UK country set in the canonical ToS.
  protocol: augur_v2
  actor_type: prediction_market_frontend
  actor_name: Forecast Foundation (canonical UI operator)
  chains: [ethereum]
  canonical_domains:
    - augur.net
    - predictions.global

jurisdiction:
  - US
  - UK

