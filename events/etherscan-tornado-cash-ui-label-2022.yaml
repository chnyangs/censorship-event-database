analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17** Wave 2.3 P2 preamble
  (Phase A.2 corporate_policy discovery): authored by LLM agent
  without personally verifying Wayback/body_hash anchors;
  origin=agent_draft per validator policy. Real release must replace
  this DRYRUN marker with a human-verified audit after pinning real
  archive anchors (especially pre/post Wayback diffs of the
  Tornado Cash contract address pages bracketing 2022-08-08) and
  promote origin to human_reviewed.

  Comparison-shape S5 corporate-policy-change event capturing the
  UI / discovery-layer compliance response by the dominant Ethereum
  block-explorer operator (Etherscan) downstream of the 2022-08-08
  OFAC Tornado Cash SDN designation. Distinct from the in-protocol
  frontend block at tornado.cash (tornado-cash-frontend-tornado-cash-
  eth-block-2022-04, a US-IP-geofence by the Tornado Cash team
  itself) and from the dApp frontend blocks (Aave / Uniswap /
  Balancer); the Etherscan label is a third class of L4 action:
  not gating access, but annotating the address as sanctioned at
  the discovery layer. Paper-relevant because block explorers are
  the primary on-chain-discovery surface for most users, and a
  UI-label compliance action propagates the sanctions signal far
  more broadly than any single dApp frontend block.

  Empirical shape: comparison (1 observed_change layer — L4
  frontend load-bearing). Admission tier: empirical_case (≥1
  observed_change layer with direct attribution). Stratum coding:
  S5_corporate (Etherscan is a private corporate operator; the
  label is an operator-side compliance policy, not a regulatory
  order naming Etherscan). attribution=direct per §1.4 codebook
  rule: the label text itself ("OFAC Blocked" / "OFAC SDN") names
  the trigger class, and the labels were applied within the
  publicly-knowable compliance window post-2022-08-08 OFAC SDN.

  DRYRUN caveats: the three citations all carry 2022-calendar-folder
  Wayback pointers rather than pinned snapshots. For non-DRYRUN
  release, capture body_hash + body_path for: (1) a pre-2022-08-08
  Wayback snapshot of one of the Tornado Cash contract Etherscan
  pages (baseline, no label); (2) a post-2022-08-08 Wayback snapshot
  of the same page showing the "OFAC Blocked" label (transition
  anchor); (3) a current/live snapshot for triangulation; (4) the
  Etherscan Information Center labels documentation. trigger
  timestamp is 2022-08-10 day-precision pending sub-day pinning via
  Wayback diff. delta_hours=0 inside this event reflects that
  the trigger and observation share the same day-precision
  timestamp (2022-08-10); the cross-event lag from the
  2022-08-08 OFAC trigger (~48h) is tracked at the cross-event
  level via related_events linkage to tornado-cash-ofac-2022.
  Marked
  evidence_use=contextual_unarchived on all citations to flag the
  unarchived state per validator policy.

scoped_claim: |
  "Etherscan's circa-2022-08-10 application of 'OFAC Blocked' /
  'OFAC SDN' public nametags on the address-page headers of the
  OFAC-designated Tornado Cash contracts documents a UI / discovery-
  layer corporate-compliance action by the dominant Ethereum block-
  explorer operator downstream of the 2022-08-08 OFAC trigger
  (related event tornado-cash-ofac-2022). Paper-relevant as a
  third class of L4 frontend action — discovery-layer annotation
  rather than access-gating — that propagates the sanctions signal
  to the on-chain-discovery surface used by most users."

