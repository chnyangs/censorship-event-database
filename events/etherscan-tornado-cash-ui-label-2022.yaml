      OFAC-listed addresses. The mechanism is Etherscan's public
      name-tags/labels feature applied operator-side. Attached below
      as observed_change at attribution=direct (Etherscan applied the
      label class-wide referencing the upstream OFAC SDN trigger).
  - layer: asset_onchain
