  - IL

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The trigger is an Israeli administrative seizure order against
      address-level targets, not a nation-state ISP/DNS block. No L0
      network-layer scope applies.
  - layer: l1_consensus
    status: not_applicable
    chain: ethereum
    note: |
      Pre-Merge event (Ethereum Merge was 2022-09-15; ~14 months after
      this trigger). PBS / MEV-Boost relay infrastructure did not exist
      at event time. L1 consensus-layer relay-filter bracketing is
      structurally not_applicable for the Ethereum portion of the
      address set.
  - layer: l3_rpc
    status: not_applicable
    note: |
      Pre-Flashbots-Protect (launched 2022-09) and pre-MEV-Blocker
      (launched 2023-03-27). No L3 RPC-provider compliance substrate
      with per-address filter lists is operational at event time.
  - layer: l4_frontend
    status: not_applicable
    note: |
      No operator-controlled UI surface is the target of the order;
      the seizure order acts directly on address-level custody claims
      via Israeli administrative law, not on a frontend.
  - layer: asset_onchain
    status: not_applicable
    note: |
      Not classified as an observed-change layer at admission. BTC
      holdings cannot be protocol-frozen, and no pinnable issuer-level
      (Tether destroyBlackFunds/addBlackList) or forfeiture transaction
      hash against the 84-address NBCTF roster was verifiable at audit
      time. The enforceable censorship effect is therefore classified at
      offramp_cex (exchange/issuer freezes of deposit clusters) rather
      than asserted on-chain. The seized address roster remains
      documented in target.enumeration_note for a future on-chain
      authoring pass.
  - layer: offramp_cex
    status: measured
    provider_scope: unknown
    note: |
      Load-bearing layer (2 of 2). Contemporaneous Chainalysis
      reporting traces consolidation flows into deposit addresses at
      a major mainstream exchange (unnamed in the public blog but
      widely understood to be Binance per later 2022/2023 follow-on
      Israeli police-Binance account seizures referenced in DL News
      coverage). The NBCTF order's effect at the offramp_cex layer is
      to compel CEX freezes/forfeitures of deposit addresses fed by
      the named cluster. partially_measured rather than measured
      because per-CEX KYT / deposit-cluster-flagging slices
      (Chainalysis Reactor, TRM, Elliptic per-event report screenshots)
      are not pinned at draft time. DRYRUN.

