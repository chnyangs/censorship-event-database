  Comparison-shape S4 regulatory_enforcement event sibling to the
  post-October-7 OFAC Hamas cascade (ofac-hamas-buy-cash-msb-2023-10,
  ofac-hamas-irgc-virtual-currency-network-2024-01,
  ofac-hamas-gaza-now-2024-03). Paper-relevant because this is the
  **first documented nation-state administrative seizure order
  against a terrorism-financing crypto-address cluster**, predating
  the post-October-7 OFAC Hamas cluster by ~2.3 years and establishing
  the Israeli-domestic template (NBCTF + Section 66 Anti-Terrorism
  Law 2016) that the 2022 Gantz 30-wallet expansion and the 2023-10
  Israeli police Binance-account seizures inherit from.

  Codebook compliance: trigger.type=regulatory_enforcement under
  §5.1 (non-US national regulator administrative enforcement, not a
  network/payment-rail block — NBCTF is the MoD's counter-terror-
  financing arm, structurally analogous to JP FSA business
  improvement orders); research_stratum=S4_nation_state per §5.2.
  analysis_use=comparable_analysis (2021 → comparable_main_2017_
  present temporal tier). empirical_shape=comparison (2 observed_
  change layers: asset_onchain at direct, offramp_cex at plausible).
  admission_tier=empirical_case (≥1 strong-attribution observed_
  change layer). Attribution coding per §1.2: asset_onchain=direct
  because the seizure order itself names the addresses (the action
  IS the censorship); offramp_cex=plausible because the downstream
  CEX is not publicly named in the order and the immediate CEX
  compliance response was not tied to the trigger in a public
  statement at event time.

  Distinguishing features vs. siblings: (a) trigger jurisdiction is
  IL (not US) — this is the precedent-setting non-US nation-state
  action against the Hamas crypto-funding pipeline; (b) trigger
  authority is administrative (Section 66 Anti-Terrorism Law 2016)
  rather than SDN-list-driven, exercising a domestic-Israeli legal
  mechanism distinct from US OFAC SDN secondary-sanctions exposure;
  (c) the target is a 84-address direct enumeration (vs. the entity-
  level Buy Cash MSB designation in ofac-hamas-buy-cash-msb-2023-10);
  (d) pre-Merge / pre-Flashbots-Protect / pre-MEV-Blocker timing
  means L1/L3 compliance substrates are structurally not_applicable
  rather than not_measured.

  Follow-up directions (post-admission): (1) human-audit pinning of
  the underlying Hebrew-language NBCTF gazette publication of the
  Administrative Seizure Order (currently anchored only via English-
  language secondary coverage); (2) full enumeration of the 84-
  address roster from the order itself, with per-address Etherscan
  + Tronscan freeze-tx anchors and a usdtbanlist.com sweep against
  Tether; (3) per-CEX KYT-flagging anchors for the downstream
  mainstream-exchange leg (Chainalysis Reactor, TRM, Elliptic per-
  event report slices); (4) 2022 Gantz 30-wallet expansion as a
  candidate sibling event for the IL-NBCTF cluster timeline.

