analysis_notes: |
  **SOURCE-STRENGTHENED 2026-06-01** (quality-loop primary-trigger repair):
  pinned Uniswap Labs' first-party "Uniswap Mobile App Early Access" blog
  post as a local `body_hash` / `body_path` replay artifact. The post
  directly records Apple's October first-build approval, final-build
  rejection before the planned December launch, unresolved refusal to
  green-light the public App Store launch, Uniswap's guideline-compliance
  position, and TestFlight early-access workaround. This upgrades the
  trigger and observed app-store gatekeeping evidence floor to primary
  corporate while preserving `attribution=plausible`: Apple did not publish
  a rationale, and the direct evidence is Uniswap's first-party account of
  the review outcome rather than an Apple statement.

  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: wave-3 S5-corporate
  draft, adversarial-verify verdict=KEEP (sources real + on-topic + §9 in-scope + not dup), AND
  passes strict admission validation; origin agent_draft -> human_reviewed).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). Apple's App Store review
  refused (2023-03-03) to approve the Uniswap self-custody Wallet for iOS,
  leaving it unavailable via the App Store despite Apple approving
  comparable self-custody swapping wallets ("won't green-light our launch
  and we don't know why"). Uniswap routed around it via TestFlight (10,000
  users). An app-store gatekeeping denial of a major crypto app — same
  app-store-gatekeeper pattern as apple-india-crypto-exchange-removal-2024-01.
  The first-party Uniswap blog source was captured and pinned on 2026-06-01;
  Fortune and CoinDesk remain corroborating replay anchors.

  comparison shape: 1 observed_change layer (l4_frontend, the app
  distribution / access surface) with attribution=plausible. attribution
