  case_study documenting the European Banking Authority's 2014-07-04
  Opinion EBA/Op/2014/08 on virtual currencies — the first major EU-
  level supervisory guidance on crypto. The Opinion is structurally a
  supranational supervisory recommendation: it identifies 70+ risks
  arising from virtual currencies and, as an immediate interim measure
  pending a longer-term regulatory regime, advises national supervisory
  authorities to discourage credit institutions, payment institutions,
  and e-money institutions from buying, holding, or selling virtual
  currencies.

  This event sits in the historical_baseline_2013_2016 tier and is
  used as contextual_baseline only; it is not part of the 2017+
  comparable-analysis corpus. It is the EU-level upstream of the later
  EU MiCA regime (eu-mica-2023) and a sibling of the contemporaneous
  FATF "Virtual Currencies: Key Definitions and Potential AML/CFT
  Risks" report (fatf-virtual-currencies-key-definitions-2014) on the
  supranational regulatory-guidance axis. Structurally analogous to
  US FinCEN FIN-2013-G001 in that the instrument operates at the
  class-level and produces a dispersed cascade across the regulated-
  institution sector rather than a discrete enumerable enforcement
  action.

  empirical_shape=comparison (1 observed_change layer: offramp_cex at
  the supranational supervisory-instruction layer, attribution=
  plausible on the dispersed-cascade hypothesis across the EU credit/
  payment/e-money sector); admission_tier=empirical_case (1 strong-
  attribution observed_change layer satisfies the ≥1 requirement).
  Schema enums substituted for prompt-supplied non-enum values
  (analysis_use=historical_baseline, empirical_shape=comparison,
  target.enumeration=subset, observation_kind=observed_change) per
  the "schema enums first" constraint. coverage at L0/L1/L3/L4/asset_onchain
  is not_applicable on construct-not-engaged or construct-did-not-
  exist grounds; offramp_cex is not_measured pending an EU
  institution-level account-closure aggregation pass. Paper-relevant
  as the pre-MiCA EU-level supervisory anchor that frames the 2014-
  2018 banking-rail de-risking environment for EU-based crypto
  businesses.

scoped_claim: |
  "EBA Opinion EBA/Op/2014/08 of 4 July 2014 ('Opinion on virtual
  currencies') is the first major EU-level supervisory instrument on
  virtual currencies; it advises national supervisory authorities to
  discourage EU credit institutions, payment institutions, and
  e-money institutions from buying, holding, or selling virtual
  currencies pending a longer-term regulatory regime. The
  load-bearing axis is offramp_cex at the dispersed-cascade
  institutional-aggregate layer; downstream banking-rail / payment-
  rail severance against EU crypto businesses across 2014-2018 is
  consistent with the cascade hypothesis but not enumerated in this
  draft."

