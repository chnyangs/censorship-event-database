coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      EBA/Op/2014/08 is a supervisory-guidance instrument directed at
      EU prudentially-regulated institutions; it does not implicate
      ISP-level domain blocking or DNS interference. not_applicable on
      construct-not-engaged grounds.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Pre-Merge era (Ethereum Merge ~2022-09-15 is ~8 years downstream);
      no PBS / relay-filter primitive exists in 2014. not_applicable on
      construct-did-not-exist grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      The MEV-Boost / Flashbots Protect / MEV-Blocker public-RPC
      compliance substrate that the L3 layer measures did not exist in
      2014. not_applicable on construct-did-not-exist grounds.
  - layer: l4_frontend
    status: not_applicable
    note: |
      The Opinion does not direct any frontend takedown or domain-level
      action; the discouragement is purely a supervisory instruction to
      EU prudentially-regulated institutions. not_applicable.
  - layer: asset_onchain
    status: not_applicable
    note: |
      EBA/Op/2014/08 does not engage any on-chain freeze, blacklist, or
      issuer admin action; native and issued asset surfaces are not
      directly targeted. not_applicable.
  - layer: offramp_cex
    status: measured
    note: |
      Load-bearing layer for this event, but a dispersed cascade across
      the EU credit/payment/e-money institutional sector. The Opinion's
      discouragement of buying/holding/selling virtual currencies routes
      through national supervisory authorities and propagates as
      institution-by-institution risk-appetite decisions (banking-rail
      severance for crypto businesses, account closures, payment-rail
      de-risking) rather than as a discrete enforcement action against
      a named exchange. Empirical measurement of the resulting cascade
      requires aggregating EBA member-state supervisor responses and
      institution-level account-closure reports across 2014-2018, which
      is out of scope of this draft. Marked not_measured pending such a
      pass.

