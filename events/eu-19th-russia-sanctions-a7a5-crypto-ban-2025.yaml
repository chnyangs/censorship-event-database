analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: read the full
  event + the captured EU primary source, confirmed the source substantiates the specific
  crypto-asset transaction/sectoral-provider ban claimed; clean per wave-2 adversarial verify;
  validate.py [OK]). Distinct EU-sanctions-package event (template: eu-8th-package-russia-crypto-services-ban-2022-10).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission). The EU 19th sanctions
  package (adopted 2025-10-23) is the EU's first prohibition on transacting
  a specific named crypto-asset: it bans transactions involving the A7A5
  rouble-backed stablecoin across the EU and designates A7A5's developer,
  its Kyrgyz issuer, and the operator of a platform where significant
  volumes of A7A5 are traded. This is a §9-IN-SCOPE censorship action (a
  deliberate freeze/denial of a named crypto-asset + its service
  infrastructure), continuing the EU Russia-sanctions crypto track
  (8th -> 18th -> 19th -> 20th). comparison shape, single offramp_cex
  observed_change/direct. asset_onchain is marked not_applicable rather than
  carrying a primary_onchain observed_change: the captured EU and Elliptic
  sources name A7A5 (on Ethereum/Tron, issuer Old Vector LLC) but enumerate
  NO specific on-chain address or issuer-freeze tx hash, so per codebook
  §1.6 the effect is carried at the offramp_cex/transaction layer (no
  fabricated tx_hash). attribution=direct: the EU instrument explicitly
  names the prohibited crypto-asset. Sources verified via WebSearch +
  capture 2026-05-31; verbatim A7A5 transaction-ban language grep-confirmed
  in the captured Consilium body. NOTE for human audit: legal-analysis
  secondary sources (Matheson/Elliptic) report the prohibition is keyed to
  Annex LIII effective 2025-11-25; those Annex/effective-date specifics are
  NOT present in the captured Consilium press release, so they are NOT
  asserted in this record (only the press-release-attested prohibition +
  designations are claimed).

