      body_path: sources/http_captures/kyrgyzstan-nbkr-virtual-currency-payment-warning-2014-07/primary/nbkr.kg__searchout.jsp__556a968ab7.html
      evidence_use: replayable
      note: |
        Official National Bank of the Kyrgyz Republic English page, creation
        date 2014-07-18, titled "Warning of the National Bank of the Kyrgyz
        Republic on the spread and use of the 'virtual currency', in particular,
        bitcoins (bitcoin)." The page states that the Kyrgyz som is the sole
        legal tender in Kyrgyzstan and that using virtual currency, particularly
        bitcoin, as a means of payment in Kyrgyzstan would violate Kyrgyz law.
        It also strongly recommends not using virtual currency, not participating
        in purchase/sale/exchange operations, and not providing or receiving
        virtual currency as payment for goods, services, or works. The source
        does not name any exchange, bank, payment provider, domain, or address.
        The Wayback save request timed out locally, but the CDX API confirmed the
        2026-05-31 snapshot recorded in the wayback field.
  timestamp_sources:
    - type: primary_government
      note: |
        The official NBKR page carries "Creation date: 2014-07-18"; that date is
        used instead of the stale 2014-08 date in the census candidate row. Day
        precision is appropriate because the page does not publish an intraday
        release time.

