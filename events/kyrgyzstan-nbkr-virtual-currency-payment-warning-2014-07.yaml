analysis_notes: |
  **NEW EVENT AUTHORED -- AGENT_DRAFT 2026-05-31**. Created from the P4
  census-gap queue after locating and capturing the official NBKR English page.
  The event remains `status=draft` and `origin=agent_draft`; automation must not
  promote it to an admitted paper row without human admission review.

  Inclusion / scope rationale: the source is stronger than a generic consumer
  risk note because NBKR states that the Kyrgyz som is the sole legal tender and
  that using virtual currency, particularly bitcoin, as a means of payment in
  Kyrgyzstan would violate Kyrgyz law. It also advises against purchase, sale,
  exchange, and payment use. However, the source does not identify an operator
  response or regulated-institution mandate equivalent to Jordan's 2014 CBJ
  circular, and it does not document a specific exchange shutdown, bank cutoff,
  payment-provider cutoff, merchant ban, domain block, or asset freeze.

  Modeling rationale: this is coded as `null_event` / `null_case` because the
  captured source gives a class-level payment-instrument / legal-risk warning
  but this pass found no named exchange, bank, merchant, payment-provider,
  frontend, issuer, or on-chain action in the bounded observation window. The
  row is useful as a clean historical-baseline comparator and as a guardrail
  against the stale census slug/date, which used an August 2014 secondary-report
  date rather than the official NBKR creation date of 2014-07-18.

  Source note: the current CoinDesk candidate URL returned a 200 status serving
  a 404 page and is not used as evidence. The official NBKR page was captured
  live with a stable body hash; Wayback save timed out locally, but the Wayback
  CDX API confirmed a 2026-05-31 snapshot.

scoped_claim: |
  On 2014-07-18, the National Bank of the Kyrgyz Republic published a warning
  stating that the Kyrgyz som is the sole legal tender and that using virtual
  currency, particularly bitcoin, as a means of payment in Kyrgyzstan would
  violate Kyrgyz law. This draft codes the action as a historical-baseline,
  class-level off-ramp/payment-instrument warning with no measured exchange
  shutdown, bank cutoff, payment-provider cutoff, domain block, or on-chain
  action.

