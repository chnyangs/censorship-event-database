coverage:
  - layer: l0_network
    status: not_applicable
    note: FCA action is a regulatory-licensing notice, not a DNS / connectivity action.
  - layer: l1_consensus
    status: not_applicable
  - layer: l3_rpc
    status: not_applicable
  - layer: l4_frontend
    status: partially_measured
    scope: [binance.com]
    note: |
      Binance posted UK-specific notices on binance.com/en in the days
      after 2021-06-26 (geo-fenced messages clarifying that BML was a
      separate legal entity, and subsequent UK-customer-facing service
      restrictions over the following months). plausible-attribution
      observation attached. L4 is not the load-bearing layer for this
      event; the bank-payment-rail cascade at offramp_cex is the
      paper-worthy signal. partially_measured pending pinned Wayback
      bracket of binance.com/en UK-geo banners.
  - layer: asset_onchain
    status: not_applicable
    note: No SDN listing; no stablecoin-issuer freeze primitive applicable.
  - layer: offramp_cex
    status: measured
    scope:
      - barclays_uk
      - santander_uk
      - faster_payments_to_binance
    note: |
      Within the week following the FCA 2021-06-26 notice, UK retail banks
      (Barclays announced 2021-07-05; Santander 2021-07-13; others followed
      through July-August 2021) blocked card and Faster Payments transfers
      to Binance. UK retail users of binance.com lost GBP on/off-ramp
      access. Attached as observed_change with direct attribution -- the
      banks publicly cited the FCA notice as the trigger for the
      payment-rail block.

