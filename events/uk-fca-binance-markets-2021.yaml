analysis_notes: |
  Source-repaired on 2026-06-01. This row is now scoped to the replayable
  FCA materials: the 2021-06-26 FCA consumer warning and the 2021-06-25
  First Supervisory Notice to Binance Markets Limited. The load-bearing
  observation is the FCA-required notice / promotion-removal compliance that
  the FCA later reported on 2021-08-25, not a bank payment-rail cascade.

  Structurally distinct from India/Nigeria/Turkey/China nation-state bans:
  the FCA action targets a single named entity (BML, the UK-authorised
  Binance arm) and its customer-facing communication surfaces rather than a
  class-wide crypto-exchange ecosystem or direct banking prohibition.

  Related concurrent batch (2021 Binance regulator wave; promotion of
  sibling stubs in progress under the same 2026-05-16 staged-release plan):
    - netherlands-dnb-binance-warning-2021 (2021-08-18)
    - malaysia-sc-binance-disable-2021 (2021-07-30)
    - singapore-mas-binance-services-2021 (2021-09-02)
  Cross-stratum cousin: binance-4framework-2023 (US, S3) -- shows the
  long-tail trajectory of Binance regulatory exposure that originated in
  this 2021 multi-jurisdictional wave.

scoped_claim: |
  "FCA's 2021-06-26 consumer warning and First Supervisory Notice imposed
  immediate requirements on Binance Markets Limited: BML could not undertake
  regulated activity in the UK without prior FCA consent, had to display a
  prescribed notice on www.binance.com and other channels, and had to remove
  live advertising / financial promotions by 2021-06-30. The FCA later
  stated on 2021-08-25 that BML complied with all aspects of the requirements.
  No UK bank payment-rail severance claim is retained in this repaired row."

