analysis_notes: |
  **NEW EVENT AUTHORED -- DRYRUN 2026-05-16** (Phase 4 of 2026-05-16
  staged-release plan, promoted from candidate_triggers/uk-fca-binance-markets-2021.yaml
  per Agent C #3): comparison documenting the 2021-06-26 UK FCA consumer
  warning that Binance Markets Limited "is not permitted to undertake any
  regulated activity in the UK." Structurally distinct from the
  India/Nigeria/Turkey/China nation-state bans: the FCA action targets a
  single named entity (BML, the UK-registered Binance arm) rather than a
  class-wide crypto-exchange ecosystem, but its cascade through UK retail
  banks (Barclays 2021-07-05, Santander 2021-07-13, others) produced a
  class-wide GBP payment-rail severance for UK Binance customers.

  Paper-relevant contrast: a regulator action without direct banking-cut
  authority (FCA does not have RBI-2018-style direct banking-prohibition
  power over UK retail banks) still produced banking-rail severance via
  reputational / supervisory-risk transmission. This contrasts with the
  RBI-2018 / CBN-2021 / CBRT-2021 cases where the regulator directly
  ordered banks to cut crypto rails.

  Related concurrent batch (2021 Binance regulator wave; promotion of
  sibling stubs in progress under the same 2026-05-16 staged-release plan):
    - netherlands-dnb-binance-warning-2021 (2021-08-18)
    - malaysia-sc-binance-disable-2021 (2021-07-30)
    - singapore-mas-binance-services-2021 (2021-09-02)
  Cross-stratum cousin: binance-4framework-2023 (US, S3) -- shows the
  long-tail trajectory of Binance regulatory exposure that originated in
  this 2021 multi-jurisdictional wave.

  DRYRUN caveats: trigger primary citation (FCA news page) and supporting
  press citations (FT, Reuters) are asserted with replayable Wayback URLs
  but body-hash captures are deferred. For non-DRYRUN release, capture
  body_hash + body_path for: (1) FCA news page, (2) FCA First Supervisory
  Notice PDF (Annex A), (3) FT Barclays story, (4) Reuters Santander
  story, (5) Binance UK announcement page. Marked evidence_use=
  contextual_unarchived on all citations to flag the unarchived state per
  validator policy.

scoped_claim: |
  "FCA consumer warning of 2021-06-26 that Binance Markets Limited is not
  permitted to undertake regulated activity in the UK precipitated a
  class-wide GBP payment-rail severance from major UK retail banks
  (Barclays 2021-07-05, Santander 2021-07-13, others) to Binance over the
  following 8 weeks. Primary observational axis is offramp_cex at the
  UK-Binance cohort level; secondary L4-frontend response (UK-geo
  restriction banners on binance.com/en) attached with plausible
  attribution."

