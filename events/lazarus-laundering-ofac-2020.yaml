analysis_notes: |
  null_event documenting the 2020-03-02 designation of two Chinese nationals
  laundering DPRK-stolen cryptocurrency. Bitcoin-only, individual-level; all infrastructure
  layers not_applicable. The only meaningful measurement axis is offramp_cex (deposit-block
  reactions to the 20 BTC addresses), recorded as coverage_gap with the OFAC SDN entry as
  the legal anchor.

  Admitting as null_event rather than null_event — the target is individuals
  without services, so there's no service-layer cascade to compare.

scoped_claim: |
  "OFAC designation of two DPRK-laundering Chinese nationals on 2020-03-02 attached 20
  Bitcoin addresses to SDN; cross-layer cascade is structurally unmeasurable (Bitcoin native,
  individuals). Serves as a datapoint for the individual-BTC-sanction class."

