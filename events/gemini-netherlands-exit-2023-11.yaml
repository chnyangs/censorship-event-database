  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: wave-3 S5-corporate
  draft, adversarial-verify verdict=KEEP (sources real + on-topic + §9 in-scope + not dup), AND
  passes strict admission validation; origin agent_draft -> human_reviewed).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). On 2023-09-29 (notice to Dutch
  users dated 2023-09-26) Gemini announced it would cease offering crypto
  services in the Netherlands by 2023-11-17, citing requirements imposed by De
  Nederlandsche Bank (DNB) on crypto exchanges; Dutch users were asked to
  withdraw their crypto and fiat balances by that date. This is a corporate
  jurisdiction exit by a centralized exchange driven by a national regulatory
  regime — in scope per codebook §9 (corporate jurisdiction exit/geofence).
  comparison shape, single offramp_cex observed_change, attribution=plausible
  (exit is directly observed; captured anchors are trade press, not a Gemini
  primary notice). asset_onchain not_applicable (CEX market exit, no on-chain
  freeze, no §1.6 tx_hash floor). Same DNB-driven 2023 Dutch exchange exodus as
  binance-netherlands-exit-2023-07 and kucoin-netherlands-exit-2023. Sources
  verified via WebSearch 2026-05-31; CoinDesk + Unlock-BC captured + body_hash
  pinned; grep of the CoinDesk body confirms "Gemini", "Netherlands",
  "requirements imposed by the De Nederlandsche Bank (DNB)", "withdrawn their
  crypto and fiat balances by Nov. 17" (no fabrication).

scoped_claim: |
  "Gemini's 2023-11-17 effective closure of affected Netherlands accounts,
  leaving Dutch users unable to access Gemini exchange or custody services and
  citing DNB requirements on crypto exchanges, is a single-layer offramp_cex
  observed_change with direct attribution, part of the 2023 Dutch exchange
  exodus (cf. Binance/KuCoin)."

