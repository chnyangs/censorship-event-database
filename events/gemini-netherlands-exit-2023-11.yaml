analysis_notes: |
  **QUALITY-LOOP REPAIR 2026-06-02** (automated source and scope repair; no
  new human-audit stamp). Replaced the load-bearing press-only trigger with a
  first-party Gemini Help Center Wayback memento for the Netherlands account
  closure. The row is now scoped to the source-supported 2023-11-17 effective
  closure / no-access state rather than the earlier press-report date. Trigger,
  observation, and attribution are primary_corporate-backed; coverage is
  measured for the Gemini Netherlands customer access surface, without claiming
