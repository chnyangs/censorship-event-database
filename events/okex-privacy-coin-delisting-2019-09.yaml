  **ADMITTED 2026-05-31** (genuine review by human:xiangwen reviewing agent: TASK-2 lower-tier. §9-clear, well-documented deliberate restriction admitted at evidence_tier=attested_secondary (codebook §10) — single captured contemporaneous source; verified clean (no fabrication) in bulk adversarial-verify; filterable via evidence_tier.)
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). OKEx's Korea unit delisted
  five privacy coins — Monero (XMR), Dash (DASH), Zcash (ZEC), Horizen (ZEN),
  Super Bitcoin (SBTC) — citing the FATF travel rule (trading ended
  2019-10-10, withdrawals 2019-12-10). Part of the first major privacy-coin
  delisting wave (alongside upbit-privacy-coin-delisting-2019-09), an early
  node later joined by Bittrex (2021), Binance (2023) and OKX/Kraken/Huobi
  (2024). CORRECTION vs lead: the lead candidate framed this as "South Korea /
  Global"; the captured CoinDesk body is explicit that the decision was scoped
  to OKEx's KOREA unit, not OKEx globally — coded jurisdiction=KR and asset
  list corrected to the five named coins (XMR/DASH/ZEC/ZEN/SBTC), not a vague
  "five privacy coins". comparison shape, single offramp_cex observed_change,
  attribution=plausible (delisting directly observed; FATF-travel-rule
  rationale is a soft-framework class-level compliance inference, not a named
  instrument acting on these assets). The five assets are independent
  base-chain tokens, so l0/l1/l3/l4/asset_onchain are not_applicable. Sources
  verified via WebSearch + captured 2026-05-31 (CoinDesk, body_hash-pinned;
  "OKEX Korea"/five assets/"FATF"/"travel rule"/"Oct. 10"/"Dec. 10" grepped
  from the captured body; no fabrication).

