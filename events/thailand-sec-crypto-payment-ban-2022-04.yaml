analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: read the event +
  the captured national-regulator primary source confirming the ban/prohibition; §9 hard-ban
  censorship; clean per wave verify; validate.py [OK]).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources verified+captured,
  awaiting human admission).

  Comparable-main authoring pass for the Thai SEC's 2022-04-01 prohibition (SEC Notification
  No. Gor Tor. 5/2565, announced 23 March 2022) barring all licensed Thai digital-asset
  business operators from supporting or facilitating the use of digital assets as a means of
  payment for goods and services. This is a payment-rail / service-denial action (a censorship
  action under codebook §9 INCLUDE: a deliberate restriction of a crypto payment service by a
  state actor), not a soft advisory. The captured SEC body carries the operative regulation
  language ("avert support or promotion of the use of digital assets as a means of payment")
  and confirms the joint SEC/BOT origin.

  Why §9 INCLUDE: the SEC notification ORDERS licensed operators not to provide crypto-as-
  payment services — a deliberate restriction of access to a service surface, parallel to
  payment-rail prohibitions like Nigeria 2021. That is a censorship action, not advisory.

  Why trigger.type=nation_state_block: the action is a national payment-rail / service
  prohibition directed at the licensed-operator class (codebook §5.1 "Nation-state ISP/DNS
  block / payment-rail prohibition" family). Per §5.2 the permitted research_stratum is
  S4_nation_state. (The SEC is acting here as a market authority issuing a payment-rail
  prohibition, not a per-firm administrative-enforcement order, so nation_state_block fits
  better than regulatory_enforcement.)

  Why comparable_main tier: 2022 belongs to comparable_main_2017_present; analysis_use=
  comparable_analysis.

  Why empirical_shape=comparison / admission_tier=empirical_case: one direct-attribution
  observed_change layer (offramp_cex). The other five layers are scope-mismatched. Single
  load-bearing strong-attribution layer -> comparison / empirical_case.

  Why attribution=direct: the SEC press release (the regulatory mandate itself) names the
  licensed-operator payment-service prohibition, satisfying the §1.5 nation-state-mandate
  reading at the off-ramp rail.

  Source note: the captured anchor is the SEC Thailand official press release via Wayback
  (memento 2022-07-16, the closest archived copy of News_Detail SECID=9366). The underlying
  SEC Notification Gor Tor 5/2565 PDF (Thai) was not separately pinned; human audit may attach
  it prior to admission review.

scoped_claim: |
  SEC Thailand Notification No. Gor Tor. 5/2565 (announced 23 March 2022, effective 1 April
  2022) prohibited all licensed Thai digital-asset business operators from supporting or
  facilitating the use of digital assets as a means of payment for goods or services,
  severing the licensed crypto-as-payment channel in Thailand. The offramp_cex layer carries
  the load-bearing direct-attribution observation.

