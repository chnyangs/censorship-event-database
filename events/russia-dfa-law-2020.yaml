target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    Canonical target is the regulatory class of cryptocurrency
    activity within Russia: digital currency issuance, circulation,
    and use as a means of payment by Russian legal entities, Russian
    individual tax residents (including foreigners residing in Russia
    >183 days), and Russian branches/representative offices of
    foreign organizations. The law does not enumerate specific
    exchanges, addresses, or domains as targets; it is a class-level
    foundational regulatory framework. enumeration=subset rather than
    complete because the law addresses an activity class without a
    fixed roster of named entities. Matches the sibling
    russia-cbr-crypto-payment-ban-2022 pattern.
  protocol: null
  actor_type: russia_crypto_activity_class
  actor_name: Russia-resident crypto activity (259-FZ regulatory class)
  chains:
    - bitcoin
    - ethereum
  canonical_domains: []

jurisdiction:
  - RU

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      Federal Law 259-FZ is a foundational regulatory framework, not
      an ISP-level domain block or DNS directive. Roskomnadzor
      enforcement of crypto-exchange domain blocking is a separate
      enforcement track not actuated by this law. L0 not_applicable
      on scope-mismatch grounds.
  - layer: l1_consensus
    status: not_applicable
    note: |
      No protocol-level relay-filter primitive is engaged by a
      national regulatory framework. not_applicable on
      construct-mismatch grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      Public-RPC compliance substrate (Flashbots Protect / MEV-
      Blocker) is not engaged by a national regulatory framework.
      not_applicable.
  - layer: l4_frontend
    status: not_applicable
    note: |
      The law does not direct frontend takedowns. not_applicable on
      scope-mismatch grounds.
  - layer: asset_onchain
    status: not_measured
    note: |
      The 2020-07-31 DFA law defines and circumscribes cryptocurrency
      activity within Russia, including a prohibition on payment use
      by Russian residents. No issuer-side admin freeze primitive is
      directly engaged by 259-FZ itself; the law is foundational
      regulatory text. No measured asset-level shock attributable to
      the 2020-07-31 signing or 2021-01-01 effective date has been
      pinned in this authoring pass. Marked not_measured to leave
      room for future coverage_gap rows if subsequent enforcement
      sub-events are authored.
  - layer: offramp_cex
    status: measured
    note: |
      The DFA law prohibits Russian residents from accepting or
      making payments in digital currency for goods/services, which
      class-level constrains crypto-payment off-ramping within
      Russia. However, the law is foundational regulatory text that
      did not actuate a per-event Russian off-ramp shock cascade
      (the subsequent 2022 CBR payment ban and 2024 mining laws are
      the downstream enforcement vectors). No enumerated measured
      Russian off-ramp shock attributable to the 2020-07-31 signing
      or 2021-01-01 effective date has been pinned in this authoring
      pass. Marked not_measured with a coverage_gap observation row
      below; this is the null_event-shaped empirical posture flagged
      in the task brief.

