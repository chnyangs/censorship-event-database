  **NEW EVENT AUTHORED — DRYRUN 2026-05-17**. Phase Wave 2.2D
  comparable-main authoring pass for Russian Federal Law No. 259-FZ
  "On Digital Financial Assets, Digital Currency, and Amendments to
  Certain Legislative Acts of the Russian Federation", signed by
  President Vladimir Putin on 2020-07-31 and effective 2021-01-01.
  origin=agent_draft and status=draft; human re-verification of
  (i) the Library of Congress source URL reachability and Wayback
  snapshot pinning, (ii) the Crowdfund Insider and Eurasian Group
  journalism snapshots, and (iii) any contemporaneous Russian
  asset-onchain or offramp class-level measurement is required
  before this event may be promoted to human_reviewed.

  Why comparable_main / comparable_analysis tier: 2020 falls inside
  the 2017+ comparable analysis frame. analysis_use=comparable_
  analysis is the canonical form (codebook §6); aliases
  "comparative_analysis" / "contextual_baseline" are not accepted
  by the validator.

  Why empirical_shape=null_event / admission_tier=null_case: zero
  observed_change observations. 259-FZ is foundational framework
  law that defines and circumscribes crypto activity in Russia but
  did not actuate a per-event L0/L1/L3/L4/asset_onchain/offramp_cex
  cascade on the 2020-07-31 signing or 2021-01-01 effective date.
  The downstream Russian enforcement vectors (2022-01-20 CBR
  consultation paper, 2024-12 regional mining ban) are sibling
  events. The single observation row is observation_kind=
  coverage_gap with attribution=unknown, which does not contribute
  toward empirical_shape or admission_tier per codebook §3 / §4.
  null_event is the conservative shape consistent with the task-
  brief hint.

  Why trigger.type=regulatory_enforcement (NOT nation_state_block):
  per codebook §5.1, regulatory_enforcement is the canonical trigger
  type for non-US national regulator administrative enforcement that
  is NOT a network-layer or payment-rail block. 259-FZ is
  foundational federal law defining cryptocurrency status and
  circumscribing payment use; it is not itself a Roskomnadzor
  ISP/DNS block directive nor an enacted payment-rail severance.
  nation_state_block is reserved for actuated ISP/DNS or payment-
  rail blocks (KZ shutdown, CN PBoC banking-rail severance, NG CBN,
  IN RBI, TR CBRT). research_stratum=S4_nation_state is permitted
  for both trigger types per codebook §5.2.

  Why target.kind=entity / enumeration=subset: schema target_kinds
  does not include "regulatory_class"; entity is the closest enum
  for a population/activity-class target. enumeration=subset rather
  than complete because the law addresses an activity class
  (issuance, circulation, payment use) without a fixed roster of
  named entities. Matches the sibling russia-cbr-crypto-payment-
  ban-2022 pattern.

  Why all coverage layers are not_applicable except asset_onchain
  and offramp_cex: L0 — no Roskomnadzor blocking directive in the
  law; L1 — no consensus-layer primitive engaged; L3 — no public-
  RPC compliance substrate engaged; L4 — no frontend takedown
  directive. asset_onchain (not_measured) — the law constrains
  cryptocurrency activity by Russian residents but does not
  directly actuate issuer-side admin freezes; future enforcement
  sub-events could populate. offramp_cex (not_measured) — the law
  prohibits payment use by Russian residents but did not actuate
  a per-event off-ramp shock; coverage_gap row recorded.

  Cross-temporal context: 259-FZ is the upstream foundational
  anchor for the Russian crypto regulatory regime. The 2022-01-20
  CBR consultation paper (russia-cbr-crypto-payment-ban-2022)
  proposed a fuller ban that was not enacted; the 2024-12 regional
  mining ban (russia-mining-regional-ban-2024-12) implemented a
  partial mining restriction. Together these three events form a
  within-jurisdiction longitudinal anchor for Russian federal
  crypto-disposition. The task brief explicitly identifies 259-FZ
  as "foundational law preceding the 2022 CBR payment ban and
  2024 mining laws".

  Evidence-use posture: all three citations are marked
  evidence_use=contextual_unarchived because Wayback anchors are
  provisional (year-prefix wildcard per codebook convention) and
  require specific snapshot timestamp re-pinning at human audit.
  Per task brief evidence_use=contextual_unarchived applies to all
  sources.

