analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources
  verified+captured, awaiting human admission).

  null_event documenting the 2024-03-25 OFAC SDN designation (EO 14024; jy2204)
  of Russia-nexus virtual-currency exchanges Netex24 (TOEP / Netexchange) and
  Bitpapa, part of a 13-entity + 2-individual Russia virtual-asset-services and
  technology-procurement action. Both exchanges processed transactions for
  OFAC-designated Russian entities (Sberbank, Alfa-Bank, Hydra Market,
  Garantex). Sibling to garantex-ofac-2022 / hydra-ofac-2022 in the Russia
  crypto-exchange-sanctions chain.

  Coded null_event / null_case per the S1 convention: the designation is the
  trigger, but no public CEX cascade was documented in the 14-day window. Per
  codebook §1.6 no asset_onchain observation is coded absent a captured
  primary_onchain freeze tx_hash; the measurable surface is carried at
  offramp_cex (observed_no_change / none). Sources verified + captured
  2026-05-31 (Treasury jy2204 + OFAC RA 20240325, both body_hash-pinned).

scoped_claim: |
  "OFAC's 2024-03-25 SDN designation (jy2204) of Russia-nexus virtual-currency
  exchanges Netex24 and Bitpapa, within a 15-target Russia virtual-asset-
  services action, restricted U.S.-person dealings with both crypto exchanges.
  No public CEX cascade was documented in the 14-day window. null_case:
  exchange-operator target with limited measurable cross-layer surface at draft
  time."

