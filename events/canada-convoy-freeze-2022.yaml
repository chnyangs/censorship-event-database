            - 2022-02-14T00:00:00Z
            - 2022-02-23T23:59:59Z
          addresses_cohort: convoy_wallets_approx_253_btc
        note: |
          Emergency Economic Measures Order §4 explicitly directs all Canadian
          financial service providers (including "entities engaged in virtual
          currency transactions") to cease dealings with designated persons
          and freeze their property. Regulated Canadian crypto exchanges
          (Bitbuy, Wealthsimple Crypto, Netcoins, Newton) confirmed compliance
          within 24h. Direct attribution: the Order names the compliance
          requirement and designates virtual-currency service providers as
          in-scope.

analysis_notes: |
  comparison — first G7 nation-state-level invocation of emergency
  powers to freeze crypto addresses in the dataset. Unique structural features:
  (1) no court order required during invocation period; (2) no formal SDN-list
  enumeration (targets designated via RCMP circulars to financial institutions);
  (3) 9-day effective window; (4) retroactive revocation 2022-02-23 but
  frozen balances remained at issuer discretion thereafter.

  Paper-worthy contrast to OFAC-style enumeration: emergency-order-based
  crypto freezes can proceed without public address lists, which breaks the
  standard OFAC-centric measurement methodology — there is no authoritative
  complete list to check on-chain. Observational signal is necessarily at
  the offramp_cex layer via exchange compliance confirmations.

scoped_claim: |
  "Canada's 2022-02-14 invocation of the Emergencies Act produced the first
  G7 nation-state-level crypto freeze in the dataset, directing Canadian
  regulated crypto exchanges to freeze approximately 253 BTC wallet addresses
  tied to Freedom Convoy funding. The freeze was implemented through private
  RCMP-to-institution circulars rather than a public SDN list, demonstrating
  a non-OFAC-style enforcement mode."

