analysis_notes: |
  **NEW EVENT AUTHORED -- AGENT_DRAFT 2026-05-31**. Created from the P4
  census-gap queue after official DOJ source capture. Live justice.gov capture
  returned an Akamai interstitial, so the replayable body anchor is the
  2020-08-14 Wayback memento plus three DOJ-hosted complaint / affidavit PDFs
  captured through Wayback `if_` PDF URLs. The event remains `status=draft` and
  `origin=agent_draft`; automation must not promote it to an admitted paper row
  without human admission review.

  Inclusion rationale: this is in scope as a federal seizure / forfeiture action
  against crypto-enabled terrorist-finance infrastructure, comparable to the
  dataset's darknet-market and mixer takedown rows. The draft deliberately keeps
  the measured observation at `l4_frontend`, where DOJ directly states website
  and Facebook-page seizure. It does not code the aggregate cryptocurrency
  account seizures as `asset_onchain` because no public primary_onchain tx_hash
  has been pinned.

  Future repair path: a human or later automated source pass could transcribe the
  155-address al-Qaeda attachment and search for public transaction-level seizure
  movements, but that would be a new on-chain repair. Until then, §1.6 keeps
  asset_onchain at `not_measured`.

