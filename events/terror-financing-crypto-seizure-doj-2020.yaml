  - layer: asset_onchain
    status: not_measured
    note: |
      DOJ reports seizure / forfeiture of cryptocurrency accounts and the
      al-Qaeda complaint enumerates BTC defendant properties, but this draft
      does not pin a primary_onchain seizure or movement tx_hash. Under
      codebook §1.6, no asset_onchain observed_change is coded without a
      public primary_onchain tx_hash.
  - layer: offramp_cex
    status: not_measured
    note: |
      The Akti/Karatas affidavit documents virtual-currency exchange accounts
      and unlicensed money-transmission activity, but the public materials do
      not enumerate every exchange provider/account or a platform-side freeze
      statement. Kept as not_measured pending a human review of the court
      docket and any exchange-side artifacts.

