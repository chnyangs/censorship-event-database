analysis_notes: |
  **SOURCE/COVERAGE REPAIRED 2026-06-02** (quality-loop scope repair):
  verified the existing Treasury Recent Actions and Treasury press-release
  captures by body hash, marked the row primary-source verified, and
  narrowed coverage taxonomy to the retained claim. This row now measures
  the Hydra-targeted L4 onion-service takedown only. L0 network blocking is
  out of scope because no ISP/DNS censorship claim is retained; asset_onchain
  is not applicable because the listed assets are XBT addresses with no
  issuer freeze primitive; and off-ramp/CEX consequences are assigned to
  the sibling Garantex row or later exchange-compliance rows rather than
  duplicated here.

  Scoped release claim: the 2022-04-05 Hydra designation and same-day German
  action disrupted Hydra's frontend / marketplace availability. This admitted
  baseline is not yet claiming an asset-layer or off-ramp cascade. The case
  broadens the pilot set beyond protocols and exchanges while still fitting the
  same trigger-and-layer methodology.

scoped_claim: |
  "OFAC designation of Hydra Market on 2022-04-05 (parallel to German BKA
  takedown) documents a Tor-hidden-service darknet-market removal with
  120+ address enumeration. L4 onion frontend was seized by BKA same day
  (direct attribution), while asset-layer cascade was absent because
  XBT-only targets have no stablecoin-issuer freeze primitive."

