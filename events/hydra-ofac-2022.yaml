coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      This row measures a coordinated law-enforcement takedown and OFAC
      designation of the Hydra onion-service marketplace, not ISP/DNS or
      national-firewall blocking. There is no public clearnet domain or
      jurisdictional network-block claim retained in the scoped claim, so
      OONI/Censored Planet reachability is out of scope for this event.
  - layer: l1_consensus
    status: not_applicable
    note: Darknet marketplace designation does not map cleanly to consensus-layer filtering
  - layer: l3_rpc
    status: not_applicable
    note: No public RPC dependency is central to the trigger object
  - layer: l4_frontend
    status: measured
    scope:
      - Hydra onion sites
    note: |
      Load-bearing layer. Treasury states that German Federal Criminal
      Police shut down Hydra servers in Germany on 2022-04-05, and the
      OFAC Recent Actions record lists the Hydra Market entity plus its
      onion-service addresses. This supports the retained L4/onion-service
      disruption claim without asserting broader darknet-market availability.
  - layer: asset_onchain
    status: not_applicable
    note: |
      OFAC lists more than 100 XBT addresses associated with Hydra, but
      Bitcoin has no issuer-admin freeze primitive. The row does not claim
      a stablecoin issuer freeze or other asset-admin action.
  - layer: offramp_cex
    status: not_applicable
    note: |
      The same Treasury press release also sanctions Garantex, but this
      event's target is Hydra Market. Off-ramp / exchange effects belong
      to the sibling Garantex row or later exchange-compliance rows, not
      to this Hydra-targeted L4 takedown measurement.

