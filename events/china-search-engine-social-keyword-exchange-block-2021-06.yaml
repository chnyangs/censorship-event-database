  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources verified+captured, awaiting human admission)

  China state-directed search/social keyword censorship of crypto exchanges. IN
  SCOPE (codebook §9): a deliberate access/information block — the four major PRC
  search/social platforms (Baidu, Weibo, Sogou, Zhihu) suppressed search results
  for Binance/Huobi/OKEx, with Weibo citing "relevant laws, regulations, and
  policies" (the standard CAC content-directive formula). Distinct from the
  existing china-weibo-crypto-exchange-purge-2021-03 event (2021-03-11 Weibo
  ACCOUNT suspensions, a different mechanism and date). Not a dup.

  Layer routing: the observable mechanism is search-result suppression at the
  platform frontend, so the load-bearing effect is carried at l4_frontend
  (observed_change), NOT at L0 — per codebook §1.5, L0 may not be elevated above
  not_measured without a replayable network-vantage (OONI/Censored Planet) slice,
  which is not captured here. Attribution=plausible (§1.1): the platforms acted
  consistent with a CAC directive but no public order naming the specific queries
  is captured (class-level inference). Single observed_change layer ⇒
  empirical_shape=comparison; one strong-attribution (plausible) layer ⇒
  admission_tier=empirical_case.

  Source caveat: both captures are supporting_journalism (no primary CAC/platform
  order is publicly archivable for keyword-suppression directives). Kept as draft
  awaiting human admission.

scoped_claim: |
  "On 2021-06-09, China's major search and social platforms (Baidu, Weibo,
  Sogou, Zhihu) suppressed search results for the crypto exchanges Binance,
  Huobi and OKEx, with Weibo citing 'relevant laws, regulations, and policies'.
  Effect captured at the l4_frontend layer via two same-day journalism sources;
  attribution plausible (state-directed, class-level)."

