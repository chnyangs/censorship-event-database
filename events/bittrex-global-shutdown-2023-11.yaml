analysis_notes: |
  **NEW EVENT AUTHORED - DRYRUN 2026-05-31** (P4 census-gap registry
  continuation). This draft converts the previously borderline
  `bittrex-global-shutdown-2023-11` registry row into a narrow,
  primary-corporate-anchored S5 event. The captured Zendesk notice is
  replayable by body_hash and supports only the Bittrex Global service
  wind-down / trading-termination claim.

  Scope boundary: this is not a duplicate of `sec-v-bittrex-2023`. That
  admitted event explicitly limits the measured surface to Bittrex US
  off-ramp operations and says Bittrex Global is not coded as the measured
  surface. This draft covers the later global exchange-service wind-down,
  with Bittrex Global as the corporate actor and with attribution to the
  company's own customer notice, not to an SEC-only causal claim.

  Why draft: automation can verify and pin the official source, but cannot
  provide human admission, human audit, or a final causation decision for a
  borderline business wind-down. Keep as `origin=agent_draft` until a human
  reviewer decides whether the S5 corporate service withdrawal is admitted
  as a paper case.

scoped_claim: |
  "Bittrex Global's November 2023 customer notice announced termination of
  all trading activity on 2023-12-04, leaving customers in withdrawal-only
  mode; this is a single-layer S5 corporate exchange-service wind-down
  draft, distinct from the earlier Bittrex US SEC/Chapter 11 event."

