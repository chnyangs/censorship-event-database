      evidence_use: replayable
      note: |
        BusinessNews.com.lb contemporaneous English report, "The BDL warned of
        the use of 'Bitcoins'," summarizing the BDL announcement as forbidding
        banks, financial institutions, currency-exchange companies, brokerage
