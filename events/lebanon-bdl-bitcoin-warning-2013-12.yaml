analysis_notes: |
  **NEW EVENT AUTHORED -- AGENT_DRAFT 2026-05-31**. Created from the P4
  census-gap queue after official-source verification. The event remains
  `status=draft` and `origin=agent_draft`; automation must not promote it to an
  admitted paper row without human admission review.

  Inclusion rationale: this is stronger than a generic non-legal-tender warning.
  The official BDL text is addressed to banks, financial institutions, exchange
  institutions, financial brokerage institutions, and the public; cites Basic
  Decision No. 7548 Article 3 as prohibiting issuance of and dealing in
  electronic money; and warns anyone against purchase, holding, or use of
  virtual money including Bitcoin. That makes it an early historical-baseline
  central-bank restriction signal rather than a pure consumer-risk note.

  Modeling rationale: `trigger.type=regulatory_enforcement` because this is a
  central-bank administrative announcement / warning, not an ISP block or a
  newly measured payment-rail shutdown. The load-bearing observation is coded at
  `offramp_cex` as a regulated-financial-activity class restriction. The row does
  not claim any specific exchange closure, user offboarding, domain block,
  frontend geofence, or on-chain asset action.

  Source note: the repo capture script failed on the BDL PDF because Python's TLS
  stack hit an SSL handshake failure; the same URL was downloaded with curl using
  HTTP/1.1 and TLS 1.2, then hashed locally. The Perma memento for the older BDL
  page was also captured, but its local HTML is a replay shell rather than the
  load-bearing announcement body, so the official PDF is the replayable primary
  anchor used here.

scoped_claim: |
  "On 2013-12-19, Banque du Liban issued Announcement No. 900, addressed to
  banks, financial institutions, exchange institutions, financial brokerage
  institutions, and the public, citing the electronic-money prohibition in Basic
  Decision No. 7548 and warning against purchase, holding, or use of virtual
  money including Bitcoin. The event is modeled as a historical-baseline,
  class-level off-ramp / regulated-financial-activity restriction signal; no
  platform-specific cutoff, network block, frontend block, or on-chain action is
  claimed."

