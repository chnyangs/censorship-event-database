analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17** (parallel-agency sibling
  authoring; CFTC pillar of the 2022-12-13 coordinated DOJ + SEC + CFTC
  enforcement triad against Samuel Bankman-Fried, FTX Trading Ltd., and
  Alameda Research LLC). Origin=agent_draft; status=draft pending human
  audit.

  This row is the CFTC civil commodity-fraud parallel to the existing
  ftx-bankman-fried-doj-2022 row (DOJ criminal indictment with SEC + CFTC
  citations bundled) and the sibling sec-v-ftx-2022 (SEC civil complaint).
  The load-bearing offramp_cex observation (FTX.com global withdraw-pause
  and Chapter 11 customer-asset freeze) is coded only once, in the DOJ
  parent row, to avoid double-counting a single physical action across
  three parallel-agency rows. This row is therefore an empirical_shape:
  null_event under codebook §3 (0 observed_change layers) and
  admission_tier: null_case under codebook §4 (0 strong-attribution
  observed_change layers).

  Rationale for null_event coding: the CFTC complaint adds the
  commodity-fraud legal theory (digital-asset commodities in interstate
  commerce; alleged $8B+ customer losses) on top of an already-collapsed
  FTX (Chapter 11 filed 2022-11-11, ~one month prior to the trigger). No
  cross-layer censorship/disruption primitive is engaged independently by
  the CFTC complaint that is not already attributable to the bankruptcy
  estate or to the parallel DOJ/SEC actions. The row exists in the corpus
  as a denominator control documenting that parallel-agency enforcement
  actions on already-collapsed platforms do not produce additional
  cross-layer observations.

  Sibling positioning: parallel to ftx-bankman-fried-doj-2022 (DOJ
  criminal, load-bearing offramp_cex with attribution=plausible) and
  sec-v-ftx-2022 (SEC civil securities-fraud, expected null_event under
  the same multi-agency dedup rule). All three rows share the 2022-12-13
  trigger date and the same three named defendants but differ in actor
  agency and legal theory (DOJ wire fraud + money laundering; SEC
  securities fraud; CFTC commodity fraud).

scoped_claim: |
  "The 2022-12-13 CFTC civil commodity-fraud complaint against Samuel
  Bankman-Fried, FTX Trading Ltd., and Alameda Research LLC is coded as
  a null_event parallel-agency sibling to ftx-bankman-fried-doj-2022.
  The offramp_cex customer-asset freeze that would otherwise be coded
  here is attributed to the DOJ parent row to avoid double-counting a
  single physical action across the three coordinated 2022-12-13 federal
  enforcement filings. The row carries no observed_change layers and
  serves as a denominator control documenting that parallel-agency
  enforcement on an already-bankrupt platform produces no additional
  cross-layer censorship/disruption observations."

