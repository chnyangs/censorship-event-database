coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      EPI/EPIESP licensing is a financial-regulatory action; it does not
      operate via L0 network-layer interference. JP does not run a
      mainland-style network filter against unlicensed stablecoin
      frontends.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Stablecoin issuer/intermediary licensing does not map to Ethereum
      PBS relay filtering or any other L1 consensus primitive.
  - layer: l3_rpc
    status: not_applicable
    note: |
      EPI regime does not constrain RPC routing or operator selection;
      no L3 observation applies.
  - layer: l4_frontend
    status: not_applicable
    note: |
      EPI regime does not require frontend-takedown of unlicensed
      stablecoin issuer or intermediary websites; the regulatory
      perimeter is the legal-business-conduct gate, not the web layer.
  - layer: asset_onchain
    status: not_measured
    scope: [jp_epi_issuer_class]
    note: |
      Stablecoin issuance licensing constrains who may legally issue an
      EPI to JP residents. Pre-existing foreign-issued stablecoins
      (USDT, USDC, DAI) remain in circulation on public chains globally;
      the JP regime does not impose on-chain freeze, blacklist, or
      issuer-side address-blacklist requirements at the protocol level.
      No coordinated JP-issued EPI launch was observed in the
      2023-06-01 → 2023-12 window pinned at admission-anchor quality;
      first FSA-approved bank-consortium JPY-stablecoin work (e.g.
      Progmat Coin, MUFG-backed) is documented as forward-looking
      rather than as a discrete 2023-06 cascade event. Coded
      not_measured rather than partially_measured because no
      observation is anchored in this DRYRUN pass.
  - layer: offramp_cex
    status: partially_measured
    scope: [jp_registered_vasp_stablecoin_listings, jp_epiesp_registration_class]
    note: |
      Load-bearing axis for null_event coding. Pre-existing JP-registered
      VASP behavior (as of 2022-11): none of the 31 FSA-registered
      exchanges (incl. bitFlyer, Coincheck) listed USDT/USDC for JPY
      pairs. The 2023-06-01 PSA Amendment Act formalizes the
      intermediary regime (EPIESP) under which such listings could
      occur, but no immediate post-2023-06-01 delisting cascade is
      documented — the regime is enabling-with-restrictions rather than
      cliff-edge prohibitive. Downstream USDC launch (SBI VC Trade,
      bitFlyer, Binance Japan) materialized in late 2024/2025 under the
      EPIESP regime, but those are forward-looking cascade events that
      will be coded as separate downstream events when authored.
      partially_measured pending pinned anchors for (1) FSA EPIESP
      registration roster, (2) JP-registered-VASP stablecoin-listing
      status snapshots across the 2023-06-01 commencement window.

