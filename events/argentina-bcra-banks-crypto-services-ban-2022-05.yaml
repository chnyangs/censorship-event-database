analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources verified+captured,
  awaiting human admission).

  Comparable-main authoring pass for the 2022-05-05 Banco Central de la República Argentina
  (BCRA) Communication "A" 7506 prohibiting all Argentine financial institutions from carrying
  out or facilitating client transactions in digital/crypto assets not regulated by a national
  authority and authorized by the BCRA — a de facto ban (no such assets are BCRA-authorized).
  This is a banking-rail prohibition / institutional debanking of crypto (a censorship action
  under codebook §9 INCLUDE: a deliberate restriction of banking service to crypto), not a soft
  advisory. The action came days after Banco Galicia, Brubank and Ualá launched bank crypto
  trading, which lasted ~48h before the BCRA shut it down.

  Why §9 INCLUDE: Communication "A" 7506 ORDERS regulated financial institutions not to deal in
  or facilitate crypto transactions — a deliberate restriction of access to banking rails,
  parallel to Nigeria 2021 CBN and China 2013 PBOC. That is a censorship action, not advisory.

  Why trigger.type=nation_state_block: a central-bank banking-rail prohibition directed at the
  regulated financial-institution class (codebook §5.1 "Nation-state ISP/DNS block / payment-
  rail prohibition" family, alongside NG CBN, India RBI). Per §5.2 the permitted
  research_stratum is S4_nation_state.

  Why comparable_main tier: 2022 belongs to comparable_main_2017_present; analysis_use=
  comparable_analysis.

  Why empirical_shape=comparison / admission_tier=empirical_case: one direct-attribution
  observed_change layer (offramp_cex). The other five layers are scope-mismatched. Single
  load-bearing strong-attribution layer -> comparison / empirical_case.

  Why attribution=direct: the BCRA statement (Communication "A" 7506, the regulatory mandate
  itself) names the financial-institution prohibition, satisfying the §1.5 nation-state-mandate
  reading at the banking rail.

  Source note: the official BCRA news page carries identical operative language but is not
  Wayback-archivable (returns no memento); the archived CoinDesk report (memento 2022-05-10) is
  the replayable anchor, and it directly quotes the BCRA prohibition. The Communication "A" 7506
  PDF was not separately pinned; human audit may attach a BCRA-domain primary copy before
  admission.

scoped_claim: |
  BCRA Communication "A" 7506 of 2022-05-05 prohibited all Argentine financial institutions
  from carrying out or facilitating client transactions in digital/crypto assets not regulated
  by a national authority and authorized by the BCRA — a de facto ban that severed the bank
  channel between Argentine users and crypto. The offramp_cex layer carries the load-bearing
  direct-attribution observation; the prohibition remained in force well beyond 2022.

