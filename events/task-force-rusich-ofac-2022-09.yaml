  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources
  verified+captured, awaiting human admission). OFAC designated the Russian
  neo-Nazi paramilitary group Task Force Rusich on 2022-09-15 (Treasury
  jy0954, E.O. 14024), attaching five crypto addresses (2 BTC, 2 ETH, 1
  USDT-on-Tron) tied to a Telegram crowdfunding campaign resupplying pro-
  Russian troops in Ukraine. Coded null_event/null_case per the S1
  convention (cf. zservers-ofac-2025, bitriver-russia-mining-ofac-2022-04):
  no public CEX cascade was documented in the 14-day window; BTC/ETH have
  no issuer freeze mechanism and the USDT-Tron freeze is unqueried
  (offramp_cex observed_no_change/none; asset_onchain deferred per §1.6).
  Source verified + captured 2026-05-31 (Treasury jy0954, body_hash-pinned;
  no fabrication). Candidate src (coindesk) superseded by Treasury jy0954
  primary.

