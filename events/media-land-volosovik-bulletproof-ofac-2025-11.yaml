  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1;
  sources verified+captured, awaiting human admission). OFAC SDN
  designation 2025-11-19 (OFAC recent-actions 20251119 / Treasury
  sb0319), coordinated with the U.K. and Australia, of Russian
  bulletproof-hosting provider Media Land LLC and executives Aleksandr
  Volosovik ("Yalishanda"), Kirill Zatolokin, and Yulia Pankova, for
  enabling ransomware (LockBit / BlackSuit / Play) and DDoS
  infrastructure; one Bitcoin address is listed for Volosovik. In-scope
  per §9 INCLUDE (OFAC SDN designation). NOTE: the candidate lead
  proposed an l0_network layer, but this event codes the SDN
  asset-blocking action, not a measured network block — no OONI /
  Censored Planet measurement of Media Land infrastructure was captured,
  so per §1.5 the L0 row stays not_measured. Coded null_event /
  null_case per the S1 convention (cf.
  bitriver-russia-mining-ofac-2022-04): the on-chain footprint is a
  single native-BTC address (no issuer freeze primitive) and no
  per-event CEX cascade was pinned in the 14-day window, so the
  measurable cross-layer surface is limited (offramp_cex
  observed_no_change / none). Primary sources verified + captured
  2026-05-31 (OFAC recent-actions 20251119 + Treasury sb0319,
  body_hash-pinned; no fabrication). Conservative coding per codebook
  §8.4 pending human review.

