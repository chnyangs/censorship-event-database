  unsupported specifics. DRAFT — do NOT admit as-is.
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources
  verified+captured, awaiting human admission). FIRST OFAC narcotics-
  related designation to enumerate cryptocurrency addresses: Fujing Zheng,
  Guanghua Zheng, and Xiaobing Yan designated 2019-08-21 (Treasury sm756)
  under the Foreign Narcotics Kingpin Designation Act, with Bitcoin and
  Litecoin SDN addresses attached. Coded null_event/null_case per the S1
  convention (cf. zservers-ofac-2025, bitriver-russia-mining-ofac-2022-04):
  the designation is the trigger, but no public CEX cascade was documented
  in the 14-day window and the attached addresses are Bitcoin/Litecoin with
  no issuer-level freeze mechanism, so the measurable cross-layer surface
  is limited (offramp_cex observed_no_change/none; asset_onchain deferred
  per §1.6 pending a primary_onchain receipt). Source verified + captured
  2026-05-31 (Treasury sm756, body_hash-pinned; no fabrication). Candidate
  src (sm756) confirmed correct.

