analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17 Wave 2.3 P2**: agent_draft authored
  per Wave 2.3 P2 sweep. Documents the Pertsev-CC-1 slice of the 2023-08-23
  SDNY Tornado Cash indictment, distinct from:
  (a) pertsev-nl-arrest-2022 — NL FIOD arrest 2022-08-10 (different trigger,
      different jurisdiction);
  (b) storm-semenov-doj-2023 — same-day SDNY indictment but for the charged
      defendants Storm + Semenov;
  (c) semenov-ofac-2023 — same-day OFAC SDN designation of Semenov.

  null_event: Pertsev's CC-1 listing in the US indictment is a paper-relevant
  cross-border enforcement signal (DOJ's public acknowledgment of the NL case
  as a US-aligned action) but produced no fresh cross-layer cascade. CEX,
  asset, RPC, and frontend layers either already-collapsed (frontend, RPC) or
  unrelated to the CC-1 designation per se (asset). Per §1 codebook,
  attribution=none is correct for observed_no_change rows. Per §5 trigger
  table, doj_indictment + S3_doj_sec_cftc_fiod is the canonical pairing.

  Per §7 target enumeration: subset (not complete) because this event records
  one named co-conspirator of a multi-named indictment; the charged-defendant
  enumeration lives in storm-semenov-doj-2023.

scoped_claim: |
  "The 2023-08-23 SDNY Tornado Cash indictment named Alexey Pertsev as
  Co-Conspirator-1 without charging him (deferring to the ongoing Dutch
  prosecution from pertsev-nl-arrest-2022); the CC-1 designation produced no
  separately-disclosed cross-layer cascade beyond the same-day OFAC Semenov
  SDN and storm-semenov-doj-2023 indictment captured in companion events."

