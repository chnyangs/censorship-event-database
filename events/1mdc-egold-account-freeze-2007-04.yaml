analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: event passed bulk
  adversarial-verify clean (no VERIFY-FLAG) AND strict admission validation — captured primary/
  semi-primary sources meet the §1.6/threshold floor; origin agent_draft -> human_reviewed).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2;
  sources verified+captured, awaiting human admission). As a knock-on of
  the 2007-04-27 e-gold federal indictment (D.D.C.), a US court order
  forced e-gold to freeze and liquidate the pool of e-gold accounts
  (~$10-20M) that backed 1mdc — an e-gold-reserve-backed digital gold
  currency (2001-2007) — rendering 1mdc insolvent by default and ending
  its service. §9 IN SCOPE: a court-ordered freeze/seizure of a
  legitimate digital-currency operator's reserves (1mdc was a real
  digital-gold-currency service, not a scam/Ponzi). One observed_change
  layer (offramp_cex service termination via reserve freeze),
  attribution=plausible (the federal e-gold court order is the operative
  state instrument; the 1mdc-specific freeze effect is carried by the
  Wayback-pinned 1mdc encyclopedic source — the DOJ release indicts
  e-gold but does not itself name 1mdc). comparison shape /
  empirical_case tier / discovery_only_2007_2012. asset_onchain
  not_applicable and the freeze effect carried at offramp_cex per
  codebook §1.6 (1mdc units were off-ledger e-gold-backed entries, not a
  blockchain token; no on-chain tx_hash exists). L0/L1/L3/l4
  not_applicable. Sources verified via WebSearch 2026-05-31; DOJ e-gold
  indictment release + Wikipedia 1mdc article captured + body_hash-
  pinned (no fabrication; no on-chain addresses or tx hashes asserted).

scoped_claim: |
  "As a knock-on of the 2007-04-27 e-gold federal indictment, a US court
  order forced e-gold to freeze/liquidate the ~$10-20M pool of e-gold
  accounts backing 1mdc (an e-gold-reserve-backed digital gold
  currency), rendering 1mdc insolvent and ending its service
  (offramp_cex), attribution=plausible. Discovery-period (pre-2013)
  tier; collateral to the e-gold takedown lineage."

