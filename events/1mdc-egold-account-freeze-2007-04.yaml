      offramp_cex rather than asset_onchain.
  - layer: offramp_cex
    status: measured
    scope: [1mdc]
    note: |
      Load-bearing layer. 1mdc operated as a centralized digital-gold-
      currency administrator backed by e-gold reserves; the 2007-04-27 US
      court order forcing e-gold to freeze/liquidate the 1mdc-backing
      accounts (~$10-20M) rendered 1mdc insolvent and ended its service.
      Attested in the e-gold DOJ indictment release (the federal
      instrument) + the 1mdc secondary source (the 1mdc-specific effect).

