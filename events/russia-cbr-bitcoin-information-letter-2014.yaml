  Why historical_baseline tier: events 2013–2016 belong to the
  historical_baseline_2013_2016 temporal tier per the 2008+ tiered
  frame in sampling/frame.yaml. analysis_use=historical_baseline
  excludes this row from the 2017+ comparable-analysis denominator,
  matching the validator's tier-vs-analysis-use consistency rule.

  Why empirical_shape=null_event / admission_tier=null_case: this
  event has zero observed_change observations. The CBR letter is an
  AML/CFT advisory, not a banking-rail severance directive, and no
  enumerated Russian crypto-exchange or banking counterfactual has
  been pinned in this authoring pass. The single observation row is
  observation_kind=coverage_gap with attribution=plausible, which
  does not contribute toward empirical_shape or admission_tier.
  Treated as historical-baseline context rather than admission-grade
  cascade evidence.

  Why trigger.type=nation_state_block: the schema enum
  trigger_types includes nation_state_block but does not include a
  distinct "regulatory_advisory" or "warning" type. nation_state_block
  is the closest enum for a single-country central-bank action and is
  the same trigger.type used by the sibling china-pboc-crypto-ban-
  2013-12 historical-baseline event. The advisory-vs-ban distinction
  is captured in analysis_notes and scoped_knowledge rather than in
  trigger.type.

  Why target.kind=entity / enumeration=subset: schema target_kinds
  does not include "regulatory_class" or "exchange"; entity is the
  closest enum for a population-class target and matches the China
  2013 / China 2021 / India 2018 sibling pattern. enumeration=subset
  rather than complete because the advisory addresses a Russia-
  resident bitcoin-user class without a fixed roster.

  Why all coverage layers are not_applicable except offramp_cex:
  L0 (not_applicable) — no ISP / DNS directive in the letter; Russian
  network-layer crypto blocking is a downstream 2017+ Roskomnadzor
  phenomenon. L1 (not_applicable) — Ethereum PBS relay primitive
  does not exist in 2014. L3 (not_applicable) — public-RPC compliance
  primitive (Flashbots Protect / MEV-Blocker) does not exist in 2014.
  L4 (not_applicable) — scope mismatch: the advisory does not target
  specific frontends. asset_onchain (not_applicable) — bitcoin has
  no issuer-side admin freeze primitive and USDT did not exist in
  2014-01. offramp_cex (not_measured) — the advisory is plausibly
  off-ramp-relevant but no enumerated measurement is pinned.

  Cross-temporal context: this 2014-01-27 information letter
  precedes the later CBR-led 2017+ enforcement posture and the 2022
  CBR full crypto-payments ban (russia-cbr-crypto-payment-ban-2022).
  The cross-temporal sibling pair (2014 advisory → 2022 ban) is a
  within-jurisdiction longitudinal anchor for the Russian
  central-bank crypto-disposition trajectory. The 2013-12-05 PBOC
  Notice 2013/289 (china-pboc-crypto-ban-2013-12) is a contemporaneous
  cross-jurisdictional comparator one month earlier, with a stronger
  cascade (PRC three-exchange CNY-deposit pause) because the PRC
  notice was a banking-rail severance directive rather than an
  AML/CFT advisory.

