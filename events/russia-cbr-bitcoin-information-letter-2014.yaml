trigger:
  type: nation_state_block
  actor: RU_CBR
  timestamp: 2014-01-27T00:00:00Z
  timestamp_precision: day
  citation:
    - type: primary_legal
      url: http://www.cbr.ru/press/pr/?file=27012014_1825052.htm
      wayback: https://web.archive.org/web/20170724031011/http://www.cbr.ru/press/pr/?file=27012014_1825052.htm
      body_hash: sha256:6852dfb3f49bb0b1422791e0f08a5d9a7968c2263d31bd28cc75e958d4e876d9
      body_path: sources/http_captures/russia-cbr-bitcoin-information-letter-2014/primary/web.archive.org__web-20170724031011-http-www.cbr.ru-press-pr__f1d7be4e36.html
      evidence_use: contextual_unarchived
      note: |
        Central Bank of the Russian Federation (Bank of Russia / CBR)
        information letter dated 2014-01-27 titled "Об использовании при
        совершении сделок «виртуальных валют», в частности, Биткойн"
        ("On Using Virtual Currencies, Specifically Bitcoin, in
        Transactions"). The Bank of Russia warned Russian citizens and
        legal entities (in particular credit and non-credit financial
        organizations) against using virtual currencies for exchange
        into goods, services, or monetary funds in rubles and foreign
        currency. The letter framed virtual-currency exchange activities
        by Russian business entities as "dubious activity" potentially
        constituting involvement in money-laundering and
        terrorism-financing under Russian AML/CFT law, and invoked
        Article 27 of the Federal Law "On the Central Bank of the
        Russian Federation" which prohibits the issuance of monetary
        surrogates in Russia. This was an information letter / advisory
        — not a formal prohibition on residents holding bitcoin — but
        signaled the regulatory disposition that anticipates the later
        CBR-led 2017+ enforcement posture and the 2022 CBR full
        crypto-payments ban. Russian-language original on cbr.ru.
        Wayback wildcard anchor is provisional; specific snapshot
        timestamp must be re-pinned during human audit before this
        citation may carry an admission anchor in its own right. Marked
        evidence_use=contextual_unarchived pending that re-pin.
    - type: semi_primary_wayback
      url: https://www.loc.gov/item/global-legal-monitor/2014-02-06/russia-bitcoin-exchanges-can-be-penalized/
      wayback: https://web.archive.org/web/20220808091552/https://www.loc.gov/item/global-legal-monitor/2014-02-06/russia-bitcoin-exchanges-can-be-penalized/
      body_hash: sha256:b78c857b4fd427708b82a0f8f2e1c602b088361d0e2847b56a08b88d4f50f7ef
      body_path: sources/http_captures/russia-cbr-bitcoin-information-letter-2014/primary/web.archive.org__web-20220808091552-https-www.loc.gov-item-global-legal-monitor-2014-02-06-russia-bitcoin-exchanges-can-be-penalized__cd849026c0.html
      evidence_use: contextual_unarchived
      note: |
        US Library of Congress Global Legal Monitor entry dated
        2014-02-06 titled "Russia: Bitcoin Exchanges Can Be Penalized",
        providing English-language summary of the 2014-01-27 Bank of
        Russia information letter and naming Article 27 of the CBR Law
        as the cited legal basis. Used here as a contextual translation
        anchor; specific Wayback snapshot timestamp to be re-pinned
        during human audit. Marked evidence_use=contextual_unarchived.
  timestamp_sources:
    - type: primary_legal
      note: |
        The CBR information letter carries a 2014-01-27 issuance date,
        which is the date used by contemporaneous Russian-language and
        English-language secondary coverage (Library of Congress, TASS,
        Reuters, CoinDesk). Day-level precision is appropriate because
        the CBR information letter does not carry intra-day publication
        timing in the public record.

target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    Canonical target is the CBR advisory directed at Russia-resident
    bitcoin users and Russian legal entities (in particular credit
    and non-credit financial organizations). This is a class-level
    advisory, not an enumerated entity list: the letter does not
    name specific exchanges or individual addresses. No Russian
    crypto-exchange ecosystem of the scale of the contemporaneous
    PRC triad (BTC China, OKCoin, Huobi) existed at the time, and
    the advisory's binding force on residents was indirect (an
    AML/CFT-violation warning rather than a banking-rail severance
    directive). Enumeration=subset rather than complete because the
    advisory addresses a population class without a fixed roster.
  protocol: null
  actor_type: russia_resident_bitcoin_user_class
  actor_name: Russia-resident bitcoin users (CBR advisory class)
  chains:
    - bitcoin
  canonical_domains: []

jurisdiction:
  - RU

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The 2014-01-27 CBR information letter does not direct ISP-level
      domain blocking or DNS interference. Russian network-layer
      blocking of crypto-exchange domains is a downstream and later
      phenomenon (Roskomnadzor enforcement actions begin 2017+) that
      is not part of this 2014-01-27 advisory trigger. L0 marked
      not_applicable consistent with the China 2013 / India 2018
      sibling treatment of nation-state regulatory-advisory and
      banking-rail events.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Bitcoin proof-of-work consensus in 2014-01 has no protocol-level
      relay-filter primitive analogous to the post-Merge Ethereum PBS
      relay surface. The Ethereum Merge itself is ~8.5 years downstream
      (2022-09-15). not_applicable on construct-did-not-exist grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      The MEV-Boost / Flashbots Protect / MEV-Blocker public-RPC
      compliance substrate that the L3 layer measures did not exist in
      2014; Flashbots Protect launched 2022-11 and MEV-Blocker launched
      2023-03-27. not_applicable on construct-did-not-exist grounds.
  - layer: l4_frontend
    status: not_applicable
    note: |
      The 2014-01-27 CBR letter is a population-class advisory, not a
      directive to take down specific frontends. Russian-language
      bitcoin frontends were not enumerated targets of this advisory,
      and Russian frontends were not part of a dominant domestic
      exchange ecosystem at the time. not_applicable on
      scope-mismatch grounds.
  - layer: asset_onchain
    status: not_applicable
    note: |
      Bitcoin native asset has no issuer-side blacklist / freeze admin
      method. The 2014-01-27 advisory does not engage a stablecoin-
      issuer admin path (USDT first issued ~2014-10; chainwide admin
      freezes arose later). not_applicable on construct-did-not-exist
      grounds.
  - layer: offramp_cex
    status: measured
    note: |
      The CBR information letter is functionally an AML/CFT advisory
      directed at Russian credit and non-credit financial organizations
      and the Russia-resident bitcoin-user class. It is plausible that
      Russian banks tightened or refused virtual-currency-related
      account servicing in response, but no enumerated Russian
      crypto-exchange triad analogous to the 2013-12 PRC case has been
      pinned in this authoring pass, and contemporaneous public
      measurement of Russian off-ramp behavior in the 2014-01 window
      has not been re-verified. Dispersed cascade with no load-bearing
      direct-attribution observation available. Marked not_measured
      with a coverage_gap observation row below.

observations:
  - layer: offramp_cex
    actor: russia_resident_bitcoin_offramp_class
    event: cbr_aml_cft_advisory_dispersed_cascade
    observation_kind: observed_no_change
    attribution: none
    timestamp: 2014-01-27T00:00:00Z
    precision: day
    window:
      - 2014-01-27T00:00:00Z
      - 2014-12-31T23:59:59Z
    note: |
      The 2014-01-27 CBR information letter plausibly influenced the
      willingness of Russian credit and non-credit financial
      organizations to service virtual-currency-related accounts, but
      no enumerated counterfactual or class-level off-ramp measurement
      has been pinned in this authoring pass. Recorded as coverage_gap
      with attribution=unknown to signal a dispersed cascade
      consistent with the advisory's framing (AML/CFT-violation
      warning + monetary-surrogate prohibition reference) without
      claiming a measured observed_change. Schema observation_kind
      enum does not include "not_observed"; coverage_gap is the
      canonical pattern for class-level dispersed advisories without
      measured action evidence (cf. fincen-virtual-currency-msb-
      guidance-2013). Validator rule constrains coverage_gap rows to
      attribution ∈ {unknown, none}; "unknown" reads as
      plausibly-influenced-but-not-measured here.
    sources:
      - type: primary_legal
        url: http://www.cbr.ru/press/pr/?file=27012014_1825052.htm
        wayback: https://web.archive.org/web/20170724031011/http://www.cbr.ru/press/pr/?file=27012014_1825052.htm
        body_hash: sha256:6852dfb3f49bb0b1422791e0f08a5d9a7968c2263d31bd28cc75e958d4e876d9
        body_path: sources/http_captures/russia-cbr-bitcoin-information-letter-2014/primary/web.archive.org__web-20170724031011-http-www.cbr.ru-press-pr__f1d7be4e36.html
        evidence_use: replayable
        note: |
          CBR 2014-01-27 information letter is the legal instrument.
          The letter explicitly warns Russian citizens and legal
          entities (in particular credit and non-credit financial
          organizations) against virtual-currency exchange activity
          and frames such activity by Russian businesses as
          potentially constituting AML/CFT violations. Provisional
          wayback anchor; specific snapshot timestamp requires
          human-audit re-pinning.
      - type: semi_primary_wayback
        url: https://www.loc.gov/item/global-legal-monitor/2014-02-06/russia-bitcoin-exchanges-can-be-penalized/
        wayback: https://web.archive.org/web/20220808091552/https://www.loc.gov/item/global-legal-monitor/2014-02-06/russia-bitcoin-exchanges-can-be-penalized/
        body_hash: sha256:b78c857b4fd427708b82a0f8f2e1c602b088361d0e2847b56a08b88d4f50f7ef
