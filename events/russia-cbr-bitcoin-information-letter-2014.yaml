  "Об использовании при совершении сделок «виртуальных валют», в
  частности, Биткойн" ("On Using Virtual Currencies, Specifically
  Bitcoin, in Transactions"). origin=agent_draft and status=draft;
  human re-verification of (i) the cbr.ru source URL reachability and
  Wayback snapshot pinning, (ii) the Library of Congress English-
