analysis_notes: |
  comparison documenting the international takedown of ChipMixer Bitcoin mixer on
  2023-03-15. Joint FBI + BKA + Poland + Switzerland + HSI + Europol operation; domain
  seizure + ~$46.5M BTC seized + operator indictment. The L4 observed_change is direct
  (seizure banner on event day, 17h post-indictment-unsealing).

  Structural twin to Samourai 2024-04-24 (similar Bitcoin-privacy-tool + same-day seizure +
  international cooperation). Both cases inform the paper's "direct-law-enforcement" L4
  mechanism class.

scoped_claim: |
  "DOJ EDPA seizure of ChipMixer on 2023-03-15 produced a direct L4 observed_change within
  17h (canonical chipmixer.com substituted with an FBI seizure banner). Joint-action footprint:
  US + 4 European cooperating agencies + Europol. Establishes the 'cross-border
  law-enforcement seizure' pattern for Bitcoin mixer frontends."

