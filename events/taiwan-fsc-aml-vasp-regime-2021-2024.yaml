analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: event passed bulk
  adversarial-verify clean (no VERIFY-FLAG) AND strict admission validation — captured primary/
  semi-primary sources meet the §1.6/threshold floor; origin agent_draft -> human_reviewed).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission).

  null_event — S4 nation-state mandatory VASP-registration regime. Taiwan first
  brought VASPs under AML obligations via the FSC's 2021-06 AML/CFT regulations
  effective 2021-07-01 (administrative-penalty compliance-declaration regime).
  The 2024-07-31 amendment to the Money Laundering Control Act added Article 6,
  establishing a mandatory FSC AML-registration regime: VASPs that have not
  completed registration are not allowed to provide virtual asset services, and
  operating in violation carries criminal penalties (imprisonment up to two
  years and/or fines up to NT$5 million for natural persons; larger fines for
  legal persons). The FSC's implementing registration regulations took effect
  2024-11-30.

  §9 inclusion: borderline soft-governance framework promoted to IN-scope under
  the §9 test "INCLUDE only when the instrument directly mandates a restriction."
  Unlike a pure AML advisory, the MLCA Art. 6 regime self-executingly PROHIBITS
  unregistered VASPs from operating (criminal penalty), which is a binding
  restriction of service — directly analogous to the admitted
  uzbekistan-napp-vasp-licensing-2022-07 mandatory-licensing event and
  turkey-cmb-casp-licensing-law-7518-2024.

  trigger.type=regulatory_enforcement + research_stratum=S4_nation_state per
  codebook §5.1/§5.2 (TW FSC is a non-US national regulator; the action is an
  administrative registration mandate, not an ISP/payment-rail block).

  Coded empirical_shape=null_event / admission_tier=null_case per codebook
  §3/§4, following the uzbekistan-napp-vasp-licensing-2022-07 precedent: the
  offramp_cex layer is the construct-engaged surface but no admission-grade
  per-event cascade (named-VASP exit / onboarding halt tied to the 2024-07-31
  trigger) has been captured; coded observed_no_change / attribution=none
  pending human audit. The conservative null coding is preferred (§4) over
  asserting an unmeasured cascade. L0/L1/L3/asset_onchain coded not_applicable
  on construct-not-engaged grounds; L4 not_measured.

scoped_claim: |
  "On 2024-07-31 Taiwan amended its Money Laundering Control Act to add Article 6,
  establishing a mandatory FSC AML-registration regime under which VASPs that
  have not completed registration may not provide virtual asset services and
  violators face criminal penalties (FSC implementing regulations effective
  2024-11-30), building on the 2021-07-01 AML compliance-declaration regime.
  This created a binding domestic VASP-registration perimeter at offramp_cex; no
  admission-grade per-event cascade is pinned in this DRYRUN draft, coded
  null_event pending human audit."

