  null_event documenting the FSCA's 2022-10-19 Declaration of crypto
  assets as a financial product under the FAIS Act (Government Notice
  1350, Government Gazette 47334). The Declaration brings persons
  providing FAIS-defined "advice" and "intermediary services" in
  respect of crypto assets into the FSP licensing perimeter, with a
  general transitional exemption from FAIS s.7(1) until licence
  applications are approved or declined; the licence application
  window ran 2023-06-01 to 2023-11-30.

  Structural contribution to the dataset: this is South Africa's
  nation-state regulatory-perimeter expansion onto the ZA CASP cohort,
  sibling to MiCA (eu-mica-2023) at the EU level and a downstream
  national-implementation companion to the FATF R.15 / Travel Rule
  framework (fatf-r15-vasp-travel-rule-2019). It is the first ZA
  national-regulator perimeter action to be authored into the corpus
  and serves as a denominator control for the S4_nation_state stratum
  on the African-continent axis.

  Codebook compliance: §5.1 trigger.type = regulatory_enforcement
  (non-US national regulator administrative enforcement, NEW
  2026-05-17 enum addition); §5.2 stratum-actor map
  (regulatory_enforcement → S4_nation_state); §6 analysis_use
  (comparable_main_2017_present → comparable_analysis); §7
  enumeration (subset + enumeration_note documents class-level
  rationale, no `class_level` value used); §3 empirical_shape
  (null_event, 0 observed_change layers); §4 admission_tier
  (null_case, 0 strong-attribution observed_change layers); §8.5
  DRYRUN preamble present.

  Attribution posture: all rows are observed_no_change with
  attribution=none (schema-mandated for observed_no_change). No
  direct / plausible attribution is asserted because no CASP-level
  behavioral change is being claimed at this authoring date. If a
  subsequent FSCA licence-refusal or enforcement action against a
  named CASP emerges, that should be authored as a separate event
  with this row as the regulatory-perimeter parent.

scoped_claim: |
  "FSCA Declaration 2022-10-19 (Government Notice 1350, Government
  Gazette 47334) declares crypto assets a financial product under
  the South African FAIS Act, bringing persons providing FAIS-defined
  advice and intermediary services in respect of crypto assets into
  the FSP licensing perimeter, with a transitional exemption pending
  licence-application disposition (window 2023-06-01 to 2023-11-30).
  As of the 2026-05-17 authoring date no class-level offramp_cex
  behavioral change at the ZA CASP cohort attributable specifically
  to the Declaration has been observed — coded null_event / null_case
  as a S4_nation_state denominator control on the African-continent
  axis, sibling to MiCA (eu-mica-2023) and a downstream national-
  implementation companion to FATF R.15 (fatf-r15-vasp-travel-rule-
  2019)."

