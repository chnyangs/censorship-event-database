      wayback: https://web.archive.org/web/2023/https://home.treasury.gov/news/press-releases/jy2735
      evidence_use: contextual_unarchived
      note: |
        Treasury press release "Treasury Designates Virtual Currency Money
        Launderer for Russian Elites and Cybercriminals" (2023-11-03). Frames
        Zhdanova as the first OFAC action targeting a virtual-currency-
        specialized "concierge laundering" operator distinct from an exchange
        (SUEX 2021, Garantex 2022) or anonymizer/mixer (Blender 2022, Tornado
        2022, Sinbad 2023). Press release narrates: (a) March 2022 movement
        of >USD 2.3M into Western Europe for a Russian client via fraudulent
        investment account + real-estate purchases; (b) attempted ~USD 100M
        movement to the UAE for a Russian oligarch; (c) laundering for Ryuk
        ransomware affiliates with onward deposits to mainstream exchanges
        and Garantex.
