analysis_notes: |
  **DRYRUN PREAMBLE — Phase F 2026-05-16**: authored by LLM agent
  (origin=agent_draft, status=draft) without personally verifying Wayback /
  body_hash anchors. Real release must pin per-permalink snapshots and a
  human adversarial audit pass before promotion to status=admitted /
  origin=human_reviewed.

  Comparison documenting OFAC's 2023-11-03 SDN designation of Ekaterina
  Zhdanova, a Russia-based individual "concierge laundering" operator
  specialized in virtual-currency movement on behalf of Russian elites and
  ransomware affiliates (including Ryuk). Notable as the **first OFAC
  action targeting a virtual-currency-specialized concierge launderer**
  (individual-level) — distinct from the prior exchange designations
  (SUEX 2021-09-21, Garantex 2022-04-05) and the mixer/anonymizer
  designations (Blender 2022-05-06, Tornado 2022-08-08, Sinbad 2023-11-29
  three weeks later).

  Cascade structure: layers limited to offramp_cex + asset_onchain by
  construction. L4 is not_applicable (no canonical service frontend exists
  for an individual concierge launderer, in contrast to SUEX's suex.io or
  Garantex's garantex.org). L0/L1/L3 are not_applicable. The two attributed
  observations are private-sector chain-analytics tagging (Chainalysis,
  Elliptic) and KYT-flagging at counterparty mainstream CEXes + Garantex —
  both attribution=plausible because no per-exchange policy statement or
  per-tx-hash freeze artifact is pinned for this DRYRUN.

  Paper-relevant contrast vs matveev-ofac-2023 (Russian ransomware
  individual, null_event with zero observed cascade) and vs suex-ofac-2021 /
  garantex-ofac-2022 (Russian exchange-level designations with foreign
  frontend persistence): Zhdanova sits between the individual-null and
  exchange-cascade reference cases. Unlike Matveev (a ransomware
  affiliate proper), Zhdanova is named as a financial-services-sector
  facilitator with a documented on-chain wallet cluster, which gives her
  designation an asset_onchain handle that the Matveev designation lacks
  on the recent-actions page.

  DRYRUN caveats: for non-DRYRUN release, capture body_hash + body_path
  for (1) the OFAC 2023-11-03 recent-actions HTML page with verbatim
  per-address extraction of the three XBT digital-currency addresses,
  (2) the Treasury jy2735 press release permalink, (3) the Chainalysis
  post-action blog permalink, (4) the Elliptic post-action blog
  permalink, and (5) per-tx-hash anchors for the ransomware-affiliate →
  Zhdanova-wallet → exchange-deposit flow narrated in the Chainalysis
  post. Marked evidence_use=contextual_unarchived on all citations to
  flag the unarchived state per validator policy. Cross-reference the
  three XBT addresses against usdtbanlist.com (expected: no hits, native
  Bitcoin, no Circle/Tether freeze primitive) and against the SDN XML for
  redundant verification.

scoped_claim: |
  "OFAC designation of Ekaterina Zhdanova on 2023-11-03 — the first OFAC
  action targeting a virtual-currency-specialized concierge-laundering
  operator (rather than an exchange or anonymizer) — produced
  plausible-attribution cascade at the asset_onchain (chain-analytics
  tagging) and offramp_cex (KYT flagging at counterparty mainstream CEXes
  and at Garantex) layers; L0/L1/L3/L4 layers are structurally
  not_applicable for an individual-level designation with no canonical
  service frontend."

