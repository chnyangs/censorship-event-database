      evidence_use: contextual_unarchived
      note: |
        OFAC Recent Actions page for 2023-11-03 ("Russia-related Designation").
        Designation of Ekaterina ZHDANOVA (Russia-based individual) pursuant to
        Executive Order 14024 for operating in the financial services sector of
        the Russian Federation economy by laundering and moving funds using
        digital assets on behalf of Russian elites and ransomware actors
        (including the Ryuk gang). Per post-action analysis (Chainalysis,
        Elliptic, secondary reporting), three Bitcoin (XBT) digital-currency
        addresses were attached to the Zhdanova SDN entry. DRYRUN: per-address
        verbatim extraction and pinned body_hash snapshot of the
        recent-actions HTML deferred to non-DRYRUN release; marked
        evidence_use=contextual_unarchived per validator policy.
    - type: primary_legal
