analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). On 2026-03-23 Circle
  blacklisted 16 unrelated USDC business hot wallets (exchanges, casinos,
  forex platforms, payment processors), freezing their balances, citing a
  sealed U.S. civil case in a New York court. After ZachXBT publicly
  criticized the freeze as overbroad and unexplained ("ZERO basis"),
  Circle reversed several — including a Goated.com wallet holding 130,966
  USDC unfrozen 2026-03-26. comparison shape, single asset_onchain
  observed_change, attribution=plausible per §1.2 (the civil case is
  SEALED and Circle did not publicly reference an order naming the
  specific addresses; class-level inference required). jurisdiction
  corporate_global (Circle action) + US (sealed NY civil case). DATE
  CORRECTION: the bulk_wave3 candidate id encoded "2025-03", but the
  verified event date is 2026-03-23 (CCN states "March 23, 2026"
  explicitly; The Block byline 2026-03-25) — this draft uses the corrected
  id ...-2026-03. NOTE for human reviewer (codebook §1.6): asset_onchain
  observed_change carries no pinned primary_onchain blacklist tx_hash
  (deferred for drafts) — pin the blacklist tx hashes and the full
  16-address set before admission. No tx_hash or address fabricated.
  Sources verified via WebSearch + captured 2026-05-31 (CCN + The Block,
  body_hash-pinned).

scoped_claim: |
  "On 2026-03-23 Circle blacklisted 16 unrelated USDC business hot
  wallets citing a sealed NY civil case, freezing their balances, then
  reversed several (incl. a Goated.com wallet, 130,966 USDC, unfrozen
  2026-03-26) after ZachXBT criticism; single-layer asset_onchain
  observed_change, attribution=plausible (sealed case, no public order
  naming the addresses). Blacklist tx hashes + full 16-address set to be
  pinned by a human before admission (codebook §1.6)."

