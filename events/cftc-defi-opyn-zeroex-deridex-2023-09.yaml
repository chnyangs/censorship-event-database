analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission).

  comparison shape: 1 observed_change layer (l4_frontend, attribution=direct).
  On 2023-09-07 the CFTC simultaneously filed and settled orders against three
  DeFi-protocol operators — Opyn, Inc., ZeroEx, Inc. (0x), and Deridex, Inc. —
  for offering illegal leveraged/margined digital-asset-derivatives trading to
  U.S. persons on unregistered platforms, requiring each to cease and desist
  from violating the Commodity Exchange Act and pay civil penalties of
  $250,000 / $200,000 / $100,000 respectively. The orders operationalize a
  register-or-geoblock-US-users mandate against legitimate DeFi protocol
  operators; the captured release explicitly contrasts Opyn (which "took
  certain steps to exclude U.S. persons from accessing the Opyn Protocol, such
  as block[ing]" U.S. IPs, found insufficient) with Deridex (which "took no
  steps to exclude U.S. persons").

  §9 inclusion: in scope — a federal commodities regulator deliberately
  restricting legitimate DeFi protocols' service to U.S. persons (geofence /
  access denial), not a scam prosecution. These were operating DeFi protocols
  (0x/Matcha is a major DEX-aggregation protocol; Opyn an options protocol;
  Deridex a perpetuals protocol) ruled to be offering unregistered derivatives.
  This is the §9 "CFTC enforcement that restricts a legitimate platform/operator"
  category, expressed as a frontend / U.S.-person access restriction.

  trigger.type=cftc_action and research_stratum=S3_doj_sec_cftc_fiod per codebook
  §5: the CFTC is a US federal commodities regulator (S3). Sibling DeFi-
  commodities enforcement is cftc-v-ooki-dao-2022 (the CFTC's earlier DeFi/DAO
  derivatives action); binance-cftc-2023 is the contemporaneous CFTC
  derivatives action against a centralized off-ramp.

  Layer choice: load-bearing axis is l4_frontend (the operator-controlled U.S.-
  person access gate / register-or-geoblock mandate), not offramp_cex — the
  respondents are non-custodial DeFi protocol operators, not CEX off-ramps. No
  on-chain freeze primitive is implicated, so asset_onchain is not_applicable.

  attribution=direct per §1.1: the CFTC orders name the actor (CFTC) and the
  targets (the three operators) and are the instruments compelling the
  cessation toward U.S. persons. admission_tier=empirical_case (≥1
  strong-attribution observed_change layer). Sources verified via WebSearch +
  WebFetch 2026-05-31; real CFTC page captured + body_hash-pinned, all
  load-bearing facts grep-confirmed (no fabrication).

scoped_claim: |
  "The CFTC's 2023-09-07 simultaneous settlement orders (press release 8774-23)
  against three DeFi-protocol operators — Opyn, Inc. ($250,000), ZeroEx, Inc. /
  0x ($200,000), and Deridex, Inc. ($100,000) — ordered each to cease and
  desist from offering unregistered leveraged digital-asset-derivatives trading
  to U.S. persons, operationalizing a register-or-geoblock-US-users restriction
  on legitimate DeFi protocols at the operator frontend / U.S.-person access
  layer (l4_frontend load-bearing, attribution=direct). The row does not claim
  ISP-level blocking, on-chain asset freeze, or a CEX off-ramp action."

