        whose 2024 privacy-asset product-catalogue narrowing follows
        the original 2022-09 Huobi-era seven-coin privacy delisting
        (Monero/XMR, Dash/DASH, Decred/DCR, Firo/FIRO, Verge/XVG,
        Zcash/ZEC, Horizen/ZEN) and extends into the post-rebrand
        HTX 2024 batch under continued MiCA-era regulatory pressure
        and EU/UAE/South-Korea jurisdictional tightening. Marked
        evidence_use=contextual_unarchived because the precise 2024
