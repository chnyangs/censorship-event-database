analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-5 audit (S5 corporate /
  CEX privacy-asset delisting wave) by human:xiangwen as
  empirical_case. Re-dated, re-scoped, and re-sourced from the
  fabricated 2024 HTX draft to the real 2022 Huobi seven-coin
  privacy delisting. At promotion, offramp_cex observed_change/plausible with
  four independent semi_primary_wayback groups (CoinDesk
  20220912212806, Decrypt 20220912165759, CoinGeek 20220913190344,
  Cointelegraph 20220912175020), all replayable body_hash pinned.
  comparison/empirical_case preserved.

  **SOURCE UPGRADE 2026-06-01**: added the archived Huobi Global
  official support announcement (Wayback memento 20220912093023,
  body_hash sha256:213480616d1bd2d9ba4dd2c9552c3edd36ffa33b3565ce7f4ad46cc1a4837844)
  as a primary_corporate trigger and observed_change source. This
  upgrades the retained offramp_cex attribution from plausible to
  direct because Huobi itself announces the seven-token trading
  service termination and the 2022-09-19 08:00 UTC delisting start.
  primary_source_verified and last_human_audit remain unchanged
  because this was an agent source-upgrade pass, not a human audit.

  **DATE-CORRECTION 2026-05-21 (2024 -> 2022)**: the original
  agent draft asserted a 2024 "HTX" privacy-coin delisting anchored
  to a fabricated htx.com/support primary and Kaiko's 2024 tally.
  Audit verification found NO 2024 HTX privacy delisting (HTX still
  lists XMR). The real event is Huobi delisting seven privacy coins:
  announced 2022-09-12, effective 2022-09-19 08:00 UTC — Dash (DSH),
  Decred (DCR), Firo (FIRO), Monero (XMR), Verge (XVG), Zcash (ZEC),
  Horizen (ZEN), citing "latest financial regulations." The
  Huobi -> HTX rebrand (2023-09-13) is post-event and contextual
  only; the actor-of-record for this action is Huobi (Huobi Global).
  The trigger timestamp, observation timestamp, actor, target
  cohort, and sources have all been corrected accordingly. The
  fabricated htx.com/support primary and the 2024-as-primary Kaiko
  tally were removed; Kaiko is demoted to a contextual-only
  supporting-tracker. The event id is kept unchanged
  (huobi-htx-privacy-coin-delisting-2024) to avoid touching the ~20
  derived files that reference this slug; the "2024" in the id is a
  legacy-slug artifact and does NOT denote the event year, which is
  2022 per the corrected trigger/observation timestamps.

  comparison — S5 corporate-policy-change event documenting Huobi
  (Huobi Global)'s 2022-09 product-catalogue removal of seven
  privacy-asset spot-trading pairs (Dash / Decred / Firo / Monero /
  Verge / Zcash / Horizen) effective 2022-09-19 08:00 UTC, citing
  the latest financial regulations. The event is distinct from
  binance-privacy-coin-delisting-2023 (Binance Holdings Limited,
  2023-06-26, geofenced FR/IT/PL/ES EU-4 cohort). It pairs with
  okx-privacy-token-delist-2024 (OKX, 2023-12-29, global
  product-catalogue trim) and kraken-monero-eu-delisting-2024
  (Kraken, 2024-10-31, EEA-30 cohort, XMR-only) as part of the
  multi-year CEX privacy-asset delisting wave under regulatory
  compliance pressure. Huobi's 2022-09 action is the earliest of
  this cohort and the within-actor predecessor to the later
  HTX-era catalogue posture.

  Single observed_change layer (offramp_cex) with
  attribution=direct, backed by the Huobi Global official
  support announcement plus four independent semi-primary
  corroborating reports. L0 / L1 /
  L3 / l4_frontend / asset_onchain are all not_applicable on
  substrate-mismatch grounds — this is a CEX corporate-policy
  listing-restriction event keyed to base-chain privacy assets, not
  a protocol or network primitive engagement, and the L4
  announcement surface is co-located with the off-ramp catalogue
  change (treated symmetrically with the L4 handling in the three
  sibling events).

  Why empirical_case rather than anchor_case: the load-bearing
  offramp_cex observation now carries direct attribution from a
  pinned Huobi-hosted primary notice, but the event still has only
  one observed_change layer. Under codebook admission-tier rules,
  anchor_case requires at least two observed_change layers, so the
  event remains an empirical_case.

scoped_claim: |
  "Huobi (Huobi Global)'s 2022-09 product-catalogue removal of
  seven privacy-asset spot-trading pairs (Dash / Decred / Firo /
  Monero / Verge / Zcash / Horizen), effective 2022-09-19 08:00
  UTC and citing the latest financial regulations, narrows the
  centralized-exchange off-ramp surface for the affected privacy
  assets in the Huobi corridor. The offramp_cex layer carries the
  load-bearing observation; L0 / L1 / L3 / l4_frontend /
  asset_onchain are not_applicable for an exchange-listing-only
  action keyed to base-chain privacy assets. The row is the
  earliest anchor of the multi-year CEX privacy-asset delisting
  wave alongside binance-privacy-coin-delisting-2023,
  okx-privacy-token-delist-2024, and
  kraken-monero-eu-delisting-2024."

scoped_knowledge: |
  This event is the 2022 origin anchor in the multi-year CEX
  privacy-asset delisting wave. Huobi's 2022-09 seven-coin
  delisting (Dash / Decred / Firo / Monero / Verge / Zcash /
  Horizen) precedes the 2023-09-13 Huobi -> HTX rebrand and the
  later cohort actions, situating it as the within-actor
  longitudinal origin of the Huobi/HTX compliance posture and a
  cross-actor cohort member alongside Binance (geofenced EU-4,
  2023-06), OKX (global, 2023-12), and Kraken (EEA-30 XMR-only,
  2024-10).

  The cohort backbone —
  binance-privacy-coin-delisting-2023 (2023-06-26, Binance
  EU-4 cohort leader, 8-asset cohort),
  okx-privacy-token-delist-2024 (2023-12-29, OKX global
  product-catalogue trim, 4-asset cohort),
  kraken-monero-eu-delisting-2024 (2024-10-31, Kraken EEA-30
  cohort, XMR-only), and this
  huobi-htx-privacy-coin-delisting-2024 (2022-09-19, Huobi
  corporate-global, seven-coin cohort) — separates distinct S5
  corporate-response patterns to overlapping regulatory substrates:
  (a) geofenced multi-asset EU-member-state cohort (Binance),
  (b) global multi-asset product-catalogue trim (OKX), (c)
  geofenced single-asset (XMR) EEA-30 cohort (Kraken), and (d)
  corporate-global multi-asset seven-coin cohort (Huobi).

  Paper-relevant axes: (a) the regulatory-substrate /
  corporate-response coupling (financial-regulation compliance
  pressure -> multi-exchange S5 cohort), (b) the chronology axis
  (Huobi 2022 as the earliest of the cohort, predating the
  2023-09-13 Huobi -> HTX rebrand), (c) the jurisdictional-precision
  gradient across the sibling events (corporate-global vs
  member-state vs EEA-wide), and (d) the date-correction lesson
  (the legacy 2024 slug encodes neither the event year nor a 2024
  HTX action; the verified event is 2022 Huobi).

