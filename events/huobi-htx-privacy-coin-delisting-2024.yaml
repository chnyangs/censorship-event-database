      binance-privacy-coin-delisting-2023,
      okx-privacy-token-delist-2024, and
      kraken-monero-eu-delisting-2024 S5 corporate listing events.
      not_applicable on substrate-mismatch grounds.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Monero, Dash, and Zcash are independent base-chain networks;
      an HTX spot-pair removal does not engage any of those chains'
      miner / validator consensus surfaces. Off-exchange
      transferability and base-chain operation are unaffected by
      the listing action. not_applicable on substrate-mismatch
      grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      Public RPC providers' filter lists for Ethereum and EVM
      chains are not implicated by an HTX spot-pair removal
      targeting non-EVM privacy assets. No L3 measurement
      primitive applies. not_applicable on substrate-mismatch
      grounds.
  - layer: l4_frontend
    status: not_applicable
    note: |
      The HTX customer-support notice surface is the announcement
      anchor, not a separable frontend-restriction observation
      distinct from the off-ramp catalogue change. Frontend
      visibility of removed pairs collapses in lockstep with the
      off-ramp action; no independent L4 surface is pinned here.
      Treated symmetrically with the L4 handling in
      binance-privacy-coin-delisting-2023,
      okx-privacy-token-delist-2024, and
      kraken-monero-eu-delisting-2024.
  - layer: asset_onchain
    status: not_applicable
    note: |
      Monero, Dash, and Zcash are native base-chain assets without
      issuer admin freeze primitives; no token-contract-level
      freeze or admin action is engaged by the HTX listing change.
      The action is exchange-listing-only. not_applicable on
      substrate-mismatch grounds.
  - layer: offramp_cex
    status: measured
    scope:
