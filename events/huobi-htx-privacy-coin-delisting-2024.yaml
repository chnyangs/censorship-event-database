analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17** (follow-on S5
  corporate-policy candidate authored to complete the 2023-2024
  CEX privacy-asset delisting wave four-event backbone alongside
  binance-privacy-coin-delisting-2023,
  okx-privacy-token-delist-2024, and
  kraken-monero-eu-delisting-2024): authored by LLM agent without
  personally pinning the precise 2024 HTX batch-notice URL or a
  Wayback / body_hash anchor. status=draft and origin=agent_draft
  per authoring brief; this row requires human audit and
  identification + Wayback / body_hash pinning of the specific
  HTX 2024 support-article(s) before promotion to admitted /
  human_reviewed.

  comparison — S5 corporate-policy-change event documenting HTX
  (formerly Huobi; rebranded 2023-09-13)'s 2024 product-catalogue
  narrowing for the privacy-asset cohort (XMR / DASH / ZEC named
  in the Kaiko 2024 tally; the prior-window 2022-09 Huobi-era
  seven-coin cohort additionally enumerated DCR / FIRO / XVG /
  ZEN as baseline). The event is distinct from
  binance-privacy-coin-delisting-2023 (Binance Holdings Limited,
  2023-06-26, geofenced FR/IT/PL/ES EU-4 cohort) and represents
  the HTX rebrand-era continuation of the legacy Huobi 2022-09
  privacy-asset removal program into the 2024 batch window per
  Kaiko's record-year tally. Pairs with
  okx-privacy-token-delist-2024 (OKX, 2023-12-29, global
  product-catalogue trim) and kraken-monero-eu-delisting-2024
  (Kraken, 2024-10-31, EEA-30 cohort, XMR-only) as the
  four-event backbone of the 2023-2024 CEX privacy-asset
  delisting wave under MiCA-era + EU TFR-recast + South-Korea +
  UAE jurisdictional compliance pressure.

  HTX-rebrand-context (paper-relevant): the 2023-09-13
  Huobi→HTX rebrand (TRON-aligned "H + T + X" branding) sits
  between the 2022-09 Huobi-era privacy-coin delisting wave
  (seven-coin cohort, regulatory-compliance rationale) and the
  2024 batch window logged by Kaiko. The 2024 HTX delistings are
  therefore not a fresh independent event but a continuation of
  the legacy Huobi compliance program under the rebranded entity,
  which makes this row a within-actor longitudinal anchor (Huobi
  2022 → HTX 2024) in addition to its cross-actor cohort position
  alongside Binance / OKX / Kraken.

  Single observed_change layer (offramp_cex) with
  attribution=direct via the HTX customer-support hub primary
  anchor plus Kaiko-tally supporting-tracker corroboration. L0 /
  L1 / L3 / l4_frontend / asset_onchain are all not_applicable on
  substrate-mismatch grounds — this is a CEX corporate-policy
  listing-restriction event keyed to base-chain privacy assets,
  not a protocol or network primitive engagement, and the L4
  announcement surface is co-located with the off-ramp catalogue
  change (treated symmetrically with the L4 handling in the three
  sibling events).

  attribution=direct rationale (codebook §1.4 extended to S5
  offramp_cex): the actor (HTX) is both the announcing entity
  and the operator of the affected off-ramp product, and the
  legacy Huobi 2022-09 program publicly cited "latest financial
  regulations" as the compliance rationale, continued under HTX
  through 2024 per Kaiko's tally. Defaulted to direct per the
  corporate-self-cite logic; a more conservative reviewer may
  prefer plausible pending pinning of the specific 2024
  batch-notice text.

  Why empirical_case rather than anchor_case: in this DRYRUN
  pass the load-bearing offramp_cex observation carries direct
  attribution but the citation is a primary-corporate hub URL
  (not a specific batch notice) plus one supporting-tracker
  corroboration, both with provisional Wayback wildcard anchors
  (not body-hash-pinned). The trigger timestamp is logged at
  week-level precision with a calendar-year-2024 placeholder
  rather than a specific batch-notice date. Promotion to
  anchor_case requires (a) identification + Wayback / body_hash
  pinning of the specific HTX 2024 support-article(s), (b) per-
  asset effective-date enumeration (XMR / DASH / ZEC at minimum)
  to tighten timestamp precision below week-level, and (c) an
  independent semi-primary or supporting-tracker source
  confirming the post-effective-date absence of the removed spot
  pairs in HTX's public ticker listings.

scoped_claim: |
  "HTX (formerly Huobi; rebranded 2023-09-13)'s 2024 product-
  catalogue narrowing for privacy-asset spot-trading pairs
  (XMR / DASH / ZEC named in Kaiko's 2024 record-year delisting
  tally) narrows the centralized-exchange off-ramp surface for
  the affected privacy assets in the HTX corridor under
  continued MiCA-era + EU TFR-recast + Asia-Pacific regulatory
  compliance pressure. The offramp_cex layer carries the
  load-bearing direct-attribution observation; L0 / L1 / L3 /
  l4_frontend / asset_onchain are not_applicable for an
  exchange-listing-only action keyed to base-chain privacy
  assets. The row is the HTX-rebrand-era continuation of the
  legacy Huobi 2022-09 seven-coin privacy-asset delisting
  program and the fourth anchor of the 2023-2024 CEX
  privacy-asset delisting wave alongside
  binance-privacy-coin-delisting-2023,
  okx-privacy-token-delist-2024, and
  kraken-monero-eu-delisting-2024."

scoped_knowledge: |
  This event is the HTX-rebrand-era 2024 cohort anchor in the
  2023-2024 CEX privacy-asset delisting wave. The 2024 HTX
  batch sits at the intersection of two within-actor and
  cross-actor axes: (a) within-actor longitudinal continuity
  from the 2022-09 Huobi-era seven-coin delisting (XMR / DASH /
  DCR / FIRO / XVG / ZEC / ZEN) through the 2023-09-13
  Huobi→HTX rebrand into the 2024 batch window logged by
  Kaiko, and (b) cross-actor cohort membership alongside
  Binance (geofenced EU-4, 2023-06), OKX (global, 2023-12), and
  Kraken (EEA-30 XMR-only, 2024-10).

  The four-event backbone of the wave —
  binance-privacy-coin-delisting-2023 (2023-06-26, Binance
  EU-4 cohort leader, 8-asset cohort),
  okx-privacy-token-delist-2024 (2023-12-29, OKX global
  product-catalogue trim, 4-asset cohort),
  kraken-monero-eu-delisting-2024 (2024-10-31, Kraken EEA-30
  cohort, XMR-only), and this
  huobi-htx-privacy-coin-delisting-2024 (2024 batch window,
  HTX corporate-global, XMR / DASH / ZEC named) — separates
  four distinct S5 corporate-response patterns to overlapping
  MiCA-era regulatory substrates: (a) geofenced multi-asset
  EU-member-state cohort (Binance), (b) global multi-asset
  product-catalogue trim (OKX), (c) geofenced single-asset
  (XMR) EEA-30 cohort (Kraken), and (d) corporate-global
  multi-asset rebrand-continuation cohort (HTX).

  Paper-relevant axes: (a) the regulatory-substrate /
  corporate-response coupling (MiCA framework S6 + TFR recast
  S6 + APAC regulatory pressure → four-exchange S5 cohort),
  (b) the rebrand-continuity axis (Huobi 2022 → HTX 2024 as a
  single longitudinal compliance program under a re-named
  operator), (c) the jurisdictional-precision gradient across
  the four sibling events (member-state vs corporate-global
  vs EEA-wide vs corporate-global-rebrand-era), and (d) the
  Kaiko-tally record-year context (~60 delistings in 2024,
  highest since 2021) as the corpus-level denominator anchor
  for 2024 S5 privacy-asset corporate-policy actions.

