analysis_notes: |
  **NEW EVENT AUTHORED - DRYRUN 2026-05-17** (Wave 2.3 P2
  discovery-tier authoring): new discovery_only_2008_2012 event
  for the 2008 Pecunix corporate-policy bullion transfer from
  Mat Securitas Express AG (Zurich) to an undisclosed location.
  Authored by LLM agent without personally verifying Wayback /
  body_hash; origin=agent_draft and status=draft per validator
  constraint. Real release must replace this DRYRUN marker with
  a human-verified audit after pinning real archive anchors
  (the wayback URLs here are 2008 wildcard pointers, not pinned
  snapshot timestamps).

  No US sanction or order naming Pecunix in 2008 was located in
  the DRYRUN search pass; the only publicly attested 2008
  Pecunix operational change is the custody-layer bullion
  transfer documented in the "Digital gold currency" Wikipedia
  article. Trigger date 2008-06-01 is a coarse mid-2008
  placeholder with week precision; no day-level public anchor
  was recoverable. Under the prompt's "If no specific Pecunix
  2008 event found: code null_event with note" fallback, we
  considered null_event but elected to code as comparison /
  empirical_case because a specific, publicly-attested
  operational change does exist (the bullion transfer), even
  though the connection to the broader 2008 DOJ digital-gold
  enforcement cycle is plausible rather than direct.

  comparison shape: 1 observed_change layer (offramp_cex,
  Pecunix custody-layer bullion-reserves policy change).
  Sibling-by-stratum to the 2008-07 e-Gold DC guilty plea and
  the 2008-08 e-Bullion DOJ/FBI seizure (egold-doj-guilty-plea-
  2008-07, ebullion-doj-fbi-seizure-2008-08); the three events
  collectively anchor the 2008 digital-gold-currency operational
  inflection. attribution=plausible under §1.2 conservative
  default: the corporate action is causally consistent with the
  trigger framing (broader 2008 DGC enforcement cycle) but the
  Pecunix operator did not publicly reference any specific US
  trigger as the cause, and no US action names Pecunix
  specifically. Per codebook §8.4 ("when a coding decision is
  ambiguous, default to the more conservative value"),
  attribution=plausible rather than direct. L0/L1/L3/L4 and
  asset_onchain are all not_applicable: Pecunix was a centralized
  digital-gold-currency platform (off-chain ledger; physical
  bullion at Mat Securitas Zurich, then undisclosed),
  pre-dating any blockchain by ~6 months. Admission tier
  empirical_case (1 strong-attribution observed_change layer).

  Discovery-tier-only by construction: temporal_tier=
  discovery_only_2008_2012 and analysis_use=discovery_ledger_only.
  This row carries no comparable-analysis denominator weight;
  its purpose is to anchor the 2008 Pecunix operational state
  alongside the directly-enforced peer events (e-Gold, e-Bullion)
  so the discovery ledger captures the platform-survival
  counterfactual (Pecunix continued operating through the 2010s
  while its US-exposed peers did not). jurisdiction=
  corporate_global because Pecunix was Panama-incorporated with
  Swiss bullion custody and a global agent network; the bullion
  transfer was an internal corporate-custody decision with no
  single national jurisdiction as primary actor.

