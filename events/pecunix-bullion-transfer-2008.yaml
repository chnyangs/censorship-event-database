  - layer: l0_network
    status: not_applicable
    note: |
      The 2008 Pecunix bullion transfer did not invoke any ISP /
      DNS / network-layer block of pecunix.com. Public-web L0
      instruments (Censored Planet, OONI) do not apply to a 2008
      corporate operational-policy event with no network-layer
      enforcement component.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Pecunix was a centralized digital-gold-currency platform
      (gold-grams as the unit of account, administered by the
      Pecunix operator); there is no blockchain and no
      decentralized consensus layer. Out of scope; consensus-layer
      filtering surfaces did not exist for any chain in 2008
      (Bitcoin genesis 2009-01).
  - layer: l3_rpc
    status: not_applicable
    note: |
      No hosted RPC provider surface is implicated. Pecunix was a
      centralized web-account ledger pre-dating any RPC-mediated
      crypto infrastructure.
  - layer: l4_frontend
    status: not_applicable
    note: |
      The 2008 bullion transfer was a custody-layer corporate
      action; pecunix.com remained operational through and after
      the transfer (Pecunix continued operating through the
      2010s). No frontend takedown or banner is attributable.
  - layer: asset_onchain
    status: not_applicable
    note: |
      Pecunix units were off-chain ledger entries administered by
      the Pecunix operator (with physical bullion held at the
      Mat Securitas Zurich vault until the 2008 transfer), not
      blockchain tokens. No asset-layer freeze instrument exists
      to attach.
  - layer: offramp_cex
    status: partially_measured
    scope: [pecunix]
    note: |
      Load-bearing layer. Pecunix operated as a centralized
      digital-gold-currency administrator (an offramp-class
      platform routing gold-backed redemptions between customer
      accounts via third-party exchange agents). The 2008
      corporate decision to relocate the bullion backing from
      Mat Securitas Zurich to an undisclosed location is a
      custody-layer operational change at the offramp platform's
      bullion-reserve infrastructure that is publicly attested in
      Wikipedia / academic-mirror references but lacks a pinned
      contemporaneous Wayback / body_hash anchor in this DRYRUN
      pass, hence partially_measured rather than measured.
      Pecunix itself continued operating; the change is a
      reserves-custody policy shift rather than a full platform
      shutdown.

