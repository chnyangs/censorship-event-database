target:
  kind: entity
  entity: belarusian_persons_entities_eu_crypto_services_clarification_2022
  enumeration: subset
  enumeration_note: |
    Belarusian nationals, Belarusian residents, and legal persons /
    entities / bodies established in Belarus, addressed via EU-operating
    financial-service and crypto-asset-service providers. Article 1z of
    amended Regulation 765/2006 caps EU acceptance of deposits exceeding
    EUR 100,000 from Belarusian persons; the Regulation also clarifies
    that 'transferable securities' and the loans/credit measures cover
    crypto-assets, aligning Belarus measures with the parallel Russia
    regime. The target is a user class identified through CASP / bank
    KYC rather than wallet-level addresses; no on-chain address
    enumeration. Belarus is not in the project jurisdiction enum;
    jurisdiction encodes [EU, RU] to reflect the EU issuer plus the
    sibling-package alignment with the Russia track (Belarus operating
    as Russia's co-belligerent under the same OJ adoption window).
  protocol: null
  actor_type: retail_user_class_crypto_clarification
  actor_name: Belarusian nationals / residents / entities subject to EU sanctions crypto-asset clarifications
  chains: []
  canonical_domains: []

jurisdiction: [EU, RU]

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      Regulation 2022/398 does not direct ISP-level domain blocking or
      DNS interference. The crypto-asset clarifications operate at the
      EU operator KYC/compliance layer, not at the network layer.
      not_applicable on construct-not-engaged grounds, consistent with
      the sibling eu-russia-crypto-wallet-cap-2022 L0 treatment.
  - layer: l1_consensus
    status: not_applicable
    note: |
      The clarifications are operator-policy obligations on EU-licensed
      financial-service and crypto-asset-service providers, not consensus-
      layer primitives. No L1 relay / proposer / validator filtering
      primitive is engaged by the Regulation. not_applicable on
      construct-not-engaged grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      The clarifications are operator-policy-level (CASP/bank custodial
      obligation) rather than RPC-level. EU-operating CASPs implement
      compliance through KYC and account-management controls, not through
      public-RPC compliance filtering. not_applicable on
      construct-not-engaged grounds.
  - layer: l4_frontend
    status: not_measured
    note: |
      EU-operating CASPs plausibly added Belarusian-user-restriction
      notices and threshold-enforcement messaging on customer-facing
      surfaces shortly after 2022-03-09, mirroring the parallel Russia
      track. Wayback bracketing of those notices has not been pinned this
      audit; not load-bearing to admission. L4 status remains
      not_measured pending future Wayback-capture pass.
  - layer: asset_onchain
    status: not_applicable
    note: |
      The Regulation imposes obligations on CASP / bank operators, not
      on token issuers. No issuer-side admin freeze primitive is engaged
      across the affected wallets. not_applicable on
      construct-not-engaged grounds, consistent with the sibling
      eu-russia-crypto-wallet-cap-2022 asset_onchain treatment.
  - layer: offramp_cex
    status: measured
    note: |
      Regulation 2022/398 clarifies that EU financial sanctions on
      Belarusian persons extend to crypto-assets (transferable-securities
      definitional clarification + loans/credit by-any-means including
      crypto). Unlike the parallel Russia track (Regulation 2022/576's
      Article 5b explicit EUR 10K crypto-wallet/account/custody cap),
      the 2022/398 Belarus instrument does not introduce a dedicated
      crypto-wallet-cap article; it instead extends pre-existing
      sanctions categories to cover crypto. EU CASP / bank operator
      reactions on the Belarusian-customer surface have not been
      independently captured this audit; the layer is anchored by the
      EUR-Lex replayable artifact (status=measured) but carries an
      observed_no_change observation rather than observed_change. This
      is the null_event posture: trigger present, no load-bearing
      observed_change layer pinned. The null_case status records the
      Belarus-track sibling to the Russia-track 5th/8th/12th-package
      sequence as a comparable-corpus denominator row rather than as
      a substantive cascade.

