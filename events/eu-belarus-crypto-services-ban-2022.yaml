  URL has no Wayback memento). coverage[offramp_cex]
  partially_measured->measured to anchor observed_no_change row.
  Classification null_event/null_case preserved.

  S6_supranational null_case sibling to the EU Russia sanctions
  package sequence already in the corpus
  (eu-russia-crypto-wallet-cap-2022, eu-russia-full-crypto-wallet-ban-2022,
  eu-12th-russia-sanctions-2023). Anchored on Council Regulation (EU)
  2022/398 of 2022-03-09, the fifth EU sanctions package against
  Belarus. The instrument clarifies that EU financial-sector measures
  apply to crypto-assets (transferable-securities definitional
  clarification + loans/credit by-any-means including crypto) but does
  not introduce a dedicated Belarus crypto-wallet-cap article. The
  Russia-track sibling Regulation 2022/576 of 2022-04-08 (one month
  later) introduced the explicit Article 5b EUR 10K crypto-wallet/
  account/custody cap; the Belarus track did not receive a parallel
  dedicated crypto-rail article in this OJ window.

  Why null_event / null_case: no load-bearing observed_change layer
  has been pinned this audit. The offramp_cex row
  records observed_no_change with attribution=none, reflecting that
  the trigger is present but EU CASP / bank operator reactions on
  Belarusian-customer surfaces have not been captured with replayable
  artifacts. L0/L1/L3/asset_onchain are not_applicable on construct-
  not-engaged grounds (operator-policy obligation, not network /
  consensus / issuer primitive). L4 is not_measured pending Wayback
  bracketing.

  Jurisdiction encoding: Belarus is not in the project jurisdiction
  enum; jurisdiction encodes [EU, RU] to reflect the EU issuer plus
  the sibling-package alignment with the Russia track (Belarus operating
  as Russia's co-belligerent under the same OJ adoption window). The
  closest-fit choice is documented here per codebook §8.4 conservative-
  default discipline.

