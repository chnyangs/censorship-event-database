analysis_notes: |
  **NEW EVENT AUTHORED -- AGENT_DRAFT 2026-05-31**. Created from the P4
  census-gap exact-id queue after official DOJ source identification and
  Wayback capture. Direct live justice.gov capture returned DOJ/Akamai
  interstitial pages; those bad captures were deleted. The replayable anchors
  are the two Wayback mementos listed above.

  Inclusion rationale: Bitcoin Fog is structurally adjacent to Helix,
  ChipMixer, Samourai, and Sinbad as a Bitcoin-mixer enforcement case. The
  row is retained as a draft because the official DOJ sources prove the
  operator conviction/sentencing and legal forfeiture facts, but do not
  provide a public frontend seizure artifact or a transaction-level asset
  seizure anchor.

  Modeling rationale: the measured observation is narrowly `offramp_cex` as a
  mixer-operator-state criminal-finality endpoint. This is weaker than a
  same-day domain seizure and should not be promoted without human admission
  review. The P4 candidate's asset_onchain framing is deliberately downgraded:
  the 1,354/1,345 BTC figures are official legal facts, but no measured
  `asset_onchain` observation is coded until a public tx_hash, address-history
  capture, or wallet-enumerating court artifact is pinned.

scoped_claim: |
  "On 2024-03-12 DOJ USAO-DC announced Roman Sterlingov's conviction for
  operating the Bitcoin Fog darknet cryptocurrency mixer, and on 2024-11-08
  announced a 150-month sentence plus forfeiture orders. This draft models only
  the mixer-operator-state criminal-finality endpoint; it does not claim a
  same-day frontend seizure or a measured on-chain asset change until a public
  tx_hash or equivalent wallet-level anchor is pinned."

