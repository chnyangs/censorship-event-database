recovery:
  - layer: l4_frontend
    resolved: false
    note: |
      dYdX partially mitigated the over-inclusive-flag issue by
      unblocking some accounts within days of 2022-08-11 (per the
      Cointelegraph "blocking and unblocking" coverage and dYdX's
      follow-up statements). The underlying compliance-vendor
      integration was not reverted — the core L4 frontend block of
      Tornado-Cash-history-tainted accounts remains in place. The
      2025-03-21 OFAC delisting (see tornado-cash-ofac-delisting-2025)
      is the candidate upstream recovery anchor and is tracked
      separately.
  - layer: offramp_cex
    resolved: false
    note: |
      The off-ramp-side restriction (no new positions, no platform
      interaction beyond withdrawal) was likewise not lifted in the
      cascade window; same partial-rollback caveat as the L4 row
      above.

analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-5 audit (S5 corporate, Tornado,
  anchor_case) by human:xiangwen. Both observations (l4_frontend +
  offramp_cex) anchored on dYdX official blog (primary_corporate, Wayback
  20220829214213, body_hash e4f66984...) + CoinDesk (semi_primary_wayback,
  20220811213559, 4ca9dc3f...). observed_change/direct. anchor_case
  preserved.

  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase A.2
  corporate_policy discovery; lean run): authored by LLM agent
  without personally verifying Wayback/body_hash; origin=agent_draft
  per validator policy. Real release must replace this DRYRUN marker
  with a human-verified audit after pinning real archive anchors and
  promote origin to human_reviewed.

  Comparison-shape S5 corporate-policy-change event sibling to
  aave-tornado-frontend-block-2022-08 and
  uniswap-balancer-tornado-frontend-block-2022-08. The dYdX
  2022-08-11 account-block is the first major operator-acknowledged
  *history-based* "guilt by association" block in the corpus —
  accounts blocked because their wallets received Tornado-Cash-
  traceable funds at any point in the past, regardless of whether
  the holder knowingly used the mixer or whether the wallet
  currently held any Tornado-tainted balance. This is structurally
  distinct from the contemporaneous Aave (2022-08-13) and Uniswap/
  Balancer block actions, which were implemented as wallet-connect
  screening on the frontend layer alone: dYdX is structurally a
  *hybrid CEX* (centralized matching engine + onchain StarkEx
  settlement), so the same account-flag action surfaces
  simultaneously at L4 (trading UI blocked) and offramp_cex
  (trading-side venue interaction blocked, withdrawal-side preserved).
  The dual-layer cascade footprint is the paper-relevant feature
  that makes this event a comparison sibling rather than a pure
  L4 row.

  Empirical shape: comparison (2 observed_change layers — L4
  frontend and offramp_cex, both load-bearing). Admission tier:
  anchor_case (≥2 observed_change layers with attribution=direct,
  both sourced to dYdX's own 2022-08-11 statement). Stratum coding:
  S5_corporate. The OFAC SDN designation is the upstream trigger
  (related event tornado-cash-ofac-2022), but dYdX Trading Inc.
  chose to apply the block as a corporate-compliance policy via a
  third-party compliance-vendor flag — dYdX was not named in the
  OFAC designation, and the company is a non-US-jurisdictional
  exchange operator that voluntarily restricted Tornado-tainted
  accounts. The corporate-policy character is what makes this an
  S5_corporate row sibling to aave-tornado-frontend-block-2022-08
  and uniswap-balancer-tornado-frontend-block-2022-08 rather than
  an S1_ofac_sdn row.

  Note on dYdX-row deduplication: the tornado-cash-ofac-2022
  composite event already contains an offramp_cex observation
  attributed to exchange:dydx anchored on the 2022-08-10 "tornado
  outage" dYdX blog post. The present event row is a *scoped*
  S5_corporate authorship covering the 2022-08-11 dYdX policy
  statement specifically, which is one day later than the
  composite-event row and adds the L4 frontend layer (which the
  composite event did not separately enumerate for dYdX). Both
  rows reference the same underlying physical action — flagging
  and blocking accounts that interacted with Tornado Cash — but
  the present row is the canonical S5_corporate authorship and
  the composite-event row is the layer-attribution for the
  upstream OFAC trigger. The author leaves this as two retained
  rows pending human audit (a future audit pass may set
  action_id / duplicate_of_action_id to deduplicate).

  DRYRUN caveats: the four citations (dYdX blog + three
  contemporaneous journalism) all carry 2022-calendar-folder
  Wayback pointers rather than pinned snapshots; pinned snapshot
  timestamps and body_hash captures are deferred to the human-
  audit pass. For non-DRYRUN release, capture body_hash +
  body_path for: (1) the dYdX blog post permalink (the dydx.exchange
  "tornado-cash-update" URL specifically, distinct from the
  2022-08-10 "tornado-outage" post already captured under
  tornado-cash-ofac-2022); (2) the CoinDesk, The Block, and
  Cointelegraph article permalinks; optionally (3) Twitter
  threads from affected users with screenshots of the platform-
  block UI message (community evidence corroborating the
  observable user experience). Marked
  evidence_use=contextual_unarchived on all citations to flag the
  unarchived state per validator policy.

scoped_claim: |
  "dYdX's 2022-08-11 block of accounts whose wallets had any
  historical interaction with the OFAC-designated Tornado Cash
  contracts — implemented via a third-party compliance vendor
  flag at the dYdX-operated trading UI, with funds remaining
  withdrawable from flagged accounts — documents an L4-frontend
  + offramp_cex dual-layer corporate-compliance action and the
  first major operator-acknowledged history-based 'guilt by
  association' block downstream of the 2022-08-08 OFAC trigger
  (related event tornado-cash-ofac-2022). Paper-relevant as the
  hybrid-CEX vertex of the S5_corporate cascade (alongside
  aave-tornado-frontend-block-2022-08 at L4 and
  uniswap-balancer-tornado-frontend-block-2022-08 at L4)."

scoped_knowledge: |
  What changed: this row is the hybrid-CEX (l4_frontend +
  offramp_cex dual-layer) anchor for the 2022-08-08 OFAC Tornado
  Cash trigger family's S5_corporate cascade. Retained changed
  layers are L4 frontend (dYdX trading UI blocked, direct) and
  offramp_cex (dYdX venue interaction restricted while withdrawal
  preserved, direct).

  What did not change or could not be measured: L0 network is not
  applicable (the block is account-level platform logic, not DNS
  or routing); L1 consensus is not applicable (pre-Merge by 35
  days); L3 RPC is not applicable (dYdX v3 used StarkEx L2
  settlement, not the L3 managed-RPC layer); asset_onchain is not
  applicable here (the sibling asset-layer action is Circle USDC
  in circle-usdc-tornado-2022).

  Attribution: both rows are direct because the primary_corporate
  source is dYdX's own blog post naming the action, the mechanism
  (compliance-vendor flag), the upstream cause (2022-08-08 OFAC
  SDN), and the layer split (trading restricted, withdrawal
  preserved).

  Comparative value: this event has three paper-relevant
  distinctive features against the other S5_corporate Tornado-
  family rows. (1) **First major guilt-by-association anchor**:
  blocking is history-based (any past Tornado interaction) not
  current-state-based, and dYdX's statement explicitly
  acknowledges that "many account holders that never directly
  engaged with Tornado Cash" were caught — this is the corpus's
  earliest first-party operator acknowledgment of the history-
  based flagging mechanism that becomes standard practice in
  later DeFi-compliance integrations. (2) **Hybrid-CEX dual-
  layer footprint**: dYdX's centralized-matching-engine /
  onchain-StarkEx-settlement architecture means the same account
  flag surfaces at L4 (UI) and offramp_cex (venue interaction)
  simultaneously, distinct from the pure-L4 footprint of Aave
  and Uniswap/Balancer in the same week. (3) **Trading-restricted
  withdrawal-preserved off-ramp signature**: the off-ramp effect
  is not a full venue severance — flagged accounts retain
  withdrawal access — which makes this a useful comparator for
  the harder "full off-ramp severance" off-ramp cases later in
  the corpus (e.g. the various Binance-jurisdictional exits).

  Stratum coding S5_corporate (not S1_ofac_sdn) because dYdX is
  not OFAC-compelled — dYdX is incorporated outside the US, was
  not named in the OFAC designation, and exchanges/perpetuals
  venues are not themselves a regulated activity under the
  Treasury secondary-sanctions authority. The corporate-policy
  character of dYdX's voluntary action is what makes this a
  paper-relevant S5 row.

  DRYRUN risk: the four citations are unarchived; before paper-
  release the human-audit pass must pin Wayback snapshots and
  body_hashes for the dYdX blog post and three journalism links.
  If archive.org coverage of the 2022-08-11 dYdX blog revision
  proves unrecoverable, the L4 and offramp_cex observations
  should be downgraded from direct to plausible to reflect the
  weaker primary-source anchor.

