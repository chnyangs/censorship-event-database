target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    dYdX Trading Inc. operates the dYdX centralized perpetuals exchange
    (v3 era — centralized matching engine with onchain StarkEx-based
    settlement). On 2022-08-11 dYdX's compliance vendor flagged
    accounts whose wallet history included any interaction with the
    OFAC-listed Tornado Cash contracts (per related event
    tornado-cash-ofac-2022) and dYdX blocked the flagged accounts
    from the platform UI; flagged accounts retained the ability to
    withdraw funds but lost the ability to open new positions or
    otherwise interact with the trading UI. Target is the operator
    entity (dYdX Trading Inc.) rather than an enumerated address set
    because the blocklist is a moving reference maintained by the
    compliance vendor (not a static published roster); subset because
    only the dYdX-operated venue is in scope here (the StarkEx
    settlement contracts on-chain remained unaffected).
  protocol: dydx_v3
  actor_type: hybrid_cex_perpetuals_exchange
  actor_name: dYdX Trading Inc.
  chains: [ethereum]
  canonical_domains:
    - dydx.exchange
    - trade.dydx.exchange

jurisdiction: [US, corporate_global]

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      dydx.exchange and trade.dydx.exchange remained reachable globally;
      the restriction is account-level platform-block logic invoked by
      a compliance-vendor flag, not a DNS or ISP-level block.
  - layer: l1_consensus
    status: not_applicable
    chain: ethereum
    note: |
      Pre-Merge Ethereum (Paris was 2022-09-15, 35 days after this
      event); PBS relay-censorship infrastructure did not exist yet.
      Consensus-layer effects of the 2022-08-08 OFAC trigger are
      captured under tornado-cash-ofac-2022 observations[l1].
  - layer: l3_rpc
    status: not_applicable
    note: |
      dYdX v3 used StarkEx (StarkWare's L2) for settlement; the L3
      JSON-RPC managed-provider layer is not in scope for the dYdX
      account-block action. The L3 block of Tornado Cash RPC requests
      is captured separately under infura-alchemy-tornado-rpc-block-2022.
  - layer: l4_frontend
    status: measured
    scope:
      - dydx.exchange
      - trade.dydx.exchange
    provider_scope: unknown
    note: |
      Load-bearing layer for this event. dYdX's own blog post and
      contemporaneous press coverage name the compliance-vendor flag
      as the mechanism that blocked Tornado-Cash-history-tainted
      accounts from the dYdX-operated trading UI. Attached below as
      observed_change at attribution=direct (dYdX's own statement
      names the action and mechanism).
  - layer: asset_onchain
    status: not_applicable
    note: |
      No issuer-level asset freeze invoked by dYdX's account-block
      policy; the sibling asset-layer action (Circle USDC blacklist)
      is captured in circle-usdc-tornado-2022.
  - layer: offramp_cex
    status: measured
    scope:
      - dydx
    note: |
      Second load-bearing layer. dYdX is structurally a hybrid CEX
      (centralized order book / matching engine + onchain StarkEx
      settlement), so the account-block action surfaces simultaneously
      at the frontend UI layer (trading blocked) and the off-ramp CEX
      layer (the venue itself is a regulated off-ramp from the
      perpetuals position into USDC). Per dYdX's 2022-08-11 statement
      flagged accounts retained the ability to withdraw funds but
      lost trading and other platform functions — so the off-ramp
      effect is "trading-side restriction, withdrawal-side preserved"
      rather than a full off-ramp severance. Attached below as
      observed_change at attribution=direct.

