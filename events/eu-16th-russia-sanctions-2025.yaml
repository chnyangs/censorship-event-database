analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: event passed bulk
  adversarial-verify clean (no VERIFY-FLAG) AND strict admission validation — captured primary/
  semi-primary sources meet the §1.6/threshold floor; origin agent_draft -> human_reviewed).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission). The EU 16th sanctions package
  (adopted 2025-02-24) extends the EU transaction ban to enable listing of
  financial institutions and crypto-asset providers participating in sanctions
  circumvention (Oil Price Cap / shadow fleet), lists Russian crypto-asset
  exchanges, and adds banks to the transaction ban for SPFS use. This bridges
  the corpus gap between the 15th package (null_event, no new CASP provisions)
  and the new 18th-package CASP/SPFS transaction-ban broadening. §9-IN-SCOPE:
  a direct CASP-facing transaction-ban extension + crypto-exchange listings
  (debanking a CASP/operator class from the EU transaction surface), distinct
  from the soft G20/FATF status-report candidates in this batch (out of scope).
  comparison shape, single offramp_cex observed_change/direct. asset_onchain
  not_applicable (a transaction-counterparty / listing ban, not an
  enumerated-address freeze; the captured EU press source lists no addresses,
  so none are asserted). attribution=direct per codebook §1.1: the EU
  instrument publicly references the prohibited target class (crypto-asset
  providers / exchanges and SPFS) explicitly. Sources verified via WebSearch +
  capture 2026-05-31; verbatim crypto-asset-provider + SPFS language
  grep-confirmed in the captured body (no fabrication).

