analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-5 audit (S5 corporate, exchange
  exits) by human:xiangwen. Kraken support article (primary_corporate,
  Wayback 20240804114616) + Blockchain.news (semi_primary_wayback).
  offramp_cex observed_change/plausible. comparison/empirical_case preserved.

  **NEW EVENT AUTHORED -- DRYRUN 2026-05-17** (agent_draft stub). S5_corporate
  comparison documenting Kraken Futures' restriction of UK retail customer
  access to crypto-derivatives products in compliance with the FCA's PS20/10
  prohibition on the sale, marketing and distribution of crypto-derivatives
  to UK retail consumers (effective 2021-01-06).

  Coded as a corporate_policy_change trigger (S5_corporate) rather than a
  nation_state_block (S4) because the Kraken-side action is a Kraken
  corporate compliance implementation; the regulator-side action (FCA
  PS20/10) is the upstream cause but is not the actor of the recorded
  trigger here. Sibling event uk-fca-binance-markets-2021 records the
  parallel FCA-regulator track for a different exchange.

  Attribution: plausible (not direct). Per codebook §1.2 worked analogues
  (Aave/Uniswap-style provider-cited compliance blocks), Kraken publicly
  references its FCA obligations in the support pages but the FCA's
  PS20/10 does not name Kraken specifically; the prohibition is class-wide
  across UK-regulated derivatives providers. Conservative default to
  plausible per codebook §8.4.

  empirical_shape=comparison (1 observed_change layer at offramp_cex).
  admission_tier=empirical_case (1 strong-attribution observed_change
  layer).

  DRYRUN caveats: (1) exact Kraken-announcement timestamp not pinned --
  bracketed to the FCA PS20/10 effective date 2021-01-06 with day-precision;
  Kraken's customer-notice timestamp likely preceded by 1-4 weeks. For
  non-DRYRUN release, capture pinned Wayback snapshot of Kraken support
  page with the original "Last updated" timestamp. (2) body_hash + body_path
  capture deferred for all citations -- marked evidence_use=
  contextual_unarchived per validator policy. (3) Sibling cross-reference
  to uk-fca-binance-markets-2021 is the related-events anchor; both events
  describe 2021 UK regulator-driven retail-cohort restrictions but at
  different layers and via different trigger families (S4 nation_state vs
  S5 corporate compliance).

scoped_claim: |
  "Kraken Futures (Crypto Facilities Ltd) restricted UK retail customer
  access to crypto-derivatives products on or around 2021-01-06 in
  compliance with the FCA PS20/10 prohibition, retaining access only for
  customers categorised as Professional Clients under COBS 3. Primary
  observational axis is offramp_cex at the UK-retail-cohort level;
  attribution=plausible because the FCA prohibition is class-wide rather
  than Kraken-specific."

