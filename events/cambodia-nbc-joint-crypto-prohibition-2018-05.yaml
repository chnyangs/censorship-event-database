analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review: TASK-2 lower-tier Pass 2. Rendered+grepped the captured source — core restriction substantiated (5/7-7/7 terms). The wave-1/2 VERIFY-FLAG was an OFAC-template "specific-address" boilerplate that does not apply to a national ban; removed. Admitted at evidence_tier=attested_secondary (§10), single source, filterable.)
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources
  verified+captured, awaiting human admission).

  comparison documenting the 2018-05-11 joint statement by the National Bank of
  Cambodia (NBC), the Securities and Exchange Commission of Cambodia (SECC) and
  the General-Commissariat of National Police declaring crypto propagation,
  circulation, buying, selling, trading and settlement illegal without a license
  from competent authorities. Because no licensing pathway was opened, this
  functioned as a de facto national prohibition on the Cambodian crypto
  exchange/trading surface. Same nation-state-prohibition family as India RBI
  2018 and Zimbabwe RBZ 2018.

  Per codebook §5.1, trigger.type=nation_state_block is the canonical fit: a
  nation-state declaration making crypto trading/settlement illegal without a
  (non-existent) license. Per §5.2, research_stratum=S4_nation_state is
  permitted.

  Per §9 inclusion boundary: in scope — a deliberate state prohibition denying
  legitimate crypto trading/settlement service to Cambodian users, distinct from
  a fraud prosecution or a pure soft advisory (the joint statement declares the
  activity illegal, not merely risky).

  Why offramp_cex plausible (not direct): the load-bearing captured evidence is
  contemporaneous journalism (Phnom Penh Post) reproducing the joint statement,
  not the official NBC/SECC instrument text, and the prohibition is class-level
  (no exchange named). Conservative-default rule (§8.4) applied → plausible. A
  human reviewer may elevate to direct if a primary NBC/SECC instrument capture
  is pinned.

  Why L0/L1/L3/asset_onchain not_applicable: legality/licensing action,
  pre-Merge/pre-Flashbots era, no issuer-side on-chain freeze.

  Why temporal_tier=comparable_main_2017_present / analysis_use=
  comparable_analysis: 2018-05-11 sits in the 2017+ comparable corpus.

scoped_claim: |
  "On 2018-05-11 the NBC, SECC and General-Commissariat of National Police
  issued a joint statement declaring the propagation, circulation, buying,
  selling, trading and settlement of cryptocurrencies illegal without a license
  from competent Cambodian authorities; with no licensing pathway opened, this
  operated as a de facto national prohibition on the Cambodian crypto
  exchange/trading surface. The offramp_cex layer carries the load-bearing
  plausible-attribution observation at class level."

