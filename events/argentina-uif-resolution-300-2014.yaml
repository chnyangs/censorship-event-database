    status: not_applicable
    note: |
      Resolución 300/2014 imposes AML-style reporting obligations on
      obliged entities; it does not direct ISP-level domain blocking,
      DNS interference, or network-layer action. not_applicable
      consistent with sibling banking-rail / AML regulatory events
      (China 2013-12 PBOC, India RBI 2018).
  - layer: l1_consensus
    status: not_applicable
    note: |
      Bitcoin proof-of-work consensus in 2014-07 has no protocol-level
      relay-filter primitive analogous to the post-Merge Ethereum PBS
      relay surface (~8 years downstream, 2022-09-15).
      not_applicable on construct-did-not-exist grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      The MEV-Boost / Flashbots Protect / MEV-Blocker public-RPC
      compliance substrate that the L3 layer measures did not exist
      in 2014; Flashbots Protect launched 2022-11 and MEV-Blocker
      launched 2023-03-27. not_applicable on construct-did-not-exist
      grounds.
  - layer: l4_frontend
    status: not_applicable
    note: |
      The UIF resolution is an AML-reporting obligation addressed to
      Article-20 obliged entities; it does not require frontend
      changes at any specific exchange or service. No L4 frontend
      surface is in scope.
  - layer: asset_onchain
    status: not_applicable
    note: |
      Bitcoin native asset has no issuer-side blacklist / freeze
      admin method. The 2014-07 UIF resolution does not engage a
      stablecoin-issuer admin path (USDT first issued ~2014-10;
      chainwide admin freezes arose later). not_applicable on
      construct-did-not-exist grounds.
  - layer: offramp_cex
    status: partially_measured
    note: |
      Resolución 300/2014 is by construction an off-ramp-layer signal:
      it imposes STR/KYC-style reporting obligations on Argentine
      obliged entities (including casas de cambio and broker-dealers)
      in respect of virtual-currency operations, effective 2014-08-01.
      The coverage scope for the observed_no_change row below is the
      public record (Argentine and English press, exchange status
      pages, contemporaneous crypto-press) for the 90 days following
      the 2014-08-01 effective date: no specific exchange is
      documented as having cut off Argentine-resident accounts in
      that window, and the dominant 2014 bitcoin exchanges (Bitstamp,
      Bitfinex, the surviving post-collapse Mt. Gox successors, and
      the nascent local-market actors such as Ripio's predecessor
      BitPagos) did not maintain Argentina-specific compliance flags
      in the public record. Class-level Argentine obliged-entity
      exposure to AML reporting is real but not exchange-side
      observable in this authoring pass. partially_measured because
      the public-record search is bounded but not exhaustive.
