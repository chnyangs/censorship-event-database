analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17**: agent-drafted candidate
  documenting Bank Indonesia (BI) Siaran Pers No. 16/6/Dkom dated
  2014-02-06, "Pernyataan Bank Indonesia Terkait Bitcoin dan Virtual
  Currency Lainnya". BI's core position: Bitcoin and other virtual
  currencies are not currency / not a lawful payment instrument under
  Law No. 7 of 2011 on Currency (Rupiah as sole legal tender), are
  not regulated by BI, and use is at the user's own risk. This is an
  administrative warning / advisory under BI's monetary-authority
  remit — not an ISP-level block, banking-rail prohibition, or
  exchange-side action.

  Codebook compliance: trigger.type=regulatory_enforcement per §5.1
  (non-US national regulator administrative enforcement / advisory;
  the action is purely administrative — a public warning — rather
  than a network/payment-rail block, so regulatory_enforcement fits
  rather than nation_state_block). research_stratum=S4_nation_state
  per §5.2 mapping for regulatory_enforcement. target.kind=entity,
  target.enumeration=subset per §7 (class-level rationale documented
  in enumeration_note: the BI statement addresses Indonesian
  residents/businesses as a class, with no enumerated exchanges).
  analysis_use=historical_baseline per §6 canonical form for the
  historical_baseline_2013_2016 temporal tier (NOT the alias
  "contextual_baseline"). empirical_shape=null_event per §3 (0
  observed_change layers; admission via observed_no_change row at
  offramp_cex). admission_tier=null_case per §4 (0 strong-attribution
  observed_change rows).

  Why L0/L1/L3/L4/asset_onchain are not_applicable: the BI statement
  is an administrative advisory under monetary-authority remit; it
  does not direct network-layer blocking, L4 frontend changes, or
  engage any 2014-nonexistent L1/L3 PBS measurement primitive or any
  asset-issuer admin path. The L0/L1/L3/asset_onchain not_applicable
  treatment matches the sibling iceland-cbi-foreign-exchange-bitcoin-
  2014 and china-pboc-crypto-ban-2013-12 banking-/monetary-authority
  advisory pattern. offramp_cex is partially_measured because the
  90-day post-release public-record window was scanned for
  Indonesia-specific exchange cutoffs and none were located, but the
  scan is bounded.

  Why null_event / null_case rather than empirical_case: the BI
  advisory does not name specific exchanges; no exchange-side
  Indonesia-resident cutoff is documented in the public record
  within the 90-day post-release window; and the dominant 2014
  bitcoin exchanges (Bitstamp, Bitfinex, Mt. Gox) did not maintain
  Indonesia-specific compliance flags. The cascade surface is
  class-level Indonesian-resident exposure, not an enumerated
  exchange action. Per codebook §3 and §4, this admits as a
  null_event / null_case retained for historical-baseline
  contextual use, not for the 2017+ comparable-analysis denominator.

  Predecessor / successor mapping: this 2014 BI advisory is the
  predecessor to (a) BI's fuller 2017-12 ban via PBI Regulation
  No. 19/12/PBI/2017 prohibiting payment-system providers and
  financial-technology operators from processing virtual-currency
  transactions, and (b) the 2023 BAPPEBTI / Kominfo exchange-
  licensing-and-block regime (indonesia-bappebti-illegal-exchange-
  block-2023) which moved bitcoin/VC market supervision to
  BAPPEBTI's commodity-futures licensing rail. The 2014 BI position
  established the foundational Rupiah-only legal-tender framing
  that later regulators built atop.

  DRYRUN caveats: trigger primary citation is the bi.go.id Siaran
  Pers landing page; the specific Wayback snapshot timestamp and
  body_hash anchors require re-pinning in human audit. Marked
  evidence_use=contextual_unarchived on all citations per validator
  policy.

scoped_claim: |
  Bank Indonesia's 2014-02-06 Siaran Pers No. 16/6/Dkom stated the
  class-level administrative position that Bitcoin and other virtual
  currencies are not legal tender in Indonesia under Law No. 7 of
  2011 on Currency, are not regulated by Bank Indonesia, and are used
  at the user's own risk. The advisory did not direct ISP-level
  blocking, banking-rail prohibition, or exchange-side action; the
  cascade surface is class-level on Indonesian residents/businesses,
  and no exchange-side Indonesia-resident cutoff is documented in
  the public record within the 90-day post-release window, so the
  event admits as a historical-baseline null_event / null_case with
  an observed_no_change row at offramp_cex.

scoped_knowledge: |
  This event is the predecessor warning shot in Indonesia's bitcoin
  regulatory trajectory. The 2014-02-06 BI statement establishes the
  foundational legal framing — Rupiah-as-sole-legal-tender under
  Law No. 7 of 2011 — that BI's later 2017-12 PBI Regulation
  No. 19/12/PBI/2017 (prohibiting payment-system operators from
  processing VC transactions) and BAPPEBTI's 2019+ CPFAK commodity-
  futures licensing regime (culminating in the 2023 enforcement
  wave coordinated with Kominfo's ISP-level domain blocking of
  unlicensed offshore exchanges, indonesia-bappebti-illegal-
  exchange-block-2023) built atop. The 2014 advisory is a class-
  level warning rather than an enumerated-target enforcement
  action, so it admits as historical-baseline null_event /
  null_case material rather than as a comparable-analysis
  denominator row. Sibling comparison: iceland-cbi-foreign-
  exchange-bitcoin-2014 (CBI advisory acting via FX-control law
  reinterpretation) and china-pboc-crypto-ban-2013-12 (PBOC
  five-ministry notice prohibiting bank services to bitcoin)
  form, together with this Indonesia 2014 case, the earliest
  cluster of monetary-authority advisory actions on bitcoin in
  the dataset.

