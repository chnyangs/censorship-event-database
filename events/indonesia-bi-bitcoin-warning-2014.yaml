coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The 2014-02-06 BI press release does not direct ISP-level
      domain blocking, DNS interference, or network-layer action; it
      is an administrative warning / advisory under BI's monetary-
      authority remit. not_applicable consistent with sibling
      banking-/monetary-authority advisory treatments
      (iceland-cbi-foreign-exchange-bitcoin-2014).
  - layer: l1_consensus
    status: not_applicable
    note: |
      Bitcoin proof-of-work consensus in 2014-02 has no protocol-level
      relay-filter primitive analogous to the post-Merge Ethereum PBS
      relay surface. The Ethereum Merge is ~8.5 years downstream
      (2022-09-15). not_applicable on construct-did-not-exist grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      The MEV-Boost / Flashbots Protect / MEV-Blocker public-RPC
      compliance substrate that the L3 layer measures did not exist in
      2014; Flashbots Protect launched 2022-11 and MEV-Blocker launched
      2023-03-27. not_applicable on construct-did-not-exist grounds.
  - layer: l4_frontend
    status: not_applicable
    note: |
      The BI statement is a monetary-authority warning addressed to
      Indonesian residents/businesses; it does not require frontend
      changes at any specific exchange. No L4 frontend surface within
      Indonesia is in scope.
  - layer: asset_onchain
    status: not_applicable
    note: |
      Bitcoin native asset has no issuer-side blacklist/freeze admin
      method. The 2014 BI statement does not engage a stablecoin-issuer
      admin path (USDT first issued ~2014-10; chainwide admin freezes
      arose later). not_applicable on construct-did-not-exist grounds.
  - layer: offramp_cex
    status: partially_measured
    note: |
      The BI statement is by construction an off-ramp-layer signal:
      it tells Indonesian residents/businesses that Bitcoin is not a
      lawful payment instrument and is used at the user's own risk.
      The coverage scope for the observed_no_change row below is the
      public record (English and Indonesian press, exchange status
      pages, contemporaneous bitcoin-press coverage) for the 90 days
      following the 2014-02-06 release: no specific exchange is
      documented as having cut off Indonesian-resident accounts in
      that window, and the dominant 2014 bitcoin exchanges (Bitstamp,
      Bitfinex, Mt. Gox in its pre-collapse and collapse phases) did
      not maintain Indonesia-specific compliance flags in the public
      record. Class-level Indonesian-resident exposure to the BI
      warning is real but not exchange-side observable in this
      authoring pass. partially_measured because the public-record
      search is bounded but not exhaustive.
    denominator_artifact:
      type: scope_descriptor
      scope_descriptor:
        countries:
          - ID
        time_window:
          - 2014-02-06T00:00:00Z
          - 2014-05-07T00:00:00Z
      note: |
        Coverage scope: Indonesia-resident off-ramp cutoffs documented
        in the public record during the 90-day window following the BI
        2014-02-06 press release. No exchange-side Indonesia-specific
        cutoff was located in this authoring pass; a human-audit pass
        on contemporaneous Indonesian press (Kompas, Detik, Tempo,
        Bisnis Indonesia) and English crypto-press (CoinDesk, Bitcoin
        Magazine) is the gating step for a stronger denominator anchor.

