analysis_notes: |
  **SOURCE/COVERAGE REPAIRED 2026-06-02** (quality-loop scope repair):
  verified the existing OFAC Recent Actions and Treasury press-release
  replay anchors; marked the row primary-source verified; and narrowed the
  public claim to the measured venue/off-ramp legal constraint. L0, L4,
  asset-onchain, L1, and L3 are non-load-bearing for this row: no ISP/DNS
  block, frontend takedown/persistence, issuer blacklist, consensus, or RPC
  filtering claim is retained.

  Scoped release claim: the 2022-04-05 OFAC action directly designated Garantex
  and constrained the exchange at the off-ramp / venue layer. This admitted
  baseline is not yet claiming broader frontend, RPC, or consensus-layer effects.
  It is useful for testing jurisdictional and exchange-specific enforcement
  modeling before additional downstream artifacts are attached.

scoped_claim: |
  "OFAC/Treasury's 2022-04-05 designation of Garantex documents a
  Russia-operated virtual-currency exchange SDN and directly constrains
  U.S.-person dealings with the venue. This release treats the row as a
  venue/off-ramp legal-constraint datapoint only. It does not claim an
  ISP/DNS block, garantex.io frontend takedown or persistence outcome,
  issuer-side token freeze, consensus-layer filtering, or RPC filtering."

