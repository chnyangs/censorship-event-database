coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The retained public claim is not an ISP/DNS/national-firewall block.
      Garantex is modeled here as an OFAC exchange designation with a
      measured off-ramp / venue-layer legal constraint. A prior OONI query
      across garantex.io for 2022-03-05..2022-05-05 returned no public
      measurements, but that absence is not used as a claim-bearing L0
      observation because no L0 censorship action is asserted.
  - layer: l1_consensus
    status: not_applicable
    note: Exchange designation does not map cleanly to consensus filtering
  - layer: l3_rpc
    status: not_applicable
    note: |
      Pre-Merge event (Ethereum Merge 2022-09-15). The OFAC-compliance-adjacent
      public Ethereum RPC substrate (Flashbots Protect launched 2022-11,
      MEV-Blocker launched 2023-03-27) did not exist at event time. Same
      construct-did-not-exist reasoning as L1 consensus coverage for
      pre-Merge events. not_applicable rather than not_measured.
  - layer: l4_frontend
    status: not_applicable
    scope:
      - garantex.io
      - related frontend availability
    note: |
      Frontend/operator availability is not asserted in this release. This
      row is scoped to the OFAC/Treasury venue-layer designation; no
      garantex.io takedown, geofence, operator notice, or post-designation
      frontend persistence claim is retained.
  - layer: asset_onchain
    status: not_applicable
    note: |
      Trigger is modeled as an entity/exchange designation rather than an
      issuer-blacklist event. This row does not enumerate Garantex's listed
      SDN digital-currency addresses at the target level and does not retain
      a token-freeze or issuer-side blacklist observation.
  - layer: offramp_cex
    status: measured
    scope:
      - Garantex exchange operations

