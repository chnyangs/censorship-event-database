analysis_notes: |
  Scoped release claim: the 2022-04-05 OFAC action directly designated Garantex
  and constrained the exchange at the off-ramp / venue layer. This admitted
  baseline is not yet claiming broader frontend, RPC, or consensus-layer effects.
  It is useful for testing jurisdictional and exchange-specific enforcement
  modeling before additional downstream artifacts are attached.

scoped_claim: |
  "OFAC designation of Garantex on 2022-04-05 (co-designated with Hydra)
  documents a Russia-operated exchange SDN. Canonical garantex.io domain
  remained operational post-designation (observed_no_change at L4,
  reflecting absence of US infrastructure dependency for the Russian-
  operated frontend). Establishes the foreign-operated-exchange
  persistence pattern that recurs in Sinbad 2023, Grinex 2025."

