analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17** (Wave 2.3 P2 preamble;
  null-event coding per author instruction "If no clear ENS-level
  action: code null_event with note"): authored by LLM agent without
  personally verifying Wayback/body_hash; origin=agent_draft per
  validator policy. Real release must replace this DRYRUN marker
  with a human-verified audit after pinning real archive anchors
  and promote origin to human_reviewed.

  NULL-EVENT RATIONALE: The 2022-08-08 OFAC SDN designation of
  Tornado Cash produced a documented cascade across L3 RPC providers
  (Infura, Alchemy), L4 dapp frontends (Aave, Uniswap, Balancer,
  Cloudflare Ethereum Gateway, Tornado Cash's own UI), the
  source-code distribution layer (GitHub takedown), the DNS layer
  (tornado.cash web-domain seizure), and the stablecoin-issuer
  asset layer (Circle USDC freeze). The author was asked to verify
  whether an ENS-protocol-level or ENS-Labs-frontend-level reaction
  also occurred on the tornadocash.eth name and its sub-names. The
  search evidence available to the LLM author surfaces NO such
  ENS-side action: (a) no ENS Labs blog post, ENS DAO governance
  proposal, or app.ens.domains UI changelog was identified that
  blocks resolution, transfer, or management of tornadocash.eth;
  (b) the tornadocash.eth and sources.tornadocash.eth names appear
  to have continued to resolve via the public ENS resolver
  contracts and via the eth.limo HTTPS gateway in the post-trigger
  window; (c) the closest journalistic claim ("ENS Domain Goes
  Offline" in the Trustnodes 2022-08-09 headline) actually refers
  to the tornado.cash DNS web-domain, not to an ENS-protocol
  artefact. Coded empirical_shape=null_event and
  admission_tier=null_case: 0 observed_change layers, 1
  observed_no_change row at L4 frontend with attribution=none.

  ATTRIBUTION CODING NOTE: attribution=none on the observed_no_change
  row per §1 and §3; this row is a denominator-control / negative-
  result anchor and MUST NOT enter strong-attribution numerators or
  causal prose.

  DRYRUN caveats: the negative claim is supported by
  absence-of-evidence in the public LLM-accessible search corpus.
  The human-audit pass should: (1) capture a Wayback snapshot of
  app.ens.domains/tornadocash.eth from the 2022-08-09 to 2022-08-15
  window and pin its body_hash + body_path to upgrade L4 coverage
  to partially_measured; (2) confirm via the ENS DAO discussion
  forum (discuss.ens.domains) that no governance proposal to act
  on tornadocash.eth was tabled; (3) confirm via ENS Labs's
  official blog (medium.com/the-ethereum-name-service) that no
  compliance announcement on tornadocash.eth was published; (4) if
  any such artefact is found, re-code this event to
  empirical_shape=comparison and admission_tier=empirical_case with
  a real observed_change row.

  RELATED-EVENTS CHAIN: positioned alongside tornado-cash-ofac-2022
  (the upstream OFAC trigger),
  tornado-cash-frontend-tornado-cash-eth-block-2022-04 (the
  Tornado-Cash-operator-side dapp UI block that pre-dated the SDN),
  and tornado-cash-github-takedown-2022-08 (the source-code-layer
  takedown). Together with these three, this null-event row
  delineates the perimeter of the 2022-08-08 cascade: it documents
  a vertex the cascade did NOT reach, supporting denominator-side
  comparability for the corpus-level "did every plausible
  intermediary react?" question.

scoped_claim: |
  "No ENS-protocol or ENS Labs (app.ens.domains) frontend action
  to block resolution, transfer, or management of the
  tornadocash.eth ENS name or its sub-names is documented in the
  public corpus following the 2022-08-08 OFAC SDN designation of
  Tornado Cash. The name continued to resolve via the public ENS
  resolver and via the eth.limo HTTPS gateway through at least
  end-2022. Recorded as a null_event denominator-control row that
  delineates the perimeter of the 2022-08-08 cascade at the
  ENS-name-service vertex."

