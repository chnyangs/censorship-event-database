analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17**

  comparison documenting Coinbase KK's 2023-01-18 wind-down of Japan retail
  operations: announcement 2023-01-18 → fiat-deposit disabled 2023-01-20 →
  customer-withdrawal deadline 2023-02-16 → residual JPY deposited with
  Legal Affairs Bureau after 2023-02-17. Coinbase had registered with JP FSA
  in 2021-06; the exit followed the 2022 crypto-winter cost-cutting (~20%
  workforce reduction, ~950 employees) and the FSA's heavier compliance
  burden relative to retail-volume realized in Japan. Coinbase's public
  framing cites "market conditions" rather than a specific FSA enforcement
  action; coded as corporate_policy_change (S5_corporate) rather than
  regulatory_enforcement (S4_nation_state) because no JP FSA business
  improvement order or other administrative-enforcement instrument is
  attached to the exit decision.

  Sibling-event context:
    - coinbase-india-exit-2022: prior Coinbase market-retreat datapoint
      (informal NPCI pressure 2022-04, also S5_corporate market-exit).
    - japan-fsa-coincheck-orders-2018: prior JP FSA administrative-
      enforcement datapoint illustrating the regulatory-burden environment
      that Coinbase KK operated under, even though no specific FSA order
      drove Coinbase's 2023 exit.

  Attribution=direct under §1.2/§1.4 analogy: the actor (Coinbase) publicly
  states the policy and the action is the actor's own decision. Citations
  are contextual_unarchived per evidence_use rule because no Wayback /
  body_hash captures are yet pinned at this draft stage; admission promotion
  would require pinned archival captures of the Coinbase blog post and
  Bloomberg article.

scoped_claim: |
  "Coinbase KK's 2023-01-18 wind-down of Japan retail operations
  illustrates a registered-exchange market exit driven by corporate
  restructuring (2022 crypto-winter cost-cutting) rather than by a
  jurisdiction-specific enforcement order, complementing the India 2022
  informal-pressure exit and the JP FSA 2018 administrative-enforcement
  baseline."

