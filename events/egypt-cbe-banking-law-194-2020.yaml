analysis_notes: |
  **SOURCE REPAIR 2026-06-02** Official FRA regulations page and linked image-only
  Law No. 194/2020 PDF pinned locally. Rendered page 102 shows Article 206's
  prohibition on issuing, trading, promoting, creating/operating platforms for,
  or carrying out related activities involving cryptocurrency/electronic money
  without the required board license. Rendered page 110 shows Article 225's
  penalty provision including Article 206 violations. Removed
  `evidence_tier=attested_secondary`, upgraded `primary_source_verified=true`,
  and changed observation attribution from plausible to direct. Narrowed the
  claim away from the previous "no CBE license has been issued" de facto-ban
  inference because that statement is not needed for the official-law claim.

  **ADMITTED 2026-05-31** (genuine review: TASK-2 lower-tier Pass 2. Rendered+grepped the captured source — core restriction substantiated (5/7-7/7 terms). The wave-1/2 VERIFY-FLAG was an OFAC-template "specific-address" boilerplate that does not apply to a national ban; removed. Admitted at evidence_tier=attested_secondary (§10), single source, filterable.)
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission).

  comparison documenting Egypt's Central Bank and Banking System Law No. 194 of
  2020 (promulgated/published 2020-09-15, in force 2020-09-16), Article 206 of
  which strictly prohibits the issuance, trading, promotion, or operation of any
  crypto-asset platform without the required license/authorization, backed by
  imprisonment and fines up to EGP 10 million. Same nation-state-prohibition
  family as Myanmar CBM 2020 and Cambodia NBC 2018. (The CBE's earlier consumer
  warnings, e.g. Jan 2018, are context-only
  per §9; the load-bearing in-scope action is the Law 194/2020 statutory
  prohibition, not the advisory.)

  Per codebook §5.1, trigger.type=nation_state_block is the canonical fit: a
  nation-state statute making crypto issuance/trading/platform-operation illegal
  without a (non-existent) license. Per §5.2, research_stratum=S4_nation_state is
  permitted.

  Per §9 inclusion boundary: in scope — a deliberate state prohibition denying
  legitimate crypto issuance/trading/platform-operation service to Egyptian
  users, enforced by criminal penalties (imprisonment + fines), distinct from the
  CBE's prior soft consumer warnings (which would be context-only).

  Why offramp_cex direct: the official FRA-hosted legal PDF itself contains the
  Article 206 crypto/electronic-money prohibition and the Article 225 penalty
  provision including Article 206 violations. The law-firm source is retained as
  English-language corroboration, but it is no longer load-bearing.

  Why L0/L1/L3/asset_onchain not_applicable: legality/licensing action,
  pre-Merge/pre-Flashbots era, no issuer-side on-chain freeze.

  Why temporal_tier=comparable_main_2017_present / analysis_use=
  comparable_analysis: 2020-09-15 sits in the 2017+ comparable corpus.

  Remaining limitation: the official PDF is image-only, so replay depends on the
  captured PDF body hash plus rendered page verification rather than text grep.

scoped_claim: |
  "On 2020-09-15 Egypt promulgated Central Bank and Banking System Law No. 194 of
  2020, whose Article 206 strictly prohibits the issuance, trading, promotion, or
  operation of cryptocurrency/electronic-money platforms or related activities
  without the required board license, backed by penalties that include
  imprisonment and fines up to EGP 10 million. The offramp_cex layer carries the
  load-bearing direct-attribution observation at class level."

