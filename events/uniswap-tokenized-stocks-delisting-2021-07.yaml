analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase A.2 corporate_policy
  discovery; lean run): authored by LLM agent without personally
  verifying Wayback/body_hash; status=draft / origin=agent_draft per
  validator. Real release must replace this DRYRUN marker with a
  human-verified audit after pinning real archive anchors (the
  2021-07-23 announcement page body_hash, the precise commit
  hash(es) on @uniswap/default-token-list, and the supporting-
  journalism article URL slugs).

  comparison — S5 corporate-policy-change event documenting Uniswap
  Labs' 2021-07-23 frontend token-list restriction of approximately
  100 tokenized-equity / option / synthetic-equity tokens from
  app.uniswap.org. This is the **2021 antecedent** of the larger
  2023 sibling event uniswap-frontend-delisting-2023; together they
  bracket the Uniswap Labs frontend-restriction timeline before and
  after the August 2022 SEC subpoena to Uniswap Labs (CoinDesk
  2022-09 reporting) and the 2024 SEC Wells Notice (see
  sec-v-uniswap-wells-notice-2024). Critically, the 2021-07-23 action
  is **preemptive**: no SEC enforcement instrument had been issued
  against Uniswap Labs at that date — the announcement framed the
  delisting as the company's own response to "the evolving regulatory
  landscape" rather than a response to a specific subpoena, complaint,
  or order. This makes the row the cleanest 2021 example in the
  dataset of an L4 frontend-operator compliance action taken in
  anticipation of (not in reaction to) US securities-enforcement
  pressure.

  Single observed_change layer (l4_frontend) with attribution=direct
  via the Uniswap Labs frontend operator primary anchor. L0 / L1 /
  L3 / asset_onchain / offramp_cex are all not_applicable on
  substrate-mismatch grounds — this is a frontend-only token-list
  catalogue change at the Uniswap-Labs-operated UI, not a
  protocol, network, token-contract, or CEX off-ramp engagement.
  The frontend / protocol split (the Uniswap Protocol smart contracts
  remained autonomous and permissionless throughout) is the same
  decoupling that anchors the 2023 sibling event.

  Why empirical_case rather than anchor_case: in this DRYRUN pass
  the load-bearing l4_frontend observation carries direct attribution
  but no citation is body-hash-pinned. Promotion to anchor_case
  requires (a) the Uniswap-Labs announcement page body_hash /
  body_path pin, (b) the precise commit hash(es) on
  @uniswap/default-token-list capturing the 2021-07-23 token-cohort
  removal diff, and (c) human-archived supporting-journalism
  citations (The Block / CoinDesk / Decrypt / Cointelegraph
  2021-07-23 coverage) with pinned-timestamp Wayback snapshots
  or body_hash anchors. Until that audit lands the row sits at
  status=draft / origin=agent_draft.

scoped_claim: |
  "Uniswap Labs' 2021-07-23 restriction of approximately 100
  tokenized-equity / option / synthetic-equity tokens from the
  app.uniswap.org frontend UI — taken preemptively, with no SEC
  enforcement instrument issued at that date and without
  corresponding action at the Uniswap Protocol smart-contract layer
  — documents the 2021 antecedent of the 2023 sibling
  uniswap-frontend-delisting-2023 and the cleanest 2021 example in
  the dataset of an L4-only frontend-operator compliance action
  taken in anticipation of (not in reaction to) US
  securities-enforcement pressure."

scoped_knowledge: |
  This event is the 2021 precursor row in the Uniswap-Labs
  frontend-restriction timeline: 2021-07-23 (this row, preemptive,
  tokenized-equity cohort) → 2022-08 SEC subpoena to Uniswap Labs
  (reported 2022-09; coded separately if admitted) → 2023-07-21
  broader frontend token-list restriction (uniswap-frontend-
  delisting-2023, ~100+ tokens, broader regulatory categories) →
  2024 SEC Wells Notice (sec-v-uniswap-wells-notice-2024).
  Together the rows form the multi-year Uniswap-Labs L4-only
  corporate-compliance arc absent a direct OFAC trigger.

  Paper-relevant axes: (a) the preemptive vs reactive split within
  S5 corporate-frontend-restriction actions — this row is the
  clean 2021 preemptive anchor, the 2023 sibling is the
  post-subpoena reactive expansion, and the 2024 Wells Notice
  is the formal enforcement instrument; (b) the frontend /
  protocol decoupling at L4 (the underlying Uniswap Protocol
  smart contracts and the removed tokens' ERC-20 contracts were
  unaffected in both 2021 and 2023 actions, providing a
  longitudinal pair of "L4-only" cascade shapes within one
  operator); (c) the tokenized-equity cohort scope (Mirror
  mAssets, Synthetix sAssets, Opyn / Hegic option tokens) as
  the 2021-specific subset, vs the 2023 broader regulatory-
  category set (privacy-adjacent, SEC-securities-flagged,
  FTX-related, etc.) — useful for cohort-evolution analysis
  across two L4 actions by the same operator.

