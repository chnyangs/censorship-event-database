  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources verified+captured,
  awaiting human admission).

  Morocco's Office des Changes (Foreign Exchange Office), Bank Al-Maghrib and the Ministry
  of Economy and Finance issued a joint public statement on 2017-11-21 declaring that
  transactions made via cryptocurrencies are banned and punishable by fines, because they
  violate the foreign-exchange regulations requiring transactions with foreign countries to
  pass through authorized intermediaries and in currencies listed by Bank Al-Maghrib. This
  is a binding FX-control prohibition with penalties, in scope under codebook §9 (a
  deliberate state restriction on a crypto transaction surface), not a soft "not legal
  tender" advisory.

  Why trigger.type=regulatory_enforcement: per §5.1, the Office des Changes action is
  non-US national regulator administrative enforcement (an FX-law prohibition with fines),
  not an ISP/DNS network block. Matches the bangladesh-bb-bitcoin-warning-2014 sibling.

  Why attribution=plausible: per §1.5 + §8.4, contemporaneous report captured but the
  official Office des Changes communiqué primary text not captured in this pass;
  conservative plausible.

  Why comparable_main_2017_present / comparable_analysis: 2017 event, post-2017 tier.

  Draft pending human audit of (i) the official Office des Changes / Bank Al-Maghrib
  communiqué primary text and (ii) any quantitative offramp_cex measurement.

scoped_claim: |
  Morocco's Office des Changes and Bank Al-Maghrib declared on 2017-11-21 that
  cryptocurrency transactions are banned and punishable by fines under the foreign-exchange
  regulations. Effect carried at offramp_cex (observed_change, plausible) at class level.

