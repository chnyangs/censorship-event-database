analysis_notes: |
  **REPAIRED 2026-06-01** (automated primary-source repair). Located and
  captured the official Office des Changes page plus its official PDF attachment.
  The PDF is dated 2017-11-20 and both official anchors carry the load-bearing
  prohibition: transactions via virtual currencies constitute an infraction of
  Morocco's foreign-exchange regulations and are subject to sanctions and fines.
  Removed evidence_tier=attested_secondary; Morocco World News and Freeman Law
  remain only as corroboration/context.

  **ADMITTED 2026-05-31** (genuine review: TASK-2 lower-tier Pass 2. Rendered+grepped the captured source — core restriction substantiated (5/7-7/7 terms). The wave-1/2 VERIFY-FLAG was an OFAC-template "specific-address" boilerplate that does not apply to a national ban; removed. Since upgraded from evidence_tier=attested_secondary by primary-source repair.)
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources verified+captured,
  awaiting human admission).

  Morocco's Office des Changes (Foreign Exchange Office) issued a public communique
  dated 2017-11-20 declaring that transactions made via virtual currencies constitute
  infractions of the foreign-exchange regulations and are punishable by sanctions and
  fines, because foreign financial transactions must pass through authorized
  intermediaries and use foreign currencies quoted by Bank Al-Maghrib. This is a
  binding FX-control prohibition with penalties, in scope under codebook §9 (a
  deliberate state restriction on a crypto transaction surface), not a soft "not legal
  tender" advisory.

  Why trigger.type=regulatory_enforcement: per §5.1, the Office des Changes action is
  non-US national regulator administrative enforcement (an FX-law prohibition with fines),
  not an ISP/DNS network block. Matches the bangladesh-bb-bitcoin-warning-2014 sibling.

  Why attribution=plausible: official primary text is now captured, but the instrument
  is class-level and does not name specific exchanges, intermediaries, addresses, or
  domains. Conservative class-level attribution remains plausible.

  Why comparable_main_2017_present / comparable_analysis: 2017 event, post-2017 tier.

  Remaining follow-up: any quantitative offramp_cex measurement or operator-side
  implementation artifact would further strengthen the case shape, but the legal
  trigger and class-level denominator are now primary-source anchored.

scoped_claim: |
  Morocco's Office des Changes declared in its 2017-11-20 communique that virtual-currency
  transactions constitute infractions of the foreign-exchange regulations and are
  punishable by sanctions and fines. Effect carried at offramp_cex (observed_change,
  plausible) at class level, with official Office des Changes HTML and PDF anchors.

