analysis_notes: |
  Scoped release claim: the 2023-01-18 DOJ and FinCEN action directly disrupted
  Bitzlato's exchange operations at the off-ramp / venue layer. This admitted
  baseline is not claiming a multi-layer cascade. It is a narrow enforcement-led
  comparison event used to test whether the schema can represent institution-level
  disruptions, not only protocol sanctions. Additional frontend and downstream
  partner reactions are out of scope for this release and can be added later if
  concrete artifacts are collected.

scoped_claim: |
  "DOJ indictment of Bitzlato and its founder on 2023-01-18 — paired with
  FinCEN's Section 9714 special measure designation of Bitzlato as a
  'primary money laundering concern' — produced a same-day L4 seizure of
  bitzlato.com. First application of FinCEN Section 9714 to a crypto
  exchange; structurally distinct from pure-OFAC or pure-DOJ paths."

