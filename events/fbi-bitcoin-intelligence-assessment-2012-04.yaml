analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN Wave 2.2D 2026-05-17**. Discovery-tier
  authoring (discovery_only_2007_2012). Authored by LLM agent without
  personally verifying Wayback/body_hash; origin=agent_draft and
  status=draft per validator constraint (agent_draft incompatible
  with admitted). Real release must replace this DRYRUN marker with
  a human-verified audit after pinning real archive anchors (the
  wayback URLs here are 2012 wildcard pointers, not pinned snapshot
  timestamps).

  **STATUS: REJECTED 2026-05-20 (c) Batch C-2 event 7/22**.

  REJECTION RATIONALE: This event records the FBI Cyber Intelligence
  Section and Criminal Intelligence Section intelligence assessment
  "(U) Bitcoin Virtual Currency: Unique Features Present Distinct
  Challenges for Deterring Illicit Activity" dated 2012-04-24, which
  was originally classified (U//LES // FOUO) and was LEAKED to
  WikiLeaks ~2013-03, then re-hosted by Just Security in 2014-04.

  v0.3 audit determined this event does NOT fit the S3_doj_sec_cftc_fiod
  enforcement-events stratum: (a) it is an internal intelligence
  assessment, not an enforcement action — no indictment, no order, no
  SDN designation, no seizure; (b) trigger.type=doj_indictment is
  misframed (author's own analysis_notes acknowledge this); (c) all
  three captured sources are leaked-document MIRRORS (Just Security PDF,
  WikiSpooks PDF mirror, Bitcointalk discussion thread) — there is no
  official FBI publication anchor; (d) target is class-level (Bitcoin
  protocol and Bitcoin-using illicit actors) with no enumerated entity
  or address; (e) the policy-precedent / posture-formation framing the
  draft offers is real but is dispersed across downstream enforcement
  events (Silk Road 2013, SEC v. Shavers/BTCST 2013, FinCEN 2013-G001,
  Ripple/XRP 2015) which carry the load-bearing cascade rows in their
  own files.

  Retention as REJECTED REFERENCE (Option-A pattern, same as
  sec-v-uniswap-wells-notice-2024 + ofac-hamas-irgc-virtual-currency-
  network-2024-01): the leaked document IS a real historical artifact
  with policy-precedent value, but it belongs in an "intelligence
  assessment" or "policy posture" stratum (not in this database's
  current vocabulary) rather than in S3 enforcement events. discovery_
  only_2008_2012 tier means analytical impact is near zero either way.
  Future curation could add a new strata enum (e.g., S7_intelligence_
  assessment or S0_pre_bitcoin_policy_baseline) and re-admit, OR delete
  this event_id entirely.

  Why null_event / null_case / coverage_gap: this event's load-
  bearing function is policy-precedent / intelligence-posture-
  forming rather than cascade-producing. The assessment is an
  internal analytical product, not an enforcement action. It names
  no entity, no wallet, no domain; it orders no block, no seizure,
  no takedown. The substantive cascade — US federal intelligence-
  community attention to Bitcoin as illicit-finance vector —
  unfolds dispersedly across the 2013-2016 enforcement era rather
  than as a single observable point-in-time offramp event. The
  cascade-shape grammar of the schema does not natively express
  class-level policy-precedent intelligence assessments, so this
  event is coded honestly as null_event (0 observed_change layers)
  / null_case (0 strong-attribution observed_change), with the
  single observation row expressing the class-level coverage_gap.
  The downstream enforcement events (silk-road-doj-seizure-2013,
  sec-shavers-btcst-2013, ripple-fincen-xrp-2015) carry the load-
  bearing observed_change rows in their own event files.

  Why discovery_only_2007_2012 tier: per the 2008+ tiered frame in
  sampling/frame.yaml, the 2012-04-24 authorship date places this
  event in the discovery_only_2007_2012 temporal tier.
  analysis_use=discovery_ledger_only excludes this row from the
  2017+ comparable-analysis denominator, matching the validator's
  tier-vs-analysis-use consistency rule. This row carries no
  comparable-analysis denominator weight; its purpose is to anchor
  the 2008+ pre-Bitcoin-enforcement intelligence-posture predicate
  for the FBI-2012 → Silk-Road-2013 → FinCEN-2013-G001 → Shrem-2014
  lineage already in corpus.

  Schema-enum surprises encountered during authoring:
  - trigger.type has no "intelligence_assessment" enum; per the
    authoring brief the closest enum match within the S3 stratum is
    doj_indictment because the FBI is a DOJ component agency and
    the assessment is the intelligence-cycle predicate for
    subsequent DOJ enforcement. court_civil_order was considered
    and rejected as a worse fit (the assessment is not a court
    action). The stratum-actor map in codebook §5.2 permits
    doj_indictment within S3_doj_sec_cftc_fiod.
  - target.kind has no regulatory_class enum; fell back to
    target.kind=entity with target.enumeration=subset and an
    enumeration_note that records the class-level character (per
    codebook §7: class_level is not a valid enumeration value).
  - empirical_shape has no case_study enum; mapped the class-level
    policy-precedent posture to null_event + null_case +
    observation_kind=coverage_gap.
  - observation_kind has no not_observed enum; used coverage_gap
    with attribution=none, which is the same pattern used by
    fincen-virtual-currency-msb-guidance-2013 for class-level
    regulatory-predicate events.

  status remains draft until a human review decides whether to:
  (1) admit the event as null_case at empirical_shape=null_event
      after rewriting the predicate observation as
      observed_no_change with a falsifiable 2012-04-24 to 2016-12-31
      scope_descriptor and a replayable archival anchor (since
      coverage_gap is not admitted at status=admitted), or
  (2) retire this event entirely and let the downstream enforcement
      events (Silk Road 2013, SEC v. Shavers/BTCST 2013, FinCEN
      FIN-2013-G001, Ripple/XRP I 2015) carry the discovery-tier
      anchor function on their own, with the FBI 2012 assessment
      cited as policy precedent in their analysis_notes rather
      than as a free-standing event.

  Origin=agent_draft and status=draft per the agent-authoring
  convention.

scoped_claim: |
  The FBI Cyber Intelligence Section / Criminal Intelligence Section
  assessment "Bitcoin Virtual Currency: Unique Features Present
  Distinct Challenges for Deterring Illicit Activity" (2012-04-24,
  leaked via WikiLeaks ~2013-03) is the first major US federal
  intelligence assessment of Bitcoin as an illicit-finance policy
  concern. observation_kind=coverage_gap with attribution=none
  because the substantive cascade is dispersed across downstream
  enforcement actions (Silk Road 2013, SEC v. Shavers/BTCST 2013,
  FinCEN FIN-2013-G001, Ripple/XRP I 2015) that inherit the
  intelligence-posture predicate, rather than localized to a single
  observable point-in-time CEX cessation. Discovery-tier only; not
  used in main statistical denominators.

