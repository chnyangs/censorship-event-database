trigger:
  type: doj_indictment
  actor: US_FBI
  timestamp: 2012-04-24T00:00:00Z
  timestamp_precision: day
  citation:
    - type: primary_legal
      url: https://www.justsecurity.org/wp-content/uploads/2014/04/FBI.CyberIntelligenceCriminalIntelligence.2012.pdf
      wayback: https://web.archive.org/web/2012/https://www.justsecurity.org/wp-content/uploads/2014/04/FBI.CyberIntelligenceCriminalIntelligence.2012.pdf
      evidence_use: contextual_unarchived
      note: |
        FBI Cyber Intelligence Section and Criminal Intelligence
        Section intelligence assessment, "(U) Bitcoin Virtual
        Currency: Unique Features Present Distinct Challenges for
        Deterring Illicit Activity," dated 2012-04-24 (with
        contributions from the FBI Detroit Division). The assessment
        was originally classified (U//LES // FOUO) and was leaked to
        WikiLeaks where it became publicly available ~2013-03;
        Just Security re-hosted a PDF copy in 2014-04. The assessment
        characterizes Bitcoin as a decentralized peer-to-peer virtual
        currency providing "a venue for individuals to generate,
        transfer, launder, and steal illicit funds with some
        anonymity," and judges with "medium confidence" that cyber
        criminals would increasingly treat Bitcoin as an alternative
        payment option alongside more traditional virtual currencies.
        The document is the first major US federal intelligence
        assessment of Bitcoin as a policy concern and is widely
        cited as a precedent for the subsequent 2013-2016 US
        enforcement era (Silk Road 2013, SEC v. Shavers/BTCST 2013,
        FinCEN FIN-2013-G001, Ripple/XRP I 2015). The trigger.type
        enum has no "intelligence_assessment" value; doj_indictment
        is the closest available match within the S3 stratum because
        the FBI is a DOJ component agency and the assessment is the
        intelligence-cycle predicate for subsequent DOJ enforcement.
        evidence_use=contextual_unarchived because no body_hash has
        been pinned in this DRYRUN authoring pass; the Just Security
        PDF host and WikiLeaks mirror remain publicly accessible and
        a 2012/2013 Wayback bracketing is straightforward in a
        follow-up human-audit pass. Provisional year-prefix wayback
        anchor pending re-pin.
    - type: supporting_journalism
      url: https://wikispooks.com/w/index.php?title=File:Bitcoin-FBI.pdf
      wayback: https://web.archive.org/web/2012/https://wikispooks.com/w/index.php?title=File:Bitcoin-FBI.pdf
      evidence_use: contextual_unarchived
      note: |
        WikiSpooks mirror of the leaked FBI intelligence assessment
        PDF, hosting the same 2012-04-24 document. Retained as a
        corroborating mirror anchor for the primary Just Security
        PDF; the leaked-document provenance dates the public
        availability to ~2013-03 via WikiLeaks. evidence_use=
        contextual_unarchived for this DRYRUN authoring pass.
    - type: supporting_community
      url: https://bitcointalk.org/index.php?topic=216248.0
      wayback: https://web.archive.org/web/2012/https://bitcointalk.org/index.php?topic=216248.0
      evidence_use: contextual_unarchived
      note: |
        Bitcointalk.org community thread (started 2013-05) discussing
        the leaked FBI 2012-04-24 intelligence assessment, recording
        the contemporaneous Bitcoin-community reception of the
        assessment. Retained as a supporting_community anchor for
        the document's reception trajectory, not as a load-bearing
        legal anchor.
  timestamp_sources:
    - type: primary_legal
      note: |
        Day-level precision per the 2012-04-24 internal-date stamp on
        the FBI intelligence-assessment cover page. The public-
        availability date via WikiLeaks is ~2013-03; this event
        codes the assessment-authorship date (2012-04-24) as the
        trigger timestamp because the discovery-tier analytical
        question is when the US federal intelligence community
        formed a class-level posture on Bitcoin, not when that
        posture became publicly leaked.

target:
  kind: entity
  entity: "Bitcoin protocol and Bitcoin-using illicit actors (US federal intelligence-assessment class)"
  enumeration: subset
  enumeration_note: |
    Canonical target of this assessment is the regulatory / policy
    class "Bitcoin and Bitcoin-using cyber criminals" rather than any
    named exchange, mixer, or address set. The assessment surveys
    Bitcoin's protocol-level properties (decentralization, pseudo-
    anonymity, P2P transfer) and the illicit-finance threat surface
    that those properties present to US federal law enforcement, but
    it does not designate, indict, sanction, or otherwise act against
    any specific entity, wallet, or domain. Marked enumeration=subset
    (per codebook §7: class_level is not a valid enumeration value)
    with this enumeration_note recording the class-level posture.
    actor_name labels the regulated/surveilled class; no on-chain
    addresses or canonical_domains are enumerated because the
    assessment does not name any.
  actor_type: regulatory_class
  actor_name: "Bitcoin protocol and Bitcoin-using illicit actors (US federal intelligence-assessment class)"
  chains:
    - bitcoin
  canonical_domains: []

jurisdiction:
  - US

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The 2012-04-24 FBI intelligence assessment is an internal
      analytical product. It does not direct, request, or contemplate
      any ISP-level domain blocking or DNS interference against
      bitcoin.org or any Bitcoin-related host. not_applicable on
      construct-out-of-scope grounds.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Bitcoin proof-of-work consensus in 2012-04 has no protocol-
      level relay-filter primitive analogous to the post-Merge
      Ethereum PBS relay surface that the L1 layer was constructed
      to measure. The Ethereum Merge itself is ~10 years downstream
      (2022-09-15). not_applicable on construct-did-not-exist
      grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      The MEV-Boost / Flashbots Protect / MEV-Blocker public-RPC
      compliance substrate that the L3 layer measures did not exist
      in 2012 (Flashbots Protect launched 2022-11; MEV-Blocker
      launched 2023-03-27). not_applicable on construct-did-not-
      exist grounds.
  - layer: l4_frontend
    status: not_applicable
    note: |
      The assessment does not require, name, or contemplate any
      Bitcoin-related frontend takedown or geo-blocking. It is an
      internal intelligence product, not an operational order.
      not_applicable on construct-out-of-scope grounds.
  - layer: asset_onchain
    status: not_applicable
    note: |
      The assessment does not engage stablecoin-issuer or token-
      issuer admin-key freeze primitives. USDT was first issued
      ~2014-10; chain-wide issuer admin freezes arose later; the
      2012-04 FBI assessment pre-dates the stablecoin admin-freeze
      regulatory frame entirely. not_applicable on construct-out-
      of-scope grounds.
  - layer: offramp_cex
    status: measured
    scope:
      - us_federal_intelligence_assessment_class
    note: |
      The substantive policy effect of the 2012-04-24 FBI assessment
      is class-level: it establishes the US federal intelligence
      community's first formal posture toward Bitcoin as an illicit-
      finance concern. The cascade, however, is dispersed across the
      2013-2016 enforcement era (Silk Road 2013, SEC v. Shavers/
      BTCST 2013, FinCEN FIN-2013-G001, Ripple/XRP I 2015) rather
      than localized to any single point-in-time CEX or offramp
      event. Marked not_measured because the load-bearing cascade
      is class-level and posture-establishing rather than point-in-
      time observable; the corresponding observation row records
      this as a coverage_gap.

