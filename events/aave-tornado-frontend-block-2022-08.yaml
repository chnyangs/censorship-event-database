    resolved: false
    note: |
      Aave partially mitigated the dust-attack false-positive issue
      by removing falsely flagged wallets from the TRM-driven
      blocklist within days of 2022-08-13 (e.g. Justin Sun and other
      dust-flagged accounts regained app.aave.com access). The
      underlying TRM Labs / Chainalysis compliance-screening
      integration itself was not reverted — the core L4 frontend
      block of Tornado-Cash-interacting wallets remains in place.
      The 2025-03-21 OFAC delisting (see
      tornado-cash-ofac-delisting-2025) is the candidate upstream
      recovery anchor and is tracked separately.

analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-5 audit (S5 corporate, Tornado) by
  human:xiangwen. Aave tweet (primary) unarchivable -> 2 semi_primary_wayback
  (CryptoSlate + Blockworks, Wayback 20220814221048 / 20221121141935).
  attribution direct->plausible. l4_frontend observed_change/plausible.
  comparison/empirical_case preserved.

  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase A.2
  corporate_policy discovery; lean run): authored by LLM agent
  without personally verifying Wayback/body_hash; origin=agent_draft
  per validator policy. Real release must replace this DRYRUN marker
  with a human-verified audit after pinning real archive anchors and
  promote origin to human_reviewed.

  Comparison-shape S5 corporate-policy-change event sibling to
  uniswap-frontend-delisting-2023 (the canonical L4-only
  frontend-delisting anchor). Aave's 2022-08-13 frontend block is
  the earliest documented L4 DeFi-frontend compliance action in the
  Tornado Cash 2022 cascade family, and the only event in the corpus
  that names TRM Labs (rather than Chainalysis) as the screening-API
  provider. Paper-relevant because it isolates the same
  frontend-operator / protocol-layer split documented under
  uniswap-frontend-delisting-2023, but with two distinguishing
  features: (a) the trigger is an upstream OFAC SDN action (rather
  than the frontend operator's independent compliance judgment), and
  (b) the mechanism is an off-the-shelf compliance-screening API
  rather than a curated token-list. Together with
  infura-alchemy-tornado-rpc-block-2022 (L3) and
  circle-usdc-tornado-2022 (asset_onchain), this row completes the
  S5_corporate cascade triangle downstream of the 2022-08-08 OFAC
  Tornado Cash designation: asset-issuer (Circle, ~6h),
  RPC-provider (Infura/Alchemy, ~24h), frontend-operator (Aave,
  ~120h / 5 days). The 5-day lag relative to the upstream OFAC
  trigger (2022-08-08) is paper-relevant for the cascade-latency
  comparison and is tracked at the cross-event level (delta_hours
  inside this event is 0 because the Aave trigger and the Aave
  observation share a day-precision timestamp).

  Empirical shape: comparison (1 observed_change layer — L4 frontend
  load-bearing). Admission tier: empirical_case (≥1 observed_change
  layer with direct attribution). Stratum coding: S5_corporate. The
  OFAC SDN designation is the upstream trigger (related event
  tornado-cash-ofac-2022), but Aave Companies / Aave DAO chose to
  apply the block as a corporate-compliance policy via an
  off-the-shelf TRM Labs API integration — Aave was not named in
  the OFAC designation, and DeFi-frontend operators are not
  themselves a regulated activity under the Treasury secondary-
  sanctions authority. The corporate-policy character is what makes
  this an L4 row sibling to uniswap-frontend-delisting-2023 rather
  than an S1_ofac_sdn row.

  DRYRUN caveats: the four citations (Aave Twitter + three
  contemporaneous journalism) all carry 2022-calendar-folder
  Wayback pointers rather than pinned snapshots; pinned snapshot
  timestamps and body_hash captures are deferred to the
  human-audit pass. For non-DRYRUN release, capture body_hash +
  body_path for: (1) the Aave Twitter status anchor of 2022-08-13;
  (2) the Blockworks, CryptoSlate, and Decrypt article permalinks;
  optionally (3) a TRM Labs blog post or case study describing the
  Aave integration (the TRM Labs / Aave engagement is documented
  in the Decrypt profile but the firm did not publish a standalone
  post about the Aave integration). Marked
  evidence_use=contextual_unarchived on all citations to flag the
  unarchived state per validator policy.

scoped_claim: |
  "Aave's 2022-08-13 integration of a TRM Labs compliance-screening
  API at the app.aave.com frontend — blocking wallets that interacted
  with the OFAC-designated Tornado Cash contracts from the
  Aave-operated UI while leaving the Aave Protocol smart contracts
  on-chain unaffected — documents an L4-only frontend-operator
  corporate-compliance action downstream of the 2022-08-08 OFAC
  trigger (related event tornado-cash-ofac-2022). Paper-relevant as
  the frontend-operator vertex of the S5_corporate cascade triangle
  (Circle asset, Infura/Alchemy RPC, Aave frontend) and as the
  comparison sibling to uniswap-frontend-delisting-2023."

