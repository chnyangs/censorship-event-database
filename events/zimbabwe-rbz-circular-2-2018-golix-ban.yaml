  comparison documenting the Reserve Bank of Zimbabwe's 2018-05-11 Circular No.
  2/2018 ordering all banks to stop servicing cryptocurrency exchanges within
  60 days, naming Golix/BitFinance and Styx24. A nation-state banking-rail
  debanking in the same family as India RBI 2018 and Nigeria CBN 2021. Notable
  coda: Golix obtained a Harare High Court provisional order on 2018-05-24
  suspending the ban — recorded as downstream context, not a separate event.

  Per codebook §5.1, trigger.type=nation_state_block is the canonical fit: the
  action is a central-bank banking-rail debanking order. Per §5.2,
  research_stratum=S4_nation_state is permitted.

  Per §9 inclusion boundary: this is in scope — a deliberate debanking of named
  legitimate crypto exchanges (Golix, Styx24), not a fraud prosecution or soft
  advisory.

  Why offramp_cex direct: the circular text itself names the exchanges and
  mandates the banking cut-off (§1 direct rule). Why L0/L1/L3/asset_onchain
  not_applicable: banking-rail action, pre-Merge/pre-Flashbots era, no
  issuer-side on-chain freeze.

  Source note: the load-bearing source is Techzim's reproduction of the full RBZ
  Circular No. 2/2018 statement text (the RBZ did not publish a stable
  English-language web copy of this circular); coded primary_legal because the
  captured artifact carries the verbatim circular text. A human reviewer may
  wish to re-pin against an official RBZ PDF if one surfaces.

  Why temporal_tier=comparable_main_2017_present / analysis_use=
  comparable_analysis: 2018-05-11 sits in the 2017+ comparable corpus.

scoped_claim: |
