analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN Wave 2.3 P2 2026-05-17**

  Foundational-case candidate for a non-OFAC Asian-LE / Tether freeze
  partnership. The user's authoring brief frames this as a 2024 USDT-TRC20
  freeze at PDEA's direction. Public reporting located by the authoring
  agent supports the architectural preconditions (USDT used in PH drug
  trade; CICC began crypto-payment tracing for drug cases in early 2024;
  PDEA-CICC formalised the workflow via MoA on 2025-01-28) but does NOT
  enumerate a specific Tether-PDEA freeze event with a verifiable date,
  amount, or address set.

  Coding decisions (per §1, §3, §4 codebook):
    - empirical_shape = null_event: zero observed_change layers; the only
      retainable row is a coverage_gap.
    - admission_tier = null_case: zero strong-attribution observed_change
      layers.
    - Attribution on the coverage_gap row = none (per schema rule that
      coverage_gap rows take attribution none).
    - trigger.timestamp = 2024-01-01 week-precision placeholder. This is
      conservative and should be revised when a primary artifact (Tether
      blog, PDEA presser, on-chain blacklist tx) is located.

  Cross-event positioning: this event is the PH-LE-led sibling of the
  tether-pig-butchering-second-wave-2024 (APAC-LE-led) and
  tether-doj-pig-butchering-freeze-2023 (US-DOJ-led) freezes. Whereas the
  APAC and DOJ siblings have public anchors (Chainalysis disclosure;
  Tether and DOJ blog posts), this PH-PDEA event currently does not. It
  is admitted to the draft corpus as a placeholder so that the cascade-
  level cross-jurisdictional "first non-OFAC Asian-LE freeze partnership"
  argument can be cross-referenced if/when a primary artifact surfaces.

  Wayback discipline: all `url:` paired with stub `wayback:` per task
  directive; stubs use the year-only form `web.archive.org/web/2024/<url>`
  pending a real snapshot. Evidence_use is `contextual_unarchived` for
  every citation, consistent with the not-yet-anchored status.

