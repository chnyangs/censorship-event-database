analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-5 audit (S5_corporate null_event
  group) by human:xiangwen as null_case. The verified-YES decision was:
  re-date to the 2025-01-28 PDEA-CICC MoA institutional anchor, reclassify
  the retained row from an asset_onchain coverage_gap to an offramp_cex
  observed_no_change null, fix the Wayback anchor, and promote. Newsbytes.ph
  Wayback memento 20250217174116 captured 2026-05-21 with replayable
  body_hash is the falsifiable null anchor (article contains zero "freeze"
  occurrences). pna.gov.ph/articles/1242821 has no Wayback snapshot
  (availability API empty, live page 403s) and is retained as a
  contextual_unarchived institutional pointer. coverage[asset_onchain]
  not_measured->not_applicable; coverage[offramp_cex]
  not_measured->partially_measured. Classification null_event/null_case
  preserved.

  **DATE CORRECTION 2026-05-21**: the original draft coded
  trigger.timestamp = 2024-01-01 as a conservative lower-bound for "early
  2024" per CICC's reported entry into drug-payment cybercrime tracing.
  That date was a record-keeping approximation, not a verifiable anchor.
  trigger.timestamp (and the observation timestamp) are re-dated to
  2025-01-28, the date the PDEA-CICC memorandum of agreement was signed —
  the only verifiable institutional anchor. This is the INSTITUTIONAL anchor
  (MoA signing), NOT a freeze date: no documented USDT-Tron freeze
  transaction exists, and none was invented. Week-level precision retained.
  The event id is left unchanged (immutable; ~20 cross-references depend on
  it) despite the year mismatch with the new date.

  Foundational-case candidate for a non-OFAC Asian-LE / Tether freeze
  partnership. The user's authoring brief framed this as a USDT-TRC20
  freeze at PDEA's direction. Public reporting located supports the
  architectural preconditions (USDT used in PH drug trade; CICC began
  crypto-payment tracing for drug cases in early 2024; PDEA-CICC formalised
  the workflow via MoA on 2025-01-28) but does NOT enumerate a specific
  Tether-PDEA freeze event with a verifiable date, amount, or address set.

  Coding decisions (per §1, §3, §4 codebook):
    - empirical_shape = null_event: zero observed_change layers; the only
      retained row is an offramp_cex observed_no_change null.
    - admission_tier = null_case: zero strong-attribution observed_change
      layers.
    - Attribution on the observed_no_change row = none (per codebook §1.1).
    - The scoped claim is "no freeze is documented" -> an observed_no_change
      null, anchored by a replayable Wayback memento that demonstrably lacks
      any freeze description, over the 2024-01-01 .. 2025-01-29 window.

  Cross-event positioning: this event is the PH-LE-led sibling of the
  tether-pig-butchering-second-wave-2024 (APAC-LE-led) and
  tether-doj-pig-butchering-freeze-2023 (US-DOJ-led) freezes. Whereas the
  APAC and DOJ siblings have public anchors (Chainalysis disclosure;
  Tether and DOJ blog posts), this PH-PDEA event currently does not. It is
  admitted as a null_case so that the cascade-level cross-jurisdictional
  "first non-OFAC Asian-LE freeze partnership" argument can be cross-
  referenced if/when a primary freeze artifact surfaces.

scoped_claim: |
  As of 2026-05-21, no primary public source enumerates a Tether-executed
  USDT-TRC20 freeze of PDEA-flagged Philippine drug-payment wallets; the
  architectural preconditions (CICC's 2024 entry into crypto-payment
  tracing for drug cases; PDEA-CICC MoA signed 2025-01-28) are documented,
  but the discrete freeze event is not. The offramp_cex layer therefore
  carries an observation_kind=observed_no_change row with attribution=none,
  anchored by the Newsbytes.ph Wayback memento (which contains no freeze
  description) over the 2024-01-01 .. 2025-01-29 window.

