  of ~$27M USDT held by the EU-sanctioned Russian exchange Garantex,
  forcing Garantex to suspend all services and halt withdrawals. Trigger:
  the EU sanctioned Garantex on 2025-02-26 in its 16th sanctions package
  (its first-ever crypto-exchange designation). comparison shape, single
  offramp_cex observed_change, attribution=plausible per §1.1 (the freeze
  is causally consistent with the EU designation; the captured coverage
  does not reproduce a primary order naming the specific frozen on-chain
  addresses). jurisdiction corporate_global (issuer action) + EU (the
  sanctions trigger). l0/l1/l3/l4 not_applicable; asset_onchain
  not_measured — the ~$27M freeze is the mechanism but no verified
  primary_onchain freeze tx_hash is pinned (codebook §1.6: carried as a
  coverage note, no tx_hash fabricated; a human must pin the addBlackList
  tx before any asset_onchain observed_change is admitted). DEDUP note:
  distinct from garantex-ofac-2022 (the 2022 OFAC SDN designation) and
  grinex-garantex-successor-ofac-2025 — this is the 2025-03 Tether
  issuer-freeze action precipitated by the EU 16th package. Sources
