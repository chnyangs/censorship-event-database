  null_event documenting Council Regulation (EU) 2024/1745
  of 24 June 2024 — the EU's 14th sanctions package against
  Russia. Two crypto-relevant innovations: (i) the first
  explicit EU prohibition on connecting to Russia's SPFS
  financial-messaging network (the Central Bank of Russia's
  SWIFT alternative) or equivalent specialised services,
  binding on EU entities operating outside Russia; and (ii)
  new Article 5ad extending the crypto-asset provisions
  framework via an Annex XLV listing regime for non-EU
  credit/financial institutions and crypto-asset service
  providers facilitating Russia's defence-industrial
  procurement.

