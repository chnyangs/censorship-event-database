  null_event documenting Council Regulation (EU) 2024/1745
  of 24 June 2024 — the EU's 14th sanctions package against
  Russia. Two crypto-relevant innovations: (i) the first
  explicit EU prohibition on connecting to Russia's SPFS
  financial-messaging network (the Central Bank of Russia's
  SWIFT alternative) or equivalent specialised services,
  binding on EU entities operating outside Russia; and (ii)
  new Article 5ad extending the crypto-asset provisions
  framework via an Annex XLV listing regime for non-EU
  credit/financial institutions and crypto-asset service
  providers facilitating Russia's defence-industrial
  procurement.

  Per §5 codebook trigger.type=non_us_sanctions maps to
  research_stratum=S6_supranational; the actor is the EU
  Council. Per §6 codebook the temporal_tier is
  comparable_main_2017_present and the canonical analysis_use
  is comparable_analysis. Per §7 codebook the enumeration is
  `subset` with the class-level rationale documented in
  target.enumeration_note (framework-level regulation
  enumerating sub-classes rather than wallet addresses). Per
  §3 codebook the empirical_shape is null_event: 0
  observed_change layers directly attributable to the
  2024-06-24 adoption-day trigger at the corpus's resolution;
  Annex XLV listing cascades and EU CASP compliance behaviour
  manifest via subsequent implementing decisions and are
  tracked as separate child events. Per §4 codebook
  admission_tier=null_case (0 strong-attribution
  observed_change layers).

  Per §1.1 codebook, the single coverage_gap row uses
  attribution=`none` because observation_kind=`coverage_gap`
  (no direct per-event observed_change at the corpus's
  resolution). This event functions as the framework anchor
  for the SPFS-prohibition track and for the Annex XLV
  Article-5ad crypto-asset-provider sub-track within the EU's
  Russia-sanctions sequence (12th package 2023-12 → 14th
  package 2024-06 → 15th package 2024-12). Wayback archival
  anchors pinned and verified 2026-05-21.

