analysis_notes: |
  **QUALITY-LOOP REPAIR 2026-06-01** (automated source repair; no new
  human-audit stamp). This row previously relied on a generic SC media index,
  non-replayable citations, and release-blocking caveats. The repair pins the
  specific SC media release, SC 2021 administrative-actions page, and a
  replayable 2021 Wayback capture of Binance's Malaysia product-restriction
  support announcement. The current live Binance support endpoint returned no
  usable body during this pass, so the archived 2021 Wayback body is the
  load-bearing corporate source.

  The retained claim is narrower than the draft. L4 is limited to the SC's
  direct legal directive to disable the Binance website, mobile apps, and
  messaging-channel access for Malaysian investors; no independent ISP/DNS,
  app-store, or post-deadline reachability measurement is asserted. The
  off-ramp/service observation is limited to Binance's own MYR product
  restrictions: MYR trading pairs, MYR payment options, P2P merchant
  applications, and MYR P2P trading-pair removal. No broader Malaysian-bank
  prohibition or externally measured banking-rail severance is retained.

  Structurally, this remains part of the 2021 Binance regulator wave alongside
  UK FCA 2021-06, Netherlands DNB 2021-08, and Singapore MAS 2021-09. Its
  distinguishing feature is the paired evidence chain: a direct SC disable
  order at the website/app/messaging surface and a first-party Binance
  announcement that removes Malaysia-specific MYR products within the same
  compliance window.

scoped_claim: |
  "Malaysia SC's 2021-07-30 enforcement announcement, corroborated by its 2021
  administrative-actions table, ordered Binance to disable binance.com and
  Binance mobile applications in Malaysia and restrict Malaysian investor
  access to Binance-operated messaging channels within the 14-business-day
  compliance window from 2021-07-26 to 2021-08-16. Binance then announced on
  2021-08-13 that it would cease MYR trading pairs, MYR payment options, and
  P2P merchant applications in Malaysia on 2021-08-16, with MYR P2P trading
  pairs removed on 2021-08-13. The row does not claim ISP-level blocking,
  independently measured website/app inaccessibility, on-chain asset freezes,
  or broader Malaysian-bank rail restrictions outside Binance's announced MYR
  product surface."

