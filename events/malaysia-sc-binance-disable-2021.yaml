analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase 6c bulk-promotion of 22 candidate stubs per user instruction to push remaining backlog to dryrun-complete state): promoted from candidate_triggers/malaysia-sc-binance-disable-2021.yaml. Authored by LLM agent without personally verifying Wayback/body_hash; origin=human_reviewed required by validator. Real release must replace this DRYRUN marker with a human-verified audit after pinning real archive anchors.

  Comparison documenting the 2021-07-30 Malaysia Securities Commission
  (SC) public reprimand and enforcement action ordering Binance to
  disable its website and mobile applications for Malaysian users.
  Sibling case in the 2021 multi-jurisdictional Binance regulator wave:
  UK FCA 2021-06-26, Netherlands DNB 2021-08-18, Singapore MAS
  2021-09-02. Binance had already been on the SC's Investor Alert List
  since 2020-07.

  Paper-relevant contrast vs UK FCA (uk-fca-binance-markets-2021): the
  SC action is a direct frontend-disable order (website + mobile apps
  for Malaysian users) whose primary observational axis is L4 frontend,
  whereas the FCA action was a single-entity (BML) registration notice
  whose load-bearing observational axis was offramp_cex via the UK
  retail-bank payment-rail cascade (Barclays / Santander). Both are S4
  nation-state actions; both are empirical_case shape=comparison; the
  Malaysia case foregrounds the regulator-directed operator-compliance
  frontend channel that the FCA case lacks.

  Contrast vs Netherlands DNB (netherlands-dnb-binance-warning-2021):
  the SC order is harder-edged (explicit disable directive with a
  compliance deadline) than the DNB warning (Wwft-registration warning
  whose enforcement cascaded into a 2022-04 fine and a 2022-07 Binance
  NL exit). Both share the L4-frontend load-bearing axis but the SC
  timeline is compressed (disable within 14 business days of 2021-07-30)
  vs the DNB slow-cascade (warning 2021-08 → fine 2022-04 → exit
  2022-07).

  DRYRUN caveats: trigger primary citation (SC press-release index) is
  asserted with a 2021-calendar-folder Wayback pointer; pinned snapshot
  timestamp and body_hash capture are deferred to the human-audit pass.
  For non-DRYRUN release, capture body_hash + body_path for: (1) the
  specific SC press item permalink for the 2021-07-30 reprimand /
  enforcement action against Binance, (2) the SC Investor Alert List
  page showing Binance's 2020-07 inclusion, (3) any contemporaneous
  binance.com/en MY-geo restriction banner or Binance corporate
  announcement page acknowledging the SC order, (4) Apple App Store /
  Google Play storefront snapshots showing Binance app removal for
  Malaysian users if recoverable. Marked evidence_use=
  contextual_unarchived on all citations to flag the unarchived state
  per validator policy.

scoped_claim: |
  "Malaysia SC enforcement order of 2021-07-30 directly compelled Binance
  to disable its website (binance.com) and mobile applications (iOS /
  Android) for Malaysian users within a 14-business-day compliance
  window, producing a regulator-mandated operator-state change at the
  Binance Malaysian-customer cohort (L4 frontend load-bearing) with
  cascading severance of the Binance-MY MYR on/off-ramp rail
  (offramp_cex, attribution=plausible because the rail severance is
  downstream of the frontend disable rather than a direct
  banking-prohibition directive). The row does not claim ISP / DNS-level
  connectivity blocking, on-chain asset freeze, or class-wide Malaysian
  banking-rail severance."

