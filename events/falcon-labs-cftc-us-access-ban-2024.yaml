analysis_notes: |
  Admitted 2026-06-09. The CFTC May 2024 order against Falcon Labs, Ltd.
  ordered it to cease and desist from providing U.S. persons access to digital
  asset derivatives trading platforms — the first CFTC action targeting a
  crypto prime-brokerage intermediary. The primary_government cftc.gov source
  is body_hash-pinned and replayable; the offramp_cex observed_change is
  attribution=direct. origin agent_draft -> human_reviewed via LLM adjudication
  + maintainer oversight (not independent-human IRR).
scoped_claim: |
  "The CFTC's 2024 order barred Falcon Labs from giving U.S. persons access to
  digital-asset derivatives platforms; an off-ramp access restriction (direct,
  primary_government)."
