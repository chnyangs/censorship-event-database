analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17 Wave 2.3 P2**

  Sibling S5_corporate event to cryptex-ofac-2024 (S1_ofac_sdn). Isolates Circle's USDC
  issuer-side compliance freeze as a standalone corporate-policy-change event so that the
  Circle action can be counted under the S5 stratum independently of the OFAC trigger.

  Codebook §1.2 attribution rule applied: OFAC SDN designation (2024-09-26) pre-named the
  USDC-on-Ethereum address 0x0931cA4D13BB4ba75D9B7132AB690265D749a5E7 (condition A holds).
  Circle executed the on-chain Blacklisted() tx within the publicly-knowable compliance
  window at 2024-09-27 03:00 UTC (~27h post-SDN, condition B holds for on-chain confirmation).
  Both (A) and (B) → attribution = direct. This matches the coding already applied in the
  sibling cryptex-ofac-2024 asset_onchain Circle row. Note: Circle did not publish a
  Cryptex-specific blog post (unlike the 2022 Tornado Cash post); the on-chain blacklist tx
  itself serves as the public confirmation, consistent with the §1.2 worked example #1 logic.

  Companion to circle-usdc-tornado-2022 in the issuer-compliance-clock S5 thread:
    - circle-usdc-tornado-2022: protocol-class SDN, ~5.93h Circle response.
    - circle-usdc-cryptex-freeze-2024: single-address SDN, ~27h Circle response.
  The 27h vs 5.93h asymmetry is a Wave-2.3 paper-relevant datapoint for issuer-compliance
  latency conditioned on SDN granularity (protocol-class vs single-address).

scoped_claim: |
  Circle's 2024-09-27 03:00 UTC USDC blacklist of the OFAC-named Cryptex ETH address
  0x0931cA4D13BB4ba75D9B7132AB690265D749a5E7 (~27h after the 2024-09-26 SDN) constitutes a
  distinct corporate-policy-change event documenting Circle's compliance response to a
  single-address OFAC SDN, sibling to the cryptex-ofac-2024 cascade.

