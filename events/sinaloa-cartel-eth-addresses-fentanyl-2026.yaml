analysis_notes: |
  Admitted 2026-06-09 as an attested_secondary null_event under the §9
  OFAC-SDN-in-scope policy. The 2026-05-20 OFAC designation (Treasury sb0503) of
  a Sinaloa Cartel fentanyl-laundering cell named six ETH addresses; treasury.gov
  blocks automated capture, so the event is admitted below the strict floor on
  one captured contemporaneous source (TRM Labs), corroborated by
  Chainalysis/Elliptic/CoinDesk. No primary_onchain freeze tx_hash is captured,
  so per §1.6 no asset_onchain claim is made; the measurable surface is
  offramp_cex (observed_no_change / none). origin agent_draft -> human_reviewed
  via LLM adjudication + maintainer oversight (not independent-human IRR).
