  comparison documenting the FIU-IND 2023-12-28 show-cause notices to nine
  offshore Virtual Digital Asset (VDA) exchanges (Binance, Kraken, KuCoin,
  Huobi, OKX, Bitstamp, MEXC Global, BitTrex, Gate.io) for operating without
  PMLA registration, followed by a MEITY section 69A IT Act URL blocking
  order in early January 2024 and app-store regional removals in mid-
  January 2024. Structurally distinct from the India 2018 RBI banking-rail
  ban (offramp-only, industry-wide INR severance via banking sector) and
  closer in shape to the Philippines 2024 NTC Binance block (state-mandated
  L0 network blocking of named exchange domains) but with a substantially
  broader enumeration (nine platforms rather than one). Load-bearing axes:
  L0 network reachability (ISP-level blocking, IN vantage; coverage
  not_measured pending OONI follow-up), L4 frontend (app-store regional
  removal), and offramp_cex (INR rail severance for affected exchanges).
  Subsequent re-registration of Binance and KuCoin with FIU-IND under
  PMLA in 2024 partially reversed the block for those two platforms and
  is a natural candidate for a follow-up reversal-comparison event.

scoped_claim: |
  "The FIU-IND 2023-12-28 show-cause notices and the subsequent MEITY
  section 69A URL blocking order severed Indian-vantage access to nine
  named offshore VDA exchange domains (Binance, Kraken, KuCoin, Huobi,
  OKX, Bitstamp, MEXC Global, BitTrex, Gate.io) and removed corresponding
  apps from Apple App Store IN and Google Play IN regional storefronts in
  mid-January 2024. Observational axes at l4_frontend (app-store regional
  removal) and offramp_cex (INR rail severance). L0 admission-anchor-grade
  promotion pending OONI Probe IN / Censored Planet follow-up batch query
  for the nine domains over 2024-01 to 2024-02."

