analysis_notes: |
  **QUALITY-LOOP REPAIR 2026-06-01** (automated source and scope repair; no
  new human-audit stamp). This row previously relied on an unpinned PIB URL,
  duplicated app-store observations that already have sibling S5 rows, and an
  unsupported INR-rail claim. The repair pins the official PIB press release,
  corrects the FIU-IND named-nine enumeration by replacing OKX with Bitfinex,
  and recodes the retained observation to an OONI-backed L0 subset:
  confirmed DNS blocking of https://www.binance.com/ from sampled Indian OONI
  probes on AS55836 in February 2024.

  The retained parent-row claim is deliberately narrow. It does not claim
  all nine FIU-IND named domains were blocked across all Indian networks, does
  not duplicate Apple App Store / Google Play removals, and does not claim INR
  on/off-ramp severance. App-store enforcement remains represented by the
  sibling corporate rows; off-ramp claims require exchange-side or payment-rail
  evidence before re-entry.

scoped_claim: |
  "FIU-IND's 2023-12-28 press release issued show-cause notices to nine
  offshore VDA service providers and stated that FIU-IND wrote to MEITY to
  block those entities' URLs. In OONI IN web_connectivity measurements over
  2024-01-12 to 2024-02-15, https://www.binance.com/ showed confirmed
  DNS-blocking fingerprints on sampled Indian AS55836 measurements on
  2024-02-11 and 2024-02-13. This row claims only that sampled
  India-vantage L0 subset; it does not claim nationwide blocking across all
  FIU-IND named domains, app-store removals, or INR rail severance."

