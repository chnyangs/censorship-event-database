  null_event documenting the FSB's 2023-07-17 finalisation of the
  global regulatory framework for crypto-asset activities. The
  framework comprises two distinct sets of recommendations: (1) nine
  high-level recommendations on the regulation, supervision and
  oversight of crypto-asset activities and markets, and (2) ten
  high-level recommendations on the regulation, supervision and
  oversight of global stablecoin arrangements (GSCs). Both sets were
  strengthened post-FTX in three areas: client-asset safeguarding,
  conflicts-of-interest, and cross-border cooperation. The framework
  is grounded in the principle of "same activity, same risk, same
  regulation".

  Per §5.1 codebook the trigger.type is supranational_regulation
  (FSB is the G20 financial-stability standard-setting body). Per §5.2
  codebook the stratum is S6_supranational. Per §6 codebook the
  temporal_tier is comparable_main_2017_present and the canonical
  analysis_use is comparable_analysis. Per §7 codebook the enumeration
  is `subset` with the class-level rationale documented in
  target.enumeration_note (FSB recommendations operate at the
  international standard-setting layer; binding force is via
  FSB-member jurisdiction implementation under G20 endorsement). Per
  §3 codebook the empirical_shape is null_event: 0 observed_change
  layers directly attributable to the 2023-07-17 publication date.
  Per §4 codebook admission_tier=null_case (0 strong-attribution
  observed_change layers).

  Per §1.1 codebook, both off-ramp and asset_onchain rows use
  attribution=`none` because observation_kind=`coverage_gap` (no
  direct per-event observed_change at the corpus's resolution). This
  event functions as a parent / standards-layer anchor for the
  downstream FSB-member jurisdiction CASP and stablecoin rule cascades
  and as a temporal landmark for the 2023-2024 wave of national
  crypto-asset regulation. It sits alongside the G20 roadmap
  (g20-roadmap-crypto-asset-policy-2023) and the FATF 2023 targeted
  update (fatf-targeted-update-va-vasp-2023) as part of the
  coordinated 2023 supranational regulatory wave. Archival anchors
  pinned 2026-05-21 (live fsb.org capture).

