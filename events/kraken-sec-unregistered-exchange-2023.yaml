analysis_notes: |
  **QUALITY-LOOP RECODE 2026-06-01** (automated repair; no new human-audit
  stamp). The original row admitted a positive observed_change at the
  offramp_cex layer by treating Kraken's corporate response as a
  platform-side change. That was too permissive for paper use: issuing a
  litigation response is not itself a censorship, access-denial, delisting,
  off-ramp, or service-withdrawal event.

  This version recodes the event as an admitted null_case / null_event
  denominator. The legal trigger is still important for the 2023 US federal
  enforcement frame, but the retained empirical content is negative: unlike
  the February 2023 Kraken staking settlement, the November 2023
  unregistered-exchange complaint did not produce a same-day Kraken product
  shutdown, token delisting, frontend block, fiat-rail cutoff, or on-chain
  asset action in the retained evidence.

  Replayable anchors were added for both load-bearing sources: SEC press
  release 2023-237 and Kraken's 2023-11-20 corporate response. The old
  `blog.kraken.com/news/sec-charges` slug returned 404 during repair; the
  canonical Kraken permalink is now recorded directly. The 2025 dismissal is
  contextual legal history and is no longer modeled as recovery, because no
  service-level observed_change is admitted in this row.

scoped_claim: |
  "The 2023-11-20 SEC unregistered-exchange action against Kraken is retained
  as a null-control comparator: the SEC action occurred, Kraken issued a
  same-day response stating that client products and services continued, and
  the dataset does not admit any Kraken frontend takedown, token delisting,
  fiat-rail disruption, on-chain asset freeze, or L1/L3 effect for this event."

scoped_knowledge: |
  What changed: no censorship/access-denial layer is admitted. The SEC filed
  the action and Kraken publicly responded, but that response is evidence for
  a no-service-withdrawal comparator rather than a changed service layer.

  What did not change or could not be measured: no on-chain effect, asset
  issuer freeze, L4 frontend takedown, fiat-rail disruption, or token delisting
  is retained. No independent kraken.com service-page denominator sweep is
  pinned, so the row should not be used to claim comprehensive service
  continuity beyond the named null-control window and sources.

  Comparative value: this is the clean intra-operator contrast to
  kraken-sec-staking-2023. Same operator and same regulator in 2023, but the
  February staking settlement produced a direct US staking-service shutdown
  while the November exchange-registration complaint is retained as a
  no-service-withdrawal null comparator.

