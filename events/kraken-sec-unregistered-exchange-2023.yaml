  comparison shape: 1 observed_no_change layer (offramp_cex) anchored to
  Kraken's contemporaneous corporate response. The case is admitted here
  as an empirical_case via attribution-strong sibling rather than as an
  L4 / on-chain cascade: it sits inside the 2023 US-federal-enforcement
  frame alongside sec-v-coinbase-2023 (2023-06-06), sec-v-binance-2023
  (2023-06-05), sec-v-bittrex-2023, and kraken-sec-staking-2023
  (2023-02-09), but produced a notably different platform-side reaction:
  Kraken absorbed the SEC pressure without a same-day or near-term US
  customer service withdrawal, unlike the staking-program sibling.

  Distinct from kraken-sec-staking-2023 (which is the Feb-2023 staking
  settlement, load-bearing at offramp_cex with a direct U.S. staking-
  service shutdown). The two Kraken SEC cases sit in the same calendar
  year but attack different theories: the February case was an
  unregistered-securities-offering claim against the staking product, and
  the November case is an unregistered-exchange / broker / dealer /
  clearing-agency claim against the trading venue itself. Treating them
  as a sibling pair is essential to avoid double-counting platform-side
  reactions across the dataset.

  Paper-relevant contrast: pairs naturally with sec-v-coinbase-2023 as
  exchange-registration civil enforcement that did not produce a
  contemporaneous CEX service withdrawal — both cases load-bear
  analytically as comparable_analysis rows showing that securities-law
  pressure on US exchange operators does not deterministically produce
  on-platform censorship at the offramp_cex layer. Contrast with the
  staking-program siblings (kraken-sec-staking-2023, sec-v-coinbase-2023's
  state-scoped staking restrictions) which did produce direct or scoped
  service withdrawals.

  2025-03-27 dismissal: tracked in the recovery block. The dismissal does
  not establish a securities-status determination for Kraken's listed
  assets; it only closes the SEC civil case. Cross-event cohort with
  SEC v. Coinbase and SEC v. Binance dismissals in the same enforcement-
  rollback window under the Atkins administration.

  DRYRUN caveats: trigger primary citations (SEC press release 2023-237,
  Kraken blog response) are asserted with 2023-calendar-folder Wayback
  pointers; pinned snapshot timestamps and body_hash capture are deferred
  to the human-audit pass. For non-DRYRUN release, capture body_hash +
  body_path for: (1) the SEC press release 2023-237 permalink, (2) the
  Kraken blog corporate-response page (specific permalink to be
  identified during audit; the slug `news/sec-charges` is the working
  reference), (3) the 2025-03-27 SEC dismissal filing / press item, and
  (4) a Wayback diff sweep of kraken.com service / supported-asset pages
  across the 2023-11-20 → 2023-12-20 window to convert offramp_cex from
  partially_measured to measured. Marked evidence_use=contextual_unarchived
  on all citations to flag the unarchived state per validator policy.

scoped_claim: |
  "The 2023-11-20 SEC v. Payward (Kraken) unregistered-exchange action is
  admitted only for a scoped offramp_cex platform-stance response: Kraken
  posted a contemporaneous corporate response on blog.kraken.com asserting
  continued operational status of customer products and services and
  framing the action as a registration dispute to be defended. The row
  does not claim a Kraken.com frontend takedown, token delisting, fiat-rail
  disruption, on-chain asset freeze, or L1/L3 effect; it is paired with
  kraken-sec-staking-2023 (sibling, which load-bears at offramp_cex with
  a direct US staking-service shutdown) as the two-case Kraken-SEC
  enforcement cohort."

scoped_knowledge: |
  What changed: the platform-side stance toward US regulatory pressure.
  Kraken issued a public corporate response on blog.kraken.com on or
  near 2023-11-20 asserting continued operational status of customer
  products and services and framing the SEC complaint as a registration
  dispute. This is the retained observed_change at offramp_cex — the
  issuance of a new platform-stance artifact, not a service withdrawal.
  No contemporaneous Kraken support notice, geofence, or service-
  withdrawal artifact has been retained. The SEC civil case itself
  proceeded through 2024 and was dismissed 2025-03-27.

  What did not change or could not be measured: no on-chain effect, no
  asset-issuer freeze, no L4 frontend takedown, no fiat-rail disruption
  artifact, no token delisting. The named tokens cited in the complaint
  are not target chains for L1/L3 measurement but referenced exhibits
  of the securities-law theory. No admission-grade kraken.com service /
  supported-asset frontend diff is retained — the offramp_cex measured
  status relies on the Kraken platform-stance response, not on an
  independent Wayback denominator sweep proving service-level continuity.

  Attribution: plausible. The Kraken response is causally tied to the
  SEC action via the post's own framing, but the dataset does not retain
  an independent service-level denominator beyond Kraken's own assertion.

  Comparative value: high. The Kraken pair (Feb-2023 staking
  settlement + Nov-2023 unregistered-exchange action) is the cleanest
  intra-issuer contrast in the 2023 US-federal-enforcement frame:
  same target operator, two SEC civil actions in the same calendar
  year, two different platform-side reactions. The staking case
  produced a direct US service shutdown; the unregistered-exchange
  case produced no platform-side service withdrawal. This is exactly
  the kind of paired comparison that distinguishes
  registration-pressure-without-service-effect from
  registration-pressure-with-service-effect at offramp_cex.

