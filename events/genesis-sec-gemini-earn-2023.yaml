  comparison - direct twin to blockfi-sec-lending-2022 in the SEC crypto
  lending-product enforcement thread. The 2023-01-12 SEC civil complaint
  against Genesis Global Capital (lender) and Gemini Trust Company
  (custodial offering counterparty) charges the Gemini Earn program as
  an unregistered securities offering, citing ~$900M owed to ~340K
  retail investors. The structural difference from BlockFi is the
  defendant pair (lender + custodian) and the load-bearing follow-on:
  Genesis filed Chapter 11 in S.D.N.Y. one week later on 2023-01-19,
  formalizing the estate-level freeze of customer assets that the
  November 2022 Genesis withdrawal pause had already de facto imposed.
  The measured change is product/service restriction + bankruptcy
  estate freeze at the centralized lending platform surface; no frontend
  takedown, token delisting, or on-chain asset freeze is asserted.

scoped_claim: |
  "The 2023-01-12 SEC Genesis + Gemini complaint over the Gemini Earn
  program is coded only as a centralized crypto lending-product
  restriction at the offramp_cex layer, paired with the 2023-01-19
  Genesis Chapter 11 estate freeze of approximately $900M of customer
  crypto held for ~340K Gemini Earn investors; it does not claim a
  frontend, L1, L3, or on-chain censorship event."

