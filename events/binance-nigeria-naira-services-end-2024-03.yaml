analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission).

  Binance's 2024-03-05 decision to discontinue ALL Nigerian Naira (NGN)
  services — delisting NGN spot pairs (BTC/NGN, USDT/NGN) and NGN P2P,
  ending NGN deposits/withdrawals, and auto-converting residual NGN
  balances to USDT (phased 2024-03-05 → 2024-03-08) — amid intense Nigerian
  government scrutiny and the detention of Binance executives. This is a
  corporate jurisdiction-exit / fiat-off-ramp withdrawal by Binance itself.

  Why §9 INCLUDE: a deliberate corporate withdrawal of the NGN fiat
  off-ramp that denied Nigerian users access to Binance's local-currency
  service (codebook §9 INCLUDE: corporate jurisdiction exit / geofence).
  Distinct from the separate state action — the late-Feb-2024 NCC telco
  block of binance.com and exec detention (coded at
  nigeria-binance-network-block-2024-02, S4). Here the actor is Binance
  (corporate), the action is Binance ending its own NGN services. Listed as
  related, not a dup.

  Why S5_corporate: an exchange's unilateral fiat-service withdrawal is a
  corporate policy action (issuer/exchange unilateral policy family).

  Why comparison / empirical_case: one strong-attribution (direct)
  observed_change layer (offramp_cex). Other five layers scope-mismatched.

  Why attribution=direct: the action is Binance's own announced policy,
  carried by Binance's official support announcement and the CoinDesk
  report of the company blog post.

  Sources verified via WebSearch + captured 2026-05-31 (CoinDesk semi-
  primary + official Binance notice, body_hash-pinned; CoinDesk content
  grep-confirmed for the NGN-pair delisting and USDT conversion; no
  fabrication).

