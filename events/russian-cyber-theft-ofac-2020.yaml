analysis_notes: |
  comparison documenting the 2020-09-16 Russian-cyber-theft individual-level
  sanctions. Two individuals with remarkable cross-chain diversity (8 chains on KARASAVIDI
  alone including pure privacy chains XMR and ZEC), illustrating early OFAC attention to the
  multi-asset laundering surface before the protocol-level 2022 cluster.

  All infrastructural layers (L0 / L1 / L3 / L4) are structurally not_applicable — pre-Merge
  pre-frontend-era individuals. The meaningful measurement axis is asset_onchain (freeze
  primitives) and offramp_cex. Admitting as comparison (closer fit than cascade /
  comparison given the individual-targeting shape).

  Follow-up directions (post-admission): asset-layer empirical work.

scoped_claim: |
  "OFAC individual designation of two Russian cyber-theft actors on 2020-09-16 attached 12
  unique addresses spanning 8 chains, the most chain-diverse single SDN entry in the
  dataset. Cross-layer observational analysis is constrained because event predates the
  Ethereum PBS era by 2 years and targets individuals not service operators."

