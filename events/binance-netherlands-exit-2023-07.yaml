analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: wave-3 S5-corporate
  draft, adversarial-verify verdict=KEEP (sources real + on-topic + §9 in-scope + not dup), AND
  passes strict admission validation; origin agent_draft -> human_reviewed).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). On 2023-06-16 Binance announced
  it would exit the Netherlands after failing to obtain a Dutch VASP
  registration from De Nederlandsche Bank (DNB): it stopped registering new
  Dutch users immediately, and from 2023-07-17 halted trading for existing
  Dutch users, who could only withdraw assets thereafter (Binance referred
  users to rival Coinmerce). This is a corporate jurisdiction exit by a major
  centralized exchange driven by inability to clear the national VASP regime —
  in scope per codebook §9 (corporate jurisdiction exit/geofence). comparison
  shape, single offramp_cex observed_change, attribution=plausible (exit is
  directly observed; captured anchors are trade press, not a Binance primary
  notice). asset_onchain not_applicable (CEX market exit, no on-chain freeze,
  no §1.6 tx_hash floor). Distinct from netherlands-dnb-binance-warning-2021
  (the prior DNB unregistered-service warning/fine, S4) and
  kucoin-netherlands-exit-2023 (sibling exchange, same DNB-driven 2023 exodus).
  Sources verified via WebSearch 2026-05-31; Decrypt + CryptoSlate captured +
  body_hash pinned; grep of the Decrypt body confirms "Binance to Leave
  Netherlands", "VASP License", "starting July 17, trading in the Netherlands
  will be halted", "no longer registering new users", "withdrawing funds" (no
  fabrication).

scoped_claim: |
  "Binance's 2023-06-16 withdrawal from the Netherlands (new-user registration
  stopped immediately; trading halted 2023-07-17, withdraw-only) after failing
  to secure a Dutch VASP registration is a single-layer offramp_cex
  observed_change with attribution=plausible, part of the 2023 Dutch exchange
  exodus (cf. KuCoin)."

