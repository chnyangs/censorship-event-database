    note: |
      FX Direction No. 03 of 2021 Para 10.1.b directly prohibits debit/credit
      card (EFTC) payments for virtual-currency transactions, severing the
      bank-card off-ramp/on-ramp channel for crypto in Sri Lanka. CBSL further
      stated no ICOs, mining operations or Virtual Currency Exchanges are
      licensed/authorized, and that purchasing virtual currency from abroad
      violates the Foreign Exchange Act (not a permitted investment category).
      Attached as observed_change. Attribution direct: the FX Direction text
      itself is the mandate prohibiting the card-payment channel.

