analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources verified+captured, awaiting human admission)

  Sri Lanka nation-state payment-rail restriction. The IN-SCOPE action (codebook
  §9) is the binding Foreign Exchange Act Direction No. 03 of 2021 (Para 10.1.b),
  which prohibits Authorized-Dealer banks from allowing EFTC (debit/credit card)
  payments for virtual-currency transactions — a deliberate payment-rail
  prohibition / partial debanking of the crypto on-/off-ramp. The accompanying
  "not legal tender / no regulatory safeguards" language in the 2021-04-09
  CBSL public-awareness notice is, on its own, a soft non-recognition statement
  (§9 EXCLUDE); it is recorded here only as corroborating context, NOT as the
  scoped censorship action. The scoped action is the card-payment prohibition.

  Attribution=direct per §1.5: the FX Direction is the regulator's own binding
  instrument naming the prohibited payment use. Single observed_change layer
  (offramp_cex) ⇒ empirical_shape=comparison, admission_tier=empirical_case.
  No L0/RPC/onchain measurement attached (none claimed). Both sources captured
  from cbsl.gov.lk via Wayback with body_hash; the FX Direction PDF text was
  verified (pdftotext) to contain the Para 10.1.b virtual-currency clause.

scoped_claim: |
  "Sri Lanka's CBSL Foreign Exchange Act Direction No. 03 of 2021 (publicised
  2021-04-09) prohibited debit/credit card (EFTC) payments for virtual-currency
  transactions, severing the bank-card payment channel for crypto in Sri Lanka.
  Effect captured at the offramp_cex layer at class level via the binding FX
  Direction text."

