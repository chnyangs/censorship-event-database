  **ADMITTED 2026-05-31** (genuine review by human:xiangwen reviewing agent: TASK-2 lower-tier. §9-clear, well-documented deliberate restriction admitted at evidence_tier=attested_secondary (codebook §10) — single captured contemporaneous source; verified clean (no fabrication) in bulk adversarial-verify; filterable via evidence_tier.)
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). Binance's 2025-03-03
  announcement to delist non-MiCA-compliant stablecoin trading pairs —
  including USDT spot pairs — for EEA users, with spot removal by
  2025-03-31 (margin from 2025-03-27; USDT derivatives retained, MiCA-
  compliant USDC/EURI kept). Part of the MiCA stablecoin-delisting wave
  (cf. Coinbase Dec-2024, Crypto.com Jan-2025; related EU-MiCA events).
  comparison shape, single offramp_cex observed_change,
  attribution=plausible per §1.1/§1.4-analogue (MiCA cause reported in
  trade press; no captured Binance notice naming a specific MiCA
  instrument — class-level inference). EU jurisdiction. Per §1.6 /
  binance-busd precedent the stablecoin action is carried at offramp_cex,
  NOT asset_onchain (Binance is not the USDT issuer). target.enumeration=
  subset (USDT focal; remaining stablecoins class-level, §7). NOTE for
  human reviewer: Binance also retains a primary_corporate Binance Square/
  support notice (urls in WebSearch results) — a future capture could
  upgrade this to a primary_corporate anchor (the binance.com snapshot
  was not archived at capture time, so a trade-press semi_primary anchor
