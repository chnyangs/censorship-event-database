analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). Paxos's 2023-04-12
  announcement of withdrawal from the Canadian market effective 2023-06-02
  (empty accounts auto-closed 2023-05-09), following the CSA's 2023-02-22
  enhanced pre-registration-undertaking framework. S5 corporate-policy
  retreat sibling to the S4 canada-csa-binance-withdrawal-2023 and the S5
  kucoin-canada-exit-2023 / okx-canada-exit-2023.

  comparison shape: 1 observed_change layer (offramp_cex) with
  attribution=plausible. attribution held at plausible (not direct)
  because the captured anchor is semi-primary trade press; no primary
  Paxos corporate notice was pinned. Although Paxos is a stablecoin
  issuer, asset_onchain is not_applicable per codebook §1.6 — this is a
  market-exit / platform-service withdrawal, not an on-chain issuer
  freeze; the effect is carried at offramp_cex (precedent:
  paxos-busd-nydfs-minting-stop-2023 / binance-busd-wind-down-2024 carry
  issuer actions off the asset_onchain row). l0/l1/l3 not_applicable;
  l4_frontend not_measured. Source verified via WebSearch + capture
  2026-05-31 (CoinDesk, body_hash-pinned; grep-confirmed "Canada" /
  "June 2" / "withdraw"; no fabrication).

  Codebook decisions applied:
  - trigger.type=corporate_policy_change per §5.1 (platform-initiated
    market exit) -> research_stratum=S5_corporate.
  - attribution=plausible on offramp_cex per §1.x (semi-primary anchor).
  - asset_onchain=not_applicable per §1.6 off-chain-mechanism routing.
  - target.enumeration=subset per §7 (Canadian-resident retail cohort).
  - empirical_shape=comparison per §3; admission_tier=empirical_case
    per §4.

scoped_claim: |
  "Paxos on 2023-04-12 announced withdrawal from the Canadian market
  effective 2023-06-02 (empty accounts closed 2023-05-09), disabling
  Canadian-resident accounts to withdraw-only amid the CSA's 2023-02-22
  undertaking framework — a 1-layer offramp_cex observed_change
  (attribution=plausible) for the Paxos Canada cohort. Structurally an S5
  corporate-policy retreat sibling to the S4 CSA-driven Binance Canada
  withdrawal (canada-csa-binance-withdrawal-2023)."

