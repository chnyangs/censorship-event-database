  comparison — S5 corporate-policy-change event documenting OKX's
  2023-12-29 spot-trading-pair removals for privacy-asset cohort
  (Monero/Zcash/Dash/Horizen, with adjacent privacy-token removals in
  the same batch following 2023 compliance pressure on global CEX
  privacy-asset listings). Pairs with uniswap-frontend-delisting-2023
  on the corporate-listing-restriction axis: where Uniswap Labs (US-based
  DEX frontend operator) restricts UI display of ~100 tokens without
  touching the underlying Uniswap Protocol, OKX (centralized-exchange
  operator) removes spot pairs from its product catalogue — both are
  load-bearing at separate layers (Uniswap at l4_frontend, OKX at
  offramp_cex). Pairs with tether-retroactive-sweep-2023 and
  paxos-busd-nydfs-minting-stop-2023 as cross-event 2023 S5 corporate-
  policy-change anchors at distinct cascade layers (Tether at asset_onchain
  via issuer freeze, Paxos at asset_onchain via mint cessation, OKX at
  offramp_cex via spot-pair delisting). The cross-issuer / cross-listing
  comparison axis is paper-relevant: corporate-compliance actions in
  2023 cluster across cascade layers without a single OFAC trigger.

  Why empirical_case rather than anchor_case: in this DRYRUN pass the
  load-bearing offramp_cex observation carries direct attribution but
  the citation is a single primary-corporate notice with provisional
  wayback anchor (not body-hash-pinned). Promotion to anchor_case
  requires (a) the OKX notice body_hash / body_path pinning during
  human audit, (b) an independent semi-primary or supporting tracker
  source confirming the post-effective-date absence of the removed
  spot pairs in OKX's public ticker listing, and (c) consideration of
  additional contemporaneous OKX delistings (e.g., Tornado-Cash-related
  tokens cited in the brief) that would substantiate the broader
  privacy-compliance batch interpretation.

scoped_claim: |
  "OKX's 2023-12-29 spot-trading-pair removals at www.okx.com — covering
  privacy-asset pairs (Monero/XMR, Zcash/ZEC, Dash/DASH, Horizen/ZEN) and
  bundled non-privacy pairs in the same delisting operation — narrow the
  centralized-exchange off-ramp surface for the affected privacy assets
  in the OKX corridor. The offramp_cex layer carries the load-bearing
  direct-attribution observation; L0 / L1 / L3 / l4_frontend / asset_onchain
  are not_applicable for an exchange-listing-only action."

scoped_knowledge: |
  This event is the canonical 2023 S5 centralized-exchange privacy-asset
  delisting anchor in the dataset. The 2023-12-29 OKX notice sits in the
  late-2023 / early-2024 cluster of global CEX privacy-asset delistings
  driven by jurisdiction-level compliance pressure (e.g., MiCA in the EU,
  South Korea Travel Rule, and US state-level pressure). The comparison
  pair with uniswap-frontend-delisting-2023 separates the
  centralized-exchange-listing-restriction axis (OKX at offramp_cex)
  from the DEX-frontend-operator-restriction axis (Uniswap Labs at
  l4_frontend), both occurring in the same calendar year and both
  documenting corporate-compliance product-catalogue narrowing absent
  a single OFAC trigger.

