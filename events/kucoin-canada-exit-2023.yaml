  Canada cohort sibling to canada-csa-binance-withdrawal-2023). Authored
  by LLM agent without personally verifying Wayback / body_hash; only
  valid at status=draft / origin=agent_draft. Real release must replace
  this DRYRUN marker with a human-verified audit after pinning real
  archive anchors for the KuCoin announcement page and the OSC
  enforcement page.

  comparison shape: 1 observed_change layer (offramp_cex) with direct
  attribution. Sibling of canada-csa-binance-withdrawal-2023 from the
  S5_corporate side — same Canadian regulatory environment (2022-07-22
  OSC enforcement + 2023-02-22 CSA Staff Notice 21-332) produced two
  distinct exchange-exit cascades. KuCoin's response was a unilateral
  corporate-policy KYC-gate + service wind-down for Canadian users,
  characterized in OSC commentary as notable because (unlike Bybit)
  KuCoin did not engage in dialogue with the regulator. Empirical
  shape held at comparison rather than cascade because only the
  offramp_cex layer is captured as measured + observed_change; the
  l4_frontend cohort behavior is held not_measured pending human
  audit.

  Codebook decisions applied:
  - trigger.type=corporate_policy_change per §5.1 (exchange-initiated
    market retreat).
  - research_stratum=S5_corporate per §5.2 stratum-actor map.
  - attribution=direct on offramp_cex because the corporate-policy
    trigger and the offramp shutdown are co-authored by the same
    actor (collapses the trigger→action linkage).
  - target.enumeration=subset per §7 — Canadian-resident retail user
    cohort is class-level rather than per-address enumerated.
  - empirical_shape=comparison per §3 (1 observed_change layer).
  - admission_tier=empirical_case per §4 (≥1 strong-attribution
    observed_change layer).

scoped_claim: |
  "Under sustained OSC enforcement (2022-07-22 Capital Markets Tribunal
  order) and the 2023-02-22 CSA Staff Notice 21-332 framework, KuCoin
  on 2023-06-28 announced mandatory KYC effective 2023-07-15 for
  Canadian-resident accounts and an associated wind-down of deposit
  and trading services, producing a 1-layer offramp_cex cascade for
  the KuCoin Canada cohort. Structurally an S5 corporate-policy
  retreat sibling to the S4 CSA-driven Binance Canada withdrawal
  (canada-csa-binance-withdrawal-2023)."

