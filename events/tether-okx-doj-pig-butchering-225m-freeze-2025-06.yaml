analysis_notes: |
  **SOURCE / MODEL REPAIR 2026-05-31 (automation, user-delegated; no human
  admission claimed):** replaced the prior semi-primary-only "2025 freeze"
  framing with a primary DOJ legal model. This row is the 2025 D.D.C.
  forfeiture / burn-reissue stage for the seven enumerated USDT Token
  Groups, not a second new wallet-cohort freeze separate from
  tether-doj-pig-butchering-freeze-2023. The verified complaint states that
  USSS requested Tether freeze the same seven addresses on or around
  2023-11-20; Ethereum JSON-RPC confirms seven USDT AddedBlackList logs in
  blocks 18613308-18613319. The 2025 legal stage is independently pinned by
  the DOJ OPA press release, the D.D.C. verified complaint, and seven USDT
  DestroyedBlackFunds txs in blocks 22730179-22731274 on 2025-06-18.

  This fixes the review-report blockers: direct attribution now has
  primary_legal plus primary_onchain anchors; the target set is concrete and
  complete for the forfeiture property; the asset_onchain observation no
  longer carries unresolved evidence scaffolding. The row remains
  status=draft only because origin=agent_draft and human admission is
  required.

scoped_claim: |
  "On 2025-06-18 DOJ filed a D.D.C. civil forfeiture complaint against
  225,364,961 USDT in seven enumerated Ethereum USDT Token Groups A-G; the
  complaint ties those same addresses to a 2023-11-20 USSS-requested Tether
  freeze, and Ethereum logs show Tether burned the blacklisted balances in
  seven DestroyedBlackFunds transactions on 2025-06-18 before reissue
  pursuant to seizure. Single-layer asset_onchain observed_change,
  attribution=direct; kept draft because human admission is required."

