analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). On 2025-06-18 the US
  Attorney's Office for the District of Columbia filed a civil forfeiture
  complaint for ~$225,364,961 USDT — the largest-ever US seizure tied to
  crypto "pig butchering" schemes. Tether and OKX froze the funds across
  seven wallets ("USDT Token Groups A-G"); Tether then burned the frozen
  tokens and reissued the equivalent value to the US government.
  comparison shape, single asset_onchain observed_change,
  attribution=direct per §1.2 (Tether's own freeze/burn carries the
  asset-layer change at named DOJ forfeiture direction against identified
  targets). jurisdiction corporate_global (Tether/OKX action) + US (DOJ
  DC). DEDUP note: DISTINCT from tether-doj-pig-butchering-freeze-2023
  (the 2023-11-20 $225M EDVA freeze, "International Human Trafficking
  Syndicate" — a separate, earlier $225M event) and from
  tether-pig-butchering-second-wave-2024; this is the 2025-06 DOJ-DC
  civil forfeiture (a coincidentally similar headline figure but a
  different filing, district, date, and wallet set). NOTE for human
  reviewer (codebook §1.6): asset_onchain observed_change carries no
  pinned primary_onchain freeze/burn tx_hash (deferred for drafts); pin
  the addBlackList/burn tx hashes before admission. No tx_hash fabricated.
  The two specific Tron/ETH addresses and per-group amounts are NOT
  asserted (not present in the captured pages). Sources verified via
  WebSearch + captured 2026-05-31 (CNBC + TRM Labs, body_hash-pinned).

scoped_claim: |
  "On 2025-06-18 (DOJ DC civil forfeiture, largest-ever crypto pig-
  butchering seizure), Tether and OKX froze ~$225.36M USDT across seven
  wallets and Tether burned+reissued the tokens to the US government;
  single-layer asset_onchain observed_change, attribution=direct.
  Distinct from the 2023-11 $225M EDVA freeze. Asset-layer freeze/burn
  tx hashes to be pinned by a human before admission (codebook §1.6)."

