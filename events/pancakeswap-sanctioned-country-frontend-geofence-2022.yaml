analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). PancakeSwap — the leading
  BNB-Smart-Chain DEX — reportedly implemented a frontend IP geofence
  (effective 2022-03-09) blocking users from Iran plus Belarus, Cuba, the
  DR Congo, Iraq, North Korea, Sudan, Syria, Zimbabwe and Crimea, the OFAC
  comprehensive-sanctions set. A DEX-frontend geofence is the same
  censorship surface as 1inch-us-geofence-2021-09 and the
  opensea-iran-cuba-sanctions-block-2022 sanctioned-jurisdiction blocks
  (cf. related_events). comparison shape, single l4_frontend
  observed_change. attribution=plausible per §1.4: the block is reported
  via a Persian-language screenshot of a PancakeSwap message rather than a
  captured first-party PancakeSwap compliance notice citing a named
  trigger. The underlying BSC contracts remain directly reachable
  on-chain, so l1/l3/asset_onchain/offramp_cex are not_applicable.
  jurisdiction=corporate_global + IR (Iran named primary; full OFAC list
  not all in the controlled vocab). Source verified via WebSearch +
  capture 2026-05-31 (The Block, body_hash-pinned; the March 9 cutoff +
  country list grep-verified; no fabrication).

scoped_claim: |
  "PancakeSwap's reported 2022-03-09 frontend IP geofence against Iran and
  nine other OFAC-sanctioned jurisdictions denied those users UI access to
  the leading BNB-chain DEX (contracts remained directly reachable
  on-chain); single-layer l4_frontend observed_change,
  attribution=plausible (reported, no captured first-party notice)."

