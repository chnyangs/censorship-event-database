analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17**

  null_event documenting the G20 Roadmap on Crypto-Asset Policy
  endorsed at the G20 New Delhi Leaders' Summit on 2023-09-09.
  The Leaders' Declaration endorsed (i) the FSB high-level
  recommendations for the regulation, supervision and oversight of
  crypto-asset activities and markets and of global stablecoin
  arrangements, and (ii) the IMF-FSB Synthesis Paper "Policies for
  Crypto-Assets" (7 September 2023) which sets out an implementation
  roadmap covering capacity building beyond G20, global coordination
  and information sharing, and data-gap closure.

  Per §5 codebook trigger.type=supranational_regulation maps to
  research_stratum=S6_supranational; the actor is G20 (a
  supranational coordination forum). Per §6 codebook the
  temporal_tier is comparable_main_2017_present and the canonical
  analysis_use is comparable_analysis. Per §7 codebook the
  enumeration is `subset` with the class-level rationale documented
  in target.enumeration_note (G20 coordination operates at the
  international-standards layer; binding force is via standard-
  setter work programs and national implementation). Per §3
  codebook the empirical_shape is null_event: 0 observed_change
  layers directly attributable to the 2023-09-09 endorsement date;
  downstream cascades (FSB R1, FATF 2023 targeted update, national
  implementations) are tracked as separate child events. Per §4
  codebook admission_tier=null_case (0 strong-attribution
  observed_change layers).

  Per §1.1 codebook, the single off-ramp row uses attribution=`none`
  because observation_kind=`coverage_gap` (no direct per-event
  observed_change at the corpus's resolution). This event functions
  as a parent / coordination-layer anchor for the 2023 FSB and FATF
  crypto-asset standards updates and as a temporal landmark for the
  2023-2024 wave of G20-coordinated implementation work. DRYRUN:
  archival anchors asserted but not personally verified by the LLM
