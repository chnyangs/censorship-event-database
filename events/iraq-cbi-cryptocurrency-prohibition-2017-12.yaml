  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources verified+captured,
  awaiting human admission). Central Bank of Iraq statement dated 2017-12-03 prohibits banks
  and currency traders from dealing in cryptocurrency (Bitcoin) under AML-law penalties — a
  banking/payment-rail prohibition (in scope per codebook §9). Comparable-main tier (2017).
  One observed_change layer (offramp_cex) -> empirical_shape=comparison. attribution=direct
  (codebook §1.1) — the CBI statement is the primary instrument that mandates the
  prohibition. NOTE: candidate slug date (2017-01-01) corrected to the CBI page's own date,
  2017-12-03. The 2017 ban was later formalized by CBI Circular No. 125/5/9 (Nov 2021);
  this event captures the original 2017 action.

