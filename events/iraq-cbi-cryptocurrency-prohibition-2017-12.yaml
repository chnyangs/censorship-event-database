        Central Bank of Iraq (CBI) official statement dated December 03, 2017 (Arabic:
        "Warning on trading the virtual currency Bitcoin"). The CBI supports issuance of a
        circular against using Bitcoin and subjects those dealing in it to the provisions of
        the anti-money-laundering law — i.e. a prohibition on bank/currency-trader dealing in
        cryptocurrency, not a mere consumer caution. Page "Creation date" field shows
        December 03, 2017; earliest Wayback memento 2018-03-06.
