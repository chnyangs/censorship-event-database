analysis_notes: |
  **SCOPE RULING 2026-05-31 (automation, user-delegated):** reject as
  warning/context-only under codebook §9. The captured source is genuine CBI
  primary-government text, but the title is "تحذير تداول عملة البتكوين
  الافتراضية" ("Warning on trading the virtual Bitcoin currency") and the
  operative Arabic body says the CBI supports issuing a circular against use
  and applying AML Law No. 39/2015 to dealers. That is not enough to assert a
  binding bank/currency-trader prohibition from this page alone. Keep as
  rejected provenance; a later, clearly operative CBI circular can be authored
  as a separate event if pinned.
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources verified+captured,
  awaiting human admission). Superseded by the scope ruling above.

