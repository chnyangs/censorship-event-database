analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). Bybit's 2024-12-17
  announcement to terminate withdrawal/custody services for French-
  resident users (deadline 2025-01-08), severing the Bybit off-ramp in
  France amid AMF regulatory pressure (Bybit was AMF-blacklisted since
  2022; May 2024 AMF "not authorized" warning). comparison shape, single
  offramp_cex observed_change, attribution=plausible per §1.1 (the AMF-
  pressure cause is reported context; the cited trade press does not
  reproduce a Bybit notice naming a specific AMF instrument, so class-
  level inference is required). FR jurisdiction. l0/l1/l3/l4/asset_onchain
  not_applicable (a contractual jurisdiction exit, not a network/UI block
  or asset freeze). NOTE for human reviewer: Bybit was REVERSED out of
  this exit — removed from the AMF blacklist 2025-02-14 and pursued a
  MiCA/Bybit-EU path; this event records the 2024-12 exit action, not its
  later reversal. Sources verified via WebSearch + captured 2026-05-31
  (FX Leaders + BeInCrypto, body_hash-pinned; no fabrication).

scoped_claim: |
  "Bybit's 2024-12-17 termination of withdrawal/custody services for
  French-resident users (withdraw-by 2025-01-08) severed the Bybit
  off-ramp in France under AMF pressure; single-layer offramp_cex
  observed_change, attribution=plausible (no Bybit-stated AMF instrument
  reproduced in the cited coverage). Later reversed (AMF de-listing
  2025-02-14)."

