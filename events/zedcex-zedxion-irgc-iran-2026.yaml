analysis_notes: |
  Admitted 2026-06-09 as an attested_secondary null_event under the §9 OFAC-SDN-in-scope
  policy. The 2026-01-30 OFAC designation (Treasury sb0375) of IRGC-linked exchanges Zedcex and
  Zedxion (the first IRGC-linked exchange action) is the trigger; treasury.gov blocks automated
  capture, so the event is admitted below the strict floor on one captured contemporaneous
  source (Elliptic), corroborated by TRM/CoinDesk/Cointelegraph. No public CEX cascade
  explicitly naming the SDN entries was documented in the 14-day window, so the measurable
  surface is offramp_cex (observed_no_change / none). origin agent_draft -> human_reviewed via
  LLM adjudication + maintainer oversight (not independent-human IRR).
