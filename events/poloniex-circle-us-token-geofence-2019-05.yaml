  for the 2019-05-16 nine-asset U.S.-customer geofence (sha256:
  731147a66cc35d8d17fdd325924bc420ec0455ca344879e5a6cbd81c4bd49149). The
  trigger and observed_change now have a primary_corporate source; the
  observation attribution is direct for the corporate geofence action because
  Poloniex itself names the assets, U.S. customer class, and 2019-05-29
  16:00 UTC effective time. The rationale remains scoped as generic U.S.
  regulatory/securities uncertainty, not a named legal instrument.

