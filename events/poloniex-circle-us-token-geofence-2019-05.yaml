  draft, adversarial-verify verdict=KEEP (sources real + on-topic + §9 in-scope + not dup), AND
  passes strict admission validation; origin agent_draft -> human_reviewed).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). Circle-owned Poloniex's
  2019-05-16 announcement to disable trading of nine tokens (ARDR, BCN, DCR,
  GAME, GAS, LSK, NXT, OMNI, REP) for U.S. customers only, effective
  2019-05-29 16:00 UTC, over securities-classification uncertainty. An early
  U.S.-corporate-compliance geofence by an exchange (predates the 2021 SEC
  unregistered-exchange settlement, sec-poloniex-unregistered-exchange-2021-08,
  and sits in the same 2019 U.S.-corporate-retreat cohort as
  binance-com-us-customer-geofence-2019-06). comparison shape, single
  offramp_cex observed_change, attribution=direct for Poloniex's corporate
  geofence action; the regulatory-uncertainty rationale is self-stated/
  contextual, not a named instrument acting on the assets. The nine assets
  are independent base-chain tokens, so l0/l1/l3/l4/asset_onchain are
  not_applicable. Sources verified via WebSearch + captured 2026-05-31 and
  strengthened 2026-06-01 (official Poloniex Medium post plus CryptoGlobe and
  CoinGeek replayable anchors; asset list + "May 29" + U.S.-only scope grepped
