  comparison — S5 voluntary corporate-policy frontend geofence by
  the 1inch Network / 1inch Foundation against US-vantage users of
  the app.1inch.io frontend, effective on or about 2021-09-29. This
  is a *voluntary* corporate action: no specific US regulator
  named a 1inch enforcement action, and "perceived US regulatory
  risk" is the operator's own public explanation. Paper-relevant
  as an early S5 example of L4-only frontend-operator compliance
  action that pre-dates the comparable Uniswap Labs frontend
  token-list restriction (uniswap-frontend-delisting-2023) and the
  Aave / Tornado-Cash post-OFAC frontend blocks
  (aave-tornado-frontend-block-2022-08). The 1inch case is the
  cleanest pre-OFAC-Tornado precedent for voluntary frontend-
  operator geofencing: no upstream regulator trigger, no
  protocol-layer action, restriction observable only at L4 on a
  US-vantage axis.

  empirical_shape=comparison (1 observed_change layer: l4_frontend
  with attribution=direct via the 1inch Foundation Help Center +
  contemporaneous CryptoSlate journalism); admission_tier=
  empirical_case (1 strong-attribution observed_change layer
  satisfies the ≥1 requirement). coverage at L0/L1/L3/asset_onchain/
  offramp_cex is not_applicable on construct-not-engaged grounds
  because the geofence is purely a 1inch-operated frontend
  application-layer gate.

