coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The SEC settlement is an administrative cease-and-desist order; it
      does not direct ISP-level domain blocking or DNS interference.
      Operator-side shutdown of btct.co and ltc-global.com (effected
      2013-10 ahead of the SEC settlement) is captured at the L4 / offramp
      layers below, not at L0.
  - layer: l1_consensus
    status: not_applicable
    note: |
      2014 predates the post-Merge / post-PBS L1 relay-filter surface by
      ~8 years. Bitcoin and Litecoin proof-of-work in 2014 have no
      protocol-level relay-filter primitive analogous to the Ethereum PBS
      relay layer. not_applicable on construct-did-not-exist grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      MEV-Boost / Flashbots Protect / MEV-Blocker public-RPC compliance
      substrate that the L3 layer measures did not exist in 2014.
      not_applicable on construct-did-not-exist grounds.
  - layer: l4_frontend
    status: measured
    scope:
      - btct.co
      - ltc-global.com
    note: |
      Both BTCT (btct.co) and LTC-Global (ltc-global.com) frontends ceased
      serving the unregistered-securities-exchange surface in 2013-10
      under operator action, ahead of the 2014-12-08 SEC settlement that
      formalized the enforcement posture. The SEC order references that
      both venues had wound down trading and instructed users to withdraw
      assets prior to settlement. L4 frontend shutdown is the load-bearing
      observation at this layer.
  - layer: asset_onchain
    status: not_applicable
    note: |
      Native Bitcoin and Litecoin assets have no issuer-side blacklist /
      admin-freeze primitive. The two crypto-denominated stock-exchange
      venues issued and traded internal IOU shares of listed entities,
      not on-chain tokens with a freezable admin path. The 2014 SEC order
      does not engage any chain-level admin action. not_applicable on
      construct-did-not-exist grounds for the asset-onchain dimension as
      defined by this dataset.
  - layer: offramp_cex
    status: measured
    scope:
      - btct.co
      - ltc-global.com
    note: |
      The two venues were themselves the off-ramp / exchange platforms for
      Bitcoin/Litecoin-denominated securities trading. The 2013-10
      operator-side shutdown of trading and the SEC-mandated cease-and-
      desist plus disgorgement settlement directly terminated the off-ramp
      function for BTCT and LTC-Global users. attribution=direct because
      the SEC order itself names the regulatory mandate that finalized the
      cessation. Load-bearing observation attached below.

