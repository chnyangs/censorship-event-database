analysis_notes: |
  **SOURCE-REPAIRED 2026-06-01**: promoted-from-candidate history retained,
  but the SEC press release and administrative-order PDF now have local
  body_hash/body_path replay anchors. The earlier URL/numbering error
  (`33-9684.pdf`) has been corrected to SEC Release No. 33-9685 /
  34-73783 / IC-31366. The row is narrowed to what the order supports:
  Commission-staff-triggered website/trading winddown beginning 2013-09,
  both websites ceased by 2013-10-31, and a 2014-12-08 settlement imposing
  cease-and-desist, industry-bar, disgorgement/interest, and penalty remedies.
  This source-repair note is not a last_human_audit claim.

  comparison — earliest SEC enforcement action in the dataset against an
  unregistered crypto-denominated securities exchange. The 2014-12-08
  cease-and-desist against Ethan Burnside and BTC Trading Corp finalized
  the wind-down of two Bitcoin/Litecoin-denominated stock-exchange venues
  (BTCT and LTC-Global) that had operated 2012-2013 without registration
  as national securities exchanges. Two distinct observed_change layers:
  (1) L4 frontend (shutdown of the unregistered-exchange public surface
  at btct.co and ltc-global.com as recorded in the SEC order); (2)
  offramp_cex (termination of the Bitcoin/Litecoin exchange function the
  two venues provided). Both observations attribute_direct from the SEC
  primary-legal sources, with the public observation timestamp set to the
  2014-12-08 order date and the underlying winddown dates recorded in notes.

  Why historical_baseline tier: 2014-12 sits inside the
  historical_baseline_2013_2016 temporal tier per the 2008+ tiered frame
  in sampling/frame.yaml. analysis_use=historical_baseline excludes this
  row from the 2017+ comparable-analysis denominator while keeping it as
  cross-temporal context anchored on the modern SEC-platform-shutdown
  family (sec-beaxy-platform-shutdown-2023 is the closest 2017+ sibling).

  Why empirical_case rather than anchor_case: the two observed_change
  layers exist and are direct-attribution, but they describe the same
  operator winddown surface from different layer lenses; anchor_case
  promotion would require either an additional independent changed layer
  or pinned website archive bracketing of btct.co / ltc-global.com.

  Why L0/L1/L3/asset_onchain are not_applicable: the SEC order is an
  administrative cease-and-desist against an exchange operator, not a
  network-layer block; 2014 predates the post-Merge PBS L1/L3 measurement
  surface by ~8 years; native Bitcoin/Litecoin have no issuer-side
  admin-freeze primitive and the venues' internal IOU shares are not
  on-chain tokens with an admin path.

  Related rows: silk-road-doj-seizure-2013 (sibling 2013 baseline:
  DOJ-marketplace-seizure rather than SEC-exchange-action, but the same
  historical-baseline tier and L4 frontend takedown pattern); btc-e-doj-
  2017 (sibling exchange enforcement in the 2017+ tier, also Bitcoin-
  denominated, but DOJ rather than SEC); sec-beaxy-platform-shutdown-
  2023 (sibling 2017+ SEC platform-shutdown row, direct structural match
  on the L4 + offramp_cex two-layer shape).

scoped_claim: |
  "The 2014-12-08 SEC cease-and-desist settlement against Ethan Burnside
  and BTC Trading Corp records that, after Commission staff contact in
  2013-09, BTCT and LTC-Global disabled registration/trading functions,
  preserved user withdrawals, and had ceased operating by 2013-10-31; the
  settlement then imposed cease-and-desist, industry-bar, disgorgement /
  interest, and penalty remedies. The row claims only this SEC-order-
  supported L4/offramp_cex cessation observation and not network blocking,
  on-chain asset action, or PBS-era L1/L3 effects."

scoped_knowledge: |
  This event is the earliest SEC enforcement action in the dataset
  against a crypto-denominated unregistered securities exchange and is
  the canonical historical-baseline anchor for the SEC-exchange-
  shutdown family. Pairs with sec-beaxy-platform-shutdown-2023 as the
  2014 → 2023 cross-temporal SEC-platform-shutdown comparison: both
  events display the L4 + offramp_cex two-layer shape under SEC cease-
  and-desist authority, separated by ~8.3 years and the construct
  emergence of modern PBS-era L1/L3 measurement surfaces that did not
  exist in 2014.

