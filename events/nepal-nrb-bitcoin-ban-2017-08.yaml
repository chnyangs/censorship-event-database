analysis_notes: |
  **SOURCE REPAIR 2026-06-02** (automated source-strengthening pass). Pinned the official
  Nepal Rastra Bank Bitcoin notice PDF from the migrated NRB URL and a raw 2019 Wayback
  replay of the legacy NRB URL; both bodies have identical sha256. Rendered PDF verified
  the NRB seal/header, Foreign Exchange Management Department notice title, date
  2074/04/29 (2017-08-13), and operative instruction that Bitcoin-related transactions
  in Nepal are completely illegal and should not be conducted. Removed
  evidence_tier=attested_secondary and upgraded primary_source_verified=true. The
  Kathmandu Post arrest report remains as downstream enforcement context rather than
  the load-bearing trigger anchor.

  **ADMITTED 2026-05-31** (genuine review by human:xiangwen reviewing agent: TASK-2 lower-tier. §9-clear, well-documented deliberate restriction admitted at evidence_tier=attested_secondary (codebook §10) — single captured contemporaneous source; verified clean (no fabrication) in bulk adversarial-verify; filterable via evidence_tier.)
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources verified+captured,
  awaiting human admission).

  Nepal Rastra Bank (NRB) notice dated 2017-08-13 declared that any kind of bitcoin
  transaction is illegal in Nepal, under Section 12 of the Foreign Exchange (Regulation)
  Act, 1962 and the Nepal Rastra Bank Act, 2002. Enforcement followed on 2017-10-06 when
  the Central Investigation Bureau (CIB) of Nepal Police arrested seven persons for running
  domestic bitcoin exchange businesses (Kathmandu Post, archived). This is a binding
  prohibition with criminal enforcement, in scope under codebook §9 (a deliberate
  state restriction denying/blocking access to a crypto off-ramp), not a soft warning.

  Why trigger.type=regulatory_enforcement (not nation_state_block): per codebook §5.1,
  regulatory_enforcement is canonical for non-US national regulator administrative
  enforcement that is not an ISP/DNS network block or payment-rail severance order.
  The NRB notice is an FX-control-law prohibition enforced via police action, matching
  the bangladesh-bb-bitcoin-warning-2014 sibling treatment.

  Why attribution=direct: the official NRB notice is the blocking authority's primary
  instrument and directly names the Bitcoin transaction surface as illegal in Nepal.
  The CIB arrests are corroborating downstream enforcement evidence rather than the
  attribution anchor.

  Why comparable_main_2017_present / comparable_analysis: 2017 event, post-2017 tier.

  Remaining scope limitation: no quantitative exchange-volume measurement or complete
  domestic-platform roster is captured, so coverage remains partially_measured.

scoped_claim: |
  Nepal Rastra Bank's 2017-08-13 notice declared Bitcoin-related transactions illegal
  in Nepal under the central-bank and foreign-exchange legal framework; on 2017-10-06
  the CIB arrested seven domestic bitcoin exchange operators in the first captured
  downstream enforcement report. Effect carried at offramp_cex (observed_change,
  direct) at class level.

