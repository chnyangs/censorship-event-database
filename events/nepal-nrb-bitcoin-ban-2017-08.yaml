analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen reviewing agent: TASK-2 lower-tier. §9-clear, well-documented deliberate restriction admitted at evidence_tier=attested_secondary (codebook §10) — single captured contemporaneous source; verified clean (no fabrication) in bulk adversarial-verify; filterable via evidence_tier.)
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources verified+captured,
  awaiting human admission).

  Nepal Rastra Bank (NRB) notice dated 2017-08-13 declared that any kind of bitcoin
  transaction is illegal in Nepal, under Section 12 of the Foreign Exchange (Regulation)
  Act, 1962 and the Nepal Rastra Bank Act, 2002. Enforcement followed on 2017-10-06 when
  the Central Investigation Bureau (CIB) of Nepal Police arrested seven persons for running
  domestic bitcoin exchange businesses (Kathmandu Post, archived). This is a binding
  prohibition with criminal enforcement, in scope under codebook §9 (a deliberate
  state restriction denying/blocking access to a crypto off-ramp), not a soft warning.

  Why trigger.type=regulatory_enforcement (not nation_state_block): per codebook §5.1,
  regulatory_enforcement is canonical for non-US national regulator administrative
  enforcement that is not an ISP/DNS network block or payment-rail severance order.
  The NRB notice is an FX-control-law prohibition enforced via police action, matching
  the bangladesh-bb-bitcoin-warning-2014 sibling treatment.

  Why attribution=plausible (not direct): per §1.5, direct requires the blocking
  authority's primary instrument citing the target. This pass captured contemporaneous
  Nepali primary-press documenting the enforcement plus a retrospective tracker for the
  legal basis, but did not capture the NRB notice primary legal text; conservative
  plausible per §8.4.

  Why comparable_main_2017_present / comparable_analysis: 2017 event, post-2017 tier.

  Draft pending human audit of (i) the NRB 2017-08-13 notice primary legal text, and
  (ii) any quantitative exchange-volume measurement for offramp_cex.

scoped_claim: |
  Nepal Rastra Bank's 2017-08-13 notice declared all bitcoin transactions illegal under
  the Foreign Exchange (Regulation) Act 1962; on 2017-10-06 the CIB arrested seven
  domestic bitcoin exchange operators, shutting the domestic exchange channel. Effect
  carried at offramp_cex (observed_change, plausible) at class level.

