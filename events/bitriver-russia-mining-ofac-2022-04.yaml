  **AUTHORED 2026-05-31** (overnight census tick 5, human:xiangwen
  autonomous mandate). FIRST-OF-ITS-KIND OFAC designation of a
  cryptocurrency-MINING company: BitRiver AG + 10 Russia-based
  subsidiaries (2022-04-20, Treasury jy0731), targeting Russia's use of
  crypto mining to monetize energy resources / evade sanctions. Coded as
  null_event/null_case per the S1 convention (cf. zservers-ofac-2025):
  the designation is the trigger, but no public CEX cascade was
  documented in the 14-day window and the target is a corporate entity
  with no enumerated on-chain addresses, so the measurable cross-layer
  surface is limited (offramp_cex observed_no_change/none). Sources
  verified + captured 2026-05-31 (Treasury jy0731 + The Record,
  body_hash-pinned; no fabrication). Notable as the first crypto-mining-
  company sanction — a precedent for sanctioning mining infrastructure.

