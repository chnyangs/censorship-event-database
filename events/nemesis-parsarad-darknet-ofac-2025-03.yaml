  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources
  verified+captured, awaiting human admission). On 2025-03-04 OFAC designated
  Iran-based Behrouz Parsarad, administrator of the Nemesis darknet
  marketplace, as an SDN under counter-narcotics authority (OFAC Recent Actions
  20250304), attaching 49 virtual-currency addresses (44 BTC, 5 XMR) for
  facilitating fentanyl and other drug sales. In scope under codebook §9 (OFAC
  SDN designation). Coded null_event/null_case per the S1 convention (cf.
  bitriver-russia-mining-ofac-2022-04): the designation is the trigger, but no
  public CEX cascade was documented in the 14-day window and the attached
  addresses are BTC/XMR (no issuer-level freeze mechanism; no primary_onchain
  tx captured), so the measurable cross-layer surface is limited (offramp_cex
  observed_no_change/none). Source verified + captured 2026-05-31 (OFAC Recent
  Actions 20250304, body_hash-pinned; no fabrication).

