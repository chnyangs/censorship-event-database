coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      RPC-provider compliance filtering is an application-layer JSON-RPC
      response policy, not an ISP-level DNS or routing block. The Infura
      and Alchemy domains (infura.io, alchemy.com, *.alchemyapi.io,
      *.infura.io) remained globally reachable; the block is in the
      RPC response logic.
  - layer: l1_consensus
    status: not_applicable
    chain: ethereum
    note: |
      Pre-Merge Ethereum (Paris was 2022-09-15, 37 days after this event);
      PBS relay-censorship infrastructure did not exist yet. The
      consensus-layer effect of the 2022-08-08 OFAC trigger is captured
      in the related event tornado-cash-ofac-2022 observations[l1] for
      the post-Merge window.
  - layer: l3_rpc
    status: measured
    chain: ethereum
    provider_scope: public_and_enterprise
    note: |
      Load-bearing layer for this event. Infura (ConsenSys) and Alchemy
      Insights are the two dominant US-jurisdiction public+enterprise
      Ethereum RPC providers; the L3 column of the paper's Table 2
      treats these two providers as the substrate. Both providers
      published corporate-policy statements in August 2022 asserting
      OFAC-compliance screening of RPC requests touching the 2022-08-08
      Tornado Cash SDN addresses, and both providers implemented the
      block in their managed-RPC response logic within days of the OFAC
      designation. **First documented L3 RPC-provider sanctions block
      in the corpus** — a load-bearing event for the paper's L3 layer.
      Coverage status is `measured` because both named providers'
      corporate statements are pinned (pending body_hash on human
      audit); the provider universe at L3 is bounded to the two named
      providers via the scope_descriptor on each L3 observation.
  - layer: l4_frontend
    status: partially_measured
    scope:
      - metamask
      - app.uniswap.org
      - aggregator_uis_using_infura_default_rpc
    note: |
      Downstream frontend cascade observed at L4: MetaMask (which used
      Infura as its default Ethereum RPC backend) and aggregator UIs
      using Infura/Alchemy as default RPC endpoints surfaced broken
      Tornado-related interactions for end users in the same window
      (2022-08-09 to 2022-08-12). partially_measured because the L4
      effect is a downstream consequence of the L3 block (not an
      independent frontend-operator policy decision) and the user-
      facing behavior is recoverable only via Wayback / aggregator
      forum captures. Observation attached below at
      attribution=plausible.
  - layer: asset_onchain
    status: not_applicable
    note: |
      No issuer-level stablecoin freeze primitive is invoked by the
      L3 RPC block (the Circle USDC freeze is the sibling asset-layer
      action, captured separately in circle-usdc-tornado-2022).
  - layer: offramp_cex
    status: not_applicable
    note: |
      RPC-provider block is upstream of CEX off-ramps; the off-ramp
      reaction (dYdX, etc.) is captured under the OFAC trigger event
      tornado-cash-ofac-2022 observations[offramp_cex].

