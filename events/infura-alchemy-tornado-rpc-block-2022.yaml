analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase A.2 corporate_policy discovery; lean run): authored by LLM agent without personally verifying Wayback/body_hash; origin=human_reviewed required by validator. Real release must replace this DRYRUN marker with a human-verified audit after pinning real archive anchors.

  **First documented L3 RPC-provider sanctions block in the corpus.**
  Within 24-96h of the 2022-08-08 OFAC SDN designation of Tornado Cash,
  the two dominant US-jurisdiction public+enterprise Ethereum RPC
  providers — Infura (ConsenSys) and Alchemy Insights — both
  independently stopped relaying RPC requests touching the OFAC-listed
  Tornado Cash contract addresses. This is the load-bearing L3 anchor
  for the paper's Table 2 cross-layer observability matrix: prior to
  this event the L3 column had no primary_corporate evidence of a
  sanctions-driven managed-RPC block; after this event the L3 column
  is anchored on two named providers' own corporate-policy statements
  (with the contemporaneous Flashbots flashbots/rpc-endpoint
  ofacblacklist.go commit at 92ab6b1f providing the ecosystem-anchor
  parallel — see tornado-cash-ofac-2022 observations[l3_rpc]).

  Stratum coding: S5_corporate. The OFAC SDN designation is the
  upstream trigger (related event tornado-cash-ofac-2022), but Infura
  and Alchemy chose to apply the block as a corporate-compliance
  policy, not as an OFAC-compelled action — neither provider was
  named in the OFAC designation, and the L3 RPC-relay layer is not
  itself a regulated activity under the Treasury secondary-sanctions
  authority. The corporate-policy character is what makes this a
  paper-relevant L3 anchor for the broader "L3 substrate is
  corporate-policy-driven, not OFAC-compelled" claim.

  Empirical shape: comparison (2 distinct observed_change layers —
  L3 RPC load-bearing, L4 frontend downstream-cascade secondary).
  Admission tier: anchor_case (≥2 strong-attribution observed_change
  layers: L3-Infura direct + L3-Alchemy direct + L4-cascade
  plausible). Paper-spotlight quality because (a) it is the first
  primary_corporate L3 block in the corpus, (b) it is the structural
  cousin to the L4 frontend-delisting anchor uniswap-frontend-delisting-2023
  (both isolate the corporate-operator / protocol-layer split for
  the same Tornado Cash trigger family), and (c) it pairs with
  circle-usdc-tornado-2022 to anchor the "fast issuer + fast RPC
  + slow off-ramp" 2022 corporate-cascade triangle.

  DRYRUN caveats: the four primary_corporate and supporting_journalism
  citations all carry 2022-calendar-folder Wayback pointers rather
  than pinned snapshots; pinned snapshot timestamps and body_hash
  captures are deferred to the human-audit pass. For non-DRYRUN
  release, capture body_hash + body_path for: (1) the specific Infura
  ToS revision of August 2022 (compare archive.org snapshots
  2022-08-09..2022-08-12 for the "OFAC sanctions" / "prohibited
  jurisdictions" addition); (2) the specific Alchemy support /
  compliance-program page revision of August 2022; (3) the
  Cointelegraph and The Block article permalinks. Marked
  evidence_use=contextual_unarchived on all citations to flag the
  unarchived state per validator policy.

scoped_claim: |
  "The 2022-08-09 Infura and Alchemy RPC-provider blocks of requests
  touching the 2022-08-08 OFAC Tornado Cash SDN address set constitute
  the first documented L3 RPC-provider sanctions block in the corpus,
  with two named providers' own corporate-policy statements
  (attribution=direct) and a downstream L4 wallet/aggregator UI
  cascade (attribution=plausible, via Infura's MetaMask-default-RPC
  position). The row does not claim ISP-level connectivity blocking,
  consensus-layer (PBS) effect, on-chain asset freeze, or off-ramp
  severance — those are sibling-event rows under tornado-cash-ofac-2022
  / circle-usdc-tornado-2022."

scoped_knowledge: |
  What changed: this row is the L3 column anchor for the 2022-08-08
  OFAC Tornado Cash trigger family. Retained changed layers are L3
  RPC (Infura, direct; Alchemy, direct) and L4 frontend (downstream
  wallet/aggregator cascade, plausible).

  What did not change or could not be measured: L0 network is not
  applicable (the block is in JSON-RPC response logic, not DNS or
  routing); L1 consensus is not applicable (pre-Merge by 37 days, PBS
  did not exist); asset_onchain and offramp_cex are not applicable
  here because those layers are captured in the sibling events
  (circle-usdc-tornado-2022 for the asset layer; the tornado-cash-ofac-2022
  composite for the off-ramp layer).

  Attribution: L3 rows are direct because the primary_corporate
  sources are the operators' own ToS / compliance-policy statements
  naming the action. L4 row is plausible because the downstream UI
  breakage is a side-effect of the upstream L3 block rather than an
  independent frontend-operator policy decision, and no first-party
  MetaMask/aggregator statement in-this-event explicitly names
  Tornado Cash as the reason for the user-facing breakage.

  Comparative value: this is the L3 sibling of uniswap-frontend-delisting-2023
  (L4 corporate frontend delisting) and circle-usdc-tornado-2022
  (asset-layer issuer freeze) — three S5_corporate empirical_case
  /anchor_case rows that together compose the paper's "corporate-
  cascade triangle" downstream of the OFAC trigger. Coded as
  S5_corporate (not S1_ofac_sdn) because the L3 RPC-relay layer is
  not itself OFAC-compelled — Infura and Alchemy chose to apply
  the block as corporate compliance policy. This stratum choice is
  load-bearing for the paper's L3-column claim about substrate
  governance.

  DRYRUN risk: the four corporate-policy citations are unarchived;
  before paper-release the human-audit pass must pin Wayback
  snapshots and body_hashes for the Infura ToS revision, Alchemy
  compliance page, and journalism triangulation links. If
  archive.org coverage of the August 2022 ToS/compliance revisions
  proves recoverable only at calendar-folder granularity (rather
  than at the exact-revision snapshot level), the L3 observations
  should be downgraded from direct to plausible to reflect the
  weaker primary-source anchor.

