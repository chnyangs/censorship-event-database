analysis_notes: |
  **REPAIRED 2026-06-01** (quality loop). The previous version overclaimed
  this row as a direct, provider-primary, anchor_case L3+L4 cascade. The
  retained evidence is a captured The Block article, so this version narrows
  the case to a one-layer l3_rpc/API observed_change, marks
  evidence_tier=attested_secondary, downgrades attribution to plausible, and
  removes the unpinned L4 frontend-cascade observation.

  Method boundary: this row is useful as an aggregate S5 corporate datapoint
  showing that named infrastructure providers were reported to block Tornado
  Cash access shortly after the 2022-08-08 OFAC designation. It should not be
  cited as a first documented L3 sanctions block, a provider-admitted direct
  block, a full address-set RPC block, or an L4 frontend cascade unless future
  work pins provider-controlled historical artifacts or replayable rejection
  traces.

  Live URL drift / 404 handling: the attempted Cointelegraph URL returned 404
  during the 2026-06-01 repair and is not retained as evidence. The replayable
  anchor for the admitted observation is the local The Block capture with
  body_hash/body_path.

scoped_claim: |
  "On 2022-08-09, contemporaneous reporting stated that Infura and Alchemy
  were blocking Ethereum API access for Tornado Cash users through affected
  front-end paths after the 2022-08-08 OFAC designation. In this dataset the
  row is a one-layer S5 corporate l3_rpc/API observed_change with
  attribution=plausible and evidence_tier=attested_secondary; it does not
  claim provider-primary attribution, a complete RPC-network block, a fixed
  address-set block, L0/L1/asset/off-ramp effects, or a separately measured
  L4 frontend cascade."

scoped_knowledge: |
  Retained: a narrow L3 API / node-infrastructure restriction reported for
  Infura and Alchemy on 2022-08-09, pinned to a local capture of The Block.

  Excluded: provider-primary admission, direct attribution, complete address
  enumeration, command-line / direct contract unavailability, and a separate
  L4 wallet or aggregator UI observation. Those claims require additional
  provider-controlled archives, reproducible RPC/API rejection evidence, or
  frontend-specific artifacts.

