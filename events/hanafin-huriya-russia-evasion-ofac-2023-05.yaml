analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources
  verified+captured, awaiting human admission).

  null_event documenting the 2023-05-19 OFAC SDN designation (EO 14024) of
  Dubai-based John Desmond Hanafin and his firm Huriya Private, part of the
  126-target jy1494 Russia sanctions-evasion action. Hanafin's SDN entry carries
  an Ethereum-address identifier (~$4.9M received, mostly USDT); the
  designation targets crypto/financial-services facilitation of Russian
  sanctions evasion (moving Russian funds into UAE accounts).

  Coded null_event / null_case per the S1 convention
  (cf. ofac-dprk-it-worker-sim-hyon-sop-2023-04, bitriver-russia-mining-ofac-2022-04):
  the designation is the trigger, but no public CEX cascade was documented in
  the 14-day window. Per codebook §1.6 the named Ethereum address is not coded
  as an asset_onchain observation absent a captured primary_onchain freeze
  tx_hash; the measurable surface is carried at offramp_cex
  (observed_no_change / none). Sources verified + captured 2026-05-31 (Treasury
  jy1494 + OFAC RA 20230519, both body_hash-pinned; no fabrication).

scoped_claim: |
  "OFAC's 2023-05-19 SDN designation of John Desmond Hanafin + Huriya Private
  (Dubai), part of the jy1494 Russia-evasion action, named a single Ethereum
  address. No public CEX cascade was documented in the 14-day window.
  null_case: financial-services-facilitator target with limited measurable
  cross-layer surface at draft time."

