    resolved: true
    resolved_timestamp: 2022-03-04T00:00:00Z
    note: |
      The over-block side-effect on Venezuela (and per some reports
      Iran) was corrected by ConsenSys within ~24h of the initial
      configuration; service to Venezuelan users was restored on
      2022-03-04 per contemporaneous CoinDesk reporting. The
      intended block on the Donetsk and Luhansk regions remained
      in place (not resolved at the corporate-policy level in this
      window). resolved=true here refers narrowly to the
      over-block correction; precision=day.
  - layer: l3_rpc
    resolved: false
    note: |
      The intended IP-geo block on the Donetsk/Luhansk (and other
      OFAC-comprehensively-sanctioned) regions remained in place
      at the RPC layer; this is the persistent enforcement
      perimeter through the subsequent corporate-policy window and
      is not reversed in this event.

analysis_notes: |
  **NEW EVENT AUTHORED - DRYRUN 2026-05-16** (Phase D of 2026-05-16
  staged-release plan; lean run): authored by LLM agent without
  personally verifying Wayback/body_hash; origin=agent_draft and
  status=draft per validator policy. Real release must replace this
  DRYRUN marker with a human-verified audit after pinning real
  archive anchors and (if accepted) promoting origin to
  human_reviewed and status to admitted or observation_active.

  **First documented L3 + L4 IP-geo region-block in the corpus
  driven by a US comprehensive-sanctions Executive Order.** Within
  10 days of the 2022-02-21 EO 14065 (comprehensive sanctions on
  the Donetsk and Luhansk regions of Ukraine), ConsenSys (operator
  of Infura RPC and MetaMask wallet UI) implemented an
  IP-geolocation block on Infura RPC endpoint reachability and on
  MetaMask wallet-UI rendering for users whose IP resolved to the
  newly-sanctioned regions (plus the prior comprehensive-sanctions
  set: Crimea, Iran, North Korea, Cuba, Syria). A configuration
  error transiently extended the block to users in Venezuela (and
  per some user reports, Iran end-users), generating contemporaneous
  community outcry; ConsenSys corrected the over-block within ~24h.

  Stratum coding: S5_corporate. The OFAC/Treasury action (EO 14065)
  is the upstream trigger, but ConsenSys chose to apply the block
  as a corporate-compliance policy at the RPC/frontend layer, not
  as an OFAC-compelled action against a designated entity. The
  corporate-policy character is what makes this a paper-relevant
  L3+L4 anchor for the broader "L3+L4 substrate is
  corporate-policy-driven, not OFAC-compelled" claim, and
  parallels the L3-RPC sibling event
  infura-alchemy-tornado-rpc-block-2022 (which is address-set
  screening rather than IP-geo).

  Empirical shape: comparison (2 distinct observed_change layers -
  L3 RPC IP-geo block, L4 frontend UI error state including the
  Venezuela/Iran over-block window). Admission tier: empirical_case
  (≥1 strong-attribution observed_change layer with both L3 and L4
  rows at attribution=direct via ConsenSys's own corporate
  statement).

  Comparative value: this is the IP-geo counterpart of the
  address-set sibling infura-alchemy-tornado-rpc-block-2022. The
  pair isolates the two distinct L3-RPC enforcement perimeters that
  emerged in 2022: (a) IP-geo region filtering (this event, driven
  by comprehensive sanctions on a geographic region) and (b)
  address-set screening (the August 2022 Tornado Cash event, driven
  by an SDN designation on a specific contract set). Both pairs
  are L3-load-bearing with downstream L4 cascade.

  DRYRUN caveats: the four primary_corporate and supporting_journalism
  citations all carry 2022-calendar-folder Wayback pointers rather
  than pinned snapshots; pinned snapshot timestamps and body_hash
  captures are deferred to the human-audit pass. For non-DRYRUN
  release, capture body_hash + body_path for: (1) the specific
  ConsenSys blog revision of March 2022 (compare archive.org
  snapshots 2022-03-03..2022-03-04 for the "Russia-Ukraine
  conflict" / "compliance" wording); (2) the CoinDesk 2022-03-03
  and 2022-03-04 article permalinks; (3) the Decrypt article
  permalink. Marked evidence_use=contextual_unarchived on all
  citations to flag the unarchived state per validator policy.

scoped_claim: |
  "The 2022-03-03 ConsenSys IP-geographic block at the Infura RPC
  endpoint layer and at the MetaMask wallet UI layer, applied to
  end-users in the Donetsk and Luhansk regions of Ukraine (plus
  the prior comprehensive-sanctions region set) in response to the
  2022-02-21 EO 14065, constitutes the first documented S5_corporate
  IP-geo region-block in the corpus, with both L3 (RPC reachability)
  and L4 (wallet UI rendering) rows anchored on ConsenSys's own
  corporate statement (attribution=direct). The row does not claim
  ISP-level connectivity blocking, consensus-layer (PBS) effect,
  on-chain asset freeze, or off-ramp severance. The contemporaneous
  Venezuela/Iran over-block was a transient configuration error
  corrected within ~24h and is recorded as a recovery row on the
  L4 layer."

scoped_knowledge: |
  What changed: this row is the L3+L4 IP-geo anchor for the
  2022-02-21 EO 14065 (Donetsk/Luhansk comprehensive sanctions)
  trigger family at the S5_corporate stratum. Retained changed
  layers are L3 RPC (Infura IP-geo block, direct) and L4 frontend
  (MetaMask UI error state, direct).

  What did not change or could not be measured: L0 network is not
  applicable (the block is in application-layer IP-geo response
  logic, not in DNS or BGP routing); L1 consensus is not applicable
  (pre-Merge by ~6 months, PBS did not exist); asset_onchain and
  offramp_cex are not applicable here (no issuer-level freeze and
  no CEX engagement at the RPC/frontend block layer).

  Attribution: L3 and L4 rows are direct because the primary
  corporate source is ConsenSys's own statement naming the action,
  the targeted regions, and the over-block error. The
  Venezuela/Iran over-block side-effect is interpretable from the
  contemporaneous corporate statement plus CoinDesk/Decrypt
  triangulation; it is captured as a recovery row (L4 resolved
  within ~24h) rather than as a separate observed_change row to
  avoid double-counting the same physical configuration action.

  Comparative value: pair with infura-alchemy-tornado-rpc-block-2022
  to isolate the two distinct L3-RPC corporate-compliance
  enforcement perimeters of 2022 (geographic IP-geo vs. address-set
  screening). Both are S5_corporate, both have L3 load-bearing
  with L4 downstream cascade, and both share Infura as one of the
  named operators - making the pair useful for the paper's
  "corporate-policy-driven L3 substrate" claim.

  DRYRUN risk: the four corporate-policy and journalism citations
  are unarchived at pinned-snapshot granularity. Before paper-
  release the human-audit pass must pin Wayback snapshots and
  body_hashes for the ConsenSys blog revision and the
  CoinDesk/Decrypt article permalinks. If archive.org coverage
  of the March 2022 ConsenSys blog revision proves recoverable
  only at calendar-folder granularity, the L3 and L4 observations
  should be downgraded from direct to plausible to reflect the
  weaker primary-source anchor.

