coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The block is implemented as an application-layer IP-geo filter on
      the Infura RPC endpoints and the MetaMask wallet UI, not an
      ISP-level DNS or BGP block. The Infura and MetaMask domains
      remained globally resolvable; the geo-filter is in the
      application response logic.
  - layer: l1_consensus
    status: not_applicable
    chain: ethereum
    note: |
      Pre-Merge Ethereum (Paris was 2022-09-15, ~6 months after this
      event); PBS/relay censorship infrastructure did not exist yet.
      The IP-geo block at the RPC/frontend layer does not engage
      consensus-layer block production.
  - layer: l3_rpc
    status: partially_measured
    chain: ethereum
    provider_scope: public_and_enterprise
    note: |
      Load-bearing layer for the event's primary mechanism. Infura
      (ConsenSys-operated managed Ethereum RPC service) added the
      Donetsk/Luhansk IP-geo block at the RPC endpoint level in the
      2022-03-03 enforcement window in response to EO 14065. The
      block is implemented in the RPC endpoint reachability logic
      (IP-geolocation filter on incoming requests). partially_measured
      because the corporate-policy statement is pinned at calendar-
      folder Wayback granularity only (pending body_hash on human
      audit); provider universe at L3 is bounded to Infura on the
      ConsenSys side.
  - layer: l4_frontend
    status: partially_measured
    scope:
      - metamask
    note: |
      Downstream frontend cascade observed at L4: the MetaMask wallet
      UI surfaced an error state to users whose IP-geolocation
      resolved to the blocked regions (and, transiently during the
      misconfiguration window, to Venezuela / Iran). The L4
      observation is a direct user-facing manifestation of the L3
      IP-geo block via Infura's MetaMask-default-RPC position.
      partially_measured because the user-facing behavior is
      recoverable mainly via Wayback / community-forum captures
      (Twitter, Reddit) rather than a first-party MetaMask
      help-center revision pinned at exact-snapshot granularity.
  - layer: asset_onchain
    status: not_applicable
    note: |
      No issuer-level stablecoin freeze or on-chain asset action is
      invoked by the IP-geo block; the IP-geo filter is upstream of
      any on-chain action.
  - layer: offramp_cex
    status: not_applicable
    note: |
      The IP-geo block is at the RPC/frontend layer and does not
      directly engage CEX off-ramps.

