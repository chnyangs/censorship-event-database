analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: TASK-2 source-strengthen.
  Pinned the official BSP Memorandum M-2022-035 PDF (primary_government, Wayback-archived) — satisfies
  attribution=direct + the admission floor. PDF text verified to substantiate the 3-year VASP-license
  moratorium from 2022-09-01.).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission).

  comparison documenting the BSP's three-year moratorium on new VASP
  (virtual asset service provider) license applications, effective
  2022-09-01 under Resolution No. 1141 (dated 2022-08-04, announced
  2022-08-12), later extended indefinitely from 2025-09-01. This is a
  market-entry censorship action: it denies new crypto exchanges the BSP
  license required to operate in the Philippines, restricting access to a
  legitimate service class (§9 INCLUDE — a deliberate restriction of
  market entry by a state actor). Carried at offramp_cex.

  Codebook rules applied: trigger.type=regulatory_enforcement (§5.1 — the
  BSP is a non-US national regulator and the moratorium is an
  administrative licensing restriction, not a network/payment-rail block,
  not a court order); research_stratum=S4_nation_state per §5.2.
  attribution=direct per §1.1: the BSP publicly issued the resolution and
  the action names the target class (new VASP licensees) and the
  restriction (window closure). empirical_shape=comparison /
  admission_tier=empirical_case: one offramp_cex observed_change layer
  with direct attribution (§3, §4).

  Why comparable_main_2017_present: 2022-09-01 is in the 2017+ comparable-
  analysis window. analysis_use=comparable_analysis (canonical per §6).

  Why offramp_cex is partially_measured (not measured): the action is
  documented and contemporaneous, but no structured enumeration of the
  affected applicant set / measurement slice was pinned (§2 honesty rule).
  Why L0/L1/L3/L4/asset_onchain are not_applicable: the moratorium is an
  administrative licensing-window closure that engages no network block,
  no L1/L3 PBS primitive, no third-party frontend, and no asset-issuer
  admin path. (The sibling philippines-sec-binance-block-2024 is the L0
  block in the corpus; this event is the market-entry restriction.)

  Verification: WebSearch confirmed Resolution No. 1141 (dated 2022-08-04),
  the three-year window closure effective 2022-09-01, the 2025 indefinite
  extension, and BSP Governor Medalla's quote across Rappler, Philstar,
  Manila Bulletin, and CNN Philippines. The captured anchor is the Rappler
  report (Wayback memento 20220819111117); the BSP's own MediaDisp.aspx
  press page was rejected as a capture target because its archived HTML is
  a non-content-bearing JavaScript shell. Human audit should attempt to
  pin the BSP primary press release (correct ItemId) or the Official
  Gazette text, and may add the 2025 indefinite-extension release
  (MediaDisp ItemId 7647) as a follow-on observation.

scoped_claim: |
  BSP Resolution No. 1141 (2022-08-04, effective 2022-09-01) closed the
  regular application window for new VASP licenses in the Philippines for
  three years (later extended indefinitely from 2025-09-01), denying new
  crypto exchanges market entry. Effect carried at offramp_cex as an
  observed_change with direct attribution; the affected applicant set is
  not enumerated and no exchange-side measurement slice is pinned in this
  authoring pass.

