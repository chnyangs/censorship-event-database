  null_event documenting the absence of any specific 2022
  Rosfinmonitoring formal enforcement order against Binance's
  Russia-facing RUB / P2P offramp rails. Open-source web review
  (Reuters 2022-04-22 Special Report; CoinDesk 2022-04-22 denial;
  Moscow Times / Finance Magnates / BeInCrypto 2023 P2P-delisting
  coverage) surfaces three adjacent but distinct phenomena, none of
  which is a 2022 Rosfin-initiated ruble-rail enforcement:

    1. An April-2021 Kostarev–Rosfin data-sharing arrangement
       (pre-2022, informal / bilateral, not a 2022 ruble-rail order).
    2. Binance's own EU-sanctions-driven restrictions on Russia-
       resident accounts in April 2022 (corporate_policy_change
       triggered by EU sanctions, not by Rosfin order).
    3. Binance P2P sanctioned-bank delistings in August 2023 and
       RUB-pair discontinuation effective 2024-01-31 (post-2022,
       driven by external US/WSJ pressure and DOJ-settlement
       posture rather than by Rosfin order).

  The investigative hypothesis "Rosfinmonitoring 2022 pressure on
  Binance ruble-rail / P2P operations following sanctions" therefore
  fails the admission grade for an empirical_case: no replayable
  Rosfin-side artifact targeting Binance ruble rails in 2022 has
  been identified. Coded null_event / null_case to serve as a
  denominator control on the S4_nation_state Russia axis,
  sibling to russia-cbr-crypto-payment-ban-2022 (the affirmative
  CBR-side 2022 action) and to binance-russia-exit-commex-2023
  (the downstream 2023 Binance Russia exit).

  Codebook compliance: §5.1 trigger.type = regulatory_enforcement
  (non-US national regulator administrative enforcement); §5.2
  stratum-actor map (regulatory_enforcement → S4_nation_state);
  §6 analysis_use (comparable_main_2017_present →
  comparable_analysis); §7 enumeration (subset + enumeration_note
  documents class-level rationale, no `class_level` value used);
  §3 empirical_shape (null_event, 0 observed_change layers); §4
  admission_tier (null_case, 0 strong-attribution observed_change
  layers); §8.5 DRYRUN preamble present.

  Attribution posture: all rows are observed_no_change with
  attribution=none (schema-mandated for observed_no_change). If a
  Rosfin-issued formal order against Binance ruble rails in the
  2022 calendar window is later surfaced (e.g. via FOIA-equivalent
  Russian-regulator publication or via Binance corporate disclosure),
  this row should be re-opened as a comparison / cascade event with
  the Rosfin order as a primary_legal trigger anchor.

scoped_claim: |
  "No replayable Rosfinmonitoring formal enforcement artifact
  against Binance's Russia-facing RUB / P2P offramp rails during
  the 2022 calendar window has been identified at the 2026-05-17
  authoring date. The adjacent Reuters-reported April-2021
  Kostarev–Rosfin data-sharing arrangement (pre-2022), Binance's
  voluntary April-2022 EU-sanctions-driven Russia restrictions,
  and the August-2023 P2P sanctioned-bank delistings do not
  evidence a 2022 Rosfin-initiated ruble-rail enforcement order.
  Coded null_event / null_case as a S4_nation_state Russia-axis
  denominator control, sibling to russia-cbr-crypto-payment-ban-2022
  and parent to binance-russia-exit-commex-2023."

