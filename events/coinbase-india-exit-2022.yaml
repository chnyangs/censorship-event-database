analysis_notes: |
  comparison documenting Coinbase's 2022-04 India market retreat:
  launched 2022-04-07 with UPI integration; NPCI issued disavowal statement
  within 3 days; Coinbase disabled India UPI within the same week. Brian
  Armstrong later characterized it as "informal pressure" from RBI. This is
  an unusual datapoint — a market-exit by a US exchange from a major
  jurisdiction via informal rather than formal sanction, distinct from the
  direct RBI bank-rail severance of 2018 (see india-rbi-crypto-ban-2018).

scoped_claim: |
  "Coinbase's 2022-04 India market entry was reversed within days through
  informal regulatory pushback via NPCI, illustrating that even after the
  2020 Supreme Court IAMAI ruling lifting the direct RBI crypto ban,
  informal financial-rail-level pressure can effectively block major
  US-exchange market access. Documents informal-pressure enforcement mode
  alongside the 2018 RBI formal-prohibition mode."

