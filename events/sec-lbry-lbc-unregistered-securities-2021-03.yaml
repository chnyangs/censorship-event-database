analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: read the event +
  the captured SEC primary source confirming the unregistered-exchange/offering charge and the
  platform-restriction effect; §9 enforcement-censorship; clean per wave-2 verify; validate.py [OK]).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission). S3 SEC securities-
  enforcement event, comparable_main tier. Codebook §9 explicitly lists
  the "LBRY suit" as an INCLUDE example. The 2021-03-29 SEC complaint
  (SEC v. LBRY, Inc., No. 21-cv-260, D.N.H.) charged LBRY with an
  unregistered offering of LBC crypto asset securities sold July 2016 -
  February 2021 (~$12.2M proceeds); the November 2022 court ruling that
  LBC was a security — even outside an ICO, including for consumptive use
  — and the litigation cost led LBRY to wind down operations in 2023.
  comparison shape: 1 observed_change layer (offramp_cex, issuer-conduct
  restriction), attribution=direct (the unregistered-offering charge and
  ruling name the issuer and the LBC asset and are the direct legal
  effect). asset_onchain is not_applicable per §1.6: LBC is a native PoW
  coin with no issuer freeze primitive and the remedy is an issuer-level
  charge/ruling — no primary_onchain tx_hash exists or can exist — so the
  effect is routed to offramp_cex. L0/L1/L3/L4 not_applicable (the SEC
  filing did not touch network reachability, the LBRY PoW consensus
  surface, RPC, or order a frontend takedown — the 2023 site wind-down
  followed the ruling and was the company's response, not an ordered L4
  block). Primary anchor is litigation release LR-25573, captured at the
  current /enforcement-litigation/ SEC.gov path (the 2021-era URL was
  retired in the 2024 site migration); the live archived copy
  (20241207235421) records the charge AND the Court's liability finding.
  Sources verified via WebSearch 2026-05-31; body_hash-pinned and grep-
  confirmed (no fabrication). Awaiting human audit before promotion from
  draft.

scoped_claim: |
  "The 2021-03-29 SEC charge in SEC v. LBRY, Inc. (D.N.H.) and the
  Court's finding that LBRY's LBC sales were an unregistered securities
  offering are recorded as a single-layer offramp_cex issuer-conduct
  restriction, attribution=direct. The row does not claim ISP-level
  blocking, an SEC-ordered frontend takedown (the 2023 LBRY wind-down was
  the company's own response to the ruling and litigation cost), or an
  on-chain LBC freeze (no such on-chain receipt exists)."

