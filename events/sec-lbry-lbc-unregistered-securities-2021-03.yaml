      wayback: https://web.archive.org/web/20241207235421/https://www.sec.gov/enforcement-litigation/litigation-releases/lr-25573
      body_hash: sha256:4b5f930697a111c534f596767de2147c9c3f2457277fba8bd3418c4789451c06
      body_path: sources/http_captures/sec-lbry-lbc-unregistered-securities-2021-03/primary/web.archive.org__web-20241207235421-https-www.sec.gov-enforcement-litigation-litigation-releases-lr-25573__4db1f7573e.html
      evidence_use: replayable
      note: |
        SEC litigation release LR-25573 (SEC v. LBRY, Inc.): the SEC's
        complaint (filed 2021-03-29 in the U.S. District Court for the
        District of New Hampshire) charged LBRY, Inc. with conducting an
        unregistered offering and sale of crypto asset securities. The
        complaint alleged that from at least July 2016 to February 2021,
        LBRY (a video-sharing application) sold crypto asset securities
        called "LBRY Credits" (LBC) to numerous investors including U.S.
        investors, without filing a registration statement and without an
        exemption. The captured litigation-release page records that LBRY
        received approximately $12.2 million in proceeds in U.S. dollars
        and crypto assets from its LBC sales, and that the Court found
        LBRY violated the charged provisions (reserving relief for a later
        date). Wayback 20241207235421 pinned (the 2021 SEC URL path was
        retired in the 2024 SEC.gov site migration; this is the live
        archived copy at the current /enforcement-litigation/ path).
        Verified facts present in captured HTML: "LBRY", "LBRY Credits",
        "LBC", "unregistered", "July 2016", "February 2021", "$12.2
        million", "the Court found that LBRY violated".
  timestamp_sources:
    - type: primary_legal
      note: |
        Day-level precision per the SEC complaint filing date 2021-03-29
        in SEC v. LBRY, Inc. (No. 21-cv-260, D.N.H.), corroborated by
        contemporaneous reporting (CoinDesk 2021-03-30).

target:
  kind: entity
  enumeration: complete
  enumeration_note: |
    LBRY, Inc. (New Hampshire-based issuer of the LBRY Credits / LBC token
    and operator of the LBRY protocol and the Odysee video platform;
    named in SEC v. LBRY, Inc., No. 21-cv-260, D.N.H.). Subject-matter
    scope: the LBC token and the July 2016 - February 2021 sale of LBC
    (~$12.2M proceeds per the SEC filing). enumeration=complete: the row
    enumerates the single named issuer entity and the LBC instrument as
    the offering charged/ruled unregistered. No on-chain addresses are
    enumerated: the action is a securities-law charge and ruling against
    the issuer, not an on-chain freeze of an LBC address.
  actor_type: token_issuer_securities_enforcement
  actor_name: LBRY, Inc.
  chains: []
  canonical_domains:
    - lbry.com
    - odysee.com

jurisdiction: [US]

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The SEC civil action and D.N.H. ruling are securities-law remedies
      against the LBRY issuer; they did not alter ISP-level reachability
      of lbry.com or odysee.com. not_applicable on the L0 layer.
  - layer: l1_consensus
    status: not_applicable
    note: |
      The LBRY blockchain is an independent proof-of-work chain; the L1
      layer this dataset measures (post-Merge Ethereum PBS relay surface /
      validator-set filtering) has no LBRY-specific consensus surface
      engaged by a securities-law charge. not_applicable.
  - layer: l3_rpc
    status: not_applicable
    note: |
      No hosted RPC-provider surface is engaged by the SEC charge.
      not_applicable.
  - layer: l4_frontend
    status: not_applicable
    note: |
      The SEC charge did not require shutdown of lbry.com or odysee.com;
      it operates at the token-offering / issuer-conduct layer. The 2023
      LBRY wind-down followed the November 2022 liability ruling and the
      cost of the litigation, but the SEC filing itself did not order a
      frontend takedown. not_applicable.
  - layer: asset_onchain
    status: not_applicable
    note: |
      The §1.6 asset_onchain evidence floor requires a primary_onchain
      tx_hash; the SEC remedy is an issuer-level charge/ruling, not an
      on-chain freeze/blacklist of any LBC address (LBC is a native
      proof-of-work coin with no issuer freeze primitive), so no on-chain
      receipt exists or can exist. Per §1.6 routing, the enforceable
      effect is carried at offramp_cex. not_applicable on asset_onchain.
  - layer: offramp_cex
    status: measured
    scope:
      - lbc_token_offering
      - lbry_inc_issuer_conduct
    note: |
      Load-bearing layer. The 2021-03-29 SEC charge and the subsequent
      finding that LBRY violated the registration provisions is the
      operator/issuer-state-change endpoint of the episode: LBRY's LBC
      offering was ruled an unregistered securities offering. This is the
      closest analogue this dataset has to an issuer/offramp restriction
      acting on the issuer's ability to offer the asset. Attached below as
      observed_change / attribution=direct (the unregistered-offering
      ruling is the direct legal effect of the SEC charge against the
      named issuer and named asset).

