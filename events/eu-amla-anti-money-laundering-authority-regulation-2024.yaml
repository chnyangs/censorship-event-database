  Null-event recording the 2024-05-30 Council adoption of Regulation (EU)
  2024/1620 establishing AMLA, the EU-level supervisor for AML/CFT
  including direct supervision of high-risk CASPs. Headquartered in
  Frankfurt am Main. AMLA begins operations 2025-07-01; first selection
  of directly supervised entities scheduled 2027; direct supervision from
  2028-01-01.

