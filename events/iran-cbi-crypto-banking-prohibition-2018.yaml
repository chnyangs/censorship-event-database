analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-4 audit (S4 comparison/Iran cluster)
  by human:xiangwen as empirical_case. LoC Law Library "Regulation of
  Cryptocurrency: Iran" Wayback 20180729055635 (loc.gov; maint.loc.gov had
  no memento) + CCN Wayback 20180423124611 reclassified semi_primary_wayback
  (2 independent). offramp_cex observed_change direct->plausible (CBI order
  itself not pinned as primary_*). CBI 2018-04-22 prohibited Iranian banks/
  credit institutions/exchanges from handling cryptocurrencies. comparison/
  empirical_case preserved.

  **NEW EVENT AUTHORED — DRYRUN 2026-05-17**

  Agent draft of the Central Bank of Iran (CBI) 2018-04-22 administrative
  prohibition on Iranian banks, credit institutions, and currency exchanges
  handling cryptocurrencies. This is the first major MENA-region central-bank
  banking-rail prohibition and pre-dates the broader 2018-11 OFAC sanctions
  re-imposition on Iran (see related iran-ransomware-ofac-2018 for the parallel
  OFAC action later that year).

  Coded per codebook §5.1 as `trigger.type: regulatory_enforcement` (non-US
  national regulator administrative enforcement; CBI is a non-US central bank
  issuing administrative restrictions on regulated entities rather than a
  domain/payment-rail block). Per §5.2 this maps to `S4_nation_state`.

  empirical_shape `comparison` reflects this event's natural pairing with
  india-rbi-crypto-ban-2018 (2018-04-06 RBI banking-rail severance, 16 days
  prior) as the two earliest 2018 major-economy central-bank prohibitions on
  bank-crypto servicing. Both share the offramp_cex single-layer cascade
  shape with `direct` attribution from the regulator's order text.

  admission_tier `empirical_case` per codebook §4 (>=1 strong-attribution
  observed_change layer). attribution coded `direct` because the CBI order
  itself names the regulated-institution class as the target and the regulatory
  mandate as the cause — analogous to the india-rbi-crypto-ban-2018 coding
  (RBI circular cited as direct because it names the banking-service severance
  as the regulatory mandate).

  All current citations are `evidence_use: contextual_unarchived` (LoC
  summary, secondary journalism, Wikipedia) with DRYRUN wayback stubs;
  body_hash + body_path captures of the LoC report and the underlying Persian-
  language CBI order text are pending human-review audit. Per repo convention,
  contextual_unarchived sources cannot support paper claims until promoted to
  admission_anchor with body_hash + body_path.

