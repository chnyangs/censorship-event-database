analysis_notes: |
  comparison — the only 4-framework (DOJ + FinCEN + OFAC + CFTC)
  coordinated action against a single exchange in the dataset. $4.3B
  resolution is the largest corporate crypto enforcement in history. Paper-
  worthy structural contrast: a $B-scale enforcement that results in
  compliance remediation rather than SDN listing / domain seizure produces a
  fundamentally different cascade shape from the Cryptex-style (SDN + USSS
  seizure) path. The Binance path = "corporate survives with monitor";
  Cryptex path = "exchange is destroyed".

scoped_claim: |
  "The 2023-11-21 DOJ + FinCEN + OFAC + CFTC $4.3B settlement with Binance
  Holdings and CEO Changpeng Zhao represents the only 4-framework coordinated
  enforcement in the dataset. The canonical binance.com frontend remained
  operational post-settlement (observed_no_change); compliance-remediation
  regime under 5-year monitorship (observed_change, direct). Structurally
  distinct from SDN-listing / domain-seizure enforcement paths."

