  comparison — the 2023-03-27 CFTC civil complaint in the N.D. Ill.
  against Binance Holdings + Changpeng Zhao + Samuel Lim (former CCO) is
  the FIRST of four US federal enforcement actions that ultimately
  converge on the 2023-11-21 multi-agency $4.3B settlement (DOJ +
  FinCEN + OFAC + CFTC). Charges include operating an unregistered
  derivatives exchange / DCM / SEF / FCM, offering illegal off-exchange
  leveraged retail commodity transactions to US persons, willful
  evasion of US federal law via VPN-based circumvention guidance, and
  BSA / AML / KYC failures. Resolved 2023-11-21 via $1.35B CFTC
  monetary penalty as the commodities-side share of the $4.3B
  multi-agency settlement.

  **Document overlap with binance-4framework-2023**: this CFTC
  complaint event is the FIRST of the four federal actions that
  consolidate at the 2023-11-21 settlement; the multi-agency
  settlement event captures the CONSOLIDATED $4.3B resolution
  (including the $1.35B CFTC component). This event is admitted
  separately because the 2023-03-27 CFTC complaint precedes the
  consolidated settlement by ~8 months (240 days) — paper-worthy
  temporal sequencing: a $B-scale enforcement can produce a multi-month
  rails-enforcement pendency before the consolidated resolution
  materializes. Care: do NOT double-count the same rails-level
  remediation at both events; the 2023-11-21 settlement event holds
  the structural cascade artifacts (compliance-monitor regime,
  retrospective review), while this 2023-03-27 event holds only the
  formal commencement of the CFTC rails-enforcement axis.

  Relationship to sec-v-binance-2023 (2023-06-05, 70 days later) and
  binance-4framework-2023 (2023-11-21, 240 days later): the CFTC
  complaint is the earliest of the three Binance US-federal-enforcement
  events in the dataset. Stratification across these three events
  produces a 240-day enforcement timeline (CFTC → SEC → multi-agency
  settlement) against a single $B-scale exchange — the longest
  multi-axis enforcement sequence in the dataset.

  Empirical_shape = comparison (1 observed_change layer: offramp_cex);
