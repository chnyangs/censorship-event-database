analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-4 audit (S4 comparison/Kazakhstan cluster)
  by human:xiangwen as empirical_case. NetBlocks internet-disruption
  measurement Wayback 20220104182416 (semi_primary_measurement) + CoinDesk
  Wayback 20220106124152 (semi_primary_wayback) replayable body_hash;
  CCAF mining-map measurement retained. l1_consensus observed_change
  attribution direct->plausible (no KZ gov shutdown order pinned as
  primary_*; hashrate collapse measured via NetBlocks + CCAF + press).
  2022-01-05 Kazakhstan national internet shutdown (energy-price protests)
  -> Bitcoin hashrate ~194->168 EH/s (~13% drop); KZ ~18% global share.
  comparison/empirical_case preserved.

  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (agent_draft per user
  instruction; status=draft because no body_hash+body_path archive
  anchors have been pinned in this session). Authored by LLM agent
  without personally verifying Wayback/body_hash; human review required
  to elevate to admitted status.

  **First pure L0 network-layer event in the corpus.** This event is
  structurally novel relative to prior nation-state triggers in the
  dataset (china-pboc-crypto-ban-2021, nigeria-cbn-crypto-ban-2021,
  malaysia-sc-binance-disable-2021): those events are policy-directive
  triggers whose first-order substrate is corporate-compliance or
  exchange-offramp reactions; the Kazakhstan 2022-01 event is a direct
  nation-state internet shutdown whose first-order substrate is the L0
  network layer itself, with the L1 consensus-layer hashrate collapse
  as the downstream cascade effect.

  comparison shape: 2 observed_change layers (L0 load-bearing, L1
  causally chained). The L0+L1 pairing makes this event a candidate for
  promotion to anchor_case once per-vantage replayable measurement
  artifacts (NetBlocks snapshot body_hash, IODA outage JSON, CBECI
  mining-map per-month JSON, OONI KZ measurement_ids) are pinned in a
  human-audit pass. The two distinct cascade layers (L0 → L1) are
  causally coupled via the mining-pool stratum-server reachability
  dependency, not independent observations.

  Sibling relationship to china-sichuan-mining-ban-2021-06: the China
  2021 mining ban (and the broader China crypto-mining displacement
  cluster) drove the post-2021 migration of Chinese hashrate to
  Kazakhstan, making KZ the ~18% global hashrate share per CBECI fall
  2021 estimate. The Kazakhstan 2022-01 shutdown is therefore the
  first major L0-triggered hashrate disruption in the post-China-2021
  bitcoin-mining geography.

  DRYRUN caveats: all citations carry evidence_use=contextual_unarchived
  with wayback wildcard pointers (web/2022/) rather than pinned-timestamp
  snapshots; body_hash+body_path captures are deferred to the human-audit
  pass. For non-DRYRUN release, capture body_hash + body_path for:
  (1) NetBlocks 2022-01-05 KZ shutdown report (canonical L0 anchor),
  (2) Cloudflare Radar / Cloudflare blog post on KZ shutdown,
  (3) IODA outage signature JSON for KZ Jan 2022,
  (4) OONI Explorer KZ-vantage measurements (Jan 2022 window) — at
      minimum a web_connectivity slice for crypto-relevant domains,
  (5) CBECI mining-map JSON for the Jan 2022 country-share window,
  (6) CoinDesk + The Block + CNBC 2022-01-05/06/07 contemporaneous
      journalism coverage,
  (7) Access Now timeline for the recovery anchor.

  Per validator constraint (item 11 in instructions): network_layer →
  l0_network, mining_hashpower → l1_consensus. trigger.type =
  nation_state_block; research_stratum = S4_nation_state.

scoped_claim: |
  "On 2022-01-05 at approximately noon UTC, the government of
  Kazakhstan under President Tokayev ordered a nationwide internet
  shutdown in response to political unrest. NetBlocks recorded
  normalized country-level connectivity falling to ~2% (L0 layer,
  attribution=direct), and the bitcoin network total hashrate dropped
  from ~194 EH/s to ~168 EH/s within the same day as the
  Kazakhstan-hosted miner population (~18% global hashrate share per
  CBECI fall-2021) lost stratum-server connectivity (L1 consensus
  layer, attribution=direct, causally chained from the L0 shutdown).
  L0 restored on or around 2022-01-10; hashrate recovered to
  pre-shutdown levels within ~1 week of L0 restoration. This is the
  first pure L0 network-layer event in the corpus. Admission-anchor-grade
  promotion pending pinned archive captures (NetBlocks snapshot,
  IODA JSON, CBECI mining-map JSON)."

