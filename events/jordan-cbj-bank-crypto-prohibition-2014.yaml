      grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      The MEV-Boost / Flashbots Protect / MEV-Blocker public-RPC compliance substrate
      that the L3 layer measures did not exist in 2014. not_applicable on
      construct-did-not-exist grounds.
  - layer: l4_frontend
    status: not_applicable
