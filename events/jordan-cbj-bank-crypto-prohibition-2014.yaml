analysis_notes: |
  **SOURCE REPAIR 2026-06-02** Official CBJ English-translation PDF of Circular
  No. 1/1/2451 pinned locally. Removed `evidence_tier=attested_secondary`,
  upgraded `primary_source_verified=true`, corrected the trigger/observation date
