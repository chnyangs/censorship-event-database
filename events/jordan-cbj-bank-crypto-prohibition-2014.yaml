  (2014-02-20), and set observation attribution to direct based on the official
  circular. Narrowed wording to the official PDF's target class: licensed banks,
  financial companies, exchange companies, and payment-card companies.

  **ADMITTED 2026-05-31** (genuine review by human:xiangwen reviewing agent: TASK-2 lower-tier. §9-clear, well-documented deliberate restriction admitted at evidence_tier=attested_secondary (codebook §10) — single captured contemporaneous source; verified clean in bulk adversarial-verify; filterable via evidence_tier. Reworded a stale planning marker.)
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources verified+captured,
  awaiting human admission).

  Historical-baseline authoring pass for the 2014-02-20 Central Bank of Jordan (CBJ)
  circular prohibiting licensed banks, financial companies, exchange companies, and
  payment-card companies operating in Jordan from dealing in Bitcoin / virtual currency,
  exchanging it for other currency, opening accounts to deal with it, or sending/receiving
  transfers against it for buying or selling. This is an institutional debanking / payment-rail prohibition
  (a censorship action under codebook §9 INCLUDE: a deliberate restriction of banking and
  payment service to crypto), not a soft non-recognition advisory. The captured CBJ PDF
  carries the operative circular language directly, distinguishing it from the
  contemporaneous Mexico / Denmark / Cambodia non-recognition statements that §9 excludes.

  Why §9 INCLUDE rather than exclude: although the report also restates the standard "not
  legal tender" framing, the load-bearing fact is the circular ORDERING regulated
  institutions not to deal in crypto — a mandate that restricts access to banking/payment
  rails, parallel to the Nigeria 2021 CBN circular and the China 2013 PBOC notice. That is
  a censorship action, not an advisory.

  Why trigger.type=nation_state_block: the CBJ action is a payment-rail prohibition
  directed at the regulated-institution class (codebook §5.1 "Nation-state ISP/DNS block /
  payment-rail prohibition" family, alongside NG CBN, India RBI). Per §5.2 the permitted
  research_stratum is S4_nation_state.

  Why historical_baseline tier: 2014 events belong to historical_baseline_2013_2016;
  analysis_use=historical_baseline excludes this row from the 2017+ comparable-analysis
  denominator, matching the validator's tier-vs-analysis-use rule.

  Why empirical_shape=comparison / admission_tier=empirical_case: one direct-attribution
  observed_change layer (offramp_cex). L1/L3/asset_onchain are construct-did-not-exist in
  2014; L0/L4 are scope-mismatched. Single load-bearing strong-attribution layer ->
  comparison / empirical_case.

  Why attribution=direct: the circular text (the regulatory mandate itself, quoted by the
  CBJ payment-services director) names the institutional dealing prohibition, satisfying the
  §1.5 nation-state-mandate reading at the off-ramp rail.

  Source note: the official CBJ PDF is an English translation for knowledge; it states
  that the Arabic version is adopted for legal purposes. It is still a CBJ-domain primary
  government artifact and is sufficient for the scoped English-language claim.

scoped_claim: |
  The Central Bank of Jordan Circular No. 1/1/2451 of 2014-02-20 prohibited licensed
  banks, financial companies, exchange companies, and payment-card companies from
  dealing in Bitcoin / virtual currency, exchanging it for any other currency, opening
  customer accounts to deal with it, or sending/receiving transfers against it for
  buying or selling. The offramp_cex layer carries the load-bearing direct-attribution
  observation.

