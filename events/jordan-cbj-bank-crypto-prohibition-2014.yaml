      The circular targets regulated financial institutions, not specific Jordanian
      crypto frontends; no frontends were enumerated targets. not_applicable on
      scope-mismatch grounds.
  - layer: asset_onchain
    status: not_applicable
    note: |
      Bitcoin native asset has no issuer-side blacklist / freeze admin method, and the
      circular does not engage a stablecoin-issuer admin path (USDT first issued
      ~2014-10). not_applicable on construct-did-not-exist grounds.
  - layer: offramp_cex
    status: measured
    scope:
      - jordanian_banking_and_payment_channels_to_crypto
    note: |
      The circular is by construction an off-ramp / financial-rail event: it prohibits
      all Jordanian banks, financial companies, exchange companies, and payment-card
      companies from dealing in Bitcoin / virtual currency, exchanging it for any
      other currency, opening customer accounts to deal with it, or sending/receiving
      transfers against it for buying or selling. This severed the regulated
      banking/payment channel between Jordanian users and crypto. The official CBJ
      circular text names the regulatory mandate, giving direct attribution at this
      layer. Marked measured; load-bearing observation attached below.

