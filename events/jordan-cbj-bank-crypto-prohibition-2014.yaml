      all Jordanian banks, currency-exchange companies, financial companies, and
      payment-service companies from dealing in virtual currencies. This severed the
      regulated banking/payment channel between Jordanian users and crypto, a standing
      prohibition that remained the primary regulatory mechanism until Jordan's 2025
      virtual-assets regulation pivot. The CBJ circular text (per the payment-services
