  the Binance corporate blog, CoinDesk, and Decrypt URLs.

  null_event documenting the JFSA-permitted change-of-control by which
  Binance acquired 100% of Sakura Exchange BitCoin (SEBC), a registered
  CAESP under the Payment Services Act, on 2022-11-30. This row is the
  permissive counter-example to JP_FSA enforcement actions against
  Binance (japan-fsa-binance-warning-2018) and to non-US national
  regulators denying Binance market access (france-amf-binance-psan-
  2022, germany-bafin-binance-licence-withdrawal-2023). The same
  regulator-target dyad (JP_FSA × Binance) produced two opposite
  outcomes under the same registered-VASP regime: a 2018 unregistered-
  operations warning forcing market exit, and a 2022 permitted change-
  of-control via licensed-VASP acquisition enabling market re-entry.

  Structural contribution to the dataset: serves as a S4_nation_state
  permissive denominator control. The corpus's S4_nation_state stratum
  is heavily weighted toward enforcement-positive actions (warnings,
  cease-and-desist, licence withdrawal, market-access denial); this row
  documents the JFSA's accommodation pathway (licensed-VASP acquisition)
  to anchor the null/permissive end of the distribution. Pairs cleanly
  with the 2018 Binance warning row for direct same-regulator same-
  target counterfactual analysis.

  Codebook compliance:
  - §5.1 trigger.type = regulatory_enforcement (non-US national
    regulator administrative action under the registered-VASP regime,
    including permissive accommodations such as change-of-control
    approval; coded under regulatory_enforcement because the
    underlying authority is the JFSA's CAESP supervisory perimeter
    rather than a network/payment-rail block).
  - §5.2 stratum-actor map (regulatory_enforcement → S4_nation_state).
  - §6 analysis_use (comparable_main_2017_present →
    comparable_analysis).
  - §7 target.enumeration = subset (Binance + SEBC entity pair is the
    single named target dyad; no `class_level` value used).
  - §3 empirical_shape = null_event (0 observed_change layers; row is
    admitted via observed_no_change with admission-grade sources).
  - §4 admission_tier = null_case (0 strong-attribution
    observed_change layers).
  - §8 DRYRUN preamble present per LLM-authoring-agent compliance
    requirement.

  Attribution posture: all rows are observed_no_change with
  attribution=none (schema-mandated). No direct / plausible
  attribution is asserted because no censorship/blocking behavioral
  change is being claimed — the entire point of this row is to
  document the permissive null outcome. Any subsequent JFSA
  enforcement action against Binance Japan (e.g., a business-
  improvement order under the Payment Services Act) would be authored
  as a separate event with this row as the permissive-counterfactual
  parent.

  DRYRUN caveats: trigger primary citation (Binance corporate blog
  2022-11-30) and supporting journalism (CoinDesk, Decrypt) are
  asserted with year-folder Wayback pointers; pinned snapshot
  timestamp and body_hash captures for the specific permalinks are
  deferred to human audit. For non-DRYRUN release, capture body_hash
  + body_path for: (1) the Binance 2022-11-30 corporate blog, (2) any
  JFSA notification of the SEBC change-of-control on the JFSA's
  registered-CAESP roster (kanto-local-finance-bureau registry), (3)
  the SEBC corporate disclosure, (4) the 2023-08 Binance Japan
  full-service launch announcement (downstream operational
  materialisation). Marked evidence_use=contextual_unarchived on all
  citations to flag the unarchived state per validator policy.

scoped_claim: |
  "Japan FSA's registered-VASP regime under the Payment Services Act
  permitted Binance's 2022-11-30 acquisition of 100% of Sakura
  Exchange BitCoin (SEBC), a JFSA-registered Crypto-Asset Exchange
  Service Provider, enabling Binance's re-entry into the Japanese
  market via licensed-VASP change-of-control. As of the 2026-05-17
  authoring date no enforcement-driven JP-resident-access restriction
  attributable specifically to the 2022-11-30 trigger has been
  observed. Coded null_event / null_case as the permissive counter-
  example to JP_FSA enforcement actions against Binance
  (japan-fsa-binance-warning-2018) and to non-US national regulator
  Binance-market-access denials (france-amf-binance-psan-2022,
  germany-bafin-binance-licence-withdrawal-2023), and as a
  S4_nation_state permissive denominator control."

