analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17 (Wave 2.2D)**. Discovery-
  layer censorship case: on 2021-03-11 morning (Beijing time) the
  official Chinese-language Sina Weibo accounts of three major
  crypto exchanges — Binance, Huobi (HTX) and OKEx (OKX) — were
  rendered inaccessible with the standard Weibo takedown formula
  ("violated relevant laws and regulations" / "abnormal practices").
  Contemporaneous international press (CoinDesk, Forkast, AMBCrypto,
  Finance Magnates, Invezz) and PRC state-affiliated press (Global
  Times) corroborate the outage window and framing.

  Codebook rules applied:
  - §5.1 trigger.type=nation_state_block: Weibo platform-level
    account takedowns under PRC content-directive enforcement are
    grouped under the nation_state_block trigger family alongside
    the 2021 PBOC notice and the State Council mining crackdown.
    Cyberspace Administration of China (CAC) is the typical
    PRC actor coordinating cross-platform content takedowns of this
    shape; CAC-direction is inferred rather than evidenced by a
    public per-account directive.
  - §5.2 research_stratum=S4_nation_state: matches the trigger.type
    stratum-actor map for nation_state_block.
  - §1.4 attribution=plausible (not direct): the blocking provider
    (Sina Weibo) did not publicly cite a specific CAC directive
    naming the three exchange accounts; the standard "violated
    relevant laws and regulations" formula is consistent with CAC-
    coordinated content enforcement but does not name an upstream
    trigger document. Per §1.4 frontend-block attribution rule,
    absent a public-statement-citing-the-trigger linkage, the
    correct call is plausible. Three observed_change rows
    (Binance, Huobi, OKEx) all carry attribution=plausible.
  - §3 empirical_shape=comparison: three observed_change rows but
    all at the same L4 frontend layer → 1 distinct observed_change
    layer → comparison (not cascade, which requires ≥3 distinct
    layers).
  - §4 admission_tier=empirical_case: ≥1 strong-attribution
    (plausible) observed_change layer (l4_frontend).
  - §7 target.enumeration=subset: three named exchange accounts are
    a defensible slice of the broader Finance-Magnates-reported
    "12+ accounts" purge; class-level rationale recorded in
    enumeration_note per codebook §7 guidance.
  - §6 analysis_use=comparable_analysis (canonical form) for the
    comparable_main_2017_present tier.

  Status=draft with origin=agent_draft pending human audit of:
  (i) per-account Wayback pre/post body-hash diffs of the three
  Weibo URLs (binancezh, huobiglobalofficial, okexchina) for the
  2021-03-10..2021-03-31 window;
  (ii) enumeration of the broader Finance-Magnates-reported "12+
  affected crypto Weibo accounts" set;
  (iii) any publicly-archived CAC content directive that names
  the takedown (would promote attribution from plausible to
  direct under §1.4);
  (iv) precise Wayback snapshot timestamps for all citation URLs
  (currently year-resolved prefix per codebook wayback-discipline).

  Significance: this is the earliest 2021 PRC discovery-layer
  censorship event in the dataset, preceding the China State
  Council 2021-05-21 mining crackdown by ~10 weeks and the
  2021-09-24 PBOC joint notice by ~6 months. It demonstrates that
  Chinese platform-level content-directive enforcement of crypto
  exchange brand presence is independent of and chronologically
  prior to the exchange-side mainland-China cutoffs triggered by
  the September 2021 PBOC notice. As a discovery-layer case it
  measures the search/social gateway component of cross-layer
  censorship, complementing the L0 network-layer and offramp-CEX
  cascade surfaces of the related events.

scoped_claim: |
  On 2021-03-11 morning (Beijing time), the official Chinese-
  language Sina Weibo accounts of Binance, Huobi (HTX) and OKEx
  (OKX) were rendered inaccessible with the standard PRC content-
  takedown formula, eliminating the search/social discovery path
  to those exchanges' Chinese-language official content. The
  takedowns are coded attribution=plausible (CAC-coordinated
  inference) per codebook §1.4 because no public per-account CAC
  directive was archived; the cascade surface is L4 frontend at
  the discovery layer only.

scoped_knowledge: |
  This event extends the dataset's cross-layer censorship coverage
  to the discovery layer (search/social), complementing the L0
  network-layer measurement and offramp-CEX cascade surfaces of
  sibling 2021 China events. The Weibo takedowns are
  chronologically prior to both the State Council 2021-05-21
  mining crackdown and the PBOC 2021-09-24 joint notice, which
  indicates that PRC platform-level content-directive enforcement
  of crypto exchange brand presence on domestic social media
  operates independently of and earlier than the eventual
  exchange-side cutoffs of mainland-China users. The pattern is
  consistent with CAC's broader cross-platform content-takedown
  playbook: a coordinated, same-day, multi-account takedown using
  a uniform "violated relevant laws and regulations" notice
  formula. Strengthening attribution from plausible to direct
  would require either (a) the CAC publishing a content directive
  that names the three exchange accounts, or (b) Sina Weibo
  publishing a compliance statement citing a specific CAC order —
  neither is in the publicly-archived record as of this authoring
  pass.

