trigger:
  type: nation_state_block
  actor: CN_WEIBO_CAC
  timestamp: 2021-03-11T07:15:00Z
  timestamp_precision: minute
  citation:
    - type: supporting_journalism
      url: https://www.coindesk.com/policy/2021/03/11/weibo-suspends-huobi-binance-okex-accounts-after-bitcoin-surge
      wayback: https://web.archive.org/web/2021/https://www.coindesk.com/policy/2021/03/11/weibo-suspends-huobi-binance-okex-accounts-after-bitcoin-surge
      evidence_use: contextual_unarchived
      note: |
        CoinDesk report dated 2021-03-11 titled "Weibo Suspends Huobi,
        Binance, OKEx Accounts After Bitcoin Surge". Documents that the
        official Chinese-language Weibo accounts of Huobi, Binance and
        OKEx were rendered inaccessible the morning of 2021-03-11 with
        a Weibo system notice stating the accounts violated "relevant
        laws and regulations" (the standard Weibo takedown formula
        used to enforce Cyberspace Administration of China — CAC —
        content directives). Timestamp anchor 2021-03-11T07:15Z
        (~02:15 ET / 15:15 Beijing) is taken from contemporaneous
        coverage citing the morning of 2021-03-11 Beijing time as the
        outage window. Wayback snapshot URL given as year-resolved
        prefix per codebook wayback-discipline; precise snapshot
        timestamp requires re-pinning in human audit.
    - type: supporting_journalism
      url: https://www.globaltimes.cn/page/202103/1218100.shtml
      wayback: https://web.archive.org/web/2021/https://www.globaltimes.cn/page/202103/1218100.shtml
      evidence_use: contextual_unarchived
      note: |
        Global Times (PRC state-affiliated English-language outlet)
        report dated 2021-03-11 titled "Weibo deactivates major
        Bitcoin trading platforms in China". State-affiliated framing
        is corroborative on the actor-side: the article notes that
        the accounts had "violated laws and community rules" per
        Weibo's notice. Used as state-press corroboration of the
        takedown window and content-directive framing typical of
        CAC-coordinated platform enforcement. Specific Wayback
        snapshot timestamp requires re-pinning in human audit.
    - type: supporting_journalism
      url: https://forkast.news/weibo-takedown-huobi-binance-okex-crypto-china/
      wayback: https://web.archive.org/web/2021/https://forkast.news/weibo-takedown-huobi-binance-okex-crypto-china/
      evidence_use: contextual_unarchived
      note: |
        Forkast News analysis (2021-03) titled "What Weibo's takedown
        of Binance & Huobi means for crypto in China". Provides
        regional-press context on the policy reading that the
        platform-level takedown was consistent with prior CAC
        content directives against crypto-trading promotion. Specific
        Wayback snapshot timestamp requires re-pinning in human
        audit.
  timestamp_sources:
    - type: supporting_journalism
      note: |
        CoinDesk and Global Times both date the account outages to
        the morning of 2021-03-11 (Beijing time). Minute-level
        precision is taken from the CoinDesk-reported ~02:15 ET
        outage window (= 07:15 UTC = 15:15 Beijing).

target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    Named targets are the official Chinese-language Weibo accounts of
    three major crypto exchanges — Binance, Huobi (HTX) and OKEx
    (OKX) — that were rendered inaccessible on 2021-03-11. Finance
    Magnates reporting indicates the purge extended to 12+ crypto-
    related Weibo accounts in the surrounding window, so subset
    rather than complete: the three named exchange accounts are a
    defensible slice of the broader Weibo crypto-account purge but
    do not enumerate every affected account. canonical_domains lists
    the Weibo profile URLs of the three named exchanges; the
    underlying off-exchange brand domains are tracked separately on
    sibling events.
  entity: cn_weibo_crypto_exchange_account_purge
  actor_type: discovery_layer_social_media_account_set
  actor_name: Sina Weibo official accounts of Binance / Huobi / OKEx
  chains: []
  canonical_domains:
    - weibo.com/binancezh
    - weibo.com/huobiglobalofficial
    - weibo.com/okexchina

jurisdiction:
  - CN

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The action is a platform-internal account takedown on Sina
      Weibo (weibo.com), not an ISP-level domain block or DNS
      interference against the exchange brand domains. L0 network
      reachability of binance.com / huobi.com / okx.com from CN
      vantage is a separate measurement question tracked under
      china-pboc-crypto-ban-2021 (where OONI returned zero CN
      measurements in the relevant window). Not the cascade surface
      for this discovery-layer event.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Pre-Merge event (Ethereum Merge 2022-09-15). The OFAC-
      compliance-adjacent post-Merge PBS relay-filtering substrate
      did not exist at event time. not_applicable on construct-did-
      not-exist grounds, consistent with sibling 2021 China
      regulatory events.
  - layer: l3_rpc
    status: not_applicable
    note: |
      Flashbots Protect (launched 2022-11) and MEV-Blocker (launched
      2023-03-27) did not exist in 2021-03. The L3 public-RPC
      compliance substrate that this layer measures is not
      constructible for this event. not_applicable on construct-
      did-not-exist grounds.
  - layer: l4_frontend
    status: partially_measured
    scope:
      - weibo.com/binancezh
      - weibo.com/huobiglobalofficial
      - weibo.com/okexchina
    note: |
      The cascade surface is the discovery layer: Sina Weibo as a
      Chinese-language social-media gateway by which prospective
      users locate official exchange announcements. The three named
      exchange Weibo accounts were rendered inaccessible on
      2021-03-11, eliminating the search/social discovery path to
      official exchange content for Chinese-language users.
      Contemporaneous press (CoinDesk, Global Times, Forkast,
      Finance Magnates, Invezz, AMBCrypto) corroborates the
      takedown. partially_measured because the public-record
      enumeration covers the three named accounts plus the Finance-
      Magnates-reported "12+ accounts" framing but does not
      exhaustively enumerate every affected handle, and no Wayback
      pre-takedown / post-takedown body-hash diff has been pinned in
      this authoring pass.
    denominator_artifact:
      type: scope_descriptor
      scope_descriptor:
        countries:
          - CN
        providers:
          - sina_weibo
        domains:
          - weibo.com/binancezh
          - weibo.com/huobiglobalofficial
          - weibo.com/okexchina
        time_window:
          - 2021-03-10T00:00:00Z
          - 2021-03-31T00:00:00Z
      note: |
        Coverage scope: official Chinese-language Weibo accounts of
        Binance, Huobi and OKEx in the 2021-03-10..2021-03-31
        window. A Wayback pre/post body-hash diff and an enumeration
        of the broader Finance-Magnates-reported "12+ accounts" set
        are gating steps for a stronger denominator anchor.
  - layer: asset_onchain
    status: not_applicable
    note: |
      A Weibo platform-level account takedown does not engage any
      stablecoin-issuer admin freeze path at any specific address
      level. not_applicable.
  - layer: offramp_cex
    status: not_measured
    note: |
      The 2021-03-11 Weibo purge is a discovery-layer signal and
      did not, on its own, force exchange-side cutoff of mainland-
      Chinese accounts. The subsequent exchange-side cutoffs are
      attributed to the 2021-09-24 PBOC joint notice (see related
      event china-pboc-crypto-ban-2021). Not the cascade surface
      for this event.

