        resolution if/when located.

target:
  kind: entity
  entity: liberty_reserve_costa_rica_license_denial_target_2011
  enumeration: subset
  enumeration_note: |
    Named target: Liberty Reserve S.A. (Costa Rica corporate
    vehicle of the Liberty Reserve digital-currency service,
    operated by Arthur Budovsky). SUGEF refused to license the
    firm to operate as a regulated financial entity in Costa Rica.
    Marked subset because the SUGEF action targets the named
    Liberty Reserve corporate entity and does not enumerate the
    five additional Costa Rican shell companies through which
    Budovsky subsequently continued operations (those surface in
    the 2013 US DOJ indictment, not the 2011-03-07 SUGEF denial).
    No on-chain addresses: Liberty Reserve was a centralized
    off-chain digital-currency ledger ("LR" units backed by USD/
    EUR/gold-grams), not a blockchain token.
  actor_type: digital_currency_administrator_msb
  actor_name: Liberty Reserve S.A. (Arthur Budovsky)
  canonical_domains:
    - libertyreserve.com

jurisdiction:
  - corporate_global

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The 2011-03-07 SUGEF license refusal did not invoke any
      ISP / DNS / network-layer block of libertyreserve.com. The
      2013 L4 frontend takedown of the libertyreserve.com domain
      following the US DOJ unsealed indictment is a downstream
      action recorded against the separate 2013 event row, not
      this 2011 predicate event.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Liberty Reserve was a centralized off-chain digital-currency
      ledger administered by Liberty Reserve S.A. (Costa Rica);
      there is no blockchain and no decentralized consensus layer.
      Out of scope.
  - layer: l3_rpc
    status: not_applicable
    note: |
      No hosted RPC provider surface implicated. Liberty Reserve
      pre-dates Ethereum (genesis 2015-07) by ~4 years and operated
      as a centralized web-account ledger.
  - layer: l4_frontend
    status: not_applicable
    note: |
      No SUGEF-attributed L4 takedown of libertyreserve.com on
      2011-03-07. The libertyreserve.com domain remained
      operationally accessible after the SUGEF license refusal;
      Budovsky continued operations through five additional Costa
      Rican corporate vehicles. The 2013-05 US DOJ-ordered frontend
      seizure of libertyreserve.com is a separate downstream event.
  - layer: asset_onchain
    status: not_applicable
    note: |
      Liberty Reserve's "LR" units were off-chain ledger entries
      administered by Liberty Reserve S.A., not a blockchain token.
      No asset-layer freeze instrument exists to attach.
  - layer: offramp_cex
    status: measured
    scope: [liberty_reserve]
    note: |
      Load-bearing layer. SUGEF's 2011-03-07 license refusal denied
      Liberty Reserve S.A. authorization to operate as a regulated
      financial entity in Costa Rica. The firm continued operating
      without SUGEF certification — an unlicensed-operation status
      that became the explicit predicate for the May 2013 US DOJ
      18-USC-1960 ("operation of an unlicensed money transmitting
      business") count in the unsealed indictment. Coverage status
      is `measured` because the SUGEF posture is publicly attested
      in contemporaneous Tico Times reporting and the downstream
      DOJ indictment, even though this DRYRUN row does not pin per-
      quarter Wayback snapshots of libertyreserve.com.

