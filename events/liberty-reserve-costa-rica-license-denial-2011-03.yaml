  **Jurisdiction coding caveat**: Costa Rica (CR) is the actual
  jurisdiction of this SUGEF administrative action, but `CR` is not
  in the schema's jurisdiction enum. Coded as `corporate_global` as
  the least-misleading available value in the present enum; this is
  a known mis-coding that should be resolved by adding `CR` to the
  jurisdiction enum in the next schema update. The observation row
  uses `country: CR` to preserve the true jurisdiction signal in a
  field where the schema is open-form, and `enumeration_note` /
  `target.actor_name` make the Costa Rican corporate vehicle
  explicit.

  comparison shape: 1 observed_change layer (offramp_cex, SUGEF
  refusal creating Liberty Reserve's unlicensed-operation status in
  Costa Rica). This 2011 SUGEF denial is the load-bearing predicate
  that the 2013 US DOJ unsealed indictment cited under 18 USC s 1960
  (operation of an unlicensed money transmitting business). It sits
  alongside egold-doj-guilty-plea-2008-07 in the pre-Bitcoin
  digital-currency-administrator enforcement lineage (e-Gold 2008
  → Liberty Reserve SUGEF 2011 → Liberty Reserve DOJ 2013 →
  FinCEN-2013-G001 → Shrem 2014 → Coin.mx 2015 → BTC-e 2017),
  hence related_events:[egold-doj-guilty-plea-2008-07].

  attribution=direct under §1.1 of codebook: the named regulator
  (CR_SUGEF) is the public actor of the licensing refusal and
  Liberty Reserve S.A. is the named target of that refusal.
  trigger.type=regulatory_enforcement under §5.1 (non-US national
  regulator administrative enforcement; the action is administrative
  — a license-application denial — not a network/payment-rail block).
  research_stratum=S4_nation_state per §5.2 mapping. Admission tier
