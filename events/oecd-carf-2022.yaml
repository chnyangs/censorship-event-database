    note: |
      CARF imposes tax-reporting obligations on RCASPs, not frontend
      domain takedowns. Individual RCASPs may surface CARF-related KYC /
      tax-residency prompts in their UI but no canonical frontend-level
      domain effect is implicated by the framework itself.
  - layer: asset_onchain
    status: not_applicable
    note: |
      CARF does not impose any asset-layer freeze, blacklist, or issuer
      action. The framework is metadata-collection-only at the RCASP
      transaction-reporting level; the underlying assets and on-chain
      protocols are not directly targeted.
  - layer: offramp_cex
    status: measured
    note: |
      Load-bearing layer for this event. RCASP-level reporting
      obligations attach at the off-ramp interface between regulated
      crypto-asset service providers and their tax-authority reporting
      pipelines. The RCASP definition is the substantive operational
      bite of the framework.

