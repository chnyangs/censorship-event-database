analysis_notes: |
  comparison documenting the 2025-11-04 DPRK laundering-network designation. The
  event is **structurally novel** within the dataset: every one of the 53 designated
  addresses is USDT-on-TRON, giving a single-token-on-single-chain target shape that no
  earlier event matches.

  **Core finding (from overnight empirical batch)**: spot-check of 2 of the 53 addresses
  via usdtbanlist.com reveals they were **already blocked by Tether on 2025-04-30 — ~188
  days BEFORE the OFAC designation**. This reverses the expected cross-layer causation
  direction: rather than "OFAC → Tether freeze cascade," the observed pattern is "Tether
  freeze precedes OFAC action by 6 months," suggesting either (a) upstream Treasury /
  FBI / TRM Labs intelligence reaches Tether months before formal SDN publication, or
  (b) Tether acts on its own compliance signals (chain-analytics firms' DPRK-cluster
  tagging) independently of the formal OFAC process. This is a paper-worthy structural
  finding: **the timing direction of the asset-layer cascade is opposite to what the
  dataset's comparison class presumes**.

  Follow-up directions (post-admission): full 53-address enumeration (versus the 2-address spot check); ideal
  verification would cross-reference Tronscan logs for each of the 53 addresses to
  confirm whether the 2025-04-30 batch-freeze covered all of them.

scoped_claim: |
  "OFAC's 2025-11-04 DPRK laundering-network designation attached 53 USDT-TRC20 addresses
  to SDN, giving the first single-token / single-chain target shape in the dataset. Asset-
  layer cascade observation (Tether freeze response) is the natural experiment this event
  sets up; empirical query pending."

