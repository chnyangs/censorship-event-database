coverage:
  - layer: l0_network
    status: not_applicable
  - layer: l1_consensus
    status: not_applicable
    chain: tron
    note: |
      TRON has no PBS / relay-level censorship mechanism analogous to Ethereum's. TRON's
      block production is delegated-proof-of-stake with 27 super-representatives — there is
      no comparable OFAC-compliance metric to aggregate. Note we also don't claim a secondary
      Ethereum L1 measurement because the event does not touch ETH addresses.
  - layer: l3_rpc
    status: not_applicable
    chain: tron
    note: TRON public API / Tronscan endpoints don't maintain OFAC-filter lists in the Ethereum MEV-Blocker sense.
  - layer: l4_frontend
    status: not_applicable
    note: Designation targets financial institutions and IT-worker networks, not web-service operators with canonical frontends.
  - layer: asset_onchain
    status: measured
    chain: tron
    note: |
      Full 53/53 address enumeration complete via usdtbanlist.com batch scan
      (sources/asset_layer_scan/dprk-usdt-network-ofac-2025.json + per-address HTML
      captures in sources/http_captures/.../asset-layer-check/).

      Freeze timing is **mixed rather than uniform**:
      - **Pre-OFAC batches** (25 addresses frozen by Tether 188-180 days before
        2025-11-04 designation):
        - 10 addresses frozen 2025-04-30 07:04 UTC
        - 7 addresses frozen 2025-04-30 07:05 UTC
        - 8 addresses frozen 2025-05-08 10:20 UTC
      - **OFAC-day reactive batch** (28 addresses frozen same day as designation):
        - 24 addresses frozen 2025-11-04 21:38 UTC
        - 3 addresses frozen 2025-11-04 21:39 UTC
        - 1 address frozen 2025-05-08 10:21 UTC (likely late-arrival from the May batch)

      Interpretation: Tether's compliance had pre-identified roughly half of the DPRK
      cluster 6 months before OFAC made it public (the Apr 30 / May 8 2025 batches), and
      the remainder was swept on OFAC designation day with a ~21-hour delay. This is
      consistent with Tether operating on BOTH (a) upstream compliance intelligence for
      some addresses and (b) reactive OFAC-following for the remainder.
  - layer: offramp_cex
    status: not_measured
    note: |
      Chain-analytics anchors pinned 2026-04-22 as primary_corporate
      substrate for per-event offramp_cex reasoning (Chainalysis, TRM,
