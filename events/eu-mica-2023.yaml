analysis_notes: |
  comparison documenting the EU's 2023-06-09 MiCA Regulation OJ
  publication — the first supranational unified crypto regulatory
  framework globally. Distinct from individual EU-member-state actions;
  MiCA operates at the EU-27 level. Paper-relevant as a regulatory
  framework that creates the legal substrate for downstream CASP actions
  (Binance EU compliance, Kraken UK withdrawal, Tether's USDT delisting
  from some EU CASPs in late 2024). This event captures the regulatory
  trigger; the downstream CASP actions are separate follow-on events
  (not yet in dataset — future S5 expansion).

scoped_claim: |
  "EU MiCA Regulation 2023/1114 publication on 2023-06-09 established the
  first supranational unified crypto regulatory framework globally, with
  phased rollout through 2024-12-30. Represents a regulatory-framework-
  trigger event distinct from SDN-style enforcement; downstream CASP-
  specific compliance actions are expected as follow-on events through
  2025."

