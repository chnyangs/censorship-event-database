analysis_notes: |
  comparison — first full-prohibition EU sanctions targeting
  individual retail crypto users (Russian nationals/residents as a class).
  Structurally distinct from OFAC address-level SDN designations: no
  wallet-address enumeration, no on-chain observability — the observable
  signal is exclusively at the offramp_cex layer via CASP account-closure
  compliance. Paper-worthy as a "class-prohibition" mode distinct from
  the "address-list-prohibition" OFAC mode.

scoped_knowledge: |
  Retail-user-class prohibition is a novel enforcement mode that doesn't
  produce on-chain artifacts observable without CASP cooperation. The
  measurement implication: class-based crypto sanctions can only be
  studied via CASP compliance statements, not via public blockchain
  records.

scoped_claim: |
  "EU Council Regulation 2023/2878 on 2023-12-18 extended Article 5aa of
  the Russia sanctions framework from an EUR 10K threshold to full
  prohibition on providing crypto-asset services to Russian nationals/
  residents via EU CASPs. First full-prohibition user-class sanction
  in the dataset; observational signal is exclusively at offramp_cex
  layer via CASP compliance."

