  comparison shape: 1 observed_change layer (offramp_cex load-bearing).
  Structurally aligned with the 2021 multi-
  jurisdictional Binance regulator wave (uk-fca-binance-markets-2021,
  netherlands-dnb-binance-warning-2021, malaysia-sc-binance-disable-2021)
  but distinct in two respects: (1) FSMA action targets the Binance
  Belgian-customer cohort with an explicit repatriation-of-customer-assets
  remedy (asset-flow severance, not just licensing warning), and (2) it
  invokes the EEA-incorporation perimeter — services offered from outside
  the EEA to Belgian residents are the prohibited surface, foreshadowing
  the MiCA EEA-passporting framework (eu-mica-2023) that came into force
  shortly afterward.

  Paper-relevant contrast: comparable cousin to UK-FCA-2021 (single-
  regulator action producing class-wide Binance customer cohort
  severance), but where FCA-2021's effect propagated via UK retail-bank
  payment-rail cutoffs, FSMA-2023's effect propagated via direct
  regulator-mandated repatriation of customer holdings from non-EEA
  Binance entities. Both are S4 nation-state actions; both are
  empirical_case shape=comparison; both load-bear at offramp_cex.

  Cross-stratum cousin: binance-4framework-2023 (US, S3) — the FSMA
  Belgian action sits in the same 2023 Binance regulatory-pressure
  cohort as the US DOJ/SEC/CFTC/FinCEN settlement, illustrating the
  multi-jurisdictional pile-on phase of Binance's regulatory
  trajectory.

  Remaining caveat: this event does not retain a replayable Binance-owned
  Belgium-geo frontend notice, so no L4 observed_change is claimed.

scoped_claim: |
  "FSMA order of 2023-06-23 directly compelled Binance to cease offering
  virtual-currency exchange and custody-wallet services to Belgian
  residents and to repatriate customer holdings from non-EEA-incorporated
  Binance entities, producing a regulator-mandated operator-state change
  at the Binance Belgian-customer cohort (offramp_cex load-bearing). The
  row does not claim ISP-level connectivity blocking, a measured Binance
  Belgium-geo frontend notice, on-chain asset freeze, or class-wide Belgian
  banking-rail severance."

