analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). In the days after the
  2023-10-07 Hamas attack on Israel, Binance — at the request of Israeli law
  enforcement (the Lahav 433 cybercrime unit, with NBCTF / Ministry of Defence /
  intelligence support) — froze and seized a set of accounts on its exchange
  allegedly linked to Hamas fundraising, with seized funds transferred to the
  Israeli state treasury (reporting dated 2023-10-10). This is a corporate
  account/asset freeze at law-enforcement request — in scope per codebook §9
  (account/asset freeze at LE/sanction request). comparison shape, single
  offramp_cex observed_change, attribution=plausible (the freeze is reported via
  trade press, not a Binance or Israeli-police primary notice, and the
  "Hamas-linked" characterization is the LE allegation as reported). asset_onchain
  not_applicable: the action is a custodial account freeze on the exchange, not
  an on-chain issuer blacklist, so no §1.6 tx_hash floor applies. Distinct from
  israel-nbctf-hamas-crypto-addresses-2021 (an earlier 2021 NBCTF on-chain
  address-seizure action, S4) and from the OFAC Hamas designations in corpus
  (S1). Also distinct from the existing draft
  binance-palestinian-accounts-seizure-israel-2023-11, which covers the
  *November 2023* NBCTF (Paul Landes) temporary-seizure order against Palestinian
  user accounts — a later, separately-sourced action; this event captures the
  immediate post-2023-10-07 Hamas-fundraising-account freezes (DL News /
  Unchained, dated 2023-10-10). Sources verified via WebSearch 2026-05-31; DL News + Unchained captured +
  body_hash pinned; grep of the DL News body confirms "Israeli police seize Hamas
  crypto wallets on Binance", "Lahav 433", "NBCTF", "10 October 2023", and the
  Unchained body confirms "The seized funds will go into the state treasury" (no
  fabrication). The specific account count (FT report: 100+) is NOT asserted in
  the scoped claim because it is not in the two captured anchors.

scoped_claim: |
  "In the week after the 2023-10-07 Hamas attack, Binance froze/seized a set of
  accounts allegedly linked to Hamas at the request of Israeli law enforcement
  (Lahav 433 / NBCTF), transferring funds to the state treasury — a single-layer
  offramp_cex observed_change with attribution=plausible (trade-press anchored;
  the Hamas-link is the LE allegation)."

