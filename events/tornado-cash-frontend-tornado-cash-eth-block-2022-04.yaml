target:
  kind: entity
  entity: tornado_cash_frontend_eth_block_target_2022
  enumeration: subset
  enumeration_note: |
    Tornado Cash team operates the tornado.cash frontend UI (the
    user-facing dapp at app.tornado.cash / tornado.cash). On
    2022-04-15 the team integrated the Chainalysis on-chain
    sanctions-screening oracle contract at the dapp's wallet-connect
    flow, blocking any address listed on the Chainalysis-maintained
    OFAC SDN sanctions list from depositing or withdrawing through
    the official frontend. Target is the operator entity (Tornado
    Cash frontend) rather than an enumerated address set because the
    blocklist is a moving reference maintained by the Chainalysis
    oracle (snapshotting OFAC SDN cryptocurrency addresses), not a
    static published roster; subset because only the team-operated
    tornado.cash UI is in scope (the Tornado Cash smart contracts on
    Ethereum mainnet remained permissionless and unaffected, and
    third-party frontends / direct contract calls bypassed the
    block).
  protocol: tornado_cash
  actor_type: defi_frontend
  actor_name: Tornado Cash team (frontend operator)
  chains: [ethereum]
  canonical_domains:
    - tornado.cash
    - app.tornado.cash

jurisdiction: [corporate_global]

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      tornado.cash remained reachable globally on 2022-04-15; the
      restriction is client-side wallet-connection filtering via an
      on-chain Chainalysis oracle contract call, not a DNS or
      ISP-level block. The 2022-08 GitHub takedown of the Tornado
      Cash frontend repository (see tornado-cash-github-takedown-
      2022-08) is a distinct downstream L0-adjacent action.
  - layer: l1_consensus
    status: not_applicable
    chain: ethereum
    note: |
      Pre-Merge Ethereum (Paris was 2022-09-15, 5 months after this
      event); PBS relay-censorship infrastructure did not exist yet.
  - layer: l3_rpc
    status: not_applicable
    note: |
      Distinct from the L3 RPC-provider blocks that followed the
      2022-08-08 OFAC designation (see infura-alchemy-tornado-rpc-
      block-2022). The Tornado Cash team's 2022-04-15 block is an
      L4 wallet-connect screening at the dapp UI, not an L3 JSON-RPC
      response policy.
  - layer: l4_frontend
    status: partially_measured
    scope:
      - tornado.cash
      - app.tornado.cash
    provider_scope: unknown
    note: |
      Load-bearing layer for this event. The Tornado Cash team's
      own Twitter statement and contemporaneous journalism name the
      Chainalysis on-chain sanctions-screening oracle contract
      integration at the team-operated tornado.cash dapp as the
      mechanism that blocks OFAC SDN addresses from depositing or
      withdrawing through the official frontend. The Tornado Cash
      smart contracts on Ethereum remained reachable directly and
      via third-party frontends; the block is exclusively at the
      team-operated frontend UI layer. partially_measured rather
      than measured because no replayable client-side capture of the
      tornado.cash dapp's pre/post-2022-04-15 wallet-connect
      behavior is pinned in this repo (only the operator's public
      announcement is captured); a full measured rating would
      require a sources/http_captures/ slice of the dapp UI behavior
      against a known SDN address. Attached below as observed_change
      at attribution=direct (Tornado Cash team's own statement names
      the action and mechanism).
  - layer: asset_onchain
    status: not_applicable
    note: |
      No issuer-level asset freeze invoked by the Tornado Cash team's
      frontend policy. The Chainalysis oracle is queried at the
      dapp UI; it is not a token-contract blacklist.
  - layer: offramp_cex
    status: not_applicable
    note: |
      CEX off-ramp reactions to Tornado Cash are captured under
      tornado-cash-ofac-2022 observations[offramp_cex], downstream
