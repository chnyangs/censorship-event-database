analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-5 audit (S5 corporate, Tornado) by
  human:xiangwen. TornadoCash tweet (primary) unarchivable -> 2
  semi_primary_wayback (CoinDesk + CryptoPotato, Wayback 20220415140448 /
  20220416160427). attribution direct->plausible. l4_frontend
  observed_change/plausible (self-imposed frontend filter). comparison
  preserved.

  **NEW EVENT AUTHORED — DRYRUN 2026-05-17 (Wave 2.2D)**: authored
  by LLM agent without personally verifying Wayback/body_hash;
  origin=agent_draft per validator policy. Real release must replace
  this DRYRUN marker with a human-verified audit after pinning real
  archive anchors and promote origin to human_reviewed.

  Foundational comparison-shape S5 corporate-policy-change event:
  this is the earliest documented L4 DeFi-frontend voluntary self-
  censorship action in the corpus, predating the 2022-08-08 OFAC SDN
  designation of Tornado Cash (tornado-cash-ofac-2022) by 116 days
  (~4 months). Paper-relevant precisely because it isolates the
  protocol-team-initiated frontend filtering archetype before any
  government compulsion existed. The Tornado Cash team — the same
  team that would later be criminally targeted (see
  tornado-cash-storm-conviction-2025) — chose voluntarily to deploy
  the Chainalysis on-chain sanctions-screening oracle contract at
  the tornado.cash dapp, blocking OFAC SDN addresses from the
  user-facing frontend while leaving the underlying smart contracts
  permissionless. This is the seed instance of the "frontend /
  protocol-layer split" archetype later instantiated by the
  2022-08 cascade: aave-tornado-frontend-block-2022-08,
  uniswap-balancer-tornado-frontend-block-2022-08,
  infura-alchemy-tornado-rpc-block-2022, and
  circle-usdc-tornado-2022. The 2022-04-15 timing follows the
  2022-04-14 OFAC redesignation of the DPRK Lazarus Group with the
  Ronin Bridge hack address universe — Tornado Cash's voluntary
  action is causally consistent with that upstream OFAC pressure on
  the broader address space, but Tornado Cash itself was not named
  in any OFAC action until 2022-08-08.

  Empirical shape: comparison (1 observed_change layer — L4
  frontend load-bearing). Admission tier: empirical_case (≥1
  observed_change layer with direct attribution). Stratum coding:
  S5_corporate per codebook §5.2 (corporate_policy_change → S5).
  Trigger.type=corporate_policy_change rather than
  ofac_sdn_designation because no OFAC action named Tornado Cash on
  2022-04-15; the operator chose the policy unilaterally. Coverage
  for l4_frontend coded partially_measured (not measured) per
  codebook §2: the operator's public announcement is captured but
  no replayable client-side dapp-behavior capture is pinned in
  sources/http_captures/ for this event.

  Attribution=direct under codebook §1.4: the blocking provider
  (Tornado Cash team itself) publicly cites the compliance motivation
  in a primary corporate statement, and the block is implemented in
  the same publication window. Note this is unusual relative to
  §1.4's typical fact pattern: there is no upstream sanctioning
  trigger naming this actor — the actor is self-applying compliance
  posture preemptively. The codebook §1.4 "operator publicly cites
  the trigger" condition is satisfied vacuously / by self-reference
  here; flagged for human-reviewer attention.

  DRYRUN caveats: the four citations (Tornado Cash Twitter status +
  three contemporaneous journalism pieces) all carry 2022-calendar-
  folder Wayback pointers rather than pinned snapshots; pinned
  snapshot timestamps and body_hash captures are deferred to the
  human-audit pass. For non-DRYRUN release, capture body_hash +
  body_path for: (1) the Tornado Cash Twitter status anchor of
  2022-04-15; (2) the CoinDesk, CryptoPotato, and Chain Bulletin
  article permalinks; optionally (3) the Chainalysis sanctions-
  screening oracle contract on Etherscan (verified contract source)
  as primary_onchain evidence of the mechanism, and (4) a pre/post-
  2022-04-15 sources/http_captures/ slice of the tornado.cash dapp's
  wallet-connect flow tested against a known SDN address (would
  elevate l4_frontend coverage from partially_measured to measured).
  Marked evidence_use=contextual_unarchived on all citations to flag
  the unarchived state per validator policy.

scoped_claim: |
  "The Tornado Cash team's 2022-04-15 integration of the Chainalysis
  on-chain sanctions-screening oracle contract at the tornado.cash
  frontend — blocking OFAC SDN addresses from depositing or
  withdrawing through the team-operated dapp while leaving the
  Tornado Cash smart contracts on Ethereum permissionless —
  documents the earliest L4 DeFi-frontend voluntary self-censorship
  action in the corpus, predating the 2022-08-08 OFAC SDN
  designation of Tornado Cash (tornado-cash-ofac-2022) by 116 days
  and seeding the 'frontend / protocol-layer split' archetype later
  instantiated in the 2022-08 cascade siblings
  (aave-tornado-frontend-block-2022-08,
  uniswap-balancer-tornado-frontend-block-2022-08)."

