  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources
  verified+captured, awaiting human admission). On 2024-05-01 OFAC designated
  the Russian UAV developer OKO Design Bureau as an SDN within a ~300-target
  Russia tranche under EO 14024; the SDN entry attached crypto addresses used
  to solicit donations via Telegram to fund drone production for the war in
  Ukraine. In scope under codebook §9 (OFAC SDN designation). Coded
  null_event/null_case per the S1 convention (cf. bitriver-russia-mining-ofac-
  2022-04): the designation is the trigger, but no public CEX cascade was
  documented in the 14-day window and no primary_onchain freeze tx was captured
  for the attached addresses, so the measurable cross-layer surface is limited
  (offramp_cex observed_no_change/none). Source verified + captured 2026-05-31
  (OFAC Recent Actions 20240501, body_hash-pinned; no fabrication).

