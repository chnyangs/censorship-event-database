analysis_notes: |
  comparison documenting Turkey's 2021-04-16 CBRT regulation prohibiting
  crypto-asset use in payments. Fourth major nation-state ban in the dataset. Structurally
  distinct from India / Nigeria bans: the Turkish regulation targets payment services
  (on-ramps for retail crypto-for-goods flows) rather than exchange banking, so exchanges
  like BtcTurk and Paribu remained formally operational.

  Notable context: ban was announced days after the collapse of Turkish exchange Thodex
  (user funds stolen), creating a tangled regulatory narrative.

scoped_claim: |
  "CBRT regulation of 2021-04-16 (effective 2021-04-30) prohibited Turkish payment service
  providers from handling crypto-asset-related transactions. Exchanges themselves remained
  operational but direct payment-rail on-ramp was severed. Observational axis at
  offramp_cex layer at national-policy level."

