target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    Two named individuals (Charles Shrem; Robert M. Faiella a/k/a "BTCKing")
    plus the corporate vehicle through which Shrem operated (BitInstant LLC).
    Faiella operated BTCKing as a Silk Road-facing Bitcoin vendor that
    sourced BTC inventory via BitInstant. No on-chain BTC addresses are
    enumerated at this event-row level; the SDNY complaint references
    transaction totals (~$1M in Bitcoin) without exhaustive address
    enumeration. canonical_domains lists the BitInstant frontend; BTCKing
    operated as a Silk Road vendor handle with no independent clearnet
    surface.
  actor_type: exchange_and_individual_msb
  actor_name: Charlie Shrem (BitInstant) + Robert Faiella (BTCKing)
  chains: [bitcoin]
  canonical_domains:
    - bitinstant.com

jurisdiction:
  - US

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The 2014-01-27 indictment did not invoke any ISP / DNS / network-layer
      block of bitinstant.com. Public-web L0 instruments (Censored Planet,
      OONI) do not apply. The corporate shutdown that followed was a business
      decision in the wake of criminal exposure, not a network-layer event.
  - layer: l1_consensus
    status: not_applicable
    chain: bitcoin
    note: |
      Bitcoin, 2014; consensus-layer filtering surfaces tracked by this
      dataset (post-Merge Ethereum PBS, mev-watch / censorship.pics) did not
      exist for any chain in 2014. Out of scope.
  - layer: l3_rpc
    status: not_applicable
    chain: bitcoin
    note: |
      No hosted Bitcoin-RPC provider surface is implicated. Pre-Infura era
      and the action targets MSB / money-transmitter conduct, not RPC-mediated
      transaction routing.
  - layer: l4_frontend
    status: not_applicable
    note: |
      No L4 frontend seizure or takedown banner is documented for
      bitinstant.com on 2014-01-27. The site continued to display a
      "BitInstant is currently in the process of upgrading our service"
      maintenance-style notice for some time after the 2013-07 service
      suspension (which preceded this enforcement event), and ultimately
      went dark without a DOJ-attributed L4 seizure. Recording the post-
      suspension frontend state as observed_change would conflate the
      pre-existing service pause with the 2014-01-27 enforcement action,
      so L4 is not coded here.
  - layer: asset_onchain
    status: not_applicable
    chain: bitcoin
    note: |
      Bitcoin is unfreezable at the protocol layer. No issuer-level or
      asset-layer freeze is implicated by the 2014-01-27 indictment. No
      stablecoin admin-method actions existed in 2014 to attach here.
  - layer: offramp_cex
    status: measured
    scope: [bitinstant]
    note: |
      Load-bearing layer. BitInstant — Shrem's exchange company — was the
      operative off-ramp affected by the indictment. The company never
      resumed operations after Shrem's January 2014 arrest, and Shrem's
      September 2014 guilty plea and December 2014 sentencing functionally
      ended any prospect of corporate revival. Coverage status is `measured`
      because the platform's wind-down is publicly attested even though the
      DRYRUN row does not yet pin a per-quarter Wayback-frontend timeline.

