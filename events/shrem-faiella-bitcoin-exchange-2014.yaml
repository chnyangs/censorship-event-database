  comparison shape: 1 observed_change layer (offramp_cex, BitInstant wind-
  down). The 2014-01-27 SDNY indictment of Charlie Shrem (then-CEO of
  BitInstant + vice-chair of the Bitcoin Foundation) and Robert Faiella
  (BTCKing, the Silk Road-facing BTC vendor sourced via BitInstant) on
  money-laundering + unlicensed-money-transmitter counts produced an
  offramp_cex cascade — BitInstant ceased operations and never resumed
  service. Shrem pleaded guilty 2014-09-04 and was sentenced 2014-12 to two
  years. attribution=plausible because the DOJ press release does not order
  a corporate shutdown; the wind-down is the corporate-policy consequence
  of CEO indictment + plea. L4 frontend is intentionally NOT coded here —
  BitInstant's bitinstant.com had been displaying a maintenance-style
  upgrade notice since the 2013-07 service suspension that predates the
  enforcement event, and recording the post-suspension page state as an
  observed_change would conflate a pre-existing pause with the 2014-01-27
  trigger. Admission tier empirical_case (1 strong-attribution
  observed_change layer).

  Historical-baseline anchor for the DOJ exchange/MSB enforcement family in
  the 2013–2016 era, structurally complementary to silk-road-doj-seizure-
  2013 (marketplace seizure, ~3 months earlier) and a precursor to the
  2017-07-26 btc-e-doj-2017 exchange indictment + domain seizure. Together
  with nydfs-bitlicense-2015-06 these four rows establish the pre-OFAC-
  crypto-SDN baseline for L4 / offramp_cex enforcement cascades in the
  dataset.

scoped_claim: |
  "The 2014-01-27 DOJ SDNY indictment of BitInstant CEO Charlie Shrem and
  BTCKing operator Robert Faiella on money-laundering and unlicensed-money-
  transmitter counts produced an offramp_cex cascade (BitInstant ceased
  operations after Shrem's arrest and never resumed service following his
  2014-09-04 guilty plea). The row claims only this single-layer offramp
  shutdown observation with attribution=plausible; no L0/L1/L3/L4/asset-
  onchain effects are coded."

