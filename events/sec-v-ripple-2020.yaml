analysis_notes: |
  **QUALITY-LOOP REPAIR 2026-06-01** (automated source repair; no new
  human-audit stamp). The original row made a broader two-layer/four-exchange
  claim but depended on wildcard Wayback pointers and an incorrect or
  non-load-bearing Ripple.com litigation URL. During repair, the SEC trigger,
  Coinbase official blog post, and Bitstamp official blog post were captured
  locally with body_hash/body_path anchors.

  This version narrows the admitted empirical content to a replayable
  two-operator offramp_cex comparison: Coinbase announced a full XRP trading
  suspension for 2021-01-19, and Bitstamp announced a U.S.-customer XRP
  trading/deposit halt for 2021-01-08. Both corporate sources explicitly
  connect their actions to the SEC action/filing against Ripple. The prior
  Binance.US, Kraken, and Ripple.com L4 observations are removed from the
  admitted observation set until replayable official anchors are available.

scoped_claim: |
  "The 2020-12-22 SEC v. Ripple Labs Inc. civil securities-law action is
  retained as a narrowed CEX/off-ramp comparison: Coinbase and Bitstamp each
  issued official, replayably captured announcements restricting XRP trading
  for U.S. customers after the SEC action/filing against Ripple. The row does
  not claim a Ripple.com L4 frontend change, Binance.US/Kraken coverage, L0
  network blocking, L1 consensus impact, L3 RPC filtering, or asset-onchain
  freezes."

scoped_knowledge: |
  What changed: Coinbase and Bitstamp each announced XRP trading restrictions
  for U.S. customers in the days after the SEC's 2020-12-22 Ripple action.
  Coinbase announced a move to limit-only trading followed by full XRP
  trading suspension on 2021-01-19; Bitstamp announced a U.S.-customer XRP
  trading and deposit halt effective 2021-01-08.

  What did not change or could not be measured: no XRP Ledger L1 consensus or
  validator-set change; no public-RPC L3 filter-list update; no asset-onchain
  issuer freeze; no network-layer reachability change. The previously coded
  Ripple.com L4, Binance.US, and Kraken observations are not admitted in this
  repaired version because replayable official anchors are not retained here.

  Attribution: direct for the two retained exchange observations because each
  official corporate source names the SEC action or filing against Ripple as
  the legal context for the exchange's own XRP trading restriction. The row
  does not claim SEC-only end-to-end causation for every market participant.

