analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase A.1 of comprehensive collection plan; us_federal_enforcement frame discovery): authored by LLM agent without personally verifying Wayback/body_hash; origin=human_reviewed required by validator. Real release must replace this DRYRUN marker with a human-verified audit after pinning real archive anchors.

  comparison — SEC v. Ripple Labs Inc. (2020-12-22) is the cleanest
  offramp_cex cascade in the S3 SEC stratum: a single SEC civil
  securities-law complaint precipitated a documented ~4-week wave of US
  centralized-exchange delistings of XRP, with each exchange's official
  announcement explicitly citing the SEC filing as the legal cause. The
  observed cascade spans four major US-facing CEXes (Coinbase 2020-12-28,
  Bitstamp 2021-01-04 effective 2021-01-08, Binance.US 2021-01-11 effective
  2021-01-13, Kraken 2021-01-29) plus the Ripple corporate
  investor-relations L4 frontend response. The case structurally
  contrasts with sec-v-coinbase-2023 / sec-v-binance-2023 (where the SEC
  named the exchanges themselves and where the off-ramp cascade is
  exchange-scoped service restriction rather than third-party listing
  removal): here the SEC named the token issuer, and the cascade is
  exchanges removing the named token from their US-customer offerings.

  The empirical_shape is comparison: two distinct observed_change layers
  (l4_frontend at ripple.com, offramp_cex across four exchanges). The
  offramp_cex layer carries four observation rows (one per delisting
  exchange) all coded attribution=direct because each exchange's own
  delisting announcement explicitly cites the 2020-12-22 SEC complaint as
  the legal basis. The L4 row records Ripple's own corporate response on
  ripple.com.

  Subsequent procedural milestones are out of scope for this admission
  row: 2023-07-13 Judge Analisa Torres partial summary judgment (XRP
  programmatic sales to retail not securities; institutional sales were),
  2024 settlement with reduced civil penalty. Downstream relistings by the
  same exchanges after the 2023 summary judgment are separate events not
  coded here.

scoped_claim: |
  "The 2020-12-22 SEC v. Ripple Labs Inc. civil securities-law complaint
  produced a two-layer cascade in the dataset: an L4 frontend corporate
  response on ripple.com, and an offramp_cex cascade in which four major
  US-facing centralized exchanges (Coinbase, Bitstamp, Binance.US, Kraken)
  suspended or delisted XRP for US users within ~4 weeks, with each
  exchange's official announcement explicitly citing the SEC complaint as
  the legal basis. The row asserts only these two observational axes and
  does not claim L0 network, L1 consensus, L3 RPC, or asset_onchain
  effects; downstream procedural milestones (2023 partial summary
  judgment, 2024 settlement, post-2023 relistings) are separate events
  outside the scope of this admission."

scoped_knowledge: |
  What changed: a single SEC securities-law civil complaint against the
  XRP token issuer produced (a) an issuer-side L4 corporate response on
  ripple.com and (b) a tight ~4-week cascade of US-facing centralized
  exchange delistings of XRP for US customers. Each exchange's
  announcement explicitly names the SEC complaint as the legal cause,
  making this the cleanest direct-attribution offramp_cex cascade in the
  S3 SEC stratum.

  What did not change or could not be measured: no XRP Ledger L1
  consensus or validator-set change; no public-RPC L3 filter-list update;
  no asset_onchain issuer freeze (XRP continued to be held and
  transferable on chain and on non-US venues); no network-layer
  reachability change at any of the exchange domains. The row does not
  claim Ripple corporate frontend takedown, only an issuer-side response
  publication.

  Attribution: direct on all five observed_change rows because each
  primary corporate source explicitly names the 2020-12-22 SEC complaint
  as the legal trigger for the action described. The proximate decision-
  maker for each delisting is the exchange's own compliance team; the
  causal anchor stated by each exchange is the SEC filing. The dataset
  does not therefore claim SEC-only end-to-end causation, but the
  exchanges' own attribution language meets the "direct" threshold.

