coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      No network-layer (L0) reachability blocking is implicated by an SEC
      civil securities-law complaint. None of ripple.com, coinbase.com,
      bitstamp.net, binance.us, or kraken.com became unreachable; the
      cascade is an exchange/issuer application-layer event. not_applicable
      on substrate-mismatch grounds.
  - layer: l1_consensus
    status: not_applicable
    note: |
      The XRP Ledger consensus continued operating normally; the SEC theory
      is securities-law over Ripple's offering conduct, not a protocol
      sanction. No validator-set primitive engaged. not_applicable on
      substrate-mismatch grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      No public-RPC provider filter-list change attaches to the SEC v.
      Ripple complaint. The L3 substrate (MEV-Boost / Flashbots Protect /
      MEV-Blocker / Infura) is orthogonal to a centralized-exchange
      delisting cascade on XRP. not_applicable on substrate-mismatch
      grounds.
  - layer: l4_frontend
    status: measured
    scope:
      - ripple.com
    note: |
      Load-bearing layer 1 of 2. Ripple Labs corporate investor-relations
      frontend (ripple.com) hosted the official corporate response
      announcement on 2020-12-22 contesting the SEC complaint as a
      misapplication of securities law and signalling Ripple would defend
      vigorously. Attached below as observed_change with attribution=direct
      via Ripple's own corporate statement on the company-controlled
      frontend. This is an issuer-driven L4 corporate-response change, not
      a state-mandated takedown.
  - layer: asset_onchain
    status: not_applicable
    note: |
      The SEC complaint does not engage an issuer-side address blacklist or
      stablecoin-freeze primitive on XRP; XRP balances continued to be
      held, transferred, and traded on non-US venues. No on-chain freeze
      tx-hash is published as part of this enforcement action.
      not_applicable on substrate-mismatch grounds.
  - layer: offramp_cex
    status: measured
    scope:
      - coinbase_xrp_us_listing
      - bitstamp_xrp_us_listing
      - binance_us_xrp_listing
      - kraken_xrp_us_listing
    note: |
      Load-bearing layer 2 of 2. Cleanest offramp_cex cascade in the S3
      SEC stratum: within ~4 weeks of the 2020-12-22 SEC complaint,
      four US-facing centralized exchanges (Coinbase, Bitstamp,
      Binance.US, Kraken) suspended or delisted XRP trading for US
      users. Each exchange's announcement explicitly cited the SEC's
      filing as the precipitating legal cause. Attribution coded direct
      on the per-exchange rows because the exchanges' own statements
      cite the SEC complaint as the legal trigger; the proximate
      decision-maker is each exchange's compliance team, and the legal
      mechanism the exchanges name is the SEC complaint itself.

