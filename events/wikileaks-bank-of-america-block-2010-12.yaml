  NEW EVENT AUTHORED — agent_draft 2026-05-16. Phase E
  discovery-only contextual case for the 2010-12-18 Bank of America
  public statement announcing the bank's refusal to process any
  transactions believed to be intended for WikiLeaks. Authored at
  status=draft pending human audit of (i) the bofa.com /
  newsroom.bankofamerica.com URL reachability and Wayback snapshot
  pinning, (ii) the Reuters idUS wire snapshot pin, and (iii) any
  bofa.com IR-page or press-release archive containing the original
  statement that may exist but was not located in this authoring
  pass.

  Significance: Bank of America's 2010-12-18 announcement was the
  fifth and final constituent action of the December 2010
  "banking blockade" against WikiLeaks (after PayPal 2010-12-04,
  PostFinance 2010-12-06, Mastercard 2010-12-06/07, Visa Europe
  2010-12-07, Western Union 2010-12-18, and Bank of America 2010-12-18).
  It is the only US-bank rail action in the cluster; the others are
  payment-network (Mastercard / Visa) or money-transmitter (Western
  Union / PayPal) actors. The Bank of America action is the
  cleanest example in the cluster of a corporate-policy-change
  trigger phrased as an internal-policy interpretation rather than
  a US-government-directed compliance action. Phase E.1 scoping
  rule #2 (payment-rail-Bitcoin nexus) admits this event because
  the same banking-blockade dynamic became the proximate motivator
  for early-Bitcoin donation-routing experiments (Bitcoin
  donations to WikiLeaks were first publicly proposed in late
  2010 and became material in 2011).

  Why discovery_only_2007_2012 / discovery_ledger_only: the event
  falls in the 2008-2012 pre-Bitcoin-cascade-substrate temporal
  tier per sampling/frame.yaml. analysis_use=discovery_ledger_only
  excludes this row from the 2017+ comparable-analysis denominator.
  The event is retained as contextual discovery-ledger material
  rather than as a denominator row because (a) it predates the
  Ethereum-era cascade substrate and (b) the cascade surface is
  exclusively at offramp_cex with no on-chain measurable receipt.

  Why empirical_case rather than anchor_case: only 1 observed_change
  layer is anchored (offramp_cex). anchor_case requires >=2
  observed_change layers; the L0/L1/L3/L4/asset_onchain layers are
  all not_applicable on construct-did-not-exist grounds, so the
  event cannot reach anchor_case strength regardless of evidence
  hardening. empirical_shape=comparison reflects the 1-observed-
  change-layer count.

  Why L0/L1/L3/L4/asset_onchain are not_applicable: 2010-12 predates
  the entire Ethereum-era cascade substrate. Bitcoin existed (genesis
  2009-01-03) but had no measured exchange-side L4 frontend universe
  in 2010-12, no L1 PBS relay primitive (Ethereum Merge 2022-09-15),
  no L3 RPC-compliance primitive (Flashbots Protect 2022-11), and
  no asset-issuer freeze admin path (USDT 2014-10 onward). The
  cascade surface is exclusively at offramp_cex (US-bank-rail
  refusal).

  Recovery: no recovery row is authored in this pass. Bank of
  America never formally rescinded the policy in the public record;
  WikiLeaks's later donation infrastructure (Bitcoin donations from
  2011-06, Wau Holland Foundation routing for fiat, plus subsequent
  litigation including Datacell ehf. v. Visa Europe / Valitor in
  Iceland) operated around the US-bank rail rather than restoring
  it. A recovery event covering the eventual unfreezing of any
  specific WikiLeaks-adjacent account by Bank of America would
  require human-audit-grade evidence not located in this pass.

scoped_claim: |
  Bank of America's public statement of 2010-12-18 announcing that
  the bank "will not process any transactions of any type that we
  have reason to believe are intended for WikiLeaks", citing
  internal-payment-policy interpretation regarding WikiLeaks
  activities deemed "inconsistent with our internal policies for
  processing payments", constitutes a discovery-ledger corporate-
  policy-change event documenting US-bank-rail off-ramp closure
  against WikiLeaks. Fifth and final constituent action of the
  December 2010 "banking blockade" cluster.

scoped_knowledge: |
  This event is the US-bank-rail constituent of the December 2010
  "banking blockade" cluster against WikiLeaks. The cluster is
  significant in the broader censorship-event-database arc because
  it is the canonical pre-Bitcoin demonstration of coordinated
  off-ramp closure against a publisher target by private-sector
  payment infrastructure, acting on stated internal-policy grounds
  rather than under formal government order. The cluster is widely
  cited as a proximate motivator for early Bitcoin adoption among
  publishers and as a precedent for subsequent banking-blockade-
  style actions (e.g. Operation Choke Point 2013-2017 against
  lawful-but-disfavored industries; later crypto-rail refusals).
  The Bank of America action in particular is the cleanest example
  in the cluster of a corporate-policy-change trigger phrased
  purely as internal-policy interpretation. The off-ramp_cex
  observed_change is the single anchored cascade-surface row;
  L0/L1/L3/L4/asset_onchain are all not_applicable on construct-
  did-not-exist grounds because 2010-12 predates the entire
  Ethereum-era cascade substrate. Sibling events
  wikileaks-paypal-freeze-2010-12, wikileaks-visa-europe-suspension-
  2010-12, wikileaks-mastercard-suspension-2010-12, and
  wikileaks-western-union-interdiction-2010-12 carry the parallel
  payment-network and money-transmitter actions; together the five
  events form the complete December 2010 banking-blockade cluster.

