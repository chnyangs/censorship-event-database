analysis_notes: |
  **REPAIRED 2026-06-01** (automated primary-source repair). Located and
  captured official Upbit notice 2256 through both the public notice shell and
  the Upbit announcement API. The API JSON is now the load-bearing
  primary_corporate source for the six-asset market-support removal, the
  2019-09-30 end date, the 2019-10-19 withdrawal-support deadline, and Upbit's
  stated money-laundering / external-network rationale. Removed
  evidence_tier=attested_secondary. Attribution remains plausible because the
  FATF link is contextual reporting and the primary notice states a class-level
  AML rationale rather than a named binding instrument for these assets.

  **ADMITTED 2026-05-31** (genuine review by human:xiangwen reviewing agent:
  TASK-2 lower-tier; since upgraded by primary-source repair). §9-clear,
  well-documented deliberate restriction originally admitted at
  evidence_tier=attested_secondary on a single captured contemporaneous source.
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). South Korea's Upbit ended
  transaction support for six privacy coins — Monero (XMR), Dash (DASH), Zcash
  (ZEC), Haven (XHV), BitTube (TUBE), PIVX — effective 2019-09-30. The official
  notice cites money-laundering possibility and external-network inflow; FATF
  guidance is retained as contextual corroboration from contemporaneous
  reporting. Part of the first major
  privacy-coin delisting wave (same month as okex-privacy-coin-delisting-
  2019-09), an early node later joined by Bittrex (2021), Binance (2023) and
  OKX/Kraken/Huobi (2024). comparison shape, single offramp_cex
  observed_change, attribution=plausible (delisting directly observed; the
  AML/FATF rationale is a soft-framework class-level compliance inference,
  not a named instrument acting on these assets). The six assets
  are independent base-chain tokens, so l0/l1/l3/l4/asset_onchain are
  not_applicable. Initial source verified via WebSearch + captured 2026-05-31;
  primary-source repair captured official Upbit artifacts on 2026-06-01.

