analysis_notes: |
  Admitted as a scoped case anchored in concrete legal, on-chain, GitHub, and
  dYdX artifacts. The supported public claim is a three-layer cascade across
  asset, frontend, and off-ramp reactions following the 2022 OFAC trigger. RPC
  is retained only as a named Flashbots public-git partial observation and is
  excluded from L3 conditional rates until a provider-universe denominator is
  measured.

scoped_claim: |
  "OFAC designation of Tornado Cash on 2022-08-08 produced the defining
  3-layer cascade in the dataset: L4 frontend (tornado.cash taken offline
  ≈22h), asset_onchain (Circle USDC batch-blacklisted 19/38 addresses
  within 6h; dYdX closed accounts within 34h), and L1 consensus (censoring-
  relay share rose from 10.80% day-1 of PBS era to 41.10% 18 days later).
  The paper-defining original-cascade event, paired with the 2025-03-21
  delisting reverse-cascade."

scoped_knowledge: |
  What changed: this is the forward-cascade anchor. Retained changed layers are
  asset_onchain (Circle USDC blacklist, direct), L4 frontend (Tornado UI /
  GitHub availability change, plausible), off-ramp CEX (dYdX account action,
  direct), and L1 consensus (post-Merge relay-censorship share increase,
  plausible).

  What did not change or could not be measured: L0 remains not measured because
  OONI had no relevant volunteer measurements for the queried domains and
  windows. L3 RPC is retained as a named Flashbots public-git partial
  observation, not as a measured provider-universe denominator; it therefore
  supports the mechanism narrative but not an L3 conditional rate.

  Attribution: asset and dYdX rows are direct because primary on-chain or
  corporate artifacts name the target/action. L1 and L4 remain plausible
  because the measurements line up with the Tornado address set and timing but
  do not contain a first-party relay/operator causal statement.

  Comparative value: this event defines the paper's cascade object, but it
  should not be treated as typical. Most other admitted events are single-layer
  or null; Tornado 2022 is the high-breadth anchor against which the corpus'
  cascade rarity is measured.

