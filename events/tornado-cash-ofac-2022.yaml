      is wired in.
  - layer: l1_consensus
    status: partially_measured
    chain: ethereum
    note: |
      FIXES Phase 3.4 executed on 2026-04-21. Wahrstätter's
      relay_censorship_share.csv is attached with body_hash; the slice
      2022-09-16 to 2022-10-03 (the earliest-measurable 18 days of the PBS
      era) shows censoring-relay share rising from 10.80% to 41.10%, giving
      a defensible observed_change at daily granularity. Ethereum PBS
      infrastructure did not exist before The Merge (2022-09-15), so the
      first ~5.4 weeks of the observation window (2022-08-07 to 2022-09-15)
      have no L1 data source by construction. Coverage is therefore
      `partially_measured` (post-Merge subset only) rather than `measured`
      across the full window.
  - layer: l3_rpc
    status: partially_measured
    provider_scope: flashbots_rpc_endpoint_only
    note: |
      Revised 2026-04-24. Previous `not_applicable` framing was built on
      the assumption that OFAC-compliance-adjacent public Ethereum RPC
      substrate post-dated the event (Flashbots Protect launched 2022-11,
      MEV-Blocker launched 2023-03-27). That framing was incomplete:
      flashbots/rpc-endpoint (the service whose public RPC later became
      Flashbots Protect) existed at event time and carried an in-process
      OFAC blacklist at `server/ofacblacklist.go` (file creation 2021-10-07,
      commit 8d2c732). Git-history analysis of that file across the
      2022-08-08 SDN yields one primary_corporate observation (see
      observations below). Coverage is `partially_measured` because only
      the flashbots/rpc-endpoint provider was checked; Infura's
      contemporaneous OFAC-screening policy statement (published
      2022-08-12) is NOT yet pinned as a Wayback anchor and remains
      a follow-up. Ecosystem anchors pinned 2026-04-22 (MEV-Blocker
      and Flashbots Protect docs at body_hash sha256:f580083a67f052d2d8301dc1975c6f1f369474d25a10f0587ef081f70379cc67
      and sha256:b937ed96974815d638d2db412ad674d417ae71f0295f625c8cec839638307282)
      establish the L3 measurement substrate for post-launch events but
      are not event-local for 2022-08-08; see analysis/anchor_gap_fill_log.md §2.2.
