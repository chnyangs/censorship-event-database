analysis_notes: |
  Sub-sovereign jurisdictional regulatory action: HK SFC's VATP licensing
  regime in force 2023-06-01, with a 2024-05-31 transitional deadline.
  Two SFC-licensed platforms (HashKey, OSL) were authorized at the
  effective date; major offshore platforms (Binance, OKX, Bybit, HTX)
  were effectively excluded and largely withdrew applications, driven
  in part by the SFC requirement to bar mainland-China residents.

  Although HK is sub-sovereign within the PRC, its crypto-licensing
  framework is functionally distinct from the mainland PRC's blanket
  2021 PBOC ban; we classify the trigger as nation_state_block under
  research_stratum S4_nation_state and cross-reference the parallel
  mainland PRC event via related_events.

  Empirical shape is `comparison`: two observed_change layers
  (offramp_cex licensing exclusion + offramp_cex offshore-platform
  withdrawal pattern), both within the offramp_cex layer at the event
  level. L4 frontend HK-vantage geofencing reactions are recorded as
  `not_measured` pending Wayback-diff evidence collection.

  All sources in this draft are `contextual_unarchived` per the
  evidence_use convention; status remains `draft` (origin: agent_draft)
  pending human audit and Wayback pinning.

