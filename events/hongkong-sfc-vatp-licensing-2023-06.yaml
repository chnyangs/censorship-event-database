coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      VATP licensing is a jurisdictional regulatory action; it does not
      operate via L0 network-layer interference. HK does not run a
      mainland-style network filter against unlicensed crypto frontends.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Jurisdictional licensing regime does not map to Ethereum PBS relay
      filtering or any other L1 consensus primitive.
  - layer: l3_rpc
    status: not_applicable
    note: |
      L3 RPC layer is not implicated by HK CEX licensing. Same not-applicable
      reasoning as other jurisdictional-CEX-licensing events.
  - layer: l4_frontend
    status: not_measured
    note: |
      Unlicensed offshore platforms (Binance, OKX, Bybit, HTX) responded
      with HK-vantage geofencing or HK-user restrictions following the
      regime's entry into force. Wayback-diff evidence (HK-vantage
      snapshots of exchange landing/registration pages bracketing
      2023-06-01 and 2024-05-31) is not yet attached.
  - layer: asset_onchain
    status: not_applicable
    note: |
      Licensing regime does not implicate stablecoin admin-method freezes
      or other asset-onchain primitives.
  - layer: offramp_cex
    status: partially_measured
    scope:
      - hashkey
      - osl
      - binance
      - okx
      - bybit
    note: |
      Only HashKey and OSL were SFC-licensed VATPs at the 2023-06-01
      effective date and through 2024-05-31. Major offshore platforms
      (Binance, OKX, Bybit, HTX) did not obtain licences; by 2024-05-31
      multiple withdrew applications, driven in part by the SFC
      requirement that licensees bar mainland-China residents. Primary
      SFC public register and contemporaneous journalism corroborate
      the exclusion. Sources contextual_unarchived for this draft;
      human audit will pin Wayback snapshots.
