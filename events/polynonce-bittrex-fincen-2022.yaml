analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17** (Phase F discovery; FinCEN
  enforcement frame). Authored by LLM agent without personally verifying
  Wayback / body_hash anchors; coded origin=agent_draft, status=draft.
  Real release must upgrade citations to admission_anchor with body_hash +
  body_path captures and refresh last_human_audit.

  comparison — first FinCEN/OFAC parallel virtual currency enforcement and
  the largest FinCEN crypto civil money penalty at the time ($29M FinCEN +
  $24M OFAC = $53M combined; net $29M to Treasury after OFAC-credit). Pairs
  with sec-v-bittrex-2023 as the prior US-Treasury enforcement leg of the
  Bittrex compliance arc that culminated in the 2023 SEC action, US-exit, and
  Chapter 11 filing. Codebook §1.2 / §1.4 attribution rule applied: the
  FinCEN Consent Order names the target entity (Bittrex Inc.) and the
  sanctioned jurisdictions, but the offramp deplatforming was already in
  remediation before the 2022 settlement, so attribution is coded
  `plausible` rather than `direct` per the conservative default in §8.4.

