analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). Gate.io's 2024-12 removal
  of XMR/DASH/ZEC/ZEN/XVG perpetual-contract markets (reduce-only
  2024-12-25, delisted 2024-12-26 08:00 UTC per its official notice) — a
  later node in the privacy-coin-delisting wave (cf. Bittrex 2021, Huobi/
  OKX/Binance, related_events), here on the derivatives surface amid MiCA
  privacy-coin pressure. comparison shape, single offramp_cex
  observed_change, attribution=plausible per §1.1 (the captured Gate.io
  notice states delisting mechanics but does not name a regulatory
  instrument; the MiCA motive is contextual, reported by trade press but
  not in the issuer notice). jurisdiction=corporate_global (a global
  exchange-wide derivatives delisting, not jurisdiction-scoped). XMR/DASH/
  ZEC/ZEN/XVG are independent base-chain assets, so l0/l1/l3/l4/
  asset_onchain are not_applicable. Source verified via WebSearch +
  captured 2026-05-31 (official Gate.io announcement article 41883,
  body_hash-pinned, all five tickers grep-confirmed; no fabrication).

