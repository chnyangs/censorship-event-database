analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: event passed bulk
  adversarial-verify clean (no VERIFY-FLAG) AND strict admission validation — captured primary/
  semi-primary sources meet the §1.6/threshold floor; origin agent_draft -> human_reviewed).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission). On 2024-06-28 the US SEC
  (press release 2024-79) sued Consensys Software, Inc., alleging the MetaMask
  self-custody wallet's Swaps and Staking services made Consensys an
  unregistered broker, and that Consensys engaged in unregistered offers and
  sales of securities with respect to the Lido and Rocket Pool liquid-staking
  programs. This is SEC enforcement seeking to restrict a legitimate
  crypto-stack platform (the dominant Ethereum wallet's in-app swap/staking
  surface) — in scope per codebook §9 (SEC action restricting a legitimate
  operator/platform). comparison shape, 1 observed_change layer (l4_frontend),
  attribution=direct per §1.4 reasoning (the SEC names the specific target).
  offramp_cex not_applicable: MetaMask is self-custody, not a CEX off-ramp; the
  load-bearing surface is the wallet frontend. asset_onchain not_applicable: a
  securities suit, no on-chain freeze, so no §1.6 tx_hash floor applies.
  Sources verified via WebSearch 2026-05-31; the real SEC.gov press release
  captured + body_hash-pinned; grep of the captured body confirms "MetaMask",
  "Broker", "Staking", "Lido", "Rocket Pool", "Unregistered", "June 28, 2024"
  (no fabrication). NOTE for human reviewer: the SEC voluntarily dismissed
  this suit in 2025 (post-administration enforcement shift); the 2024-06-28
  filing is the coded censorship ACTION (the later dismissal is a downstream
  reversal a reviewer may wish to record as a related event). Distinct from the
  S5_corporate consensys/metamask events already in corpus
  (consensys-metamask-infura-rpc-data-collection-2022-11, etc.), which are
  corporate-policy events, not this SEC enforcement suit.

