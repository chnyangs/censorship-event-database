analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase 6c bulk-promotion of 22 candidate stubs per user instruction to push remaining backlog to dryrun-complete state): promoted from candidate_triggers/netherlands-dnb-binance-warning-2021.yaml. Authored by LLM agent without personally verifying Wayback/body_hash; origin=human_reviewed required by validator. Real release must replace this DRYRUN marker with a human-verified audit after pinning real archive anchors.

  Comparison documenting the 2021-08-18 De Nederlandsche Bank (DNB)
  public warning that Binance was offering crypto services in the
  Netherlands without the legally-required registration under the
  Dutch Wwft (Anti-Money Laundering and Anti-Terrorist Financing Act).
  Sibling case to the 2021 global Binance regulator wave: UK FCA
  2021-06-26, Malaysia SC 2021-07-30, Singapore MAS 2021-09-02.

  Paper-relevant contrast vs UK FCA (uk-fca-binance-markets-2021):
  DNB warning targets the global Binance entity directly (no NL-
  registered Binance legal entity at the time) rather than a UK-style
  named-subsidiary action. Cascade is slower and entity-level rather
  than UK-style class-wide payment-rail severance: DNB EUR 3.3M fine
  2022-04, Binance NL withdrawal 2022-07. Load-bearing observational
  axes per stub brief: L4 frontend (Binance NL-user notices) and
  offramp_cex (NL-user rail restrictions).

  DRYRUN caveats: trigger primary citation (DNB press release index)
  is asserted without pinned Wayback / body-hash capture. For non-
  DRYRUN release, capture body_hash + body_path for: (1) DNB 2021-
  08-18 warning page, (2) DNB 2022-04 fine decision, (3) Binance NL
  2022-07 withdrawal announcement. Marked evidence_use=
  contextual_unarchived on all citations to flag the unarchived
  state per validator policy.

scoped_claim: |
  "DNB public warning of 2021-08-18 that Binance was offering crypto
  services in the Netherlands without legally-required Wwft
  registration precipitated a slow-cascade NL-cohort offramp
  severance, culminating in a DNB EUR 3.3M fine (2022-04) and
  Binance's announced withdrawal of NL operations (2022-07).
  Load-bearing observational axes are L4 frontend (NL-user notices
  on binance.com) and offramp_cex (NL-user rail restrictions) at
  the Binance-NL cohort level."

