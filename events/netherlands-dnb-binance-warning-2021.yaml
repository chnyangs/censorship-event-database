analysis_notes: |
  **QUALITY-LOOP REPAIR 2026-06-01** (automated source repair; no new
  human-audit stamp). This row previously depended on generic DNB homepage
  citations, contextual_unarchived Wayback patterns, and dryrun notes. It also
  overreached by folding later Binance Netherlands market-exit material into
  the 2021 DNB warning row. The repair captures and pins the specific DNB 2021
  warning page, the 2022 DNB enforcement/fine page, and the redacted DNB fine
  decision PDF.

  The retained empirical claim is narrower: DNB publicly warned on 2021-08-18
  that Binance was providing crypto services in the Netherlands without the
  legally required DNB registration under the Wwft, naming exchange services
  and custodian wallets; DNB later imposed and finalized an administrative
  fine for that unregistered-service conduct. This row does not claim a
  measured frontend block, user offboarding, app-store removal, fiat-rail
  shutdown, or the 2023 Binance Netherlands withdrawal. The 2023 withdrawal is
  kept in the separate S5 corporate event binance-netherlands-exit-2023-07.

  Structurally, this remains part of the 2021 Binance regulator wave alongside
  UK FCA 2021-06, Malaysia SC 2021-07, and Singapore MAS 2021-09. Its usable
  role is an aggregate datapoint for regulator-imposed exchange/custody
  service constraints, not a narrative anchor for a full cross-layer cascade.

scoped_claim: |
  "DNB's 2021-08-18 warning and subsequent 2022 fine establish an official
  Netherlands regulatory-enforcement action against Binance for offering
  crypto exchange and custodian-wallet services without the legally required
  DNB registration. The retained observation is limited to that CEX/off-ramp
  regulatory service surface; it does not claim ISP blocking, frontend
  unavailability, app-store removal, on-chain asset action, fiat-rail shutdown,
  or the later 2023 Binance Netherlands market exit."

