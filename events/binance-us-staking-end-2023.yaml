analysis_notes: |
  **REJECTED 2026-06-01** (automated quality-loop audit; no new human-audit
  stamp). The original row asserted that Binance.US discontinued all staking
  services on 2023-06-09 through a Binance.US blog announcement. That exact
  assertion could not be backed by a replayable primary source, and the
  retained replayable Binance.US / Guardian anchors for the same post-SEC
  window document a different operational change: OTC pause, selected trading
  pair removals, and USD fiat-rail disruption.

  The real SEC v. Binance platform/off-ramp reaction is already admitted in
  sec-v-binance-2023. Keeping this row as admitted would double-count that
  platform reaction and would also contaminate the SEC-staking comparator
  set by presenting Binance.US as a Kraken-like staking-service shutdown
  without a settlement order or replayable Binance.US staking-shutdown anchor.

  The file is retained only as a rejected cross-reference stub so future case
  collection does not reintroduce the same unsupported staking-shutdown claim.
  The single observation is observed_no_change with attribution=none, meaning
  "no independent corpus event is admitted here," not proof of a comprehensive
  product-state crawl across every Binance.US staking asset.

