analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase A.2 corporate_policy discovery; lean run): authored by LLM agent without personally verifying Wayback/body_hash; origin=human_reviewed required by validator. Real release must replace this DRYRUN marker with a human-verified audit after pinning real archive anchors.

  comparison documenting Binance.US (BAM Trading Services Inc.) 2023-06-09
  autonomous discontinuation of its staking-as-a-service product, four days
  after the 2023-06-05 SEC v. Binance complaint (sec-v-binance-2023) named
  Binance Simple Earn, BNB Vault, BUSD staking-product, and BETH among 13
  charges. Structurally, this row is the **autonomous-vs-forced comparison
  anchor** paired with kraken-sec-staking-2023 (2023-02-09 SEC-settlement-
  ordered Kraken staking shutdown): same product-category withdrawal (CEX
  staking-as-a-service in the U.S. market), divergent trigger type
  (corporate_policy_change here vs sec_action at Kraken), and divergent
  legal instrument (unilateral corporate announcement here vs SEC press
  release plus same-day Kraken platform statement at Kraken).

  One observed_change layer (offramp_cex) with attribution=direct via the
  Binance.US corporate blog primary anchor. L0 / L1 / L3 / l4_frontend /
  asset_onchain are all not_applicable or not_measured on substrate-
  mismatch grounds — this is a CEX product-line withdrawal, not a protocol
  or network primitive engagement. Sibling of binance-russia-exit-commex-
  2023 in the S5 corporate-policy / market-exit cluster, distinguished by
  the product-category-only scope (staking only, not full market exit) and
  the U.S.-jurisdiction anchor (vs Russia-market in the CommEX divestiture).

  Comparative value: high-intensity SEC civil-action upstream context
  (sec-v-binance-2023, 4 days prior) yielding an autonomous corporate-
  policy response at the staking-product layer rather than a settlement-
  ordered shutdown. The 2023-11-21 binance-4framework-2023 DOJ / FinCEN /
  OFAC / CFTC settlement is downstream context (~5 months after this row)
  and not directly load-bearing for the staking-service decision.

scoped_claim: |
  "The 2023-06-09 Binance.US autonomous discontinuation of its staking-as-
  a-service product, announced four days after the SEC v. Binance complaint
  but executed as an autonomous corporate-policy decision rather than a
  regulator-ordered cessation, produced a single-layer cascade at the
  offramp_cex surface: the U.S.-scoped Binance.US pooled-staking product
  was withdrawn. The row asserts only this offramp_cex observation and
  does not claim L0 network, L1 consensus, L3 RPC, L4 frontend
  delisting/geofence, or asset_onchain issuer-freeze effects. The
  autonomous-vs-forced distinction relative to kraken-sec-staking-2023
  (regulator-ordered twin) is the load-bearing analytical contribution."

