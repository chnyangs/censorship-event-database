scoped_claim: |
  HMRC Revenue & Customs Brief 09/14 of 2014-03-03 ("Bitcoin
  and other cryptocurrencies") set HMRC's position that bitcoin
  mining is outside the scope of VAT, that bitcoin-fiat exchange
  transactions and the associated arrangement fees are VAT-exempt,
  and that normal VAT applies to suppliers of goods or services
  sold in exchange for bitcoin valued in sterling at the
  transaction point. The instrument is facilitative rather than
  restrictive; no UK-resident exchange-side cutoff is documented
  in the 180-day post-publication window, so offramp_cex carries
  an observation_kind=observed_no_change row with attribution=none.

scoped_knowledge: |
  This event is the foundational UK tax-treatment policy event
  for cryptocurrency and a structurally distinctive entry in the
  2014 nation-state-pronouncement cluster: where the sibling
  warnings (Bangladesh BB 2014-09-15, Iceland CBI 2014-03-19,
  Bolivia BCB 2014-05) treat bitcoin under existing FX-control
  or AML/CFT law in a restrictive direction, HMRC Brief 09/14
  takes a facilitative direction by clarifying VAT exemption for
  bitcoin-fiat exchange. It is the direct upstream of the CJEU's
  2015-10-22 Hedqvist judgment (C-264/14) on the
  VAT-exemption-for-bitcoin-exchange question at EU level, and
  contextualises the pre-MiCA UK position on cryptocurrency
  tax treatment that persisted (with modifications via HMRC's
  CRYPTO internal manuals from 2018 and the Cryptoassets
  Taskforce 2018 report) into the post-MiCA / FCA-PR-22-13
  registration era. Paper-relevant as the earliest UK
  nation-state pronouncement on cryptocurrency and as a control
  case for restrictive-versus-facilitative regulatory-instrument
  comparison within the 2013-2016 historical-baseline tier.

