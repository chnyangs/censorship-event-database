  **NEW EVENT AUTHORED — DRYRUN 2026-05-17 (Wave 2.3 P2)**.
  Historical-baseline contextual case for the UK HMRC Revenue &
  Customs Brief 09/14 ("Bitcoin and other cryptocurrencies")
  published 2014-03-03, clarifying the VAT treatment of bitcoin
  activities (mining outside scope of VAT; bitcoin-fiat exchange
  VAT-exempt; normal VAT on goods/services sold for bitcoin).
  Authored at status=draft / origin=agent_draft pending human
  audit of (i) the gov.uk and Tax Journal URL reachability and
  Wayback snapshot pinning, (ii) the underlying HMRC internal
  manuals (VATFIN, CRYPTO) referenced downstream, and (iii) any
  exchange-side evidence of UK-resident cutoff in contemporaneous
  press coverage.

  Significance: Brief 09/14 is the foundational UK tax-treatment
  policy event for cryptocurrency and the first major
  English-language nation-state pronouncement framing bitcoin
  exchange as a VAT-exempt financial-services activity. It
  preceded and shaped the CJEU's 2015-10-22 Hedqvist judgment
  (C-264/14), which adopted a structurally similar
  VAT-exemption position at EU level. Sibling to the
  contemporaneous eba-virtual-currencies-opinion-eba-op-2014-08
  on the supranational supervisory-guidance axis, with the
  important contrast that EBA Op 2014/08 is risk-averse /
  restrictive while HMRC Brief 09/14 is facilitative /
  clarifying.

  Why trigger.type=regulatory_enforcement (not nation_state_block):
  per codebook §5.1, regulatory_enforcement is the canonical
  trigger.type for non-US national regulator administrative
  enforcement actions that are NOT network-layer or payment-rail
  blocks. The HMRC brief states a tax-treatment interpretation
  under the Value Added Tax Act 1994 and the Corporation /
  Income / Capital Gains Tax framework; it does not direct
  ISP-level blocking or payment-system severance. This matches
  the codebook §5.1 carve-out distinguishing
  regulatory_enforcement from nation_state_block.

  Why temporal_tier=historical_baseline_2013_2016 +
  analysis_use=historical_baseline: 2014 belongs to the
  pre-2017 historical-baseline tier per sampling/frame.yaml.
  analysis_use=historical_baseline excludes this row from the
  2017+ comparable-analysis denominator. The event is retained
  as contextual case-study material because (a) it predates the
  comparable corpus and (b) the policy is facilitative rather
  than restrictive — distinct from the cascade-generating
  enforcement actions that dominate the comparable corpus.

  Why null_event / null_case: the offramp_cex observation is
  observation_kind=observed_no_change with attribution=none,
  not an observed_change row. Brief 09/14 clarifies tax
  treatment in a pro-bitcoin direction (VAT exemption) and
  does not direct any cascade-generating restriction; the
  expected cascade surface (exchange-side UK-resident cutoffs)
  is absent in the public record. Without a documented
  exchange-side cutoff or a measured UK-resident on-chain
  volume shift attributable to the brief, the event admits
  only at null_case strength and empirical_shape=null_event.
  This is exactly the foundational tax-treatment policy event
  contemplated in the prompt facts as low-cascade / mostly
  null_event.

  Why L0/L1/L3/L4/asset_onchain are not_applicable: the brief
  is a tax-treatment guidance instrument under the VATA 1994
  and the CT/IT/CGT framework; it does not direct network-layer
  blocking, L4 frontend changes, or engage any
  2014-nonexistent L1/L3 PBS measurement primitive or any
  asset-issuer admin path. The L0/L1/L3/L4/asset_onchain
