      MEV-Blocker launched 2023-03-27. not_applicable on
      construct-did-not-exist grounds.
  - layer: l4_frontend
    status: not_applicable
    note: |
      Brief 09/14 is a tax-treatment notice addressed to UK
      taxpayers; it does not require frontend changes at any
      specific exchange or service. No L4 frontend surface
      within the UK is in scope.
  - layer: asset_onchain
    status: not_applicable
    note: |
      Bitcoin native asset has no issuer-side blacklist / freeze
      admin method. The 2014 HMRC brief does not engage a
      stablecoin-issuer admin path (USDT first issued ~2014-10;
      chainwide admin freezes arose later). not_applicable on
      construct-did-not-exist grounds.
  - layer: offramp_cex
    status: measured
    note: |
      Brief 09/14 is by construction an off-ramp-layer signal at
      the tax-treatment surface: it clarifies that bitcoin-fiat
      exchange transactions are VAT-exempt and that mining is
      outside the scope of VAT. The structural effect is
      facilitative rather than restrictive (the brief is widely
      characterised as a pro-bitcoin clarification in the 2014
      English-crypto press) and does not direct any exchange-
      side cutoff of UK-resident accounts. The coverage scope
      for the observed_no_change row below is the public record
      (gov.uk, Tax Journal, Bitcoin Magazine, accountancydaily)
      for the 180 days following the 2014-03-03 publication: no
      UK exchange is documented as having cut off UK-resident
      accounts in response to the brief, and the dominant
      UK-serving 2014 bitcoin exchanges (Bitstamp, Coinfloor,
      LocalBitcoins) did not implement UK-resident-specific
      compliance flags in the public record traceable to the
      brief. partially_measured because the public-record search
      is bounded but not exhaustive.
