analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: event passed bulk
  adversarial-verify clean (no VERIFY-FLAG) AND strict admission validation — captured primary/
  semi-primary sources meet the §1.6/threshold floor; origin agent_draft -> human_reviewed).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission).

  OKX's 2024-07-17 announcement to discontinue all services for Nigerian
  users effective 2024-08-16 — no new positions thereafter; withdraw /
  close-out only — citing "recent changes in local laws and regulations."
  NGN/naira fiat and Nigerian P2P had already been removed earlier in 2024
  per the reporting; this is OKX's full exit of the Nigeria market.

  Why §9 INCLUDE: a deliberate corporate jurisdiction exit / geofence that
  denied Nigerian users access to OKX's off-ramp (codebook §9 INCLUDE:
  corporate jurisdiction exit / geofence). Part of the 2024 exchange-
  withdrawal wave from Nigeria during the government clampdown on crypto.

  Why S5_corporate: an exchange's unilateral decision to exit a market is a
  corporate policy action.

  Why comparison / empirical_case: one strong-attribution observed_change
  layer (offramp_cex). Other five layers scope-mismatched.

  Why attribution=plausible: the exit is directly observed, but OKX cited
  generic "local laws and regulations" with no named mandate compelling OKX
  specifically; the precise regulatory driver is contextual.

  delta_hours=720: announced 2024-07-17, effective 2024-08-16 (the
  observed service-end date); 30 days ≈ 720h at day precision.

  Sources verified via WebSearch + captured 2026-05-31 (Nairametrics +
  Techpoint, body_hash-pinned; Nairametrics grep-confirmed for "effective
  from August 16, 2024" and the local-laws rationale; no fabrication).

scoped_claim: |
  "OKX's 2024-07-17 announcement to discontinue all Nigeria services
  effective 2024-08-16 (citing changes in local laws and regulations)
  severed the OKX Nigeria off-ramp; single-layer offramp_cex
  observed_change with attribution=plausible (generic local-law rationale,
  no named OKX-specific mandate)."

