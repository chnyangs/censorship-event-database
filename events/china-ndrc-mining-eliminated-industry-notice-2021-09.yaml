  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources verified+captured,
  awaiting human admission).

  Event: On 2021-09-24 China's National Development and Reform Commission (NDRC) issued a
  "Notice on Rectifying / Regulating Virtual Currency Mining," ordering local authorities to
  phase out the cryptocurrency-mining industry (deemed an "outdated" industry) and to cut off
  its financial / investment / electricity / tax support channels. §9 INCLUDE: this is a
  deliberate state restriction debanking/de-supporting a legitimate industry class — not a
  mere non-recognition statement.

  Scope discipline: the primary NDRC notice supports the Industrial Structure Adjustment
  Catalogue / eliminated-industry wording, the co-signing eleven-department instrument,
  and the financial/energy/tax support-cutoff language. The event remains scoped to the
  NDRC mining-industry phase-out/support-severance instrument, not the parallel PBOC
  transaction-ban notice or a separately measured hashrate-denominator slice.

  Why trigger.type=nation_state_block: closest enum for a single-country state-planning-body
  industrial-restriction/support-severance action (same enum as the sibling China mining-ban
  events). §5.2 maps nation_state_block → S4_nation_state.

  Why offramp_cex carries the effect (not l1_consensus): the notice's mechanism is severance
  of the financial/service/energy support surface sustaining mining enterprises (a debanking-
  style class action), which routes to offramp_cex. l1_consensus left not_measured per §2 — no
  replayable hashrate-denominator slice pinned in this draft; the 2021 hashrate collapse is
  already carried (measured) by the May/June sibling events.

  Why empirical_shape=comparison / admission_tier=empirical_case: exactly one observed_change
  layer (offramp_cex) with strong attribution (direct).

  Why attribution=direct: the official NDRC notice and Q&A are now locally pinned and
  directly state the restrictions being coded. The target remains class-level, but the
  scoped observation is the class restriction itself rather than a downstream firm-by-firm
  implementation roster.

  DEDUP NOTE: distinct from china-pboc-crypto-ban-2021 (the parallel same-day inter-agency
  PBOC notice declaring all crypto transactions illegal — a trading/transaction ban, different
  instrument and actor) and from the May/June 2021 mining-ban cluster (different instrument
  and dates). This event is the September NDRC national mining-industry phase-out notice.

