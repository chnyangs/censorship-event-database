analysis_notes: |
  **SOURCE STRENGTHENING 2026-06-01:** captured official Bitfinex Wayback
  mementos for /posts/216 ("Service Changes for U.S. Customers") and
  /posts/227 ("Update: U.S. Individual Users"). The trigger now has a
  same-day primary_corporate anchor for the 2017-08-11 policy decision, and
  the observed_change now has a primary_corporate anchor for termination of
  trading, deposit, and withdrawal functionality for U.S. individual customers
  by no later than 2017-11-09. Status remains draft because admission is
  human-only (`origin=agent_draft` cannot be promoted by automation).

  **SOURCE REPAIR 2026-05-31:** the earlier 2025 Wayback capture of the
  Bitcoin.com article was a JS-gated shell. This pass captured the 2017-10-18
  Wayback memento (sha256:
  5a26060a406b8a6b4c8e5459d177802d17c18a8b1b445994531b2c008a140fd9), which
  contains rendered article text confirming Bitfinex would terminate trading,
  deposit, and withdrawal functionality for all U.S. individual customers no
  later than 2017-11-09, and tying the August 11 first disclosure to the SEC
  ICO-securities warning. Status remains draft because admission is human-only
  (`origin=agent_draft` cannot be promoted by automation).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). Bitfinex's 2017-08-11
  announcement to terminate trading/deposit/withdrawal functionality for all US
  retail customers (effective no later than 2017-11-09), dropping US users from
  ERC-20/ICO tokens after the SEC's July-2017 ICO-as-securities warning. §9 IN
  scope: deliberate corporate jurisdiction-exit/geofence of a legitimate
  exchange's US retail segment (not a hack/insolvency). comparison shape,
  single offramp_cex observed_change. attribution=direct per §1.1: Bitfinex
  publicly announced the termination and tied it to the US ICO-securities
  regulatory backdrop, and the action explicitly names the US-retail customer
  class it acted upon. Assets stay on-chain so l0/l1/l3/l4/asset_onchain are
  not_applicable; comparable tier (2017). NOTE: distinct from the 2016 Bitfinex
  hack/socialized-loss event (§9-excluded as a platform failure) — this event
  is the separate US-retail-exit policy action. Source verified via WebSearch +
  captured Wayback (Bitcoin.com 2017 memento, body_hash-pinned, body
  grep-confirmed; no fabrication).

