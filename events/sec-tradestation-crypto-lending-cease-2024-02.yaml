analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: refined the wave-2
  VERIFY-FLAG by rendering+grepping the captured source. All load-bearing specifics (TradeStation/crypto/lending/unregistered/securities/2024) present in the captured SEC press release; no overclaim found (generic-template flag was over-cautious). Sources meet the admission floor.).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission). On 2024-02-07 the US SEC
  (press release 2024-16) charged TradeStation Crypto, Inc. for the
  unregistered offer and sale of a crypto-asset lending product (interest
  feature), settled via cease-and-desist + $1.5M SEC penalty (+$1.5M to 26
  state regulators). The captured SEC release also records that TradeStation
  announced termination of all its US crypto-related products and services on
  2024-02-22 — the load-bearing offramp_cex censorship effect (a legitimate
  US crypto off-ramp exiting the market under enforcement pressure), in scope
  per codebook §9 (SEC enforcement that restricts/shuts a legitimate
  platform). comparison shape, 1 observed_change layer (offramp_cex),
  attribution=direct per §1.4 reasoning (the SEC's own release names the
  target and states the service-termination outcome). asset_onchain
  not_applicable: a centralized account interest feature, no on-chain token
  freeze, so no §1.6 tx_hash floor applies. Sources verified via WebSearch
  2026-05-31 and the real SEC.gov page captured + body_hash-pinned; grep of
  the captured body confirms "TradeStation Crypto", "$1.5 million",
  "interest feature", and "terminate all its crypto-related products and
  services in the U.S. market on February 22, 2024" (no fabrication).

