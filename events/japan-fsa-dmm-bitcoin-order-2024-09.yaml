  Comparison documenting Japan's 2024-09-26 FSA 業務改善命令 (business-
  improvement order) against DMM Bitcoin Co., Ltd. following the 2024-05-31
  private-key theft of ~4,502.9 BTC (~USD 305-482M) — the largest
  single-exchange crypto theft of 2024 worldwide. Hack vector attributed by
  FBI/NPA/DC3 to DPRK-linked TraderTraitor actors via a LinkedIn-staged
  malicious-Python compromise of a Ginco Inc. wallet-software engineer
  (2024-03) and a subsequent session-cookie pivot used to manipulate a
  legitimate DMM signing transaction (2024-05).

  Paper-relevant contrast vs Coincheck 2018-01
  (japan-fsa-coincheck-orders-2018) and Zaif 2018-09
  (japan-fsa-zaif-orders-2018-09): all three are JP FSA Payment-Services-Act
  business-improvement orders triggered by exchange-side hot-wallet/
  private-key compromises. The 2018 Coincheck cascade produced a ~5-month
  customer-withdrawal freeze with eventual Monex Group acquisition; the
  2024 DMM Bitcoin cascade produced no extended customer-withdrawal freeze
  but instead an announced corporate wind-down and asset migration to a
  sibling registered VASP (SBI VC Trade). The 2024 case is also notable
  for foregrounding outsourced-wallet-vendor (Ginco) supply-chain risk,
  which catalysed FSA's 2024-Q4 consultation on a new registration regime
  for crypto-system service providers — a class-wide policy thread that
  the 2018 cases did not produce. Both cohorts share the offramp_cex
  load-bearing axis with asset_onchain context.

  DRYRUN caveats: trigger primary citation (FSA press-release index) is
  asserted with a 2024-calendar-folder Wayback pointer; pinned snapshot
  timestamp and body_hash capture for the specific 2024-09-26
  業務改善命令 release permalink are deferred to the human-audit pass. For
  non-DRYRUN release, capture body_hash + body_path for: (1) the FSA's
  2024-09-26 business-improvement-order release page, (2) DMM Bitcoin's
  customer-notice page announcing the SBI VC Trade migration, (3) SBI VC
  Trade's intake-announcement page, (4) Chainalysis/Elliptic/MerkleScience
  on-chain attribution publications for the ~4,502.9 BTC stolen-funds
  cluster, (5) the FBI/NPA/DC3 joint TraderTraitor attribution statement.
  Marked evidence_use=contextual_unarchived on all citations to flag the
  unarchived state per validator policy.

