analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase A.1 of comprehensive collection plan; us_federal_enforcement frame discovery): authored by LLM agent without personally verifying Wayback/body_hash; origin=human_reviewed required by validator. Real release must replace this DRYRUN marker with a human-verified audit after pinning real archive anchors.

  comparison shape: 1 observed_change layer (L4 frontend) is the
  retained admission anchor in this DRYRUN row. The brief identifies
  asset_onchain (Bitcoin seizure receipts) as the second load-bearing
  layer structurally, framing Welcome to Video as the cleanest
  address-traceability anchor in the DOJ stratum (IRS-CI methodology
  publicly framed around chain analysis of BTC payment flows). That
  second layer is held at coverage.status=not_measured rather than
  observed_change because the authoring brief forbade fabricating a
  primary_onchain tx_hash. After a real human audit pins verified
  forfeiture-complaint BTC addresses and explorer references (or
  body_hash artifacts of those filings), the row would promote to a
  2-layer comparison with asset_onchain as the second observed_change.

  Structural neighbors: silk-road-doj-seizure-2013 (Tor + BTC, earlier
  baseline, L4-only), alphabay-hansa-doj-2017 (Tor + multi-chain
  marketplace, L4-only), hydra-doj-2022 (Tor + BTC + parallel OFAC,
  L4-only). Welcome to Video sits at 2019-10-16, between
  alphabay-hansa-doj-2017 and hydra-doj-2022 in the
  darknet-marketplace-takedown comparison set, and is the cleanest
  jurisdiction-spanning joint operation in that family (US + UK + KR
  named on the indictment release).

  Analysis kept factual and minimal per the authoring brief; this
  marketplace was a CSAM venue and the row exists as a structural
  reference point in the DOJ enforcement cascade.

scoped_claim: |
  "The 2019-10-16 DOJ unsealing of the indictment of Jong Woo Son for
  operating the Welcome to Video Tor marketplace produced an L4
  frontend seizure of the marketplace's Tor hidden-service
  infrastructure, in a joint operation with IRS-Criminal
  Investigation, UK NCA, and Korean NPA. The row claims only this
  single-layer marketplace-takedown observation; the asset_onchain
  BTC-seizure receipts that structurally anchor the case's
  address-traceability framing are held at not_measured pending
  human audit of forfeiture filings."

