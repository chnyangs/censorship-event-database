coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      Welcome to Video was a Tor hidden service; ordinary public-web
      L0 reachability instruments (Censored Planet, OONI) do not apply
      to .onion services.
  - layer: l1_consensus
    status: not_applicable
    chain: bitcoin
    note: |
      Bitcoin, pre-Merge by ~3 years; consensus-layer filtering
      surfaces tracked by this dataset (PBS relays, mev-watch /
      censorship.pics) did not exist in 2019 on Bitcoin.
  - layer: l3_rpc
    status: not_applicable
    chain: bitcoin
    note: |
      No Bitcoin RPC-provider rejection surface is implicated by the
      Welcome to Video takedown; this is a Tor-hosted marketplace
      seizure plus parallel BTC forfeiture, not an RPC-mediated
      transaction-rejection event.
  - layer: l4_frontend
    status: measured
    scope: [welcome_to_video_tor_service]
    note: |
      The Welcome to Video Tor hidden service was seized as part of
      the joint US/UK/KR takedown announced 2019-10-16. The DOJ press
      release describes the marketplace as taken down and its servers
      seized; the canonical .onion address is not retained at this
      event level because no Wayback / replayable .onion snapshot is
      pinned in this DRYRUN row. The L4 observation is anchored on
      the primary-legal DOJ release as the evidentiary instrument
      naming the service and the seizure.
  - layer: asset_onchain
    status: not_measured
    chain: bitcoin
    scope: [welcome_to_video_btc_seizure_receipts]
    note: |
      The DOJ release describes approximately $370K in Bitcoin seized
      from the Welcome to Video operator and downstream defendants,
      enabling the address-traceability investigative chain that the
      government and IRS-Criminal Investigation framed as the case's
      methodological signature. Status is not_measured (not
      not_applicable) to mark the substrate as load-bearing for the
      structural framing: with verified per-transaction seizure
      receipts pinned (forfeiture complaints listing BTC addresses,
      block-explorer references) this row could be promoted to a
      cascade shape with asset_onchain as a second observed_change
      layer. The authoring brief forbade fabricating a tx_hash, so no
      primary_onchain anchor is retained in this DRYRUN row, and the
      asset_onchain layer remains structurally not_measured pending
      human audit. Bitcoin has no issuer-level blacklist primitive;
      the on-chain dimension here is custody-transfer / forfeiture
      tracing, not protocol-layer asset freeze.
  - layer: offramp_cex
    status: not_applicable
    note: |
      The target is the darknet marketplace itself plus its named
      operator, not a centralized exchange. No CEX delisting or
      withdrawal freeze is implicated by the 2019-10-16 takedown.

