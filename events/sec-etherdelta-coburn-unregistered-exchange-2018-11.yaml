analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission). On 2018-11-08 the US SEC
  (press release 2018-258) settled charges against Zachary Coburn, founder of
  EtherDelta, for operating an unregistered national securities exchange — a
  decentralized ERC20-token trading platform built from an order book, an
  order-display website, and an Ethereum smart contract (3.6M+ orders over
  ~18 months). This is the SEC's first enforcement action treating a DEX /
  smart-contract order book as an unregistered exchange and is explicitly
  named in codebook §9 as an in-scope censorship action (enforcement that
  restricts a legitimate trading platform). Single observed_change layer
  (l4_frontend trading frontend) -> empirical_shape comparison, admission_tier
  empirical_case. attribution=direct: the SEC order is the operative instrument
  and names the target. l3_rpc not applicable (the matched trading surface is
  the frontend/smart-contract, not a hosted RPC provider); asset_onchain
  not_applicable (no on-chain freeze instrument — the action is a securities
  registration charge, no tx_hash exists); offramp_cex not_applicable (no CEX
  off-ramp involved). Sources verified via WebSearch 2026-05-31; real SEC
  press-release page captured + body_hash-pinned (claims "EtherDelta",
  "Coburn", "unregistered national securities exchange", "ERC20", "3.6 million"
  grep-confirmed; no fabrication).

scoped_claim: |
  "The 2018-11-08 SEC settled order against Zachary Coburn for operating
  EtherDelta as an unregistered national securities exchange (order-book
  website + Ethereum smart contract) is the first SEC action treating a DEX /
  smart-contract order book as an unregistered exchange. Effect carried at
  l4_frontend (trading-frontend restriction), attribution=direct.
  Comparable-main tier."

