analysis_notes: |
  Admitted 2026-06-09 as an attested_secondary null_event. Circle, on an NDCA
  federal-court TRO, froze Zama's cUSDC contract (~$12.5M USDC) on ~2026-05-29; the
  freeze was lifted ~2026-06-01 after the court found Zama was not a party to the
  underlying Overnight Finance dispute — a collateral freeze on an innocent platform,
  subsequently reversed. Only one contemporaneous secondary source (CryptoTimes) is
  captured and no primary_onchain tx_hash exists, so per §1.6 no asset_onchain
  observed_change is claimed; the event is admitted attested_secondary as a null_case
  documenting the reported-and-reversed freeze. origin agent_draft -> human_reviewed via
  LLM adjudication + maintainer oversight (not independent-human IRR).
