analysis_notes: |
  **NEW EVENT AUTHORED - DRYRUN 2026-05-16** (Phase E discovery-tier
  authoring): new discovery_only_2008_2012 event for the 2008-07-21
  DOJ DC guilty plea by e-Gold Ltd., Gold & Silver Reserve Inc., and
  Douglas Jackson. Authored by LLM agent without personally
  verifying Wayback/body_hash; origin=agent_draft and status=draft
  per validator constraint (agent_draft incompatible with admitted).
  Real release must replace this DRYRUN marker with a human-verified
  audit after pinning real archive anchors (the wayback URLs here
  are 2008 wildcard pointers, not pinned snapshot timestamps).

  comparison shape: 1 observed_change layer (offramp_cex, e-Gold
  service operations cessation following corporate + CEO guilty
  pleas). The 2008-07-21 plea in US District Court for the District
  of Columbia to operating an unlicensed money transmitter (18 USC
  s 1960) and conspiring to engage in money laundering (18 USC
  s 1956(h)) is the foundational pre-Bitcoin digital-currency
  takedown — it predates FinCEN FIN-2013-G001 by ~5 years and
  establishes the BSA / MSB / 18-USC-1960 enforcement template
  later applied across the 2013-2016 historical-baseline tier
  (Shrem/Faiella 2014, Murgio/Coin.mx 2015) and continuing into the
  2017+ comparable-analysis era. attribution=plausible because the
  DOJ release does not itself order a corporate shutdown; the wind-
  down is the corporate consequence of conviction. L0/L1/L3/L4 and
  asset_onchain are all not_applicable: e-Gold was a centralized
  digital-gold-account ledger (gold-grams off-chain), pre-dating any
  blockchain by ~6 months, and no DOJ-attributed frontend seizure
  is documented for e-gold.com on 2008-07-21. Admission tier
  empirical_case (1 strong-attribution observed_change layer).

  Discovery-tier-only by construction: temporal_tier=
  discovery_only_2008_2012 and analysis_use=discovery_ledger_only.
  This row carries no comparable-analysis denominator weight; its
  purpose is to anchor the 2008+ pre-Bitcoin DOJ MSB enforcement
  predicate for the FinCEN-2013-G001 → Shrem-2014 → Coin.mx-2015
  → BTC-e-2017 lineage already in corpus.

scoped_claim: |
  "The 2008-07-21 DOJ guilty plea by e-Gold Ltd., Gold & Silver
  Reserve Inc., and Douglas Jackson (in US District Court for the
  District of Columbia) on conspiracy to engage in money laundering
  (18 USC s 1956(h)) and operation of an unlicensed money
  transmitting business (18 USC s 1960) produced an offramp_cex
  cascade (e-Gold's digital-gold-account service operations ceased
  and did not resume). The row claims only this single-layer
  offramp shutdown observation with attribution=plausible; no
  L0/L1/L3/L4/asset-onchain effects are coded. Discovery-tier only:
  no comparable-analysis use."

