analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: event passed bulk
  adversarial-verify clean (no VERIFY-FLAG) AND strict admission validation — captured primary/
  semi-primary sources meet the §1.6/threshold floor; origin agent_draft -> human_reviewed).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources verified+captured,
  awaiting human admission). Bank Indonesia press release No. 20/4/Dkom of 2018-01-13
  declared virtual currency (incl. bitcoin) not a legitimate payment instrument under Law
  7/2011 AND barred all Indonesian payment-system service providers (PJSP) and fintech
  operators — bank and non-bank — from processing virtual-currency transactions. §9 inclusion:
  the operative, in-scope element is the processing PROHIBITION on payment firms (a payment-
  rail / off-ramp severance), distinct from and load-bearing relative to the accompanying
  "not legitimate payment instrument" non-recognition statement (which alone would be a §9-
  excludable soft statement). Coded at offramp_cex with direct attribution (the BI press
  release is the actor's own instrument naming the restriction and the target class). NOT a
  duplicate of indonesia-bi-bitcoin-warning-2014 (an earlier 2014 BI advisory) nor
  indonesia-bappebti-illegal-exchange-block-2023 (a 2023 Bappebti action); listed as
  related_events. Companion nation-state payment-rail bans: India RBI 2018, China PBoC 2021,
  Nigeria CBN 2021.

scoped_claim: |
  "Bank Indonesia's 2018-01-13 press release barred Indonesian payment-system and fintech
  operators from processing virtual-currency transactions (and declared crypto a non-legitimate
  payment instrument). Coded as a nation-state off-ramp / payment-rail prohibition at class
  level; primary source is the BI press release."

