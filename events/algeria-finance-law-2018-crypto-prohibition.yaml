analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources verified+captured,
  awaiting human admission). Algeria Finance Law 2018 (Loi n° 17-11 du 27 décembre 2017),
  Article 117, published in Journal Officiel No. 76 on 2017-12-28, prohibited the purchase,
  sale, use and possession of virtual currency nationwide. §9 inclusion: this is a deliberate
  nation-state statutory prohibition (payment-rail / off-ramp ban), not a soft warning or
  non-recognition statement — it criminalizes/prohibits the activity outright, so it is IN
  scope. Primary source is the law text itself (JO No. 76 PDF, Article 117 verified by
  full-text extraction). attribution=direct per codebook §1 (the actor's own legal instrument
  names the restriction and the target class). Drafted with offramp_cex as the load-bearing
  layer (legal severance of buy/sell/use access); set partially_measured anchored to the
  primary legal artifact. Companion nation-state statutory bans in the corpus: India RBI 2018,
  China PBoC 2021, Nigeria CBN 2021.

scoped_claim: |
  "Algeria's Finance Law 2018 (Article 117), published 2017-12-28 in Journal Officiel No. 76,
  prohibited the purchase, sale, use and possession of virtual currency nationwide. Coded as
  a nation-state off-ramp prohibition at class level; primary source is the law text itself."

