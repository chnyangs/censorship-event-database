analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-4 audit (S4 null_event group) by
  human:xiangwen as null_case. CBR press event page Wayback 20220121022021
  (primary_legal) + CoinDesk Wayback 20220120125334 (semi_primary_wayback)
  replayable body_hash. coverage_gap->observed_no_change. coverage[offramp_cex]
  not_measured->measured. CBR 2022-01-20 consultation paper proposed full
  crypto ban but NOT enacted (MinFin countered with regulate-not-ban; 259-FZ
  + 2024 mining law implemented partial restriction). null_event/null_case preserved.

  **NEW EVENT AUTHORED — DRYRUN 2026-05-17**. Comparable-main
  authoring pass for the 2022-01-20 Bank of Russia consultation
  paper "Cryptocurrencies: trends, risks, measures" ("Криптовалюты:
  тренды, риски, меры"). origin=agent_draft and status=draft; human
  re-verification of (i) the cbr.ru source URL reachability and
  Wayback snapshot pinning, (ii) the CoinDesk and Al Jazeera
  English-language journalism snapshots, and (iii) any
  contemporaneous Russian off-ramp class-level measurement is
  required before this event may be promoted to human_reviewed.

  Why comparable_main / comparable_analysis tier: 2022 falls inside
  the 2017+ comparable analysis frame. analysis_use=comparable_
  analysis is the canonical form (codebook §6); aliases
  "comparative_analysis" / "contextual_baseline" are not accepted
  by the validator.

  Why empirical_shape=null_event / admission_tier=null_case: zero
  observed_change observations. The CBR consultation paper was a
  proposal — not an enacted regulation — and did not directly
  actuate L0 blocking, asset-onchain freezes, or offramp_cex
  payment-rail severance. The Russian Ministry of Finance published
  a competing regulation-rather-than-ban concept in early February
  2022, and the Russian regulatory framework (259-FZ already in
  force since 2021-01-01, plus the 2024 mining law) implemented a
  partial-restriction posture instead. The single observation row
  is observation_kind=coverage_gap with attribution=unknown, which
  does not contribute toward empirical_shape or admission_tier
  per codebook §3 / §4. null_event is the conservative shape
  consistent with the task-brief hint.

  Why trigger.type=regulatory_enforcement (NOT nation_state_block):
  per codebook §5.1, regulatory_enforcement is the canonical
  trigger type for non-US national regulator administrative
  enforcement that is NOT a network-layer or payment-rail block.
  The CBR consultation paper is administrative regulatory text
  proposing a ban; it is not itself a Roskomnadzor ISP/DNS block
  directive nor an enacted payment-rail severance. nation_state_
  block is reserved for actuated ISP/DNS or payment-rail blocks
  (KZ shutdown, CN PBoC banking-rail severance, NG CBN, IN RBI,
  TR CBRT). The task-brief hint explicitly notes "the proposal
  didn't take direct effect; this is null_event-shaped", which
  aligns with regulatory_enforcement rather than nation_state_
  block. research_stratum=S4_nation_state is permitted for both
  trigger types per codebook §5.2.

  Why target.kind=entity / enumeration=subset: schema target_kinds
  does not include "regulatory_class"; entity is the closest enum
  for a population/activity-class target. enumeration=subset rather
  than complete because the proposal addresses an activity class
  (mining, exchange/P2P circulation, payments) without a fixed
  roster of named entities. Matches the sibling
  russia-cbr-bitcoin-information-letter-2014 pattern.

  Why all coverage layers are not_applicable except offramp_cex:
  L0 — no Roskomnadzor blocking directive in the paper; L1 — no
  consensus-layer primitive engaged; L3 — no public-RPC compliance
  substrate engaged; L4 — no frontend takedown directive; asset_
  onchain — no issuer-side admin freeze primitive engaged. offramp_
  cex (not_measured) — the paper proposed banning crypto exchanges,
  P2P platforms, and crypto payments but the proposal was not
  enacted as proposed and no measured Russian off-ramp shock
  attributable to the 2022-01-20 publication itself has been
  pinned. coverage_gap row is class-level dispersed.

  Cross-temporal context: this 2022-01-20 CBR consultation paper
  is the comparable-main downstream sibling of the 2014-01-27 CBR
  information letter (russia-cbr-bitcoin-information-letter-2014),
  forming a within-jurisdiction longitudinal anchor for Russian
  central-bank crypto-disposition. It is also an upstream context
  anchor for russia-mining-regional-ban-2024-12 (the partial
  mining restriction eventually enacted). The 2022 consultation
  established the regulatory split between the CBR (anti-crypto,
  full-ban posture) and the Ministry of Finance (pro-regulation
  posture), which framed Russian crypto regulatory debate through
  2024.

  Evidence-use posture: all three citations are marked
  evidence_use=contextual_unarchived because Wayback anchors are
  provisional (year-prefix wildcard) and require specific snapshot
  timestamp re-pinning at human audit. Per task brief
  evidence_use=contextual_unarchived applies to all sources.

