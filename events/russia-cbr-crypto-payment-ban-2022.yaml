    status: not_applicable
    note: |
      The 2022-01-20 CBR consultation paper is a regulatory
      proposal, not an ISP-level domain block or DNS directive.
      Russian Roskomnadzor enforcement of crypto-exchange domain
      blocking is a separate enforcement track not actuated by
      this consultation paper. L0 not_applicable on scope-mismatch
      grounds.
  - layer: l1_consensus
    status: not_applicable
    note: |
      No protocol-level relay-filter primitive is engaged by a
      national consultation paper. not_applicable on
      construct-mismatch grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      Public-RPC compliance substrate (Flashbots Protect /
      MEV-Blocker) is not engaged by a national consultation
      paper that did not become binding law. not_applicable.
  - layer: l4_frontend
    status: not_applicable
    note: |
      The consultation paper does not direct frontend takedowns
      and was never enacted in the form proposed. not_applicable
      on scope-mismatch grounds.
  - layer: asset_onchain
    status: not_applicable
    note: |
      No issuer-side admin freeze primitive engaged. The proposal
      is class-level Russian-jurisdiction regulatory text without
      stablecoin-issuer or chain-admin engagement. not_applicable.
  - layer: offramp_cex
    status: measured
    note: |
      The CBR consultation paper proposed banning dedicated crypto
      exchanges, P2P platforms, and crypto payments in Russia, but
      the proposal was not enacted as proposed: the Russian
      Ministry of Finance published a competing
      regulation-rather-than-ban concept in early February 2022,
      and Russian crypto-payment activity continued under a partial
      framework (259-FZ + subsequent amendments). No measured
      Russian off-ramp shock attributable to the 2022-01-20
      consultation publication itself has been pinned in this
      authoring pass. Marked not_measured with a coverage_gap
      observation row below; this is the null_event-shaped
      empirical posture flagged in the task brief.

