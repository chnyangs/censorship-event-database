  comparison documenting the Hong Kong Stablecoins Ordinance (Cap. 656)
  commencement on 2025-08-01 — the first HKMA-administered stablecoin
  issuer licensing regime globally for fiat-referenced stablecoins (FRS).
  Unlike sanction-style enforcement (S1/S2 OFAC), this is a regulatory-
  framework trigger: criminal-penalty-backed licensing of stablecoin
  issuance as a regulated activity (HK$5M fine + 7yr imprisonment for
  unlicensed conduct). Structurally closest to EU MiCA (eu-mica-2023) as
  a supranational/national regulatory framework establishing licensing
  preconditions for stablecoin issuance, and to the HK SFC VATP licensing
  regime (hongkong-sfc-vatp-licensing-2023-06) as a parallel HK-side
  licensing trigger covering crypto-asset trading platforms rather than
  stablecoin issuers. Load-bearing axes: asset_onchain (issuance-licensing
  gate) and offramp_cex (HK-stablecoin fiat-rail downstream). L0/L3/L4
  marked not_applicable — the regime constrains who may legally issue, not
  network reachability, validator behaviour, RPC routing, or frontend
  takedown.

scoped_claim: |
  "The Hong Kong Stablecoins Ordinance (Cap. 656) commenced operation on
  2025-08-01, establishing the first HKMA-administered licensing regime
  for fiat-referenced stablecoin (FRS) issuers, including extraterritorial
  application to any HKD-referenced stablecoin issuer worldwide.
  Unlicensed issuance carries criminal penalties up to HK$5 million fine
  and 7 years imprisonment. Observational axes at asset_onchain (issuance-
  licensing gate) and offramp_cex (downstream HK-stablecoin fiat-rail
  severance for unlicensed issuers). Admission-anchor promotion pending
  pinned body_hash anchors for HKMA, HKSAR Government, and HKMA
  implementation-notice URLs plus published HKMA licensing-register
  snapshot."

