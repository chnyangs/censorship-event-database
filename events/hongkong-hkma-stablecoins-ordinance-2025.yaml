  **PROMOTED 2026-05-21** (c) Batch C-4 audit (S4 comparison/Hong Kong cluster;
  FINAL HK 4/4) by human:xiangwen as empirical_case. HKMA stablecoin-issuers
  page Wayback 20250115063707 + HKSAR gov.hk announcement Wayback 20250624141341
  + HKMA press release Wayback 20250729123352 captured (all primary_legal,
