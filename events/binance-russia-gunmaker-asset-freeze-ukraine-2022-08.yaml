analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen reviewing agent: TASK-2 lower-tier. §9-clear, well-documented deliberate restriction admitted at evidence_tier=attested_secondary (codebook §10) — single captured contemporaneous source; verified clean (no fabrication) in bulk adversarial-verify; filterable via evidence_tier.)
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). Binance froze the custodial
  account of Vladislav Lobaev (founder of Lobaev Arms, a Russian firearms
  manufacturer) who had fundraised ~US$21,700 (800,000 UAH) in BTC/ETH/USDT
  for Russian troops in Ukraine, after the Security Service of Ukraine
  (SSU) publicly announced it had "blocked" the wallet and CoinDesk
  confirmed it was a Binance account. comparison shape, single offramp_cex
  observed_change. attribution=plausible: Binance's stated reason to the
  user was generic ("locked due to an account review"), not an explicit
  citation of the SSU request, so the Ukrainian-law-enforcement-request
  linkage is journalistic inference (§1.1 / §8(4) conservative default).
  Per §1.6 the asset_onchain row is not_applicable and no primary_onchain
  tx_hash is claimed: the funds are in Binance custody and the action is a
  custodial account lock, not an issuer on-chain blacklist — the effect is
  carried at offramp_cex. jurisdiction=RU (account holder) + UA (requesting
  authority). Source verified via WebSearch + capture 2026-05-31 (CoinDesk
  via Nasdaq syndication, body_hash-pinned; freeze + Lobaev identity + SSU
  + amount grep-verified; no fabrication).

scoped_claim: |
