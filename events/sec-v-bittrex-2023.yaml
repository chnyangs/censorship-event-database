analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase A.1 of comprehensive collection plan; us_federal_enforcement frame discovery): authored by LLM agent without personally verifying Wayback/body_hash; origin=human_reviewed required by validator. Real release must replace this DRYRUN marker with a human-verified audit after pinning real archive anchors.

  comparison — third SEC civil-enforcement event in the dataset operating on
  the same unregistered-exchange / broker / clearing-agency theory that the
  SEC then deployed against Binance (2023-06-05) and Coinbase (2023-06-06).
  Bittrex is the direct precursor: filed 49 days before SEC v. Binance and
  50 days before SEC v. Coinbase, with substantively identical securities-law
  charges. Unlike the Binance/Coinbase pair, the Bittrex case is paired with a
  load-bearing exchange off-ramp event: Bittrex Inc. wound down US operations
  effective 2023-04-30 (announced 17 days before the SEC filing) and filed
  Chapter 11 in DDE on 2023-05-08 (21 days after), making the US-customer
  off-ramp closure measurable at the offramp_cex layer.

  The admitted observation is intentionally scoped to the Bittrex US
  exchange/off-ramp shutdown. Attribution is plausible rather than direct
  because the wind-down announcement pre-dated the SEC complaint and Bittrex
  framed it as a response to the broader US regulatory and economic
  environment; the SEC enforcement episode is the contemporaneous trigger
  family but not the sole causal mechanism. No L4 frontend takedown, token
  delisting (the six named tokens — OMG, DASH, ALGO, TKN, NGC, IHT — are
  target tokens in a securities-law theory rather than a measured listing
  diff), L1/L3 effect, or on-chain asset freeze is asserted.

scoped_claim: |
  "SEC v. Bittrex (2023-04-17) is admitted only for the Bittrex US
  exchange/off-ramp wind-down + Chapter 11 freeze; the dataset does not claim
  a measured L4 frontend takedown, named-token delisting, L1/L3 effect, or
  on-chain asset freeze."

scoped_knowledge: |
  What changed: the Bittrex US exchange / off-ramp is admitted as a scoped
  CEX/platform shutdown. The retained operational artifacts cover the
  2023-03-31 US-exit announcement (Bittrex support article + bittrex.com
  homepage banner) and the 2023-04-30 wind-down date that bracket the
  2023-04-17 SEC complaint. The Chapter 11 filing on 2023-05-08 is recorded
  in the observation window as the load-bearing off-ramp freeze for any
  remaining US-customer cohort.

  What did not change or could not be measured: this event has no address
  set, no asset issuer primitive, and no L1/L3 mechanism. The six named
  tokens (OMG, DASH, ALGO, TKN, NGC, IHT) are target tokens in a
  securities-law theory rather than target chains for on-chain measurement.
  The Bittrex Global non-US arm is not coded as the measured surface; the
  scoped claim is limited to Bittrex US off-ramp operations.

  Attribution: plausible. The SEC press release and complaint PDF name the
  Bittrex Inc. / Bittrex Global GmbH / William Shihara targets; the Bittrex
  support article and bittrex.com Wayback snapshot record the US-exit
  decision in primary_corporate evidence. Because Bittrex announced the
  wind-down 17 days before the SEC filing and framed it as a response to the
  broader US regulatory and economic environment, attribution is coded
  plausible rather than direct.

  Comparative value: structural precursor to SEC v. Binance and SEC v.
  Coinbase on the same unregistered-exchange / broker / clearing-agency
  theory, with a load-bearing CEX off-ramp closure that the Binance and
  Coinbase rows lack at this intensity.

