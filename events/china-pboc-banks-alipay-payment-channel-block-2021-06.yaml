  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources verified+captured, awaiting human admission)

  China nation-state payment-rail severance. IN SCOPE (codebook §9): on
  2021-06-21 the PBOC summoned major state banks (ICBC, Agricultural Bank of
  China, et al.) and Alipay and ordered them to cut off the payment / fund-
  transfer channels for virtual-currency exchanges and OTC dealers and to close
  crypto-linked accounts — a deliberate debanking / payment-rail prohibition.

  Distinct from china-pboc-crypto-ban-2021 (the 2021-09-24 joint ten-agency
  Notice declaring virtual-currency activities illegal) — this is the earlier
  2021-06-21 banks/Alipay payment-channel order, a separate action three months
  prior. Not a dup of any existing corpus event (verified against
  corpus_inventory_2026_05_30).

  trigger.type=nation_state_block (payment-rail block by the central bank),
  matching the CN_PBOC convention of china-pboc-crypto-ban-2021. Attribution=
  direct per §1.5 (the regulator's own directive names the institutions and the
  payment-channel cut). Single observed_change layer (offramp_cex) ⇒
  empirical_shape=comparison, admission_tier=empirical_case.

  Source discipline: the official PBOC release is now the load-bearing
  primary-government anchor. Same-day journalism is retained only as
  corroboration / English-language context.

