analysis_notes: |
  **NEW EVENT AUTHORED - DRYRUN 2026-05-16** (Phase B authoring): new
  historical-baseline event for the 2015-12-01 SEC civil action filed
  in D. Conn. against Homero Joshua Garza and his cloud-mining
  companies GAW Miners, LLC and ZenMiner, LLC for the unregistered
  sale of Hashlet "securities" pointing to nonexistent or oversold
  cloud-mining capacity. Authored by LLM agent without personally
  verifying Wayback/body_hash; origin=agent_draft and status=draft
  per validator constraint (agent_draft incompatible with admitted).
  Real release must replace this DRYRUN marker with a human-verified
  audit after pinning real archive anchors (the wayback URLs here are
  2015 wildcard pointers, not pinned snapshot timestamps).

  Thin-cascade comparison shape: 1 observed_change layer (l4_frontend,
  gawminers.com / zenminer.com taken offline as cloud-mining service
  surfaces following the SEC complaint and parallel corporate
  collapse). L0/L1/L3/asset_onchain/offramp_cex are all
  not_applicable: no network-layer block was directed, 2015 predates
  the post-Merge PBS L1/L3 measurement surface by ~7 years, Hashlets
  were service contracts rather than on-chain freezable tokens, and
  GAW Miners was a cloud-mining service operator rather than a fiat
  off-ramp / exchange. attribution=direct via the SEC primary-legal
  sources naming Garza and his companies as the targets of the
  unregistered-securities-fraud action. Admission tier empirical_case
  (1 strong-attribution observed_change layer).

  Why historical_baseline tier: 2015-12 sits inside the
  historical_baseline_2013_2016 temporal tier per the 2008+ tiered
  frame. analysis_use=historical_baseline excludes this row from the
  2017+ comparable-analysis denominator while keeping it as
  cross-temporal context for the SEC's early-crypto enforcement
  record against crypto-adjacent securities-fraud schemes. Sibling
  rows in the same tier and family:
  - sec-shavers-btcst-2013 (2013-07-23 SEC civil filing against
    BTCST; Bitcoin-denominated Ponzi; offramp_cex single-layer);
  - sec-burnside-bitcoin-stock-exchange-2014 (2014-12-08 SEC cease-
    and-desist against BTCT and LTC-Global; unregistered crypto-
    denominated securities exchange; L4 + offramp_cex two-layer);
  - sec-voorhees-satoshidice-2014 (sibling 2014 SEC enforcement
    against an unregistered crypto-securities offering).

  Distinguishing feature: GAW Miners / ZenMiner is the only
  historical-baseline SEC enforcement in this slice against a
  cloud-mining service rather than an exchange or pure investment
  scheme. The cascade is correspondingly thin: only the L4 frontend
  records an observed_change, because the target operator class
  (service provider) does not surface at the exchange/off-ramp or
  on-chain-asset layers.

scoped_claim: |
  The 2015-12-01 SEC civil action against Homero Joshua Garza, GAW
  Miners, LLC, and ZenMiner, LLC for the unregistered sale of
  Hashlet "securities" pointing to nonexistent or oversold cloud-
  mining capacity precipitated the cessation of the gawminers.com
  and zenminer.com cloud-mining-service frontends in the months
  following filing. The row claims only this single-layer L4
  frontend cessation observation with attribution=direct; no
  L0/L1/L3/asset-onchain/offramp_cex effects are coded because the
  Hashlet product was a service contract rather than an on-chain
  freezable token and the operator was a cloud-mining service
  rather than a fiat off-ramp / exchange.

