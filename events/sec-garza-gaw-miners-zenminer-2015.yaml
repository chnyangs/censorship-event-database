target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    Named defendants: Homero Joshua Garza (individual founder/CEO);
    GAW Miners, LLC; and ZenMiner, LLC (d/b/a Zen Cloud). GAW Miners
    and ZenMiner were Connecticut-based cloud-mining service operators
    that sold the "Hashlet" product — a service contract purporting to
    represent a share in digital Bitcoin mining capacity. Hashlets
    were not on-chain tokens or freezable assets; they were
    contractual claims against the issuing service. canonical_domains
    lists the two operator-controlled public surfaces. No on-chain BTC
    addresses are enumerated at this event-row level.
  actor_type: cloud_mining_service_operator
  actor_name: GAW Miners / ZenMiner / Garza
  chains: [bitcoin]
  canonical_domains:
    - gawminers.com
    - zenminer.com

jurisdiction: [US]

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The 2015-12-01 SEC civil action did not direct any ISP-level,
      DNS, or network-layer block of gawminers.com or zenminer.com.
      Public-web L0 instruments (Censored Planet, OONI) do not apply;
      any subsequent disappearance of the operator surfaces was a
      corporate consequence of enforcement exposure rather than a
      network-layer event.
  - layer: l1_consensus
    status: not_applicable
    chain: bitcoin
    note: |
      Bitcoin proof-of-work consensus in 2015 has no protocol-level
      relay-filter primitive analogous to the post-Merge Ethereum PBS
      relay surface. The Ethereum Merge itself is ~7 years downstream
      (2022-09-15). not_applicable on construct-did-not-exist grounds.
  - layer: l3_rpc
    status: not_applicable
    chain: bitcoin
    note: |
      The MEV-Boost / Flashbots Protect / MEV-Blocker public-RPC
      compliance substrate that the L3 layer measures did not exist
      in 2015 (Flashbots Protect launched 2022-11). not_applicable on
      construct-did-not-exist grounds.
  - layer: l4_frontend
    status: partially_measured
    scope:
      - gawminers.com
      - zenminer.com
    note: |
      Load-bearing layer. Following the 2015-12-01 SEC complaint and
      the parallel collapse of GAW Miners / ZenMiner operations, the
      gawminers.com and zenminer.com public frontends ceased operating
      as cloud-mining-service surfaces in the weeks/months after
      filing (site offline by early 2016). Coverage is
      partially_measured: the operator-surface cessation is publicly
      attested via the SEC primary-legal sources and contemporaneous
      reporting, but no pinned per-month Wayback frontend timeline
      has been independently captured in this draft pass to bracket
      the precise shutdown window.
  - layer: asset_onchain
    status: not_applicable
    chain: bitcoin
    note: |
      Hashlets were service contracts (purported shares of digital
      mining capacity), not on-chain tokens with an issuer-side
      blacklist / freeze admin method. Bitcoin native asset is
      unfreezable at the protocol layer; no stablecoin admin-method
      surface is implicated. not_applicable on construct-did-not-exist
      grounds for the asset-onchain dimension as defined by this
      dataset.
  - layer: offramp_cex
    status: not_applicable
    note: |
      GAW Miners / ZenMiner was a cloud-mining service operator, not
      a centralized exchange or fiat off-ramp; the companies did not
      function as a Bitcoin/fiat trading venue. The SEC action targets
      the unregistered-securities offering (Hashlets), not an
      exchange/off-ramp function. not_applicable.

