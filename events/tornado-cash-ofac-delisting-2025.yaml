coverage:
  - layer: l0_network
    status: not_measured
    note: Reverse-cascade network effects have not been queried against Censored Planet / OONI and are plausibly sparse; no measurement artifact is attached so the layer is explicitly unmeasured
  - layer: l1_consensus
    status: measured
    chain: ethereum
    note: |
      Wahrstätter relay_censorship_share.csv slice [2025-03-07, 2025-04-04]
      attached as observation below. Pre-event 14d mean censoring-relay share
      48.89% ± 1.21; event-day (2025-03-21) 46.87%; post-event 14d mean
      23.30% ± 23.87 — a sharp ≈25 percentage-point drop with high variance
      indicating the relay ecosystem began unwinding Tornado Cash filtering
      within days of the OFAC delisting. Paper-worthy observed_change with
      direct attribution (the Wahrstätter classifier is defined against the
      Tornado Cash SDN-listed addresses themselves, so a post-delisting drop
      in that classifier is structurally tied to the delisting event).
  - layer: l3_rpc
    status: partially_measured
    provider_scope: public_only
    note: |
      L3 RPC-layer public-provider filter-list pin: the two dominant
      OFAC-compliance-adjacent public Ethereum RPC providers are MEV-Blocker
      (mevblocker.io) and Flashbots Protect (docs.flashbots.net). Both
      captured 2026-04-22 as ecosystem-level primary_corporate anchors for
      L3-layer reasoning:
        mevblocker.io landing: body_hash sha256:f580083a67f052d2d8301dc1975c6f1f369474d25a10f0587ef081f70379cc67
        docs.flashbots.net/flashbots-protect/quick-start: body_hash sha256:b937ed96974815d638d2db412ad674d417ae71f0295f625c8cec839638307282
      Status remains not_measured because per-event bracketing snapshots
      of the provider filter lists (pre-event / event-day / post-event) are
      not yet pinned from the Wayback CDX. The anchors establish the
      measurement substrate; per-event slices would promote status to
      partially_measured.
  - layer: l4_frontend
    status: partially_measured
    scope:
      - tornado.cash
      - community UIs
      - github.com/tornadocash
  - layer: asset_onchain
    status: measured
    chain: ethereum
    note: At least one target address now has concrete USDC unblacklist evidence after the delisting, but coverage remains incomplete across the full historical address set
  - layer: offramp_cex
    status: not_measured
    note: |
      Chain-analytics anchors pinned 2026-04-22 as primary_corporate
      substrate for per-event offramp_cex reasoning (Chainalysis, TRM,
