recovery:
  - layer: l3_rpc
    resolved: false
    note: RPC rollback remains unconfirmed at release-review quality
  - layer: asset_onchain
    resolved: true
    note: At least one target address shows an issuer-side USDC unblacklist after the delisting, but this is not yet generalized to the full historical target set

analysis_notes: |
  Reverse-cascade pilot with direct operator attribution on two of six
  layers. The trigger is the 2025-03-21 OFAC delisting. At the asset layer,
  a concrete on-chain USDC unblacklist transaction for one target address
  lands on 2025-03-22 (primary_onchain, direct). At the frontend layer, the
  2025-03-25 operator commit 2437ecc426 on the maintained classic-ui Gitea
  repo explicitly undoes the sanctions-era frontend freeze: the block
  comment "Instances frozen due to sanctions" is removed from
  networkConfig.js, restoring USDC pool configuration, and the sanctions-era
  backup domain 2.torndao.eth.limo is swapped out for tornadocash.eth.limo
  across the UI head, gateway whitelist, and six localized compliance
  warnings. The removed comment is a first-party operator acknowledgement
  that the prior code state was a sanctions response; this upgrades L4
  attribution from plausible to direct. Official Tornado Cash docs
  current-state capture bundle confirms that the UI remains reachable. L0 and
  off-ramp rollback remain in coverage rather than observations. The event
  stays a cascade by layer count (three changed layers), while only some layers
  have direct attribution.

scoped_claim: |
  "OFAC delisting of Tornado Cash on 2025-03-21 (Van Loon-litigation driven)
  is the first reverse-cascade event in the dataset, producing observed_change
  on 3 layers: L1 consensus censoring-relay share dropped ≈25pp within 14
  days; Circle USDC unblacklisted at least one historical address; and L4
  frontend access/listing partially reemerged via maintained UI paths while
  canonical-domain restoration remained incomplete. Establishes structural
  asymmetry between cascade and reverse-cascade shapes: rollback is slower and
  patchier than the original cascade."

scoped_knowledge: |
  What changed: the delisting produced three retained changed layers: an
  operator-authored classic-ui rollback commit, at least one Circle USDC
  unblacklist transaction, and a post-delisting drop in Tornado-filtering
  relay share.

  What did not change or could not be measured: L0 is not measured and
  off-ramp rollback is not measured. L3 has public-provider substrate evidence
  but no event-specific rollback receipt, so it remains an observed-no-change /
  no-step-change row rather than a recovery claim.

  Attribution: the frontend and asset rows are direct because the frontend diff
  and on-chain unblacklist are primary artifacts. The L1 consensus row remains
  plausible because it is based on measurement data keyed to the Tornado address
  set without a primary relay-operator policy statement.

  Comparative value: this is the only reverse-cascade anchor. It should be
  reported as n=1 and used to show asymmetry: removal from a sanctions list did
  not simply replay the 2022 cascade in reverse.

