  comparison documenting the UK FCA Financial Promotions Regime for
  cryptoassets (Policy Statement PS23/6 + Finalised Guidance FG23/3)
  effective 2023-10-08. The regime requires all cryptoasset firms
  marketing to UK consumers (UK-domiciled and overseas) to communicate
  financial promotions via one of four legal routes; non-compliant
  promotions are a criminal offence under FSMA section 21. This is
  administrative enforcement (per codebook §5.1 `regulatory_enforcement`,
  non-US national regulator administrative enforcement), distinct
  from `nation_state_block` (L0/payment-rail) and from
  `corporate_policy_change` (the operator-side responses are coded as
  observations under this trigger, not as separate corporate-policy
  events).

  Per §5.2 stratum-actor map, trigger.type=regulatory_enforcement maps
  to research_stratum=S4_nation_state. The UK FCA is a non-US national
  regulator and the action is administrative, not network-level — this
  matches the new 2026-05-17 §5.1 row exactly.

  Attribution coding (per §1.4 frontend-block and the offramp_cex
  analog):
    - Bybit offramp_cex: Bybit's operator announcement publicly cites
      the FCA financial-promotions regime as the reason for the UK
      retail restriction; restriction announced 2023-10-02 and
      effective 2023-10-08 — both conditions satisfied →
      attribution=direct.
    - KuCoin offramp_cex: KuCoin's operator announcement publicly
      cites the FCA regime; restriction announced in early October
      2023 within the compliance window → attribution=direct.
    - L4 frontend banners: timing and per-domain implementation are
      operator-driven without a per-domain regulator citation →
      attribution=plausible (more conservative per §8.4).

  empirical_shape=comparison (2 distinct observed_change layers:
  offramp_cex and l4_frontend); admission_tier=empirical_case (≥1
  strong-attribution observed_change layer; offramp_cex carries two
  direct-attribution rows for Bybit and KuCoin respectively).

  Related-events cross-references:
    - uk-fca-binance-markets-2021 — earlier UK FCA action against
      single entity (BML), cascading via UK retail banking rails.
      This 2023 event is the class-wide successor: a marketing-rule
      regime affecting an entire class of crypto firms rather than
      one named entity.
    - kraken-uk-derivatives-exit-2021 — single-firm UK exit precedent
      driven by an earlier FCA action (crypto derivatives ban for
      retail consumers, effective 2021-01-06).
    - pump-fun-uk-fca-geofence-2024-12 — downstream successor in the
      same FCA-driven UK-retail-restriction lineage; the 2023
      promotions regime is the regulatory infrastructure that makes
      the 2024 Pump.fun unauthorised-firm warning possible.

