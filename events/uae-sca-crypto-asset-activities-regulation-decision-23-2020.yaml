analysis_notes: |
  **QUALITY-LOOP REPAIR 2026-06-01**. Added a replayable official SCA
  2020-track-record capture as the primary_government trigger anchor.
  The page explicitly records approval of crypto asset regulations under
  the SCA Board Chairman's Decision No. 23 of 2020 and describes
  licensing of crypto-asset activities including exchanges,
  crowdfunding platforms, and securities custodians. The SCA-hosted
  Decision 23 PDF URL discovered by search drifted to an empty
  500/page-not-found body in this network path and was discarded rather
  than attached. The row remains a null_event; no specific VASP
  delisting or frontend/off-ramp cascade is claimed.

  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: refined the wave-2
  VERIFY-FLAG by rendering+grepping the captured source. All specifics (SCA/Decision-23/2020/licensing/custody) present in the captured 96kb source; the row already disclaims any specific delisting cascade. Sources meet the admission floor.).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission).

  null_event documenting the UAE Securities and Commodities Authority (SCA) Decision
  No. 23/RM of 2020 Concerning Crypto Assets Activities Regulation (dated 01 November
  2020, published December 2020), which established a federal onshore licensing/
  approval regime over crypto-asset offering, issuance, listing, trading, and
  custody in the UAE outside the financial free zones (ADGM/DIFC). §9 scope: a
  state-issued licensing instrument that restricts unlicensed crypto activity — IN
  scope as a censorship-enabling licensing perimeter (the same inclusion basis as
  the admitted uae-vara-licence-issuance-regime-2023 row).

  Coded null_event / null_case because, like the VARA precedent, the issuance
  establishes the licensing perimeter but does not at issuance produce an observable
  onshore-UAE VASP delisting, exclusion, or freeze cascade — it is enabling-with-
  licensing rather than an immediate observable restriction. observed_no_change /
  attribution=none on the offramp_cex layer.

  trigger.type=regulatory_enforcement per codebook §5.1 (non-US national regulator
  administrative framework issuance). Stratum-actor map §5.2 maps
  regulatory_enforcement → S4_nation_state. This is the FEDERAL UAE SCA instrument,
  distinct from (a) the Dubai-emirate VARA regime (uae-vara-licence-issuance-regime-
  2023, sub-sovereign) and (b) the DIFC/DFSA and ADGM/FSRA free-zone frameworks.
  Decision 23/2020 was later superseded by SCA Decisions 26/RM and 27/RM of 2023 and
  Federal Cabinet Decision 111/2022 (downstream events, outside this window).

  Source-strength caveat: the full SCA Decision 23/RM/2020 PDF remains a desirable
  primary_legal artifact, but the current claim no longer rests only on law-firm
  explainers. The captured official SCA page is a replayable primary_government
  source for the decision's existence and crypto-asset licensing scope; Charles
  Russell and Galadari remain corroborating semi-primary explainers. A live SCA PDF
  URL drifted to a blank 500/page-not-found response on 2026-06-01 and was not used.

scoped_claim: |
  "The UAE SCA issued Decision No. 23/RM of 2020 (dated 01 November 2020) Concerning
  Crypto Assets Activities Regulation, establishing a federal onshore licensing/
  approval perimeter over crypto-asset offering, issuance, listing, trading, and
  custody in the UAE outside the financial free zones. The row does not claim any
  specific onshore-UAE VASP delisting cascade, on-chain freeze, or frontend takedown
  at issuance; it documents the federal licensing-framework trigger as a null_event,
  distinct from the Dubai-emirate VARA regime and the free-zone frameworks."

