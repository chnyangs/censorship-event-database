analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). In October 2023 Circle added
  three Ethereum addresses linked to the July-2023 Multichain bridge exploit to
  the USDC contract blacklist (~$63-65M USDC, addresses 0x027F1 / 0xefEeF /
  0x48BeA per the captured sources), at the direction of a U.S. Department of
  Justice seizure warrant; after the DOJ could not identify the hackers, an SDNY
  bankruptcy court (Judge David S. Jones) ordered Circle to maintain the
  blacklist for the Multichain liquidators. SCOPE (§9): the Multichain hack
  itself is an EXCLUDED platform failure, but Circle's deliberate issuer freeze
  of the stolen-proceeds USDC at LE/court direction IS a censorship action in
  scope (issuer asset freeze at LE/sanction request — the Circle/Tether
  pattern). comparison shape, single asset_onchain observed_change,
  attribution=plausible (the blacklist is directly reported and the DOJ-warrant
  trigger is sourced, but the captured anchors are trade press, not a Circle
  primary blacklist notice, and no on-chain tx is pinned). §1.6 FLOOR DEFERRED:
  a real USDC blacklist() tx_hash is required for an admitted asset_onchain
  observed_change; none is captured here (sources give only address prefixes +
  amounts), and per anti-fabrication NO tx_hash is invented — so the event stays
  draft and is intentionally un-promotable until the real blacklist tx is pinned
  (cf. circle-usdc-cryptex-freeze-2024, which DOES carry a verified
  primary_onchain freeze tx). Sources verified via WebSearch 2026-05-31; The
  Block (238459 + 377094) + BeInCrypto captured + body_hash pinned; grep of the
  captured bodies confirms "$63 million in USDC frozen by Circle following
  Multichain breach", "blacklisted three wallet addresses", "0x027F1, 0xefEeF,
  and 0x48BeA", "U.S. Department of Justice obtained a seizure warrant and
  compelled Circle to freeze the addresses", "Judge David S. Jones" (no
  fabrication).

