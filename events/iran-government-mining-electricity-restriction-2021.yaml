analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17 — Wave 2.3 P2 preamble**

  Agent draft of the Iranian government's 2021-05-26 four-month ban on
  all cryptocurrency mining operations, enforced by Tavanir (Iran Power
  Generation, Distribution and Transmission Company) and the Ministry
  of Energy. The ban applied to both the 50 Tavanir-licensed mining
  farms (which collectively drew approximately 209 MW) and unlicensed
  operations, with the licensed-farm halt being the formal regulatory
  action and unlicensed-farm raids the parallel enforcement campaign.

  Coded per codebook §5.1 as `trigger.type: regulatory_enforcement`
  (non-US national regulator administrative enforcement; Tavanir is a
  state-owned utility issuing operational halt orders under the
  Ministry of Energy's authority rather than a domain/payment-rail
  block or sanctions designation). Per §5.2 this maps to
  `S4_nation_state`.

  empirical_shape `comparison` reflects a single observed_change layer
  (l1_consensus mining-side hashrate withdrawal). This is a comparison-
  shape sibling of the china-sichuan-mining-ban-2021-06 event (Sichuan's
  2021-06 hydropower-province mining ban followed roughly two weeks
  after Iran's order, and both targeted licensed mining operations as a
  utility-coordinated halt). Together they bracket the summer-2021
  global Bitcoin hashrate redistribution wave. The
  kazakhstan-internet-shutdown-mining-2022-01 event is a downstream
  sibling on the same mining-jurisdiction-restriction theme but operates
  via L0 connectivity rather than utility halt.

  admission_tier `empirical_case` per codebook §4 (>=1 strong-attribution
  observed_change layer). attribution coded `direct` because the
  Iranian government / Tavanir publicly references the action and names
  the licensed-mining-farm class as the target population (codebook
  §1.5 boundary for nation-state administrative orders citing the
  regulated class). The L1 measurement is mining-side hashrate
  withdrawal — not validator/miner censorship of specific transactions
  or blocks — but the layer assignment follows the corpus convention
  for hashrate-redistribution events under the mining-restriction
  family.

  All current citations are `evidence_use: contextual_unarchived`
  (CNBC, Al Jazeera, Fortune secondary journalism; CCAF tracker page)
  with DRYRUN wayback stubs; body_hash + body_path captures of the
  primary Tavanir order text (Persian) and CCAF mining-map snapshot are
  pending human-review audit. Per repo convention, contextual_unarchived
  sources cannot support paper claims until promoted to admission_anchor
  with body_hash + body_path.

