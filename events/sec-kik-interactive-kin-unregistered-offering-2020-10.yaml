analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: read the event +
  the captured SEC primary source confirming the unregistered-exchange/offering charge and the
  platform-restriction effect; §9 enforcement-censorship; clean per wave-2 verify; validate.py [OK]).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission). S3 SEC securities-
  enforcement event, comparable_main tier. The 2020-10-21 SDNY final
  judgment on consent in SEC v. Kik Interactive Inc. (No. 19-cv-5244)
  resolved the SEC's June 2019 charge that Kik's 2017 ~$100M Kin token
  offering was an unregistered securities offering: §5 injunction, $5M
  civil penalty, and a 3-year prior-notice obligation on future Kin/new-
  digital-asset distributions. comparison shape: 1 observed_change layer
  (offramp_cex, issuer-conduct restriction), attribution=direct per
  codebook §1.4/§1.2 reasoning by analogy to the issuer-cancellation
  precedent in sec-v-telegram-ton-2020 (the issuer restriction is the
  direct legal effect of the federal-court judgment, which names the
  issuer and the asset). asset_onchain is not_applicable per §1.6: the
  remedy is an issuer-level injunction/penalty, not an on-chain
  freeze/blacklist of any Kin contract — no primary_onchain tx_hash
  exists or can exist for this mechanism, so the effect is routed to
  offramp_cex. L0/L1/L3/L4 not_applicable (securities remedy did not
  touch network reachability, consensus, RPC, or the public frontend).
  §9 in scope: a state enforcement action restricting a legitimate
  token issuer's ability to offer/transfer the asset (not a scam
  prosecution — Kin was a functioning consumer token, and the charge was
  registration-failure, not fraud). Sources verified via WebSearch
  2026-05-31; real SEC press release 2020-262 captured + body_hash-
  pinned and grep-confirmed (no fabrication). Awaiting human audit before
  promotion from draft.

scoped_claim: |
  "The 2020-10-21 SDNY final judgment on consent in SEC v. Kik
  Interactive Inc. is recorded as a single-layer offramp_cex issuer-
  conduct restriction: a §5 injunction, $5M civil penalty, and 3-year
  prior-notice obligation on Kin / new-digital-asset offerings,
  attribution=direct. The row does not claim ISP-level blocking, a
  frontend takedown, or an on-chain Kin freeze (no such on-chain
  receipt exists)."

