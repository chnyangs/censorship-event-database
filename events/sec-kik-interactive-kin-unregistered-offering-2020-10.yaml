coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The SEC civil action and SDNY final judgment are securities-law
      remedies against the Kik corporate issuer; they did not alter
      ISP-level reachability of kin.org or kik.com. not_applicable on the
      L0 network-reachability layer.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Kin migrated across ledgers (ERC-20, then Stellar, then its own
      chain), but the L1 layer this dataset measures (post-Merge Ethereum
      PBS relay surface / validator-set filtering) has no Kin-specific
      consensus surface engaged by a securities-law injunction.
      not_applicable.
  - layer: l3_rpc
    status: not_applicable
    note: |
      No hosted RPC-provider surface is engaged by the final judgment.
      not_applicable.
  - layer: l4_frontend
    status: not_applicable
    note: |
      The final judgment did not require shutdown of kin.org or kik.com;
      it operates at the token-issuance / issuer-conduct layer (injunction
      + penalty + prior-notice obligation), not the public-web frontend.
      not_applicable.
  - layer: asset_onchain
    status: not_applicable
    note: |
      The §1.6 asset_onchain evidence floor requires a primary_onchain
      tx_hash; the SEC remedy is an issuer-level injunction and penalty,
      not an on-chain freeze/blacklist of any Kin contract address, so no
      on-chain receipt exists or can exist for this mechanism. Per §1.6
      routing, the enforceable effect is carried at offramp_cex (the
      issuer-conduct restriction on future Kin offerings/transfers).
      not_applicable on the asset_onchain layer.
  - layer: offramp_cex
    status: measured
    scope:
      - kin_token_offering
      - kik_interactive_issuer_conduct
    note: |
      Load-bearing layer. The 2020-10-21 final judgment on consent is the
      operator/issuer-state-change endpoint: Kik is permanently enjoined
      from unregistered Kin offerings, must pay a $5M penalty, and for
      three years must give the Commission prior notice before any
      issuance/offer/sale/transfer of Kin or any new digital asset. This
      is the closest analogue this dataset has to an issuer/offramp
      restriction when the restriction acts on the issuer's ability to
      distribute the asset. Attached below as observed_change /
      attribution=direct (the issuer restriction is the direct legal
      effect of the SDNY judgment).

