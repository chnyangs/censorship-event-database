trigger:
  type: nation_state_block
  actor: CN_STATE_COUNCIL
  timestamp: 2021-05-21T00:00:00Z
  timestamp_precision: day
  citation:
    - type: primary_legal
      url: http://www.gov.cn/guowuyuan/2021-05/21/content_5610192.htm
      wayback: https://web.archive.org/web/2021/http://www.gov.cn/guowuyuan/2021-05/21/content_5610192.htm
      evidence_use: contextual_unarchived
      note: |
        State Council Financial Stability and Development Committee
        (国务院金融稳定发展委员会, FSDC) 51st meeting, chaired by Vice
        Premier Liu He (member of the Politburo, Director of the
        Committee), held 2021-05-21. The published readout includes the
        load-bearing sentence "打击比特币挖矿和交易行为，坚决防范个人风险向社会
        领域传递" ("crack down on bitcoin mining and trading behavior;
        resolutely prevent the transmission of individual risks to the
        social sector"). This is the highest-ranking PRC organ to
        explicitly name bitcoin mining as a target and is the immediate
        precursor to the province-level mining-ban cascade (Inner
        Mongolia 2021-05-25, Qinghai 2021-06-09, Yunnan/Xinjiang/Sichuan
        2021-06). evidence_use=contextual_unarchived because no
        body_hash+body_path archival capture was pinned in this
        DRYRUN authoring pass; the gov.cn origin URL and the Xinhua
        English readout remain publicly reachable and Wayback
        bracketing of the 2021-05-21 publication window is straightforward
        in a follow-up human-audit pass.
    - type: supporting_journalism
      url: https://www.reuters.com/technology/chinese-financial-payment-bodies-barred-cryptocurrency-business-2021-05-18/
      wayback: https://web.archive.org/web/2021/https://www.reuters.com/technology/chinese-financial-payment-bodies-barred-cryptocurrency-business-2021-05-18/
      evidence_use: contextual_unarchived
      note: |
        Reuters 2021-05-21 wire coverage of the FSDC statement.
        Provides English-language journalist-attested corroboration
        of the Chinese-language readout and explicitly identifies
        Liu He as the chair and the FSDC as the issuing body.
    - type: supporting_journalism
      url: https://www.cnbc.com/2021/05/21/bitcoin-falls-after-china-calls-for-crackdown-on-bitcoin-mining-and-trading-behavior.html
      wayback: https://web.archive.org/web/2021/https://www.cnbc.com/2021/05/21/bitcoin-falls-after-china-calls-for-crackdown-on-bitcoin-mining-and-trading-behavior.html
      evidence_use: contextual_unarchived
      note: |
        CNBC 2021-05-21 contemporaneous market-reaction coverage.
        Cited for the immediate (intra-day) BTC spot price decline of
        ≥6% following circulation of the FSDC statement; supports
        plausible attribution for downstream observations.
  timestamp_sources:
    - type: primary_legal
      note: |
        Day-level precision (2021-05-21) per the gov.cn readout. The
        FSDC meeting itself was held the evening of 2021-05-21 Beijing
        time (UTC+8); the readout was published the same calendar day
        in China. Intra-day publication timestamp is not pinned in
        this DRYRUN pass; day precision is the defensible upper bound.

target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    Canonical target is the FSDC policy directive itself, naming two
    activity classes: (1) bitcoin mining ("挖矿") operating within
    PRC borders, and (2) bitcoin trading ("交易") behavior touching
    PRC residents. The named-class enumeration is a defensible
    subset rather than a complete exchange/miner roster because the
    directive does not enumerate specific firms, addresses, or
    canonical domains; the implementing province-level bans
    (Inner Mongolia 2021-05-25, Qinghai 2021-06-09, Yunnan,
    Xinjiang, Sichuan 2021-06) enumerate the actual mining sites
    they shut down, and those carry their own load-bearing
    observed_change rows in their own event files.
  entity: prc_bitcoin_mining_and_trading_crackdown_directive
  actor_type: nation_state_policy
  actor_name: "PRC State Council Financial Stability and Development Committee (FSDC) 51st meeting directive"
  chains:
    - bitcoin
  canonical_domains: []

jurisdiction:
  - CN

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      FSDC directive is a top-level policy statement, not an
      ISP-level domain-blocking instrument. The downstream PBOC
      2021-09-24 joint notice and earlier 2017 ICO ban are the
      L0-relevant PRC nation-state events. not_applicable on
      construct-out-of-scope grounds for the directive itself;
      L0 reactions, if any, would be measured against the
      province-level implementing bans rather than this readout.
  - layer: l1_consensus
    status: partially_measured
    scope:
      - bitcoin_mining_hashpower_cn
    note: |
      Mining-hashpower layer mapped to l1_consensus per the
      authoring brief (block production resource layer). The
      substantive L1 cascade is the collapse of the China share
      of global Bitcoin hashrate from ≈46% (April 2021, Cambridge
      CBECI) toward ≈0% over June-August 2021, attributable to
      this directive plus the implementing province-level bans
      rather than this directive alone. partially_measured rather
      than measured because the Cambridge CBECI tracker is cited
      via contextual_unarchived URL only in this DRYRUN pass;
      body_hash+body_path of the 2021-04 vs 2021-09 country-share
      JSON is deferred to human-audit. The corresponding
      observation row is recorded with attribution=plausible.
  - layer: l3_rpc
    status: not_applicable
    note: |
      Pre-Merge event (Ethereum Merge 2022-09-15). The MEV-Boost /
      Flashbots Protect / MEV-Blocker public-RPC compliance
      substrate that the L3 layer measures did not exist in
      2021-05. not_applicable on construct-did-not-exist grounds.
  - layer: l4_frontend
    status: not_applicable
    note: |
      The directive does not name or contemplate specific
      frontend takedowns. Exchange-frontend phased withdrawals
      from mainland China occurred after the downstream PBOC
      2021-09-24 joint notice, not this readout. not_applicable
      on construct-out-of-scope grounds.
  - layer: asset_onchain
    status: not_applicable
    note: |
      Bitcoin has no stablecoin-issuer admin-key freeze
      primitive analogous to USDT/USDC issuer freezes. The
      directive does not engage on-chain asset controls.
      not_applicable on construct-out-of-scope grounds.
  - layer: offramp_cex
    status: partially_measured
    scope:
      - huobi
      - hashcow
      - btc_top
    note: |
      Trading layer per the directive's "trading behavior"
      phrasing. Mining-pool and exchange-mining-service reactions
      began immediately (Huobi suspended miner hosting services
      2021-05-23; HashCow halted machine sales to PRC clients
      2021-05-23; BTC.TOP and other pools announced PRC
      withdrawal in subsequent weeks). The directive is the
      proximate trigger but is shortly followed by province-level
      bans and the 2021-09-24 PBOC joint notice that carries
      the load-bearing CEX cessation rows in china-pboc-crypto-
      ban-2021. partially_measured because primary_corporate
      Huobi / HashCow / BTC.TOP announcement archival captures
      are not pinned in this DRYRUN pass; the corresponding
      observation row is recorded with attribution=plausible
      and contextual_unarchived journalism URLs until a human-
      audit pass attaches replayable announcement anchors.

observations:
  - layer: l1_consensus
    actor: mining_pool_class:cn_btc_hashpower
    event: cn_bitcoin_hashrate_share_collapse
    observation_kind: observed_change
    attribution: plausible
    timestamp_range:
      - 2021-05-21T00:00:00Z
      - 2021-09-30T23:59:59Z
    precision: day
    country: CN
    sources:
      - type: supporting_tracker
        url: https://ccaf.io/cbnsi/cbeci/mining_map
        wayback: https://web.archive.org/web/2021/https://ccaf.io/cbnsi/cbeci/mining_map
        evidence_use: contextual_unarchived
        scope_descriptor:
          countries:
            - CN
          time_window:
            - 2021-04-01T00:00:00Z
            - 2021-12-31T23:59:59Z
        note: |
          Cambridge Centre for Alternative Finance (CCAF) Bitcoin
          Mining Map. CN share of global Bitcoin hashrate
          declined from ≈46% (April 2021) to ≈0% (July-August
          2021), per the geographically-attributed hashrate
          dataset CCAF publishes from pool-level IP geolocation.
          attribution=plausible because the FSDC directive plus
          the implementing province-level bans (Inner Mongolia
          2021-05-25, Qinghai 2021-06-09, Sichuan 2021-06) are
          the joint proximate cause; the directive alone does
          not have direct on-chain hashrate-attribution evidence
          and the cascade is shared across the related_events
          siblings. evidence_use=contextual_unarchived because
          CCAF country-share JSON body_hash is not pinned in
          this DRYRUN pass.
      - type: supporting_journalism
        url: https://www.scmp.com/tech/policy/article/3141231/china-widens-crackdown-cryptocurrency-miners-shrinking-countrys-share
        wayback: https://web.archive.org/web/2021/https://www.scmp.com/tech/policy/article/3141231/china-widens-crackdown-cryptocurrency-miners-shrinking-countrys-share
        evidence_use: contextual_unarchived
        note: |
          South China Morning Post coverage documenting the
          China share-of-global-hashrate decline through 2021,
          providing journalist-attested corroboration for the
          CCAF tracker series. Cited for narrative anchoring
          only; the load-bearing measurement is the CCAF
          tracker above.
    note: |
      L1-consensus observation maps the "mining_hashpower" hint
      from the authoring brief onto the l1_consensus layer
      (block production resource layer). attribution=plausible
      rather than direct because the cascade is jointly produced
      by this directive plus the related_events sibling bans;
      single-event direct attribution would over-claim. The
      load-bearing observed_change rows for the specific
      province-level mining-site shutdowns belong to the
      sibling event files when they are authored.
  - layer: offramp_cex
    actor: exchange_class:cn_btc_mining_and_trading_services
    event: cn_mining_service_and_trading_pause_announcements
    observation_kind: observed_change
    attribution: plausible
    timestamp_range:
      - 2021-05-23T00:00:00Z
      - 2021-06-30T23:59:59Z
    precision: day
    country: CN
    sources:
      - type: supporting_journalism
        url: https://www.aljazeera.com/economy/2021/5/24/china-crackdown-forces-crypto-mining-operators-to-end-operations
        wayback: https://web.archive.org/web/2021/https://www.aljazeera.com/economy/2021/5/24/china-crackdown-forces-crypto-mining-operators-to-end-operations
        evidence_use: contextual_unarchived
        scope_descriptor:
          countries:
            - CN
          providers:
            - huobi
            - hashcow
            - btc.top
          time_window:
            - 2021-05-21T00:00:00Z
            - 2021-06-30T23:59:59Z
        note: |
          Al Jazeera contemporaneous coverage (2021-05-24)
          documenting that within 48-72 hours of the FSDC
          statement: (a) Huobi suspended miner hosting services
          and Bitcoin futures/leverage trading for new mainland
          PRC accounts, (b) HashCow halted mining-machine sales
          to PRC clients, and (c) BTC.TOP founder Jiang Zhuoer
          announced PRC operations would wind down. These are
          named primary_corporate actions cited via journalism
          in this DRYRUN pass; replayable announcement anchors
          (body_hash + Wayback) are deferred to human-audit.
      - type: supporting_journalism
        url: https://www.cnbc.com/2021/05/21/bitcoin-falls-after-china-calls-for-crackdown-on-bitcoin-mining-and-trading-behavior.html
        wayback: https://web.archive.org/web/2021/https://www.cnbc.com/2021/05/21/bitcoin-falls-after-china-calls-for-crackdown-on-bitcoin-mining-and-trading-behavior.html
        evidence_use: contextual_unarchived
        note: |
          CNBC 2021-05-21 market-reaction coverage; cited again
          here at observation level for the intra-day BTC spot
          price decline that followed circulation of the
          statement.
    note: |
      Offramp-CEX observation captures the "trading behavior"
      half of the directive: Huobi (mining services + leverage
      trading), HashCow (mining-machine sales), BTC.TOP
      (mining pool) announcements within 2-9 days of the
      readout. attribution=plausible rather than direct because
      replayable primary_corporate announcement anchors are not
      yet pinned; the load-bearing direct-attribution rows for
      PRC offramp shutdown live in china-pboc-crypto-ban-2021
      (2021-09-24 joint notice) where Huobi and Binance
      announcement body_hashes are already attached.

analysis_notes: |
  NEW EVENT AUTHORED — DRYRUN 2026-05-16. Phase C of the
  2026-05-16 staged-release plan, S4 nation-state precursor
  fill for the PRC 2021 mining-and-trading crackdown cascade.

  The FSDC 51st meeting readout (2021-05-21, chaired by Vice
  Premier Liu He) is the highest-ranking PRC organ to
  explicitly name bitcoin mining as a target. It is the
  immediate precursor to the province-level mining bans
  (Inner Mongolia 2021-05-25, Qinghai 2021-06-09, Yunnan,
  Xinjiang, Sichuan 2021-06) and to the 2021-09-24 PBOC joint
  notice (admitted at china-pboc-crypto-ban-2021.yaml).

  Why empirical_shape=comparison: two observed_change layers
  attached — l1_consensus (China share of global Bitcoin
  hashrate collapse from ~46% in April 2021 to ~0% by mid-
  2021, per Cambridge CBECI) and offramp_cex (Huobi / HashCow
  / BTC.TOP mining-service and trading announcements within
  2-9 days of the readout). Both rows carry attribution=
  plausible rather than direct because the cascade is jointly
  produced by this directive plus the related_events sibling
  bans, and replayable primary_* anchors (Cambridge JSON,
  exchange announcement Wayback captures) are not pinned in
  this DRYRUN pass. admission_tier=empirical_case is
  conservative on the strength of two plausible-attribution
  layers; promotion to anchor_case would require ≥2 direct-
  attribution rows backed by primary_* sources, which is
  appropriately deferred to the sibling province-level bans.

  Why l1_consensus rather than a separate mining layer: the
  schema's l1_consensus enum is the canonical block-production
  resource layer; the authoring brief explicitly mapped
  "mining_hashpower" onto l1_consensus. Bitcoin proof-of-work
  hashrate-share-by-country is the most natural observable on
  this layer for a 2021 PRC mining event.

  Layer attribution and target enumeration deliberately
  conservative: enumeration=subset (rather than complete)
  because the directive names activity classes ("mining",
  "trading") rather than firms; canonical_domains=[] because
  the directive does not list hosts.

  Evidence posture: all citations carry evidence_use=
  contextual_unarchived per the authoring brief. The gov.cn
  readout URL, Reuters / CNBC / Al Jazeera / SCMP coverage,
  and the Cambridge CBECI tracker remain publicly reachable;
  Wayback bracketing and body_hash pinning of each anchor is
  the standard human-audit follow-up that would promote this
  event from draft to human_reviewed.

  Status remains draft (origin=agent_draft) per the agent-
  authoring convention. Promotion path: (1) pin gov.cn readout
  body_hash + Wayback, (2) pin Cambridge CBECI country-share
  JSON body_hash for 2021-04 and 2021-09 brackets, (3) pin
  Huobi / HashCow / BTC.TOP primary_corporate announcement
  body_hashes from 2021-05-23 to 2021-05-26, (4) consider
  promoting l1_consensus attribution to direct on the basis
  of CCAF tracker primary-measurement anchor, (5) human
  reviewer sign-off → origin=human_reviewed, status=admitted.

scoped_claim: |
  Within hours-to-days of the PRC State Council Financial
  Stability and Development Committee's 2021-05-21 directive
  to "crack down on bitcoin mining and trading behavior",
  China's share of global Bitcoin hashrate began a multi-
  month decline (Cambridge CBECI: ~46% April 2021 → ~0%
  July-August 2021) and named PRC-facing mining and trading
  services (Huobi miner hosting, HashCow machine sales,
  BTC.TOP pool) publicly paused operations within 48-72
  hours. Attribution is plausible rather than direct because
  the cascade is jointly produced by this directive plus the
  province-level implementing bans recorded as sibling
  related_events.

