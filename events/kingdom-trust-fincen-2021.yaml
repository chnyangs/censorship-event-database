analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17**. Conservative null_event /
  null_case coding per the authoring brief's fallback rule for
  candidates lacking concrete primary URL evidence of crypto-censorship
  cascade.

  Key uncertainty surfaced:
  1. The slug "kingdom-trust-fincen-2021" is misdated: the FinCEN
     enforcement action against The Kingdom Trust Company was
     announced 2023-04-26 (consent order published under FinCEN's
     2023-04-27 date stamp), NOT 2021. The "2021" in the slug appears
     to refer to the end of the BSA violation period (2016-02-15 to
     2021-03-15) cited in the consent order. The trigger.timestamp
     field reflects the actual enforcement event date (2023-04-26).
     A follow-up pass may want to rename this event to
     kingdom-trust-fincen-2023 for consistency with other
     enforcement-action slugs in the corpus.
  2. The FinCEN consent order's BSA violation theory addresses KTC's
     non-conventional trust services line (Latin-American foreign
     wire and payment processing), not its crypto-IRA custody
     business. KTC is publicly known as a custodian for self-directed
     IRAs that hold Bitcoin and other crypto assets (typically via
     sub-custody partners such as BitGo Trust), but the consent order
     does not engage that line of business. The crypto-censorship
     cascade theory of admission is therefore weak: the action is a
     traditional-finance BSA enforcement on an entity that happens to
     also operate a crypto-adjacent custody business.
  3. No replayable artifact (Wayback snapshot, body_hash + body_path
     local capture, on-chain transaction hash) has been captured for
     this authoring pass. All cited URLs are contextual_unarchived.
     Per codebook §8 and the authoring brief's fallback rule, this
     event is coded null_event / null_case with attribution=none in
     the single coverage_gap observation row.
  4. Codebook references applied: §1.1 (attribution=none on
     coverage_gap rows); §3 (null_event = 0 observed_change layers,
     admission would require observed_no_change with admission-grade
     sources, which are not captured here); §4 (null_case = 0
     strong-attribution observed_change layers); §5.1 (trigger.type
     = fincen_action; actor = US_FINCEN); §5.2 (fincen_action permits
     research_stratum = S3_doj_sec_cftc_fiod); §6 (temporal_tier
     comparable_main_2017_present pairs with analysis_use
     comparable_analysis); §7 (target.enumeration = subset because
     the unfiled-SAR transactions and customer set are not
     enumerated in the consent order).

  Why null_event rather than rejected: the underlying FinCEN
  enforcement action is a real, verifiable event with primary-legal
  citations (FinCEN press release + consent order PDF), and is the
  first FinCEN enforcement against a trust company — a structural
  precedent for the FinCEN-as-trust-company-regulator posture that
  may matter for future crypto-IRA / digital-asset trust company
  enforcement. The event is retained as a null_case denominator row
  for stratum-S3 enforcement-density analysis rather than rejected
  outright. A human reviewer may upgrade or reject after primary
  source pinning.

scoped_claim: |
  FinCEN's 2023-04-26 $1.5 million civil money penalty against The
  Kingdom Trust Company is a BSA / AML enforcement action targeting
  the entity's non-conventional trust-services line (Latin-American
  international wire and payment processing) and does not, on the
  public record captured in this authoring pass, engage KTC's
  crypto-IRA custody business or produce a strong-attribution
  crypto-censorship cascade observation. Coded as null_event /
  null_case pending primary-source pinning and any captured
  downstream crypto-offramp effect.

