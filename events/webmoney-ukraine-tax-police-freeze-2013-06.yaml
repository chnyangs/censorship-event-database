  Comparison documenting the 2013-06 Ukrainian tax-authority (Ministry of
  Incomes and Fees) freeze of ~UAH 60M (~$7.5M) across WebMoney's Ukrainian
  guarantor company bank accounts plus seizure of the system's operating
  computer equipment, after a Kiev office search that the ministry said
  revealed violations including failure to coordinate with the National Bank
  of Ukraine. Single load-bearing observed_change at offramp_cex (the seizure
  + freeze severing WebMoney's Ukrainian fiat settlement rails). The frozen
  accounts were reopened and funds returned in March 2014 per later reporting
  (recovery not coded as a separate row in this DRYRUN draft).

  §9 inclusion: IN scope — a deliberate state seizure/freeze action against a
  legitimate, operating digital-currency/e-money settlement system (WebMoney
  Transfer, operating since 1998), not a platform failure and not a Ponzi/
  scam prosecution. Sits in the pre-Bitcoin / early digital-currency
  enforcement lineage alongside Liberty Reserve (SUGEF 2011) and e-gold (DOJ
  2007-2008); hence related_events:[liberty-reserve-costa-rica-license-denial-2011-03].

