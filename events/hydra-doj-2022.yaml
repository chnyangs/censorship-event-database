analysis_notes: |
  comparison documenting the 2022-04-05 DOJ/BKA takedown of Hydra darknet
  marketplace — the international criminal-enforcement companion to the same-day OFAC
  Garantex + Hydra SDN designations. Pairs with hydra-ofac-2022 for multi-agency event
  analysis. This event's key structural distinction: the target is a Tor-hosted service,
  so L4 measurement via public-web Wayback is structurally limited.

scoped_claim: |
  "DOJ/BKA takedown of Hydra Market on 2022-04-05 (same day as OFAC SDN designation) was
  a direct infrastructure seizure of the Tor-hosted darknet marketplace. Illustrates
  multi-agency same-day coordination pattern (cf. Samourai 2024, Cryptex 2024)."

