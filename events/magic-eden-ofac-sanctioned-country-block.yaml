  Inclusion rationale: this is a crypto-specific marketplace/frontend access
  restriction, not a generic sanctions compliance policy. Magic Eden is an NFT
  marketplace and the official help-center page states that its services are
  prohibited in certain countries due to OFAC sanctions obligations. The
  observed layer is `l4_frontend`; no chain-level NFT transfer restriction,
  issuer-side blacklist, or CEX off-ramp action is claimed.

  Effective-date caveat: the 2023-09-29 timestamp is the earliest successful
  Wayback memento found for the restricted-access help article during this
  review. It is a lower-bound on public documentation, not proof of first
  implementation. A human admission pass should either accept this as a
  first-observed date or pin a stronger historical announcement / changelog.

scoped_claim: |
  By at least the 2023-09-29 Wayback memento, Magic Eden's official help-center
  documentation stated that Magic Eden services were prohibited in certain
  countries due to existing regulations and OFAC sanctions obligations. This
  draft models the policy as a single-layer l4_frontend marketplace access
  restriction; no on-chain NFT or token transfer effect is claimed.

