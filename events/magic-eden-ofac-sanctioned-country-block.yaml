analysis_notes: |
  **NEW EVENT AUTHORED -- AGENT_DRAFT 2026-06-01**. Created from the P4
  census-gap exact queue. The event remains `status=draft` and
  `origin=agent_draft`; automation must not promote it to an admitted paper row
