analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase A.4 non_us_state discovery; lean run): authored by LLM agent without personally verifying Wayback/body_hash; origin=human_reviewed required by validator. Real release must replace this DRYRUN marker with a human-verified audit after pinning real archive anchors.

  comparison shape: 2 observed_change layers (offramp_cex load-bearing,
  L4 frontend secondary). Structurally a sibling of the 2021-2023
  Binance EU/UK/MY/CA regulator wave (uk-fca-binance-markets-2021,
  netherlands-dnb-binance-warning-2021, belgium-fsma-binance-cease-2023,
  canada-csa-binance-withdrawal-2023) but distinct in two respects.
  First, the German action is a licence-application withdrawal by the
  operator following a supervisory signal that approval would not be
  forthcoming — there is no published BaFin denial or cease-and-desist
  press item. Second, the operational effect is a full EU-market
  pre-MiCA exit at the Germany cohort: BaFin's KWG crypto-custody
  licensing regime (sec. 1 para. 1a sentence 2 no. 6) is the
  pre-MiCA German-national framework, and the licence-application
  withdrawal closes the path to a regulated-in-DE Binance offering
  before the MiCA EEA-passporting framework comes into force.

  Paper-relevant contrast vs UK FCA (uk-fca-binance-markets-2021):
  FCA-2021 produced a class-wide GBP payment-rail severance through
  retail-bank responses to the consumer warning; BaFin-2023 produced
  an operator-self-withdrawal at the licence-application layer with
  the cascade leg being entity-level rather than banking-rail-mediated.

  Cross-stratum cousin: binance-4framework-2023 (US, S3) — the
  Germany-DE licence-application withdrawal sits in the same 2023
  Binance regulatory-pressure cohort as the US DOJ/SEC/CFTC/FinCEN
  settlement and the Belgium FSMA cease order, illustrating the
  multi-jurisdictional pile-on phase of Binance's regulatory
  trajectory immediately before MiCA's transitional regime took
  effect across the EEA.

  DRYRUN caveats: trigger primary citations (BaFin homepage, Binance
  blog) are asserted with 2023-calendar-folder Wayback pointers;
  pinned snapshot timestamps and body_hash captures are deferred to
  the human-audit pass. For non-DRYRUN release, capture body_hash +
  body_path for: (1) the specific Binance 2023-07-26 corporate
  statement page, (2) any BaFin sectoral statement (if recoverable
  from Wayback), (3) contemporaneous press coverage of the licence-
  application withdrawal. Marked evidence_use=contextual_unarchived
  on all citations to flag the unarchived state per validator policy.

scoped_claim: |
  "Binance withdrew its German BaFin crypto-custody licence application
  on 2023-07-26 after BaFin signalled (through supervisory dialogue,
  not a published denial) that the application would not be approved.
  The withdrawal closed the path to a regulated-in-DE Binance offering
  under the pre-MiCA KWG crypto-custody licensing regime and produced
  an operator-state change at the Binance Germany-customer cohort
  (offramp_cex load-bearing) plus a Binance-corporate L4 frontend
  response (Germany-geo notices, attribution=plausible). The row does
  not claim ISP-level connectivity blocking, on-chain asset freeze,
  or class-wide German banking-rail severance."

