        Day-level timing per the Binance public statement dated 2023-07-26
        announcing withdrawal of the German crypto-custody licence
        application. BaFin itself did not publish a same-day press item;
        the withdrawal is recorded on the Binance side as the public
        marker of the supervisory outcome.

target:
