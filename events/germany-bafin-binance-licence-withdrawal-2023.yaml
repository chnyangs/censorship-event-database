analysis_notes: |
  Source-repaired on 2026-06-01. This row is now explicitly lower-tier
  (`evidence_tier=attested_secondary`): no public BaFin notice naming
  Binance was found, and no replayable Binance first-party page is pinned.
  The retained observation is the contemporaneously reported Binance
  licence-application withdrawal, supported by BaFin primary legal context
  for the crypto-custody authorisation regime.

  comparison shape: 1 observed_change layer (offramp_cex / licensing-path
  state). Structurally a sibling of the 2021-2023
  Binance EU/UK/MY/CA regulator wave (uk-fca-binance-markets-2021,
  netherlands-dnb-binance-warning-2021, belgium-fsma-binance-cease-2023,
  canada-csa-binance-withdrawal-2023) but distinct in two respects.
  First, the German action is a licence-application withdrawal by the
  operator following a supervisory signal that approval would not be
  forthcoming — there is no published BaFin denial or cease-and-desist
  press item. Second, the operational effect is a full EU-market
  pre-MiCA exit at the Germany cohort: BaFin's KWG crypto-custody
  licensing regime (sec. 1 para. 1a sentence 2 no. 6) is the
  pre-MiCA German-national framework, and the licence-application
  withdrawal closes the path to a regulated-in-DE Binance offering before
  the MiCA EEA-passporting framework comes into force.

  Paper-relevant contrast vs UK FCA (uk-fca-binance-markets-2021):
  after repair, the UK row is anchored on an FCA-published supervisory
  notice and required customer-facing compliance, while the Germany row is
  lower-tier because the Binance-withdrawal fact is public only through
  contemporaneous reported spokesperson statements.

  Cross-stratum cousin: binance-4framework-2023 (US, S3) — the
  Germany-DE licence-application withdrawal sits in the same 2023
  Binance regulatory-pressure cohort as the US DOJ/SEC/CFTC/FinCEN
  settlement and the Belgium FSMA cease order, illustrating the
  multi-jurisdictional pile-on phase of Binance's regulatory
  trajectory immediately before MiCA's transitional regime took
  effect across the EEA.

scoped_claim: |
  "Binance's German BaFin crypto-custody licence application was reported
  withdrawn on 2023-07-26. The retained observation is the operator-state
  licensing-path change under Germany's pre-MiCA KWG crypto-custody
  authorisation regime. This repaired row does not claim a published BaFin
  denial, Binance.com Germany-geo frontend restriction, ISP-level block,
  on-chain asset freeze, or German banking-rail severance."

