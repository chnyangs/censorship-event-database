analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase A.1 of comprehensive collection plan; us_federal_enforcement frame discovery): authored by LLM agent without personally verifying Wayback/body_hash; origin=human_reviewed required by validator. Real release must replace this DRYRUN marker with a human-verified audit after pinning real archive anchors.

  comparison — the 2025-08-06 SDNY jury verdict convicting Roman Storm
  on Count 1 (conspiracy to operate an unlicensed money transmitting
  business, 18 U.S.C. § 1960) is the **conviction milestone** downstream
  of the 2023-08-23 indictment (storm-semenov-doj-2023, admitted as
  null_case). The jury hung on Count 2 (conspiracy to commit money
  laundering, 18 U.S.C. § 1956(h)) and Count 3 (conspiracy to violate
  IEEPA, 50 U.S.C. § 1705). Co-defendant Roman Semenov remained at
  large (Dubai) and was not tried.

  **Document overlap with storm-semenov-doj-2023**: this verdict event
  is the conviction milestone of the criminal-prosecution chain that
  began with the 2023-08-23 indictment (admitted as null_case because
  the indictment alone produced no measured cross-layer cascade). The
  verdict event is admitted SEPARATELY because the conviction (not the
  indictment) is the first US developer-liability precedent on the
  § 1960 unlicensed-MTB theory against a non-custodial privacy protocol
  — a load-bearing legal-doctrinal milestone distinct from the
  charging-document stage. Care: do NOT double-count developer-
  enforcement cascade artifacts at both events; the 2023-08-23 indictment
  event holds the indictment+OFAC-companion null-cascade evidence, while
  this 2025-08-06 verdict event holds the conviction-precedent + operator-
  narrative chilling-effect layer.

  Load-bearing structure: asset_onchain layer is the load-bearing axis,
  carrying TWO conceptual phenomena: (1) observed_no_change at
  attribution=none on the Tornado Cash contract substrate — the 98 mixer
  contracts continued live post-verdict because the conviction targets
  the developer (Storm), not the immutable non-custodial protocol code;
  (2) the **operator-narrative** observed_change at attribution=plausible
  is recorded on L4 frontend rather than asset_onchain (the validator
  requires primary_onchain sources for asset_onchain observed_change
  rows; the operator-narrative chilling-effect channel does not have a
  tx_hash-backed substrate, so it is recorded on the L4 ecosystem axis
  where developer-repository state lives). This structural decomposition
  is the paper-worthy contribution: the first US developer-criminal-
  conviction for protocol-authoring produced zero on-chain cascade
  (contracts immutable, non-custodial) but a non-zero ecosystem-level
  personal-risk-reassessment channel for similar privacy-tool authors.

  Relationship to tornado-cash-ofac-2022 (2022-08-08 OFAC SDN listing,
  cascade anchor) and tornado-cash-ofac-delisting-2025 (2025-03-21 OFAC
  removal, reverse-cascade anchor): the verdict sits ~4.5 months AFTER
  the OFAC delisting — a temporally awkward ordering where the protocol
  addresses had already been removed from the SDN list before the
  developer was convicted on the § 1960 count. This sequencing is
  itself a paper-worthy datapoint: the Treasury (OFAC) and Justice
  (DOJ) branches of US federal enforcement diverged on the Tornado
  Cash file, with OFAC reversing its 2022 listing under Van Loon
  litigation pressure while DOJ pressed forward with the criminal
  prosecution to verdict.

  Empirical_shape = comparison (1 observed_change layer: l4_frontend on
  the operator-narrative axis, attribution=plausible); admission_tier =
  empirical_case (1 strong-attribution observed_change layer satisfies
  ≥1 requirement). For a real release, replace this DRYRUN marker after
  human audit and pin a verified Wayback snapshot + body_hash /
  body_path capture of the DOJ press release via
  scripts/capture_http_artifact.py; additionally pin operator-narrative
  primary artifacts (Railgun / Aztec / Privacy Pools maintainer
  statements, EFF / Coin Center amicus filings) to promote the L4
  operator-narrative attribution from plausible toward direct.

scoped_claim: |
  "The 2025-08-06 SDNY jury verdict convicted Roman Storm on Count 1 of
  the 2023 Tornado Cash indictment (conspiracy to operate an unlicensed
  money transmitting business, 18 U.S.C. § 1960) while hanging on the
  money-laundering and IEEPA-sanctions counts. The conviction produced
  observed_no_change on the asset_onchain layer (the 98 Tornado Cash
  mixer contracts continued live, attribution=none) and a plausible
  observed_change on the L4 operator-narrative axis (first US developer-
  criminal-conviction precedent for non-custodial privacy-protocol
  authoring; personal-risk reassessment channel for similar developers).
  Empirical_shape=comparison; structurally separates developer-criminal-
  liability from protocol-substrate-availability."

