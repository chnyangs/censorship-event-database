analysis_notes: |
  comparison — first S5 corporate-frontend-delisting event in the
  dataset. Paper-relevant because it isolates the **frontend-operator /
  protocol-layer split** that underlies the Tornado Cash 2022 cascade but
  here occurs without an OFAC trigger. Uniswap Labs (the US-based frontend
  operator) can restrict tokens from its UI without the underlying Uniswap
  Protocol being affected; the restriction is observable only at L4. This
  is the purest example of L4-only corporate compliance action in the dataset.

scoped_claim: |
  "Uniswap Labs' 2023-07-21 restriction of more than 100 ERC-20 tokens from
  the app.uniswap.org frontend UI — without corresponding action at the
  Uniswap Protocol (smart-contract) layer — documents a standalone
  L4-only frontend-operator compliance action. Paper-relevant as the
  clearest example of frontend/protocol decoupling in the dataset."

