analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-4 audit (S4 comparison) by
  human:xiangwen as empirical_case. MAS media release Wayback 20220117093725
  (primary_legal) + Morgan Lewis Wayback 20220119220822 (semi_primary_wayback)
  replayable body_hash. l4_frontend observed_change/direct + offramp_cex
  observed_change/plausible. MAS 2022-01-17 Guidelines to discourage
  cryptocurrency trading by general public (no public ads/promotion of
  crypto services in SG). comparison/empirical_case preserved.

  **NEW EVENT AUTHORED — DRYRUN 2026-05-17** (agent draft authored
  by LLM authoring agent without personally verifying Wayback /
  body_hash anchors; origin=agent_draft per codebook §8 and
  schema requirement). Real release must replace this DRYRUN marker
  with a human-verified audit after pinning real archive anchors.

  Comparison documenting the 2022-01-17 Monetary Authority of
  Singapore (MAS) guidelines restricting public marketing of Digital
  Payment Token (DPT) services to the Singapore general public, plus
  the follow-on 2022-07-06 MAS consultation paper proposing further
  retail-investor restrictions (suitability test, leverage / credit
  ban, KYC + risk-disclosure enhancements). Both instruments are
  part of the same MAS retail-crypto restriction program and are
  coded under one event with day-level trigger timestamp on the
  2022-01-17 guideline release.

  Trigger.type=regulatory_enforcement (per codebook §5.1) because
  the actor is a non-US national regulator (MAS) and the action is
  administrative (a guideline + a follow-on consultation paper),
  not a network / payment-rail block. Stratum=S4_nation_state per
  the codebook §5.2 stratum-actor map (regulatory_enforcement maps
  to S4_nation_state).

  Distinct from singapore-mas-binance-services-2021 (which is the
  Binance-specific Investor Alert List action under
  trigger.type=nation_state_block) and from bybit-singapore-exit-
  2022 (which is the Bybit-specific corporate wind-down). This
  event sits upstream of the Bybit exit as one of several MAS
  regulatory pressures cited in the Bybit Singapore-exit cascade,
  and parallel-in-time to the Binance-SG cohort cascade from 2021-
  09-02.

  Load-bearing observational axes per the marketing-ban scope:
  L4 frontend (DPT public marketing takedown — direct attribution
  per codebook §1.4 because the MAS guideline names the marketing
  scope and the cohort response was within the compliance window)
  and offramp_cex (SG retail DPT onboarding friction — plausible
  attribution because per-provider onboarding-flow citations are
  not yet pinned individually).

  Target enumeration=subset with class-level rationale documented
  in enumeration_note per codebook §7 (class_level is not a valid
  enumeration value; use subset + enumeration_note).
  empirical_shape=comparison per codebook §3 (two observed_change
  layers; below the cascade threshold of three).

  DRYRUN caveats: trigger primary citation (MAS 2022-01-17 media
  release) and consultation-paper citation (MAS 2022-07-06) are
  asserted without pinned Wayback / body-hash captures. For non-
  DRYRUN release, capture body_hash + body_path for: (1) MAS
  2022-01-17 guidelines media release, (2) MAS 2022-07-06
  consultation paper, (3) at least one representative DPT-provider
  SG-geo landing page bracket spanning 2022-01-17, (4) at least
  one representative DPT-provider SG-onboarding-flow bracket
  spanning 2022-07-06 / 2022-10 final-response phase. All citations
  flagged evidence_use=contextual_unarchived per validator policy.

scoped_claim: |
  "MAS issued guidelines on 2022-01-17 prohibiting Digital Payment
  Token (DPT) service providers from marketing DPT services to the
  Singapore general public (public-area advertising, social media,
  broadcast / print media, third-party influencers, physical DPT
  ATMs), and followed with a 2022-07-06 consultation paper
  proposing retail-investor suitability assessment, leverage /
  credit restrictions, and enhanced KYC + risk-disclosure
  obligations. Load-bearing observational axes are L4 frontend
  (cohort-wide DPT public-marketing takedown, direct attribution)
  and offramp_cex (SG retail DPT onboarding friction, plausible
  attribution)."

