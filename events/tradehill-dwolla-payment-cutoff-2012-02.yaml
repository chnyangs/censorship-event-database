analysis_notes: |
  **AUTHORED 2026-05-31** (overnight census tick 3, human:xiangwen
  autonomous mandate) as a discovery_only_2007_2012 S5 event. TradeHill
  (early U.S. Bitcoin exchange) had its Dwolla fiat payment rail severed
  in early 2012, a major factor in the exchange ceasing operations;
  TradeHill sued Dwolla (2012-03). One of the earliest documented
  financial-rail de-risking / payment-processor-denial censorship cases
  against a crypto exchange (offramp_cex), predating the 2013 banking
  de-risking wave (cf. bitfloor-capital-one-debanking-2013-04,
  registered). comparison shape, single offramp_cex observed_change,
  attribution=plausible (the payment cutoff is documented; its
  characterization as regulatory-pressure-driven is the lawsuit's
  allegation rather than a direct admission of a compliance mandate).
  Sources verified via WebSearch + capture 2026-05-31 (VentureBeat +
  American Banker, both body_hash-pinned; no fabrication).
  Discovery-tier-only (analysis_use=discovery_ledger_only).

scoped_claim: |
  "Payment processor Dwolla's early-2012 severance of TradeHill's fiat
  payment rail (reversing/withholding payments and cutting off service)
  produced an offramp_cex cascade (TradeHill ceased operations); the
  row claims a single-layer offramp shutdown with attribution=plausible.
  Discovery-tier only; no comparable-analysis use."

