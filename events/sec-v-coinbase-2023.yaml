analysis_notes: |
  comparison — companion SEC civil action to SEC v. Binance
  (2023-06-05), filed one day apart. Paper-relevant paired comparison:
  despite similar securities-law exposure, outcomes diverged — Binance.US
  fiat-rails collapsed; Coinbase.com remained operational. The difference
  reflects asset-freeze-motion inclusion in the Binance filing and absence
  from the Coinbase filing, which demonstrates that SEC-level enforcement
  intensity is a gradient rather than binary.

  The 13 named tokens (SOL, ADA, MATIC, FIL, SAND, AXS, CHZ, FLOW, ICP,
  NEAR, VGX, DASH, NEXO) include Solana + Polygon + Cardano — this is the
  first mention of Solana and Polygon at event-level in the dataset
  (though as target-tokens in securities complaint rather than target-chain
  for on-chain addresses). Partially offsets the Solana/Polygon
  representation gap in `docs/chain-coverage-note.md`.

  Coinbase staking was later resumed post-Coinbase-win on partial motion
  to dismiss 2024-03-27; case continues.

scoped_claim: |
  "SEC v. Coinbase (2023-06-06) paired with SEC v. Binance (2023-06-05)
  constitutes the SEC crypto-enforcement opening. Divergent cascade
  outcomes — Coinbase.com remained operational while Binance.US fiat-rails
  collapsed — track with the asset-freeze-motion inclusion asymmetry
  between the two filings. First mention of Solana and Polygon tokens at
  enforcement-event level in the dataset."

