analysis_notes: |
  draft comparison candidate — companion SEC civil action to SEC v. Binance
  (2023-06-05), filed one day apart. Retained as a draft comparison
  candidate only. The SEC filing establishes the legal trigger and the absence
  of an asset-freeze request, but this file does not yet carry an
  admission-grade frontend/platform artifact proving Coinbase.com no-change
  over the scoped window.

  The 13 named tokens (SOL, ADA, MATIC, FIL, SAND, AXS, CHZ, FLOW, ICP,
  NEAR, VGX, DASH, NEXO) include Solana + Polygon + Cardano — this is the
  first mention of Solana and Polygon at event-level in the dataset
  (though as target-tokens in securities complaint rather than target-chain
  for on-chain addresses). Partially offsets the Solana/Polygon
  representation gap in `docs/chain-coverage-note.md`.

  Earlier drafts asserted a same-day Coinbase staking suspension. That row has
  been removed because the retained sources establish the SEC charge but not a
  platform-side state transition on 2023-06-06.

