analysis_notes: |
  comparison — companion SEC civil action to SEC v. Binance (2023-06-05),
  filed one day apart. The admitted observation is intentionally narrow:
  Coinbase retail staking saw state-scoped restrictions on staking additional
  assets / new funds in CA, NJ, SC, and WI after the SEC lawsuit and same-day
  state securities proceedings. This is not coded as a Coinbase.com frontend
  change, token delisting, fiat-rail disruption, L1/L3 effect, or on-chain
  asset freeze.

  The attribution is plausible rather than direct to the SEC alone. The SEC
  complaint named Coinbase Stake, while the platform-side service restriction
  was imposed through state notices/orders and July 2023 agreements. This event
  is therefore a denominator-aware securities-enforcement comparison row: it
  has a measured CEX/platform-service reaction and explicitly unmeasured
  frontend/off-ramp/token-listing claims outside that scope.

  The 13 named tokens (SOL, ADA, MATIC, FIL, SAND, AXS, CHZ, FLOW, ICP,
  NEAR, VGX, DASH, NEXO) include Solana + Polygon + Cardano — this is the
  first mention of Solana and Polygon at event-level in the dataset
  (though as target-tokens in securities complaint rather than target-chain
  for on-chain addresses). Partially offsets the Solana/Polygon
  representation gap in `docs/chain-coverage-note.md`.

  Earlier drafts asserted a same-day Coinbase staking suspension. The repaired
  row does not make that claim: the observed timestamp is the 2023-07-14
  Coinbase platform disclosure, and the June 6 date is retained as the legal
  trigger / state-proceeding date.

scoped_claim: |
  "SEC v. Coinbase is admitted only for a state-scoped Coinbase staking-service
  restriction; the dataset does not claim a Coinbase.com frontend takedown,
  named-token delisting, fiat-rail disruption, or on-chain effect."

scoped_knowledge: |
  What changed: Coinbase retail staking access changed in a limited US state
  scope. Customers in California, New Jersey, South Carolina, and Wisconsin
  could no longer stake additional assets / new funds while the state
  proceedings remained pending; existing staked assets were described as
  unaffected by the Coinbase platform source.

  What did not change or could not be measured: this event has no target
  address set and no issuer primitive. The named tokens in the SEC complaint
  are target tokens in a securities-law theory, not target chains for L1/L3
  measurement. No admission-grade Coinbase.com frontend diff, fiat-rail
  disruption, or token-delisting artifact is retained.

  Attribution: plausible to the SEC-centered enforcement episode, direct only
  to the state regulator notices/orders described by Coinbase and the Q2 2023
  Form 10-Q. The file therefore avoids claiming SEC-only causation.

