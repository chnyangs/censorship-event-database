analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (agent_draft per user
  instruction; status=draft because no body_hash+body_path archive
  anchors have been pinned in this session). Authored by LLM agent
  without personally verifying Wayback/body_hash; human review required
  to elevate to admitted status.

  Sibling-layer comparison event documenting the Apple App Store India
  regional storefront removal of offshore VDA exchange apps (Binance,
  OKX, Kraken, KuCoin, MEXC Global, Bitfinex, Bittrex, Bitstamp) on
  2024-01-10, following the FIU-IND 2023-12-28 show-cause notices and
  the MEITY section 69A IT Act URL blocking order. Recorded separately
  from the parent india-fiu-offshore-vda-block-2023 event because Apple
  is a corporate actor (S5_corporate) executing a downstream compliance
  decision in response to nation-state enforcement, and the App Store IN
  axis is a distinct L4 frontend enforcement vector from the Google Play
  IN sibling and from the ISP-level L0 block. trigger.type is
  corporate_policy_change with actor=APPLE; the regulatory trigger
  (india-fiu-offshore-vda-block-2023) is referenced via related_events.

  Notable scope detail: OKX was removed from Apple App Store IN even
  though OKX was not in the FIU-IND named-nine show-cause cohort,
  suggesting Apple's removal cohort was driven by a broader compliance
  judgement (e.g., FIU-IND recommended block list to MEITY) rather than
  a strict mapping to the show-cause population. This anomaly is the
  key analytic axis distinguishing the Apple sibling event from the
  parent FIU-IND event.

