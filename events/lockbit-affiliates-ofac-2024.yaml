analysis_notes: |
  comparison documenting the LockBit ransomware-affiliate individual designations
  on 2024-02-20, part of Operation Cronos international takedown. Two Russian nationals, each
  with a handful of XBT + ETH wallet addresses. Individual-level targeting; no frontend to
  measure.

  L1 shows a null, consistent with other individual-level designations in the dataset
  (Semenov 2023, LockBit 2024-02, 2024-05, etc.): aggregate relay OFAC-compliance share does
  not move on individual wallet additions.

  Follow-up directions (post-admission): (1) Etherscan query for the single ETH address for USDC/USDT freeze
  transactions; (2) CEX-layer tagging report (Chainalysis / TRM / Elliptic) for the
  LockBit-affiliate cluster.

scoped_claim: |
  "LockBit-affiliate individual OFAC designation (2024-02-20) produced no measurable step
  change in Ethereum aggregate relay OFAC-compliance share. Other layers are either
  structurally not_applicable (individuals, no frontend) or pending empirical query."

