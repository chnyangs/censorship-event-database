analysis_notes: |
  comparison documenting the first OFAC designation of a crypto exchange (SUEX
  OTC, 2021-09-21). Pre-Merge by 359 days, so L1 consensus layer is structurally
  not_applicable. The foreign-operated exchange (Russia + Czech Republic) had no US
  infrastructure dependency and the canonical suex.io domain remained fully operational for
  at least 5 days post-designation — another L4 observed_no_change case, structurally
  consistent with Sinbad 2023-11 (foreign mixer persists) but distinct from Tornado 2022
  (US-hosted frontend collapses within 22h).

  Follow-up directions (post-admission): (1) Tether freeze query on the 4 ETH USDT addresses (highest probability
  of a fresh freeze given Tether's typical behaviour toward OFAC-listed entities); (2)
  Etherscan query for USDC blacklist on the 4 ETH addresses; (3) pinned chain-analytics firm
  (Chainalysis) SUEX cluster tagging report; (4) SUEX's eventual fate — later Wayback
  snapshots or press reporting on whether the service stopped operating.

scoped_claim: |
  This draft supports the claim: "OFAC designation of SUEX OTC on 2021-09-21 — the first
  exchange-level crypto sanction — did not disrupt the canonical suex.io frontend within a
  5-day post-event window; the Russian-and-Czech-operated exchange continued to serve its
  full application. L1 consensus layer is not_applicable by construction (pre-Merge)."

