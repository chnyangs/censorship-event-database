coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The retained public claim is not an ISP/DNS/national-firewall block.
      SUEX is modeled as an OFAC exchange designation with measured
      issuer-side asset blacklist evidence and a measured suex.io L4
      observed_no_change window. A prior OONI query across suex.io for
      2021-08-21..2021-10-21 returned no public measurements, but the
      absence of OONI volunteer data is not used as a claim-bearing L0
      observation because no L0 censorship action is asserted.
  - layer: l1_consensus
    status: not_applicable
    chain: ethereum
    note: |
      Event predates The Merge (2022-09-15) by 359 days. Ethereum PBS / MEV-Boost relay
      infrastructure did not exist; L1 consensus-layer filtering of OFAC-listed addresses was
      not an observable phenomenon yet. not_applicable rather than not_measured because the
      construct itself was unavailable at event time.
  - layer: l3_rpc
    status: not_applicable
    note: |
      Pre-Merge event (Ethereum Merge 2022-09-15). The OFAC-compliance-adjacent
      public Ethereum RPC substrate (Flashbots Protect launched 2022-11,
      MEV-Blocker launched 2023-03-27) did not exist at event time. Same
      construct-did-not-exist reasoning as L1 consensus coverage for
      pre-Merge events. not_applicable rather than not_measured.
  - layer: l4_frontend
    status: measured
    scope: [suex.io]
    note: |
      Canonical suex.io verified operational at Wayback snapshots 1-5 days post-event (same
      affiliate program / sign-in / buy-crypto application as pre-event). Attached as
      observed_no_change. Foreign-operated exchange (Russia + Czech Republic) with no US
      infrastructure dependency; SUEX was not subject to US-compliance-driven takedown.
  - layer: asset_onchain
    status: measured
    chain: ethereum
    note: |
      Full scan of the 4 ETH addresses via usdtbanlist.com
      (sources/asset_layer_scan/suex-ofac-2021.json): **4/4 blocked**.
      - Circle USDC batch-blacklisted all 4 on 2021-09-23 01:44 UTC (2 days after OFAC
        designation, single-batch same-minute timestamps). First exchange case in the
        dataset where Circle responded within 48h.
      - Tether USDT retroactively froze the same 4 addresses on 2023-12-09 04:34-05:36 UTC
        (part of the broader Tether 2023-12-09 retroactive sweep alongside Chatex, Russia
        election, Russian cyber theft).
      XBT / OMNI-USDT freeze status on the 14 XBT + 7 USDT-Omni addresses not yet queried
      in the current release.
  - layer: offramp_cex
    status: not_measured
    scope: [binance, coinbase, kraken, bybit]
    note: |
      Chain-analytics anchors pinned 2026-04-22 as primary_corporate
      substrate for per-event offramp_cex reasoning (Chainalysis, TRM,
      Elliptic sanctions-coverage resource pages):
        Chainalysis: body_hash sha256:3e1256b8b50e6ac640e8bac70fc39002fb6f3b617ecfc4c5b08bab5be8e50fb7
        TRM Labs: body_hash sha256:f62bbdf351fab8b7ae5f209d1cc7930ab0432b07dc807783203d440fbf704b1a
        Elliptic: body_hash sha256:91743178595b02163d79610dbdc330922531fcbfec50476b77857a7d18e6681a
      Status remains not_measured because per-event chain-analytics report
      slices (naming specific SDN addresses / KYT flag records) are not
      yet pinned. The anchors establish the substrate; per-event slicing
      would promote status.
      SUEX was itself an OTC/exchange service; the interesting layer is counterparty CEX
      reactions to SUEX-tagged deposit clusters. Chain-analytics firms (Chainalysis in
      particular) published tagging updates, but no pinned report is attached for this event.

