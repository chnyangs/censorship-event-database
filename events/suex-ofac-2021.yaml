analysis_notes: |
  **SOURCE/COVERAGE REPAIRED 2026-06-02** (quality-loop scope repair):
  verified the existing OFAC Recent Actions, on-chain, and suex.io Wayback
  replay anchors by validation; marked the row primary-source verified; and
  narrowed L0/L3 taxonomy to the retained claim. This row measures the
  Circle USDC asset blacklist for all four listed ETH addresses and the
  same-week suex.io frontend observed_no_change window. It does not claim
  an ISP/DNS block, and the event predates the public Ethereum RPC-filtering
  substrate, so those layers are non-load-bearing for this row. Counterparty
  CEX/off-ramp reactions remain honestly not_measured until a per-event
  chain-analytics or exchange artifact is pinned.

  comparison documenting the first OFAC designation of a crypto exchange (SUEX
  OTC, 2021-09-21). Pre-Merge by 359 days, so L1 consensus layer is structurally
  not_applicable. The foreign-operated exchange (Russia + Czech Republic) had no US
  infrastructure dependency and the canonical suex.io domain remained fully operational for
  at least 5 days post-designation — an L4 observed_no_change case, structurally
  distinct from Chatex's operator-posted compliance notice and from Tornado 2022's
  US-side compliance cascade.

  Remaining follow-up directions: (1) pin a per-event chain-analytics firm
  report or exchange artifact naming SUEX-tagged deposit clusters before
  claiming counterparty CEX/off-ramp behavior; (2) if using later SUEX
  shutdown history, keep it outside this event's 5-day frontend
  observed_no_change window unless a dated operator/Wayback artifact supports
  a separate follow-on claim.

scoped_claim: |
  "OFAC designation of SUEX OTC on 2021-09-21 — the first
  exchange-level crypto sanction — produced a Circle USDC blacklist of all
  four listed ETH addresses about 50 hours later, but did not disrupt the
  canonical suex.io frontend within a 5-day post-event window; the
  Russian-and-Czech-operated exchange continued to serve its full
  application. L1/L3 are not applicable by construction for this pre-Merge,
  pre-public-RPC-filtering event; CEX/off-ramp reactions remain unmeasured."

