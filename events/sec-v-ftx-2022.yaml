analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17** (origin=agent_draft; codebook
  §8 DRYRUN preamble required). Authored by LLM agent without personally
  verifying Wayback/body_hash anchors; the SEC press-release URL slug
  (2022-219) and SDNY complaint PDF URL are stable and routinely captured
  by Wayback in 2022-2023. Pinned snapshot timestamps + body_hashes to be
  re-anchored during human audit before any citation may serve as an
  admission anchor in its own right.

  This row is the parallel-agency SEC sibling to the existing
  ftx-bankman-fried-doj-2022 row (DOJ SDNY criminal indictment) and the
  cftc-v-ftx-2022 row (CFTC civil enforcement complaint). All three were
  filed on the same day (2022-12-13) and target the same physical
  defendants — Samuel Bankman-Fried, FTX Trading Ltd., and Alameda
  Research LLC — but rest on distinct statutory authority:
  (a) DOJ criminal indictment under wire-fraud / securities-fraud /
  campaign-finance statutes (eight-count, unsealed 2022-12-13);
  (b) SEC civil complaint under federal securities laws (this row,
  Case 1:22-cv-10501, SDNY); and (c) CFTC civil complaint under the
  Commodity Exchange Act for fraud in connection with digital-asset
  commodities.

  Empirical-shape coding: null_event (codebook §3) because the SEC
  trigger does not produce any new observed_change layer attributable
  specifically to the SEC complaint. The FTX.com / FTX.US offramp was
  already frozen by the 2022-11-11 voluntary Chapter 11 filing
  approximately one month earlier, and the offramp_cex observed_change
  observation is already booked under the sibling DOJ row with
  attribution=plausible to the broader 2022-12-13 multi-agency trigger.
  Admission-tier coding: null_case (codebook §4) — zero strong-attribution
  observed_change layers attributable to this trigger; the row functions
  as a denominator-control sibling documenting that parallel-agency civil
  enforcement on top of a pre-collapsed platform produces no incremental
  cross-layer cascade.

  Codebook §1 attribution decision rule applied: §1.2-§1.5 do not engage
  here because no observed_change row is being coded. The single
  observed_no_change row uses attribution=none per the codebook §1.1
  canonical definition reserving `none` for observed_no_change and
  coverage_gap rows.

  Codebook §5 trigger-type / stratum mapping: trigger.type=sec_action
  permits research_stratum=S3_doj_sec_cftc_fiod per §5.2.

  Codebook §7 target-enumeration: kind=entity / enumeration=subset with
  enumeration_note documenting the class-level rationale that
  Bankman-Fried and FTX Trading Ltd. are the load-bearing defendants in
  the SEC complaint specifically, with Alameda Research deferred to the
  CFTC sibling row.

  Sibling positioning rationale: the three 2022-12-13 multi-agency rows
  are intentionally distinct events rather than a single row because
  (a) each rests on independent statutory authority (federal securities
  laws vs. federal criminal code vs. Commodity Exchange Act); (b) the
  research_stratum S3 cluster benefits from explicit SEC- and
  CFTC-specific denominator-control rows for the comparable_analysis
  corpus; and (c) the null_event empirical shape of the SEC and CFTC
  sibling rows (no new cascade beyond the bankruptcy-effected DOJ-row
  observation) is itself an analytically informative pattern about
  parallel-agency civil enforcement on already-collapsed offramps.

scoped_claim: |
  "The 2022-12-13 SEC civil securities-fraud complaint against Samuel
  Bankman-Fried (Case 1:22-cv-10501, SDNY) — filed in parallel with the
  DOJ SDNY criminal indictment and CFTC civil complaint — produced no new
  cross-layer cascade attributable to the SEC trigger specifically. The
  FTX.com / FTX.US offramp was already administratively frozen by the
  2022-11-11 voluntary Chapter 11 filing approximately one month earlier,
  and the broader 2022-12-13 multi-agency offramp_cex observation is
  booked under the sibling ftx-bankman-fried-doj-2022 row. This row is
  coded as empirical_shape=null_event / admission_tier=null_case to serve
  as a denominator-control sibling documenting that parallel-agency civil
  enforcement on top of a pre-collapsed platform produces no incremental
  observed_change."

