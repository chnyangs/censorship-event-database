analysis_notes: |
  S5_corporate / empirical_case (comparison) documenting a cross-event Tether retroactive freeze action on
  2023-12-09. Tether froze at least 10 ETH addresses from 4 distinct OFAC SDN events
  (SUEX 2021, Chatex 2021, Russia-election 2020, Russian-cyber-theft 2020) within a
  ~1-hour window on a single day, 2-3 years after the original designations. Circle had
  previously blacklisted these same addresses via USDC; Tether had not acted on USDT
  until this single sweep.

  Structural implications (paper-worthy):
  - The asset-layer cascade has a separate corporate-compliance clock. Circle tends to
    act within days of OFAC designation; Tether historically acted slower or not at all,
    then executed retroactive batches.
  - The 2023-12-09 batch likely reflects a specific Tether policy change or external
    trigger (possibly the US Attorney's Office announcement of criminal charges against
    Tether operators ~Nov 2023, or internal compliance escalation). Needs further
    research.
  - This event class is **non-OFAC-triggered** (stratum S5) — it is an issuer action
    NOT tied to a single OFAC designation date, but to a Tether internal decision.

  Follow-up directions (post-admission): (1) full enumeration of all ETH addresses
  frozen by Tether on 2023-12-09 04:30-06:00 UTC via Etherscan log query of USDT
  Blacklisted events in that window; (2) any Tether transparency / blog post
  referencing the action; (3) cross-reference with US DOJ announcements in
  Nov-Dec 2023 regarding stablecoin compliance.

scoped_claim: |
  "Tether executed a retroactive batch freeze of historical OFAC-SDN ETH addresses on
  2023-12-09 04:34-05:36 UTC, affecting addresses across ≥4 prior SDN events
  (SUEX 2021, Chatex 2021, Russia-election 2020, Russian-cyber-theft 2020). The
  minute-level timestamp clustering across distinct SDN events rules out coincidental
  action and establishes the batch as a single Tether policy operation."

