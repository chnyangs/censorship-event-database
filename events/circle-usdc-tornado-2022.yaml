analysis_notes: |
  comparison documenting Circle's same-day response to the 2022-08-08
  OFAC Tornado Cash designation as a **standalone corporate-policy-change
  event**. Distinct from tornado-cash-ofac-2022 (which is the OFAC-triggered
  composite cascade event); this event isolates the Circle/USDC issuer-side
  action with its own primary_onchain + primary_corporate evidence. Companion
  to tether-retroactive-sweep-2023 in the S5 stratum — Circle represents
  "fast issuer compliance" (5.93h), Tether represents "slow retroactive
  compliance" (~500 days). The pair anchors paper claims about
  issuer-compliance clock asymmetry.

scoped_claim: |
  "Circle's 2022-08-08 USDC blacklist action against Tornado Cash-adjacent
  addresses (first on-chain tx at 19:25:35 UTC, ~5.93 hours after OFAC
  designation) constitutes a distinct corporate-policy-change event
  documenting fast stablecoin-issuer compliance with OFAC SDN. Paper-
  relevant asymmetry datapoint paired with Tether's 2023-12-09 retroactive
  sweep (~500-day-later compliance)."

