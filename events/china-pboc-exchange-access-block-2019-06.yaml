  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources verified+captured,
  awaiting human admission). 2019 reaffirmation crackdown: the PBOC Shanghai Bureau issued
  a notice on 2019-11-14 ordering district regulators to probe and rectify local
  cryptocurrency trading/promotion services and overseas-ICO token distributors, part of an
  "all-around" campaign led by China's internet-financial-risk rectification leading group.
  Distinct from the 2017 exchange-shutdown / ICO-ban events (different date and instrument);
  this is a re-enforcement against venues that resurged. CODING NOTES: (1) candidate loosely
  dated "2019-06" (the June 2019 PBOC stated intent to GFW-block exchange/ICO websites); I
  pinned the concrete 2019-11-14 PBOC Shanghai notice instead, since the June item is a
  statement of intent rather than a datable executed action. (2) L0 left not_measured per
  §1.5 (no replayable OONI/Censored Planet/Cloudflare Radar slice for any 2019 GFW block).
  (3) Effect carried at offramp_cex (probe/rectification of the local trading-service
  surface); attribution=plausible because the anchor is journalism and the target is
  class-level. Flagged for human reviewer: borderline overlap with the 2017 China ban
  cluster as a re-enforcement action.

