analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission). On 2024-09-26 the DOJ
  (Eastern District of Virginia), with the U.S. Secret Service and Dutch
  partners, charged Sergey Sergeevich Ivanov (operator of UAPS/PinPays/PM2BTC,
  associated with the Cryptex crypto exchange) and Timur Kamilevich
  Shakhmametov (Joker's Stash) and seized the operational domains: the Secret
  Service seized the UAPS and PM2BTC website domains and a District of Maryland
  seizure order took Cryptex.net and Cryptex.one, shutting down the Cryptex
  exchange. This is a coordinated law-enforcement crypto-exchange takedown via
  domain seizure — in scope per codebook §9 (the Liberty Reserve / btc-e /
  bitzlato pattern: state seizure of a crypto-exchange platform's
  frontends/services). comparison shape, 2 observed_change layers
  (l4_frontend domain seizure + offramp_cex service shutdown), both
  attribution=direct (named state action against the named domains/services).
  asset_onchain not_applicable per §1.6: the captured DOJ release references
  blockchain-traced flows (~$1.15B) but enumerates NO specific on-chain
  address and no primary_onchain tx_hash is available, so no on-chain
  observation is asserted (anti-fabrication). Sources verified via WebSearch
  2026-05-31; the real DOJ EDVA press release captured + body_hash-pinned; grep
  of the captured body confirms "seizes web domains", "UAPS and PM2BTC
  websites", "Cryptex.net", "Cryptex.one", "shut down Cryptex", "Secret
  Service" (no fabrication). NOTE: corpus already holds cryptex-ofac-2024 (the
  same-day S1 OFAC SDN designation of Ivanov/Cryptex) and
  circle-usdc-cryptex-freeze-2024 (the S5 issuer freeze) — this is the DISTINCT
  S3 DOJ/Secret-Service criminal-charge + domain-seizure action, not the OFAC
  designation.

scoped_claim: |
  "The 2024-09-26 DOJ EDVA / U.S. Secret Service coordinated action seized the
  Cryptex.net/Cryptex.one, UAPS, and PM2BTC domains and shut down the Cryptex
  crypto exchange and UAPS/PM2BTC payment-exchange services, producing a
  2-layer cascade: l4_frontend (domain seizure) and offramp_cex (service
  shutdown), both attribution=direct. comparable_main tier."

