  null_event documenting the EU Council + European Parliament's 2024-05-30
  adoption of Regulation (EU) 2024/1624 — the Anti-Money Laundering
  Regulation ("AMLR" / EU AML single rulebook) — and its sibling Regulation
  (EU) 2024/1620 establishing the Anti-Money Laundering Authority ("AMLA").
  AMLR is the EU's first directly-applicable AML/CFT regulation: it
  replaces the patchwork of national AMLD transpositions with a single
  rulebook, and adds CASPs to the EU AML obliged-entities perimeter at the
  regulation level. Crypto-specific provisions: (1) Art. 19 — EUR 1,000
  occasional-/non-customer-transaction threshold for enhanced CDD by CASPs;
  (2) Art. 79 — ban on anonymous CASP-hosted accounts and anonymity-
  enhancing CASP-issued instruments; (3) CASP / self-hosted-wallet
  relationship restrictions in defined scenarios.

  NOTE: AMLR (Regulation 2024/1624) and AMLA (Regulation 2024/1620) are
  sibling instruments adopted the same day (2024-05-30). They form two
  legs of the EU AML package; the third leg is AMLD6 (a parallel
  directive). Cross-reference the AMLA event for the supervisory
  architecture (AMLA will directly supervise selected high-risk CASPs
  across the EU-27); AMLR carries the substantive obligations. Together
  with MiCA (2023/1114) and the TFR Recast (2023/1113), AMLR + AMLA
  complete the EU's post-2024 crypto regulatory architecture: MiCA
  (licensing / capital / custody), TFR Recast (zero-threshold travel rule
  / metadata), AMLR (CASP-level AML obligations + anonymous-account ban +
  EUR 1,000 CDD threshold), AMLA (supervision).

  empirical_shape=null_event and admission_tier=null_case per codebook §3
