    note: |
      AMLR is a class-level AML/CFT obligation framework for CASPs as
      obliged entities; it does not mandate frontend takedown. Individual
      CASPs may reconfigure onboarding / withdrawal UI for EU users to
      comply with the anonymous-account ban and EUR 1,000 threshold but no
      single-domain effect.
  - layer: asset_onchain
    status: not_applicable
    note: |
      AMLR does not mandate issuer-level freeze; it constrains CASP
      customer-due-diligence and account-anonymity, not the underlying
      asset. Asset-layer reasoning from the OFAC USDC / USDT comparison
      set does not apply.
