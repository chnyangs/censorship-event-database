analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17** (Phase E follow-on
  S5 corporate-policy candidate authored from the
  binance-privacy-coin-delisting-2023 /
  okx-privacy-token-delist-2024 sibling pair as the third
  cohort anchor for the 2023-2024 CEX privacy-asset delisting
  wave): authored by LLM agent without personally verifying
  Wayback/body_hash. status=draft and origin=agent_draft per
  authoring brief; this row requires human audit and Wayback /
  body_hash pinning of the Kraken support-article URL before
  promotion to admitted/human_reviewed.

  comparison — S5 corporate-policy-change event documenting
  Kraken (Payward, Inc.)'s 2024-10-31 termination of Monero
  (XMR) trading and deposit support for EEA-resident clients,
  citing MiCA-era compliance pressure (Regulation (EU)
  2023/1114; see eu-mica-2023) and the EU Transfer of Funds
  Regulation recast (Regulation (EU) 2023/1113; see
  eu-tfr-recast-2023) as the regulatory substrate. The
  trigger sits ~16 months after the MiCA Official Journal
  publication (2023-06-09) and ~2 months before MiCA's
  CASP-rules effective date (2024-12-30), positioning the
  action as pre-effective-date compliance preparation by the
  largest EUR-denominated CEX off-ramp for Monero in the EEA
  corridor. The 2024-10-31 cutover is the largest privacy-coin
  delisting event keyed to EU jurisdiction in the dataset and
  carries the highest jurisdictional precision among the
  2023-2024 CEX privacy-asset wave: where
  binance-privacy-coin-delisting-2023 geofenced to four
  EU member states (FR/IT/PL/ES) and okx-privacy-token-delist-2024
  operated at global product-catalogue scope, the Kraken EEA
  delisting spans the full EEA-30 (EU-27 + IS + LI + NO) and
  enumerates the four XMR spot pairs and the operational
  withdrawal / force-conversion mechanics.

  Single observed_change layer (offramp_cex) with attribution=
  direct via the Kraken customer-support article primary
  anchor. L0 / L1 / L3 / l4_frontend / asset_onchain are all
  not_applicable on substrate-mismatch grounds — this is a CEX
  corporate-policy listing-restriction event keyed to a single
  base-chain privacy asset (Monero), not a protocol or network
  primitive engagement, and the L4 announcement surface is
  co-located with the off-ramp catalogue change (treated
  symmetrically with the L4 handling in
  binance-privacy-coin-delisting-2023 and
  okx-privacy-token-delist-2024). Pairs with
  binance-privacy-coin-delisting-2023 (Binance EU-4 cohort
  leader, 2023-06-26) and okx-privacy-token-delist-2024
  (OKX global product-catalogue trim, 2023-12-29) as the
  three-event backbone of the 2023-2024 CEX privacy-asset
  delisting wave. Pairs with eu-mica-2023 and
  eu-tfr-recast-2023 on the regulatory-substrate axis: MiCA
  is the supranational framework trigger (S6) and the TFR
  recast supplies the AML / Travel-Rule companion; this row
  is the largest 2024 EU-jurisdictional S5 corporate-policy
  response by a CASP-relevant operator.

  attribution=direct rationale (codebook §1.4 extended to S5
  offramp_cex): (A) the corporate notice publicly cites the
  regulatory substrate as compliance rationale, and (B) the
  action is implemented by the named actor within the
  publicly-knowable compliance window ahead of the MiCA
  CASP-rules effective date (2024-12-30). The actor is both
  the announcing entity and the operator of the affected
  off-ramp product, satisfying the corporate-self-cite-of-
  trigger logic in §1.4.

  Why empirical_case rather than anchor_case: in this DRYRUN
  pass the load-bearing offramp_cex observation carries direct
  attribution but the citation is a single primary-corporate
  notice plus one supporting-journalism corroboration, both
  with provisional wayback anchors (not body-hash-pinned).
  Promotion to anchor_case requires (a) the Kraken support-
  article body_hash / body_path pinning during human audit,
  (b) an independent semi-primary or supporting tracker
  source confirming the post-2024-10-31 absence of the XMR
  spot pairs in Kraken's public EEA ticker listings, and
  (c) capture of the 2024-12-31 withdrawal-deadline and
  2025-01-06 force-conversion-to-BTC distribution mechanics
  as a separate operational anchor.

