  "Kraken (Payward, Inc.)'s 2024-10-31 15:00 UTC termination
  of Monero (XMR) spot trading and deposits for clients
  resident in the European Economic Area — closing the
  XMR/USD, XMR/EUR, XMR/BTC, and XMR/USDT pairs and
  force-converting remaining XMR balances to BTC by
  2025-01-06 — narrows the centralized-exchange off-ramp
  surface for Monero in the Kraken EEA corridor under
  MiCA-era compliance pressure. The offramp_cex layer carries
  the load-bearing direct-attribution observation; L0 / L1 /
  L3 / l4_frontend / asset_onchain are not_applicable for a
  geofenced exchange-listing-only action keyed to a single
  base-chain privacy asset. The row is the largest 2024
  EU-jurisdictional privacy-coin delisting anchor in the
  2023-2024 CEX privacy-asset delisting wave (alongside
  binance-privacy-coin-delisting-2023 and
  okx-privacy-token-delist-2024)."

scoped_knowledge: |
  This event is the 2024 EEA-cohort anchor in the
  2023-2024 CEX privacy-asset delisting wave under
  MiCA-era compliance pressure. The 2024-10-31 Kraken
  cutover sits ~16 months after MiCA's Official Journal
  publication (2023-06-09; eu-mica-2023) and ~2 months
  before MiCA's CASP-rules effective date (2024-12-30),
  positioning the action as pre-effective-date compliance
  preparation by the largest EUR-denominated CEX off-ramp
  for Monero in the EEA corridor. The TFR recast
  (eu-tfr-recast-2023) supplies the companion Travel-Rule
  / AML substrate cited in the Kraken notice.

  The three-event backbone of the wave —
  binance-privacy-coin-delisting-2023 (2023-06-26,
  Binance EU-4 cohort leader), okx-privacy-token-delist-2024
  (2023-12-29, OKX global product-catalogue trim), and
  this kraken-monero-eu-delisting-2024 (2024-10-31,
  Kraken EEA-30 cohort) — separates three distinct
  S5 corporate-response patterns to the same MiCA
  regulatory substrate: (a) geofenced multi-asset
  EU-member-state cohort (Binance), (b) global
  multi-asset product-catalogue trim (OKX), and
  (c) geofenced single-asset (XMR) EEA-30 cohort
  (Kraken). The jurisdictional-precision gradient
  (EU-4 → corporate_global → EEA-30) and the
  asset-scope gradient (8-asset cohort → 4+-asset
  cohort → 1-asset) document the corporate-response
  heterogeneity within the same regulatory substrate.

  Paper-relevant axes: (a) the regulatory-substrate /
  corporate-response coupling (MiCA framework S6 +
  TFR recast S6 → Binance EU-4 S5 → OKX global S5 →
  Kraken EEA-30 S5), (b) the jurisdictional-precision
  gradient within S5 corporate responses to the same
  framework (member-state vs corporate-global vs
  EEA-wide), (c) the operational-mechanics anchor
  (Kraken's 2024-12-31 withdrawal deadline plus
  2025-01-06 force-conversion-to-BTC mechanic is the
  most operationally explicit privacy-asset off-ramp
  closure in the corpus), and (d) the asset-specificity
  axis (Monero-only EEA action vs multi-asset cohorts)
  as a corporate-targeting indicator.

