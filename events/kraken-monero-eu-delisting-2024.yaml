trigger:
  type: corporate_policy_change
  actor: KRAKEN_PAYWARD
  timestamp: 2024-10-31T15:00:00Z
  timestamp_precision: hour
  citation:
    - type: primary_corporate
      url: https://support.kraken.com/articles/support-for-monero-xmr-in-europe
      wayback: https://web.archive.org/web/2024/https://support.kraken.com/articles/support-for-monero-xmr-in-europe
      evidence_use: contextual_unarchived
      note: |
        Kraken (Payward, Inc.) customer-support article "Support for
        Monero (XMR) in Europe" announcing termination of XMR trading
        and deposit support for clients resident in the European
        Economic Area (EEA), effective 2024-10-31 at 15:00 UTC. The
        notice closes the XMR/USD, XMR/EUR, XMR/BTC, and XMR/USDT spot
        markets for EEA users and sets a 2024-12-31 15:00 UTC
        withdrawal deadline, after which remaining XMR balances are
        force-converted to BTC at the prevailing market rate and
        distributed back to affected users by 2025-01-06. The notice
        cites EU regulatory changes (the Markets in Crypto-Assets
        framework — Regulation (EU) 2023/1114; see related_events:
        eu-mica-2023 — and the Travel-Rule / TFR recast Regulation
        (EU) 2023/1113; see related_events: eu-tfr-recast-2023) as
        the compliance rationale for ending EEA Monero support.
        Marked evidence_use=contextual_unarchived because in this
        DRYRUN the authoring LLM agent did not personally pin a
        Wayback snapshot timestamp or compute a body_hash; the
        precise support-article URL must be re-anchored during human
        audit before this citation may serve as an admission anchor
        in its own right.
  timestamp_sources:
    - type: primary_corporate
      note: |
        Hour-level precision (2024-10-31T15:00:00Z) per the Kraken
        customer-support notice, which specifies 15:00 UTC as the
        operational cutover for halting XMR trading and deposits for
        EEA clients. Companion 2024-12-31T15:00:00Z withdrawal
        deadline and 2025-01-06 force-conversion-to-BTC distribution
        are documented in the same notice but coded under the
        offramp_cex observation rather than the trigger timestamp.

target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    Target entity is Kraken (Payward, Inc.) as the centralized-
    exchange operator implementing the EEA-cohort Monero (XMR)
    delisting. The named affected asset is Monero (XMR) and the
    named affected pairs are XMR/USD, XMR/EUR, XMR/BTC, and
    XMR/USDT spot markets for users resident in the European
    Economic Area (EEA: the 27 EU member states plus Iceland,
    Liechtenstein, Norway). Recorded as enumeration=subset because
    (a) the action is a geofenced EEA-cohort listing restriction
    rather than a global Kraken-wide delisting, (b) the class-
    level rationale (MiCA-era privacy-asset compliance) extends
    to a broader cohort of privacy assets that Kraken did not
    enumerate in this notice, and (c) Kraken's broader 2024-2025
    EEA / EU compliance program covered additional product-
    catalogue narrowing in later notices, coded elsewhere or
    pending in the candidate ledger.
  entity: kraken_payward_eea_xmr_delisting
  actor_name: Kraken (Payward, Inc.) — EEA user cohort
  actor_type: centralized_exchange_listing_action
  chains: [monero]
  canonical_domains:
    - kraken.com
    - support.kraken.com

jurisdiction: [EU]

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      kraken.com and support.kraken.com remained reachable in the
      affected EEA jurisdictions before, during, and after the
      2024-10-31 cutover; the action is a product-catalogue change
      at the exchange-listing layer for the named EEA user cohort,
      not an ISP / DNS domain filter. Consistent with the L0
      treatment in binance-privacy-coin-delisting-2023 and
      okx-privacy-token-delist-2024 S5 corporate listing events.
      not_applicable on substrate-mismatch grounds.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Monero is an independent base-chain network; a Kraken EEA-
      cohort XMR spot-pair removal does not engage Monero's miner /
      consensus surface. Off-exchange transferability and base-
      chain operation are unaffected by the listing action.
      not_applicable on substrate-mismatch grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      Public RPC providers' filter lists for Ethereum and EVM
      chains are not implicated by a Kraken spot-pair removal
      targeting non-EVM Monero. No L3 measurement primitive
      applies. not_applicable on substrate-mismatch grounds.
  - layer: l4_frontend
    status: not_applicable
    note: |
      The Kraken support-article notice is itself the announcement
      surface, not a separable frontend-restriction observation
      distinct from the off-ramp catalogue change. Frontend
      visibility of removed pairs for EEA users collapses in
      lockstep with the off-ramp action; no independent L4 surface
      is pinned here. Treated symmetrically with the L4 handling
      in binance-privacy-coin-delisting-2023 and
      okx-privacy-token-delist-2024.
  - layer: asset_onchain
    status: not_applicable
    note: |
      Monero is a native base-chain asset with no issuer admin
      freeze primitive; no token-contract-level freeze or admin
      action is engaged by the Kraken listing change. The
      auto-conversion-to-BTC at the 2024-12-31 withdrawal deadline
      is a CEX-internal force-liquidation occurring inside Kraken's
      books, not an on-chain admin freeze of the underlying XMR.
      The action is exchange-listing-only. not_applicable on
      substrate-mismatch grounds.
  - layer: offramp_cex
    status: measured
    scope:
      - kraken_spot_xmr_usd_eea_cohort
      - kraken_spot_xmr_eur_eea_cohort
      - kraken_spot_xmr_btc_eea_cohort
      - kraken_spot_xmr_usdt_eea_cohort
    note: |
      Load-bearing layer. Kraken (Payward, Inc.), one of the global
      top-tier centralized exchanges by EUR-denominated spot
      volume, halted XMR trading and deposits for EEA-resident
      clients effective 2024-10-31 at 15:00 UTC, with a
      2024-12-31 15:00 UTC withdrawal deadline and automatic
      force-conversion of remaining XMR balances to BTC for
      affected users by 2025-01-06. The action narrows the CEX
      off-ramp surface for Monero in the Kraken EEA corridor and
      is the direct realization of the corporate-policy trigger.
      Attached below as observed_change with attribution=direct.

