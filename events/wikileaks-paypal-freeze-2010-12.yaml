analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-5 audit (S5 corporate, WikiLeaks
  blockade 1/8) by human:xiangwen as empirical_case. Agent-drafted
  primary URL (thepaypalblog.com/.../why-paypal-restricted-wikileaks-
