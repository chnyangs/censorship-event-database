  archived sources: WikiLeaks official statement (primary_corporate,
  Wayback 20110527212402, body_hash 176da1f6...) + Bloomberg 2010-12-04
  (semi_primary_wayback, 20150413182628, df106cc7...) + CSMonitor
  2010-12-08 (semi_primary_wayback, 20150911222850, 467aa4a7...). offramp_cex
  observed_change/direct. comparison/empirical_case preserved.

  **NEW EVENT AUTHORED - DRYRUN 2026-05-16** (agent_draft per user
  instruction; status=draft because no body_hash+body_path archive
  anchors have been pinned in this session). Authored by LLM agent
  without personally verifying Wayback/body_hash; human review required
  to elevate to admitted status.

  Pre-Bitcoin baseline event. Bitcoin's genesis block was 2009-01-03;
  WikiLeaks first published a Bitcoin donation address on 2011-06-14
  (i.e. ~6 months after this 2010-12-04 PayPal freeze). At the
  trigger date there was no blockchain-asset substrate for WikiLeaks
  donations, so the l0_network, l1_consensus, l3_rpc, and
  asset_onchain cascade axes are all not_applicable. The single
  observed_change layer is offramp_cex, which is the closest schema
  analog for a pre-Bitcoin payment-processor freeze (PayPal acting as
  the fiat donation-collection rail, conceptually analogous to a
  centralized-exchange offramp in the post-Bitcoin era).

  comparison shape: 1 observed_change layer (offramp_cex
  load-bearing, attribution=direct via PayPal's own corporate blog
  post + Bedier's Le Web admission). admission_tier=empirical_case
  (>=1 strong-attribution observed_change layer).

  temporal_tier=discovery_only_2008_2012 + analysis_use=
  discovery_ledger_only: this event predates the 2017+ comparable
  analysis window. It enters the discovery ledger as part of the
  pre-Bitcoin baseline cluster of WikiLeaks payment-rail blockade
  events (PayPal, Visa Europe, Mastercard, Bank of America, Western
  Union, PostFinance, plus the parallel infrastructure-rail events
  Amazon AWS and EveryDNS, and the downstream
  Datacell-v-Valitor 2012 Iceland District Court ruling). The 2010
  WikiLeaks blockade is the single most-cited pre-Bitcoin
  corporate-payment-rail censorship event in academic literature and
  serves as the conceptual anchor for the post-Bitcoin
  offramp_cex / payment-rail cascade pattern documented elsewhere in
  the dataset.

  Schema-actor handling: the user spec proposed
  actor=PAYPAL_OPERATOR (corporate). The schema does not constrain
  trigger.actor to an enumerated set (it is a free-form string), so
  PAYPAL_OPERATOR is accepted as-is and no controlled_vocab.yaml
  addition is required. The actor/type coherence check in the
  validator only fires for US-agency substrings (US_SEC, US_CFTC,
  US_FINCEN, US_DOJ, US_OFAC, EU_COUNCIL); PAYPAL_OPERATOR does not
  match any of those, so no coherence-rule conflict arises.

  DRYRUN caveats: all citations carry wayback wildcard pointers
  (web/2010/...) and evidence_use=contextual_unarchived. For
  non-DRYRUN release, capture body_hash + body_path for: (1) PayPal
  corporate blog post 2010-12-04, (2) CNN 2010-12-04 coverage, (3)
  Bloomberg 2010-12-04 coverage, (4) TechCrunch 2010-12-08 Bedier
  admission coverage. The Guardian 2010-12-08 Bedier coverage
  (referenced in the user spec) and Wired 2010-12-04 coverage are
  also candidate archive captures for the non-DRYRUN pass.

  Related WikiLeaks blockade events (cross-referenced in
  related_events) form the conceptual cluster: Visa Europe
  suspension, Mastercard suspension, Bank of America block, Western
  Union interdiction, PostFinance account closure, Amazon AWS
  eviction, EveryDNS domain termination, and the
  Datacell-v-Valitor 2012-07 Iceland District Court ruling (the
  legal-pushback follow-on). The PayPal action is the first in the
  payment-rail blockade sequence (2010-12-04), preceded only by the
  Amazon AWS eviction (2010-12-01) and the EveryDNS termination
  (2010-12-03) on the infrastructure side.

scoped_claim: |
  "On 2010-12-04, PayPal permanently restricted the WikiLeaks
  donation merchant account (registered to the Wau-Holland-Stiftung
  pass-through), citing its Acceptable Use Policy prohibition on
  facilitating activities determined illegal. PayPal VP Osama Bedier
  subsequently (2010-12-08, Le Web Paris) acknowledged that a US
  State Department determination that WikiLeaks' activities were
  illegal under US law informed the decision. The freeze is the
  pre-Bitcoin conceptual analog of an offramp_cex / payment-rail
  closure (the only observed cascade axis in 2010 in the absence of
  any blockchain-asset substrate for WikiLeaks donations).
  Observational axis at offramp_cex (load-bearing,
  attribution=direct via PayPal's own corporate statement).
  Admission-anchor-grade promotion pending pinned archive captures."

