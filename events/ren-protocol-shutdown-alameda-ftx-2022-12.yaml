analysis_notes: |
  **C-5 AUDIT 2026-05-30 — KEEP AS DRAFT (honestly un-promotable).**
  This event was re-audited and DELIBERATELY KEPT status=draft /
  origin=agent_draft; it is NOT a promotion candidate. The Ren 1.0
  wind-down mechanism is OFF-CHAIN (darknode threshold-signature
  cessation); MintGatewayLogicV1 has no on-chain pause/kill surface, so
  the §4.5 single-primary_onchain admission exception is STRUCTURALLY
  UNSATISFIABLE — a primary_onchain tx_hash for the redemption-window
  closure can never exist. Accordingly the asset_onchain layer is recoded
  status=not_measured and its observation is coded
  observation_kind=coverage_gap (attribution=unknown), which makes the
  event empirical_shape=null_event / admission_tier=null_case: the
  load-bearing surface is real and publicly announced but un-anchorable on
  chain. A non-custodial cross-chain bridge is NOT a CEX, so the layer is
  NOT reclassified to offramp_cex. The renBTC Etherscan denominator is a
  token/address page (descriptive scope_descriptor), not a tx receipt.
  Factual correction: the ~437 BTC / ~$13.11M transfer to FTX-debtor
  wallets is a SEPARATE 2023-04-12 Bitcoin-network event and is decoupled
  from the 2022-12-20 Ethereum-side trigger; the heavily-reused Discord
  address 19iqYbeATe4RxghQZJnYVFU4mjUUu76EA6 is not used as an anchor.
  The legacy "comparison / empirical_case / observed_change" framing in
  the paragraphs below is SUPERSEDED by this audit note and retained only
  for provenance.

  **NEW EVENT AUTHORED — DRYRUN 2026-05-17 Wave 2.2D** (P1
  permissive-counterexample sweep; re-author preamble, replaces dropped
  rate-limit-partial): authored by LLM agent without personally
  verifying Wayback / body_hash; status=draft and origin=agent_draft.
  Real release must replace this DRYRUN marker with a human-verified
