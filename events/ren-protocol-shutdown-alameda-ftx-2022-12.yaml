target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    Single-entity-cluster target: the Ren Protocol 1.0 cross-chain bridge
    operated by the Alameda-acquired Ren team, wrapping native BTC / BCH
    / ZEC / DOGE / FIL / LUNA into ERC-20 representations (renBTC,
    renBCH, renZEC, renDOGE, renFIL, renLUNA) on Ethereum and other host
    chains. The wind-down terminates the bridge's redemption surface for
    all ren-wrapped asset classes; enumeration=subset because the YAML
    does not enumerate every wrapped-asset contract individually and
    because the load-bearing observation is at the bridge-protocol
    level. The dominant exposure was renBTC (~$500M TVL at peak,
    materially lower by the 2022-12 wind-down window after the FTX
    collapse triggered redemptions).
  entity: ren_protocol_1_0
  actor_type: cross_chain_bridge_operator
  actor_name: Ren Protocol Team (Alameda-acquired)
  chains: [ethereum, bitcoin]
  canonical_domains:
    - renproject.io

jurisdiction: [corporate_global]

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      renproject.io remained DNS-resolvable and TCP-reachable through
      the 2022-12-20 wind-down; the action is an operator-initiated
      protocol shutdown at the bridge layer, not an ISP / DNS domain
      filter. not_applicable on substrate-mismatch grounds.
  - layer: l1_consensus
    status: not_applicable
    chain: ethereum
    note: |
      No Ethereum or Bitcoin validator-set / miner consensus surface is
      engaged by the operator-initiated Ren 1.0 bridge wind-down. The
      Ren darknode network is a separate sidechain-style cluster from
      Ethereum L1 consensus and is itself the shutdown target rather
      than an Ethereum-L1 censorship primitive. not_applicable on
      substrate-mismatch grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      No public Ethereum RPC provider filter-list change is implicated
      by the operator-initiated Ren 1.0 bridge wind-down. not_applicable
      on substrate-mismatch grounds.
  - layer: l4_frontend
    status: not_measured
    scope:
      - renproject.io
    note: |
      No admission-grade historical frontend diff for renproject.io is
      retained in this DRYRUN file. A retained L4 observation would
      require a pinned Wayback snapshot of the renproject.io wind-down
      notice surface across the 2022-12 announcement → 2022-12-20
      burning cutoff window. Until those snapshots are pinned and
      body_hashed, the L4 surface remains unmeasured; the load-bearing
      observation is at the asset_onchain layer (wrapped-asset
      redemption-window cutoff at the bridge contract level).
  - layer: asset_onchain
    status: not_measured
    chain: ethereum
    scope:
      - renbtc_erc20_contract
      - other_ren_wrapped_asset_contracts
    note: |
      Load-bearing layer, but NOT measured at the per-transaction level.
      The Ren 1.0 bridge wind-down mechanism is OFF-CHAIN: the darknode
      network simply ceases producing the threshold signatures that
      authorize mint / burn (redeem) operations. MintGatewayLogicV1
      (the renBTC mint/burn gateway contract) exposes NO on-chain pause
      or self-destruct surface, so there is NO replayable per-transaction
      Ethereum receipt that records the redemption-window closure — the
      cutoff is enacted by signature cessation in the darknode cluster,
      not by any single on-chain transaction. There is therefore no
      replayable per-tx artifact to body_hash, and the layer is coded
      not_measured rather than partially_measured: the wind-down is real
      and publicly announced, but it is structurally un-anchorable on
      chain. The matching asset_onchain observation is therefore coded
      observation_kind=coverage_gap (attribution=unknown): the load-
      bearing surface exists but cannot be measured on chain. The
      Etherscan renBTC token page below is retained only as a descriptive
      denominator (a token/address page, not a tx receipt).
    denominator_artifact:
      type: scope_descriptor
      url: https://etherscan.io/token/0xeb4c2781e4eba804ce9a9803c67d0893436bb27d
      wayback: https://web.archive.org/web/20221220000000/https://etherscan.io/token/0xeb4c2781e4eba804ce9a9803c67d0893436bb27d
      scope_descriptor:
