        token/address page, not a transaction receipt, so it cannot anchor
        an on-chain observed_change. It is retained purely to scope the
        wrapped-asset lifecycle-end trajectory window. Re-pinned to a real
        2022-12-23 Wayback memento (resolved from the
        /web/20221220000000/ date-prefix) in place of the prior /web/2022/
        wildcard pointer.
  - layer: offramp_cex
    status: not_applicable
    note: |
      No centralized-exchange listing-restriction action attaches to the
      operator-initiated Ren 1.0 bridge wind-down at the trigger. The
      wind-down is at the cross-chain bridge protocol layer, not a CEX
      product-catalogue change. not_applicable on substrate-mismatch
      grounds.

