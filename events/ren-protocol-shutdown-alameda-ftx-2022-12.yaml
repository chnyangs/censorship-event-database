  comparison — S5 corporate-policy-change event documenting the Ren
  Protocol team's 2022-12-20 operator-initiated wind-down of the Ren
  1.0 cross-chain bridge. Minting on the bridge was disabled in the
  preceding weeks; 2022-12-20 is the publicly announced burning /
  redemption-window close-out cutoff after which residual ren-wrapped
  asset balances (renBTC and the broader family) on Ethereum can no
  longer be redeemed back to their native chains via the Ren 1.0
  darknode network. The wind-down is causally linked to the upstream
  FTX / Alameda Research Chapter 11 collapse: Alameda acquired the Ren
  team in 2022-02 and was funding ongoing protocol development at
  ~$700K / quarter; after the 2022-11-11 FTX Chapter 11 filing the Ren
  team disclosed it had ~$160K of remaining runway and could not
  sustain Ren 1.0 operation, triggering the operator-initiated
  shutdown. Approximately $500M TVL was nominally affected (figure as
  reported in the source brief; actual residual exposure at the
  2022-12-20 cutoff was materially lower after pre-cutoff redemptions,
  with on-chain trackers reporting roughly $15M renBTC still bridge-
  bound at the cutoff date).

  Sibling positioning in the FTX / Alameda contagion cluster: this
  event is paired with related_events
  ftx-bankman-fried-doj-2022 (parent S3 federal-enforcement +
  Chapter 11 trigger) and celsius-bankruptcy-mashinsky-doj-2023
  (sibling crypto-bankruptcy collapse). The Ren row is structurally
  distinct because it is an S5 corporate-policy-change at the cross-
  chain bridge protocol layer rather than an S3 federal enforcement
  action, and because the load-bearing observation is at the
  asset_onchain wrapped-asset redemption-window cutoff (not
  offramp_cex). One observed_change layer (asset_onchain) with
  attribution=plausible (not direct) to the FTX / Alameda upstream
  collapse: the operator-initiated wind-down is causally linked to the
  parent collapse but the upstream FTX 2022-11-11 Chapter 11 trigger
  does not itself name Ren or its wrapped-asset contracts; class-level
  inference from parent collapse → subsidiary operator shutdown per
  §1.1 / §1.4 codebook reasoning extended to a cross-chain bridge
  wind-down.

  Why empirical_case (not anchor_case): one observed_change layer
  (asset_onchain) with attribution=plausible meets the empirical_case
  threshold but not the anchor_case ≥ 2 strong-attribution-layer bar.
  L0 / L1 / L3 / offramp_cex are not_applicable on substrate-mismatch
  grounds; L4 frontend is not_measured pending Wayback pinning of
  the renproject.io wind-down notice surface.

scoped_claim: |
  "The Ren Protocol team's 2022-12-20 operator-initiated wind-down of
  the Ren 1.0 cross-chain bridge — burning / redemption-window close-out
  for renBTC and the broader ren-wrapped asset family on Ethereum,
  preceded by mint-cessation in the prior weeks — closed the cross-chain
  redemption surface of the bridge to zero at the asset_onchain layer.
  The asset_onchain observation carries the load-bearing plausible-
  attribution observation, causally linked to the upstream 2022-11-11
  FTX Trading Ltd. / Alameda Research Chapter 11 collapse (Alameda was
  the parent / funder of the Ren team after the 2022-02 acquisition);
  the event is the cleanest S5 corporate-policy follow-on in the corpus
  to the FTX / Alameda contagion cascade affecting a cross-chain bridge
  primitive."

