analysis_notes: |
  **NEW EVENT AUTHORED -- DRYRUN 2026-05-16** (agent_draft per user
  instruction; status=draft because no body_hash+body_path archive
  anchors have been pinned in this session). Authored by LLM agent
  without personally verifying Wayback/body_hash; human review required
  to elevate to admitted status.

  Foundational L4-frontend / cloud-hosting censorship precedent in the
  corpus. Amazon Web Services terminated WikiLeaks' EC2 / S3 hosting on
  2010-12-01 approximately 2 days after WikiLeaks had migrated to AWS
  (2010-11-29) to escape DDoS attacks against its self-hosted Swedish
  infrastructure. The action followed a press release the same morning
  from Senator Joe Lieberman (chair, Senate Homeland Security and
  Governmental Affairs Committee) announcing that Amazon had "informed
  my staff" of the termination. AWS's own corporate statement
  (2010-12-02) denied political pressure and grounded the termination
  in terms-of-service violations (content the customer does not "own or
  otherwise control all of the rights to" plus injury-risk).

  Conceptual ancestor of 2022 Apple/Google App Store removals
  (apple-india-crypto-exchange-removal-2024-01,
  google-play-india-crypto-exchange-removal-2024-01) and Cloudflare
  gateway eviction events
  (cloudflare-ethereum-gateway-tornado-block-2022-08): a corporate
  intermediary withdraws hosting / distribution access in response to
  political pressure, with the intermediary publicly grounding the
  decision in its own TOS / acceptable-use policy rather than in any
  legal compulsion. Pre-modern because the censorship target was
  publication infrastructure, not a crypto frontend; recorded under
  discovery_only_2008_2012 / discovery_ledger_only so that early-period
  precedent is preserved without entering the 2017+ comparable
  denominator.

  Attribution annotated plausible (not direct) because:
    1. AWS denies that the Lieberman contact caused the termination.
    2. No internal AWS communication has been disclosed publicly that
       would resolve the conflict between Lieberman's public credit-
       claim and AWS's TOS-violation framing.
    3. The 2-day hosting window and same-morning timing with the
       Lieberman press release are strong circumstantial evidence but
       not direct documentary proof of causation.

  Related sibling axes recorded as separate events:
    - wikileaks-everydns-domain-termination-2010-12 (DNS authoritative
      provider termination; sibling L0 / DNS axis).
    - PayPal / Visa / Mastercard / Bank of America financial-rail
      blockade (sibling offramp axis; not recorded in this session).
    - apple-india-crypto-exchange-removal-2024-01 (modern descendant
      via related_events cross-reference; corporate intermediary
      withdrawing distribution access under political pressure).

scoped_claim: |
  "On 2010-12-01, Amazon Web Services terminated WikiLeaks' EC2 / S3
  cloud-hosting account approximately 2 days after WikiLeaks had
  migrated to AWS to escape DDoS against its self-hosted infrastructure,
  following same-morning public pressure from Senator Joe Lieberman's
  office. AWS publicly grounded the termination in TOS violation and
  denied that the Lieberman contact prompted the decision.
  Observational axis at l4_frontend (cloud-hosting eviction).
  Discovery-only precedent for the corporate-intermediary censorship
  pattern; not eligible for the 2017+ comparable denominator."

