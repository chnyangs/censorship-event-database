analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen reviewing agent: TASK-2 lower-tier. §9-clear, well-documented deliberate restriction admitted at evidence_tier=attested_secondary (codebook §10) — single captured contemporaneous source; verified clean (no fabrication) in bulk adversarial-verify; filterable via evidence_tier.)
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources verified+captured,
  awaiting human admission).

  State Bank of Vietnam (SBV) public statement of 2017-10-30 declared bitcoin and similar
  virtual currencies not a lawful means of payment, and prohibited their issuance, supply
  and use as a means of payment under Decree 101/2012 (amended by Decree 80/2016), with
  administrative fines of 150-200 million VND under Decree 96/2014/ND-CP effective
  2018-01-01 (criminal liability possible thereafter). The underlying instrument is SBV
  Official Letter No. 5747/NHNN-PC dated 2017-07-21. This is a binding payment-rail
  prohibition with penalties, in scope under codebook §9 (a deliberate state restriction
  on using a crypto payment surface), not a soft "not legal tender" advisory.

  Why trigger.type=regulatory_enforcement: per §5.1, the SBV action is non-US national
  regulator administrative enforcement (a payment-law prohibition), not an ISP/DNS network
  block. Matches the bangladesh-bb-bitcoin-warning-2014 sibling.

  Why attribution=plausible: per §1.5 + §8.4, contemporaneous state-news report captured
  but SBV primary letter text not captured in this pass; conservative plausible.

  Why comparable_main_2017_present / comparable_analysis: 2017 event, post-2017 tier.

  Draft pending human audit of (i) SBV Official Letter 5747/NHNN-PC primary text and
  (ii) any quantitative offramp_cex measurement.

scoped_claim: |
  The SBV's 2017-10-30 statement (per Official Letter 5747/NHNN-PC, 2017-07-21) prohibited
  the issuance, supply and use of bitcoin and similar virtual currencies as a means of
  payment in Vietnam, with administrative fines from 2018-01-01. Effect carried at
  offramp_cex (observed_change, plausible) at class level.

