analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen reviewing agent: TASK-2 lower-tier. §9-clear, well-documented deliberate restriction admitted at evidence_tier=attested_secondary (codebook §10) — single captured contemporaneous source; verified clean in bulk adversarial-verify; filterable via evidence_tier. Reworded a stale planning marker.)
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources verified+captured,
  awaiting human admission).

  Historical-baseline authoring pass for the 2014-04-15 PBOC deadline requiring Chinese
  banks and third-party payment processors to close the bank accounts of domestic bitcoin
  exchanges, and the resulting closures of OKCoin's and Huobi's bank accounts (reported
  2014-04-18). This is a banking-rail severance / debanking ENFORCEMENT action against
  legitimate exchanges (codebook §9 INCLUDE).

  DEDUP rationale (NOT a duplicate of china-pboc-crypto-ban-2013-12): the 2013-12 event
  documents PBOC Notice 2013/289, whose effect was that banks refused NEW bitcoin-related
  accounts and the exchange triad PAUSED CNY deposits (~2013-12-18). This April-2014 event
  is the distinct enforcement escalation — a separate PBOC deadline (2014-04-15) under which
  EXISTING exchange bank accounts were actually CLOSED, with OKCoin and Huobi reporting
  their accounts shut by 2014-04-18. Distinct date, distinct mechanism (account closure vs
  deposit pause), distinct named effect; recorded as a sibling, cross-referenced in
  related_events.

  Why trigger.type=nation_state_block: a PBOC banking/payment-rail enforcement deadline
  driving account closures (codebook §5.1 nation-state payment-rail family, alongside the
  2013 PBOC notice). Per §5.2 the permitted research_stratum is S4_nation_state.

  Why historical_baseline tier: 2014 events belong to historical_baseline_2013_2016;
  analysis_use=historical_baseline excludes this row from the 2017+ comparable-analysis
  denominator.

  Why empirical_shape=comparison / admission_tier=empirical_case: one direct-attribution
  observed_change layer (offramp_cex). L1/L3/asset_onchain are construct-did-not-exist in
  2014; L0/L4 are scope-mismatched. Single load-bearing strong-attribution layer ->
  comparison / empirical_case.

  Why attribution=direct: the PBOC deadline is the named regulatory mandate driving the
  observed bank-account closures at OKCoin and Huobi (§1.5 nation-state-mandate reading at
  the off-ramp rail).

  Source note: the PBOC order travels via internal Chinese regulatory/banking channels and
  is not publicly archivable; the replayable anchor is the contemporaneous CoinDesk report
  documenting the deadline and the named exchanges' account closures. Human audit should
  attempt to pin a PBOC-domain or exchange-domain primary copy prior to an admission_grade upgrade.

scoped_claim: |
  Around the 2014-04-15 PBOC deadline, Chinese banks and third-party payment processors
  closed the accounts of domestic bitcoin exchanges; OKCoin and Huobi reported their bank
  accounts closed by 2014-04-18. The offramp_cex layer carries the load-bearing
  direct-attribution observation. This is the enforcement escalation of the 2013-12 PBOC
  banking-exclusion notice (deposit pause -> account closure).

