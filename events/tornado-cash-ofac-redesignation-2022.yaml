  - layer: asset_onchain
    status: measured
    chain: ethereum
    note: |
      Full scan of 92 ETH addresses via usdtbanlist.com
      (sources/asset_layer_scan/tornado-cash-ofac-redesignation-2022.json): **1/92 blocked**
      (only 0x905b63Fff465B9fFBF41DeA908CEb12478ec7601). This is a paper-worthy structural
      finding: **smart-contract addresses in OFAC SDN designations are rarely blacklisted
      by stablecoin issuers**. Circle USDC blacklisted this one address on 2022-08-08
      (predating the 2022-11-08 redesignation — tied to the parent Tornado-2022 event),
      and Tether USDT blacklisted it on 2023-12-09 as part of the retroactive sweep. The
      remaining 91 addresses — despite being on the OFAC SDN list — are NOT on Circle/Tether
      blacklists as of 2026-04-22. Contrast with individual-wallet designations (Semenov
      8/8, LockBit 1/1, Cryptex 1/1, Funnull 2/2, Aeza 1/1, Grinex 11/11) where issuer
      compliance is 100%.
