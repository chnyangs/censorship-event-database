      No post-2022-11-08 off-ramp action has been pinned. dYdX had already restricted accounts in
      the 2022-08 cascade; no public evidence suggests a fresh Nov 8 round of exchange withdrawals.
      Attaching a direct exchange policy statement (blog, FAQ, SEC filing) referencing the Nov 8
      redesignation would upgrade this layer.

