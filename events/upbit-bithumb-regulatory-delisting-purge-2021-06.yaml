analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen reviewing agent: TASK-2 lower-tier. §9-clear, well-documented deliberate restriction admitted at evidence_tier=attested_secondary (codebook §10) — single captured contemporaneous source; verified clean (no fabrication) in bulk adversarial-verify; filterable via evidence_tier.)
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). South Korea's two largest
  exchanges, Upbit and Bithumb, executed a delisting purge in June 2021
  ahead of the mandatory FIU/FSC virtual-asset-service-provider
  registration regime (deadline 2021-09-24). Upbit posted a 25-token
  watchlist (2021-06-11) and delisted 24 (2021-06-18); Bithumb announced
  termination of 4 tokens (2021-06-17, effective 2021-07-05). The delisted
  set explicitly included "dark coins (privacy coins like monero)" per the
  captured CoinDesk source, placing this in the privacy-coin-delisting wave
  alongside bittrex-privacy-coin-delisting-2021-01 and
  binance-privacy-coin-delisting-2023 (cf. related_events). comparison
  shape, single offramp_cex observed_change. attribution=plausible: the
  delistings are directly observed and the regulatory context is explicit,
  but no per-token regulatory order names each removed asset (§1.1 class-
  level inference). enumeration=subset because the privacy-coin class is
  named but the full per-ticker list is not in the captured primary (§7).
  jurisdiction=KR. Source verified via WebSearch + capture 2026-05-31
  (CoinDesk, body_hash-pinned; claims grep-verified; no fabrication).

scoped_claim: |
  "Upbit's 2021-06-18 removal of 24 markets and Bithumb's termination of 4
  (effective 2021-07-05) — a regulatory-driven delisting purge that
  included dark/privacy coins (e.g. Monero) ahead of the FIU registration
  deadline — severed the two largest South Korean CEX off-ramps for the
  affected altcoins; single-layer offramp_cex observed_change,
  attribution=plausible (no per-token regulatory order stated)."

