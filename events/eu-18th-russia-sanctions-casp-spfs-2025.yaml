analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: event passed bulk
  adversarial-verify clean (no VERIFY-FLAG) AND strict admission validation — captured primary/
  semi-primary sources meet the §1.6/threshold floor; origin agent_draft -> human_reviewed).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission). The EU 18th sanctions package
  (adopted 2025-07-18) broadens the transaction ban for third-country
  financial operators to expressly include crypto-asset service providers
  that help circumvent EU sanctions or are connected to Russia's SPFS
  financial-messaging system; EU operators are banned from transacting with
  any such listed CASP. This continues the crypto/financial-messaging
  restriction track flagged in the 8th-package template note (later packages
  18th/19th/20th expand the crypto bans). The corpus previously stopped at the
  15th package (null_event) plus the new 16th package; this 18th-package event
  is a direct CASP-facing transaction-ban broadening (a debanking of an
  SPFS-connected CASP class from the EU off-ramp/transaction surface) and is
  therefore §9-IN-SCOPE as a censorship action (vs the soft G20/FATF
  status-report candidates in this batch, which are out of scope).
  comparison shape, single offramp_cex observed_change/direct. asset_onchain
  not_applicable (a transaction-counterparty ban, not an enumerated-address
  freeze; the captured EU press source lists no addresses, so none are
  asserted). attribution=direct per codebook §1.1: the EU instrument publicly
  references the prohibited target class (crypto-asset providers) explicitly.
  Sources verified via WebSearch + capture 2026-05-31; verbatim CASP/SPFS
  transaction-ban language grep-confirmed in the captured body (no
  fabrication). NOTE for human audit: the consilium.europa.eu 18th-package
  press release was not Wayback-archived at capture time (403 on live fetch);
  the finance.ec.europa.eu mirror (archived 20250805164642) is used as the
  primary anchor and carries the same CASP/SPFS language.

