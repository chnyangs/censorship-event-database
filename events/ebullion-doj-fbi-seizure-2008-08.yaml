analysis_notes: |
  **NEW EVENT AUTHORED - DRYRUN 2026-05-17** (Wave 2.2D discovery-
  tier authoring): new discovery_only_2007_2012 event for the
  2008-08 DOJ CDCA / FBI LA seizure of e-Bullion / Goldfinger Coin
  & Bullion and the federal arrest of founder James Fayed under
  18 USC s 1960. Authored by LLM agent without personally verifying
  Wayback/body_hash; origin=agent_draft and status=draft per
  validator constraint. Real release must replace this DRYRUN
  marker with a human-verified audit after pinning real archive
  anchors (the wayback URLs here are 2008 wildcard pointers, not
  pinned snapshot timestamps). Trigger date 2008-08-01 is the
  day-precision opening of the public arrest-and-seizure window;
  the most precise public anchors are 2008-08-04 (Fayed in federal
  custody per Pacific Coast Business Times 2008-08-01 reporting)
  and 2008-08-05 (e-bullion.com pulled offline). 2008-08-26 referenced
  in the prompt as a candidate could not be confirmed in this pass;
  retained as 2008-08-01 trigger window opening with day precision.

  comparison shape: 1 observed_change layer (offramp_cex, e-Bullion
  service operations cessation following operator seizure and
  founder arrest). The 2008-08 DOJ CDCA / FBI LA action against
  e-Bullion is the immediate sibling to the 2008-07-21 e-Gold DC
  guilty plea (related_events: egold-doj-guilty-plea-2008-07) and
  together they establish the pre-Bitcoin 18-USC-1960 enforcement
  template against digital-gold-currency administrators that
  predates FinCEN FIN-2013-G001 by ~5 years and the Liberty Reserve
  Costa Rica license denial (2011-03) by ~3 years. attribution=
  direct under §1.2/§1.4 analogue: the DOJ trigger names the target
  operator and the platform shutdown falls within the publicly-
  knowable compliance window (e-bullion.com pulled within 4 days of
  the public arrest-and-seizure window opening). L0/L1/L3/L4 and
  asset_onchain are all not_applicable: e-Bullion was a centralized
  digital-gold-currency platform (off-chain ledger; physical bullion
  at Perth Mint), pre-dating any blockchain by ~6 months. Admission
  tier empirical_case (1 strong-attribution observed_change layer).

  Discovery-tier-only by construction: temporal_tier=
  discovery_only_2007_2012 and analysis_use=discovery_ledger_only.
  This row carries no comparable-analysis denominator weight; its
  purpose is to anchor the 2008+ pre-Bitcoin DOJ MSB enforcement
  predicate alongside egold-doj-guilty-plea-2008-07 and
  liberty-reserve-costa-rica-license-denial-2011-03. Founder James
  Fayed was later convicted (2010) of murder-for-hire of his wife
  Pamela Fayed; that prosecution is collateral to the e-Bullion
  shutdown and not coded here.

scoped_claim: |
  "The 2008-08 DOJ CDCA / FBI LA federal arrest of James Fayed and
