  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). Crypto.com's 2025-01-29
  announcement to suspend USDT and nine other non-MiCA-compliant tokens
  for EEA users (purchases off 2025-01-31; full delisting / forced
  conversion to compliant assets by Q1-2025 end), severing the Crypto.com
  USDT off-ramp in the EEA under MiCA's e-money-license requirement (USDT
  unlicensed). Part of the MiCA stablecoin-delisting wave (cf. Coinbase
  Dec-2024, Binance Mar-2025; related EU-MiCA framework events).
  comparison shape, single offramp_cex observed_change,
  attribution=plausible per §1.1/§1.4-analogue (MiCA cause reported in
  trade press; no captured Crypto.com notice naming a specific MiCA
  instrument — class-level inference). EU jurisdiction. Per §1.6 /
  binance-busd precedent the stablecoin action is carried at offramp_cex,
  NOT asset_onchain (Crypto.com is not the USDT issuer and cannot freeze
  on-chain). target.enumeration=subset (USDT focal; remaining nine
  class-level, §7). Source verified via WebSearch + captured 2026-05-31
