  null_event documenting the EU Council's 2024-12-16 adoption of Council
  Regulation (EU) 2024/3192 — the 15th package of restrictive measures
  against Russia. Per Council press release and outside-counsel
  summaries (Mayer Brown, White & Case, Curtis, Ashurst, Lexology), the
  15th package is "mostly technical" and focuses on three vectors:
  (1) shadow-fleet vessel targeting — 52 new third-country vessel
  listings (cumulative 79); (2) individual / entity listings — 84 new
  designations (54 persons + 30 entities), including the first fully-
  fledged sanctions on Chinese actors supplying drone / microelectronic
  components to Russia; (3) military-industrial support companies — 32
  new firms (20 Russian, 7 Chinese/HK, 2 Serbian, 1 Iranian, 1 Indian,
  1 UAE).

  CRITICAL coding decision: the 15th package introduces NO material new
  on-chain or CASP-level provisions beyond the 12th-package Article 5aa
  CASP user-class prohibition (eu-12th-russia-sanctions-2023) and the
  14th-package SPFS / crypto-services tightenings
  (eu-14th-russia-sanctions-spfs-2024). The crypto-relevant footprint is
  therefore the absorption of the 84 new entity designees into standing
  EU-/OFAC-listing screening at EU CASPs — a class-level action that is
  not separately replayable as an observed_change at this snapshot.

  empirical_shape=null_event and admission_tier=null_case per codebook
  §3 / §4: 0 observed_change layers. Per codebook §1 + §8.4 (default to
  more-conservative value), the offramp_cex row is coded as
  coverage_gap / attribution=none rather than observed_no_change because
  coverage is not_measured — no replayable artifact of CASP behavioral
  change attributable specifically to the 15th package has been
  captured. This follows the codebook §3 null_event admission rule
  branch: coverage_gap with attribution in {unknown, none} and
  coverage=not_measured (not mixed with observed_no_change). The
  package's role in the corpus is as a circumvention-tightening
  supranational anchor sibling to the 12th and 14th packages.

