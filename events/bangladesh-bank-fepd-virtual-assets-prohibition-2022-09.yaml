analysis_notes: |
  **NEW EVENT AUTHORED -- AGENT_DRAFT 2026-05-31**. Created from the P4
  census-gap queue after exact-candidate review found that the previously
  closed 2017 Bangladesh warning row did not cover the stronger official
  Bangladesh Bank FE Circular No. 24 issued on 2022-09-15. The event remains
  `status=draft` and `origin=agent_draft`; automation must not promote it to an
  admitted paper row without human admission review.

  Inclusion rationale: this is not coded as a soft consumer warning. The
  circular is an exercise of Bangladesh Bank authority under Section 20(3) of
  the Foreign Exchange Regulation Act, 1947 and is addressed to banks,
  authorized FX dealers, MFS providers, financial institutions, and FX
  stakeholders. It prohibits virtual-asset / virtual-currency obtaining
  transactions in/from/to Bangladesh and facilitation of their
  exchange/transfer/trading, with FERA contravention consequences.

  Date/scope correction: the candidate pool framed this as a 2017/2021/2022
  reaffirmation. This draft keys only the operative 2022-09-15 FEPD circular.
  The 2021 public notice cited in the circular remains antecedent context, and
  the already-admitted 2014 Bangladesh Bank warning remains a separate
  historical-baseline null_case.

  Modeling rationale: `nation_state_block` is used for consistency with
  payment-rail prohibition events such as Turkey CBRT 2021 and Kuwait 2023.
  The measured layer is `offramp_cex` because the practical restriction is on
  regulated financial/foreign-exchange channels and facilitation of virtual
  asset exchange/transfer/trading, not a network block, frontend takedown,
  protocol change, or issuer-side asset freeze.

  Source note: a Wayback save attempt for the FEPD circular returned HTTP 523
  on 2026-05-31. The draft therefore relies on local body_hash/body_path replay
  anchors for the official PDFs.

scoped_claim: |
  On 2022-09-15, Bangladesh Bank's Foreign Exchange Policy Department issued FE
  Circular No. 24 prohibiting transactions made in/from/to Bangladesh for
  obtaining virtual assets or virtual currencies and prohibiting facilitation of
  business, activities, and operations associated with their
  exchange/transfer/trading. This draft models the action as a single-layer S4
  nation-state foreign-exchange / financial-rail restriction at offramp_cex; no
  L0/L1/L3/L4 or asset-onchain effect is claimed.

