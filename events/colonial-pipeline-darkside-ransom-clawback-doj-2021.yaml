analysis_notes: |
  **NEW EVENT AUTHORED - DRYRUN 2026-05-31** (P4 census-gap registry
  continuation). This draft repairs the prior P4 on-chain gate for the
  Colonial Pipeline / DarkSide clawback row. The official DOJ Wayback page
  substantiates the 63.7 BTC seizure, the Colonial Pipeline / DarkSide ransom
  context, the NDCA warrant, and the FBI private-key statement. The
  Paladin/Elliptic article provides the address linkage to
  bc1qq2euq8pw950klpjcawuy4uj39ym43hs6cfsegq. Blockstream and mempool.space
  API captures independently confirm the 2021-06-07 transaction history and
  the 63.7 BTC net outflow.

  Why draft: the event now has the required primary_onchain tx hash for the
  asset_onchain layer, but automation cannot provide human admission or
  final attribution review. Attribution remains plausible rather than direct
  because the on-chain transaction is linked to the government seizure by
  DOJ's legal statement plus a captured analytics article, not by an on-chain
  government label.

scoped_claim: |
  "DOJ/FBI's 2021-06-07 Colonial Pipeline DarkSide ransom clawback is
  represented by a one-address Bitcoin seizure draft: tx
  943f2d576ed8d9f388ba75eb82fe35cce29479b84121827ac368a5a94f44cf7a
  produced a 63.7 BTC net outflow from the address identified by
  Paladin/Elliptic as the DarkSide affiliate share address."

