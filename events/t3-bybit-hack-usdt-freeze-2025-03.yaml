analysis_notes: |
  **NEW EVENT AUTHORED -- AGENT_DRAFT 2026-06-01.** This is a date/scope-corrected
  replacement for the prior held registry row `tether-bybit-hack-lazarus-freeze-2025-02`.
  The earlier row was based on an inaccessible/press-only 181k-USDT claim and lacked
  address or tx anchors. This draft uses a stronger source chain: Tether's primary
  2025-03-26 T3 FCU announcement, the public Bybit/LazarusBounty address API, 13 TRON
  USDT AddedBlackList receipts, five Ethereum USDT AddedBlackList receipts, and local
  usdtbanlist tracker captures.

  This remains `status=draft` and `origin=agent_draft`; automation must not promote it
  to an admitted paper row without human admission review.

  Scope discipline: the event does not claim to exhaust Tether's nearly-$9M operation.
  Pinned tracker balances sum to 7,454,738.93 USDT across the 18-address subset, while
  the Tether aggregate is larger. The draft therefore uses `target.enumeration=subset`
  and `asset_onchain=partially_measured`. It records the first pinned blacklist receipt
  as the trigger timestamp and treats the public 2025-03-26 Tether article as the
  disclosure/source anchor, not as the first freeze time.

scoped_claim: |
  "T3 FCU/Tether froze a measured subset of Bybit-hack-linked USDT addresses between
  2025-03-01 and 2025-03-21, with 18 Bybit/LazarusBounty API addresses pinned to
  USDT AddedBlackList receipts on TRON and Ethereum. Tether's 2025-03-26 primary
  announcement reports the broader operation as nearly $9M; this draft carries only
  the pinned subset and remains non-admitted pending human review."

