  comparison shape: 1 observed_change layer (offramp_cex, attribution=plausible).
  On 2021-09-09 the Nepal Rastra Bank (central bank) issued an official Foreign
  Exchange Management Department notice declaring the transaction, usage, and
  mining of all cryptocurrency illegal in Nepal, with violators subject to
  prosecution under the Foreign Exchange (Regulation) Act and the Act
  Restricting Investment Abroad. This escalates the 2017 bitcoin/exchange
  prohibition (sibling event nepal-nrb-bitcoin-ban-2017-08) into a comprehensive
  prohibition covering trading, usage, and mining of all crypto.

  §9 inclusion: in scope — a nation-state deliberately prohibiting and
  criminalizing access to crypto for an entire population (a comprehensive ban,
  the §9 "INCLUDE: nation-state bans / payment-rail prohibitions" category). Not
  a scam prosecution and not a soft advisory — it is a binding prohibition with
  criminal consequence, distinct from the earlier (excluded) 2014 central-bank
  warning class.

  Distinct from the 2017 sibling: the 2017 notice (nepal-nrb-bitcoin-ban-2017-08)
  banned bitcoin/exchange transactions and was enforced via arrests of exchange
  operators; this 2021-09-09 notice broadens the prohibited surface to usage and
  mining of ALL cryptocurrency. Different date, different (broader) scope, own
  primary instrument — not a dup.

  trigger.type=regulatory_enforcement + research_stratum=S4_nation_state per
  codebook §5.1/§5.2, matching the sibling nepal-2017 coding (NRB is a non-US
  national regulator issuing an administrative prohibition notice, not an ISP/DNS
  block per se).

  attribution=plausible per §1.5: the official NRB PDF is image-only (its body
  text is not machine-extractable), so the load-bearing scope claim (transaction
  + usage + mining declared illegal) is carried by the contemporaneous Himalayan
  Times report; per-event downstream cascade (named-exchange retreat, ISP-level
  blocking) is not separately measured here. admission_tier=empirical_case (≥1
  strong-attribution observed_change layer). L0 coded not_applicable: no
  replayable network-measurement slice is pinned for any later ISP block.

