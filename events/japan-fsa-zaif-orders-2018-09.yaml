  Comparison documenting Japan's 2018-09-25 FSA 業務改善命令
  (business-improvement order, the third 2018 order to Tech Bureau
  after 2018-03-08 and 2018-06-22) against Tech Bureau, Inc., the
  Osaka-based operator of the Zaif crypto-asset exchange, following
  the 2018-09-14 Zaif hack in which approximately ¥7 billion
  (~USD 60-67M) of Bitcoin (BTC), Bitcoin Cash (BCH), and
  Monacoin (MONA) was stolen. The cascade culminated in a forced
  corporate restructuring under which Fisco Cryptocurrency Exchange
  (Fisco Ltd subsidiary) injected ¥5B and acquired Zaif's exchange
  business and customer assets in late 2018, with Tech Bureau
  ceasing independent operations thereafter.

  Paper-relevant contrast vs Coincheck FSA orders
  (japan-fsa-coincheck-orders-2018): both are JP FSA reactive
  single-entity supervisory cascades triggered by exchange security
  failures with offramp_cex load-bearing axes. The Coincheck case
  drove a ~5-month withdrawal freeze under a single-issuance
  business-improvement-then-suspension order pair followed by
  Monex Group acquisition; the Zaif case escalated through a
  three-order sequence within calendar 2018 culminating in a
  forced Fisco asset-and-business transfer (rather than a
  voluntary acquisition under the prior operator). Both confirm
  the registered-VASP supervisory rail as the JP nation-state
  load-bearing axis post-Mt-Gox.

  Cross-reference: japan-fsa-six-exchange-orders-2018-06 — the
  2018-06-22 FSA cohort order to six registered VASPs (including
  Tech Bureau's second 2018 order) is the prior-step in the
  Zaif-specific cascade and the contextual baseline against which
  the 2018-09-25 third order escalates.

  DRYRUN caveats: trigger primary citation (FSA Heisei-30
  press-release index) is asserted with a 2018-calendar-folder
  Wayback pointer; pinned snapshot timestamp and body_hash capture
  for the specific 2018-09-25 業務改善命令 release permalink is
  deferred to the human-audit pass. For non-DRYRUN release,
  capture body_hash + body_path for: (1) the FSA's 2018-09-25
  business-improvement-order release page, (2) Zaif's
  withdrawal-suspension customer-notice page, (3) Tech Bureau's
  2018-09-14 hack-disclosure announcement and BTC/BCH/MONA loss
  composition, (4) the Fisco Cryptocurrency Exchange acquisition
  announcement and ¥5B investment terms. All citations marked
  evidence_use=contextual_unarchived to flag the unarchived state
  per validator policy.

