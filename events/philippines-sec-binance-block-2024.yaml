analysis_notes: |
  **NEW EVENT AUTHORED - DRYRUN 2026-05-16** (Phase 4 of 2026-05-16 staged-release plan, promoted from candidate_triggers/philippines-sec-binance-block-2024.yaml per Agent C #5): authored end-to-end by LLM agent from the candidate stub. Both observed_change layers (l0_network, offramp_cex) anchored on the SEC advisory plus GMA News press coverage of the 2024-03-25 NTC blocking order. L0 source is intentionally marked evidence_use=contextual_unarchived because a follow-up OONI Probe PH / Censored Planet batch query for binance.com over 2024-03-25 to 2024-04-25 was not executed in this session. Once that batch pull lands and measurement_ids are pinned in the l0_network observation source block via a semi_primary_measurement source, the row promotes to admission-anchor-grade and admission_tier can be re-evaluated. Status remains draft pending (a) OONI follow-up, (b) archiving the SEC advisory and Binance corporate notice into sources/http_captures/philippines-sec-binance-block-2024/, and (c) human review. For a real release, replace this DRYRUN marker after human audit and flip origin to human_reviewed and status to admitted.

      comparison documenting the Philippines NTC's 2024-03-25 ISP-level
  blocking of Binance access following the November 2023 SEC Notice of
  Warning. Structurally distinct from the India 2018 RBI banking-rail ban
  (offramp-only), the Turkey 2021 CBRT payment-services ban (offramp-only),
  and the Korea 2022 Travel Rule (metadata-layer): the Philippines event is
  load-bearing at L0 (network reachability) - it is a state-mandated DNS /
  TCP block of a single global exchange domain rather than an industry-wide
  banking severance. This makes it one of the cleanest paper candidates in
  the corpus for documenting nation-state network-layer crypto censorship,
  pending the OONI measurement follow-up.

scoped_claim: |
  "The 2024-03-25 Philippines NTC blocking order, following the 2023-11
  SEC Notice of Warning Against Binance, severed PH-vantage network access
  to binance.com / binance.org and closed Binance PHP peso on/off-ramps to
  Philippine users. Observational axes at l0_network (PH-ISP blocking) and
  offramp_cex (PHP rail closure). L0 admission-anchor-grade promotion
  pending OONI Probe PH / Censored Planet follow-up batch query."

