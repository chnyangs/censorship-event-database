analysis_notes: |
  NEW EVENT AUTHORED — DRYRUN 2026-05-16. Phase B of the 2026-05-16
  staged-release plan, historical_baseline_2013_2016 tier fill.

  FinCEN FIN-2013-G001 ("Application of FinCEN's Regulations to
  Persons Administering, Exchanging, or Using Virtual Currencies,"
  issued 2013-03-18) is the foundational regulatory predicate for
  the 2013-2016 US MSB-registration enforcement era. The guidance
  interprets FinCEN's BSA money-transmitter regulations as applied
  to virtual currency and defines (a) users as not regulated, (b)
  exchangers as MSBs, and (c) administrators as MSBs. It is cited
  as authority in nearly every subsequent S3 enforcement against a
  US-resident VC exchanger in the historical-baseline tier
  (Shrem/Faiella 2014, Powell 2014, Ripple/XRP II 2015, Murgio/
  Coin.mx 2015) and continues to anchor 2017+ comparable-analysis
  enforcement (BitMEX 2020 FinCEN concurrent action, Helix 2020
  FinCEN consent assessment, Binance 2023 FinCEN settlement).

  Why null_event / null_case / coverage_gap: this event's load-
  bearing function is predicate-establishing rather than cascade-
  producing. The substantive regulatory effect — bringing the
  US-resident VC-exchanger class under BSA MSB registration and
  AML-program obligations — unfolds dispersedly across the
  2013-2016 enforcement era rather than as a single observable
  point-in-time CEX cessation directly attributable to the
  guidance alone. The cascade-shape grammar of the schema does
  not natively express class-level predicate-establishing
  regulatory guidance, so this event is coded honestly as
  null_event (0 observed_change layers) / null_case (0 strong-
  attribution observed_change), with the single observation row
  expressing the class-level coverage_gap. The downstream
  enforcement events carry the load-bearing observed_change rows
  in their own event files.

  Why historical_baseline tier: events 2013-2016 belong to the
  historical_baseline_2013_2016 temporal tier per the 2008+ tiered
  frame in sampling/frame.yaml. analysis_use=historical_baseline
  excludes this row from the 2017+ comparable-analysis denominator,
  matching the validator's tier-vs-analysis-use consistency rule.
  (The user's authoring brief suggested analysis_use=contextual_baseline,
  but that value is not in the vocabulary; historical_baseline is
  the correct historical-tier mapping per sampling/frame.yaml.)

  Schema-enum surprises encountered during authoring:
  - target.kind has no regulatory_class enum; fell back to
    target.kind=entity with target.enumeration=subset and an
    enumeration_note that records the class-level character.
  - trigger.type has no regulatory_guidance enum; used
    trigger.type=fincen_action (the canonical FinCEN trigger
    type, also used by ripple-fincen-xrp-2015).
  - empirical_shape has no case_study enum; mapped the class-
    level predicate-establishing posture to null_event +
    null_case + observation_kind=coverage_gap.
  - observation_kind has no not_observed enum; used coverage_gap
    with attribution=none. coverage_gap is only retained on
    status=draft per the validator (line 1222); the event is
    explicitly draft and stays so until either (a) the predicate
    role is rewritten as observed_no_change with a falsifiable
    window scope, or (b) the event is retired in favor of the
    downstream enforcement rows that already carry load-bearing
    observed_change.

  status remains draft until a human review decides whether to:
  (1) admit the event as null_case at empirical_case=null_event
      after rewriting the predicate observation as
      observed_no_change with a falsifiable 2013-03-18 to 2016-12-31
      scope_descriptor and a replayable archival anchor (since
      coverage_gap is not admitted), or
  (2) retire this event entirely and let the downstream enforcement
      events (Shrem/Faiella 2014, Powell 2014, Ripple/XRP II 2015,
      Murgio/Coin.mx 2015) carry the historical-baseline anchor
      function on their own, with FIN-2013-G001 cited as predicate
      in their analysis_notes rather than as a free-standing event.

  Origin=agent_draft and status=draft per the agent-authoring
  convention.

scoped_claim: |
  FinCEN FIN-2013-G001 (2013-03-18) interpreted the Bank Secrecy
  Act's money-transmitter regulations to apply to virtual-currency
  exchangers and administrators, establishing the foundational
  regulatory predicate for the 2013-2016 US MSB-registration
  enforcement era. observation_kind=coverage_gap with attribution=
  none because the substantive cascade is dispersed across
  downstream enforcement actions (Shrem/Faiella 2014, Powell 2014,
  Ripple/XRP II 2015, Murgio/Coin.mx 2015) that each cite this
  guidance as predicate, rather than localized to a single
  observable point-in-time CEX cessation. Historical-baseline tier;
  not used in main statistical denominators.

