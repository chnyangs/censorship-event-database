  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). On ~2026-04-23 Tether
  froze ~$344M USD₮ across two Tron addresses attributed to the Central
  Bank of Iran (links to the IRGC-Qods Force and Hizballah), in
  coordination with OFAC and U.S. law enforcement — described by TRM Labs
  as the largest on-chain freeze of Iranian sovereign crypto reserves on
  public record. comparison shape, single asset_onchain observed_change,
  attribution=direct per §1.2 (Tether's own freeze carries the asset-layer
  change and OFAC names the specific CBI target wallets). jurisdiction
  corporate_global (Tether action) + US (OFAC) + IR (target). NOTE for
  human reviewer: asset_onchain now carries primary_onchain tx hashes and
  the complete OFAC address set, but admission is still human-gated.
  ANTI-FABRICATION: the per-address $213M/$131M split and the verbatim
  "Operation Economic Fury" phrasing are NOT asserted here because they
  are NOT present in the captured pages; what the captures DO support is
  asserted ($344M / $344.2M, two
  addresses, Central Bank of Iran, IRGC-Qods Force, Hizballah, largest
  on-chain freeze, ~$370M / ~1,000 tx since March 2021). Sources verified
  via WebSearch + captured 2026-05-31 (Tether.io primary + OFAC primary
  legal + TRM Labs, body_hash-pinned; tx hashes and addresses verified
  from OFAC + TronGrid, not inferred).

scoped_claim: |
  "On 2026-04-23 at 12:02:36 UTC, Tether blacklisted two Tron USDT
