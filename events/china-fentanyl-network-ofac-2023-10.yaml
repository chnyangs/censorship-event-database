analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources
  verified+captured, awaiting human admission).

  null_event documenting the 2023-10-03 OFAC SDN designation of a large,
  primarily China-based illicit-drug-producer network (28 individuals/entities;
  jy1779) responsible for ton-quantities of fentanyl/meth/MDMA precursors, with
  16 crypto addresses across BTC/ETH/Tron used to receive ~$3.8M in
  drug-payment proceeds.

  Coded null_event / null_case per the S1 convention: the designation is the
  trigger, but no public CEX cascade was documented in the 14-day window. Per
  codebook §1.6 the named addresses are not coded as an asset_onchain
  observation absent a captured primary_onchain freeze tx_hash; the measurable
  surface is carried at offramp_cex (observed_no_change / none). Sources
  verified + captured 2026-05-31 (Treasury jy1779 + OFAC RA 20231003, both
  body_hash-pinned; no fabrication).

