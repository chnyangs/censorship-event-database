analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources verified+captured,
  awaiting human admission). Central Bank of Kenya Banking Circular No. 14 of 2015 (2015-12-18)
  directs regulated banks/MFIs not to open accounts for any person dealing in virtual
  currencies, with remedial action for non-compliance — a debanking directive (in scope per
  codebook §9; distinct from the same-day soft public notice, which alone would be
  out-of-scope advisory). Historical-baseline tier (2015). One observed_change layer
  (offramp_cex) -> empirical_shape=comparison. attribution=direct (codebook §1.1) — the
  circular is the primary legal instrument mandating the cut-off (nigeria-cbn precedent).
  DEDUP NOTE: the wave-1 candidate list carried two near-identical Kenya entries
  (kenya-cbk-virtual-currency-public-notice-2015-12 / kenya-cbk-virtual-currency-notice-2015-12);
  both describe THIS single CBK action and are consolidated here.

scoped_claim: |
  "Central Bank of Kenya Banking Circular No. 14 of 2015 (2015-12-18) directed regulated
