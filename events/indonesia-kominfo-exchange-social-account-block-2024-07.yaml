analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission).

  comparison documenting the July 2024 Kominfo wave (coordinated with Bappebti)
  blocking the Indonesian-facing social-media (Instagram) accounts of unlicensed
  foreign crypto exchanges — Binance, Kucoin, Bybit, Bitget — for operating
  without Bappebti registration. Accounts became inaccessible starting the week of
  2024-07-16.

  Dedup vs indonesia-bappebti-illegal-exchange-block-2023: that prior event covers
  the 2023-04 Bappebti-Kominfo block of foreign-exchange WEB/APP DOMAINS at the
  ISP level. This 2024-07 event is a distinct, later wave on a distinct surface —
  the exchanges' SOCIAL-MEDIA (Instagram) accounts — and is therefore authored as a
  separate event rather than a duplicate. The two are cross-linked via related_events.

  Per codebook §5.1, trigger.type=nation_state_block is the canonical fit (a
  nation-state platform-access takedown). Per §5.2, S4_nation_state is permitted.

  Per §9 inclusion boundary: in scope — a deliberate state action geofencing/blocking
  the Indonesian-facing public channels of legitimate (if locally-unlicensed)
  exchanges, restricting their access to Indonesian users.

  Why l4_frontend (not offramp_cex): the captured action is a takedown of the
  exchanges' public-facing social-media accounts, a frontend/public-surface block —
  not a rupiah banking-rail severance (that is the 2023 sibling event). asset_onchain
  and offramp_cex therefore not_applicable here.

  Why plausible (not direct): load-bearing captured prose is contemporaneous
  journalism (Tempo), not the Kominfo order; target is class-level. Conservative
  default (§8.4) -> plausible.

  Source discipline (anti-fabrication): the captured Tempo body names Binance,
  Kucoin, Bybit and Bitget; MEXC appears only in corroborating VOI/DFX journalism
  and is NOT asserted from the captured primary, so canonical_domains lists only the
  four confirmed in the captured body.

  Why temporal_tier=comparable_main_2017_present / analysis_use=
  comparable_analysis: 2024-07 sits in the 2017+ comparable corpus.

scoped_claim: |
  "Starting the week of 2024-07-16, Indonesia's Kominfo, coordinating with Bappebti,
  blocked the Indonesian-facing social-media (Instagram) accounts of unlicensed
  foreign crypto exchanges Binance, Kucoin, Bybit and Bitget. The l4_frontend layer
  carries the load-bearing plausible-attribution observation at class level. Distinct
  from the 2023 domain-block event."

