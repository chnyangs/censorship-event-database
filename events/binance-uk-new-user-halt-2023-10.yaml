analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). Binance's 2023-10-16
  decision to temporarily stop accepting new UK users to comply with the
  UK FCA financial-promotions regime, after its FCA-approved promotions
  approver Rebuildingsociety.com (REBS) was barred by the FCA on
  2023-10-10 from greenlighting crypto financial promotions. Single
  offramp_cex observed_change geofencing new-UK-user onboarding;
  comparison shape. attribution=plausible per §1.1: the onboarding halt
  is directly observed and Binance states FCA-promotions-regime
  compliance as the cause, but it is a self-imposed corporate compliance
  step (not a direct FCA order against Binance); the regulator-causation
  chain runs through the REBS approver bar, so class-level inference is
  retained. UK jurisdiction. Distinct from uk-fca-binance-markets-2021
  (the 2021 FCA consumer-warning/markets-cease-and-desist on Binance
  Markets Ltd) — this 2023 row is the financial-promotions-regime
  new-user onboarding halt. l0/l1/l3/l4/asset_onchain not_applicable (an
  onboarding/compliance restriction, not a network/UI block or asset
  freeze). NOTE for human reviewer: the captured Binance en-GB blog page
  is a JS shell with no article text, so it is NOT cited; the load-bearing
  source is The Block (body_hash-pinned). The "temporary" framing and
  search for a new approver are reported but the eventual resolution is
  not coded here. Sources verified via WebSearch + captured 2026-05-31
  (The Block, body_hash-pinned; no fabrication).

scoped_claim: |
  "Binance's 2023-10-16 halt on accepting new UK users (to comply with
  the FCA financial-promotions regime after its approver REBS was barred
  on 2023-10-10) severed the Binance off-ramp for new UK customers;
  single-layer offramp_cex observed_change, attribution=plausible (a
  self-imposed corporate compliance step, not a direct FCA order against
  Binance)."

