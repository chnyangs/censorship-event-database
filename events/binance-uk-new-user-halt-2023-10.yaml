analysis_notes: |
  **PRIMARY-SOURCE REPAIR 2026-06-01** (quality loop): pinned the official
  Binance Blog Wayback memento for "Update on Binance for UK users"
  (2023-10-16 15:28:36 UTC). The captured body contains the REBS/FCA financial-
  promotions background and the operative "from Monday 16 October 2023 at 5pm UK
  time, Binance will stop accepting new UK users" statement. This supersedes the
  earlier `attested_secondary` admission caveat; the row now has a first-party
  corporate trigger/observation anchor, and attribution for Binance's own
  onboarding halt is direct while the regulator-causation chain remains routed
  through REBS.

  **ADMITTED 2026-05-31** (genuine review by human:xiangwen reviewing agent:
  TASK-2 lower-tier at the time of admission; superseded by the 2026-06-01
  primary-source repair. §9-clear, deliberate restriction; verified clean in
  bulk adversarial-verify with no fabrication.)
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). Binance's 2023-10-16
  decision to temporarily stop accepting new UK users to comply with the
  UK FCA financial-promotions regime, after its FCA-approved promotions
  approver Rebuildingsociety.com (REBS) was barred by the FCA on
  2023-10-10 from greenlighting crypto financial promotions. Single
  offramp_cex observed_change geofencing new-UK-user onboarding;
  comparison shape. attribution=direct for Binance's own onboarding halt;
  the regulator-causation chain still runs through the REBS approver bar, so
  the row does not claim a direct FCA order against Binance. UK jurisdiction.
  Distinct from uk-fca-binance-markets-2021
  (the 2021 FCA consumer-warning/markets-cease-and-desist on Binance
  Markets Ltd) — this 2023 row is the financial-promotions-regime
  new-user onboarding halt. l0/l1/l3/l4/asset_onchain not_applicable (an
  onboarding/compliance restriction, not a network/UI block or asset
  freeze). The earlier 2026-05-31 Binance en-GB attempt produced a JS-shell
  caveat, but the 2026-06-01 Wayback memento contains the article body and is
  now cited directly. The "temporary" framing and search for a new approver are
  reported but the eventual resolution is not coded here. Sources verified via
  WebSearch + captured 2026-05-31/2026-06-01 (The Block and official Binance
  Blog, body_hash-pinned; no fabrication).

