analysis_notes: |
  **PRIMARY-SOURCE REPAIR 2026-06-01** — pinned official FSC English and Chinese
  press releases for the 2014-01-06 Bitcoin ATM / financial-institution
  restriction. Removed `evidence_tier=attested_secondary`, upgraded
  `primary_source_verified=true`, changed the off-ramp observation to
  `attribution=direct`, and narrowed the scoped claim to the official FSC text:
  banks and other financial institutions may not accept/exchange Bitcoin or
  provide Bitcoin-related services through bank ATMs. The prior Robocoin-specific
  language remains only as contemporaneous media context, not the official
  government claim.

  **ADMITTED 2026-05-31** (genuine review: TASK-2 lower-tier Pass 2. Rendered+grepped the captured source — core restriction substantiated (5/7-7/7 terms). The wave-1/2 VERIFY-FLAG was an OFAC-template "specific-address" boilerplate that does not apply to a national ban; removed. Initially admitted at evidence_tier=attested_secondary (§10), then upgraded by the 2026-06-01 primary-source repair above.)
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources
  verified+captured, awaiting human admission).

  Event: Taiwan Financial Supervisory Commission (FSC), jointly with the
  central bank, on 2014-01-06 barred local banks and financial institutions
  from accepting/exchanging bitcoin or providing Bitcoin-related services
  through bank ATMs. §9 INCLUDE:
  this is a payment-rail prohibition + denial of ATM service (a deliberate
  restriction of a financial-institution off-ramp surface), not a mere
  non-recognition statement. The "bitcoin is a virtual commodity not a
  currency" framing accompanies the order but the load-bearing fact is the
  active prohibition on banks dealing in/converting bitcoin.

  Why trigger.type=nation_state_block: closest enum for a single-country
  financial-regulator payment-rail prohibition (same enum as the sibling
  china-pboc-crypto-ban-2013-12 and russia-cbr-bitcoin-information-letter-2014
  historical-baseline events). §5.2 maps nation_state_block → S4_nation_state.

  Why historical_baseline tier / analysis_use=historical_baseline: 2014 falls
  in the historical_baseline_2013_2016 tier; excluded from the 2017+
  comparable-analysis denominator.

  Why empirical_shape=comparison / admission_tier=empirical_case: exactly one
  observed_change layer (offramp_cex) with direct attribution.

  Why attribution=direct: the official FSC English and Chinese press releases
  are pinned and directly state that banks and financial institutions may not
  accept/exchange Bitcoin or provide related bank-ATM services.

  Remaining caution: the official FSC pages were captured from live fsc.gov.tw
  using allow-insecure-tls because the local TLS validator rejected the FSC
  certificate chain. The replayable evidence is the pinned body_hash/body_path,
  not live URL availability.

scoped_claim: |
  "Taiwan's FSC on 2014-01-06 barred banks and financial institutions from
  accepting or exchanging Bitcoin and from providing Bitcoin-related services
  through bank ATMs. Effect carried at the offramp_cex (payment-rail) layer at
  institution-class level with direct attribution to the official FSC press
  release."

