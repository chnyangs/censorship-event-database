analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review: TASK-2 lower-tier Pass 2. Rendered+grepped the captured source — core restriction substantiated (5/7-7/7 terms). The wave-1/2 VERIFY-FLAG was an OFAC-template "specific-address" boilerplate that does not apply to a national ban; removed. Admitted at evidence_tier=attested_secondary (§10), single source, filterable.)
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources
  verified+captured, awaiting human admission).

  Event: Taiwan Financial Supervisory Commission (FSC), jointly with the
  central bank, on 2014-01-06 barred local banks and financial institutions
  from converting/accepting bitcoin or using it as a payment tool via ATMs,
  and refused to approve Robocoin bitcoin-ATM installations. §9 INCLUDE:
  this is a payment-rail prohibition + denial of ATM service (a deliberate
  restriction of a financial-institution off-ramp surface), not a mere
  non-recognition statement. The "bitcoin is a virtual commodity not a
  currency" framing accompanies the order but the load-bearing fact is the
  active prohibition on banks dealing in/converting bitcoin.

  Why trigger.type=nation_state_block: closest enum for a single-country
  financial-regulator payment-rail prohibition (same enum as the sibling
  china-pboc-crypto-ban-2013-12 and russia-cbr-bitcoin-information-letter-2014
  historical-baseline events). §5.2 maps nation_state_block → S4_nation_state.

  Why historical_baseline tier / analysis_use=historical_baseline: 2014 falls
  in the historical_baseline_2013_2016 tier; excluded from the 2017+
  comparable-analysis denominator.

  Why empirical_shape=comparison / admission_tier=empirical_case: exactly one
  observed_change layer (offramp_cex) with strong attribution (plausible).

  Why attribution=plausible (not direct): per codebook §1.5 and §8.4, the
  action is documented by contemporaneous press (semi_primary_wayback) quoting
  the FSC announcement, not by the FSC's own primary_legal order. The primary
  FSC instrument was not pinned in this draft pass; conservative default
  applied.

  Human audit follow-up: (i) re-pin the Taipei Times Wayback snapshot timestamp;
  (ii) locate the FSC's primary announcement (fsc.gov.tw press release,
  2014-01) to support elevation to direct; (iii) decide whether the Robocoin
  ATM denial warrants a separate enumerated target row.

scoped_claim: |
  "Taiwan's FSC on 2014-01-06 barred banks and financial institutions from
  bitcoin conversion/acceptance and from operating bitcoin ATMs, and refused
  Robocoin ATM installation. Effect carried at the offramp_cex
  (payment-rail) layer at institution-class level."

