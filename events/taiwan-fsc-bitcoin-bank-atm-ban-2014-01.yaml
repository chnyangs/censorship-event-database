      did not exist in 2014. not_applicable on construct-did-not-exist grounds.
  - layer: l4_frontend
    status: not_applicable
    note: |
      The FSC announcement does not direct takedown of specific frontends;
      the regulated surface is financial-institution acceptance/conversion and
      bank ATM service provision, not a web frontend. not_applicable on
      scope-mismatch grounds.
  - layer: asset_onchain
    status: not_applicable
    note: |
      Bitcoin native asset has no issuer-side blacklist/freeze admin method;
      USDT first issued ~2014-10 (postdates this event). not_applicable on
      construct-did-not-exist grounds.
  - layer: offramp_cex
    status: measured
    scope: [taiwan_bank_bitcoin_conversion_and_atm_payment_rails]
    note: |
      The FSC order directly barred Taiwan banks and financial institutions
      from accepting or converting bitcoin and from operating bitcoin ATMs as
      a payment tool. This is a payment-rail / off-ramp prohibition at the
      institution-class level. Marked measured for the scoped denominator:
      the official FSC press release defines the affected regulated class and
      prohibited service surface; it does not require a bank-by-bank roster.

