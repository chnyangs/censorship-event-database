analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-5 audit (S5 corporate, Tether
  pig-butchering second wave) by human:xiangwen. Verified-YES, promoted
  as-is: the trigger date 2024-06-01 (week precision) is CORRECT — the
  freeze occurred June 2024; the August-2025 Chainalysis dateline is only
  the retroactive disclosure date. NOT re-dated, NOT retracted. Admission
  rests on two independent semi-primary anchors at offramp_cex: Chainalysis
  (semi_primary_measurement, Wayback 20250901072225, c71999bb...) +
  Infosecurity Magazine (semi_primary_wayback, Wayback 20250828090302,
  d4301688...), supported by The Block (Wayback 20250829225833, fca19f79...)
  and cryptonews (Wayback 20250828210418, 0b942475...). offramp_cex
  observed_change attribution downgraded direct -> plausible: no Tether
  primary corporate freeze report or APAC-LE primary release was located,
  and semi-primary measurements alone warrant plausible, not direct.
  comparison/empirical_case preserved.

  **NEW EVENT AUTHORED — DRYRUN 2026-05-17**

  Second-wave Tether pig-butchering freeze, distinct from the
  tether-doj-pig-butchering-freeze-2023 sibling. Key distinctions:
    - Lead jurisdiction: APAC law enforcement (vs US DOJ/USSS/EDVA in 2023).
    - Lead intelligence partner: Chainalysis (vs DOJ EDVA civil forfeiture
      filing in 2023).
    - Magnitude: ~$46.9M-$49.6M (vs $225M in 2023).
    - Timing: June 2024 (vs 2023-11-20).
    - Cohort: APAC-traced five-terminal-wallet cluster (vs 37-39 wallets
      in the 2023 cohort).

  Attribution: `plausible`. Tether is named as the executing actor in the
  Chainalysis disclosure and the disclosure explicitly states the freeze
  was executed at law-enforcement direction, so the qualitative "actor
  publicly references trigger AND trigger names target" test from §1.1
  holds (Tether is publicly named as the freezer, the LE-traced wallet
  cohort is the named target). However, the evidence base is two
  independent semi-primary anchors (Chainalysis measurement + Infosecurity
  Wayback) with no primary_* source — no Tether-issued primary corporate
  freeze report or APAC-LE primary release enumerating the freeze
  transactions has been located. Per the admission rule that semi-primary
  measurements alone warrant `plausible` rather than `direct`, the
  observed_change is coded `plausible`.

  Evidence quality: the Chainalysis disclosure is pinned as a
  semi_primary_measurement source, but no primary Tether blog post or APAC
  LE press release has been located that enumerates the freeze transactions.
  The Chainalysis blog (August 2025) and corroborating journalism are the
  only public anchors. This event
  therefore qualifies as `empirical_case` on the strength of one
  observed_change `plausible` row at offramp_cex, but cannot be elevated to
  `anchor_case` without primary corporate / primary onchain anchors.

  Cascade shape: 1 observed_change layer (offramp_cex) → `comparison`.

scoped_claim: |
  "Tether's June 2024 freeze of ~$46.9M-$49.6M USDT linked to a Southeast
  Asia pig-butchering cohort traced by Chainalysis with APAC law-enforcement
  collaboration documents a second, APAC-led wave of issuer-driven scam
  freezes — distinct from the 2023 US-DOJ-led $225M freeze in lead
  jurisdiction, lead intelligence partner, cohort, magnitude, and timing —
  and confirms that the DOJ-request-driven mode of stablecoin compliance
  generalises to non-US national / regional law-enforcement requests."

