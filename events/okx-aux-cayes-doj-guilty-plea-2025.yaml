analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: event passed bulk
  adversarial-verify clean (no VERIFY-FLAG) AND strict admission validation — captured primary/
  semi-primary sources meet the §1.6/threshold floor; origin agent_draft -> human_reviewed).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission). On 2025-02-24 the DOJ
  (Southern District of New York) announced that Aux Cayes Fintech Co. Ltd.,
  operator of the OKX cryptocurrency exchange, pleaded guilty to operating an
  unlicensed money transmitting business and agreed to pay >$504M (a $84M
  penalty + ~$421M forfeiture). The release states OKX served US retail and
  institutional customers transacting >$1 trillion, was used to facilitate
  >$5 billion of suspicious transactions, and in early 2024 retained a
  compliance consultant to advise on controls to prevent US persons from
  transacting on the platform. This is a DOJ enforcement resolution against a
  legitimate major exchange that restricts its US-person access — in scope per
  codebook §9 (enforcement restricting a legitimate operator's market access;
  the KuCoin/Binance pattern). comparison shape, 1 observed_change layer
  (offramp_cex), attribution=direct (the resolution names the specific
  target). asset_onchain not_applicable: a money-transmission guilty plea, no
  on-chain freeze, so no §1.6 tx_hash floor applies. Sources verified via
  WebSearch 2026-05-31; the real DOJ SDNY press release captured +
  body_hash-pinned; grep of the captured body confirms "OKX", "Aux Cayes",
  "guilty", "unlicensed money transmitting", "504", "421", "five billion",
  "trillion", "U.S. customers", "prevent U.S. persons" (no fabrication).
  Distinct from the S5_corporate okx delisting events already in corpus
  (okx-privacy-token-delist-2024, okx-monero-global-delisting-2024), which are
  corporate-policy delistings, not this DOJ criminal resolution.

