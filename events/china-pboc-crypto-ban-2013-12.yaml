trigger:
  type: nation_state_block
  actor: CN_PBOC
  timestamp: 2013-12-05T00:00:00Z
  timestamp_precision: day
  citation:
    - type: primary_legal
      url: http://www.pbc.gov.cn/goutongjiaoliu/113456/113469/2982357/index.html
      wayback: https://web.archive.org/web/2014/http://www.pbc.gov.cn/goutongjiaoliu/113456/113469/2982357/index.html
      evidence_use: contextual_unarchived
      note: |
        PBOC original publication of Notice 2013/289 (公告 [2013]289号 /
        "Notice on Preventing Bitcoin Risks" / 关于防范比特币风险的通知),
        issued 2013-12-05 jointly by five PRC ministries: People's Bank
        of China (PBOC), Ministry of Industry and Information Technology
        (MIIT), China Banking Regulatory Commission (CBRC), China
        Securities Regulatory Commission (CSRC), and China Insurance
        Regulatory Commission (CIRC). Core provisions: (1) classified
        Bitcoin as a "virtual commodity" rather than legal-tender
        currency; (2) prohibited financial institutions and payment
        service providers from buying/selling Bitcoin or providing
        Bitcoin-related custody, payment, conversion, or insurance
        services; (3) required Bitcoin exchanges to register with MIIT
        as "internet information service providers" and to comply with
        anti-money-laundering identification rules; (4) directed banks
        to refuse Bitcoin-related accounts. The pbc.gov.cn URL path
        format has changed since 2013; the provisional wayback
        anchor uses Wayback Machine year-prefix lookup and the specific
        capture timestamp requires re-pinning during human audit before
        this citation may serve as an admission anchor in its own right.
        Marked evidence_use=contextual_unarchived pending that re-pin.
    - type: primary_legal
      url: http://www.gov.cn/gzdt/2013-12/05/content_2542584.htm
      evidence_use: contextual_unarchived
      note: |
        State Council (gov.cn) reproduction of the joint five-ministry
        announcement of Notice 2013/289 on 2013-12-05. Marked
        evidence_use=contextual_unarchived; the live gov.cn URL has
        path-format drift since 2013 and the specific Wayback snapshot
        timestamp is to be re-pinned during human audit.
    - type: supporting_tracker
      url: https://www.loc.gov/item/global-legal-monitor/2014-01-13/china-regulators-issue-notice-on-bitcoin-risks/
      wayback: https://web.archive.org/web/2020/https://www.loc.gov/item/global-legal-monitor/2014-01-13/china-regulators-issue-notice-on-bitcoin-risks/
      evidence_use: contextual_unarchived
      note: |
        US Library of Congress Global Legal Monitor entry titled
        "China: Regulators Issue Notice on Bitcoin Risks" dated
        2014-01-13, providing an English-language summary of Notice
        2013/289 and naming all five issuing PRC ministries. Used
        here as a contextual translation anchor; the live loc.gov URL
        format is stable and routinely captured by Wayback, but the
        specific snapshot timestamp is to be re-pinned during human
        audit. Marked evidence_use=contextual_unarchived pending that
        re-pin.
  timestamp_sources:
    - type: primary_legal
      note: |
        Notice 2013/289 carries a 2013-12-05 issuance date. The notice
        text and all contemporaneous Chinese-language and English-language
        secondary coverage agree on the 2013-12-05 publication day.
        Day-level precision is appropriate because the PRC ministerial
        joint notice does not carry intra-day publication timing in the
        public record.

target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    Canonical target is the PRC policy directive itself, addressed to
    (a) Chinese financial institutions and payment service providers
    (prohibited from Bitcoin-related services), and (b) Chinese
    Bitcoin exchanges (required to register with MIIT and apply AML
    identification). Named affected exchanges in the 2013-12 window
    include BTC China (btcchina.com), OKCoin (okcoin.cn / okcoin.com),
    and Huobi (huobi.com); these are recorded as implicit second-order
    targets in observations.scope_descriptor rather than enumerated
    in canonical_domains, matching the sibling
    china-pboc-crypto-ban-2021 convention.
  protocol: null
  actor_type: chinese_crypto_ecosystem
  actor_name: PRC financial-institution + exchange ecosystem (class)
  chains:
    - bitcoin
  canonical_domains: []

jurisdiction:
  - CN

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      Notice 2013/289 does not direct ISP-level domain blocking or
      DNS interference. PRC network-layer blocking of crypto-exchange
      domains is a downstream and later phenomenon (2017+ phased ISP
      action against domestic exchanges; broader 2021 enforcement) that
      is not part of this 2013-12-05 trigger. L0 marked not_applicable
      consistent with India 2018 / Nigeria 2021 / Turkey 2021 sibling
      treatment of banking-and-exchange-rail nation-state events.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Bitcoin proof-of-work consensus in 2013-12 has no protocol-level
      relay-filter primitive analogous to the post-Merge Ethereum PBS
      relay surface. The Ethereum Merge itself is ~9 years downstream
      (2022-09-15). not_applicable on construct-did-not-exist grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      The MEV-Boost / Flashbots Protect / MEV-Blocker public-RPC
      compliance substrate that the L3 layer measures did not exist in
      2013; Flashbots Protect launched 2022-11 and MEV-Blocker launched
      2023-03-27. not_applicable on construct-did-not-exist grounds,
      consistent with the L3 treatment in china-pboc-crypto-ban-2021
      and other pre-Merge nation-state events.
  - layer: l4_frontend
    status: not_measured
    scope:
      - btcchina.com
      - okcoin.cn
      - huobi.com
    note: |
      Chinese Bitcoin exchange frontends (BTC China, OKCoin, Huobi) did
      add Bitcoin-trading-paused and CNY-deposit-paused notices on
      their homepages within ~2 weeks of the PBOC notice, per
      contemporaneous Chinese and English crypto-press coverage.
      Wayback bracketing of those homepage snapshots is plausibly
      feasible (Wayback CDX coverage of btcchina.com and huobi.com in
      2013-12 / 2014-01 is non-trivial) but the specific snapshot URLs
      have not been pinned in this authoring pass. L4 status remains
      not_measured pending the Wayback-capture pass that an admission
      anchor at this layer would require; that pass is a follow-up
      task and is also the gating step for promoting this event from
      empirical_case to anchor_case.
  - layer: asset_onchain
    status: not_applicable
    note: |
      Bitcoin native asset has no issuer-side blacklist / freeze admin
      method. The 2013 directive does not engage a stablecoin-issuer
      admin path (USDT first issued ~2014-10; chainwide admin freezes
      arose later). not_applicable on construct-did-not-exist grounds.
  - layer: offramp_cex
    status: measured
    scope:
      - btc_china
      - okcoin
      - huobi
    note: |
      Notice 2013/289 is by construction an off-ramp / financial-rail
      event: it directs PRC banks and payment companies to refuse
      Bitcoin-related accounts and prohibits institutional Bitcoin
      services. Within ~13 days of the notice (by ~2013-12-18) the three
      dominant PRC Bitcoin exchanges of the period (BTC China, OKCoin,
      Huobi) paused new CNY deposits in compliance, an action widely
      documented in contemporaneous Chinese and English crypto press.
      The PBOC notice text itself names the regulatory mandate, giving
      direct attribution at this layer. Marked measured; load-bearing
      observation attached below as observation_kind=observed_change
      with attribution=direct.

