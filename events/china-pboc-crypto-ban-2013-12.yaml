analysis_notes: |
  **REPAIRED 2026-06-01** (quality loop). The previous row depended on
  contextual/year-prefix source pointers and described a later
  exchange-side CNY-deposit pause that was not independently pinned in the
  row. This repair captures official PBOC and MIIT artifacts and narrows the
  observation to the five-ministry notice's directly stated financial/payment
  institution Bitcoin-service prohibition.

  Method boundary: this is a historical-baseline S4 nation-state
  banking/payment-rail restriction. It should not be cited as a separately
  measured BTC China / OKCoin / Huobi CNY-deposit-pause event unless a future
  pass pins exchange-side announcements or contemporaneous replayable
  exchange-specific sources.

  Live URL drift handling: the legacy pbc.gov.cn and gov.cn paths in the old
  row had drifted or returned 404. The retained replay path is now local
  body_hash/body_path capture of the current PBOC official landing page, PBOC
  official PDF, and MIIT official full-text notice.

scoped_claim: |
  "On 2013-12-05, PBOC, MIIT, CBRC, CSRC, and CIRC issued Notice
  银发〔2013〕289号, prohibiting PRC financial institutions and payment
  institutions from providing Bitcoin-related services. In this dataset the
  row is a one-layer historical-baseline S4 offramp_cex/payment-rail
  observed_change with attribution=direct, anchored in captured official
  PBOC/MIIT artifacts. It does not claim ISP blocking, consensus-layer
  effects, RPC-provider filtering, issuer asset freezes, or a separately
  measured exchange-frontend/CNY-deposit cascade."

scoped_knowledge: |
  This is the 2013 PRC first-touch banking/payment-rail restriction that
  precedes the stronger 2021 PRC virtual-currency-business ban. The retained
  longitudinal contrast is narrow: 2013 excludes regulated financial and
  payment institutions from Bitcoin-related services while still treating
  Bitcoin as a virtual commodity; 2021 escalates to a broader prohibition on
  virtual-currency business activities. Exchange-side operational reactions
  belong in separate rows or future evidence upgrades if pinned.

