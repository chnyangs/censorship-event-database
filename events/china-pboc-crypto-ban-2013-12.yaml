coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      Notice 银发〔2013〕289号 is a financial/payment-rail directive, not an
      ISP, DNS, IP, or routing block.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Bitcoin consensus rules were not changed and no validator or mining
      censorship primitive is asserted.
  - layer: l3_rpc
    status: not_applicable
    note: |
      The 2013 Bitcoin banking-rail directive predates the Ethereum
      RPC/MEV-era provider-compliance substrate tracked by the L3 layer.
  - layer: l4_frontend
    status: not_measured
    scope:
      - btcchina.com
      - okcoin.cn
      - huobi.com
    note: |
      Exchange-facing website notices and CNY-deposit interruptions may be
      measurable in contemporaneous exchange pages or press, but this repaired
      row does not retain an L4 observation because no exchange-controlled UI
      archive is pinned here.
  - layer: asset_onchain
    status: not_applicable
    note: |
      Bitcoin has no issuer-admin blacklist or freeze primitive; the notice
      did not invoke any on-chain asset-control mechanism.
  - layer: offramp_cex
    status: measured
    scope:
      - prc_financial_institutions
      - prc_payment_institutions
    note: |
      Load-bearing layer. The notice requires financial institutions and
      payment institutions not to price products/services in Bitcoin, buy or
      sell Bitcoin, underwrite Bitcoin-related insurance, or directly/indirectly
      provide Bitcoin registration, trading, clearing, settlement, payment,
      exchange, custody, collateral, or Bitcoin-related financial-product
      services.

