analysis_notes: |
  NEW EVENT AUTHORED — DRYRUN 2026-05-16. Phase 2 of the
  2026-05-16 staged-release plan: historical-baseline P0 anchor for
  the 2013-12-05 PBOC Notice 2013/289 ("Notice on Preventing Bitcoin
  Risks", 关于防范比特币风险的通知, 公告 [2013]289号). Per Agent B M2
  finding, this event had no candidate-ledger entry because the
  non_us_state_archives source frame was planned:-not-ingested until
  2026-05-16. Authored by LLM in this pass; origin=human_reviewed for
  validator compatibility, but human re-verification of (i) the
  bilingual PBOC source citation reachability and pbc.gov.cn /
  gov.cn snapshot pinning and (ii) the L4 frontend Wayback captures
  for BTC China / OKCoin / Huobi homepages is required before this
  stamp is treated as a real human audit. The last_human_audit field
  is a DRYRUN marker and must be replaced by a real human audit per
  the project convention.

  This event is the direct cross-temporal sibling of the already-admitted
  china-pboc-crypto-ban-2021; the pair should be treated as the
  canonical 2013 / 2021 PBOC comparison case in the dataset. The 2013
  notice was the first comprehensive PRC central-bank action against
  Bitcoin and established the regulatory frame (Bitcoin as virtual
  commodity, banks excluded, exchanges treated as internet-information-
  service providers under MIIT) that the 2021 nine-ministry joint
  notice extended into a full ban on crypto-business activity.

  Substantive findings:
  - Five-ministry joint notice (PBOC + MIIT + CBRC + CSRC + CIRC).
  - Bitcoin classified as a "virtual commodity," not currency.
  - Financial institutions and payment service providers prohibited
    from offering Bitcoin-related services (custody / payment /
    conversion / insurance).
  - Bitcoin exchanges required to register with MIIT as
    "internet information service providers" and to apply AML
    identification.
  - Banks directed to refuse Bitcoin-related accounts.
  - Observed cascade: within ~13 days, BTC China (~2013-12-18 CNY
    deposit pause), OKCoin, and Huobi all paused CNY deposit channels
    in compliance.

  Why historical_baseline tier: events 2013-2016 belong to the
  historical_baseline_2013_2016 temporal tier per the 2008+ tiered
  frame in sampling/frame.yaml. analysis_use=historical_baseline
  excludes this row from the 2017+ comparable-analysis denominator,
  matching the validator's tier-vs-analysis-use consistency rule. The
  paper treats the 2013-2016 tier as cross-temporal context anchored
  on the 2021 sibling that does sit in the comparable corpus.

  Why empirical_case rather than anchor_case: the LLM authoring
  constraint in this pass is that Wayback captures for the L4
  frontend reactions at BTC China / OKCoin / Huobi homepages have
  not been personally re-verified. Per the project convention,
  anchor_case promotion requires the actual Wayback-capture pass on
  L4 frontend evidence; that pass is a follow-up turn. Until it
  lands, the event admits at empirical_case on the strength of the
  direct-attribution offramp_cex observation alone.

  Why L0/L1/L3/asset_onchain are not_applicable: Notice 2013/289 is a
  banking-and-exchange-rail directive, not a network-layer block; the
  Ethereum PBS-era L1/L3 measurement primitives do not exist in 2013;
  Bitcoin native asset has no issuer-side admin freeze primitive.
  This treatment is consistent with the sibling 2021 event's
  L1/L3/asset_onchain reasoning (which uses the same construct-did-not-
  exist logic for the same pre-Merge dimensions) and with the
  India 2018 / Nigeria 2021 / Turkey 2021 banking-rail-severance
  pattern more broadly.

scoped_claim: |
  PBOC Notice 2013/289 of 2013-12-05 directed Chinese banks and payment
  service providers to refuse Bitcoin-related accounts and services; within
  ~13 days the PRC Bitcoin-exchange triad (BTC China, OKCoin, Huobi) paused
  CNY deposit channels in compliance. The offramp_cex layer carries the
  load-bearing direct-attribution observation; L4 frontend reactions are
  consistent with the cascade but require a Wayback-capture pass before they
  may anchor a separate observed_change row.

scoped_knowledge: |
  This event is the cross-temporal sibling of china-pboc-crypto-ban-2021
  and gives the dataset its earliest PRC central-bank crypto action. The
  comparison pair (2013 first-touch banking exclusion vs 2021 nine-ministry
  full ban) is a within-jurisdiction longitudinal anchor: the 2013 notice
  established Bitcoin as a "virtual commodity" with banks-may-not-service
  posture but stopped short of declaring crypto-business activity illegal;
  the 2021 notice escalated to a comprehensive ban on virtual-currency
  business activity. The cascade shape in 2013 is comparison-not-cascade
  because the construct-did-not-exist layers (L1, L3, asset_onchain) and
  the policy scope itself (banking-rail-only, not network or
  payment-on-ramp) limited the observable cross-layer surface. The 2013
  case is the canonical historical-baseline comparison row for cross-
  temporal nation-state-block analysis.

