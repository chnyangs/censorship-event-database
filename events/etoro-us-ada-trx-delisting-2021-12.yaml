analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). eToro announced
  (2021-11-23) it would remove US-customer access to Cardano (ADA) and
  Tron (TRX) effective 2021-12-26 (no new positions; staking removed),
  citing the evolving US regulatory environment — a US-scoped corporate
  delisting in the run-up to broader SEC scrutiny of crypto brokerages
  (later: sec-etoro-cease-crypto-trading-2024-09, cf. related_events).
  comparison shape, single offramp_cex observed_change.
  attribution=plausible: eToro's "regulatory concerns" statement is
  generic and no named US regulatory order designates ADA/TRX, so the
  securities-regulatory motive is class-level contextual inference (§1.1),
  conservatively coded plausible over direct per §8(4). ADA/TRX are
  independent base-chain assets, so l0/l1/l3/l4/asset_onchain are
  not_applicable. jurisdiction=US. Source verified via WebSearch + capture
  2026-05-31 (NewsBTC, body_hash-pinned; the US-only December 26 2021
  cutoff + staking removal grep-verified; no fabrication).

scoped_claim: |
  "eToro's 2021-12-26 removal of US-customer access to Cardano (ADA) and
  Tron (TRX) — no new positions, staking removed, citing the evolving US
  regulatory environment — severed the eToro brokerage off-ramp for these
  assets for US users; single-layer offramp_cex observed_change,
  attribution=plausible (generic 'regulatory concerns', no named order)."

