trigger:
  type: supranational_regulation
  actor: FATF
  timestamp: 2014-06-26T00:00:00Z
  timestamp_precision: day
  citation:
    - type: primary_legal
      url: https://www.fatf-gafi.org/content/dam/fatf-gafi/reports/Virtual-currency-key-definitions-and-potential-aml-cft-risks.pdf
      wayback: https://web.archive.org/web/2014/https://www.fatf-gafi.org/content/dam/fatf-gafi/reports/Virtual-currency-key-definitions-and-potential-aml-cft-risks.pdf
      evidence_use: contextual_unarchived
      note: |
        FATF report "Virtual Currencies — Key Definitions and Potential
        AML/CFT Risks," published 2014-06-26 by the Financial Action Task
        Force (FATF) plenary in Paris. The report is the first FATF
        instrument to engage virtual currencies (VC) substantively at
        the supranational standard-setting layer. It establishes a
        shared taxonomy ("virtual currency", "convertible / non-
        convertible VC", "centralised / decentralised VC", "exchanger",
        "administrator", "user", "miner") and a preliminary risk
        assessment of money-laundering and terrorist-financing exposures
        associated with virtual currency activity. The report is non-
        binding guidance — it does not amend the FATF Recommendations
        and does not impose Travel Rule or VASP obligations — but it
        establishes the conceptual scaffolding ("exchanger" as the
        regulatory locus, convertibility as the risk axis) that anchors
        the subsequent five-year regulatory development arc:
        (a) the 2015-06 FATF "Guidance for a Risk-Based Approach to
        Virtual Currencies"; (b) the 2018-10 FATF Recommendations
        amendments adding the VASP definition into the glossary;
        (c) the 2019-06-21 FATF Plenary adoption of the Interpretive
        Note to Recommendation 15 extending the Travel Rule to VASPs
        (fatf-r15-vasp-travel-rule-2019). This 2014 report is therefore
        the predicate guidance for the global FATF VASP regime.
        evidence_use=contextual_unarchived because body_hash + body_path
        archival capture was not pinned in this agent-authoring pass.
        Wayback anchor is a year-prefix bracket pending re-pin by the
        human auditor.
    - type: primary_legal
      url: https://www.fatf-gafi.org/en/publications/Methodsandtrends/Virtual-currency-definitions-aml-cft-risk.html
      wayback: https://web.archive.org/web/2014/https://www.fatf-gafi.org/en/publications/Methodsandtrends/Virtual-currency-definitions-aml-cft-risk.html
      evidence_use: contextual_unarchived
      note: |
        FATF publication landing page for the same June 2014 report,
        retained as a secondary anchor for the publication record. The
        landing page provides the canonical FATF citation metadata and
        served as the primary discovery surface in WebSearch verification
        for this authoring pass. evidence_use=contextual_unarchived;
        Wayback anchor is a year-prefix bracket pending re-pin.
  timestamp_sources:
    - type: primary_legal
      note: |
        Day-level precision per the 2014-06-26 publication date carried
        on the FATF report. DRYRUN: timestamp asserted from FATF public
        communications and corroborated via WebSearch; not personally
        archive-verified by the LLM agent at authoring time.

target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    Canonical target of this 2014 FATF report is the open-ended
    regulatory class of "virtual currency exchangers and administrators"
    as defined in the report glossary. Exchangers are "natural or legal
    persons engaged as a business in the exchange of virtual currency
    for real currency, funds, or other forms of virtual currency"; the
    report flags exchangers as the primary regulatory access point
    where AML/CFT obligations can be attached. Administrators are
    "persons engaged as a business in issuing/redeeming a centralised
    virtual currency". The class is open-ended by construction and
    operates at the supranational standard-setting layer; binding
    force is mediated entirely by downstream member-state
    implementation following the later 2019 R.15 INR adoption.
    Marked enumeration=subset rather than complete because the class
    is open-ended and pre-regime — the 2014 report names categories
    without enumerating member entities or addresses. actor_name
    labels the regulated class; no on-chain addresses or
    canonical_domains are enumerated because the report does not
    designate specific entities or hosts. Schema enum target.kind has
    no regulatory_class value; entity is the closest schema match and
    matches the precedent set by fincen-virtual-currency-msb-guidance-
    2013 and fatf-r15-vasp-travel-rule-2019.
  protocol: null
  actor_type: supranational_regulatory_class
  actor_name: "Virtual currency exchangers and administrators (global FATF class)"
  chains: []
  canonical_domains: []

jurisdiction:
  - UN

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The 2014 FATF report is supranational non-binding risk-framing
      guidance at the entity / regulatory-class level. It does not
      direct ISP-level domain blocking or DNS interference against
      any VC-related host. not_applicable on construct-out-of-scope
      grounds.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Bitcoin proof-of-work consensus in 2014-06 has no protocol-level
      relay-filter primitive analogous to the post-Merge Ethereum PBS
      relay surface that the L1 layer was constructed to measure. The
      Ethereum Merge itself is ~8 years downstream (2022-09-15).
      not_applicable on construct-did-not-exist grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      The MEV-Boost / Flashbots Protect / MEV-Blocker public-RPC
      compliance substrate that the L3 layer measures did not exist
      in 2014 (Flashbots Protect launched 2022-11; MEV-Blocker
      launched 2023-03-27). not_applicable on construct-did-not-exist
      grounds.
  - layer: l4_frontend
    status: not_applicable
    note: |
      The report does not require, name, or contemplate any VC-related
      frontend takedown or geo-blocking. The substantive
      recommendation surface is preliminary risk-framing for AML/CFT
      regulators — not a frontend takedown directive. Member-state
      downstream implementations may produce L4 effects, but not the
      FATF instrument itself. not_applicable on construct-out-of-
      scope grounds.
  - layer: asset_onchain
    status: not_applicable
    note: |
      The 2014 FATF report does not engage stablecoin-issuer or
      token-issuer admin-key freeze primitives. USDT was first issued
      ~2014-10 (four months later); chain-wide issuer admin freezes
      arose later still; the FATF VC report pre-dates the stablecoin
      admin-freeze regulatory frame entirely. not_applicable on
      construct-out-of-scope grounds.
  - layer: offramp_cex
    status: partially_measured
    scope:
      - global_vc_exchanger_class
    note: |
      The substantive supranational effect of the 2014 FATF report
      is to introduce a shared taxonomy ("exchanger", "administrator",
      "convertible VC") at the FATF standard-setting layer. The
      cascade, however, is dispersed across the five-year regulatory
      development arc (2014 risk report → 2015 RBA guidance → 2018
      VASP definition added to Recommendations glossary → 2019-06-21
      R.15 INR adopting the Travel Rule for VASPs) rather than
      localized to a single point-in-time off-ramp event. Marked
      partially_measured (rather than not_measured, which the
      validator forbids on observed_no_change observations) because
      the load-bearing effect is class-level and predicate-
      establishing, observable only at the class / regulatory-standard
      layer; the corresponding observation row below records this as
      observed_no_change with attribution=none at the supranational
      standard-setting layer, scoped to the 2014-06-26 to 2019-06-21
      pre-regime window.

