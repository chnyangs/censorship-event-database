analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase B of the 2026-05-16
  staged-release plan, historical_baseline_2013_2016 tier fill;
  agent_draft). Authored by LLM agent without personally verifying
  Wayback/body_hash; status=draft and origin=agent_draft. Real release
  must replace this DRYRUN marker with a human-verified audit after
  pinning real archive anchors via scripts/capture_http_artifact.py.

  FATF "Virtual Currencies — Key Definitions and Potential AML/CFT
  Risks" (2014-06-26) is the foundational supranational risk-framing
  predicate for the global FATF VASP regime that culminates in the
  2019-06-21 R.15 INR Travel Rule extension. The 2014 report
  introduces the taxonomy ("virtual currency", "convertible / non-
  convertible VC", "centralised / decentralised VC", "exchanger",
  "administrator", "user", "miner") and the convertibility-as-risk-
  axis frame that the subsequent FATF instruments build on. It is a
  five-year regulatory development arc:
    2014-06-26  FATF VC Key Definitions report (this event)
    2015-06     FATF Guidance for a Risk-Based Approach to VCs
    2018-10     FATF Recommendations amended — VASP added to glossary
    2019-06-21  FATF R.15 INR adopting the Travel Rule for VASPs
                (fatf-r15-vasp-travel-rule-2019)
  The 2014 report sits at the top of this arc as the predicate
  guidance — analogous to the FinCEN FIN-2013-G001 predicate role in
  the US BSA-MSB enforcement era (fincen-virtual-currency-msb-
  guidance-2013) and the EBA 2014-07-04 Opinion EBA-Op-2014-08 role
  in the EU regulatory development arc that culminates in the EU
  MiCA Regulation 2023/1114 (eu-mica-2023).

  Why null_event / null_case / observed_no_change: this event's load-
  bearing function is predicate-establishing rather than cascade-
  producing. The substantive regulatory effect — introducing a
  shared FATF-level taxonomy and risk frame for virtual currencies —
  unfolds dispersedly across the 2014→2019 regulatory development
  arc rather than as a single observable point-in-time CEX
  cessation directly attributable to the 2014 report alone. The
  cascade-shape grammar of the schema does not natively express
  class-level predicate-establishing supranational guidance, so this
  event is coded honestly as null_event (0 observed_change layers) /
  null_case (0 strong-attribution observed_change), with the single
  observation row expressing the class-level pre-regime posture as
  observed_no_change with attribution=plausible at the supranational
  standard-setting axis. The downstream FATF R.15 INR Travel Rule
  event (fatf-r15-vasp-travel-rule-2019) carries the load-bearing
  observed_change row in its own event file.

  Why historical_baseline tier: 2014 belongs to the
  historical_baseline_2013_2016 temporal tier per the 2008+ tiered
  frame. analysis_use=historical_baseline excludes this row from
  the 2017+ comparable-analysis denominator, matching the validator's
  tier-vs-analysis-use consistency rule (validate.py line 317).
  The user authoring brief suggested analysis_use=contextual_baseline,
  but that value is not in the controlled vocabulary; historical_
  baseline is the correct historical-tier mapping per the
  controlled_vocab.yaml enum.

  Schema-enum surprises encountered during authoring (mirroring the
  fincen-virtual-currency-msb-guidance-2013 sibling experience):
  - target.kind has no regulatory_class enum; fell back to
    target.kind=entity with target.enumeration=subset and an
    enumeration_note that records the class-level character.
  - target.enumeration has no class_level value (schema enum is
    complete / subset / pending); used subset with class-level
    rationale in the enumeration_note.
  - trigger.type=supranational_regulation is the canonical FATF
    trigger type, matching fatf-r15-vasp-travel-rule-2019 and
    oecd-carf-2022.
  - empirical_shape has no case_study enum (schema enum is cascade /
    comparison / null_event); mapped the class-level predicate-
    establishing posture to null_event + null_case + observation_
    kind=observed_no_change with attribution=plausible.
  - observation_kind has no not_observed value (schema enum is
    observed_change / observed_no_change / coverage_gap);
    observed_no_change with attribution=plausible is the closest
    schema match for the user's "not_observed / plausible
    (dispersed pre-regime guidance)" framing.
  - jurisdiction has no GLOBAL value (controlled_vocab enum lists
    UN and corporate_global as the two supranational codes); UN is
    the correct match for an intergovernmental standard-setting
    body (FATF), matching the precedent set by
    fatf-r15-vasp-travel-rule-2019.

  status remains draft until human review either:
  (1) admits the event as null_case at empirical_shape=null_event
      after pinning a verified Wayback snapshot + body_hash /
      body_path capture of the 2014 FATF report PDF via
      scripts/capture_http_artifact.py and confirming the 2014-06-26
      publication date against a second independent archival
      anchor, or
  (2) retires this event in favor of the 2019 R.15 INR Travel Rule
      event (fatf-r15-vasp-travel-rule-2019) as the load-bearing
      FATF anchor, with the 2014 VC report cited as predicate in
      that event's analysis_notes rather than as a free-standing
      event.

  Origin=agent_draft and status=draft per the agent-authoring
  convention.

scoped_claim: |
  The FATF 2014-06-26 report "Virtual Currencies — Key Definitions
  and Potential AML/CFT Risks" introduced a shared FATF-level
  taxonomy ("exchanger", "administrator", "convertible / non-
  convertible VC", "centralised / decentralised VC") and a
  preliminary risk-framing for AML/CFT exposures of virtual
  currency activity, establishing the foundational supranational
  predicate guidance for the five-year regulatory development arc
  culminating in the 2019-06-21 FATF R.15 INR Travel Rule
  extension to VASPs (fatf-r15-vasp-travel-rule-2019). The 2014
  report does not itself impose binding VASP obligations;
  observation_kind=observed_no_change with attribution=plausible
  at the supranational standard-setting axis honestly represents
  the dispersed pre-regime predicate role. Historical-baseline
  tier; not used in main statistical denominators.

