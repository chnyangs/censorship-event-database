analysis_notes: |
  **VERIFY-FLAG 2026-05-31 (bulk wave-2 adversarial verify):** captured source supports the
  action + general nexus, but a specific claim (exact addresses / asset types / source-attribution
  detail) is not fully substantiated by the captured page. Refine the source + soften unsupported
  specifics before admission. DRAFT — do NOT admit as-is.
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources verified+captured, awaiting human admission).

  In March 2023, amid a corruption scandal that led to SUNACRIP's
  reorganization/closure and ≥10 arrests (incl. former superintendent
  Joselit Ramirez Camacho), Venezuela's crypto regulator ordered the
  physical shutdown of licensed crypto mining facilities. The captured
  Decrypt body (body_hash pinned) confirms mining-farm closures in
  Carabobo, Lara and Bolívar affecting licensed, tax-paying operations.

  Scope (§9): IN scope — the load-bearing action is a deliberate
  state-ordered shutdown of legitimate (licensed, tax-paying) crypto
  mining operations, i.e. a censorship/restriction action, not a fraud
  prosecution of the operators themselves. The corruption probe targeted
  SUNACRIP officials; the mining facilities that were shut down were
  legitimate licensees, so their forced closure is a censorship action
  against legitimate operators.

  ANTI-FABRICATION / contested claim: the candidate lead framed this as an
  exchange (offramp_cex) shutdown, but the captured source states the order
  to close "all cryptocurrency exchanges registered in Venezuela" was "not
  been officially confirmed," and the registered exchange Cryptobuyer
  publicly denied any cessation order. The exchange-closure claim is
  therefore NOT carried as an observed_change; offramp_cex is not_measured.
  Only the CONFIRMED mining-facility closures are carried, at l1_consensus.

  Coding: trigger.type=nation_state_block (§5.1), research_stratum=
  S4_nation_state (§5.2). attribution=plausible for the l1_consensus
  observed_change (closures reported by Asonacrip / journalism, no pinned
  SUNACRIP primary order, agency made contradictory statements — §8.4
  conservative default). empirical_shape=comparison (1 observed_change
  layer); admission_tier=empirical_case (1 strong-attribution
  observed_change). Structural sibling of china-sichuan-mining-ban-2021-06
  (state-ordered mining-facility shutdown).

  Human-audit follow-up before promotion to admitted: (i) pin a SUNACRIP
  primary order / official Venezuelan-government source for the
  mining-facility closures and, if obtained, upgrade attribution to direct;
  (ii) resolve the exchange-closure dispute with a primary source before
  any offramp_cex observation may be added.

