analysis_notes: |
  **SOURCE REPAIR 2026-06-02** Official MFIU AML/CFT 2020 Annual Report PDF
  pinned locally; Annex (S) reproduces CBM Notification No. 9/2020 dated
  2020-05-15. Removed `evidence_tier=attested_secondary`, upgraded
  `primary_source_verified=true`, and changed attribution from plausible to
  direct for the official-text-supported claim. Also narrowed the previous
  all-residents sale/purchase/exchange prohibition language: the official
  English reproduction directly supports a financial-institution dealing ban,
  non-recognition as legal currency, and punishment for violations of applicable
  laws, while the broader "all persons residing in Myanmar" phrasing remains a
  secondary-law-firm interpretation rather than the load-bearing scoped claim.

  **ADMITTED 2026-05-31** (genuine review: TASK-2 lower-tier Pass 2. Rendered+grepped the captured source — core restriction substantiated (5/7-7/7 terms). The wave-1/2 VERIFY-FLAG was an OFAC-template "specific-address" boilerplate that does not apply to a national ban; removed. Admitted at evidence_tier=attested_secondary (§10), single source, filterable.)
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission).

  comparison documenting the Central Bank of Myanmar (CBM) Notification No.
  9/2020 (dated 2020-05-15 in the official MFIU annual-report reproduction)
  stating that CBM does not allow financial institutions, including banks, to
  deal with digital currency and does not recognize digital currency as legal
  currency. The notification names Bitcoin, Litecoin, Ethereum, and Perfect
  Money as examples of digital currencies being dealt/exchanged through personal
  Facebook accounts or websites, and states that violations of laws may be
  punished by imprisonment, fine, or both. Same nation-state-prohibition family
  as Cambodia NBC 2018 and Nepal NRB 2017, but scoped more narrowly to the
  official-text-supported banking/trading-service restriction.

  Per codebook §5.1, trigger.type=nation_state_block is the canonical fit: a
  nation-state central-bank directive denying financial-institution involvement
  in digital-currency dealing and treating digital currency as non-legal
  currency. Per §5.2, research_stratum=S4_nation_state is permitted.

  Per §9 inclusion boundary: in scope — a deliberate state prohibition denying
  legitimate financial-institution and trading-service involvement in digital
  currency, distinct from a pure soft advisory because the notification uses
  "does not allow" language for financial institutions and invokes punishment
  for legal violations.

  Why offramp_cex direct: the official MFIU-hosted annual report reproduces the
  CBM notification text in English. Tilleke & Gibbins remains a useful
  secondary interpretation, but it is no longer the load-bearing evidence.

  Why L0/L1/L3/asset_onchain not_applicable: legality/payment-rail action,
  pre-Merge/pre-Flashbots era, no issuer-side on-chain freeze.

  Why temporal_tier=comparable_main_2017_present / analysis_use=
  comparable_analysis: 2020-05-15 sits in the 2017+ comparable corpus.

  Remaining limitation: the source is an official annual-report reproduction of
  the CBM notification rather than a standalone cbm.gov.mm notification page.

scoped_claim: |
  "On 2020-05-15 the Central Bank of Myanmar issued Notification No. 9/2020
  stating that CBM does not allow financial institutions, including banks, to
  deal with digital currency and does not recognize digital currency as legal
  currency; it names Bitcoin, Litecoin, Ethereum, and Perfect Money as examples
  of digital currencies being dealt/exchanged through Facebook accounts or
  websites and states that legal violations may be punished by imprisonment,
  fine, or both. The offramp_cex layer carries the load-bearing
  direct-attribution observation at class level."

