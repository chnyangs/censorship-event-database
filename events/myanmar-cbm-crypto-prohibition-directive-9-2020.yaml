analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review: TASK-2 lower-tier Pass 2. Rendered+grepped the captured source — core restriction substantiated (5/7-7/7 terms). The wave-1/2 VERIFY-FLAG was an OFAC-template "specific-address" boilerplate that does not apply to a national ban; removed. Admitted at evidence_tier=attested_secondary (§10), single source, filterable.)
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission).

  comparison documenting the Central Bank of Myanmar (CBM) Notification No.
  9/2020 (issued May 2020, dated 2020-05-15 in the public record) prohibiting all
  persons residing in Myanmar from the sale, purchase, or exchange of unregulated
  digital currencies (Bitcoin, Litecoin, Ethereum, Perfect Money named), with no
  permission granted to financial institutions to trade them and enforcement via
  account closure and legal action under the Central Bank of Myanmar Law, the
  Anti-Money Laundering Law and the Financial Institutions Law. Same
  nation-state-prohibition family as Cambodia NBC 2018 and Nepal NRB 2017.

  Per codebook §5.1, trigger.type=nation_state_block is the canonical fit: a
  nation-state directive making crypto sale/purchase/exchange illegal. Per §5.2,
  research_stratum=S4_nation_state is permitted.

  Per §9 inclusion boundary: in scope — a deliberate state prohibition denying
  legitimate crypto trading/exchange service to Myanmar users with active
  enforcement (account closure, legal action), distinct from a pure soft advisory
  (the directive declares the activity illegal and is enforced, not merely
  warned-against).

  Why offramp_cex plausible (not direct): the load-bearing captured evidence is
  law-firm secondary analysis (Tilleke & Gibbins) reproducing the directive, not
  the CBM Notification No. 9/2020 instrument text, and the prohibition is
  class-level (no exchange named). Conservative-default rule (§8.4) applied →
  plausible. A human reviewer may elevate to direct if a primary CBM instrument
  capture is pinned.

  Why L0/L1/L3/asset_onchain not_applicable: legality/payment-rail action,
  pre-Merge/pre-Flashbots era, no issuer-side on-chain freeze.

  Why temporal_tier=comparable_main_2017_present / analysis_use=
  comparable_analysis: 2020-05-15 sits in the 2017+ comparable corpus.

  Human audit follow-up: locate the CBM's own Notification No. 9/2020 instrument text
  (cbm.gov.mm, 2020-05) to support elevation to direct; confirm the exact
  intra-month issuance date.

