      note: |
        US Treasury press release jy2213 "Treasury Sanctions Hamas-Aligned
        Terrorist Fundraising Network" (2024-03-27). Joint US OFAC + UK OFSI
        action designating Gaza Now (a Gaza-based pro-Hamas news / social-
        media brand exploited as a crypto donation funnel after the 2023-10-07
        attack), its founder Mustafa Ayash, and two London-based companies
        (Al-Qureshi Executives Ltd and Aakhirah Limited) plus their director
        Aozma Sultana, who functioned as the UK-side fundraising-promotion
        and value-transfer rail. OFAC added to the SDN List eight digital-
        currency addresses controlled by Gaza Now: 1 BTC (empty), 2 ETH
        (combined balance >~USD 2,690), and 5 USDT addresses (combined
        balance >~USD 10,350, of which only 2 were funded at designation
        time). Designation made pursuant to Executive Order 13224 (as
        amended) for material support to Hamas. DRYRUN: pinned snapshot
