  enumeration_note: |
    Gaza Now (Gaza-based pro-Hamas social-media news brand operated by
    Mustafa Ayash) is treated as the entity-level cascade target. The
    March 27, 2024 SDN action enumerates: (1) the Gaza Now entity itself,
    (2) Mustafa Ayash (founder / director, individual), (3) Al-Qureshi
    Executives Ltd (London-based UK company, fundraising / value-transfer
    facilitator), (4) Aakhirah Limited (London-based UK company, sibling
    facilitator), (5) Aozma Sultana (UK individual, director of #3 and #4).
    Eight digital-currency addresses were attached to the Gaza Now SDN
    entry: 1 BTC (empty at designation), 2 ETH (combined >~USD 2,690), 5
    USDT (combined >~USD 10,350; 2 funded, 3 empty). subset enumeration
    because the address list is asserted from secondary substrate
    (Chainalysis / Elliptic / CoinDesk reporting) pending pinned
    transcription from the OFAC recent-actions permalink during human
    audit; this stub therefore does not enumerate the specific BTC / ETH /
    USDT strings inline. Third major post-Oct-7 OFAC action targeting
    Hamas crypto fundraising, after the 2023-10 Buy Cash Money Transfer
    designation (`ofac-hamas-buy-cash-msb-2023-10`) and the 2024-01 IRGC
    virtual-currency-network designation
    (`ofac-hamas-irgc-virtual-currency-network-2024-01`).
