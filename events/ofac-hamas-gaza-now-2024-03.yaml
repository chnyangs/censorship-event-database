  Comparison documenting the 2024-03-27 joint US OFAC + UK OFSI designation
  of Gaza Now, a Gaza-based pro-Hamas news / social-media brand operated
  by Mustafa Ayash and exploited as a crypto donation funnel after the
  2023-10-07 attack on Israel. Designation pursuant to Executive Order
  13224 (as amended) for material support to Hamas. The action also
  designated two London-based UK companies (Al-Qureshi Executives Ltd
  and Aakhirah Limited) and their director Aozma Sultana, who functioned
  as the UK-side fundraising-promotion and value-transfer rail.

  Third major post-Oct-7 OFAC sanctions action targeting Hamas crypto
  fundraising in this stratum:
    1. 2023-10 — Buy Cash Money & Money Transfer Co. MSB designation
       (`ofac-hamas-buy-cash-msb-2023-10`)
    2. 2024-01 — IRGC / Hamas virtual-currency-network designation
       (`ofac-hamas-irgc-virtual-currency-network-2024-01`)
    3. 2024-03 — Gaza Now news-brand / crypto-fundraising-funnel
       designation (this event)
  Together these form a tight cohort suitable for paper-level comparison
  of how the SDN-address-set + offramp_cex cascade responds across
  different Hamas-fundraising surface types (cash MSB → IRGC virtual-
  currency intermediary → news-brand donation funnel).

  Address-cohort summary (per Chainalysis / Elliptic substrate; pending
  pinned transcription from OFAC recent-actions permalink):
    * 1 BTC address (empty at designation)
    * 2 ETH addresses (combined balance >~USD 2,690 at designation)
    * 5 USDT addresses (combined balance >~USD 10,350 at designation;
      only 2 of 5 funded). Tether-USDT-on-TRON was the dominant rail
      for terrorist-financing flows in 2023 per Chainalysis sector
      reporting.

  Pre-designation baseline (per Elliptic 2023-10 reporting): ~USD 21K
  of crypto received by Gaza Now in the weeks after 2023-10-07, of which
  ~USD 2K was frozen by mainstream exchange deposit-address filtering
  and ~USD 9K of USDT was frozen by Tether issuer action. These freezes
  are pre-designation and recorded under observations[] only as
  attribution=plausible for cascade-context completeness; the empirical
  question for the human-audit pass is whether the 2024-03-27 SDN action
  triggered fresh cohort freezes beyond that baseline.

  DRYRUN caveats: for non-DRYRUN release, capture body_hash + body_path
  for: (1) Treasury press release jy2213 permalink,
  (2) OFAC recent-actions/20240327 permalink (the address-level
  transcription source), (3) Chainalysis post-action analysis,
  (4) Elliptic crypto-regulatory-affairs brief, (5) CoinDesk same-day
  coverage. Pin a usdtbanlist.com sweep for the 5 USDT addresses + an
  on-chain freeze-tx anchor for any Circle USDC / Tether ETH-side
  blacklist actions on the 2 ETH addresses. All citations are marked
  evidence_use=contextual_unarchived per validator policy until pinned.

