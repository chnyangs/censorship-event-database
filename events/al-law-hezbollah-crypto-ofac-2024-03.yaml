  null_event documenting the 2024-03-26 OFAC SDN designation (EO 13224; jy2209)
  of Lebanon-based Syrian money exchanger Tawfiq Muhammad Sa'id al-Law, a
  Hizballah/IRGC-QF crypto financier who provided Hizballah with digital wallets
  to receive IRGC-QF commodity-sale proceeds. His SDN entry carries a
  USDT-on-Tron address (TWBAPzpPiZarfVsY2BLXeaLhNHurn4wkWG), previously seized
  by Israel's NBCTF (~$1.7M, July 2023).

  Coded null_event / null_case per the S1 convention: the designation is the
  trigger, but no public CEX cascade was documented in the 14-day window. Per
  codebook §1.6 the named Tron address is not coded as an asset_onchain
  observation absent a captured primary_onchain freeze tx_hash; the measurable
  surface is carried at offramp_cex (observed_no_change / none). Codebook §1.2
  note: the SDN names the specific USDT-Tron address (condition A); a captured
  Tether freeze confirmation would satisfy condition B and could upgrade a
  future asset_onchain row to direct. Sources verified + captured 2026-05-31
  (Treasury jy2209 + OFAC RA 20240326, both body_hash-pinned; no fabrication).

