target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    ConsenSys-operated MetaMask wallet UI (browser-extension and
    mobile) consumes the `eth-phishing-detect` blocklist
    (https://github.com/MetaMask/eth-phishing-detect) to surface
    phishing / risk warnings to end users. Following the 2022-08-08
    OFAC SDN designation of Tornado Cash (related event
    tornado-cash-ofac-2022), the blocklist was extended to include
    Tornado Cash interaction references. Target is the
    operator entity (ConsenSys / MetaMask wallet UI layer) rather
    than an enumerated address set because the blocklist is a
    moving reference maintained in a public GitHub repository, not
    a static published roster; subset because only the MetaMask-
    operated wallet UI warning layer is in scope here (this row is
    distinct from the L3 Infura RPC block under
    infura-alchemy-tornado-rpc-block-2022 and from the L3
    Donetsk/Luhansk Infura block under
    infura-metamask-donetsk-luhansk-block-2022-03).
  entity: consensys_metamask
  actor_type: wallet_ui_operator
  actor_name: ConsenSys / MetaMask (eth-phishing-detect blocklist maintainer)
  chains: [ethereum]
  canonical_domains:
    - github.com/MetaMask/eth-phishing-detect

jurisdiction: [corporate_global]

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      MetaMask is a client-side wallet; the eth-phishing-detect
      blocklist is a static asset shipped with the extension and
      consulted client-side. No DNS- or ISP-level effect.
  - layer: l1_consensus
    status: not_applicable
    chain: ethereum
    note: |
      Pre-Merge Ethereum (Paris was 2022-09-15, 34 days after this
      event); consensus-layer effects of the 2022-08-08 OFAC trigger
      are captured under tornado-cash-ofac-2022 observations[l1].
  - layer: l3_rpc
    status: not_applicable
    note: |
      Distinct from the L3 RPC-provider block under
      infura-alchemy-tornado-rpc-block-2022. The eth-phishing-detect
      addition is a wallet UI warning-layer action, not a JSON-RPC
      response policy at the Infura endpoint.
  - layer: l4_frontend
    status: measured
    scope:
      - github.com/MetaMask/eth-phishing-detect
    provider_scope: unknown
    note: |
      Load-bearing layer for this event. The eth-phishing-detect
      blocklist is shipped with the MetaMask browser-extension and
      mobile wallets and consulted by the wallet UI to surface
      phishing / risk warnings when a user navigates to or interacts
      with a flagged domain. Following the 2022-08-08 OFAC Tornado
      Cash SDN designation (related event tornado-cash-ofac-2022),
      Tornado Cash interaction entries were added to the blocklist
      as a wallet UI warning-layer compliance step. The Ethereum
      smart contracts and the user's ability to send transactions
      to them via a non-MetaMask client remained unaffected; the
      effect is exclusively at the wallet UI warning layer.
      Attached below as observed_change at attribution=plausible
      (the commit/PR is in a public corporate-operated repo but
      ConsenSys did not publish a standalone corporate statement
      tying the addition to the OFAC trigger; per codebook §1.4
      this is plausible rather than direct).
  - layer: asset_onchain
    status: not_applicable
    note: |
      No issuer-level asset freeze invoked by the eth-phishing-detect
      blocklist update; the sibling asset-layer action (Circle USDC
      blacklist) is captured in circle-usdc-tornado-2022.
  - layer: offramp_cex
    status: not_applicable
    note: |
      CEX off-ramp reactions are captured under tornado-cash-ofac-2022
      observations[offramp_cex].

