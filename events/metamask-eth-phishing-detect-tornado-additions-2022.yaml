analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17** (Phase A.2
  corporate_policy discovery; wallet-UI warning-layer slice):
  authored by LLM agent without personally verifying the specific
  eth-phishing-detect commit hash / PR number / commit timestamp;
  origin=agent_draft per validator policy. Real release MUST replace
  this DRYRUN marker with a human-verified audit after pinning the
  actual commit SHA, commit timestamp, and the diff body_hash, and
  promote origin to human_reviewed.

  Comparison-shape S5 corporate-policy-change event sited at the
  wallet UI warning layer (L4) — distinct from the L3 Infura RPC
  block (infura-alchemy-tornado-rpc-block-2022) and from the L3
  Donetsk/Luhansk Infura block (infura-metamask-donetsk-luhansk-
  block-2022-03), both of which are RPC-layer actions by the
  same parent corporate entity (ConsenSys). The eth-phishing-detect
  blocklist is consumed by the MetaMask browser-extension and
  mobile wallets to surface phishing / risk warnings in the wallet
  UI; the Tornado Cash interaction additions following the
  2022-08-08 OFAC SDN designation (related event
  tornado-cash-ofac-2022) extend the same compliance posture to
  the wallet-UI warning surface. Paper-relevant because it
  isolates a wallet-UI warning-layer action by the same
  ConsenSys parent that operates the L3 Infura RPC and the
  MetaMask wallet itself, completing a vertical compliance stack
  (RPC + wallet UI) under a single corporate operator that no
  other event in the corpus captures.

  Attribution coding per codebook §1.4: plausible (not direct)
  because the eth-phishing-detect repository maintainers did not
  publish a standalone corporate statement tying the Tornado
  Cash blocklist addition to the 2022-08-08 OFAC SDN trigger;
  the addition is inferable from the commit history and the
  publicly-knowable compliance window but is not anchored to a
  ConsenSys blog post, ToS update, or corporate press statement.
  Per the codebook decision rule, the more conservative value
  (plausible) is required.

  Empirical shape: comparison (1 observed_change layer — L4
  wallet UI warning load-bearing). Admission tier:
  empirical_case (≥1 observed_change layer with plausible
  attribution). Stratum coding: S5_corporate (corporate policy
  change downstream of an upstream OFAC SDN trigger). The OFAC
  SDN designation itself is the upstream trigger (related event
  tornado-cash-ofac-2022), but ConsenSys / MetaMask chose to
  apply the wallet-UI warning-layer extension as a corporate-
  compliance policy — ConsenSys was not named in the OFAC
  designation, and wallet-UI warning-layer maintenance is not
  itself a regulated activity under the Treasury secondary-
  sanctions authority. The corporate-policy character is what
  makes this an L4 row in the S5 stratum rather than an S1_ofac_sdn
  row. jurisdiction is corporate_global because the
  eth-phishing-detect blocklist is shipped globally with the
  MetaMask client and does not honor user IP / geofence; the
  ConsenSys parent's US jurisdiction is documented under the
  sibling Infura events.

  DRYRUN caveats: the three citations (GitHub repo pointer +
  two contemporaneous journalism) all carry 2022-calendar-folder
  Wayback pointers rather than pinned snapshots. For non-DRYRUN
  release, capture: (1) the specific PR / commit SHA + commit
  timestamp + diff body_hash for the eth-phishing-detect
  addition(s) referencing Tornado Cash interaction entries; (2)
  pinned Wayback snapshots and body_hash captures for the
  CoinDesk and David Gerard article permalinks; (3) optionally,
  a screenshot or saved DOM of the MetaMask wallet UI surfacing
  the warning when a user navigates to a flagged Tornado Cash
  domain. Marked evidence_use=contextual_unarchived on all
  citations to flag the unarchived state per validator policy.

