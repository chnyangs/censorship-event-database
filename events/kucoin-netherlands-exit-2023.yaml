  **NEW EVENT AUTHORED — DRYRUN 2026-05-17** (Wave 2.3 P2 preamble:
  KuCoin Netherlands 2023 hypothesized exit — coded as null_event
  because the authoring agent could not pin a specific 2023 NL exit
  announcement attributable to DNB registration requirements).
  Authored by LLM agent without personally verifying Wayback /
  body_hash; only valid at status=draft / origin=agent_draft. The slug
  `kucoin-netherlands-exit-2023` is retained verbatim per the
  authoring instruction, but the empirical claim it suggests is NOT
  admitted: null_event + null_case fallback per the instruction's
  explicit "If no specific NL exit found: code null_event" clause.

  Why null_event:
  - The 2026-05-17 WebSearch pass on "KuCoin Netherlands exit 2023"
    surfaced:
    (a) DNB's 2022-12-15 public warning against MEK Global Limited
        d/b/a 'KuCoin' (BEFORE the 2023 window).
    (b) KuCoin's first NL-user-restrictive announcement effective
        2024-09-30 (new NL user registrations halted; existing NL
        users without KYC frozen) — slug `_240930` (AFTER the 2023
        window).
    (c) KuCoin's 2025-07-28 announcement scheduling full NL exit
        effective 2025-08-04 / 2025-08-25 (also AFTER the 2023
        window).
  - No KuCoin 2023 NL-exit announcement attributable to DNB
    registration requirements was located.
  - Per §3 codebook: 0 observed_change layers → null_event.
  - Per §4 codebook: 0 strong-attribution observed_change layers →
    null_case.
  - Per §8.4 codebook: ambiguous coding defaults to the more
    conservative value (null_case over empirical_case).

  Slug retention note: the slug `kucoin-netherlands-exit-2023` is
  deliberately preserved so that any future evidence surfacing a
  specific 2023 NL exit action can be admitted under the same id;
  the current row stands as a documented null search until then.
  Note that a sibling event capturing the actual 2024-09-30 NL
  restriction announcement and/or the 2025-08 full NL exit may be
  appropriate as a separate slug
  (e.g. `kucoin-netherlands-exit-2024` or
  `kucoin-netherlands-exit-2025`).

