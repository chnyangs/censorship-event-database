      bankruptcy plan, not PBS-level block construction.
  - layer: l3_rpc
    status: not_applicable
    note: |
      No RPC provider filter changes implicated.
  - layer: l4_frontend
    status: not_applicable
    note: |
      Voyager customer-facing platform was already frozen since
      2022-07-01 (withdraw-freeze) and in active Chapter 11 before the
      2023-04 stay order. No fresh frontend takedown is attributed to
      the repaired trigger.
  - layer: asset_onchain
    status: not_applicable
    note: |
      No issuer-level on-chain freeze or sanction-list address set
      asserted.
  - layer: offramp_cex
    status: measured
    scope: [voyager_lending_platform, binance_us_acquisition]
    note: |
      Voyager's centralized lending platform is the off-ramp. The
      measured row-local change is the S.D.N.Y. stay of the confirmation
      order pending the Government's appeal, which paused the
      Binance.US acquisition route and delayed the planned crypto
      distribution path. Binance.US's 2023-04-25 termination notice is
      retained as a downstream endpoint, not as the direct causal claim.
