analysis_notes: |
  **SOURCE-REPAIRED 2026-06-02**: replaced the lower-tier
  CoinDesk/generic-Stretto packet with specific Stretto legal PDFs for
  Bankruptcy Court Doc 1182, S.D.N.Y. Document 4, S.D.N.Y. corrected
  Opinion & Order Document 53, and Bankruptcy Court Doc 1345. The row no
  longer uses `evidence_tier=attested_secondary`: Document 53 is the
  primary legal trigger and observed-change anchor, and Doc 1345 is the
  primary legal downstream termination/toggle endpoint.

  The repair deliberately narrows the retained changed-layer claim. The
  direct observation is the court-stayed confirmation-order /
  Binance.US-sale route, not a claim that the DOJ directly caused
  Binance.US to terminate the agreement. The termination notice remains
  an endpoint showing that Voyager moved toward the plan's liquidation
  toggle after Binance.US terminated, while the Reuters-syndicated
  "hostile and uncertain regulatory climate" wording stays supporting
  context only.

  Comparison placement: this is the M&A-cancellation / bankruptcy-sale
  variant of the lender-bankruptcy twin. It remains distinct from
  criminal Voyager / Alameda investigations and from
  celsius-bankruptcy-mashinsky-doj-2023 because the load-bearing
  mechanism is a civil bankruptcy appeal/stay order over the plan's
  exculpation and sale/distribution path. The trigger.type remains
  court_civil_order; stratum remains S3_doj_sec_cftc_fiod.

scoped_claim: |
  "The 2023-04-01 S.D.N.Y. corrected Opinion & Order granting the
  Government's stay pending appeal of Voyager Digital's confirmation
  order is coded as a single-layer offramp_cex observed_change: the
  court stay paused the bankruptcy-court-mediated Binance.US sale /
  crypto-distribution route. Voyager's 2023-04-25 Doc 1345 termination
  notice is retained as the downstream endpoint showing the Binance.US
  asset-purchase route ended and Voyager intended to toggle to direct
  liquidation distributions; the row does not claim that the DOJ
  directly caused Binance.US's termination."

