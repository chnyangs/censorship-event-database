          history) is not a clean recovery to the pre-trigger state.

analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17** (Phase F source-code-layer
  discovery; foundational L4 censorship event): authored by LLM agent
  without personally verifying Wayback/body_hash; origin=agent_draft
  per validator policy. Real release must replace this DRYRUN marker
  with a human-verified audit after pinning real archive anchors and
  promote origin to human_reviewed.

  Comparison-shape S5 corporate-policy-change event sibling to
  aave-tornado-frontend-block-2022-08, uniswap-balancer-tornado-frontend-block-2022-08,
  cloudflare-ethereum-gateway-tornado-block-2022-08, circle-usdc-tornado-2022,
  and infura-alchemy-tornado-rpc-block-2022. This row documents the
  source-code-distribution-layer vertex of the 2022-08-08 Tornado
  Cash cascade — Microsoft / GitHub's takedown of the tornadocash
  organisation repositories (tornado-core, tornado-cli, classic
  contracts, relayer, ui) and the suspension of co-founder Roman
  Semenov's developer account, both effective the same day as the
  OFAC SDN designation. It is the earliest documented
  source-code-platform compliance action in the corpus and the only
  event that captures the L4-frontend layer at the source-code
  (developer distribution) rather than the application-UI level.

  Attribution coding: direct per §1.4 (platform operator's reported
  rationale cites the OFAC trigger; block lands within the ≤ 7-day
  compliance window — in fact 0h lag). The Microsoft / GitHub
  decision is a unilateral corporate-policy choice rather than a
  legally compelled act (US persons providing services to SDN-listed
  entities risk secondary sanctions, but the specific question of
  whether hosting open-source code constitutes "services" was
  unsettled at the time and was subsequently softened by OFAC's
  2022-09-13 guidance clarification). The corporate-policy
  character — and the fact that GitHub partially reinstated the
  repositories after OFAC clarification — is what makes this an
  S5_corporate row rather than S1_ofac_sdn.

  Empirical shape: comparison (1 observed_change layer — L4 frontend
  load-bearing at the source-code-distribution sub-layer). Admission
  tier: empirical_case (≥1 observed_change layer with direct
  attribution).

  v0.3 source repair adds a GitHub Wayback before/after pair:
  2022-08-08 14:45:05Z shows the tornadocash organization page present,
  while 2022-08-09 15:42:43Z shows GitHub's not-found page at the same
  URL. This is a replayable platform-surface observation for the
  takedown window, but the row remains draft because human review must
  still confirm the exact takedown timing, repository roster, and
  GitHub/Microsoft rationale. For non-DRYRUN release, capture body_hash +
  body_path for: (1) the The Register 2022-08-24 article; (2) the
  Cointelegraph 2022-09-23 reinstatement article; (3) the EFF
  Deeplinks 2023-04 retrospective; (4) the Perkins Coie Virtual
  Currency Report analysis. Optionally, capture archive snapshots of
  the github.com/tornadocash organisation page in its post-takedown
  state (HTTP 404) and the github.com/tornado-repositories community
  mirror as physical artefact. GitHub / Microsoft did not publish a
  standalone takedown post, so the primary_corporate anchor is
  unavailable; reliance on contemporaneous journalism is structural,
  not a DRYRUN artefact. Marked evidence_use=contextual_unarchived
  on all citations to flag the unarchived state per validator policy.

scoped_claim: |
  "Microsoft / GitHub's 2022-08-08 takedown of the tornadocash
  GitHub organisation (tornado-core, tornado-cli, classic contracts,
  relayer, ui) and suspension of co-founder Roman Semenov's
  developer account — effective the same day as the OFAC SDN
  designation of Tornado Cash (related event tornado-cash-ofac-2022)
  — documents the source-code-distribution sub-layer of the L4
  frontend vertex in the S5_corporate cascade. Paper-relevant as
  the earliest and most foundational source-code-platform
  compliance action in the corpus and as the comparison sibling to
  the application-UI L4 rows (Aave, Uniswap/Balancer, Cloudflare
  Ethereum Gateway)."

