analysis_notes: |
  **SOURCE-STRENGTHENED 2026-06-02** (quality-loop primary/source repair):
  connected the already captured GitHub Wayback before/after pair to the
  admitted row. The 2022-08-08 14:45:05 UTC GitHub capture shows the
  tornadocash organization page present with 47 repositories and visible
  tornado-core / tornado-cli links; the 2022-08-09 15:42:43 UTC capture
  of the same URL shows GitHub's "Page not found" page. This upgrades
  trigger and observation evidence to include primary_corporate
  platform-surface artifacts. Attribution remains `plausible` because
  GitHub did not publish a standalone takedown notice or public rationale;
  The Register and EFF remain contextual sources for the reported account
  suspension, repository-removal details, and OFAC rationale.

  **PROMOTED 2026-05-21** (c) Batch C-5 audit (S5 corporate, Tornado) by
  human:xiangwen. Fabricated github.com/tornadocash semi_primary_wayback
  (repo removed) dropped; anchored on 2 independent semi_primary_wayback
  (The Register + EFF, Wayback 20220825093705 / 20230419014440).
  attribution direct->plausible (no archived GitHub primary statement).
  l4_frontend observed_change/plausible. comparison/empirical_case preserved.

  **NEW EVENT AUTHORED — DRYRUN 2026-05-17** (Phase F source-code-layer
  discovery; foundational L4 censorship event): authored by LLM agent
  without personally verifying Wayback/body_hash; origin=agent_draft
  per validator policy. Real release must replace this DRYRUN marker
  with a human-verified audit after pinning real archive anchors and
  promote origin to human_reviewed.

  Comparison-shape S5 corporate-policy-change event sibling to
  aave-tornado-frontend-block-2022-08, uniswap-balancer-tornado-frontend-block-2022-08,
  cloudflare-ethereum-gateway-tornado-block-2022-08, circle-usdc-tornado-2022,
  and infura-alchemy-tornado-rpc-block-2022. This row documents the
  source-code-distribution-layer vertex of the 2022-08-08 Tornado
  Cash cascade — Microsoft / GitHub's takedown of the tornadocash
  organisation repositories (tornado-core, tornado-cli, classic
  contracts, relayer, ui) and the suspension of co-founder Roman
  Semenov's developer account, both effective the same day as the
  OFAC SDN designation. It is the earliest documented
  source-code-platform compliance action in the corpus and the only
  event that captures the L4-frontend layer at the source-code
  (developer distribution) rather than the application-UI level.

  Attribution coding remains plausible per §1.4: the GitHub before/after
  captures directly anchor the platform-surface state change, but they do
  not themselves publish GitHub's reason. The Microsoft / GitHub decision
  is a unilateral corporate-policy choice rather than a legally compelled
  act (US persons providing services to SDN-listed entities risk sanctions
  exposure, but the specific question of whether hosting open-source code
  constitutes "services" was unsettled at the time and was subsequently
  softened by OFAC's 2022-09-13 guidance clarification). The
  corporate-policy character — and the fact that GitHub partially
  reinstated repositories after OFAC clarification — is what makes this an
  S5_corporate row rather than S1_ofac_sdn.

  Empirical shape: comparison (1 observed_change layer — L4 frontend
  load-bearing at the source-code-distribution sub-layer). Admission
  tier: empirical_case (≥1 observed_change layer).

scoped_claim: |
  "Microsoft / GitHub's August 2022 removal of the tornadocash
  GitHub organization from the public GitHub surface is anchored by a
  Wayback before/after pair: the organization page was present with 47
  repositories on 2022-08-08 14:45:05 UTC and returned GitHub's 404 page
  by 2022-08-09 15:42:43 UTC. Contemporaneous reporting ties the takedown
  and related developer-account suspensions to the same-day OFAC SDN
  designation of Tornado Cash; attribution remains plausible because
  GitHub did not publish a standalone takedown rationale."

