  - layer: l4_frontend
    status: measured
    scope:
      - github.com/tornadocash
      - github.com (Roman Semenov developer account)
    provider_scope: unknown
    note: |
      Load-bearing layer for this event. The L4 frontend layer here is
      the source-code distribution layer at github.com — the
      developer-facing UI through which the Tornado Cash codebase and
      release artefacts were obtained. Local GitHub Wayback captures show
      the tornadocash organization page and pinned repositories present on
      2022-08-08 14:45:05 UTC and the same URL returning GitHub's 404 page
      by 2022-08-09 15:42:43 UTC. The Register/EFF provide context for
      the reported account/repository takedown and OFAC rationale.
  - layer: asset_onchain
    status: not_applicable
    note: |
      No issuer-level asset freeze invoked by GitHub's platform
      takedown. Asset-layer reactions to the same upstream OFAC
      trigger are captured under circle-usdc-tornado-2022.
  - layer: offramp_cex
    status: not_applicable
    note: |
      CEX off-ramp reactions to the same upstream OFAC trigger are
