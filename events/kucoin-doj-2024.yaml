    sources:
      - type: primary_corporate
        url: https://www.kucoin.com/news
        wayback: https://web.archive.org/web/20260516000000/https://www.kucoin.com/news
        scope_descriptor:
          providers: [kucoin_com_frontend]
          time_window:
