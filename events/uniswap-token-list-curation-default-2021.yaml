trigger:
  type: corporate_policy_change
  actor: uniswap_labs
  timestamp: 2021-07-23T00:00:00Z
  timestamp_precision: day
  citation:
    - type: primary_corporate
      url: https://app.uniswap.org
      wayback: https://web.archive.org/web/2021/https://app.uniswap.org
      evidence_use: contextual_unarchived
      note: |
        Uniswap Labs operates app.uniswap.org and ships the default
        token-list catalogue that the frontend renders. The 2021
        default-token-list curation policy — formalized 2021-07-23
        alongside the synthetic-stocks delisting batch and after the
        2021-04 Wells-notice-era regulatory-pressure cycle — establishes
        that Uniswap Labs (the US-based frontend operator) is the
        discretionary curator of which ERC-20 tokens are surfaced on
        app.uniswap.org. The on-chain Uniswap Protocol smart contracts
        (v2 / v3) remain autonomous and permissionless; the curation
        policy applies exclusively to the Uniswap-Labs-operated
        frontend UI. This row codes the **policy framework itself**
        (the discretionary curation power), not any specific per-token
        cascade — the load-bearing per-token observation for the
        2021-07-23 cohort is the sibling event
        uniswap-tokenized-stocks-delisting-2021-07. Marked
        evidence_use=contextual_unarchived because in this DRYRUN the
        authoring LLM agent did not personally pin a Wayback snapshot
        timestamp or compute a body_hash of the policy-framework
        announcement copy; the Uniswap-Labs domain is the canonical
        corporate anchor but the precise policy / token-list curation
        page must be re-anchored during human audit before this
        citation may serve as an admission anchor.
  timestamp_sources:
    - type: semi_primary_measurement
      url: https://github.com/Uniswap/default-token-list
      wayback: https://web.archive.org/web/2021/https://github.com/Uniswap/default-token-list
      evidence_use: contextual_unarchived
      note: |
        @uniswap/default-token-list GitHub repo is the technical
        substrate for the app.uniswap.org default token catalogue.
        Repo existence and commit history through 2021 corroborate
        the day-level timestamp of the formalized curation framework
        coinciding with the 2021-07-23 cohort delisting. Wayback
        wildcard pointer (web/2021/) in lieu of a pinned-timestamp
        snapshot; evidence_use=contextual_unarchived pending
        human-audit re-pin of the precise repo state / README at the
        2021-07-23 cutover.
    - type: semi_primary_measurement
      url: https://blog.uniswap.org/token-lists
      wayback: https://web.archive.org/web/2020/https://blog.uniswap.org/token-lists
      evidence_use: contextual_unarchived
      note: |
        "Introducing Token Lists" — Uniswap Labs blog post establishing
        the token-list specification and the default-list curation
        approach ("a list supported by their own reputation"). The
        2021-07-23 default-token-list curation policy is the
        post-Wells-notice-era operationalization of this framework
        as a discretionary corporate-compliance gate at the
        Uniswap-Labs frontend. Wayback wildcard pointer pending
        human-audit re-pin.

