analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17** (Phase A.2 corporate_policy
  framework row; lean run): authored by LLM agent without personally
  verifying Wayback / body_hash; status=draft / origin=agent_draft per
  validator. Real release must replace this DRYRUN marker with a
  human-verified audit after pinning real archive anchors (the
  policy-framework announcement page body_hash, the
  @uniswap/default-token-list repo state at the 2021-07-23 cutover,
  and the "Introducing Token Lists" blog post body_hash).

  null_event — S5 corporate-policy-framework row documenting the
  Uniswap Labs default-token-list curation policy formalized on
  2021-07-23 (post-2021-04 Wells-notice-era regulatory-pressure
  cycle, concurrent with the synthetic-stocks delisting batch).
  This row codes the **policy framework itself** — the
  discretionary curation power that Uniswap Labs (the US-based
  frontend operator) exercises over the app.uniswap.org default
  token list, separate from the autonomous on-chain Uniswap
  Protocol smart contracts (v2 / v3).

  empirical_shape=null_event because the per-token cascade
  observations are coded on the sibling rows
  (uniswap-tokenized-stocks-delisting-2021-07 for the 2021-07-23
  ~100-token tokenized-equity cohort, and
  uniswap-frontend-delisting-2023 for the 2023-07-21 ~100+-token
  broader regulatory-category cohort). To avoid double-counting
  the same load-bearing l4_frontend observed_change across two
  rows, this framework row carries no observed_change of its own
  (codebook §3: null_event = 0 observed_change layers).
  Correspondingly admission_tier=null_case (codebook §4: 0
  strong-attribution observed_change layers → null_case;
  framework rows function as denominator-control / scoping
  anchors, not as numerator events).

  Why this row exists despite carrying no observed_change:
  (a) it documents the corporate-governance fact that
  Uniswap Labs operates the default token list as a
  discretionary frontend gate, distinct from the on-chain
  Uniswap Protocol — a structural claim load-bearing for the
  paper's frontend / protocol-decoupling thesis but not itself
  a measurable per-token cascade; (b) it provides the
  temporal anchor (2021-07-23) at which the framework
  was formally articulated, giving the two sibling per-token
  rows a shared policy-framework parent for cohort-evolution
  analysis (2021 tokenized-equity cohort → 2023 broader
  regulatory-category cohort, under the same curation
  framework); (c) it provides a 2021 framework reference for
  any future post-2021 Uniswap-Labs frontend curation rows
  (e.g., subsequent token additions / removals) without
  forcing each such row to re-explain the framework. This is
  the same denominator-control role that other null_case
  rows play in the dataset.

  L0 / L1 / L3 / asset_onchain / offramp_cex are all
  not_applicable on substrate-mismatch grounds. l4_frontend is
  not_measured (not measured / not_applicable) because the
  framework is articulated at L4 but the per-token cascade
  observations are coded on the sibling rows; on this row L4
  is the policy-articulation layer with no row-local
  observation captured.

  Promotion path: this row stays at admission_tier=null_case /
  empirical_shape=null_event indefinitely by design — it is a
  framework-scoping row, not an empirical-case row. Human audit
  should focus on pinning the policy-framework announcement
  page body_hash and the @uniswap/default-token-list repo state
  at the 2021-07-23 cutover so the framework citation is
  archive-grade even though the row carries no
  observed_change.

