  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission).

  comparison shape: 1 observed_change layer (offramp_cex, attribution=direct).
  On 2021-07-19 the New Jersey Bureau of Securities (Bureau Chief Christopher W.
  Gerold) entered a Summary Cease and Desist Order against BlockFi Inc., BlockFi
  Lending, LLC and BlockFi Trading, LLC, finding that BlockFi had funded its
  crypto lending and proprietary trading since 2019-03-04 through the sale of
  unregistered securities in the form of interest-earning crypto accounts
  (BlockFi Interest Account / BIA). Effective 2021-07-22 BlockFi was ordered to
  CEASE AND DESIST from offering the BIA for sale to or from New Jersey. The NJ
  order was the first of a July 2021 multi-state wave (Texas, Alabama, Kentucky,
  Vermont securities regulators issued parallel cease / show-cause actions);
  only the NJ order is captured and load-bearing here.

  §9 inclusion: in scope — a state securities regulator deliberately restricting
  the offering of a legitimate crypto yield/off-ramp product (not a scam
  prosecution; BlockFi was a registered, operating platform whose product was
  ruled an unregistered security). This is the corporate-platform-restriction
  category of §9 ("DOJ/SEC/CFTC/FinCEN enforcement that restricts a legitimate
  platform/operator"), here at the US-state-regulator level.

  trigger.type=regulatory_enforcement and research_stratum=S4_nation_state per
  codebook §5.1/§5.2, following the bitfinex-tether-nyag-2021 precedent (a US
  state regulator — NY OAG — coded regulatory_enforcement + S4). A US state
  securities regulator is neither OFAC (S1/S2), nor a federal DOJ/SEC/CFTC/FinCEN
  actor (S3), nor a non-US national regulator; the closest-fit corpus precedent
  places state-regulator administrative enforcement in S4.

  attribution=direct per §1.1: the NJ order names the actor (NJ Bureau of
  Securities) and the target (BlockFi / BIA) and is the instrument compelling
  the cessation. admission_tier=empirical_case (≥1 strong-attribution
  observed_change layer).

  Sibling: blockfi-sec-lending-2022 (the 2022-02 SEC/state $100M settlement that
  this state action presaged, coded S3); this NJ order is the earlier
  state-level enforcement in the same BlockFi-BIA regulatory trajectory.

scoped_claim: |
  "The New Jersey Bureau of Securities Summary Cease and Desist Order of
  2021-07-19 (effective 2021-07-22) directly ordered BlockFi to cease offering
  its BlockFi Interest Account (BIA) — ruled an unregistered security — for sale
  to or from New Jersey, producing a regulator-mandated severance of the BIA
  crypto yield/off-ramp at the NJ-customer perimeter (offramp_cex load-bearing,
  attribution=direct). The row does not claim ISP-level blocking, on-chain asset
  freeze, or the full enumeration of the parallel multi-state (TX/AL/KY/VT)
  actions."

