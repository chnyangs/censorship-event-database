analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission).

  comparison documenting the late-December 2024 Central Bank of Iran (CBI) block
  of the Iranian-rial payment gateways that domestic cryptocurrency exchanges use
  for deposits. The action coincided with the rial's record low against the US
  dollar on 2024-12-28 and the government's foreign-currency rate reunification,
  and was explicitly a rial-defense measure (curbing flight into USDT/bitcoin).
  Same nation-state payment-rail severance family as Iran CBI 2018 and
  Nigeria CBN 2021.

  Date discipline (anti-fabrication): the original census candidate dated this
  2024-10-23 (the October Shaparak rial-to-crypto restriction). The sources I
  could verify+capture document the late-December 2024 payment-gateway block of
  exchanges specifically (rial record low on December 28; bne IntelliNews +
  nobsbitcoin), so the trigger timestamp is set to 2024-12-28 to match captured
  evidence. The October Shaparak step is described as antecedent campaign context
  in timestamp_sources, NOT asserted as the trigger date.

  Per codebook §5.1, trigger.type=nation_state_block is the canonical fit (a
  central-bank severance of the fiat payment rail to crypto exchanges). Per §5.2,
  research_stratum=S4_nation_state is permitted.

  Per §9 inclusion boundary: in scope — a deliberate state action debanking /
  severing the rial payment rail of legitimate crypto exchanges, restricting user
  access, distinct from a fraud prosecution or a pure soft advisory.

  Why offramp_cex plausible (not direct): the load-bearing captured prose is
  contemporaneous journalism (nobsbitcoin / bne IntelliNews); no CBI directive
  text was captured, and the target is class-level (no exchange enumerated).
  Conservative-default rule (§8.4) -> plausible. A human reviewer may elevate to
  direct once the primary CBI directive is pinned.

  Why L0/L1/L3/L4/asset_onchain not_applicable: a fiat payment-rail / banking
  action; no ISP-level domain block, on-chain issuer freeze, or frontend directive.

  Why temporal_tier=comparable_main_2017_present / analysis_use=
  comparable_analysis: 2024-12-28 sits in the 2017+ comparable corpus.

scoped_claim: |
  "On/around 2024-12-28 the Central Bank of Iran blocked the Iranian-rial payment
  gateways used by domestic cryptocurrency exchanges for deposits, as a rial-defense
  measure amid the currency's record low (withdrawal functions reportedly remained
  operational). The offramp_cex layer carries the load-bearing plausible-attribution
  observation at class level."

