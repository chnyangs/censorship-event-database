target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    Liberty Reserve S.A. (Costa Rica-domiciled centralized digital-
    currency provider; "LR" units backed by a centralized ledger, no
    blockchain) and seven named principals/employees (incl. founder
    Arthur Budovsky and Vladimir Kats). The action seized five domain
    names including LibertyReserve.com. Marked subset: targets the
    named defendants + the Liberty Reserve corporate vehicle + its
    operational domains rather than an enumerated complete set of LR
    account holders. No on-chain addresses (centralized ledger).
  actor_type: digital_currency_administrator_msb
  actor_name: Liberty Reserve S.A. + Arthur Budovsky
  entity: liberty_reserve_budovsky_coordinated_takedown_targets_2013
  canonical_domains:
    - libertyreserve.com

jurisdiction:
  - US

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The takedown operated via domain-name seizure + criminal
      indictment + Section 311, not an ISP/DNS network-layer block.
      L0 measurement instruments do not apply to a 2013 coordinated
      law-enforcement takedown.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Liberty Reserve was a centralized digital-currency ledger (LR
      units administered by the operator); no blockchain, no
      decentralized consensus layer.
  - layer: l3_rpc
    status: not_applicable
    note: |
      No hosted RPC-provider surface; LR was a centralized web service.
  - layer: l4_frontend
    status: measured
    scope: [libertyreserve_com]
    note: |
      Load-bearing layer. The 2013-05-28 coordinated action seized five
      domain names including LibertyReserve.com, taking the operational
      frontend offline. The domain seizure is the directly DOJ-attributed
      frontend takedown, attested in the DOJ SDNY release.
  - layer: asset_onchain
    status: not_applicable
    note: |
      LR units were off-ledger entries administered by Liberty Reserve
      S.A., not a blockchain token; no asset-onchain freeze instrument
      applies.
  - layer: offramp_cex
    status: measured
    scope: [liberty_reserve]
    note: |
      Load-bearing layer. Liberty Reserve operated as a centralized
      digital-currency administrator/exchanger; the indictment + domain
      seizure + Section 311 finding ended LR's service operations
      globally (the platform did not resume). Attested in the DOJ +
      Treasury releases.

