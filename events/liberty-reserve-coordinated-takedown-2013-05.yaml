analysis_notes: |
  **AUTHORED 2026-05-31** (overnight census collection, tick 1, by
  human:xiangwen autonomous mandate) as a historical_baseline_2013_2016
  S3 event. The 2013-05-28 coordinated takedown of Liberty Reserve S.A.
  is the seminal pre-Tornado virtual-currency-provider takedown: DOJ
  SDNY indicted 7 principals (incl. founder Arthur Budovsky) for a ~$6B
  money-laundering enterprise, seized five domains incl.
  LibertyReserve.com (l4_frontend), and Treasury/FinCEN issued the first
  Section 311 finding against a virtual-currency provider — together
  ending LR's service globally (offramp_cex). comparison shape, 2
  observed_change layers (l4_frontend domain seizure + offramp_cex
  service cessation), both attribution=direct (coordinated named state
  action with primary_legal DOJ/Treasury/FinCEN anchors, all body_hash-
  pinned). Corpus previously held only liberty-reserve-costa-rica-
  license-denial-2011-03 (the 2009/2011 SUGEF precursor); this is the
  load-bearing 2013 takedown. L0/L1/L3/asset_onchain not_applicable: LR
  was a centralized off-ledger digital-currency administrator.
  Sources verified via WebSearch 2026-05-31; real DOJ/Treasury/FinCEN
  pages captured + body_hash-pinned (no fabrication).

scoped_claim: |
  "The 2013-05-28 coordinated U.S. takedown of Liberty Reserve S.A.
  (DOJ SDNY indictment of 7 principals + seizure of five domains incl.
  LibertyReserve.com + Treasury/FinCEN's first Section 311 finding
  against a virtual-currency provider) produced a 2-layer cascade:
  l4_frontend (domain seizure) and offramp_cex (global service
  cessation), both attribution=direct. Historical-baseline tier."

