analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase A.1 of comprehensive collection plan; us_federal_enforcement frame discovery): authored by LLM agent without personally verifying Wayback/body_hash; origin=human_reviewed required by validator. Real release must replace this DRYRUN marker with a human-verified audit after pinning real archive anchors.

  **Brief-vs-reality discrepancy documented (per brief instruction).** The
  authoring brief specified `trigger.timestamp=2024-02-21T00:00:00Z` and an
  operator name "Mehdi Borchashvili (or successor — verify against DOJ
  press release)." Cross-checking against the canonical DOJ press release
  surfaced three corrections:
    (1) The DOJ press release announcing the Sinbad operator indictment is
        dated 2025-01-10 (NOT 2024-02-21); the underlying NDGA grand-jury
        indictment was returned 2025-01-07. No DOJ Sinbad-specific press
        release exists for 2024-02-21.
    (2) The DOJ-indicted operators are three Russian nationals — Roman
        Vitalyevich Ostapenko, Alexander Evgenievich Oleynik, and Anton
        Vyachlavovich Tarasov — NOT "Mehdi Borchashvili." Per separate
        WIRED reporting, "Mehdi" is the alias used by Sinbad's claimed
        founder, but the DOJ indictment does not name any "Borchashvili"
        and does not resolve whether the "Mehdi" persona maps to any of
        the three indicted Russian nationals.
    (3) The actor is US_DOJ_NDGA (Office of Public Affairs press release
        announcing an NDGA grand-jury indictment), not a generic US_DOJ.
        The canonical sinbad.io domain was already seized on 2023-11-27
        (i.e. ~2 days BEFORE the OFAC SDN — not "~3 months later" as the
        brief asserted) via FBI seizure warrant in coordinated action with
        Netherlands FIOD and Finland NBI. The 2025-01-10 DOJ event is
        therefore the criminal-charges-against-operator companion to the
        2023-11-27 same-week seizure, not a free-standing post-OFAC
        seizure.
  These corrections are applied to the row; the brief's intent (capture
  the DOJ side of the Sinbad enforcement complex, distinct from the OFAC
  SDN at sinbad-ofac-2023) is preserved.

  comparison — Sinbad-DOJ-2024 (now 2025-01-10) is a structural twin of
  helix-doj-mixer-2020 (single-jurisdiction US operator indictment) and a
  cousin of chipmixer-doj-2023 / samourai-doj-2024 (coordinated US +
  European seizure-plus-indictment). Unlike chipmixer / samourai (where
  domain seizure and operator indictment landed on the same day),
  Sinbad's enforcement was time-split: the 2023-11-27 domain seizure
  produced the same-week L4 effect (recorded contextually via
  sinbad-ofac-2023 and the contemporaneous-reporting trail), while this
  2025-01-10 event records the operator-state transition that closes the
  loop ~13 months later. Two observed_change layers (l4_frontend +
  offramp_cex) with direct attribution → empirical_case admission tier
  with comparison shape.

  Distinguishing structural feature vs. the mixer-indictment comparison
  set: Sinbad uniquely shows a coordinated multi-jurisdictional seizure
  (US + NL + Finland) PAIRED WITH a single-jurisdictional US-only
  operator indictment ~13 months later. Finland (FI) is not in the
  controlled jurisdictions vocab; the cooperating Finnish NBI role is
  documented narratively but not as a jurisdiction enum entry.

  Follow-up directions for the next human audit pass: (a) pin a verified
  Wayback capture of the 2025-01-10 DOJ press release with body_hash /
  body_path; (b) capture the earliest available 2023-11-27/2023-11-29 FBI
  seizure banner page at sinbad.io as direct L4 evidence; (c) attempt to
  resolve the "Mehdi" alias ↔ Ostapenko / Oleynik / Tarasov mapping
  question. The prior apparent inconsistency with sinbad-ofac-2023 is now
  resolved: those sibling Wayback captures show seizure banners, not an
  operational post-OFAC Sinbad frontend.

scoped_claim: |
  "The 2025-01-10 DOJ Office of Public Affairs unsealing of the NDGA
  grand-jury indictment of Roman Vitalyevich Ostapenko, Alexander
  Evgenievich Oleynik, and Anton Vyachlavovich Tarasov for operating the
  Sinbad.io Bitcoin mixer produced a 2-layer comparison-shape cascade in
  the dataset: an l4_frontend finality anchored by the operator
  indictment (atop the prior 2023-11-27 FBI + Netherlands FIOD + Finland
  NBI domain seizure) and an offramp_cex mixer-operator-state transition
  (2 of 3 operators arrested 2024-12-01; Tarasov at large). Distinct from
  sinbad-ofac-2023 (OFAC SDN designation 2023-11-29) and from
  chipmixer-doj-2023 / samourai-doj-2024 in that the enforcement was
  time-split: multi-jurisdictional infrastructure seizure ~13 months
  before the single-jurisdictional US-only operator indictment."

