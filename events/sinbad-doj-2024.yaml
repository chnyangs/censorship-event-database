target:
  kind: entity
  entity: sinbad_mixer_doj_target_2024
  enumeration: subset
  enumeration_note: |
    Sinbad.io was a Bitcoin mixer marketed as a Tornado Cash successor for
    the Bitcoin chain; per OFAC and DOJ, it served as the "preferred mixing
    service" of the DPRK Lazarus Group and processed proceeds from the 2022
    Harmony Horizon Bridge and Axie Infinity / Ronin Bridge hacks plus
    ransomware funds. The Sinbad service was founded in September 2022 by
    an operator using the alias "Mehdi" (per WIRED 2024 reporting); the
    2025-01-07 NDGA indictment names three Russian nationals as operators
    — Ostapenko, Oleynik, and Tarasov — without resolving whether the
    "Mehdi" persona maps to any of the three. Target identified by
    canonical domain sinbad.io and the operator-state of the indicted
    natural persons. The indictment does not publish an OFAC-SDN-style
    enumerated address set at the event level; address-set enumeration
    lives on the sibling sinbad-ofac-2023 row (2 BTC addresses).
  protocol: sinbad_io
  actor_type: mixer_service
  actor_name: Sinbad (sinbad.io)
  chains: [bitcoin]
  canonical_domains: [sinbad.io]

jurisdiction:
  - US
  - NL

coverage:
  - layer: l0_network
    status: not_measured
    scope: [sinbad.io]
    note: |
      L0 network-layer OONI probe coverage of sinbad.io is effectively absent
      for the relevant window per the sibling sinbad-ofac-2023 OONI query
      (0 measurements 2023-10-29..2023-12-29; artifact
      sources/l0_datasets/sinbad-ofac-2023/sinbad.io__ooni.json). No new
      L0 query is performed at this DOJ-event level; the OFAC-event L0 gap
      finding carries forward.
  - layer: l1_consensus
    status: not_applicable
    chain: bitcoin
    note: |
      Bitcoin has no PBS / MEV-Boost analogue and no aggregate
      OFAC-compliant-relay metric. L1-layer reasoning from the
      Ethereum-focused comparison cases does not apply.
  - layer: l3_rpc
    status: not_applicable
    chain: bitcoin
    note: |
      Bitcoin wallet transactions are typically broadcast via P2P or
      public-API endpoints without the Ethereum-style "OFAC-compliant RPC"
      intermediary layer. Not_applicable to avoid transplanting an
      Ethereum-specific construct.
  - layer: l4_frontend
    status: measured
    scope: [sinbad.io]
    note: |
      The canonical sinbad.io frontend was juridically anchored as seized by
      the time of this 2025-01-10 DOJ indictment unsealing: the domain was
      taken down on 2023-11-27 via FBI seizure warrant in coordinated
      action with the Netherlands FIOD and Finland NBI (~roughly 13 months
      prior). The 2025-01-10 operator indictment converts the frontend's
      state from "seized but operator at large / under investigation" to
      "seized + named operators indicted + 2 of 3 arrested" — a structural
      finality on the frontend layer. attribution=direct via the DOJ
      primary-legal anchor, which explicitly references the prior
      domain-seizure operation. Sibling row sinbad-ofac-2023 now records
      the corrected Wayback interpretation: the 2023-11-29 and 2023-12-09
      captures are canonical-domain seizure-banner pages, not proof that
      the pre-seizure mixer frontend remained operational after OFAC
      designation.
  - layer: asset_onchain
    status: not_applicable
    chain: bitcoin
    note: |
      Bitcoin is a native-asset chain without issuer-level freeze primitives
      (no USDC-style blacklist function). Asset-layer reasoning from
      Ethereum cases does not apply.
  - layer: offramp_cex
    status: measured
    scope: [sinbad_io_operator_state]
    note: |
      The load-bearing layer for this row: the indictment converts the
      Sinbad operator-state from "service seized + operators at large" to
      "named operators indicted + 2 of 3 arrested (Ostapenko, Oleynik
      arrested 2024-12-01; Tarasov at large)." This is a mixer-operator-state
      transition analogous to helix-doj-mixer-2020, chipmixer-doj-2023, and
      samourai-doj-2024. attribution=direct via the DOJ primary-legal
      source. No per-address chain-analytics report slices are pinned at
      this event level; the substrate Chainalysis / TRM / Elliptic anchors
      from sinbad-ofac-2023 carry forward.

