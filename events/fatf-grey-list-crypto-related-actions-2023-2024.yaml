analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17**

  Aggregate null_event documenting the 2023-2024 FATF plenary
  outputs that materially adjusted the "jurisdictions under
  increased monitoring" (grey) list with explicit crypto / VASP
  compliance framing. In-scope subset: UAE (October 2023 plenary
  recognition of action-plan progress; formal removal 2024-02-23,
  with VASP supervision a named pillar) and Türkiye (originally
  grey-listed 2021-10 for AML deficiencies including crypto;
  removed 2024-06-28 after the 2024-06-26 Turkish parliament
  crypto-asset law mandating SPK licensing of CASPs). Trigger
  timestamp anchored to the October 2023 plenary date as the
  earliest unambiguous crypto-tied grey-list signal in the window;
  June 2024 plenary outputs are captured via the additional
  citations.

  Per §6 codebook the temporal_tier is comparable_main_2017_present
  and the canonical analysis_use is comparable_analysis. Per §7
  codebook the enumeration is `subset` with class-level rationale
  documented in target.enumeration_note (FATF grey-list mechanism
  binds via member-state implementation and correspondent-banking
  pressure; other 2023-2024 grey-list deltas without explicit VASP
  framing are out of scope). Per §3 codebook the empirical_shape is
  null_event: 0 observed_change layers directly attributable to the
  aggregate grey-list adjustments at the corpus's resolution.
  Downstream national-level cascades (UAE 2024 exchange Travel Rule
  fines; Türkiye SPK licensing enforcement) are tracked as separate
  child events. Per §4 codebook admission_tier=null_case (0 strong-
  attribution observed_change layers).

  Per §1.1 codebook, the single off-ramp row uses
  attribution=`none` because observation_kind=`coverage_gap` (no
  direct per-event observed_change at the corpus's resolution).
  This event functions as a temporal landmark within the parent
  FATF supranational arc (R.15 2019 → 2021 Updated Guidance → 2023
  Targeted Update → 2024 Targeted Update) and as a sibling anchor
  to the 2023 Targeted Update for human auditors tracing the
  grey-list compliance-pressure channel into national VASP rule
  cascades. DRYRUN: archival anchors asserted but not personally
  verified by the LLM agent; human auditor must pin real Wayback /
  body_hash anchors before release.

