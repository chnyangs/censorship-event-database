  null_event documenting the 2023-02-07 issuance of the Dubai VARA
  Virtual Assets and Related Activities Regulations 2023 establishing
  the Full Market Product (FMP) licence framework and tiered
  provisional → preparatory MVP → operating MVP → FMP licensing
  progression. Dubai-emirate-level crypto-licensing regime, distinct
  from the federal UAE Securities and Commodities Authority (SCA)
  crypto regime and the separate DIFC/DFSA framework. VARA was
  established by Dubai Law No. 4 of 2022 and is the world's first
  dedicated virtual-assets-only regulator at sub-sovereign emirate
  level.

  Trigger.type=regulatory_enforcement per codebook §5.1 (non-US
  national/emirate regulator administrative framework). Stratum-actor
  map §5.2 maps regulatory_enforcement → S4_nation_state. Sub-sovereign
  emirate-level character is structurally analogous to the HK SFC
  VATP regime (sub-sovereign within PRC region) — we cross-reference
  the parallel HK regime and the JP FSA stablecoin regime via
  related_events.

  Coded null_event / null_case because (a) no specific FMP licence
  grant occurred at the 2023-02-07 issuance date — VARA explicitly
  stated FMP licences would only be granted after regime testing;
  (b) existing MVP applicants and legacy UAE-based VASPs were provided
  a transition route towards full FMP licensing, so no immediate
  delisting cascade is documented; (c) downstream FMP licence grants,
  enforcement actions against unlicensed operators, and the September
  2023 VARA cease-and-desist actions are forward-looking events that
  will be authored as separate downstream rows. This event captures
  the regulatory-framework trigger; downstream FMP-grant and
  enforcement events are expected separate rows.

  Paper-relevant contrast vs hongkong-sfc-vatp-licensing-2023-06:
  both 2023 sub-sovereign crypto-licensing frameworks, but VARA
  issues on 2023-02-07 with immediate effect and a multi-stage
  MVP→FMP progression conditioned on regime testing, whereas HK SFC
  VATP commences 2023-06-01 with a single licence category and a
  hard 2024-05-31 transitional deadline. VARA is earlier and
  staged-progressive; HK SFC VATP is later and cliff-edge with a
  hard mainland-China-resident bar.

  Paper-relevant contrast vs japan-fsa-stablecoin-psa-effective-
  2023-06: VARA is a comprehensive multi-activity VASP licensing
  framework (seven activity categories plus issuance), whereas JP
  FSA PSA Amendment is a narrow stablecoin-issuance-and-intermediation
  regime (EPI + EPIESP). Both are 2023 industrial regulatory-framework
  triggers; VARA is sub-sovereign emirate-level, JP FSA is sovereign
  national-level.

  DRYRUN caveats: trigger primary citation is asserted with
