  "Dubai's VARA issued the Virtual Assets and Related Activities
  Regulations 2023 on 2023-02-07 with immediate effect, establishing
  a sub-sovereign emirate-level virtual-asset service-provider
  licensing framework with a tiered provisional → preparatory MVP →
  operating MVP → Full Market Product (FMP) licensing progression
  across seven regulated activity categories plus issuance, distinct
  from the federal UAE SCA crypto regime and the DIFC/DFSA framework.
  The row does not claim any specific FMP-licence grant, VASP
  delisting cascade, on-chain asset-layer freeze, or frontend
  takedown at the 2023-02-07 issuance date; it documents the
  regulatory-framework trigger as a null_event pending downstream
  FMP-licence-grant and enforcement events authored as separate rows."

