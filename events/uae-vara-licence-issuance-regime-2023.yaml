target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    Class-level subset enumeration: all virtual asset service providers
    providing services to or from the Emirate of Dubai, excluding the
    Dubai International Financial Centre (DIFC, which falls under the
    Dubai Financial Services Authority DFSA). The regime covers seven
    licensed VA activity categories — (1) Advisory, (2) Broker-Dealer,
    (3) Custody, (4) Exchange, (5) Lending and Borrowing, (6) Payments
    and Remittances, (7) VA Management and Investment — plus VA issuance
    as a regulated activity. Three regulated populations: (a) existing
    MVP Operational licence applicants from the 2022 MVP regime;
    (b) legacy UAE-based VASPs operating prior to the 2023-02-07
    framework; (c) new market entrants. Address-level enumeration is
    not applicable — this is a sector-wide VASP licensing framework.
  protocol: null
  actor_type: vasp_licensing_regime
  actor_name: VARA Dubai virtual asset service provider licensing regime (MVP → FMP)
  chains: []
  canonical_domains: []

