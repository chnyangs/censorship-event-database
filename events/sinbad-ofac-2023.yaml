analysis_notes: |
  **LAST_HUMAN_AUDIT STAMP — DRYRUN 2026-05-15**: stamped by automated pipeline-demo per `analysis/null_audits/AGGREGATE.md`. Both LLM cross-audit agents (A,B) converged on `pass` or `pass_with_concerns`; this stamp records that the case has been pre-screened by 2 LLM agents and would be a human-audit candidate for the next iteration. The corpus-wide `offramp_cex.measured` convention concern is unresolved (see AGGREGATE.md P2). For a real release, replace this DRYRUN marker with a human-verified audit.
  
    null_event documenting the 2023-11-29 OFAC designation of the Sinbad Bitcoin
  mixer as a Tornado Cash successor for DPRK laundering. The cross-layer cascade shape is
  fundamentally different from Ethereum-protocol cases because (a) Bitcoin has no PBS / relay
  censorship analogue (L1 not_applicable), (b) Bitcoin has no issuer freeze (asset_onchain
  not_applicable), and (c) the mixer operates its own domain rather than depending on a
  smart-contract protocol that lives on-chain.

  The one grounded observation is at L4 frontend: sinbad.io remained reachable and
  content-identical from event day through at least 10 days post-event. This is a
  paper-worthy contrast to the Tornado 2022 L4 observation (tornado.cash was taken offline
  within ~22 hours). The difference reflects infrastructure ownership: Tornado's canonical
  frontend was hosted via Cloudflare / Fleek-adjacent US infrastructure and was taken down by
  compliance-driven service providers, whereas Sinbad operated its own domain + onion mirror
  and was not subject to US-side takedown pressure in the short term.

  Follow-up directions (post-admission): (1) CEX compliance statements or chain-analytics reports tying the 2 BTC
  addresses to specific exchange freezes; (2) follow-up Wayback snapshots through 2024 to
  document the eventual fate of sinbad.io (did operators eventually abandon the domain?); and
  (3) any public-press or DOJ action against Sinbad operators.

scoped_claim: |
  "OFAC designation of the Sinbad Bitcoin mixer on
  2023-11-29 did not cause a short-term takedown of the canonical sinbad.io frontend
  (reachable with identical content 23 hours post-event and 10 days post-event), in
  structural contrast to the Ethereum-protocol Tornado Cash 2022 case where frontend
  disruption occurred within ~22 hours."

