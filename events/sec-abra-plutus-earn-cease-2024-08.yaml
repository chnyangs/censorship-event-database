analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: refined the wave-2
  VERIFY-FLAG by rendering+grepping the captured source. Abra/Plutus/Earn/unregistered/securities/wind-down all present in the captured Aug-2024 SEC release; the $1.65M penalty (a Jan-2025 final-judgment figure, NOT in the Aug-2024 capture, and mis-derived from a '1765' substring) was softened to 'civil penalty' attributed to the SEC docket. 3 primary_legal sources. Sources meet the admission floor.).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission). On 2024-08-26 the US SEC
  (press release 2024-105) charged Plutus Lending, LLC (d/b/a Abra) over the
  Abra Earn retail crypto-lending product as unregistered crypto-asset
  securities and an unregistered investment company; Abra wound down Abra Earn
  for US customers (the product had ~$600M at its height, nearly $500M from US
  investors). A permanent injunction plus a civil penalty were entered
  on final judgment (Jan 2025; the captured Aug-2024 release predates the figure). This is SEC enforcement forcing the wind-down
  of a legitimate crypto yield/off-ramp product — in scope per codebook §9
  (SEC action restricting a legitimate operator/product). comparison shape,
  1 observed_change layer (offramp_cex), attribution=direct (the order names
  the specific target). asset_onchain not_applicable: a securities/
  investment-company cease, no on-chain freeze, so no §1.6 tx_hash floor
  applies. Sources verified via WebSearch 2026-05-31; the real SEC.gov press
  release captured + body_hash-pinned; grep of the captured body confirms
  "Abra Earn", "Plutus", "winding down", "500 million",
  "600 million", "investment company", "Unregistered" (no fabrication).

