analysis_notes: |
  QUALITY-LOOP REPAIR 2026-06-01: re-scoped from the prior dry-run row that
  treated a generic Binance support URL as a primary_corporate anchor and
  listed an inaccurate eight-asset cohort. The repair could not locate a
  replayable public Binance support announcement for this 2023 event; live
  Cointelegraph/The Block/Blockworks URLs either 404 or block scripted fetches.
  The retained evidence is therefore pinned Wayback captures of contemporary
  reporting, including reporting that carries Binance spokesperson statements.

  The event is admitted as evidence_tier=attested_secondary, not as a strict
  admission-grade primary-source case. The final observed restriction is scoped
  to Beam, Monero, MobileCoin, Firo, and Horizen for users in France, Italy,
  Poland, and Spain. The seven assets reported as spared on 2023-06-26
  (Decred, Dash, Zcash, PIVX, Navcoin, Secret, and Verge) are excluded from
  the target set. No new last_human_audit stamp is asserted for this automated
  re-scope.

scoped_claim: |
  "Binance Holdings Limited's final 2023-06-26 privacy-asset restriction for
  users in France, Italy, Poland, and Spain is represented here as an
  attested_secondary S5 corporate exchange-access event. After a broader May
  plan to restrict 12 privacy assets, contemporaneous reporting of Binance's
  June 26 revision says seven assets were spared and Beam, Monero, MobileCoin,
  Firo, and Horizen remained included in the restrictions. The only
  changed-layer claim retained is the centralized-exchange off-ramp catalogue
  restriction for that final five-asset cohort; attribution is plausible
  because the replayable artifacts are journalistic reports carrying Binance
  statements rather than a public first-party Binance notice."

scoped_knowledge: |
  This row is useful as an aggregate datapoint for the 2023-2024 privacy-asset
  delisting/restriction wave, but it should not be cited as a primary-source
  narrative anchor until a replayable Binance first-party notice is found. It
  pairs with okx-privacy-token-delist-2024 and kraken-monero-eu-delisting-2024
  on the CEX privacy-asset restriction axis, and with eu-mica-2023 as the
  regulatory substrate context.

