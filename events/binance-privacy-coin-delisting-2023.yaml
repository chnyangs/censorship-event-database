  comparison — S5 corporate-policy-change event documenting Binance
  Holdings Limited's 2023-06-26 EU-wide privacy-asset spot-pair
  delisting for users resident in France, Italy, Poland, and Spain.
  Cohort leader for the 2023-2024 privacy-coin-delisting wave on
  centralized exchanges: this row anchors the start of the wave
  (Binance EU 2023-06), with okx-privacy-token-delist-2024
  (2023-12-29, global cohort) as the same-year sibling and the
  Kraken-EU 2024 privacy-asset delisting as the downstream follow-on
  (pending separate event row). The trigger sits 17 days after the
  MiCA Regulation (EU) 2023/1114 Official Journal publication
  (2023-06-09; see eu-mica-2023), positioning the action as
  pre-effective-date compliance preparation by the largest global
  CEX rather than a post-effective-date enforcement response — the
  regulatory framework was the substrate, not the immediate legal
  instrument. The geofenced (FR/IT/PL/ES) rather than EU-wide scope
  reflects per-member-state regulator pressure (e.g., AMF France,
  CONSOB Italy, KNF Poland, CNMV Spain) reading the MiCA framework
  ahead of formal CASP-licensing rollout.

  Single observed_change layer (offramp_cex) with attribution=direct
  via the Binance customer-support notice primary anchor. L0 / L1 /
  L3 / l4_frontend / asset_onchain are all not_applicable on
  substrate-mismatch grounds — this is a CEX corporate-policy
  listing-restriction event, not a protocol or network primitive
  engagement, and the L4 announcement surface is co-located with the
  off-ramp catalogue change (treated symmetrically with the L4
  handling in okx-privacy-token-delist-2024). Pairs with
  okx-privacy-token-delist-2024 on the corporate-CEX-delisting axis
  in the same calendar year, both load-bearing at offramp_cex but
  with different jurisdictional scopes (Binance: geofenced EU-4;
  OKX: global product-catalogue trim). Pairs with eu-mica-2023 on
  the regulatory-substrate axis: MiCA is the supranational framework
  trigger (S6); this row is one of the earliest documented downstream
  S5 corporate-policy responses by a CASP-relevant operator.

  Why empirical_case rather than anchor_case: in this DRYRUN pass
  the load-bearing offramp_cex observation carries direct attribution
  but the citation is a single primary-corporate notice with
  provisional wayback anchor (not body-hash-pinned). Promotion to
  anchor_case requires (a) the Binance notice body_hash / body_path
  pinning of the precise notice-page URL slug during human audit,
  (b) an independent semi-primary or supporting tracker source
  confirming the post-effective-date absence of the removed spot
  pairs in Binance's public FR/IT/PL/ES ticker listings, and
  (c) consideration of the per-member-state regulator
  correspondence (AMF / CONSOB / KNF / CNMV) that may have
  triggered or accompanied the batch.

scoped_claim: |
  "Binance Holdings Limited's 2023-06-26 spot-trading-pair removals
  on binance.com for users resident in France, Italy, Poland, and
  Spain — covering the privacy-asset cohort (Monero/XMR, Zcash/ZEC,
  Dash/DASH, MobileCoin/MOB, Beam/BEAM, Horizen/ZEN, NAV Coin/NAV,
  Firo/FIRO) — narrow the centralized-exchange off-ramp surface for
  the affected privacy assets in the Binance EU-member-state
  corridor. The offramp_cex layer carries the load-bearing
  direct-attribution observation; L0 / L1 / L3 / l4_frontend /
  asset_onchain are not_applicable for a geofenced exchange-
  listing-only action. The row is the cohort-leader anchor for the
  2023-2024 privacy-coin-delisting wave on centralized exchanges
  (followed by okx-privacy-token-delist-2024 and the Kraken-EU
  2024 follow-on, coded separately)."

scoped_knowledge: |
  This event is the canonical 2023 S5 centralized-exchange
  privacy-asset delisting anchor in the dataset under MiCA-prep
  pressure. The 2023-06-26 Binance notice sits 17 days after the
  MiCA Regulation (EU) 2023/1114 Official Journal publication
  (2023-06-09; eu-mica-2023), positioning the action as
  pre-effective-date compliance preparation by the global largest
  CEX rather than a post-effective-date enforcement response.

  The comparison pair with okx-privacy-token-delist-2024
  separates the geofenced-EU-cohort delisting axis (Binance at
  offramp_cex, FR/IT/PL/ES user cohorts) from the global-product-
  catalogue-trim axis (OKX at offramp_cex, no geofence), both
  occurring within ~6 months and both documenting corporate-
  compliance product-catalogue narrowing absent a single OFAC
  trigger. Together with the downstream Kraken-EU 2024 follow-on
  (pending event row), the three form the early-cohort backbone
  of the 2023-2024 CEX privacy-asset delisting wave.

  Paper-relevant axes: (a) the regulatory-substrate / corporate-
  response coupling (MiCA framework S6 → Binance EU-4 S5 → OKX
  global S5 → Kraken EU S5), (b) the geofencing vs global-catalogue
  pattern split within S5 corporate responses to the same
  framework, and (c) the cohort-leader timing (Binance 2023-06)
  as the earliest documented major CEX response to MiCA publication.

