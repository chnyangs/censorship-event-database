  comparison — lender variant of the FTX twin pattern. 2023-07-13
  same-day coordinated DOJ + SEC + CFTC + FTC actions against Celsius
  Network and founder Alex Mashinsky, filed exactly one year after the
  2022-07-13 Chapter 11 petition and ~13 months after the 2022-06-12
  withdraw-freeze. The cascade was already in motion before the
  indictment moment: the off-ramp had collapsed via the operational
  withdraw-freeze, the bankruptcy reorganization was already running, and
  the CEL token had cascaded. The 2023-07-13 codification adds the
  criminal/civil legal disposition layer on top of the pre-existing
  operational collapse. Single-layer offramp_cex observed_change with
  direct attribution → empirical_case admission tier (comparable to
  blockfi-sec-lending-2022 in shape; structurally narrower than
  ftx-bankman-fried-doj-2022 which spans both exchange + lending arms).

scoped_claim: |
  "The 2023-07-13 coordinated DOJ + SEC + CFTC + FTC actions against
  Celsius Network and Alex Mashinsky codify a single-layer offramp_cex
  cascade: the centralized lending platform's withdraw-freeze (2022-06-12)
  and Chapter 11 collapse (2022-07-13) are legally disposed via criminal
  indictment + securities-fraud + commodity-pool + FTC consumer-protection
  parallels. Lender variant of the FTX twin; structurally narrower than
  the FTX exchange-plus-lender cascade."

