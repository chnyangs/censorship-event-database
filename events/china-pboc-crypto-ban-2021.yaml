        wayback: https://web.archive.org/web/20260421115638/https://www.scmp.com/business/article/3152241/binance-halt-peer-peer-trading-service-china-severing-final-link-market
        body_hash: sha256:df269c5406d20bae152e57121479d411a296707aee19e47d461c6337d0baf429
        body_path: sources/http_captures/china-pboc-crypto-ban-2021/exchange-announcements/www.scmp.com__business-article-3152241-binance-halt-peer-peer-trading-service-china-severing-final-link-market__858b1edd34.html
        note: South China Morning Post contemporaneous report on Binance halting its P2P trading service for China by end of 2021, providing journalist-attested corroboration for the primary_corporate anchor above.

analysis_notes: |
  Nation-state policy trigger (2021-09-24 PBOC joint notice) with
  minute-precision timestamp anchored in 5 Wayback snapshots dated that
  same day. Two admission-grade offramp_cex observations attached, both
  attribution=direct: (1) Huobi's official "Gradually Retire Mainland
  China Users" announcement (2021-09-26, ~37 h after the PBOC notice),
  explicitly citing the PBOC policy as the reason; (2) Binance's
  official "China PBoC Update" announcement (2021-09-25, ~13 h after),
  anchored via a 2021-10-24 Wayback snapshot because the live page
  now bot-blocks automated fetchers.

  L0 coverage is explicitly `not_measured` with a detailed gap note
  recording the OONI query that returned zero CN-vantage measurements
  across seven canonical crypto domains in the post-ban window; this is
  a finding about the volunteer measurement ecosystem, not a claim
  about what the GFW did. L1/asset/L3 are `not_applicable` or
  `not_measured` by construction of a nation-state policy event.
  L4 frontend Wayback-diff evidence is deferred (out of scope for
  this release).

scoped_claim: |
  Within 13-37 hours of the 2021-09-24 PBOC joint notice going public, both
  Huobi and Binance published official statements citing the notice and
  committing to end of services for mainland-China users; broader
  network-layer (L0) and frontend-layer (L4) reactions are not included in
  this scoped claim because independent measurement evidence for them
  is not yet attached to this event.

