trigger:
  type: nation_state_block
  actor: CN_PBOC
  timestamp: 2021-09-24T10:51:05Z
  timestamp_precision: minute
  citation:
    - type: primary_legal
      url: http://www.pbc.gov.cn/goutongjiaoliu/113456/113469/4348521/index.html
      wayback: https://web.archive.org/web/20210924105105/http://www.pbc.gov.cn/goutongjiaoliu/113456/113469/4348521/index.html
      body_hash: sha256:a5c7da7da584c23c3e880f394b445cea75f0ad11aee41f79b10d2da4b2884a84
      body_path: sources/archived_htmls/china-pboc-crypto-ban-2021/pbc-notice-20210924.html
      note: PBOC "Notice on Further Preventing and Dealing with the Risk of Speculation in Virtual Currency Trading" (关于进一步防范和处置虚拟货币交易炒作风险的通知) issued jointly with nine other PRC agencies on 2021-09-24, declaring virtual-currency-related business activities illegal in the PRC and foreign-exchange services serving PRC residents in violation. The earliest Wayback snapshot is 2021-09-24 10:51:05 UTC; five independent snapshots from the same day (10:51, 11:12, 11:36, 12:49, 16:34 UTC) corroborate that the page was public by mid-morning UTC. The authoritative PBOC origin URL currently returns 404 (the page moved); the locally archived Wayback body is the load-bearing evidence for this trigger.
  timestamp_sources:
    - type: primary_legal
      note: The five Wayback snapshots all dated 2021-09-24 UTC, with the earliest capture at 10:51:05 UTC, tighten the trigger timestamp from day-precision to minute-precision (2021-09-24T10:51:05Z is an upper bound on publication time).

target:
  kind: entity
  enumeration: complete
  enumeration_note: Canonical target is the PRC policy directive itself. Named overseas exchanges and virtual-currency services serving PRC residents are implicit second-order targets; we record them in scope_descriptor fields on L0 observations rather than enumerating them at the event level.
  entity: prc_virtual_currency_activity_ban
  chains: []
  canonical_domains:
    - binance.com
    - www.okx.com
    - huobi.com
    - tronscan.org
    - etherscan.io

jurisdiction:
  - CN

coverage:
  - layer: l0_network
    status: not_measured
    note: |
      L0 network-layer OONI API query performed 2026-04-22. Searched the
      public OONI Explorer API (api.ooni.io/api/v1/measurements) for
      test_name=web_connectivity across the following domain×window
      combinations:
        huobi.com  2021-08-24..2021-10-24  -> 0 results
      Aggregate across all queried domains: **0 / 1 domains
      returned any OONI volunteer measurements in the relevant windows**.
      Artifact: sources/l0_datasets/china-pboc-crypto-ban-2021/huobi.com__ooni.json
      (body_hash sha256:d638cd277b022fee122fc82daf643ca4efb6c5450eb1dbee753f64a19aaf2e2d).
      Measurement-gap finding: OONI volunteer probe coverage of the
      crypto-infrastructure domains in scope is effectively absent for
      these windows; L0 remains not_measured (with attested negative
      query) until Censored Planet raw ingestion or another L0 source
      is wired in.
  - layer: l1_consensus
    status: not_applicable
    note: A PRC policy directive does not map to Ethereum PBS-era relay filtering. PRC-side consensus activity would be measured through separate primitives (mining-pool attribution pre-2021-ban, which is outside this event's scope).
  - layer: l3_rpc
    status: not_applicable
    note: |
      Pre-Merge event (Ethereum Merge 2022-09-15). The OFAC-compliance-adjacent
      public Ethereum RPC substrate (Flashbots Protect launched 2022-11,
      MEV-Blocker launched 2023-03-27) did not exist at event time. Same
      construct-did-not-exist reasoning as L1 consensus coverage for
      pre-Merge events. not_applicable rather than not_measured.
      L3 RPC-layer public-provider filter-list pin: the two dominant
      OFAC-compliance-adjacent public Ethereum RPC providers are MEV-Blocker
      (mevblocker.io) and Flashbots Protect (docs.flashbots.net). Both
      captured 2026-04-22 as ecosystem-level primary_corporate anchors for
      L3-layer reasoning:
        mevblocker.io landing: body_hash sha256:f580083a67f052d2d8301dc1975c6f1f369474d25a10f0587ef081f70379cc67
        docs.flashbots.net/flashbots-protect/quick-start: body_hash sha256:b937ed96974815d638d2db412ad674d417ae71f0295f625c8cec839638307282
      Status remains not_measured because per-event bracketing snapshots
      of the provider filter lists (pre-event / event-day / post-event) are
      not yet pinned from the Wayback CDX. The anchors establish the
      measurement substrate; per-event slices would promote status to
      partially_measured.
  - layer: l4_frontend
    status: not_measured
    note: Crypto exchange frontends serving PRC residents reacted with phased withdrawal / account-freeze timelines in the months following. Evidence collection (Wayback snapshots + exchange announcement pages) not yet performed for this event.
  - layer: asset_onchain
    status: not_applicable
    note: The directive does not map to stablecoin-issuer admin-method freezes at any specific address level.
  - layer: offramp_cex
    status: measured
    scope:
      - huobi
      - binance
    note: Huobi and Binance primary-corporate announcements are archived (body_hash + Wayback); both name the PBOC notice directly. OKX and Gate.io announcements are not yet attached and are out of scope for this release's offramp observations.

