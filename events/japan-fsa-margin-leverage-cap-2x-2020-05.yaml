analysis_notes: |
  **NEW EVENT AUTHORED -- AGENT_DRAFT 2026-06-01**. Created from the P4
  census-gap exact queue. The event remains `status=draft` and
  `origin=agent_draft`; automation must not promote it to an admitted paper row
  without human admission review.

  Inclusion rationale: the captured FSA sources describe an operative product
  restriction on retail crypto-asset CFD/margin transactions rather than a soft
  investor warning. A minimum 50% margin requirement corresponds to a 2x maximum
  leverage cap for the regulated crypto-asset CFD product surface. This is
  modeled as a single-layer `offramp_cex` / regulated intermediary product
  restriction, parallel to other margin or lending-product restrictions.

  Caution for human review: the current draft uses official FSA explanatory
  materials and an official FSA framework deck. Before admission, a human
  reviewer should decide whether the underlying Cabinet Office Order /
  Financial Instruments and Exchange Act instrument should be pinned directly,
  and whether the event should remain in scope as a product-surface restriction
  rather than a narrower prudential market-conduct rule.

scoped_claim: |
  As of 2020-05-01, Japan's FSA crypto-asset regulatory amendments brought
  retail crypto-asset CFD/margin transactions under the regulated financial
  instruments perimeter and required a minimum 50% margin for retail
  crypto-asset CFD transactions, modeled here as a 2x leverage cap at the
  regulated exchange/off-ramp product layer.

