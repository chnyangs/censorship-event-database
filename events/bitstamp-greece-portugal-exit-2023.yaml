  **NEW EVENT AUTHORED — DRYRUN 2026-05-17** (Wave 2.3 P2 preamble:
  Bitstamp Greece/Portugal 2023 hypothesized exit — coded as
  null_event because the authoring agent could not pin specific
  GR or PT exit-announcement evidence). Authored by LLM agent
  without personally verifying Wayback / body_hash; only valid at
  status=draft / origin=agent_draft. The slug
  `bitstamp-greece-portugal-exit-2023` is retained verbatim per the
  authoring instruction but the empirical claim it suggests is NOT
  admitted: null_event + null_case fallback per the instruction's
  explicit "If you can't pin specific 2023 GR/PT exit dates: code as
  null_event with note explaining vague slug" clause.

  Why null_event:
  - The 2026-05-17 WebSearch pass on "Bitstamp Greece Portugal exit
    2023" surfaced documented 2023 Bitstamp policy actions (US ETH
    staking halt 2023-08-24; Canada exit announced 2023-10 effective
    2024-01-08) but NO Greece-specific or Portugal-specific 2023
    exit announcement.
  - The Banco de Portugal authorized-entity registry currently lists
    Bitstamp Europe S.A. as authorized, which is positive (not
    merely absent) evidence against a 2023 Portugal exit.
  - Per §3 codebook: 0 observed_change layers → null_event.
  - Per §4 codebook: 0 strong-attribution observed_change layers →
    null_case.
  - Per §8.4 codebook: ambiguous coding defaults to the more
    conservative value (null_case over empirical_case).

  Slug retention note: the slug
  `bitstamp-greece-portugal-exit-2023` is deliberately preserved so
  that any future evidence surfacing a specific 2023 GR/PT exit
  action can be admitted under the same id; the current row stands
  as a documented null search until then. This is the
  observed_no_change discipline (Kazakhstan precedent §1.5 analogue
  for corporate-policy retreats): documented-but-uncaptured
  exit-action claims must be coded as not_measured / null_event
  until pinned.

  Codebook decisions applied:
  - trigger.type=corporate_policy_change per §5.1 (hypothesized
    exchange-initiated market retreat) — kept per authoring
    instruction even though no specific action is being admitted.
  - research_stratum=S5_corporate per §5.2 stratum-actor map.
  - empirical_shape=null_event per §3 (0 observed_change layers).
  - admission_tier=null_case per §4 (0 strong-attribution
    observed_change layers).
  - target.enumeration=subset per §7 — hypothesized Greek-and-
    Portuguese cohorts are class-level rather than per-address
    enumerated; rationale documented in enumeration_note.
  - jurisdiction=[corporate_global] per authoring instruction.
  - evidence_use=contextual_unarchived on all citations because
    the authoring agent did not personally pin Wayback or compute
    body_hash; per the slug's null disposition this is appropriate
    (these citations are not admission anchors).

