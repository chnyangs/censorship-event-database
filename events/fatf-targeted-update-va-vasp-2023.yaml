analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17**

  null_event documenting FATF's 2023-06-27 publication of "Virtual
  Assets: Targeted Update on Implementation of the FATF Standards on
  VAs and VASPs". Third major FATF update on virtual assets after
  the 2019 R.15 INR (fatf-r15-vasp-travel-rule-2019) and the
  2021-10-28 Updated Guidance (fatf-targeted-update-va-vasp-2021).
  Headline finding: based on 98 FATF mutual evaluation / follow-up
  reports, 75% of jurisdictions are only partially or not compliant
  with R.15/INR.15; >50% of 151 jurisdictions surveyed had taken no
  Travel Rule implementation steps. The update also reviews emerging
  risks across DeFi, P2P, NFTs, unhosted wallets, and stablecoins,
  and references the February 2023 FATF roadmap to improve R.15
  implementation.

  Per §6 codebook the temporal_tier is comparable_main_2017_present
  and the canonical analysis_use is comparable_analysis. Per §7
  codebook the enumeration is `subset` with the class-level
  rationale documented in target.enumeration_note (FATF Standards
  operate at the international-standards layer; binding force is via
  member-state implementation). Per §3 codebook the empirical_shape
  is null_event: 0 observed_change layers directly attributable to
  the 2023-06-27 publication date; downstream cascades (EU TFR 2023,
  national VASP rule updates) are tracked as separate child events.
  Per §4 codebook admission_tier=null_case (0 strong-attribution
  observed_change layers).

  Per §1.1 codebook, the single off-ramp row uses
  attribution=`none` because observation_kind=`coverage_gap` (no
  direct per-event observed_change at the corpus's resolution).
  This event functions as a temporal landmark documenting the
  Travel Rule implementation-lag pressure that the FATF applied on
  member states in the 2023-2024 window, and as a parent / standards-
  layer anchor for downstream member-state VASP rule cascades.
  DRYRUN: archival anchors asserted but not personally verified by
  the LLM agent; human auditor must pin real Wayback / body_hash
