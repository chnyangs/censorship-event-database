      evidence_use: replayable
      note: |
        VietnamPlus / Vietnam News Agency contemporaneous English report,
        published 2014-02-27 21:00 +07:00, stating that the State Bank said
        bitcoin and other virtual currencies were not legal tender or a
        permitted means of payment in Vietnam; credit institutions were not
        allowed to use them while supplying services to customers; ownership
        and trading posed legal-risk exposure; and organizations / individuals
        were warned not to invest or conduct payments with them. The capture
        body is gzip-encoded by the server; body_hash is over the captured
        bytes and `gzip -cd` renders the article text.
    - type: primary_government
      url: https://www.sbv.gov.vn/w/sbv554224/-/categories/93909
      body_hash: sha256:f4ad48820235218f53286118b13a9c032348259ab1003051c16478a58bfc0e22
      body_path: sources/http_captures/vietnam-sbv-bitcoin-prohibition-statement-2014-02/primary/www.sbv.gov.vn__w-sbv554224---categories-93909__a8d054950b.html
      evidence_use: replayable
      note: |
        Official State Bank of Vietnam retrospective page captured live
        2026-05-31. The page separately describes the 2014-02-27 first SBV
        press statement on Bitcoin and similar virtual currencies and the later
        2017 Official Letter / press statement sequence. For 2014 it states
        that Bitcoin and similar virtual currencies were not currency and not
        lawful means of payment in Vietnam; that use as payment was not
        recognized or protected by law; that credit institutions were not
        permitted to use them as a currency or payment means when providing
        services to customers; and that organizations / individuals were
        advised not to invest, hold, or transact in them. Used here as an
        official retrospective corroboration and to prevent conflating the 2014
        statement with the stronger 2017 payment-prohibition/fines event.
  timestamp_sources:
    - type: primary_government
      note: |
        VietnamPlus / VNA published the contemporaneous report on 2014-02-27
