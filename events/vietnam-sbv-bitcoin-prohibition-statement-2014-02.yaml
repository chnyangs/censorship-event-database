analysis_notes: |
  **NEW EVENT AUTHORED -- AGENT_DRAFT 2026-05-31**. Created from the P4
  census-gap queue after locating replayable VietnamPlus/VNA contemporaneous
  coverage and an official SBV retrospective source. The event remains
  `status=draft` and `origin=agent_draft`; automation must not promote it to an
  admitted paper row without human admission review.

  Inclusion / scope rationale: the 2014 SBV statement is distinct from the
  already-admitted 2017 Vietnam payment-prohibition event. The 2014 source
  record supports a historical-baseline central-bank position that Bitcoin and
  similar virtual currencies were not lawful payment means, that credit
  institutions were not permitted to use them as currency/payment means when
  supplying customer services, and that organizations / individuals were warned
  against investment and payment use. It does not support importing the 2017
  Official Letter No. 5747/NHNN-PC, Decree 80/2016, administrative fines, or
  later criminal-liability language into the 2014 row.

  Modeling rationale: this is coded as `null_event` / `null_case` because the
  source record gives a class-level payment-instrument / credit-institution
  warning but this pass found no named exchange shutdown, bank cutoff, domain
  block, frontend geofence, issuer freeze, or on-chain action in the bounded
  observation window. The row is useful as a clean historical-baseline comparator
  and as a guardrail against stale deduplication that previously collapsed the
  2014 statement into the stronger 2017 event.

  Source note: the capture script successfully fetched VietnamPlus/VNA and the
  official SBV retrospective page. The VietnamPlus body was returned gzip-
  encoded and can be rendered with `gzip -cd`. The optional BizHub mirror failed
  TLS capture due unsafe legacy renegotiation and is not used as a load-bearing
  source.

scoped_claim: |
  On 2014-02-27, the State Bank of Vietnam stated that Bitcoin and similar
  virtual currencies were not currency and not lawful payment means in Vietnam,
  that credit institutions were not permitted to use them as currency/payment
  means when providing services to customers, and that organizations and
  individuals should not invest or conduct payments with them. This draft codes
  the action as a historical-baseline, class-level off-ramp/payment-instrument
  warning with no measured exchange shutdown, bank cutoff, domain block, or
  on-chain action; the later 2017 payment-prohibition/fines event remains
  separate.

