analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17**: agent-authored draft of
  Bybit's 2022 wind-down of Singapore user-facing operations and
  relocation of its global headquarters to Dubai, under sustained MAS
  regulatory pressure (PSA licensing regime, MAS 2022-01-17 retail-
  crypto advertising restrictions, FSM Act 2022 cross-border DTSP
  licensing). origin=agent_draft per codebook §8 for agent-authored
  drafts; requires human review before promotion.

  Distinct from singapore-mas-binance-services-2021: the Binance event
  is a nation_state_block stratum (S4) triggered by a MAS Investor
  Alert List listing naming Binance.com explicitly. The Bybit event is
  a corporate_policy_change (S5) where the actor (Bybit Global)
  unilaterally exits the SG market under a class-level regulatory
  environment without being individually named on an MAS IAL listing.
  Stratum-actor map (codebook §5.2): corporate_policy_change permits
  S5_corporate; consistent.

  Attribution per codebook §1: plausible (not direct) because Bybit's
  corporate communications around the Dubai HQ move do not explicitly
  cite MAS as the cause; the causal link runs through the MAS
  regulatory environment as a class-level driver. Conservative coding
  (plausible over direct) per codebook §8.4.

  empirical_shape=comparison per codebook §3 (one observed_change
  layer: offramp_cex). admission_tier=empirical_case per codebook §4
  (one strong-attribution observed_change layer at plausible).

  Load-bearing observational axis: offramp_cex (SG retail cohort lost
  access to Bybit's offramp). L4 frontend coded not_measured pending
  pinned anchors for the bybit.com SG-user geofence / KYC banner.

  DRYRUN caveats: all citations are evidence_use=contextual_unarchived
  per validator policy. For non-DRYRUN release, capture body_hash +
  body_path for (1) Bybit SG-user wind-down notice on
  announcements.bybit.com, (2) Bybit Dubai HQ move corporate
  announcement, (3) Bybit Service-Restricted-Countries help-center
  page snapshot showing SG listed, (4) MAS 2022-01-17 retail-crypto
  advertising-restriction guidelines as the contextual regulatory
  anchor.

scoped_claim: |
  "Bybit Fintech Limited wound down Singapore user-facing services on
  bybit.com and relocated its global headquarters to Dubai during 2022,
  plausibly in response to the MAS regulatory environment (PSA
  licensing, 2022-01-17 retail-crypto advertising restrictions, FSM
  Act 2022 cross-border DTSP licensing). Load-bearing observational
  axis is offramp_cex at the SG retail cohort level; attribution is
  plausible because Bybit's corporate communications do not explicitly
  cite MAS as the cause."

