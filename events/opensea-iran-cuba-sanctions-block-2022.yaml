  **PROMOTED 2026-05-21** (c) Batch C-5 audit (S5 corporate, geofence) by
  human:xiangwen. opensea.io/blog generic primary -> 2 semi_primary_wayback
  (CoinDesk + Decrypt, Wayback 20220303190923 / 20220306181511).
  attribution direct->plausible. l4_frontend observed_change/plausible.
  comparison/empirical_case preserved.

  comparison — S5 corporate compliance event mirroring the Uniswap-Labs
  L4-only frontend split, but with two distinct sub-actions: (1) Iranian
  user-account terminations from 2022-03-03 in the wake of US-sanctions
  discourse around the Russia / Ukraine context, and (2) Cuban-artist
  account terminations disclosed 2022-12, notable for over-blocking of
  Cuban-passport holders resident outside Cuba (diaspora nationality
  screening rather than geo-IP only). Both restrictions operate at L4
  (frontend account / nationality screening) without on-chain action on
  the NFT contracts themselves. Paper-relevant as a corporate-frontend
  example of nationality-based screening overshoot.

