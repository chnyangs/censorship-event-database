analysis_notes: |
  **AUTHORED 2026-05-31** (overnight census tick 11, human:xiangwen
  autonomous mandate). The Feb 2024 Nigeria crackdown on Binance/crypto
  exchanges: the Nigerian Communications Commission ordered telcos to
  block access to Binance, Coinbase, and Kraken websites (l0_network,
  OONI-anchored: binance.com anomaly=True from NG vantage points
  2024-02-26..29), the government detained two Binance executives
  (Gambaryan, Anjarwalla, 2024-02-28), and the CBN/SEC alleged Binance
  operated without authorization + moved $26B in untraceable funds,
  blaming crypto for the naira's slide. comparison shape, 2
  observed_change layers (l0_network telco block + offramp_cex access
  severance), both attribution=plausible (OONI measurement + journalism;
  no single pinned government block-order document). Distinct from the
  corpus nigeria-cbn-crypto-ban-2021 (the 2021 banking ban) — this is the
  2024 network-layer block. Structurally parallel to
  philippines-sec-binance-block-2024 (OONI-anchored l0 + offramp).
  Sources verified + captured 2026-05-31 (OONI API response with 4
  measurement_ids + CoinDesk, body_hash-pinned; no fabrication).

scoped_claim: |
  "Nigeria's late-Feb-2024 NCC-ordered telco block of Binance/Coinbase/
  Kraken websites (OONI-confirmed binance.com blocking from NG) plus the
  detention of two Binance executives severed Nigerian-user access at the
  l0_network and offramp_cex layers; 2-layer comparison, attribution
  plausible."

