analysis_notes: |
  comparison documenting the 2025-07-01 OFAC designation of the Aeza Group
  bulletproof-hosting network. Entity-level designation of a hosting-infrastructure
  provider is structurally distinct from the exchange / mixer / wallet cases in the
  dataset — Aeza is an L0 / L4 infrastructure provider to other illicit services, not a
  consumer-facing crypto service. The on-chain footprint is small (1 TRX address) but the
  off-chain (hosting infrastructure, UK corporate shell) surface is large.

  Follow-up directions (post-admission): (1) Wayback CDX for aeza.ru / aeza.net post-event (did UK-side
  pressure shut aeza.net but leave aeza.ru untouched?); (2) Tether query on the TRX
  address; (3) UK Companies House state changes on AEZA INTERNATIONAL LTD.

scoped_claim: |
  "OFAC designation of the Aeza Group Russian bulletproof-hosting network on 2025-07-01
  targeted an upstream infrastructure layer rather than a consumer-facing crypto service.
  Primary observational gap: Wayback post-event snapshots of aeza.ru / aeza.net and TRX
  freeze data not yet attached."

