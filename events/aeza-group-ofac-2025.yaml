analysis_notes: |
  **SOURCE/COVERAGE REPAIRED 2026-06-02** (quality-loop scope repair):
  verified the OFAC Recent Actions replay anchor and the locally pinned
  usdtbanlist/TRON blacklist evidence; marked the row primary-source
  verified; and narrowed the public claim to the measured OFAC designation
  plus issuer-side TRON USDT blacklist. L0, L4, and offramp_cex are
  non-load-bearing for this row: no ISP/DNS block, Aeza website availability
  outcome, or counterparty-CEX/KYT reaction is retained.

  comparison documenting the 2025-07-01 OFAC designation of the Aeza Group
  bulletproof-hosting network. Entity-level designation of a hosting-infrastructure
  provider is structurally distinct from the exchange / mixer / wallet cases in the
  dataset — Aeza is an L0 / L4 infrastructure provider to other illicit services, not a
  consumer-facing crypto service. The on-chain footprint is small (1 TRX address) but the
  off-chain (hosting infrastructure, UK corporate shell) surface is large.

  Follow-up directions (post-admission): (1) Wayback CDX for aeza.ru / aeza.net post-event
  if an L4 website-availability claim is desired; (2) direct TronGrid/Tronscan receipt
  replay for the listed blacklist transaction; (3) UK Companies House state changes on
  AEZA INTERNATIONAL LTD.

scoped_claim: |
  "OFAC designation of the Aeza Group Russian bulletproof-hosting network on 2025-07-01
  targeted an upstream infrastructure layer rather than a consumer-facing crypto service.
  The retained changed-layer observation is Tether USDT-TRC20 blacklisting of the one
  listed TRX address on 2025-07-02 06:25 UTC, about 30 hours after designation. This
  release does not claim an ISP/DNS block, Aeza website takedown or persistence outcome,
  or counterparty-CEX/KYT reaction."

