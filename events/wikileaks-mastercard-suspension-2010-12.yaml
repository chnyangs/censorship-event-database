analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase E pre-Bitcoin
  baseline discovery pass per
  sources/pre_bitcoin_baseline_2008_2012/triage_manifest.json
  candidate `wikileaks-mastercard-suspension-2010-12`): drafted by
  LLM agent without personally pinning Wayback snapshots or
  computing body_hash artifacts for the MasterCard spokesman
  statement surface or the CNN Money / France 24 coverage. status
  remains `draft` and origin remains `agent_draft` per validator
  rule (agent_draft is only valid at status=draft). Real release
  requires (a) human audit to replace this DRYRUN marker, (b) a
  pinned Wayback snapshot or local body_hash+body_path archive of
  the MasterCard newsroom / spokesman-quotation surface as
  circulated to press on 2010-12-06/07, and (c) Wayback re-pin of
  the CNN Money and France 24 articles cited as supporting
  journalism.

  comparison shape: 1 observed_change layer (offramp_cex). L0 /
  L1 / L3 / L4 / asset_onchain are all not_applicable. The
  not_applicable codings are construct-grounded rather than
  data-grounded: in 2010-12 WikiLeaks did not yet accept Bitcoin
  donations (Bitcoin acceptance began 2011-06), so chain-consensus,
  RPC-compliance, and stablecoin-issuer-freeze primitives have no
  measured construct against which to record a change; the
  contemporaneous L0 / L4 pressures on wikileaks.org (EveryDNS
  termination 2010-12-02, Amazon AWS eviction 2010-12-01, Operation
  Payback DDoS against mastercard.com 2010-12-08) are sibling
  events or third-party reactions and are explicitly not
  double-counted in the MasterCard row.

  Discovery-only placement: this row is part of the 2008-2012
  pre-Bitcoin baseline tier and is admitted to the discovery ledger
  only. It is explicitly out of scope for the 2017+ comparable
  denominator (per temporal_tier=discovery_only_2008_2012 +
  analysis_use=discovery_ledger_only). The row documents the
  card-network operator-policy mechanism of payment-rail
  censorship as it appeared a year before Bitcoin emerged as a
  donations-channel substitute — a foundational comparator for
  later chain-censorship cascades but not itself a chain event.

  Sibling-event cluster (the "WikiLeaks Banking Blockade"):
  paypal-freeze-2010-12 (2010-12-04, PayPal AUP termination of the
  Wau-Holland-Stiftung donations account), visa-europe-suspension
  2010-12 (2010-12-07, Visa Europe via acquirer Teller / Korta
  terminated DataCell ehf merchant agreement, the Visa leg of the
  card-network blockade and the direct predicate of the later
  DataCell v. Valitor Iceland District Court 2012-07 litigation),
  bank-of-america-block-2010-12 (2010-12-18, sole US-domiciled
  commercial bank action in the blockade), western-union-
  interdiction-2010-12 (2010-12-21, WU added WikiLeaks to its
  internal Interdiction List), postfinance-account-closure-2010-12
  (2010-12-06, Swiss Post PostFinance closed the Julian Assange
  Defence Fund account), and the downstream judicial endpoint
  datacell-v-valitor-iceland-district-court-2012-07. MasterCard is
  treated as one of the two card-network legs of the blockade
  (companion to Visa Europe).

  Third-party reaction note (NOT counted toward observations):
  Operation Payback (Anonymous-affiliated DDoS coalition) launched
  a coordinated DDoS attack against mastercard.com on 2010-12-08
  in retaliation for the MasterCard processing suspension. This is
  a third-party reaction with attribution=unknown to the MasterCard
  trigger and is captured in `follow_on_reaction` semantics per
  schema 0.2.0; it is not double-counted as a coverage_gap or
  observed_change in this row. The Anonymous DDoS reaction
  illustrates a cascade-shape secondary effect but is informational
  only for this event's empirical_shape accounting.

follow_on_reaction:
  - kind: third_party_ddos_retaliation
    actor: anonymous_operation_payback
    timestamp: 2010-12-08T00:00:00Z
    precision: day
    target: mastercard.com
    attribution: unknown
    note: |
      Operation Payback (Anonymous-affiliated DDoS coalition)
      launched a coordinated distributed-denial-of-service attack
      against mastercard.com on 2010-12-08 in retaliation for the
      MasterCard processing suspension. Captured here as a
      cross-event follow-on reaction with attribution=unknown
      per reviewer Action 4 (schema 0.2.0). Does NOT count toward
      this event's empirical_shape or admission_tier accounting;
      tracked for cross-event-anchor purposes only.

scoped_claim: |
  "MasterCard Worldwide announced on 2010-12-06 that it was suspending
  acceptance of MasterCard-branded cards for WikiLeaks donations on
  the grounds that its rules prohibit customers from facilitating
  illegal action, severing the card-network donation channel routed
  through the DataCell ehf merchant gateway; the row is registered as
  a single-layer offramp_cex operator-policy-change observation in
  the discovery-only 2008-2012 tier and does not assert ISP-level
  network blocking, L1 consensus engagement, RPC-compliance
  filtering, asset-onchain freezing, or L4 frontend takedown by the
  card-network operator."

