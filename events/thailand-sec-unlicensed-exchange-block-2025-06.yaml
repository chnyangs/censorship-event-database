analysis_notes: |
  Admitted 2026-06-09 as an attested_secondary nation-state network block. The
  Thailand SEC and Ministry of Digital Economy and Society ordered ISP-level
  blocking of unlicensed exchange websites (OKX, Bybit, and others) effective
  ~2025-06-28. Coded as an l0_network observed_change (ISP/DNS block), consistent
  with the india-fiu / nigeria-binance-network / philippines-sec-binance
  precedent; coverage is partially_measured (attested by journalism, not
  OONI-measured). Only one contemporaneous secondary source (CoinDesk) is
  captured, so attribution=plausible. Distinct from thailand-sec-crypto-payment-
  ban-2022-04. origin agent_draft -> human_reviewed via LLM adjudication +
  maintainer oversight (not independent-human IRR).
scoped_claim: |
  "Thailand's SEC/MDES ISP-blocked unlicensed exchange websites (OKX, Bybit,
  others) ~2025-06-28; an L0 network block (plausible, attested_secondary)."
