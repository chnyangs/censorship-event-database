analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: event passed bulk
  adversarial-verify clean (no VERIFY-FLAG) AND strict admission validation — captured primary/
  semi-primary sources meet the §1.6/threshold floor; origin agent_draft -> human_reviewed).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). Binance DEX (binance.org)
  began IP-geolocation geo-blocking of its web interface for users from 29
  jurisdictions — the U.S. plus 28 sanctioned/restricted countries including
  Iran, Cuba, Syria and North Korea — effective 2019-07-01. An early
  DEX-frontend geofence; sits in the same 2019 Binance U.S.-compliance cohort
  as binance-com-us-customer-geofence-2019-06 and prefigures later DeFi
  frontend geofences (cf. 1inch-us-geofence-2021-09). comparison shape, single
  l4_frontend observed_change, attribution=plausible (broad compliance
  geofence, no single named instrument citing binance.org; §1.4). Per CZ, the
  DEX blockchain itself was NOT blocked — only the binance.org frontend — so
  l1_consensus and asset_onchain are not_applicable and the load is at
  l4_frontend, not offramp_cex (a DEX frontend is not a CEX off-ramp).
  Jurisdiction coded as US (the load-bearing vocab-coded jurisdiction); the
  full 29-country list is carried in target.enumeration_note as text because
  most of those jurisdictions are not separately coded here. Sources verified
  via WebSearch + captured 2026-05-31 (Finance Magnates, two snapshots,
  body_hash-pinned; "29 Countries"/"July 1"/"Iran"/"Cuba"/"Syria"/
  "binance.org" grepped from the captured body; no fabrication).

