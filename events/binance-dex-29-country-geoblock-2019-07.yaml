  - layer: l0_network
    status: not_applicable
    note: |
      Not an ISP/DNS network block: binance.org itself applied the geofence to
      its own web interface by reading visitor IP addresses, a frontend-side
      access restriction rather than a network-layer filter imposed by a
      carrier/state.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Per CZ's clarification, the Binance Chain DEX blockchain was NOT blocked;
      only the binance.org web interface restricted access. No consensus
      surface engaged.
  - layer: l3_rpc
    status: not_applicable
  - layer: l4_frontend
    status: measured
    scope:
      - binance_org_dex_web_interface_29_countries
    note: |
      Load-bearing layer. The binance.org web interface (the Binance DEX
      frontend) began IP-geolocation geo-blocking of users from 29
      jurisdictions including the U.S., Iran, Cuba, Syria and North Korea on
      2019-07-01 — an early DEX-frontend geofence. The underlying DEX chain
      remained reachable via alternative wallets, so the restriction is a
      frontend-access block, not an off-ramp/asset/network action. Attested in
      contemporaneous trade press (body_hash-pinned).
  - layer: asset_onchain
    status: not_applicable
    note: |
      No issuer/contract freeze; the action restricts frontend access, not any
      asset on-chain.
  - layer: offramp_cex
    status: not_applicable
    note: |
      Binance DEX is a decentralized exchange frontend, not a centralized-
      exchange custodial off-ramp; the geofence acts on the binance.org web UI.

