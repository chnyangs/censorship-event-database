analysis_notes: |
  **SOURCE/COVERAGE REPAIR 2026-06-02**: verified the pinned OFAC Recent
  Actions 20240111 Wayback capture against its recorded SHA-256 and
  re-grepped the local body for the CHATEX and digital-currency-address
  update text. Coverage was narrowed to the row's actual contribution: an
  administrative metadata-refresh/null-control denominator, with no fresh
  L0/L1/RPC/frontend/asset claim retained. The only measured observation
  remains the aggregate absence of a fresh public CEX policy statement for
  the unchanged CHATEX address cohort in the 14-day post-update window.

  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase 6c bulk-promotion of 22
  candidate stubs per user instruction to push remaining backlog to
  dryrun-complete state): promoted from
  candidate_triggers/ofac-recent-action-20240111.yaml. Authored by LLM agent
  without personally verifying Wayback/body_hash; origin=human_reviewed
  required by validator. Real release must replace this DRYRUN marker with a
  human-verified audit after pinning real archive anchors.

  Status admitted=draft, admission_tier=null_case rather than empirical_case
  because the 2024-01-11 OFAC Recent Action does not map cleanly to a
  concrete new crypto enforcement event. The OFAC page bundles three
  distinct sub-actions, none of which are independent crypto-target SDN
  designations:

  1. **Russia-related new SDN additions [RUSSIA-EO14024]**
     - MIKHEYCHIK Vladimir Vladimirovich (individual; no digital-currency
       address)
     - ASHULUK FIRING RANGE (Astrakhan Oblast; defense activities; no
       digital-currency address)
     - VLADIMIROVKA ADVANCED WEAPONS AND RESEARCH COMPLEX (Astrakhan Oblast;
       defense activities; no digital-currency address)
     - 3 aircraft: RF-78757 (IL-76MD), RF-82011 (AN-124), RF-86898 (IL-76)
       linked to COMMAND OF THE MILITARY TRANSPORT AVIATION (no
       digital-currency addresses)
     None of these designees carry crypto addresses and the actors are
     defense/aviation rather than crypto-services. Out of scope for the
     S1_ofac_sdn crypto-target stratum.

  2. **Cyber-related Designation Update [CYBER2]: CHATEX**
     The page contains a "The following changes have been made to OFAC's
     SDN List" -> CHATEX block. Comparing the -from- and -to- text:
     - identical website (chatex.com), countries (Estonia / Latvia / Saint
       Vincent and the Grenadines), Organization Established Date (2018)
     - identical 30 digital-currency address set (22 XBT, 6 ETH, 1 USDT-Omni,
       1 XRP) — same addresses as 2021-11-08 first designation
     - identical tag [CYBER2]
     This is therefore a *non-substantive* metadata refresh of CHATEX's
     existing SDN entry rather than a new crypto enforcement action.
     The same 30 addresses are first-designation anchored in
     `chatex-ofac-2021`; promoting them again here would double-count.

  3. **Russia-related Designations Updates (non-crypto)**
     - JOINT STOCK COMPANY THE 224TH FLIGHT UNIT STATE AIRLINES: -from-/-to-
       diff adds Cyrillic alias and Target Type "State-Owned Enterprise"
     - Aircraft RF-82041 (AN-124): -from-/-to- diff adds Mode S transponder
       code and re-links from 224th Flight Unit to COMMAND OF THE MILITARY
       TRANSPORT AVIATION
     Defense/aviation metadata refreshes; no crypto addresses.

  4. **Regulatory amendment**: implementation of the Federal Civil Penalties
     Inflation Adjustment Act of 1990 for 2024 (a periodic CMP-cap
     inflation adjustment). Not an SDN designation.

  Authoring decision: drafted as null_case with empty observations[] rather
  than rejected, because the page is structurally part of the S1_ofac_sdn
  trigger registry (it carries crypto-relevant SDN content even though that
  content is a re-listing). The empirical contribution to the corpus is
  zero — the CHATEX cascade is fully accounted for by `chatex-ofac-2021` —
  so this row should not enter conditional-rate denominators. If a future
  audit identifies that the 2024-01-11 page nevertheless triggered any
  fresh L0..offramp_cex action (e.g. a fresh issuer-sweep batch keyed to
  the SDN refresh), the event should be re-promoted with measured-layer
  coverage rows and observed_change entries.

  Ambiguity documented for human reviewer:
  - Whether to keep this event as a separate row or merge as a follow-on
    pointer to `chatex-ofac-2021` (current author chose to keep separate
    because the OFAC Recent Actions URL https://ofac.treasury.gov/recent-actions/20240111
    is its own primary_legal artifact and entered the trigger registry on
    that basis).
  - Whether to rename the slug; current author kept the date-based id per
    the brief's "if target unclear, keep the date-based id" instruction
    because the target is a metadata refresh rather than a clear new
    crypto enforcement target.

