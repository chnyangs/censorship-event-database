  type: court_civil_order
  actor: US_NYDFS
  timestamp: 2015-06-24T00:00:00Z
  timestamp_precision: day
  citation:
    - type: primary_legal
      url: https://web.archive.org/web/20150604135045/http://www.dfs.ny.gov/legal/regulations/adoptions/dfsp200t.pdf
      wayback: https://web.archive.org/web/20150604135045/http://www.dfs.ny.gov/legal/regulations/adoptions/dfsp200t.pdf
      body_hash: sha256:29a6135cfaa79e3f97309b3b5ae5f1d233cc22f0c3b5d7d2b3291adf16b997f1
      body_path: sources/http_captures/nydfs-bitlicense-2015-06/primary/web.archive.org__web-20150604135045-http-www.dfs.ny.gov-legal-regulations-adoptions-dfsp200t.pdf__7978129838.html
      note: |
        NYDFS 23 NYCRR Part 200 ("Virtual Currencies") — the BitLicense
        regulation. Wayback memento of the canonical NYDFS adoption-text PDF
        at dfs.ny.gov/legal/regulations/adoptions/dfsp200t.pdf, snapshotted
        2015-06-04 (proposed-final text published prior to the 2015-06-24
        formal adoption). The captured artifact is the Wayback HTML wrapper
        delivering the PDF; body_hash verifies the local archive copy.
        Final rule published 2015-06-24, effective 2015-08-08, requiring
        anyone engaged in "Virtual Currency Business Activity" in NY or
        with NY residents to obtain a BitLicense ($5,000 non-refundable
        application fee + cybersecurity/AML/capital/custody/consumer-
        protection program requirements).
    - type: primary_corporate
      url: https://www.dfs.ny.gov/virtual_currency_businesses
      body_hash: sha256:940ca14140db1a229fa29f8a3653e3a03879d8efe448667c62769dbdb5c08955
      body_path: sources/http_captures/nydfs-bitlicense-2015-06/primary/www.dfs.ny.gov__virtual_currency_businesses__5189ee98fc.html
      note: |
        Current NYDFS Virtual Currency Businesses landing page, which
        anchors the modern URL state for the BitLicense program. Captured
        2026-05-16. Provides contemporaneous corroboration that 23 NYCRR
        Part 200 remains the operative BitLicense regulation.
  timestamp_sources:
    - type: primary_legal
      note: |
        Day-level precision per NYDFS press release of 2015-06-03
        announcing the final framework and the 2015-06-24 Federal-Register-
        equivalent formal adoption date. 45-day applicant window opened
        2015-06-24 and closed 2015-08-08.

target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    "Virtual Currency Business Activity" service providers operating in or
    with residents of New York State. Affected operators include
    ShapeShift, Kraken, Bitfinex, and Poloniex (the four named
    operators in the documented June-August 2015 NY-exit cascade), plus
    the broader class of US/non-US crypto businesses that elected either
    to apply for a BitLicense or to geofence New York. This row enumerates
    only the four publicly-attested NY-exit operators as the observation
    cohort; it does not claim a complete enumeration of every BitLicense-
    affected entity.
  actor_type: us_state_virtual_currency_licensing_regime
  actor_name: NY virtual-currency operators (BitLicense-required class)
  chains: [bitcoin, ethereum]
  canonical_domains:
    - shapeshift.io
    - kraken.com
    - bitfinex.com
    - poloniex.com

jurisdiction: [US]

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The BitLicense is a state-licensing regime, not a network-level
      block. ISP reachability of NY users to the named operators was not
      altered by the regulation; the operators themselves geo-fenced or
      withdrew at the application layer.
  - layer: l1_consensus
    status: not_applicable
    note: |
      2015 predates the post-Merge / post-PBS L1 filtering surface that
      Wahrstätter-style measurements can address. Out of scope.
  - layer: l3_rpc
    status: not_applicable
    note: |
      Hosted-RPC providers (Infura, Alchemy, QuickNode) did not yet
      operate at meaningful scale in 2015; no L3 substrate to measure.
  - layer: l4_frontend
    status: partially_measured
    scope:
      - shapeshift.io
      - kraken.com
      - bitfinex.com
      - poloniex.com
    note: |
      Each of the four named operators (ShapeShift, Kraken, Bitfinex,
      Poloniex) published a public NY-exit announcement within ~45 days
      of the 2015-06-24 final-rule publication. Wayback coverage of
      ShapeShift and Kraken blog posts retains the announcement text;
      Bitfinex and Poloniex announcements are attested via contemporaneous
      coverage and surviving exchange-policy snapshots. Coverage is
      partially_measured because not every NY-exit operator's frontend
      diff is independently reconstructed, only the four anchor cases.
  - layer: asset_onchain
    status: not_applicable
    note: |
      No issuer-level token freeze or admin-method invocation was
      triggered by the BitLicense. Stablecoin admin freezes were not yet
      part of the censorship surface in 2015 (USDT pre-blacklist function,
      USDC predates issuance by ~3 years). Out of scope.
  - layer: offramp_cex
    status: not_applicable
    note: |
      The four observed operators (ShapeShift, Kraken, Bitfinex, Poloniex)
      WERE off-ramp/exchange platforms; the L4-frontend exit IS the
      off-ramp_cex withdrawal for NY users. Recording it twice would
      double-count the same physical action. Coded under l4_frontend
      to preserve the cascade-shape analysis.

