coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      CFTC Order 15-29 does not direct ISP-level or DNS-level network
      blocking of derivabit.com. The shutdown of the Derivabit platform
      was operator-side compliance with the cease-and-desist order, not
      a network-layer block. not_applicable on
      construct-did-not-engage grounds, consistent with the L0
      treatment of other S3 CFTC / DOJ enforcement events that act on
      the operator rather than the network path.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Bitcoin proof-of-work consensus in 2015-09 has no protocol-level
      relay-filter primitive analogous to the post-Merge Ethereum PBS
      relay surface. The Ethereum Merge itself is ~7 years downstream
      (2022-09-15). not_applicable on construct-did-not-exist grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      The MEV-Boost / Flashbots Protect / MEV-Blocker public-RPC
      compliance substrate that the L3 layer measures did not exist
      in 2015; Flashbots Protect launched 2022-11 and MEV-Blocker
      launched 2023-03-27. not_applicable on construct-did-not-exist
      grounds.
  - layer: l4_frontend
    status: measured
    scope:
      - derivabit.com
    note: |
      Canonical Derivabit platform (derivabit.com) was shut down in
      compliance with the CFTC cease-and-desist order. The Derivabit
      Bitcoin-options trading platform did not resume operations under
      the Coinflip / Riordan operatorship. The CFTC press release
      explicitly directs that Coinflip cease operating the facility
      without registering; the operator-side platform shutdown is the
      direct compliance response. Attached below as observed_change
      with direct attribution. Wayback CDX coverage of derivabit.com
      in 2015-09 / 2015-10 is plausibly feasible but the specific
      snapshot URLs have not been pinned in this authoring pass; the
      L4 layer carries the load-bearing observation on the strength
      of the CFTC primary-legal artifact.
  - layer: asset_onchain
    status: not_applicable
    note: |
      Bitcoin native asset has no issuer-side blacklist / freeze admin
      method. The 2015 CFTC order does not engage a stablecoin-issuer
      admin path (USDT first issued ~2014-10; chainwide admin freezes
      arose later). not_applicable on construct-did-not-exist grounds.
  - layer: offramp_cex
    status: not_applicable
    note: |
      Derivabit operated as a Bitcoin-options trading facility, not a
      fiat off-ramp CEX; the order targets the unregistered-SEF/DCM
      legal theory rather than fiat-rail offboarding. not_applicable
      consistent with cftc-v-ooki-dao-2022 sibling treatment of
      derivatives-platform enforcement events.

