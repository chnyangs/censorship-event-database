coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      CFTC Order 15-29 does not direct ISP-level or DNS-level network
      blocking of derivabit.com. The shutdown of the Derivabit platform
      was operator-side compliance with the cease-and-desist order, not
      a network-layer block. not_applicable on
      construct-did-not-engage grounds, consistent with the L0
      treatment of other S3 CFTC / DOJ enforcement events that act on
      the operator rather than the network path.
  - layer: l1_consensus
    status: not_applicable
    note: |
      Bitcoin proof-of-work consensus in 2015-09 has no protocol-level
      relay-filter primitive analogous to the post-Merge Ethereum PBS
      relay surface. The Ethereum Merge itself is ~7 years downstream
      (2022-09-15). not_applicable on construct-did-not-exist grounds.
  - layer: l3_rpc
    status: not_applicable
    note: |
      The MEV-Boost / Flashbots Protect / MEV-Blocker public-RPC
      compliance substrate that the L3 layer measures did not exist
      in 2015; Flashbots Protect launched 2022-11 and MEV-Blocker
      launched 2023-03-27. not_applicable on construct-did-not-exist
      grounds.
  - layer: l4_frontend
    status: not_applicable
    note: |
      The CFTC order targeted Coinflip's operation of the Derivabit
      Bitcoin-options trading facility, not a public-web frontend
      takedown, domain seizure, or network reachability change at
      derivabit.com. No independent pre/post web-archive diff of
      derivabit.com is reconstructed in this row. The operator-state
      observation is therefore coded under offramp_cex rather than as
      an L4 frontend shutdown claim.
  - layer: asset_onchain
    status: not_applicable
    note: |
      Bitcoin native asset has no issuer-side blacklist / freeze admin
      method. The 2015 CFTC order does not engage a stablecoin-issuer
      admin path (USDT first issued ~2014-10; chainwide admin freezes
      arose later). not_applicable on construct-did-not-exist grounds.
  - layer: offramp_cex
    status: measured
    scope:
      - derivabit_bitcoin_options_facility
    note: |
      Load-bearing layer for this event: the CFTC order imposed a
      cease-and-desist on Coinflip / Riordan for operating Derivabit as
      an unregistered facility for Bitcoin option contracts. This is
      coded as a centralized trading-facility/operator-state observation
      at the exchange/offramp layer. The row does not claim fiat-rail
      offboarding or a public-web takedown.

