analysis_notes: |
  NEW EVENT AUTHORED — DRYRUN 2026-05-16. Historical-baseline
  promotion of the candidate stub coinflip-cftc-derivabit-2015 per
  the 2026-05-16 staged-release plan. Authored by LLM in this pass;
  origin=human_reviewed for validator compatibility, but human
  re-verification of (i) the cftc.gov press-release and PDF
  reachability and Wayback snapshot pinning and (ii) Wayback captures
  of the derivabit.com homepage in the 2015-09 / 2015-10 window is
  required before the last_human_audit stamp is treated as a real
  human audit. The last_human_audit field is a DRYRUN marker and must
  be replaced by a real human audit per the project convention.

  This event is the canonical historical-baseline anchor for the
  CFTC-against-crypto-operator analysis thread in the dataset.
  Substantive significance:

  1. **First CFTC enforcement action against a cryptocurrency
     operator.** CFTC Order 15-29 (2015-09-17) precedes the next CFTC
     crypto enforcement action by roughly a year and the
     cftc-v-ooki-dao-2022 DAO-as-legal-person enforcement by ~7 years.
  2. **Commodity classification of Bitcoin under the CEA.** The order
     formally establishes that "Bitcoin and other virtual currencies"
     fall within the CEA Section 1a(9) commodity definition. This
     classification is the legal predicate for every subsequent CFTC
     crypto-enforcement action in the dataset, including the
     binance-4framework-2023 multi-agency settlement and the
     cftc-v-ooki-dao-2022 DAO-enforcement precedent.
  3. **Cease-and-desist + operator-side platform shutdown** is the
     observable cascade shape: the regulator does not seize the
     domain (contrast btc-e-doj-2017 DOJ domain seizure), and the
     compliance response is operator-side cessation of the offering.
     This is the canonical pre-OFAC-crypto-SDN US-enforcement shape.

  Why historical_baseline tier: events 2013-2016 belong to the
  historical_baseline_2013_2016 temporal tier per the 2008+ tiered
  frame. analysis_use=historical_baseline excludes this row from the
  2017+ comparable-analysis denominator, matching the validator's
  tier-vs-analysis-use consistency rule.

  Why empirical_case rather than anchor_case: the only strong-
  attribution observed_change layer is L4 frontend (Derivabit
  platform shutdown). anchor_case promotion would require a second
  strong-attribution observed_change layer or pinned Wayback
  bracketing of derivabit.com pre/post the 2015-09-17 order; that is
  a follow-up evidence-capture turn. Until it lands, the event
  admits at empirical_case on the strength of the direct-attribution
  L4 frontend observation alone.

  Why L0/L1/L3/asset_onchain/offramp_cex are not_applicable: the CFTC
  cease-and-desist is an operator-targeted directive against an
  unregistered Bitcoin-options trading facility, not a network-layer
  block, a PBS-era relay-filter primitive, an asset-issuer freeze, or
  a fiat-off-ramp severance. The Ethereum PBS L1/L3 measurement
  primitives do not exist in 2015; Bitcoin native asset has no
  issuer-side admin freeze primitive; Derivabit operated as a
  Bitcoin-options trading facility rather than a fiat off-ramp CEX.

  Cross-event placement: pairs with cftc-v-ooki-dao-2022 (first
  CFTC-against-DAO) as the bookends of the CFTC-crypto-enforcement
  evolution arc (2015 first-operator → 2022 first-DAO-as-person), and
  with btc-e-doj-2017 (first DOJ crypto-exchange indictment) for the
  cross-agency US-enforcement first-touch comparison.

scoped_claim: |
  CFTC Order 15-29 of 2015-09-17 against Coinflip, Inc. (d/b/a
  Derivabit) is the first CFTC enforcement action against a
  cryptocurrency operator and the regulatory artifact that established
  Bitcoin as a "commodity" under CEA Section 1a(9). The cease-and-
  desist produced operator-side shutdown of the Derivabit Bitcoin-
  options trading platform; the L4 frontend layer carries the load-
  bearing direct-attribution observation.

scoped_knowledge: |
  This event is the historical-baseline anchor of the CFTC-crypto-
  enforcement arc in the dataset and the upstream legal predicate
  for every subsequent CFTC crypto action (commodity classification
  of Bitcoin under CEA 1a(9)). The comparison pair with
  cftc-v-ooki-dao-2022 brackets the 2015 first-operator-enforcement
  vs 2022 first-DAO-as-legal-person-enforcement evolution; the
  cross-agency comparison with btc-e-doj-2017 (DOJ 2017) shows the
  CFTC cease-and-desist vs DOJ indictment-plus-domain-seizure
  enforcement-shape contrast in the pre-OFAC-crypto-SDN era. The
  cascade shape here is comparison-not-cascade because the
  construct-did-not-exist layers (L1, L3, asset_onchain) and the
  operator-targeted policy scope (not network, not fiat off-ramp)
  limit the observable cross-layer surface to L4 frontend alone.

