analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: event passed bulk
  adversarial-verify clean (no VERIFY-FLAG) AND strict admission validation — captured primary/
  semi-primary sources meet the §1.6/threshold floor; origin agent_draft -> human_reviewed).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources
  verified+captured, awaiting human admission). On 2024-08-23 OFAC designated
  the Russian UAV developer KB Vostok (Vostok Design Bureau) as an SDN within a
  ~400-target Russia tranche under EO 14024 (OFAC Recent Actions 20240823),
  attaching a USDT-on-TRON address used to solicit donations and likely
  facilitate drone sales (inflows trace largely to the sanctioned exchange
  Garantex). In scope under codebook §9 (OFAC SDN designation). Coded
  null_event/null_case per the S1 convention (cf. bitriver-russia-mining-ofac-
  2022-04): the designation is the trigger, but no public CEX cascade was
  documented in the 14-day window and no primary_onchain Tether freeze tx was
  captured for the attached address, so the measurable cross-layer surface is
  limited (offramp_cex observed_no_change/none). Source verified + captured
  2026-05-31 (OFAC Recent Actions 20240823, body_hash-pinned; no fabrication).

scoped_claim: |
  "The 2024-08-23 OFAC SDN designation of KB Vostok (Russian drone developer;
  USDT-TRON address attached) is confirmed against the OFAC Recent Actions
  page; no public CEX cascade and no captured on-chain freeze were documented
  in the 14-day window. null_case: limited measurable cross-layer surface."

