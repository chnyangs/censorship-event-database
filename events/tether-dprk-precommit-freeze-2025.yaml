analysis_notes: |
  comparison documenting a non-OFAC-triggered corporate Tether freeze action
  against a subset of DPRK-laundering USDT-TRC20 addresses, executed 2025-04-30 07:05 UTC
  in a batch. Paired with dprk-usdt-network-ofac-2025 (the subsequent OFAC designation
  on 2025-11-04, 188 days later), this event establishes a rare stratum-S5 datapoint:
  **the asset-layer cascade can precede the OFAC cascade rather than follow it**.

  Structural implications for the paper:
  - Cross-layer cascade "direction" is not always top-down from legal trigger to asset
    layer. In this case, the asset layer (Tether freeze) preceded the legal trigger by
    6 months.
  - Tether's internal compliance process has access to intelligence that either comes
    from US Treasury / FBI / TRM Labs directly, or is developed independently via chain
    analytics — but either way produces action months before formal OFAC SDN publication.
  - This challenges simple linear cascade models and supports a networked-reaction view
    of censorship response.

  Follow-up directions (post-admission): (1) full 53/53 address confirmation vs the 2/53 spot check (batch
  query already shows 2-of-2 at identical timestamp; extrapolation is reasonable but
  requires explicit enumeration); (2) attempted interview / FOIA for any Tether
  Transparency announcements or US agency communications referencing this batch action;
  (3) cross-reference with Chainalysis / TRM Labs DPRK-cluster tagging dates.

scoped_claim: |
  "Tether batch-froze a subset of DPRK-laundering USDT-TRC20 addresses on 2025-04-30 at
  identical minute-precision timestamps, 188 days before the corresponding OFAC SDN
  designation (2025-11-04). Demonstrates that asset-layer cascade can precede the legal
  cascade in time, inverting the common top-down cascade model."

