analysis_notes: |
  Admitted 2026-06-09 as an attested_secondary nation-state network block. The
  National Bank of Ethiopia / Financial Intelligence Service restricted access
  to crypto-exchange websites (Binance, OKX, Bybit) from ~late October 2025
  (onset day-approximated to 2025-10-01). Coded as an l0_network observed_change
  (ISP/DNS website block), consistent with the india-fiu / nigeria-binance-
  network / philippines-sec-binance precedent; coverage is partially_measured
  (attested by journalism, not OONI-measured). Only one contemporaneous
  secondary source (Addis Insight) is captured, so attribution=plausible. origin
  agent_draft -> human_reviewed via LLM adjudication + maintainer oversight (not
  independent-human IRR).
scoped_claim: |
