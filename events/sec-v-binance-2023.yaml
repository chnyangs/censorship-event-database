analysis_notes: |
  comparison — first SEC civil-enforcement event in the dataset.
  Paper-relevant structural distinction: SEC operates on the
  securities-law axis (token-offering / exchange-registration) whereas
  OFAC operates on the sanctions axis. The 2023-06-05 Binance case
  produced a concrete L4 + offramp cascade via asset-freeze proceedings
  even without any SDN listing. Pairs with `sec-v-coinbase-2023` (next day)
  for the SEC-pair comparison.

  Relationship to `binance-4framework-2023` (2023-11-21): the SEC case is
  the civil-enforcement predecessor; the 11-21 settlement resolved DOJ /
  FinCEN / OFAC / CFTC charges. The SEC case itself continues separately
  and was partially settled in 2024-06 (BUSD securities-status dropped).

scoped_claim: |
  "SEC v. Binance (2023-06-05) was the first SEC civil-enforcement event in
  the dataset targeting a major crypto exchange; the asset-freeze motion
  produced a direct L4 + offramp cascade at Binance.US within 4 days
  (2023-06-09 fiat-rail suspension). Demonstrates securities-law
  enforcement as a distinct censorship-cascade trigger from OFAC SDN."

