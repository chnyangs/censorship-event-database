analysis_notes: |
  comparison — first SEC civil-enforcement event in the dataset.
  Paper-relevant structural distinction: SEC operates on the
  securities-law axis (token-offering / exchange-registration) whereas
  OFAC operates on the sanctions axis. The 2023-06-05 Binance case
  is retained as a draft comparison candidate, not an admitted layer
  observation. The SEC filing establishes the trigger and emergency-relief
  theory, but the file does not yet carry Binance.US/platform/banking-rail
  evidence for the reported 2023-06-09 fiat-rail suspension. Earlier drafts
  double-counted this as L4 frontend impact; that claim has been removed.

  Relationship to `binance-4framework-2023` (2023-11-21): the SEC case is
  the civil-enforcement predecessor; the 11-21 settlement resolved DOJ /
  FinCEN / OFAC / CFTC charges. The SEC case itself continues separately
  and was partially settled in 2024-06 (BUSD securities-status dropped).

scoped_knowledge: |
  What changed: no layer observation is admitted in this draft. The case is a
  candidate SEC high-intensity comparison because the SEC filing sought
  emergency relief against Binance.US/BAM entities, but the operational
  fiat-rail response is not pinned to an admission-grade off-ramp source.

  What did not change or could not be measured: the event has no address set,
  no asset issuer primitive, and no L1/L3 mechanism. The global Binance.com
  platform is not treated as the measured frontend; the scoped claim is
  Binance.US.

  Attribution: not coded. The SEC filing and emergency-relief motion name the
  Binance.US/BAM target and requested relief, but this is not enough under
  methodology §4.6 to admit an off-ramp state transition.

  Comparative value: this is a repair-queue SEC high-intensity candidate. Do
  not cite it in paper tables until a primary corporate or independently
  observable platform artifact is attached.

