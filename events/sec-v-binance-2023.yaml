analysis_notes: |
  comparison — first SEC civil-enforcement event in the dataset with a scoped
  CEX/off-ramp platform reaction retained.
  Paper-relevant structural distinction: SEC operates on the
  securities-law axis (token-offering / exchange-registration) whereas
  OFAC operates on the sanctions axis. The 2023-06-05 Binance case
  is admitted only for the Binance.US `offramp_cex` / platform-operations
  scope: OTC and selected trading-pair restrictions are primary-corporate
  artifacts, and the USD fiat-rail disruption is supported by contemporaneous
  journalism describing the Binance.US customer notice. Attribution is coded
  plausible, not direct, because the primary support artifacts establish
  platform changes while the causal tie to individual banking partners comes
  through the reported customer notice. Earlier drafts double-counted this as
  L4 frontend impact; that claim remains excluded.

  Relationship to `binance-4framework-2023` (2023-11-21): the SEC case is
  the civil-enforcement predecessor; the 11-21 settlement resolved DOJ /
  FinCEN / OFAC / CFTC charges. The SEC case itself continues separately
  and was partially settled in 2024-06 (BUSD securities-status dropped).

scoped_claim: |
  "SEC v. Binance produced a scoped Binance.US CEX/off-ramp platform reaction
  within the observation window; the dataset does not claim a measured L4
  frontend takedown, on-chain asset freeze, or L1/L3 effect."

scoped_knowledge: |
  What changed: Binance.US is admitted as a scoped CEX/off-ramp reaction. The
  retained operational artifacts cover OTC pause / trading-pair removals and
  the reported USD fiat-rail disruption around the same SEC-action window.
  This makes the case useful as a securities-law comparison, but only at the
  exchange/platform-operations layer.

  What did not change or could not be measured: the event has no address set,
  no asset issuer primitive, and no L1/L3 mechanism. The global Binance.com
  platform is not treated as the measured frontend; the scoped claim is limited
  to Binance.US CEX/off-ramp operations.

  Attribution: plausible. The SEC filing and emergency-relief motion name the
  Binance.US/BAM target; Binance.US support artifacts record platform
  restrictions; contemporaneous reporting records the USD fiat-rail customer
  notice and banking-partner explanation. The evidence is strong enough for a
  scoped reaction, but not for claiming SEC-only causation for each bank rail.

  Comparative value: high-intensity SEC civil action showing a CEX/off-ramp
  operational response rather than a protocol, L1/L3, asset-onchain, or L4
  frontend cascade.

