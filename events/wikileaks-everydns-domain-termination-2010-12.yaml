  Foundational L4-frontend / DNS-layer censorship precedent. The
  2010-12-02 EveryDNS termination of authoritative DNS for
  wikileaks.org is the conceptual ancestor of the 2024 India FIU
  domain-blocking action and the 2022 Cloudflare gateway-termination
  pattern: a corporate intermediary (DNS provider, in this case the
  dominant free-DNS provider serving ~500k domains) invokes its TOS
  to terminate the resolution / publication relationship for a
  pressure-targeted client, citing DDoS / collateral-damage rather
  than direct legal compulsion. The DNS termination took effect ~22:00
  EST 2010-12-02 (24 hours after EveryDNS notice) and produced
  worldwide DNS unreachability of wikileaks.org until the relocation
  to wikileaks.ch (Swiss Pirate Party-hosted) the following day.

  Discovery tier rationale: events 2008-2012 belong to the
  discovery_only_2008_2012 temporal tier per the 2008+ tiered frame
  in sampling/frame.yaml. analysis_use=discovery_ledger_only excludes
  this row from the 2017+ comparable-analysis denominator and from
  the 2013-2016 historical-baseline cohort; it is retained for
  discovery / cross-temporal-anchor purposes only. The 2010-12-02
  EveryDNS termination predates the existence of any blockchain
  censorship surface (Bitcoin genesis 2009-01-03; Ethereum Merge
  2022-09-15; PBS relay-censorship 2022+) and is therefore by
  construction outside the corpus's comparable analysis frame.

  Empirical shape: comparison (1 observed_change layer — L4 frontend
  load-bearing, attribution=direct). Admission tier: empirical_case
  (≥1 observed_change layer with direct attribution from the DNS
  provider's own statement). Stratum coding: S5_corporate. EveryDNS
  was not legally compelled by US authorities to terminate; the
  action was a unilateral corporate-TOS decision by the DNS provider
  in response to DDoS traffic, which makes this the canonical
  S5_corporate pre-2017 anchor — the corporate-intermediary
  "infrastructure provider exercising contractual termination under
  TOS pressure" precedent that the 2022-2024 Cloudflare / India FIU
  events extend.

  Cross-event reference: this event is the sibling DNS-layer row to
  wikileaks-amazon-aws-eviction-2010-12 (Amazon AWS eviction of
  WikiLeaks 2010-12-01, the prior-day hosting-provider termination).
  Together the Amazon-then-EveryDNS sequence constitutes the
  canonical 2010-12 "WikiLeaks intermediary cascade" — a hosting-
  layer termination on 2010-12-01 followed by a DNS-layer
  termination on 2010-12-02, both invoked under corporate TOS in
  response to political and DDoS pressure, with no direct US-
  government legal order in either case. This pair is the
  foundational pre-crypto reference for the 2022+ DeFi-frontend /
  gateway-termination cascade pattern.

  L0/L1/L3/asset_onchain/offramp_cex are all marked not_applicable on
  construct-did-not-exist grounds (no blockchain censorship surface in
  2010), consistent with the validator policy and the discovery-tier
  framing.

