    note: |
      Load-bearing layer for this event. EveryDNS (then the dominant
      free-DNS provider, ~500k domains) terminated authoritative DNS
      for wikileaks.org effective ~22:00 EST 2010-12-02 under its TOS
      clause prohibiting service use that interferes with other
      members' use; cited cause was DDoS traffic against the
