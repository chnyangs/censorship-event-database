      the EveryDNS termination by relocating wikileaks.org to
      wikileaks.ch (Swiss Pirate Party-hosted, Switch-registered) and
      establishing a global mirror network of >1,000 domain mirrors
      over the following days. Recovery is at the WikiLeaks-actor
      level (the EveryDNS authoritative-DNS relationship itself was
      not restored); the operational L4-frontend reachability of the
      WikiLeaks content was substantively recovered via the Swiss
      domain and mirror network.

