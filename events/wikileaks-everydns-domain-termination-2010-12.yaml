scoped_claim: |
  EveryDNS terminated authoritative DNS service for wikileaks.org at
  ~22:00 EST 2010-12-02 under its TOS clause prohibiting service use
  that interferes with other members', citing DDoS traffic against
  the wikileaks.org records; the termination produced worldwide DNS
  unreachability of wikileaks.org until the relocation to
  wikileaks.ch the following day. The L4-frontend layer carries the
  load-bearing direct-attribution observation; this is the
  foundational pre-crypto DNS-layer corporate-intermediary censorship
  precedent in the corpus.

scoped_knowledge: |
  This event is the canonical pre-crypto S5_corporate DNS-layer
  censorship precedent. EveryDNS (then the dominant free-DNS
  provider, serving ~500k domains) invoked a TOS interference clause
  to terminate authoritative DNS for wikileaks.org on 2010-12-02 in
  response to DDoS traffic against the wikileaks.org records. The
  proximate trigger was infrastructure-stability pressure, not direct
  US-government legal compulsion, which is what makes this row an
  S5_corporate (corporate policy) rather than an S3 (DoJ) or S1
  (OFAC) case. The conceptual analog in the modern corpus is the
  2022+ pattern of corporate-intermediary terminations under
  TOS / AUP at the gateway, frontend, and domain-resolution layers
  (Cloudflare gateway terminations, frontend operator delistings,
  India FIU domain-blocking). The 2010-12-02 EveryDNS action is the
  ancestor of all three: a corporate intermediary at the
  domain-resolution layer terminating service under TOS in response
  to pressure that the intermediary itself frames as
  infrastructure-stability rather than legal compulsion. Paired with
  the sibling wikileaks-amazon-aws-eviction-2010-12 (hosting-layer
  termination 2010-12-01), the two events constitute the
  foundational pre-crypto reference cascade for the cross-layer
  intermediary-termination pattern this corpus documents at the
  cryptocurrency layers in the 2017+ comparable cohort.

