analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase F single-day six-way
  enforcement-sweep discovery; lean run): authored by LLM agent without
  personally verifying Wayback / body_hash; status=draft, origin=agent_draft.
  Real release must replace this DRYRUN marker with a human-verified audit
  after pinning real archive anchors.

  Comparison documenting Japan FSA's 2018-06-22 single-day enforcement
  sweep — six 業務改善命令 (business-improvement orders) issued
  simultaneously to bitFlyer, Quoine, BTC Box, Bit Bank, BitPoint, and
  Tech Bureau (Zaif). Largest post-Coincheck FSA enforcement wave
  against the registered-VASP cohort. Empirical shape is `comparison`:
  two observed_change rows, both within the offramp_cex layer — (1)
  the FSA-side simultaneous six-exchange order issuance, and (2)
  bitFlyer's same-day voluntary new-customer-onboarding suspension.
  No L0/L1/L3/L4 frontend or asset_onchain cascade is asserted.

  Cross-event comparison vs Coincheck (japan-fsa-coincheck-orders-2018):
  the Coincheck case is a reactive single-entity supervisory cascade
  triggered by a security failure (NEM hack) producing a ~5-month
  full-withdrawal freeze; the six-exchange 2018-06-22 wave is a
  proactive cohort-wide AML/CFT/KYC supervisory sweep producing
  operator-side compliance overhauls (plan filings, monthly reporting,
  bitFlyer's voluntary onboarding pause) without a withdrawal-rail
  freeze. The 2018-06-22 wave is the cohort-scale analogue of the
  asymmetric single-entity Coincheck case.

  Cross-event link forward to Zaif (japan-fsa-zaif-orders-2018-09):
  Tech Bureau (one of the six 2018-06-22 addressees) subsequently
  received a follow-on business-improvement order in 2018-09 after the
  Zaif hack, demonstrating the FSA's escalating supervisory cadence
  against an addressee that did not adequately remediate. The
  2018-06-22 wave is the parent supervisory baseline for that
  follow-on event.

  DRYRUN caveats: trigger primary citation (FSA press-release index)
  is asserted with a 2018-calendar-folder Wayback pointer; pinned
  snapshot timestamp and body_hash capture for the specific
  2018-06-22 six-firm release permalinks are deferred to the
  human-audit pass. For non-DRYRUN release, capture body_hash +
  body_path for: (1) the FSA's 2018-06-22 business-improvement-order
  release page (six addressees), (2) bitFlyer's own customer-notice
  page on the new-customer-onboarding suspension, (3) each of the
  other five exchanges' contemporaneous compliance/notice pages,
  (4) the CoinDesk and Cointelegraph 2018-06-22 reporting
  permalinks. Marked evidence_use=contextual_unarchived on all
  citations to flag the unarchived state per validator policy.

scoped_claim: |
  "On 2018-06-22, the Japan FSA simultaneously issued business-
  improvement orders under the Payment Services Act to six registered
  crypto-asset exchanges — bitFlyer, Quoine, BTC Box, Bit Bank,
  BitPoint, and Tech Bureau (Zaif) — citing inadequate AML/CFT and
  KYC frameworks, compelling each operator to file a remediation plan
  by 2018-07-23 and to report monthly thereafter. bitFlyer
  additionally voluntarily suspended new-customer registrations the
  same day pending re-verification of existing customers' KYC data.
  The row does not claim frontend-disable, ISP/DNS-level connectivity
  blocking, on-chain asset-layer freeze, or any full withdrawal-rail
  suspension — only the single-day six-way offramp_cex supervisory-
  order load-bearing axis and bitFlyer's same-day onboarding pause."

