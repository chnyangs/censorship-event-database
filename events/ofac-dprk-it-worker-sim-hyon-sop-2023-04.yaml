analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17 (Wave 2.2D)**

  null_event documenting the 2023-04-24 OFAC SDN designation of Sim Hyon Sop, a DPRK
  national serving as deputy representative of the OFAC-designated Korea Kwangson
  Banking Corp (KKBC). The action is the **first major individual-IT-worker SDN
  designation with named cryptocurrency wallets** — Sim's role is the DPRK-state
  financial proxy receiving virtual-currency revenue from IT workers fraudulently
  employed at companies in the US and abroad, then routing it through PRC/HK OTC
  traders (Wu Huihui, Cheng Hung Man, same RA page) to fund DPRK WMD / ballistic-
  missile programs.

  **Codebook §1.2 application (attribution for prospective asset_onchain freeze)**:
  The SDN designation explicitly names Sim's EVM wallet (condition A holds). At
  draft time, no Tether/Circle public freeze confirmation specifically citing the
  Sim Hyon Sop SDN entry has been pinned (condition B not yet evaluated). Per
  codebook conservative default, future asset_onchain observation will be coded
  `plausible` unless an issuer public statement specifically naming the wallet
  surfaces within the publicly-knowable compliance window (≤ 24h post-SDN), in
  which case `direct` applies.

  **Structural significance for the corpus**: This event sits between
  lazarus-laundering-ofac-2020 (BTC-only, two PRC nationals as DPRK proxies) and
  dprk-usdt-network-ofac-2025 (53 USDT-TRC20 addresses, full institutional
  network). Sim 2023-04 is the **transition case**: individual-level DPRK proxy
  named with EVM wallets on three chains, but no Tron/USDT footprint yet. The
  2023→2025 progression in target chain composition (EVM-multi-chain → USDT-TRC20-
  concentrated) is a paper-worthy substrate observation.

  **Open items for promotion to status=admitted**:
  1. Pin OFAC RA page 2023-04-24 with body_hash + body_path (currently
     contextual_unarchived, needs replayable archive anchor).
  2. Reconcile address count (user-facts says 4; public reporting confirms 3 EVM
     entries). Possible 4th address: companion XBT entry attributed to Sim
     specifically (vs. Wu Huihui's 17 BTC). Re-check Federal Register notice
     2023-08944 full text.
  3. 14d post-event Tether/Circle freeze scan against 0x4f47bc49...96270c on
     ETH / Arbitrum / BSC (etherscan + arbiscan + bscscan blacklist tx lookups).
  4. 14d post-event public CEX policy statement scan (Binance / Coinbase /
     Kraken / OKX / Huobi).

  empirical_shape=null_event / admission_tier=null_case at draft time per
  Codebook §3-§4: 0 observed_change layers. Promotes to comparison /
  empirical_case if any of items 3-4 above yield a strong-attribution
