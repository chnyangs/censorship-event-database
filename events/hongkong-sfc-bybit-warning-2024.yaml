  **NEW EVENT AUTHORED — DRYRUN 2026-05-17**

  Non-US national regulator administrative enforcement: HK SFC's
  2024-03-14 press release 24PR47 publicly warning against Bybit as
  an unlicensed VATP, with simultaneous Suspicious VATP Alert List
  and Suspicious Investment Products Alert List listings enumerating
  Bybit Futures Contracts, Inverse Futures Contracts, options,
  leveraged tokens, and Bybit Wealth Management as products offered
  to HK investors without authorisation. This event PRE-DATES Bybit's
  later full HK exit / VATP-licence-application withdrawal, which is
  a separate downstream event outside this row's scope.

  trigger.type=regulatory_enforcement applied per codebook §5.1: HK
  SFC is a non-US national regulator and the 2024-03-14 press
  release is an administrative enforcement act (public warning +
  alert-list listing), not a network/payment-rail block. Research
  stratum S4_nation_state per the codebook §5.2 stratum-actor map.

  Empirical shape is `comparison`: one observed_change layer —
  offramp_cex (direct attribution; SFC named Bybit and enumerated
  the affected products). The l4_frontend layer is recorded as a
  coverage_gap per codebook §2 (Kazakhstan precedent) because no
  Wayback-pinned HK-vantage snapshot of bybit.com has been captured
  for this draft, and the full HK frontend withdrawal occurred later
  in 2024 as a downstream event. admission_tier=empirical_case
  (one strong-attribution observed_change layer per codebook §4).

