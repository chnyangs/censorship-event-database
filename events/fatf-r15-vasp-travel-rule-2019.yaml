analysis_notes: |
  comparison documenting FATF's 2019-06-21 adoption of the Interpretive
  Note to Recommendation 15, extending the Travel Rule (originally
  R.16, USD/EUR 1000 threshold) to Virtual Asset Service Providers.
  This is the foundational supranational crypto-AML trigger — the
  upstream parent of multiple national-scale Travel Rule events
  already in the corpus (korea-travel-rule-2022) and the EU TFR
  Regulation 2023/1113 (in Phase A.3 P0 pipeline). Structurally
  distinct from sanction-style events (no SDN list, no address
  enumeration) and from the EU MiCA framework (MiCA is a CASP
  licensing/prudential regulation; FATF R.15 INR is a transfer-
  metadata standard). Paper-relevant as the supranational substrate
  that triggers the cascade of national Travel Rule implementations
  — the censorship-measurement question is whether the metadata-
  transmission obligation produces measurable downstream off-ramp
  effects (transfer rejection / KYC-gating / self-custody friction).
  The 2019-06-21 trigger date anchors the comparable-period start
  for downstream cascade studies. DRYRUN: archival anchors are
  asserted but not personally verified by the LLM agent at authoring
  time; human auditor must pin real Wayback / body_hash anchors
  before release.

scoped_claim: |
  "FATF's 2019-06-21 adoption of the Interpretive Note to
  Recommendation 15 established the supranational legal substrate
  requiring Virtual Asset Service Providers in FATF member
