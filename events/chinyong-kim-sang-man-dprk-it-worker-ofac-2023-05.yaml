  null_event documenting the 2023-05-23 OFAC SDN designation (with the ROK
  Ministry of Foreign Affairs) of Chinyong IT Cooperation Company (aka Jinyong)
  and employee Kim Sang Man, for the DPRK overseas IT-worker revenue scheme that
  funds the regime's WMD programs. Kim's SDN entry lists six exchange deposit
  addresses (per Chainalysis, eight identifiers display because some ETH
  addresses also moved USDT/USDC); those addresses received >$28M of crypto
  2021-2022.

  Distinct from ofac-dprk-it-worker-sim-hyon-sop-2023-04 (2023-04-24 individual
  designation, Sim Hyon Sop / KKBC): different date, different targets
  (Chinyong/Kim vs Sim). Coded null_event / null_case per the S1 convention:
  the designation is the trigger; no public CEX cascade was documented in the
  14-day window. Per codebook §1.6 the deposit addresses are not coded as an
  asset_onchain observation (mainstream-exchange deposit addresses, no captured
  primary_onchain freeze tx_hash); the measurable surface is carried at
  offramp_cex (observed_no_change / none). Sources verified + captured
  2026-05-31 (Treasury jy1498 + OFAC RA 20230523, both body_hash-pinned).

scoped_claim: |
  "OFAC's 2023-05-23 SDN designation (with ROK MOFA) of Chinyong IT Cooperation
  Company + Kim Sang Man named six DPRK IT-worker exchange deposit addresses. No
  public CEX cascade was documented in the 14-day window. null_case: DPRK
  IT-worker proxy target with limited measurable cross-layer surface, mirroring
  the Sim Hyon Sop 2023-04 precedent."

