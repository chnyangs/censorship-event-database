analysis_notes: |
  **NEW EVENT AUTHORED -- AGENT_DRAFT 2026-05-31**. Created from the P4
  census-gap queue after official-source verification. The event remains
  `status=draft` and `origin=agent_draft`; automation must not promote it to an
  admitted paper row without human admission review.

  Inclusion rationale: this is not a soft warning. The captured CBK legal
  instructions reproduce an operative Kuwait circular that prohibits payment
  use, investment dealing, VASP licensing, and mining activity for virtual
  assets. That is a deliberate restriction on legitimate crypto payment,
  investment, service-provider, and mining activity under codebook §9.

  Modeling rationale: trigger.type=nation_state_block because the action is a
  state-level payment/commercial-rail prohibition, and research_stratum is
  S4_nation_state. The load-bearing observation is coded at offramp_cex because
  the practical access effect is the denial of regulated financial/commercial
  service channels in Kuwait, not a network block, protocol action, frontend
  takedown, or token-admin freeze.

  Source limitation: the CMA HTML page was verified live through browsing, but
  command-line capture timed out twice. The captured CBK PDF is therefore the
  sole replayable source anchor in this draft.

