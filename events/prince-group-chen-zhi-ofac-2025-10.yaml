analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1;
  sources verified+captured, awaiting human admission). OFAC SDN
  designation 2025-10-14 (Treasury sb0278), jointly with the U.K., of
  the Prince Group TCO (146 targets) led by Chen Zhi for "pig
  butchering" crypto fraud out of forced-labor scam compounds; Chen
  Zhi's SDN entry attaches Bitcoin addresses (four at designation, 25
  added 2025-10-30), alongside a parallel DOJ ~127,000-BTC ($15B) civil
  forfeiture. In-scope per §9 INCLUDE (OFAC SDN designation) — the
  censorship action is the SDN designation / asset blocking, distinct
  from the §9 EXCLUDE for prosecuting a scam-as-platform. Coded
  null_event / null_case per the S1 convention (cf.
  bitriver-russia-mining-ofac-2022-04): the on-chain footprint is
  native BTC (no issuer freeze primitive) and no per-event CEX cascade
  was pinned in the 14-day window, so the measurable cross-layer surface
  is limited (offramp_cex observed_no_change / none). Primary source
  verified + captured 2026-05-31 (Treasury sb0278, body_hash-pinned; no
  fabrication). Conservative coding per codebook §8.4 pending human
  review.

scoped_claim: |
  "The 2025-10-14 OFAC + U.K. designation of the Prince Group TCO /
  Chen Zhi (Treasury sb0278, pig-butchering crypto fraud) attached
