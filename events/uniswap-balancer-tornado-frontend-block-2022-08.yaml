recovery:
  - layer: l4_frontend
    resolved: false
    note: |
      The Uniswap Labs and Balancer Labs frontend-screening
      policies were not reversed in the initial cascade window.
      Uniswap Labs subsequently expanded the screening universe
      (see uniswap-frontend-delisting-2023 for the 2023 token-
      list restriction follow-on). The 2025-03-21 OFAC delisting
      (tornado-cash-ofac-delisting-2025) is the candidate
      upstream L4 recovery anchor and is tracked separately.

analysis_notes: |
  DRYRUN 2026-05-16 — agent-drafted; status=draft; origin=agent_draft.
  Real release requires a human-audit pass to pin Wayback snapshots
  and body_hashes for the four supporting_journalism citations (The
  Block, CoinDesk, Blockworks, CryptoSlate, The Defiant) and to
  re-pin the Uniswap Labs / Balancer Labs first-party social-media
  / blog statements (Hayden Adams Twitter, Balancer governance
  forum) that this draft does not cite directly.

  Frontend cascade row paired with the sibling L3 RPC block
  (infura-alchemy-tornado-rpc-block-2022) and the sibling asset-
  layer freeze (circle-usdc-tornado-2022). Together with the
  contemporaneous Aave frontend block (aave-tornado-frontend-
  block-2022-08, sibling event) the four S5_corporate rows
  compose the August 2022 corporate-cascade quartet downstream
  of the OFAC Tornado Cash trigger family.

  Structurally distinct from uniswap-frontend-delisting-2023 (the
  2023 token-list restriction event), which is L4-only and
  token-scoped; this 2022-08 event is L4-only and address-scoped
  (TRM-Labs-flagged wallet screening). The pair documents two
  modes of Uniswap Labs frontend-level compliance action: address
  screening (2022) and token delisting (2023).

  Empirical shape: comparison (2 distinct observed_change rows
  at L4 — Uniswap Labs frontend direct, Balancer Labs frontend
  direct). Admission tier: empirical_case (2 strong-attribution
  observed_change rows at the same layer; not anchor_case
  because the supporting_journalism citations are not first-
  party corporate policy statements at the time of draft).

  Stratum coding: S5_corporate. The OFAC SDN designation is the
  upstream trigger (related event tornado-cash-ofac-2022), but
  Uniswap Labs and Balancer Labs chose to apply the block as a
  corporate-compliance policy via the third-party TRM Labs
  screening API; neither firm was named in the OFAC designation,
  and the L4 frontend layer is not itself a regulated activity
  under the Treasury secondary-sanctions authority. The
  corporate-policy character is what makes this a paper-relevant
  L4 anchor for the broader "L4 frontend is corporate-policy-
  driven, not OFAC-compelled" claim.

  DRYRUN caveats: all citations carry 2022-calendar-folder
  Wayback pointers rather than pinned snapshots; pinned
  snapshot timestamps and body_hash captures are deferred to
  the human-audit pass. Marked evidence_use=contextual_unarchived
  on all citations per validator policy.

scoped_claim: |
  "The 2022-08-12 Uniswap Labs and Balancer Labs frontend-
  screening blocks of TRM-Labs-flagged wallets (seeded by the
  2022-08-08 OFAC Tornado Cash SDN address set) constitute a
  paired L4 frontend-operator corporate-policy-change event,
  with two named operators (Uniswap Labs, Balancer Labs)
  applying the block to their hosted UIs (app.uniswap.org,
  balancer.fi) while the underlying smart-contract protocols
  remain fully functional. The row does not claim OFAC-
  compelled action, ISP-level connectivity blocking,
  consensus-layer effect, or asset-layer freeze — those are
  sibling-event rows under tornado-cash-ofac-2022 / infura-
  alchemy-tornado-rpc-block-2022 / circle-usdc-tornado-2022."

