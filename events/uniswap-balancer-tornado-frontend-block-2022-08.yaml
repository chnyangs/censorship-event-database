target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    The frontend block applies to addresses flagged by the TRM Labs
    risk-screening API across seven categories (sanctions, stolen
    funds, privacy mixers, terrorist wallets, CSAM-linked wallets,
    and other categories), with the 2022-08-08 OFAC Tornado Cash SDN
    address set forming the seed enforcement perimeter. By 2022-08-22
    (CoinDesk reporting) Uniswap Labs had blocked 253 addresses via
    the TRM Labs integration. The target is `entity` (not address_set)
    because the enforcement is a two-firm corporate-policy action
    against a moving TRM-flagged address universe rather than a
    fixed enumerated address list; the firms blocked are the named
    target. Subset because the TRM-flagged address universe is not
    publicly enumerated by either firm in real time, and the 253
    figure is a 2022-08-22 retrospective snapshot.
  entity: Uniswap Labs and Balancer Labs (DeFi frontend operators)
  actor_type: dex_frontend_operator
  actor_name: Uniswap Labs (app.uniswap.org) and Balancer Labs (balancer.fi)
  chains: [ethereum]
  canonical_domains:
    - app.uniswap.org
    - balancer.fi

jurisdiction: [US, corporate_global]

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      DeFi-frontend block is a client-side TRM-API-driven address
      screening policy implemented in the app.uniswap.org and
      balancer.fi UI; not a DNS / ISP-level block. The domains
      remained globally reachable; blocked addresses see a
      compliance-block modal rather than a connectivity error.
  - layer: l1_consensus
    status: not_applicable
    chain: ethereum
    note: |
      Pre-Merge by 34 days (Paris was 2022-09-15); PBS relay
      censorship infrastructure did not exist yet. The
      consensus-layer effect of the 2022-08-08 OFAC trigger is
      captured in tornado-cash-ofac-2022 observations[l1] for
      the post-Merge window.
  - layer: l3_rpc
    status: not_applicable
    note: |
      The L3 RPC-provider sanctions block (Infura, Alchemy) is
      captured in the sibling event
      infura-alchemy-tornado-rpc-block-2022. This event isolates
      the L4 frontend-operator policy decision, which is upstream
      of the user wallet but downstream of any L3 RPC filter.
  - layer: l4_frontend
    status: measured
    scope:
      - app.uniswap.org
      - balancer.fi
    note: |
      Load-bearing layer for this event. Two named DeFi frontend
      operators (Uniswap Labs, Balancer Labs) activated TRM-Labs-
      API-driven address screening on their hosted UIs around
      2022-08-12, surfacing a compliance-block modal for TRM-
      flagged wallets attempting to connect. The underlying
      Uniswap and Balancer smart-contract protocols remained
      fully functional and reachable via alternative frontends
      / direct contract interaction. Status=measured because
      the action is corroborated by multiple contemporaneous
      journalism sources (The Block, CoinDesk, Blockworks,
      The Defiant) and the 253-address scale anchor was
      cross-checked against the open-source banteg/uniswap-
      banned-addresses GitHub gist cited by CoinDesk.
  - layer: asset_onchain
    status: not_applicable
    note: |
      No issuer-level token freeze invoked by the frontend
      block. The sibling asset-layer action is the Circle USDC
      blacklist captured in circle-usdc-tornado-2022.
  - layer: offramp_cex
    status: not_applicable
    note: |
      Frontend block is upstream of CEX off-ramps; the off-ramp
      reaction (dYdX, etc.) is captured under the OFAC trigger
      event tornado-cash-ofac-2022 observations[offramp_cex].

