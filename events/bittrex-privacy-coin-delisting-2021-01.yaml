analysis_notes: |
  **QUALITY-LOOP REPAIR 2026-06-01** (automated source repair; no new
  human-audit stamp). Captured the official Bittrex Global Zendesk article
  for the XMR/ZEC/DASH/GRIN delisting and added it as the first-party
  operator source at trigger and observation level. The row remains scoped
  to the January 2021 XMR/ZEC/DASH cohort because the official article's
  GRIN footnote records a later May 2021 removal. attribution is now direct
  for the market-removal action itself; any AML/KYC or regulatory motive
  remains contextual because Bittrex did not state one in the captured body.

  **AUTHORED 2026-05-31** (overnight census tick 8, human:xiangwen
  autonomous mandate). Bittrex's 2021-01-01 announcement to delist
  privacy coins Monero/Zcash/Dash (markets removed 2021-01-15 23:00 UTC)
  — the FIRST U.S.-based exchange to delist privacy coins, an early node
  in the privacy-coin-delisting wave later joined by Kraken/Huobi/OKX/
  Binance (cf. related_events). comparison shape, single offramp_cex
  observed_change, attribution=plausible (the delisting is directly
  observed but Bittrex stated no explicit reason; the KYC/AML compliance
  motive is contextual). XMR/ZEC/DASH are independent base-chain assets,
  so l0/l1/l3/l4/asset_onchain are not_applicable. Sources verified via
  WebSearch + capture 2026-05-31 (CoinDesk + Decrypt, body_hash-pinned;
  no fabrication).

