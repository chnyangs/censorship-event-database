analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-5 audit (S5 corporate, misc) by
  human:xiangwen. Anchored on Fireblocks Aave-Arc whitelist press release
  (primary_corporate, Wayback 20240613130657, 7f725502...). observed_change/
  direct (permissioned/whitelist-gated pool). comparison/empirical_case preserved.

  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (agent_draft per user
  instruction; status=draft because no body_hash+body_path archive
  anchors have been pinned in this session). Authored by LLM agent
  without personally verifying Wayback/body_hash; human review required
  to elevate to admitted status.

  comparison shape: 2 observed_change layers (asset_onchain load-bearing,
  L4 frontend secondary-and-derived). Paper-relevant as the **first
  major protocol-level (not frontend-level) address-binary whitelisting
  in major DeFi**. Structurally distinct from sibling Aave events:

  1. **vs. aave-tornado-frontend-block-2022-08** — the later 2022-08
     event is a frontend-overlay address-screening on the open Aave
     V2/V3 pools (L4-only, addresses screened by the frontend operator,
     underlying protocol unchanged). The present 2022-01-05 event is the
     **architectural** permissioned-pool launch: a separate Aave V2 fork
     deployed with the PermissionManager contract enforcing
     address-binary whitelisting at the protocol-contract layer. The
     two events are different censorship primitives at different layers
     on different deployments of the Aave protocol family.

  2. **vs. cftc-v-ooki-dao-2022** — Ooki DAO is a regulator-triggered
     enforcement event against a DAO; Aave Arc is a self-imposed
     corporate/DAO-governance architectural decision to deploy a
     permissioned variant of the protocol to onboard regulated
     institutional capital. The Ooki event is reactive-enforcement
     (S3); Aave Arc is proactive-self-permissioning (S5).

  Paper-relevant axis: Aave Arc is the cleanest example in the dataset
  of a major DeFi protocol introducing **on-chain (asset_onchain layer)
  address-binary inclusion/exclusion control** without any direct
  external regulatory trigger — the architectural decision was driven
  by the Aave DAO + Aave Companies' commercial strategy to onboard
  regulated institutional capital, with KYC-only access enforced at the
  protocol-contract layer via PermissionManager. The whitelister role
  (Fireblocks at launch) is itself a corporate compliance intermediary
  approved by Aave Governance.

  DRYRUN caveats: trigger primary citation (Fireblocks press item) and
  supporting community-doc citation (Aave Arc PermissionManager docs)
  are asserted with wayback wildcard pointers; pinned-snapshot
  timestamps and body_hash captures are deferred to the human-audit
  pass. For non-DRYRUN release, capture body_hash + body_path for: (1)
  Fireblocks 2022-01-05 press item, (2) CoinDesk 2022-01-05 launch
  coverage, (3) Aave Arc PermissionManager docs page, (4) an
  app.aave.com Aave Arc subview snapshot circa 2022-01. Marked
  evidence_use=contextual_unarchived on all citations to flag the
  unarchived state per validator policy.

  Note: distinct from the later Aave Tornado frontend block (2022-08)
  — the 2022-08 event is the frontend address-screening overlay on
  Aave V2/V3 (L4-only); the 2022-01 event documented here is the
  architectural permissioned-pool launch (asset_onchain layer).

scoped_claim: |
  "On 2022-01-05, Aave Arc — a permissioned-pool fork of the Aave V2
  protocol — went live on Ethereum mainnet with Fireblocks as the first
