  comparison shape: 1 observed_change layer (offramp_cex, attribution=direct).
  On 2023-01-19 the SEC settled with Nexo Capital Inc. over its retail
  crypto-asset lending product, the Earn Interest Product (EIP), charging Nexo
  with failing to register the offer and sale of the EIP. Nexo agreed to a
  $22.5 million SEC penalty (with a parallel NASAA-coordinated $22.5 million in
  state penalties, $45 million total) and to cease its unregistered offer and
  sale of the EIP to U.S. investors; per the captured SEC release, Nexo was
  permanently ceasing to offer the EIP to all U.S. investors and phasing out
  all of its products and services in the United States — i.e. a full U.S.
  retail-market exit.

  §9 inclusion: in scope — a federal securities regulator deliberately
  restricting the offering of a legitimate crypto yield/off-ramp product, and
  forcing the platform's exit from the U.S. retail market (not a scam
  prosecution; Nexo was an operating lending platform whose product was ruled an
  unregistered security). This is the corporate-platform-restriction category of
  §9 ("DOJ/SEC/CFTC/FinCEN enforcement that restricts a legitimate
  platform/operator"), here a US-market exit forced by the SEC.

  trigger.type=sec_action and research_stratum=S3_doj_sec_cftc_fiod per codebook
  §5: the SEC is a US federal securities regulator (S3). Sibling enforcement
  actions in the same crypto-lending-product trajectory are
  blockfi-sec-lending-2022 (the Feb-2022 SEC/state $100M BlockFi BIA settlement
  this Nexo settlement closely parallels) and blockfi-multistate-cease-desist-
  bia-2021-07 (the earlier state-level BlockFi cease-and-desist). The SEC's
  February 2022 BlockFi charges are the "similar crypto investment product"
  action the captured Nexo release references as the trigger for Nexo's
  voluntary wind-down of new-investor EIP sales.

  attribution=direct per §1.1: the SEC order names the actor (SEC) and the
  target (Nexo / EIP) and is the instrument compelling the cessation.
  admission_tier=empirical_case (≥1 strong-attribution observed_change layer).

  Capture note: the SEC reorganized its newsroom URL paths after 2023, so the
  canonical press-release path (/newsroom/press-releases/2023-11) has no 2023-
  dated Wayback memento; the earliest available memento (20240704131027) was
  captured and grep-confirms all load-bearing facts (Nexo, EIP, $45M, cease to
  U.S. investors, "Jan. 19, 2023"). No fabrication.

scoped_claim: |
  "The SEC settlement of 2023-01-19 ($22.5M SEC penalty; $45M total with
  parallel state penalties) directly ordered Nexo Capital Inc. to cease its
  unregistered offer and sale of the Earn Interest Product (ruled an
  unregistered security) to U.S. investors and led Nexo to permanently cease
  offering the EIP to all U.S. investors and phase out all of its products and
  services in the United States — a regulator-forced U.S. retail-market exit at
  the off-ramp/yield-product perimeter (offramp_cex load-bearing,
  attribution=direct). The row does not claim ISP-level blocking, on-chain asset
  freeze, frontend DOM block, or the full enumeration of the parallel
  multistate (NASAA) state orders."

