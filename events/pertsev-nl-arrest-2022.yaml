analysis_notes: |
  null_event — first cross-border arrest of a crypto privacy-tool
  developer. Netherlands FIOD action, not a US-jurisdiction event; 2 days
  downstream of 2022-08-08 OFAC Tornado Cash SDN. Pertsev spent 9 months in
  pretrial detention; 2024-05-14 Dutch court conviction on money-laundering
  (5y4m sentence). This event captures the 2022-08-10 arrest trigger; the
  2024 conviction is a follow-on event not yet separately catalogued.

  Structural significance: developer-level enforcement via a non-US
  jurisdiction demonstrates that OFAC SDN pressure can catalyze parallel
  enforcement in allied states (NL-US MLAT framework). Paper-worthy as the
  first such extension.

scoped_claim: |
  "FIOD arrest of Alexey Pertsev on 2022-08-10 in Amsterdam — 2 days after
  the OFAC Tornado Cash designation — was the first cross-border arrest of
  a crypto privacy-tool developer. Non-US jurisdiction (NL) extension of the
  Tornado Cash OFAC cascade; individual-developer-level enforcement
  downstream of protocol-level OFAC action."

