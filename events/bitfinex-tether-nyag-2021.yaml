analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN Wave 2.3 P2 2026-05-17**: authored by
  LLM agent without personally verifying Wayback / body_hash; origin=
  agent_draft, status=draft. Human audit must pin verified Wayback
  snapshots and body_hash / body_path captures of the NY OAG
  settlement PDF and the Tether corporate response before this row
  may be promoted to status=admitted with admission-grade citations.

  **Stratum-trigger consistency**: trigger.type=regulatory_enforcement
  and research_stratum=S4_nation_state per codebook §5.2. NY OAG is a
  US state-level administrative enforcement actor; not a federal
  agency (S3 reserved for DOJ/SEC/CFTC/FinCEN/federal court civil
  orders) and not a corporate or supranational actor. The S4
  classification preserves the state-level enforcement axis while
  keeping the federal CFTC sibling (bitfinex-tether-cftc-2021,
  S3_doj_sec_cftc_fiod) on a distinct stratum for cross-stratum
  comparison purposes. Codebook §5.1 reserves regulatory_enforcement
  for non-US national administrative enforcement; this state-AG
  case is the nearest available cell in the validator-permitted
  matrix.

  **Comparison shape**: 2 observed_change rows on a single distinct
  layer (offramp_cex), keyed by two operator actors — the Bitfinex
  exchange operator entities (iFinex / BFXNA / BFXWW) and the Tether
  USDT issuer entities — yielding empirical_shape=comparison and
  admission_tier=empirical_case (2 direct-attribution rows on the
  offramp_cex layer; both with primary_legal NY OAG settlement and
  primary_corporate Tether-response sources). L0 / L1 / L3 / L4 /
  asset_onchain are all not_applicable: the 2021-02-23 settlement
  did not alter ISP reachability, did not engage Ethereum PBS relays
  (which did not yet exist), did not implicate the L3 RPC compliance
  substrate (also did not yet exist), did not require frontend
  takedown or new geofencing beyond pre-existing US-resident
  geoblock, and did not compel a USDT addBlackList() on-chain
  action.

  **Foundational state-AG-level crypto enforcement precedent**:
  this is the first state-level admin settlement to package
  (a) a multi-million-dollar penalty, (b) a state-resident
  business prohibition, and (c) a multi-year reserve-disclosure
  regime against a major centralized exchange + stablecoin
  issuer pair. The 2021-10-15 federal CFTC settlement
  (bitfinex-tether-cftc-2021) extends the same disclosure-regime
  change to the federal commodities-law axis ~8 months later.
  The 2023-12-09 tether-retroactive-sweep-2023 on-chain
  compliance event represents the eventual issuer-level
  compliance-tooling buildout downstream of this 2021-02-23
  disclosure-regime initialization.

scoped_claim: |
  "The 2021-02-23 NY OAG settlement against iFinex / BFXNA / BFXWW
  and the Tether issuer entities imposes a $18.5M monetary penalty,
  a prospective prohibition on trading activity with New York
  persons or entities, and a two-year quarterly USDT reserve-
  composition reporting obligation. The row registers two
  direct-attribution observed_change observations at the offramp_cex
  layer (the NY-resident trading prohibition and the Tether
  reserve-attestation regime change). The row asserts neither
  network-layer reachability change nor any USDT addBlackList()
  on-chain action; the reserve-attestation regime is an off-chain
  disclosure obligation registered at offramp_cex on the
  Tether-as-issuer fiat-rails interface."

