analysis_notes: |
  **SOURCE STRENGTHENING 2026-06-01:** captured Binance's official 2019-06-14
  support article "Terms of Use Review" (sha256:
  567ddd89e8f29dd0f8fb5b8190a080258bf0013dca0b944c9f3d9ea4a5b07224) and the
  same-day official Binance Terms page (sha256:
  cefd1bd90cacd52f998442695dfb474dc8f6cc2230a49e277b4faae81fc17a98). The row
  now meets the strict admission-grade source floor and no longer needs the
  `attested_secondary` lower-admission tier: Binance itself states the
  U.S.-person service restriction and the 2019-09-12 trade/deposit cutoff for
  users not in accordance with the Terms. `target.entity` now identifies the
  U.S.-person Binance.com customer class explicitly.

  **ADMITTED 2026-05-31** (genuine review by human:xiangwen reviewing agent:
  TASK-2 lower-tier. Originally admitted at evidence_tier=attested_secondary
  on the then-captured source floor; the 2026-06-01 official-source repair
  above supersedes that lower-tier caveat without changing the human admission
  decision.)
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). Binance Holdings Limited's
  2019-06-14 Terms-of-Use update barring all U.S. persons from trading/
  depositing on the global binance.com platform (enforced 2019-09-12),
  redirecting U.S. customers to the separate FinCEN-registered Binance.US
  platform. A flagship 2019 corporate jurisdiction-exit geofence, in the same
  U.S.-corporate-retreat cohort as poloniex-circle-us-token-geofence-2019-05
  and the backdrop to the later sec-v-binance-2023 enforcement. comparison
  shape, single offramp_cex observed_change, attribution=direct (Binance is
  the announcing actor AND the operator of the restricted off-ramp; its own
  support article and ToS state the restriction, per §1.1). l0/l1/l3/l4/asset_onchain
  not_applicable (a CEX access-policy change, not a network/protocol/asset
  action). Sources verified via WebSearch + captured 2026-05-31 and
  strengthened 2026-06-01 (official Binance Support + Terms artifacts plus
  CoinDesk and TechCrunch corroboration, body_hash-pinned; "U.S. person",
  "unable to provide services", "2019/09/12", and "trade or deposit" grepped
  from captured bodies; no fabrication).

