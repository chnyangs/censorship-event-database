coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      binance.com itself was not ISP/DNS-blocked; the action is a corporate
      Terms-of-Use restriction and IP-based geofence of U.S. persons from the
      trading product, not a network-layer domain filter.
  - layer: l1_consensus
    status: not_applicable
    note: |
      A centralized-exchange access-policy change; no chain consensus surface
      is engaged.
  - layer: l3_rpc
    status: not_applicable
  - layer: l4_frontend
    status: not_applicable
    note: |
      The ToS bar and U.S.-IP geofencing/redirect to Binance.US is an
      access/off-ramp restriction on the trading product; not pinned as a
      separable frontend-block observation here.
  - layer: asset_onchain
    status: not_applicable
    note: |
      No issuer/contract-level freeze; the action restricts a user class from
      the exchange off-ramp, not any asset on-chain.
  - layer: offramp_cex
    status: measured
    scope:
      - binance_com_us_person_trading_deposit
    note: |
      Load-bearing layer. Binance Holdings Limited updated binance.com's Terms
      of Use on 2019-06-14 to bar U.S. persons from its services and posted
      an official support notice stating that, after 90 days and effective
      2019-09-12, users not in accordance with the Terms would retain wallet
      and fund access but no longer be able to trade or deposit on
      Binance.com. The official Binance support article and Terms page are
      body_hash-pinned; contemporaneous trade press is retained as
      corroboration.

