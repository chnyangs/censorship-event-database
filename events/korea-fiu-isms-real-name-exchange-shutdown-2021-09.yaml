analysis_notes: |
  **SOURCE REPAIRED 2026-06-02** (automation): pinned official FSC/FIU 2021-07-28
  HTML/PDF anchors for the 2021-09-24 VASP reporting deadline, real-name verified
  account requirement, and operator-closure risk, plus the official FSC/FIU
