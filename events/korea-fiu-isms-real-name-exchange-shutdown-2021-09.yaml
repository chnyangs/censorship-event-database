  set `primary_source_verified=true`, and narrowed the measurable outcome from a
  secondary-only "~40 faced shutdown" claim to official counts: 42 filed VASPs,
  29 passed review, 5 deferred, and 8 withdrew.

  **ADMITTED 2026-05-31** (genuine review by human:xiangwen reviewing agent: TASK-2 lower-tier. §9-clear, well-documented deliberate restriction admitted at evidence_tier=attested_secondary (codebook §10) — single captured contemporaneous source; verified clean in bulk adversarial-verify; filterable via evidence_tier. Reworded a stale planning marker.)
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources verified+captured,
  awaiting human admission).

  Event: South Korea's 2021-09-24 Financial Intelligence Unit (FIU) registration deadline under
  the amended Act on Reporting and Use of Specific Financial Information. Virtual-asset
  exchanges had to register with the FIU, hold a security certification (ISMS) and a real-name
  verified bank-account partnership for KRW-market exchange activity, and meet AML requirements
  to keep operating. Official FSC/FIU result evidence shows 42 filed VASPs, 29 approvals
  (24 exchange operators and 5 custody/wallet operators), 5 deferrals, and 8 withdrawals; the
  four KRW-market exchange operators are Upbit, Korbit, Coinone and Bithumb. §9 INCLUDE: a
  state-imposed reporting/AML/real-name-account regime that forces shutdown or fiat-rail
  severance of non-compliant exchanges is a deliberate restriction of service, not a mere
  advisory.

  Scope discipline: the official sources substantiate the 2021-09-24 reporting deadline,
  real-name verified deposit/withdrawal account language, ISMS/ISMS-P status-check language,
  official review counts, and the four KRW-market exchanges. The older "~40 faced shutdown"
  same-day journalism is retained only as corroboration, not as a load-bearing official count.

  Why trigger.type=regulatory_enforcement: a non-US national regulator (KR FIU/FSC)
  administrative enforcement regime, not an L0/payment-rail network block. Per codebook §5.1
  regulatory_enforcement is the canonical enum for non-US national-regulator administrative
  action (cf. korea-fsc-institutional-restriction-2017). §5.2 maps regulatory_enforcement →
  S4_nation_state.

  Why empirical_shape=comparison / admission_tier=empirical_case: exactly one observed_change
  layer (offramp_cex) with strong attribution (direct).

  Why attribution=direct: the FSC/FIU sources themselves identify the reporting deadline,
  real-name account constraint, review results, withdrawal/termination requirement for
  withdrawing businesses, and criminal exposure for unreported illegal operation.

  DEDUP NOTE: distinct from korea-fsc-institutional-restriction-2017 / korea-fsc-ico-ban-2017
  (2017 FSC actions) and from korea-travel-rule-2022 (2022 travel-rule implementation). This is
  the 2021-09-24 FIU registration-deadline exchange-shutdown event.

