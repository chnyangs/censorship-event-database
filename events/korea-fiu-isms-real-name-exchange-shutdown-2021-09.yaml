analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources verified+captured,
  awaiting human admission).

  Event: South Korea's 2021-09-24 Financial Intelligence Unit (FIU) registration deadline under
  the amended Act on Reporting and Use of Specific Financial Information. Virtual-asset
  exchanges had to register with the FIU, hold a security certification (ISMS) and a real-name
  verified bank-account partnership, and meet AML requirements to keep operating. At the
  deadline, unregistered exchanges had to shut down and certified-but-unbanked exchanges had to
  cease Korean-won fiat trading; ~40 exchanges faced shutdown, leaving four full-service
  survivors (Upbit, Bithumb, Coinone, Korbit). §9 INCLUDE: a state-imposed licensing regime
  that forces shutdown / fiat-rail severance of legitimate exchanges is a deliberate
  restriction of service, not a mere advisory.

  Scope discipline: the captured CoinDesk source substantiates the FIU registration deadline,
  the real-name verified bank-account requirement, security certification, AML requirement, the
  four full-service survivors, and the ~40-exchange shutdown. It does NOT spell out the acronym
  "ISMS" verbatim (it says "security certification"); the id retains the candidate slug and the
  body of the claim uses the source's "security certification" wording, with ISMS noted as the
  certification's name (well-established) for human audit. Human audit TODO: pin the FSC/KoFIU
  primary press release to support the explicit ISMS terminology and the precise shut-down
  count, and consider elevation to direct.

  Why trigger.type=regulatory_enforcement: a non-US national regulator (KR FIU/FSC)
  administrative enforcement regime, not an L0/payment-rail network block. Per codebook §5.1
  regulatory_enforcement is the canonical enum for non-US national-regulator administrative
  action (cf. korea-fsc-institutional-restriction-2017). §5.2 maps regulatory_enforcement →
  S4_nation_state.

  Why empirical_shape=comparison / admission_tier=empirical_case: exactly one observed_change
  layer (offramp_cex) with strong attribution (plausible).

  Why attribution=plausible (not direct): per §1.5/§8.4 the action is documented by
  contemporaneous journalism, not the FIU's own primary order, and the target is class-level.
  Conservative default.

  DEDUP NOTE: distinct from korea-fsc-institutional-restriction-2017 / korea-fsc-ico-ban-2017
  (2017 FSC actions) and from korea-travel-rule-2022 (2022 travel-rule implementation). This is
  the 2021-09-24 FIU registration-deadline exchange-shutdown event.

