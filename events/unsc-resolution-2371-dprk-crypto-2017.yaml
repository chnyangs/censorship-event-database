analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17 — Wave 2.2D
  re-author preamble (note: replaces dropped rate-limit-partial)**

  null_event documenting UN Security Council Resolution 2371,
  adopted unanimously on 2017-08-05 in response to DPRK's July
  2017 ICBM tests. 2371 tightens the DPRK sanctions regime via
  (i) export bans on coal, iron, iron ore, seafood, lead and lead
  ore; (ii) prohibition of new or expanded DPRK joint ventures;
  (iii) overseas-labor caps; and (iv) financial-system
  tightening (Foreign Trade Bank asset freeze; clarification that
  financial-services companies are treated as financial
  institutions for sanctions purposes).

  **Honest-coding note on the cryptocurrency framing**: the
  authoring brief described 2371 as "the first UN resolution
  explicitly mentioning DPRK cryptocurrency operations as
  sanctions evasion vector". The text of 2371 itself does NOT
  explicitly use the words "cryptocurrency" or "virtual currency"
  — that explicit framing first appears in later DPRK-track
  instruments (UNSCR 2397 of 2017-12-22 and 1718 Panel of
  Experts reports from 2018 onward, which document DPRK
  cryptocurrency-exchange attacks as a sanctions-evasion vector).
  2371 is admitted here as the foundational 2017 financial-
  sanctions resolution whose expanded financial-institution
  definition supplies the legal scaffolding subsequently used by
  the 1718 Sanctions Committee to frame DPRK crypto-laundering
  as sanctions-evasion. Per CLAUDE.md §1 (Think Before Coding),
  this conservative framing is preferred over the brief's stronger
  claim; human auditor should adjudicate before release.

  Per §5 codebook trigger.type=non_us_sanctions maps to
  research_stratum=S6_supranational; the actor is the UN Security
  Council. Per §6 codebook the temporal_tier is
  comparable_main_2017_present and the canonical analysis_use is
  comparable_analysis. Per §7 codebook the enumeration is `subset`
  with the class-level rationale documented in
  target.enumeration_note (UNSC framework resolution; no
  cryptocurrency-address enumeration in 2371 itself). Per §3
  codebook the empirical_shape is null_event: 0 observed_change
  layers directly attributable to the 2017-08-05 adoption date;
  downstream cascades (2018+ Panel of Experts crypto-evasion
  framing; OFAC Lazarus / APT38 SDN designations 2019/2020/2025)
  are tracked as separate child events. Per §4 codebook
  admission_tier=null_case (0 strong-attribution observed_change
  layers).

  Per §1.1 codebook, the single coverage_gap row uses
  attribution=`none` because observation_kind=`coverage_gap` (no
  direct per-event observed_change at the corpus's resolution).
  This event functions as the foundational 2017 anchor for the
  DPRK / Lazarus crypto-sanctions track and as a temporal landmark
  for the 2017-2025 sequence of DPRK-related crypto enforcement.
  DRYRUN: archival anchors asserted but not personally verified
  by the LLM agent; human auditor must pin real Wayback /
  body_hash anchors before release.

