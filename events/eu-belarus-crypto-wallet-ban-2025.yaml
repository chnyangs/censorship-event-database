analysis_notes: |
  Admitted 2026-06-09. EU Regulation 2025/392 Article 1u prohibits providing
  crypto-asset wallet, account, and custody services to Belarusian nationals,
  residents, and entities (effective 2025-03-26, one month after adoption). The
  primary_legal EUR-Lex ELI/OJ source is body_hash-pinned with verbatim Article
  1u text; the offramp_cex observed_change is attribution=direct. Distinct from
  eu-belarus-crypto-services-ban-2022 (Reg 2022/398). origin agent_draft ->
  human_reviewed via LLM adjudication + maintainer oversight (not
  independent-human IRR).
scoped_claim: |
  "EU Regulation 2025/392 Article 1u (effective 2025-03-26) banned crypto
  wallet/account/custody services for Belarusians; an off-ramp service
  restriction (direct, primary_legal)."
