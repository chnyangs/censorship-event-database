      utility-tokens-outside-securities-scope, the guidelines
      indirectly shape Swiss CEX listing eligibility and
      anti-money-laundering due-diligence obligations for Swiss
      VASPs handling ICO tokens. However, no point-in-time Swiss
      CEX delisting or listing-rail change is bundled with the
      2018-02-16 release itself, and no observation row is coded
