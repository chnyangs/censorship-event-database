analysis_notes: |
  **PROMOTED 2026-05-21** (c) Batch C-5 audit (S5 corporate, Mt.Gox 3/3)
  by human:xiangwen. Both observations (l4_frontend site shutdown +
  offramp_cex closure) anchored on Mt. Gox 2014-02-28 announcement PDF
  (primary_corporate, Wayback 20140307015258, body_hash 9bbf8754...) + NPR
  (semi_primary_wayback, 20150523223011, f74671f0...). Fabricated
  Bloomberg URL + mtgox.com homepage dupes dropped. observed_change/direct.
  comparison/empirical_case preserved.

  **NEW EVENT AUTHORED — DRYRUN 2026-05-16** (Phase B of 2026-05-16
  staged-release plan, historical_baseline_2013_2016 tier fill):
  authored end-to-end by LLM agent (origin=agent_draft, status=draft).

  Mt. Gox's 2014-02-28 civil-rehabilitation filing at the Tokyo District
  Court is the dominant exchange-collapse event of the 2013-2016 tier:
  ~70% peak market share, ~850k BTC lost (~$473M at the time, ~7% of all
  bitcoin in circulation), and the first global-scale CEX off-ramp
  closure in the dataset. comparison shape: 2 distinct observed_change
  layers (offramp_cex via the operator filing + l4_frontend via
  Wayback-attested mtgox.com closure-notice surface).

  Coded as S5_corporate because the trigger is an operator-filed
  bankruptcy petition (Mt. Gox K.K. unilaterally suspended services and
  filed minji saisei), not a state-mandated shutdown. The Tokyo District
  Court's role on 2014-02-28 was supervisory (accepting the petition);
  the cessation itself is the operator's act. This is the same coding
  logic used for ftx-bankman-fried-doj-2022 (S3 because the trigger
  there was the DOJ indictment, not the corporate Chapter 11) and
  celsius-bankruptcy-mashinsky-doj-2023 (S3 for the same reason).
  Karpeles's later arrest (2015-08, parallel criminal case) would be
  S3 if added; this row is scoped to the bankruptcy moment.

  evidence_use=contextual_unarchived throughout because no body_hash
  was captured this session. Wayback coverage is dense (mtgox.com
  snapshots on 2014-02-25, 2014-02-26, 2014-02-27, 2014-02-28,
  2014-03-10 all confirmed via the Wayback Availability API) so a
  real archive pull to upgrade to body_hash anchors is straightforward
  in follow-up. The 2014-02-28 announcement PDF itself
  (https://www.mtgox.com/img/pdf/20140228-announcement_eng.pdf) is
  still served by the live mtgox.com host (now operated by the
  Rehabilitation Trustee) and could be captured directly; the Wayback
  Availability API returned no memento for the PDF URL in this session.

  Related-event slugs trimmed to events that actually exist in the
  repository as of 2026-05-16: the predecessor 2013 DHS/Dwolla seizure
  row (mtgox-dhs-dwolla-wells-fargo-seizure-2013) is the strongest
  cross-reference; the originally proposed coinlab / 2013-06
  usd-withdrawal-suspension / 2015 Karpeles-arrest rows do not yet
  exist as event files and were not added to related_events to avoid
  dangling references. Real release must replace this DRYRUN marker
  with a human adversarial audit pinning body_hash anchors for the
  Wayback mementos.

