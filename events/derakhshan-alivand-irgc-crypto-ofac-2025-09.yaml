  (rendered+grepped: cryptocurrency + crypto + wallet present). Specific identifiers not in the press release (literal
  address / exact coin / count) were re-attributed to the SDN-list entry rather than asserted as
  captured facts. primary_legal source -> meets admission floor; null_case coding unchanged.).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1;
  sources verified+captured, awaiting human admission). OFAC SDN
  designation 2025-09-16 (Treasury sb0248) of an Iranian shadow-banking /
  financial-facilitator network — Alireza Derakhshan, Arash Estaki
  Alivand, and Hong Kong / UAE front companies — for coordinating
  crypto (largely USDT) funds transfers benefiting the IRGC-QF and
  MODAFL. In-scope per §9 INCLUDE (OFAC SDN designation). Coded
  null_event / null_case per the S1 convention (cf.
  bitriver-russia-mining-ofac-2022-04): the designation is the trigger,
  but no per-address on-chain freeze tx_hash and no per-event CEX
  cascade were pinned in this draft authoring pass, so the measurable
  cross-layer surface is limited (offramp_cex observed_no_change /
  none). The USDT-issuer freeze response is the natural asset-layer
  experiment, deferred per codebook §1.6 for drafts. Primary source
  verified + captured 2026-05-31 (Treasury sb0248, body_hash-pinned; no
  fabrication). Conservative coding per codebook §8.4 pending human
  review.

