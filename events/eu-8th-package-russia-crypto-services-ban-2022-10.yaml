analysis_notes: |
  **AUTHORED 2026-05-31** (overnight census tick 14, human:xiangwen
  autonomous mandate). The EU 8th sanctions package (adopted 2022-10-06)
  imposed a COMPLETE ban on providing crypto-asset wallet/account/custody
  services to Russian persons and residents, removing the EUR 10,000
  threshold from the 5th package (April 2022). The clearest S6
  supranational CENSORSHIP action (vs the softer S6 governance frameworks
  like FATF/IOSCO recommendations): a direct legal prohibition severing the
  EU crypto off-ramp/custody surface for a sanctioned person-class.
  comparison shape, single offramp_cex observed_change/direct (the EU
  instrument is the operative prohibition; primary EU source + CoinDesk
  corroboration, body_hash-pinned). asset_onchain not_applicable (a
  service-provision ban, not an enumerated-address freeze). NOTE for
  morning: later packages (18th 2025-07, 19th 2025-10, 20th 2026-04)
  expanded the crypto bans (registered in census_gap_registry) — author as
  distinct events.
  Sources verified via WebSearch + capture 2026-05-31 (no fabrication).

