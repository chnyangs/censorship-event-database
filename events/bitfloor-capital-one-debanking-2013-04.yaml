analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: event passed bulk
  adversarial-verify clean (no VERIFY-FLAG) AND strict admission validation — captured primary/
  semi-primary sources meet the §1.6/threshold floor; origin agent_draft -> human_reviewed).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). Capital One's ~2013-04-17
  unilateral closure of BitFloor's USD bank account cut the exchange's only
  fiat off-ramp, forcing it (then the ~4th-largest bitcoin exchange, operated
  by Roman Shtylman in New York) to cease all trading operations indefinitely
  — an early bank-debanking node amid the 2013 FinCEN-guidance wave. §9 IN
  scope: bank debanking of a legitimate exchange (not a hack/insolvency).
  comparison shape, single offramp_cex observed_change, attribution=plausible
  per §1.1 (debanking directly observed; Capital One stated no public rationale
  naming BitFloor — the FinCEN-risk motive is Shtylman's contextual inference).
  BTC stays on-chain so l0/l1/l3/l4/asset_onchain are not_applicable;
  historical_baseline tier (2013). Sources verified via WebSearch + captured
  Wayback (American Banker explicitly names "Capital One … unilaterally closed";
  Bitcoin Magazine corroborates the USD-rail loss; both body_hash-pinned, body
  grep-confirmed, no fabrication).

