analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-17** (Phase E/F non_us_state
  cohort; lean run): authored by LLM agent without personally verifying
  Wayback/body_hash; status=draft and origin=agent_draft. Real release
