  Comparison documenting Japan FSA's 2018-03-23 public warning to
  Binance (Hong Kong-domiciled at the time) for operating a crypto-asset
  exchange business targeted at Japanese residents without Payment
  Services Act registration. First major FSA enforcement against an
  offshore (non-registered) crypto exchange post-Coincheck, and a
  formative case for how Japan's registered-VASP regime addresses
  unregistered cross-border exchange access. Binance's public response
  (CEO Changpeng Zhao confirming receipt of the warning, lawyers
  contacting JFSA, and announcement of a Malta headquarters relocation
  in the same month) is the direct-attribution operator-side compliance
  response.

  Codebook compliance:
  - trigger.type=regulatory_enforcement per §5.1 (JP_FSA is a non-US
    national regulator and the action is administrative under the
    Payment Services Act, not a network/payment-rail block).
  - research_stratum=S4_nation_state per §5.2 stratum-actor map.
  - target.kind=entity, target.enumeration=subset per §7 (Binance is the
    single named addressee; the 2018-06-22 six-exchange orders are
    tracked separately as japan-fsa-six-exchange-orders-2018-06).
  - analysis_use=comparable_analysis per §6 (temporal_tier
    comparable_main_2017_present).
  - empirical_shape=comparison per §3 (one observed_change layer:
    offramp_cex).
  - admission_tier=empirical_case per §4 (one observed_change layer with
    direct attribution).
  - attribution=direct on offramp_cex per §1.4 frontend/CEX rule: the
    operator (Binance) publicly cites the trigger (FSA warning) via the
    CEO's public statement AND implements the JP-resident access
    wind-down / HQ relocation within the ≤7-day compliance window.

  Paper-relevant contrast vs sibling Coincheck case
  (japan-fsa-coincheck-orders-2018): both are JP_FSA Payment Services
  Act supervisory actions on the offramp_cex axis, but the Coincheck
  case is reactive single-entity supervision over a registered (deemed)
  Japanese VASP triggered by a security failure (NEM hack), with a
  ~5-month withdrawal freeze as the load-bearing change; the Binance
  case is enforcement against an unregistered offshore exchange,
  triggering exit from the Japanese market and HQ relocation to Malta
  rather than a withdrawal freeze for existing customers. The pair
  spans the two main archetypes of FSA Payment Services Act enforcement
  (registered-VASP supervision vs unregistered-exchange warning).

  Paper-relevant contrast vs sibling six-exchange orders case
  (japan-fsa-six-exchange-orders-2018-06): the 2018-06-22 six-exchange
  business-improvement orders are class-wide registered-VASP
  supervision (six named registered exchanges), whereas the 2018-03-23
  Binance warning is single-entity unregistered-exchange enforcement.
  The trio (Coincheck 2018-01, Binance 2018-03, six-exchange 2018-06)
  collectively documents the 2018 FSA enforcement cascade
  post-NEM-hack across both registered and unregistered VASPs.

  DRYRUN caveats: trigger primary citation (FSA press-release index) is
  asserted with a 2018-calendar-folder Wayback pointer; pinned snapshot
  timestamp and body_hash capture for the specific 2018-03-23 release
  permalink are deferred to the human-audit pass. For non-DRYRUN
  release, capture body_hash + body_path for: (1) the FSA's 2018-03-23
  warning release page (Japanese original and any English translation),
  (2) Binance's public announcement of the Malta relocation, (3) CEO
  Changpeng Zhao's contemporaneous public statement (Twitter/blog), (4)
  any Binance.com announcement deprecating Japanese-resident user
  onboarding. Marked evidence_use=contextual_unarchived on all citations
  to flag the unarchived state per validator policy.

scoped_claim: |
  "Japan FSA's 2018-03-23 public warning to Binance under the Payment
  Services Act for operating a crypto-asset exchange business targeted
  at Japanese residents without registration directly compelled
  Binance's operator-side exit from the Japanese market and relocation
  of its headquarters from Tokyo to Malta in March 2018. The row does
  not claim frontend-disable, ISP/DNS-level connectivity blocking of
  binance.com from Japan, on-chain asset-layer freeze, or any
  customer-funds freeze — only the single-entity Binance-cohort
  offramp_cex load-bearing axis of JP-resident-access deprecation and
  HQ relocation under the Payment Services Act registration regime."

