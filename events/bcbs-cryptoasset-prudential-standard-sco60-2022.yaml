      The standard penalises bank EXPOSURE to a defined cryptoasset class via
      capital charges; it does not itself freeze specific on-chain
      assets/addresses (no enumerated addresses; no issuer freeze tx).
  - layer: offramp_cex
    status: measured
    scope: [internationally_active_banks_holding_group2_cryptoassets]
    note: |
      Load-bearing layer. The Group 2 prudential treatment (1250% risk weight
      = full capital deduction, plus a 1%-of-Tier-1 aggregate exposure cap)
      makes it economically prohibitive for internationally-active banks to
      hold or provide banking services against unbacked cryptoassets,
      constricting the bank/off-ramp surface for the penalised asset class.
      §9 borderline rule: included because the BCBS standard directly mandates
      a punitive capital restriction (not a mere recommendation).

