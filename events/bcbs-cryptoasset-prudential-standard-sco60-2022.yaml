analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: event passed bulk
  adversarial-verify clean (no VERIFY-FLAG) AND strict admission validation — captured primary/
  semi-primary sources meet the §1.6/threshold floor; origin agent_draft -> human_reviewed).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission). The Basel Committee on
  Banking Supervision finalised its standard "Prudential treatment of
  cryptoasset exposures" (d545, consolidated as SCO60) on 2022-12-16,
  endorsed by GHOS. Group 2 cryptoassets (unbacked cryptoassets and
  stablecoins with ineffective stabilisation mechanisms) receive a 1250%
  risk weight (equivalent to full capital deduction) and are subject to an
  aggregate exposure limit of 1% of a bank's Tier 1 capital; implementation
  was requested by 1 January 2025. Under §9's borderline rule for
  supranational governance frameworks, this is INCLUDED (not context-only)
  because the standard directly MANDATES a punitive capital restriction —
  the canonical "BCBS punitive capital weights that force debanking" example
  cited in §9 — as opposed to the soft FATF/FSB/IOSCO recommendations and
  consumer warnings that remain out of scope. comparison shape, single
  offramp_cex observed_change with attribution=plausible (the standard
  mandates the capital framework supranationally; binding exposure
  restriction is mediated through national implementation). asset_onchain
  not_applicable (a bank-capital prudential charge on an exposure class, not
  an enumerated-address freeze). Anti-fabrication: every claimed figure
  (1250% / 1% Tier 1 / Group 2 / unbacked) is grep-confirmed present in the
  captured d545 PDF; date/actor/implementation-date confirmed in the
  captured BIS press release. Sources verified via WebSearch + capture
  2026-05-31 (no fabrication).

scoped_claim: |
  "The BCBS final cryptoasset prudential standard (d545/SCO60, 2022-12-16)
  imposed a 1250% risk weight and a 1%-of-Tier-1-capital exposure cap on
  Group 2 (unbacked) cryptoassets for internationally-active banks,
  economically constricting the bank/off-ramp surface for the penalised
  asset class; single-layer offramp_cex observed_change with
  attribution=plausible."

