target:
  kind: entity
  enumeration: subset
  enumeration_note: |
    Mt. Gox North American user-facing operations (USD on/off-ramp,
    customer service for US/Canada users). The CoinLab suit
    challenged Mt. Gox's failure to delegate these operations to
    CoinLab under the November 2012 partnership agreement that
    granted CoinLab the exclusive right to handle North American
    bitcoin-exchange services. No on-chain BTC addresses are
    enumerated at this event level; the action is a private civil
    breach-of-contract dispute, not an asset freeze.
  entity: Mt. Gox K.K.
  actor_type: exchange
  actor_name: Mt. Gox K.K.
  chains: [bitcoin]
  canonical_domains:
    - mtgox.com

jurisdiction: [US]

coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      mtgox.com remained reachable as a website; the 2013-05-02 civil
      complaint did not implicate ISP-level reachability. Standard
      public-web L0 instruments (Censored Planet, OONI) do not apply.
  - layer: l1_consensus
    status: not_applicable
    chain: bitcoin
    note: |
      Bitcoin proof-of-work consensus in 2013 has no protocol-level
      relay-filter primitive analogous to the post-Merge Ethereum PBS
      relay surface. not_applicable on construct-did-not-exist
      grounds.
  - layer: l3_rpc
    status: not_applicable
    chain: bitcoin
    note: |
      The MEV-Boost / Flashbots Protect / MEV-Blocker public-RPC
      compliance substrate that the L3 layer measures did not exist
      in 2013; Flashbots Protect launched 2022-11.
      not_applicable on construct-did-not-exist grounds.
  - layer: l4_frontend
    status: not_applicable
    note: |
      mtgox.com continued to serve trading-platform pages through
      May 2013; no frontend takedown or domain seizure was associated
      with the 2013-05-02 civil complaint. Frontend-enforcement
      layer not implicated.
  - layer: asset_onchain
    status: not_applicable
    chain: bitcoin
    note: |
      Bitcoin native asset has no issuer-side blacklist / freeze
      admin method. The civil suit operated on contract-damages claims
      against Mt. Gox K.K. in US federal court, not on on-chain BTC.
      not_applicable on construct-did-not-exist grounds.
  - layer: offramp_cex
    status: partially_measured
    scope:
      - mtgox_us_operations
    note: |
      The civil suit itself did not directly close any Mt. Gox
      on/off-ramp — it sought damages for breach of contract. The
      suit coincided with the broader Mt. Gox USD-withdrawal cascade
      (Dwolla seizure 2013-05-14, USD withdrawal suspension
      2013-06-20), but those layer changes are attributable to the
      parallel federal Dwolla/Wells Fargo seizure twelve days later,
      not to the civil suit directly. partially_measured because
      contemporaneous press coverage establishes that no offramp
      change followed the 2013-05-02 filing itself within the
      14-day pre-Dwolla-seizure window; the observed_no_change row
      is anchored on supporting_journalism without a captured
      body_hash this session.

