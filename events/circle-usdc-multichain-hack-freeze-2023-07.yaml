  named address prefixes in block 17643245, yielding the full addresses and
  three primary_onchain tx hashes:
  0x5a6ccaebe4e97298e27a40d8dd3fc59661935694c7a96b28c0de1165a725d3fc
  (0x48BeA...), 0xed97f73fc7c1ae7679b1572b08f16c422445e8ca575c643bd8c9c0ea3e1ad69b
  (0xefEeF...), and 0xd568f3d01f052050efa2b6a0cedf89dd01f9597b6d9972be18996f9a5f5751c5
  (0x027F1...). The event remains status=draft because origin=agent_draft
