analysis_notes: |
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 3; sources
  verified+captured, awaiting human admission). Orca (Solana's leading DEX)
  announced 2023-03-16 it would add the United States to its restricted
  regions for orca.so trading effective 2023-03-31, blocking US users from
  trading via its web front end (while leaving direct smart-contract / SDK
  access and liquidity provision available), amid the rising US regulatory
  crackdown. S5 corporate-policy frontend geofence in the same 2023 cohort
  as uniswap-frontend-delisting-2023.

  comparison shape: 1 observed_change layer (l4_frontend) with
  attribution=plausible. attribution held at plausible (not direct)
  because the captured anchor is semi-primary trade press and the article
  states Orca gave no explicit reason — the US-regulatory motive is
  contextual. offramp_cex is not_applicable: orca.so is a non-custodial
  Solana DEX frontend, not a CEX off-ramp, so the effect is carried at
  l4_frontend. l0/l1/l3/asset_onchain not_applicable. Source verified via
  WebSearch + capture 2026-05-31 (CoinDesk, body_hash-pinned;
  grep-confirmed "United States" / "restricted" / "March 31" / "orca.so";
  no fabrication).

  Codebook decisions applied:
  - trigger.type=corporate_policy_change per §5.1 (frontend operator
    self-initiated geofence) -> research_stratum=S5_corporate.
  - attribution=plausible on l4_frontend per §1.4 (no primary provider
    notice pinned; no explicit stated reason).
  - layer=l4_frontend (not offramp_cex): non-custodial DEX frontend, not
    a CEX off-ramp.
  - target.enumeration=subset per §7 (US-located user cohort).
  - empirical_shape=comparison per §3; admission_tier=empirical_case
    per §4.

scoped_claim: |
  "Orca on 2023-03-16 announced it would add the United States to its
  orca.so restricted regions effective 2023-03-31, blocking US users from
  trading via its web front end (direct contract / SDK access retained) amid
  the US regulatory crackdown — a 1-layer l4_frontend observed_change
  (attribution=plausible; Orca stated no explicit reason). An S5
  corporate-policy frontend geofence in the same 2023 cohort as the Uniswap
  frontend token delisting (uniswap-frontend-delisting-2023)."

