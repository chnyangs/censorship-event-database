coverage:
  - layer: l0_network
    status: not_applicable
    note: |
      The retained public claim is not an ISP/DNS/national-firewall block.
      Cryptex is modeled here as an OFAC exchange designation with measured
      L4 domain seizure, issuer blacklist, and L1 aggregate-relay null
      observations. A prior OONI query across cryptex.net for
      2024-08-26..2024-10-26 returned no public measurements, but that
      absence is not used as a claim-bearing L0 observation because no L0
      censorship action is asserted.
  - layer: l1_consensus
    status: measured
    chain: ethereum
    note: |
      Wahrstätter relay_censorship_share.csv covers 2024-09-26 at daily granularity. Slice
      [2024-09-12, 2024-10-10]: pre-event 14d mean 55.76% ± 1.76, event-day 53.95%, post-event
      14d mean 53.48% ± 0.68. Relay-share was stable; no step change tied to the Cryptex
      designation. Attached as observed_no_change below. The Cryptex ETH address is a single
      wallet on a single chain — individual-wallet sanctions of a non-protocol target are not
      expected to move the aggregate relay share.
  - layer: l3_rpc
    status: not_measured
    provider_scope: public_only
    note: |
      No pinned MEV-Blocker / OFAC-compliant RPC filter-list snapshot,
      provider docs/status change, or replayable rejection bracketing
      2024-09-26 is attached. Public RPC substrate snapshots are treated
      as background context, not event-specific L3 measurement coverage.
  - layer: l4_frontend
    status: measured
    scope:
      - cryptex.net
    note: |
      Canonical cryptex.net domain was seized by US Secret Service on event day 2024-09-26 at
      ≈16:05 UTC. Wayback CDX shows 403 Forbidden on the HTTPS origin at 16:05 event day
      (multiple captures, no single stable seizure-banner digest), then a stable 200 OK small
      page starting 2024-09-30 containing the USSS seizure notice. Attached as observed_change
      with direct attribution (seizure notice names the legal instrument — District of Maryland
      seizure warrant under DOJ CCIPS + USSS + NL FIOD + DE BKA Operation Endgame).
  - layer: asset_onchain
    status: measured
    chain: ethereum
    note: |
      Cryptex ETH address 0x0931cA4D13BB4ba75D9B7132AB690265D749a5E7 blacklisted by both
      USDT (Tether) and USDC (Circle) per usdtbanlist.com community tracker:
      - Tether USDT blacklist on 2024-09-26 03:37 UTC (tx 55c457da...64b815)
      - Circle USDC blacklist on 2024-09-27 03:00 UTC (tx a10d4e1a...ffd8da)
      The listed TRX address TTUDyVhhpCC1xJoPmWzdjLAzeoPwbSABdr also has a
      Tether USDT-TRC20 addBlackList transaction on 2024-09-26 03:35 UTC
      (tx dad0d1da...21cad9), attached as a separate observed_change row.
      Notable: Tether froze earlier the same day as the OFAC designation, preceding even the
      USSS domain seizure (event day 16:05 UTC). BTC/LTC and any non-stablecoin
      address effects are not measured in this release.
  - layer: offramp_cex
    status: not_applicable
    note: |
      Cryptex was itself an exchange, so the "off-ramp CEX" framing inverts — the layer of
      interest would be whether counterparty CEXes blocked deposits or
      withdrawals to Cryptex-labelled clusters. No such counterparty-CEX
      artifact is attached or claimed, and the retained public claim is
      scoped to direct government seizure plus issuer-side blacklist
      observations.

