analysis_notes: |
  **SOURCE/COVERAGE REPAIRED 2026-06-02** (quality-loop scope repair):
  verified the existing OFAC Recent Actions, cryptex.net seizure banner,
  usdtbanlist, and on-chain blacklist anchors; marked the row primary-source
  verified; and narrowed non-load-bearing L0/offramp coverage. The row keeps
  L3 as honestly not_measured because no replayable per-provider RPC
  rejection/filter-list bracketing is attached.

  comparison documenting the 2024-09-26 coordinated action against the Russian
  virtual-currency exchange Cryptex (OFAC SDN designation) and co-occurring US Secret Service
  seizure of cryptex.net under a Maryland district court warrant (Operation Endgame, with
  Netherlands Police / FIOD and German BKA participation). This event has the cleanest L4
  observed_change in the dataset so far — a same-day, direct-attribution domain seizure with a
  primary_legal banner as the archival anchor.

  The L4 seizure shape here is structurally different from prior cases: Tornado 2022 frontend
  disruption was compliance-driven (hosting / CDN providers acting to avoid OFAC exposure),
  whereas Cryptex was direct government seizure of the domain via a judicial warrant. Both
  produce L4 observed_change but through different mechanisms.

  L1 shows the expected null (single-wallet, cross-chain exchange designation does not shift
  aggregate Ethereum relay filtering).

  Follow-up directions (post-admission): (1) direct explorer replay for BTC/LTC address-side
  effects if a stablecoin/issuer mechanism is identified; (2) pinned MEV-Blocker /
  OFAC-compliant RPC filter-list snapshot bracketing event date; (3) follow-up archival of
  any coordinated FinCEN / USSS / DOJ press releases beyond the Treasury headline piece.

scoped_claim: |
  "OFAC designation of the Cryptex Russian exchange on 2024-09-26
  co-occurred (same-day) with a US Secret Service judicial seizure of the canonical cryptex.net
  domain (L4 observed_change, direct attribution) and same-day Tether blacklist transactions
  touching the listed ETH/TRX addresses, while producing no measurable step change in
  Ethereum aggregate OFAC-compliant relay share (L1 null at day granularity). This release
  does not claim an ISP/DNS block, RPC-provider filtering, or counterparty-CEX reaction."

scoped_knowledge: |
  What changed: Cryptex combines a same-day L4 domain seizure banner with
  same-day stablecoin issuer blacklisting for the listed ETH/TRX addresses.
  The frontend evidence is the seized cryptex.net page; the asset evidence is
  anchored in issuer blacklist transactions and local capture bundles.

  What did not change or could not be measured: L1 carries an aggregate
  relay-share null at day granularity. L3 has no per-provider rejection
  bracketing or filter-list snapshot attached, so no Cryptex-specific RPC
  cascade is claimed. Counterparty CEX behavior is outside the retained
  claim until a per-event exchange or chain-analytics artifact is pinned.

  Attribution: the L4 seizure is direct because the seizure banner is itself a
  legal notice naming the warranting authorities. The asset-layer issuer action
  is direct where on-chain blacklist receipts touch the listed addresses. The
  L1 row is `observed_no_change` with attribution `none`.

  Comparative value: Cryptex is the cleanest direct government-seizure L4
  mechanism in the corpus. It differs from Tornado 2022 compliance-driven
  frontend disruption and from Chatex operator self-compliance.

