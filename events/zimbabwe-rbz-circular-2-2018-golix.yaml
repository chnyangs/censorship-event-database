  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 1; sources verified+captured,
  awaiting human admission). Reserve Bank of Zimbabwe Circular No. 2/2018 (2018-05-11)
  ordered all banking institutions to stop servicing cryptocurrency exchanges, naming
  Golix (Bitfinance Pvt Ltd) and Styx24, with a 60-day wind-down. This is a nation-state
  banking-rail severance directly analogous to the Nigeria CBN 2021 and India RBI 2018
  cut-offs (sibling S4 events). attribution=direct under §1.5 reasoning analogue: the
  blocking authority's own order names the targets and mandates the severance.
  Subsequently provisionally suspended by the Harare High Court (Golix v RBZ, 2018-05-24),
  but the order was effective on issue; the later court suspension is downstream context.
  Coded offramp_cex (banking-channel severance), not l0_network (no ISP/DNS block alleged).

scoped_claim: |
  "RBZ Circular 2/2018 of 2018-05-11 ordered Zimbabwean banks to cease servicing
  cryptocurrency exchanges (named: Golix, Styx24) within 60 days, severing banking rails
  for the domestic crypto off-ramp surface. Effect carried at offramp_cex; later
  provisionally suspended by the Harare High Court."

