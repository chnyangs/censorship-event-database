analysis_notes: |
  **SCOPE RULING 2026-05-31 (automation, user-delegated):** keep the
  corpus boundary strict at 2007-01-01. This 2006-07-27 GoldAge case is
  a real, well-sourced pre-Bitcoin digital-currency enforcement precursor,
  but it is outside the declared since-2007 frame and should not be admitted
  unless a future release explicitly adds a pre-2007 temporal tier. Status is
  `rejected` as out-of-frame provenance; `origin=agent_draft` is retained
  because no human admission/audit is claimed.
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2;
  sources verified+captured, awaiting human admission). The 2006-07-27
  New York County District Attorney indictment (and subsequent
  conviction) of Arthur Budovsky and Vladimir Kats for operating
  GoldAge, Inc. — an early independent third-party digital-currency
  exchanger for e-gold/e-Bullion/1mdc — as an unlicensed money-
  transmitting business is the earliest U.S. enforcement in the
  pre-Bitcoin digital-currency lineage that directly produced Liberty
  Reserve (Budovsky relocated to Costa Rica after the GoldAge
  conviction). §9 IN SCOPE: a named state prosecution that shut a
  legitimate digital-currency exchange operator (not a scam/Ponzi). One
  observed_change layer (offramp_cex service termination),
  attribution=direct. comparison shape / empirical_case tier /
  discovery_only_2007_2012 (earliest discovery-period bucket; 2006
  precedes the corpus's earliest tier boundary). L0/L1/L3/l4/
  asset_onchain not_applicable: GoldAge was a centralized off-ledger
  digital-currency exchanger and the enforcement was a criminal
  prosecution of the operators, not a network/domain/on-chain
  instrument. Sources verified via WebSearch 2026-05-31; DOJ SDNY plea
  release (carries the verbatim GoldAge-conviction sentence) + Wikipedia
  Gold Age article captured + body_hash-pinned (no fabrication; no
  on-chain addresses asserted).

