analysis_notes: |
  **SOURCE REPAIR 2026-06-01**. EUR-Lex Regulation 2022/1904 was captured
  locally and pinned with body_hash/body_path. The retained observation is
  scoped to the regulation-created EU operator obligation at the
  offramp_cex / custody-account layer. Earlier language implying verified
  named-CASP implementation within days/weeks was narrowed because those
  downstream CASP notices are not pinned in this row. This source-repair
  note is not a last_human_audit claim.

  S6_supranational empirical_case anchored on the 2022-10-06 EU Council
  Regulation 2022/1904 (eighth sanctions package against Russia)
  amendment of Article 5b of Regulation 833/2014. The 8th-package
  amendment removed the prior EUR 10,000 per-person threshold (set by
  the 5th-package Regulation 2022/576) and imposed a FULL prohibition on
  EU operators providing crypto-asset wallets, accounts, or custody
  services to Russian nationals, residents, or Russian-established
  entities.

  This event is the direct middle-temporal sibling of the already-admitted
  eu-russia-crypto-wallet-cap-2022 (5th-package 2022-04-08 EUR 10K cap)
  and eu-12th-russia-sanctions-2023 (12th-package 2023-12-18 Article 5aa
  full-prohibition extension). Together the trio (5th 2022-04 cap, 8th
  2022-10 full ban, 12th 2023-12 full prohibition extension) is the
  canonical EU Russia-sanctions crypto-services tightening sequence in
  the dataset. The 8th-package full ban is the threshold-removal step:
  it converts the previously calibrated EUR 10K user-class threshold into
  an unqualified class prohibition, and is the structural pivot between
  the 5th-package threshold mode and the 12th-package consolidated
  full-prohibition mode.

  Substantive findings:
  - Council Regulation (EU) 2022/1904 of 2022-10-06 amended Article 5b
    of Regulation 833/2014.
  - Article 5b (post-amendment): EU operators prohibited from providing
    crypto-asset wallets / accounts / custody services to Russian
    nationals, Russian residents, or legal persons / entities / bodies
    established in Russia, with NO value threshold (full ban; EUR 10K
    cap removed).
  - Observed change: Article 5b removed the EUR 10K threshold and created
    an unqualified EU operator prohibition on providing crypto-asset
    wallets / accounts / custody services to the covered Russian user
    class.
  - Full-ban regime continued through 2023-12-18 when Regulation
    2023/2878 (12th package) restated and extended the prohibition via
    Article 5aa; observation window closes there.

  Why empirical_case rather than anchor_case: only the legal
  offramp_cex/custody-account obligation is admitted as observed_change
  in this pass. L4 frontend reactions at EU CASP notice surfaces remain
  not_measured until a separate Wayback-capture pass pins named-CASP
  notices in the 2022-10 to 2023-12 window.

  Why L0/L1/L3/asset_onchain are not_applicable: the amended Article 5b
  is an EU operator-policy obligation on CASPs at the custody/account
  layer; it does not engage ISP / consensus-relay / public-RPC /
  token-issuer primitives. This treatment is consistent with the sibling
  eu-russia-crypto-wallet-cap-2022 and eu-12th-russia-sanctions-2023
  layer-applicability reasoning.

scoped_claim: |
  "EU Council Regulation 2022/1904 of 2022-10-06 (eighth sanctions
  package) amended Article 5b of Regulation 833/2014 to remove the
  prior EUR 10,000 per-person threshold (5th-package Regulation
  2022/576) and impose a FULL prohibition on EU operators providing
  crypto-asset wallets, accounts, or custody services to Russian
  nationals / residents / Russian-established entities. The load-bearing
  observation is the regulation-created EU CASP custody/account
  obligation at the offramp_cex layer; named-CASP frontend or
  account-closure implementation remains out of scope until separately
  pinned. The full-ban regime continued through the 12th-package
  Regulation 2023/2878 (2023-12-18) Article 5aa extension."

scoped_knowledge: |
  This event is the middle pivot of the EU retail-user-class crypto
  sanctions sequence: 5th-package EUR 10K cap (2022-04, admitted
  eu-russia-crypto-wallet-cap-2022), 8th-package full ban (2022-10,
  this event), 12th-package Article 5aa amendment (2023-12, admitted
  eu-12th-russia-sanctions-2023). The 8th-package amendment is the
  threshold-removal step that converts the calibrated EUR 10K
  class-threshold regime into an unqualified class-prohibition regime
  for Russian users of EU CASPs. The observable signal retained here is
  the offramp_cex/custody-account legal obligation; no on-chain address
  enumeration exists and no public-RPC / consensus-relay primitive is
  engaged. The 5th/8th/12th-package sequence collectively gives a
  within-jurisdiction longitudinal anchor for class-based EU crypto
  sanctions tightening from 2022 through 2023.

