  null_event documenting the G7 Hiroshima Leaders' Communiqué (issued
  2023-05-20 at the G7 Hiroshima Summit, Japan, 19-21 May 2023). The
  communiqué contains crypto-asset regulation paragraphs endorsing
  (i) accelerated global implementation of FATF Standards on virtual
  assets including the Travel Rule, and (ii) the OECD Crypto-Asset
  Reporting Framework (CARF) for tax transparency. Foundational G7-
  level policy statement coordinating high-income jurisdiction
  approaches and laying groundwork for the September 2023 G20
  endorsement (g20-roadmap-crypto-asset-policy-2023).

  Per §5 codebook trigger.type=supranational_regulation maps to
  research_stratum=S6_supranational; the actor is G7 (a supranational
  coordination forum). Per §6 codebook the temporal_tier is
  comparable_main_2017_present and the canonical analysis_use is
  comparable_analysis. Per §7 codebook the enumeration is `subset`
  with the class-level rationale documented in target.enumeration_note
  (G7 coordination operates at the international-standards layer;
  binding force is via FATF / OECD / FSB standard-setter work programs
  and national implementation). Per §3 codebook the empirical_shape is
  null_event: 0 observed_change layers directly attributable to the
  2023-05-20 communiqué date; downstream cascades (FATF 2023 targeted
  update, OECD CARF national adoption, G20 2023 roadmap, national
  implementations) are tracked as separate child events. Per §4
  codebook admission_tier=null_case (0 strong-attribution
  observed_change layers).

  Per §1.1 codebook, the single off-ramp row uses attribution=`none`
  because observation_kind=`coverage_gap` (no direct per-event
  observed_change at the corpus's resolution). This event functions
  as a parent / coordination-layer anchor for the 2023 G7 supranational
  endorsement of the FATF Travel Rule and OECD CARF and as a temporal
  landmark for the 2023 wave of G7-coordinated crypto-asset policy
  work culminating in the G20 New Delhi endorsement. Archival anchors
  pinned 2026-05-21 (Wayback raw-resource memento).

