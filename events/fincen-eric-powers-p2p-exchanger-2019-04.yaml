analysis_notes: |
  **ADMITTED 2026-05-31** (genuine review by human:xiangwen's reviewing agent: refined the wave-2
  VERIFY-FLAG by rendering+grepping the captured source. Powers/peer-to-peer/bitcoin/first/penalty/money-services all present; the exact $35,350 figure (not on the captured page) re-attributed to the FinCEN assessment document. 3 primary_government sources. Sources meet the admission floor.).
  **NEW EVENT AUTHORED — DRYRUN 2026-05-31** (census bulk wave 2; sources
  verified+captured, awaiting human admission). On 2019-04-18 US FinCEN
  assessed its first-ever civil money penalty against an individual
  peer-to-peer convertible-virtual-currency exchanger (Eric Powers)
  for willful Bank Secrecy Act registration, AML-program, and CTR/SAR
  reporting violations, AND imposed an industry bar prohibiting him from any
  money-services-business activity. The industry bar is the operative
  censorship action: a state-mandated termination of a legitimate (if
  unlicensed) crypto off-ramp operator's service — in scope under §9 (federal
  enforcement that shuts a legitimate operator; sibling to the Liberty Reserve
  unlicensed-MSB takedown). Powers was exchanging legitimate bitcoin, not
  running a fraud scheme, so this is NOT a §9-excluded scam prosecution.
  Single observed_change layer (offramp_cex P2P conversion surface) ->
  empirical_shape comparison, admission_tier empirical_case. attribution=direct:
  the FinCEN assessment names the target and the bar is the operative
  instrument. asset_onchain not_applicable (no on-chain freeze instrument; the
  bar is an administrative restriction, no tx_hash exists). Sources verified
  via WebSearch 2026-05-31; real FinCEN news-release page captured + body_hash-
  pinned (claims "Eric Powers", "Peer-to-Peer", "exchanger", "industry bar"
  grep-confirmed; no fabrication).

