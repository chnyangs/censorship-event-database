signapp.com",firebaseApiKey:"AIzaSyDtGBC8qbNKQ_ibWHZSJmaNfjbOhs7pj5g",firebaseProjectId:"studio-7e371",firebaseAuthDomain:"studio-7e371.firebaseapp.com",firebaseDatabaseURL:"https://studio-7e371.firebaseio.com",firebaseStorageBucket:"studio-7e371.appspot.com",firebaseMessagingSenderId:"373326844567",firebaseAppId:"1:373326844567:web:9d1c205102ce520ce84fd2",studioDomain:".studio.site",studioPublishUrl:"https://storage.googleapis.com/studio-publish",studioPublishIndexUrl:"https://storage.googleapis.com/studio-publish-index",rssApiPath:"https://rss.studiodesignapp.com/rssConverter",embedSandboxDomain:".studioiframesandbox.com",apiProxyUrl:"https://studio-api-proxy-rajzgb4wwq-an.a.run.app",proxyApiBaseUrl:"https://api.studiodesignapp.com/data_proxy_api",isDev:false,fontsApiBaseUrl:"https://fonts.studio.design",selfHostedFontsBaseUrl:"https://fonts.studio.design/ts",studioFrontUrl:"https://app.studio.design",jwtCookieName:"jwt_token",chillnnCdnUrl:"https://cdn.chillnn.com"},app:{baseURL:"/",buildId:"a32c1a1f-06ac-481f-9013-0b83b3ee409f",buildAssetsDir:"/_nuxt/",cdnURL:""}}</script><script type="application/json" data-nuxt-data="nuxt-app" data-ssr="true" id="__NUXT_DATA__">[["ShallowReactive",1],{"data":2,"state":57,"once":59,"_errors":60,"serverRendered":62,"path":63,"pinia":64},["ShallowReactive",3],{"dynamicDatapress\u002Fc2V4EIij":4},{"title":5,"body":6,"n_IELh8U":7,"aCuBR2oU":25,"slug":41,"_meta":42,"_filter":53,"id":56},"業務改善命令に係る報告書提出のご報告","\u003Cp data-uid=\"7P8QaoO1\" data-time=\"1633087202942\">本日、コインチェック株式会社は、このほど発生した不正アクセスによる仮想通貨NEMの不正送金に関連して金融庁より受けております業務改善命令に係る報告書を提出いたしましたことをご報告いたします。\u003C\u002Fp>\u003Cp data-uid=\"hShJBRSW\" data-time=\"1633087210927\">\u003C\u002Fp>\u003Cp data-uid=\"qJJtWZEO\" data-time=\"1633087202942\">報告内容は、業務改善命令において指摘されておりました、(1)本事案の事実関係及び原因の究明 、(2)顧客への適切な対応、(3)システム管理態勢にかかる経営管理態勢の強化及び責任の所在の明確化、(4)実効性あるシステムリスク管理態勢の構築及び再発防止策の策定、などについてとなります。\u003C\u002Fp>\u003Cp data-uid=\"qLRwhRj3\" data-time=\"1633087216971\">\u003C\u002Fp>\u003Cp data-uid=\"nURwaaTw\" data-time=\"1633087202943\">弊社といたしましては、引き続き着実に改善策を実施してまいります。また、１日も早く補償金のお支払いやお預かりしている仮想通貨の送金をすることができるようシステムの安全性の確認を進めております。\u003C\u002Fp>\u003Cp data-uid=\"ZTStS23I\" data-time=\"1633087221879\">\u003C\u002Fp>\u003Cp data-uid=\"Eh89QzW9\" data-time=\"1633087202943\">改めまして、お客様をはじめとする関係者の皆様に、多大なご迷惑、ご心配をおかけしましたことを心よりお詫び申し上げます。今後、策定する改善策を着実に実施することにより、お客様の信頼回復に向け、最善の努力をしてまいります。\u003C\u002Fp>\u003Cp data-uid=\"gms6N1R2\" data-time=\"1633087239591\">\u003C\u002Fp>\u003Cp data-uid=\"MygrKHfB\" data-time=\"1633087241849\">\u003C\u002Fp>\u003Cp data-uid=\"t4uLdVPn\" data-time=\"1633087253239\">Delivery of Report per Requirements of Order to Improve Business Operations&nbsp;\u003Cbr>\u003Cbr>2\u002F13\u002F2018\u003Cbr>\u003C\u002Fp>\u003Cp data-uid=\"x9nOGaCt\" data-time=\"1633087202943\">This release is to announce the delivery of our report to the Financial Services Agency per the requirements of the Order to Improve Business Operations we received following the illicit transfer of the cryptocurrency NEM from our platform.&nbsp;\u003Cbr>\u003Cbr>The content of the report deals the terms of the order including 1) Investigating the facts and causes surrounding this case, 2) Proper support of our customers, 3) Strengthening of current measures to manage system risk, 4) Creation of new measures for system risk management and prevention of similar events in the future in addition to making it clear where responsibility lies for different risks.&nbsp;\u003Cbr>\u003Cbr>Beginning with the points mentioned in the FSA's improvement order, we plan to continue making meaningful improvements to our system. In addition, we are continuing to confirm and improve the security of our systems in order to resume transfers of other cryptocurrencies and begin reparation payments as soon as possible.\u2028\u2028&nbsp;\u003Cbr>\u003Cbr>Finally, we would like to apologize once again to our customers and to all of those who have been affected by this incident. We promise to continue working tirelessly to regain your trust through meaningful and tangible improvements to our services and platform.\u003C\u002Fp>",{"PmAB2Ngt":8,"title":9,"slug":8,"_meta":10,"_filter":23,"id":24},"2018","2018年",{"project":11,"publishedAt":13,"createdAt":14,"order":15,"publishType":16,"schema":17,"uid":21,"updatedAt":22},{"id":12},"9tW0LufGN7NFYxx7iLAD",["Date","2021-09-29T05:53:29.000Z"],["Date","2021-09-29T05:53:19.000Z"],3,"change",{"id":18,"key":19,"postType":20},"6YtW0vhn4r10tLlwwkw0","RSpw_8Me","blank","5pWe1Eti",["Date","2025-03-14T05:36:46.000Z"],[],"dLVm8uDC9vsvfRGjXihY",{"title":26,"lBhr53aR":27,"slug":28,"_meta":29,"_filter":39,"id":40},"コーポレート","Corporate","corporate",{"project":30,"publishedAt":31,"createdAt":32,"order":33,"publishType":16,"schema":34,"uid":37,"updatedAt":38},{"id":12},["Date","2021-10-22T11:38:50.000Z"],["Date","2021-10-22T11:38:38.000Z"],-2,{"id":35,"key":36,"postType":20},"0RTKxGDS4Qv8jOZfBpZm","uGs9N39F","6EM8Idjm",["Date","2022-10-26T14:35:35.000Z"],[],"CGkBDxEloye1jqmtnA52","c2V4EIij",{"project":43,"publishedAt":44,"createdAt":45,"order":46,"publishType":16,"schema":47,"uid":51,"updatedAt":52},{"id":12},["Date","2018-02-13T01:00:00.000Z"],["Date","2021-10-01T11:19:55.000Z"],182,{"id":48,"key":49,"postType":50},"E7b63Y88jq7JILTvc9IC","fWM8zI8O","post","ORBC_XPi",["Date","2021-10-22T12:16:39.000Z"],[54,55],"n_IELh8U:5pWe1Eti","aCuBR2oU:6EM8Idjm","CiDcewGMUTWVUQzWCkWN",["Reactive",58],{},["Set"],["ShallowReactive",61],{"dynamicDatapress\u002Fc2V4EIij":-1},true,"\u002Fpress\u002Fc2V4EIij",["Reactive",65],{"cmsContentStore":66,"indexStore":70,"projectStore":73,"productStore":98,"pageHeadStore":786,"cmsStore":790},{"listContentsMap":67,"contentMap":68},["Map"],["Map",69,4],"fWM8zI8O\u002Fc2V4EIij",{"routeType":71,"host":72},"publish","corporate.coincheck.com",{"project":74},{"id":75,"name":76,"customDomain":77,"iconImage":77,"coverImage":78,"displayBadge":79,"integrations":80,"snapshot_path":96,"snapshot_id":97,"recaptchaSiteKey":-1, 324},"Coincheck for Businessは、アプリDL数国内No.１であるCoincheckの顧客基盤を活かし、トークン・NFT販売からUX向上までweb3ビジネスを幅広く支援するサービスです。","https:\u002F\u002Fstorage.googleapis.com\u002Fproduction-os-assets\u002Fassets\u002Ff5cbe513-772a-4ae0-b8e8-707fc6625b05","Coincheck for business｜コインチェック株式会社","partners\u002Fcontact",{"x":187,"y":187},"a5746fa6-9060-4973-a3d5-a576009222a9",[192],{"head":331,"id":364,"type":188,"uuid":365,"symbolIds":366},{"customCode":332,"meta":361,"title":363},{"bodyEnd":333,"headEnd":342},[334,338],{"memo":335,"src":336,"uuid":337},"採用共通JS","\u003Cscript>\n\u002F\u002F ==============================\n\u002F\u002F SPA対応：__nuxt監視で要素が現れたら1回だけ実行\n\u002F\u002F ==============================\n\nfunction initOnReady(tryInit) {\n  if (tryInit()) return;\n\n  const nuxt = document.getElementById(\"__nuxt\");\n  if (nuxt) {\n    const observer = new MutationObserver(() => {\n      if (tryInit()) observer.disconnect();\n    });\n    observer.observe(nuxt, { childList: true, subtree: true });\n  }\n}\n\n\u002F\u002F ==============================\n\u002F\u002F グラデマスクアニメ\n\u002F\u002F ==============================\n\nconst revealedElements = new WeakSet();\n\nfunction detectDirectionFromId(id) {\n  if (id.includes(\"-ltr\")) return \"rtl\";\n  return \"ltr\";\n}\n\nfunction revealWithMask(target) {\n  const el = typeof target === \"string\" ? document.querySelector(target) : target instanceof Element ? target : null;\n\n  if (!el || revealedElements.has(el)) return;\n\n  const id = el.id || \"\";\n  const direction = detectDirectionFromId(id);\n  const isLTR = direction === \"ltr\";\n\n  \u002F\u002F ✅ マスクグラデーションの向き（透明→黒で「徐々に表示」）\n  const gradient = isLTR ? \"linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 46%, rgba(0,0,0,1) 54%, rgba(0,0,0,1) 100%)\" : \"linear-gradient(to left, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 46%, rgba(0,0,0,1) 54%, rgba(0,0,0,1) 100%)\";\n\n  el.style.maskImage = gradient;\n  el.style.webkitMaskImage = gradient;\n\n  \u002F\u002F ✅ 初期は mask-position: 0%（透明な部分で完全に覆われる）\n  \u002F\u002F ✅ アニメーションで 100% に動くことで、黒（表示部分）がスライドして見える\n  el.style.setProperty(\"--mask-from\", \"0%\");\n  el.style.setProperty(\"--mask-to\", \"100%\");\n\n  if (!isLTR) {\n    el.style.setProperty(\"--mask-from\", \"100%\");\n    el.style.setProperty(\"--mask-to\", \"0%\");\n  }\n\n  el.classList.add(\"revealed\");\n  revealedElements.add(el);\n}\n\nfunction setupGradientMaskObserver() {\n  const elements = document.querySelectorAll('[id^=\"gradient-reveal\"][id$=\"-auto\"]');\n\n  const observer = new IntersectionObserver(\n    (entries) => {\n      entries.forEach((entry) => {\n        if (entry.isIntersecting) {\n          revealWithMask(entry.target);\n          observer.unobserve(entry.target);\n        }\n      });\n    },\n    { threshold: 0.3 },\n  );\n\n  elements.forEach((el) => {\n    if (!revealedElements.has(el)) {\n      observer.observe(el);\n    }\n  });\n}\n\n\u002F\u002F ==============================\n\u002F\u002F スポットライトマスク\n\u002F\u002F ==============================\n\n\u002F\u002F ==============================\n\u002F\u002F テキストカラーウェーブアニメーション\n\u002F\u002F ==============================\n\nfunction setupTextColorWave(selector, options) {\n  const defaults = {\n    charDelay: 40,\n    pause: 300,\n    highlightColor: \"#0ad0a8\",\n    rootMargin: \"0px 0px -40% 0px\",\n  };\n  const opts = Object.assign({}, defaults, options);\n\n  const elements = document.querySelectorAll(selector);\n  if (elements.length === 0) return;\n\n  const observer = new IntersectionObserver(\n    (entries) => {\n      entries.forEach((entry) => {\n        if (!entry.isIntersecting || entry.target._colorWaveStarted) return;\n        entry.target._colorWaveStarted = true;\n\n        const chars = entry.target._chars;\n        const originalColor = entry.target._originalColor;\n\n        chars.forEach((ch, i) => {\n          setTimeout(() => {\n            ch.style.color = opts.highlightColor;\n          }, i * opts.charDelay);\n        });\n\n        const totalHighlight = chars.length * opts.charDelay;\n        chars.forEach((ch, i) => {\n          setTimeout(\n            () => {\n              ch.style.color = originalColor;\n            },\n            totalHighlight + opts.pause + i * opts.charDelay,\n          );\n        });\n      });\n    },\n    { rootMargin: opts.rootMargin },\n  );\n\n  elements.forEach((el) => {\n    if (el._colorWaveReady) return;\n    const span = el.querySelector(\"span\");\n    if (!span || !span.textContent.trim()) return;\n\n    el._colorWaveReady = true;\n    const text = span.textContent;\n    span.innerHTML = [...text].map((ch) => `\u003Cspan style=\"all: inherit; transition: color 0.3s ease\">${ch}\u003C\u002Fspan>`).join(\"\");\n\n    el._chars = [...span.querySelectorAll(\"span\")];\n    el._originalColor = getComputedStyle(span).color;\n\n    observer.observe(el);\n  });\n}\n\n\u002F\u002F ==============================\n\u002F\u002F グローバル公開（Studio IIFE対応）\n\u002F\u002F ==============================\n\nwindow.initOnReady = initOnReady;\nwindow.setupGradientMaskObserver = setupGradientMaskObserver;\nwindow.revealWithMask = revealWithMask;\nwindow.setupTextColorWave = setupTextColorWave;\n\n\u002F\u002F ==============================\n\u002F\u002F 実行\n\u002F\u002F ==============================\n\ninitOnReady(() => {\n  setupTextColorWave('[id*=\"h2_anime\"]');\n  return false; \u002F\u002F SPA遷移ごとに再実行するため常に監視を継続\n});\n\n\u003C\u002Fscript>","2d34f4fd-8f3a-4a55-b19f-d89103378fe7",{"memo":339,"src":340,"uuid":341},"個別JS","\u003Cscript>\n\u002F\u002F ─── 回転アニメーション ─────────────────────\nwindow.initOnReady(() => {\n  const container = document.getElementById(\"anime-rotation\");\n  if (!container) return false;\n\n  const boxes = [...container.children];\n  if (boxes.length \u003C 4) return false;\n\n  const innerBoxes = boxes.map((b) => b.firstElementChild).filter(Boolean);\n  if (innerBoxes.length \u003C 4) return false;\n\n  \u002F\u002F ─── 設定 ──────────────────────────────────\n  const CYCLE = 15000;\n  const MOVE_FRAC = 0.1;\n  const HOLD_FRAC = 0.25 - MOVE_FRAC; \u002F\u002F 4ステップで1周: (HOLD+MOVE)*4=1\n  const DELAYS = [0, 50, 100, 150]; \u002F\u002F 移動の微小ずれ（ms）\n  const SQUISH = 0.05; \u002F\u002F 移動時の縮み量（1 = 100%）\n  \u002F\u002F 時計回り順（左上→右上→右下→左下）で縮みカーブをずらすシフト量\n  const SQUISH_SHIFT = [0, 1, 3, 2].map((rank) => rank * 0.06);\n\n  \u002F\u002F ─── 時計回りのパス ──────────────────────────\n  \u002F\u002F   [0,0] [1,0]\n  \u002F\u002F   [0,1] [1,1]\n  \u002F\u002F HTML順序: 左上 → 右上 → 左下 → 右下\n  const PATHS = [\n    [\n      [0, 0],\n      [1, 0],\n      [1, 1],\n      [0, 1],\n    ], \u002F\u002F 左上\n    [\n      [1, 0],\n      [1, 1],\n      [0, 1],\n      [0, 0],\n    ], \u002F\u002F 右上\n    [\n      [0, 1],\n      [0, 0],\n      [1, 0],\n      [1, 1],\n    ], \u002F\u002F 左下\n    [\n      [1, 1],\n      [0, 1],\n      [0, 0],\n      [1, 0],\n    ], \u002F\u002F 右下\n  ];\n\n  \u002F\u002F Studio の * { transition } グローバルCSS を無効化\n  innerBoxes.forEach((b) => b.style.setProperty(\"transition\", \"none\", \"important\"));\n\n  let SIZE = 0;\n  let GAP = 30;\n  let startTime = performance.now();\n\n  function easeOutCubic(t) {\n    return 1 - Math.pow(1 - t, 3);\n  }\n\n  function calcAndApply() {\n    const parentW = container.offsetWidth;\n    if (parentW \u003C= 0) return;\n\n    GAP = parseInt(getComputedStyle(container).getPropertyValue(\"--gap\")) || 30;\n    SIZE = Math.max(40, Math.floor((parentW - GAP) \u002F 2));\n    container.style.height = SIZE * 2 + GAP + \"px\";\n\n    boxes.forEach((b) => {\n      b.style.width = SIZE + \"px\";\n      b.style.height = SIZE + \"px\";\n    });\n  }\n\n  function gridPos(col, row) {\n    return {\n      x: col * (SIZE + GAP),\n      y: row * (SIZE + GAP),\n    };\n  }\n\n  function updateBoxes(now) {\n    if (SIZE === 0) return;\n\n    innerBoxes.forEach((innerBox, i) => {\n      const path = PATHS[i];\n      const delay = DELAYS[i];\n\n      let t = (now - startTime - delay) % CYCLE;\n      if (t \u003C 0) t += CYCLE;\n\n      const holdMs = CYCLE * HOLD_FRAC;\n      const moveMs = CYCLE * MOVE_FRAC;\n      const stepMs = holdMs + moveMs;\n\n      let step = Math.floor(t \u002F stepMs);\n      let stepTime = t - step * stepMs;\n      if (step >= 4) {\n        step = 0;\n        stepTime = 0;\n      }\n\n      const from = path[step];\n      const to = path[(step + 1) % 4];\n      const posA = gridPos(from[0], from[1]);\n      const posB = gridPos(to[0], to[1]);\n\n      let x, y, scale;\n      if (stepTime \u003C= holdMs) {\n        x = posA.x;\n        y = posA.y;\n        scale = 1;\n      } else {\n        const progress = Math.min((stepTime - holdMs) \u002F moveMs, 1);\n        const e = easeOutCubic(progress);\n        x = posA.x + (posB.x - posA.x) * e;\n        y = posA.y + (posB.y - posA.y) * e;\n        \u002F\u002F smoothstep で縮み → 耐え → 戻る（時計回り順にカーブをシフト）\n        const ss = (a, b, x) => {\n          const t = Math.max(0, Math.min(1, (x - a) \u002F (b - a)));\n          return t * t * (3 - 2 * t);\n        };\n        const s = SQUISH_SHIFT[i];\n        const shrink = ss(s, 0.2 + s, progress) * (1 - ss(0.5 + s, 0.95, progress)) * (1 + progress * 0.2);\n        scale = 1 - SQUISH * shrink;\n      }\n\n      innerBox.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;\n    });\n  }\n\n  function animate(now) {\n    updateBoxes(now);\n    requestAnimationFrame(animate);\n  }\n\n  calcAndApply();\n  new ResizeObserver(calcAndApply).observe(container);\n\n  \u002F\u002F ─── 初期状態：方向別オフセット＋非表示 ──────\n  const FADE_OFFSET = 60;\n  const FADE_DURATION = 500;\n  const FADE_STAGGER = 120;\n\n  requestAnimationFrame(() => {\n    if (SIZE === 0) return;\n\n    innerBoxes.forEach((innerBox, i) => {\n      const path = PATHS[i];\n      const startPos = path[0];\n      const gridX = startPos[0] * (SIZE + GAP);\n      const gridY = startPos[1] * (SIZE + GAP);\n\n      let offsetX = 0,\n        offsetY = 0;\n      if (i === 0) offsetX = -FADE_OFFSET; \u002F\u002F 左上：左から\n      if (i === 1) offsetY = -FADE_OFFSET; \u002F\u002F 右上：上から\n      if (i === 2) offsetY = FADE_OFFSET; \u002F\u002F 左下：下から\n      if (i === 3) offsetX = FADE_OFFSET; \u002F\u002F 右下：右から\n\n      innerBox.style.setProperty(\"opacity\", \"0\", \"important\");\n      innerBox.style.setProperty(\"transform\", `translate3d(${gridX + offsetX}px, ${gridY + offsetY}px, 0)`, \"important\");\n    });\n  });\n\n  \u002F\u002F ─── 画面表示時：フェードイン → 回転開始 ───\n  new IntersectionObserver(\n    (entries) => {\n      entries.forEach((entry) => {\n        if (!entry.isIntersecting) return;\n        if (!entry.target._fadeInStarted) {\n          innerBoxes.forEach((innerBox, i) => {\n            const path = PATHS[i];\n            const startPos = path[0];\n            const gridX = startPos[0] * (SIZE + GAP);\n            const gridY = startPos[1] * (SIZE + GAP);\n\n            setTimeout(() => {\n              innerBox.style.setProperty(\"transition\", `opacity ${FADE_DURATION}ms ease, transform ${FADE_DURATION}ms ease`, \"important\");\n              innerBox.style.setProperty(\"opacity\", \"1\", \"important\");\n              innerBox.style.setProperty(\"transform\", `translate3d(${gridX}px, ${gridY}px, 0)`, \"important\");\n            }, i * FADE_STAGGER);\n          });\n\n          const totalFadeTime = (innerBoxes.length - 1) * FADE_STAGGER + FADE_DURATION;\n          setTimeout(() => {\n            innerBoxes.forEach((innerBox) => innerBox.style.setProperty(\"transition\", \"none\", \"important\"));\n            startTime = performance.now();\n            requestAnimationFrame(animate);\n          }, totalFadeTime + 0);\n\n          entry.target._fadeInStarted = true;\n        }\n      });\n    },\n    { threshold: 0.2 },\n  ).observe(container);\n\n  return true;\n});\n\n\u002F\u002F ─── メンバースライダー ──────────────────────\nwindow.initOnReady(() => {\n  const listEl = document.getElementById(\"list-member\");\n  if (!listEl) return false;\n\n  const items = [...listEl.children];\n  const total = items.length;\n  if (total \u003C 2) return false;\n\n  let current = 0;\n  let autoTimer = null;\n  let fadeTimer = null;\n  const INTERVAL = 6000;\n  const FADE_MS = 500;\n  const TRANSITION = `opacity ${FADE_MS \u002F 1000}s ease-in-out`;\n\n  \u002F\u002F ─── グリッドオーバレイ（アイテム重ね） ────\n  listEl.style.setProperty(\"display\", \"grid\", \"important\");\n  listEl.style.setProperty(\"overflow\", \"hidden\", \"important\");\n\n  \u002F\u002F ─── ドット自動生成 ─────────────────────────\n  const dotContainer = document.getElementById(\"list-member-dot\");\n  if (dotContainer) {\n    dotContainer.innerHTML = \"\";\n    items.forEach((_, i) => {\n      const div = document.createElement(\"div\");\n      const span = document.createElement(\"span\");\n      span.classList.add(\"font-en\");\n      span.textContent = String(i + 1).padStart(2, \"0\");\n      div.appendChild(span);\n      dotContainer.appendChild(div);\n    });\n  }\n  const dots = dotContainer ? [...dotContainer.children] : [];\n\n  \u002F\u002F ─── 初期状態 ───────────────────────────────\n  items.forEach((item, i) => {\n    item.style.setProperty(\"grid-area\", \"1 \u002F 1\", \"important\");\n    item.style.setProperty(\"transition\", \"none\", \"important\");\n    item.style.setProperty(\"opacity\", i === 0 ? \"1\" : \"0\", \"important\");\n    item.style.setProperty(\"pointer-events\", i === 0 ? \"auto\" : \"none\", \"important\");\n    item.style.setProperty(\"z-index\", i === 0 ? \"1\" : \"0\", \"important\");\n  });\n  dots.forEach((dot, i) => dot.classList.toggle(\"active\", i === 0));\n\n  \u002F\u002F ─── フェード切り替え（アウト完了 → イン） ──\n  function goTo(index) {\n    if (index === current) return;\n    if (fadeTimer) clearTimeout(fadeTimer);\n\n    const prev = current;\n    current = index;\n\n    items[current].style.setProperty(\"transition\", \"none\", \"important\");\n    items[current].style.setProperty(\"opacity\", \"0\", \"important\");\n    items[current].style.s
