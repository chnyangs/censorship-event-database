function removeLang(url){
 url = url.split('?');
 var option = "";
  if(url.length > 1){
   var raw_url =  url[0];
   var query_string = url[1];
   query_string = query_string.split('&');
   
    $.each(query_string, function( index, value ) {

      if(value.toLowerCase() != 'lang=th' && value.toLowerCase() != 'lang=en'){
       if(index == 0){
        option += '?'+value;
       }else{
        option += '&'+value;
       }
      }
    }); 
   url = raw_url+option;
  }
 return url;
}
