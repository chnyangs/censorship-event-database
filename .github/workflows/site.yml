name: Render and deploy site

# Publishes the rendered static site to this repo's own GitHub Pages.
# Requires (one-time):
#   - Repo is public (free plan) OR the account has GitHub Pro (private Pages).
#   - Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'events/**'
      - 'schema/**'
      - 'scripts/render_site.py'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyyaml jsonschema
      - name: Validate events
        run: python3 scripts/validate.py
      - name: Render site
        run: python3 scripts/render_site.py
      - name: Disable Jekyll on Pages
        run: touch site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
