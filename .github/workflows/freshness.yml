name: Freshness (link rot + archive check)

on:
  schedule:
    # Every Monday at 07:00 UTC. Cheap enough to run weekly; rotates findings
    # into a single issue instead of spamming.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Freshness check (non-blocking, captures output)
        id: freshness
        run: |
          set +e
          python3 scripts/freshness_check.py --timeout 30 > freshness.log 2>&1
          EXIT=$?
          set -e
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          grep -c '^\[WARN\]' freshness.log > warn.count || echo 0 > warn.count
          grep -c '^\[FAIL\]' freshness.log > fail.count || echo 0 > fail.count
          echo "warn_count=$(cat warn.count)" >> "$GITHUB_OUTPUT"
          echo "fail_count=$(cat fail.count)" >> "$GITHUB_OUTPUT"
      - name: Verify citation archival anchors
        run: python3 scripts/verify_citations.py --timeout 30 || true
      - name: Upload freshness log
        uses: actions/upload-artifact@v4
        with:
          name: freshness-log
          path: freshness.log
          retention-days: 30
      - name: Open / refresh tracking issue on rot
        if: steps.freshness.outputs.fail_count != '0' || steps.freshness.outputs.warn_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = [
              '## Weekly freshness check',
              '',
              `- warnings: ${{ steps.freshness.outputs.warn_count }}`,
              `- failures: ${{ steps.freshness.outputs.fail_count }}`,
              '',
              'See the `freshness-log` workflow artifact for the full report.',
              '',
              '```',
              fs.readFileSync('freshness.log', 'utf8').split('\n').slice(0, 80).join('\n'),
              '```',
            ].join('\n');
            const title = 'Link rot detected (weekly freshness check)';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'freshness',
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['freshness'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body,
              });
            }
